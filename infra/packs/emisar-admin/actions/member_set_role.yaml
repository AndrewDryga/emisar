schema_version: 1
id: emisar.admin.member.set_role
title: Set account member role
kind: script
risk: high
description: Change a member's role with explicit access on Owner demotion. Choose directory to return an Owner's role and access to directory sync.
side_effects: [Changes permissions and access; revokes credentials on role reduction.]
args:
  - name: account
    type: string
    required: true
    description: Exact account UUID or slug.
    validation: {max_length: 128}
  - name: member
    type: string
    required: true
    description: Exact membership UUID or member email.
    validation: {max_length: 320}
  - name: role
    type: string
    required: true
    description: New account role, or directory to return an Owner to directory-managed role and access.
    validation: {enum: [owner, admin, billing_manager, operator, viewer, directory]}
  - name: runner_access
    type: string
    required: false
    description: Required when demoting a locally managed Owner; all grants all runners and packs, none grants neither. Use Team for selected access.
    validation: {enum: [all, none]}
execution:
  script: {path: scripts/callback.sh, interpreter: /bin/sh}
  argv:
    - "emisar.admin.member.set_role"
    - "account={{ args.account }}"
    - "member={{ args.member }}"
    - "role={{ args.role }}"
    - "runner_access={{ args.runner_access? }}"
  timeout: 60s
output: {parser: json, parser_required: true, max_stdout_bytes: 65536, max_stderr_bytes: 8192}
