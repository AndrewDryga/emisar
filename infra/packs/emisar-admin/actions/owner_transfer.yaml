schema_version: 1
id: emisar.admin.owner.transfer
title: Transfer account ownership
kind: script
risk: high
description: Promote a new Owner and optionally demote a previous Owner to Admin with explicit access, or return them to directory sync.
side_effects: [Changes owner-level permissions and access; revokes credentials on demotion; preserves the last-owner guard.]
args:
  - name: account
    type: string
    required: true
    description: Exact account UUID or slug.
    validation: {max_length: 128}
  - name: new_owner
    type: string
    required: true
    description: Exact membership UUID or member email to promote.
    validation: {max_length: 320}
  - name: previous_owner
    type: string
    required: false
    description: Exact membership UUID or member email to demote after promotion.
    validation: {max_length: 320}
  - name: previous_owner_access
    type: string
    required: false
    description: Required with previous_owner. Choose all runners and packs, none, or directory-managed role and access.
    validation: {enum: [all, none, directory]}
execution:
  script: {path: scripts/callback.sh, interpreter: /bin/sh}
  argv:
    - "emisar.admin.owner.transfer"
    - "account={{ args.account }}"
    - "new_owner={{ args.new_owner }}"
    - "previous_owner={{ args.previous_owner? }}"
    - "previous_owner_access={{ args.previous_owner_access? }}"
  timeout: 60s
output: {parser: json, parser_required: true, max_stdout_bytes: 65536, max_stderr_bytes: 8192}
