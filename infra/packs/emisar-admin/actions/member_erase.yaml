schema_version: 1
id: emisar.admin.member.erase
title: Permanently erase member
kind: script
risk: critical
description: Permanently delete one workspace member, or the workspace it solely owns, after exact UUID confirmation.
side_effects:
  - Irreversibly deletes the member and its sessions; when it is the workspace's sole owner, the whole workspace goes with it.
  - Cannot be undone; use only for a verified erasure request with two-person approval.
args:
  - name: account
    type: string
    required: true
    description: Exact account UUID or slug the member belongs to.
    validation: {max_length: 128}
  - name: member
    type: string
    required: true
    description: Exact membership UUID to erase.
    validation: {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", max_length: 36}
  - name: confirmation
    type: string
    required: true
    description: Repeat the exact membership UUID.
    validation: {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", max_length: 36}
  - name: reason
    type: string
    required: true
    description: Verified erasure request and approval reference.
    validation: {max_length: 500}
execution:
  script: {path: scripts/callback.sh, interpreter: /bin/sh}
  argv:
    - "emisar.admin.member.erase"
    - "account={{ args.account }}"
    - "member={{ args.member }}"
    - "confirmation={{ args.confirmation }}"
    - "reason={{ args.reason }}"
  timeout: 2m
output: {parser: json, parser_required: true, max_stdout_bytes: 65536, max_stderr_bytes: 8192}
