schema_version: 1

runner:
  group: emisar-admin
  labels:
    purpose: emisar-admin
    environment: production

cloud:
  url: "https://${domain}"
  enrollment_key_env: EMISAR_ENROLLMENT_KEY

paths:
  data_dir: /var/lib/emisar-admin-runner/data
  packs:
    - /var/lib/emisar-admin-runner/packs

execution:
  inherit_env:
    - TFE_TOKEN

admission:
  allow:
    - "emisar.admin.*"
    - "linux.*"
    - "debugging.*"
    - "systemd.*"
    - "cloud-init.*"
    - "docker.*"
    - "fw.*"
    - "nic.*"
    - "time.*"
    - "beam.*"
    - "gcp.*"
    - "tfc.*"
  max_risk: critical

events:
  jsonl_path: /var/lib/emisar-admin-runner/log/events.jsonl
