schema_version: 1

runner:
  group: emisar-admin
  labels:
    purpose: emisar-admin
    environment: production

cloud:
  url: "https://${domain}"
  enrollment_key_env: EMISAR_ENROLLMENT_KEY

paths:
  data_dir: /var/lib/emisar-admin-runner/data
  packs:
    - /var/lib/emisar-admin-runner/packs

execution:
  inherit_env:
    - TFE_TOKEN
    - SENTRY_AUTH_TOKEN
    - SENTRY_URL

admission:
  allow:
    - "emisar.admin.*"
    - "linux.*"
    - "debugging.*"
    - "systemd.*"
    - "cloud-init.*"
    - "docker.*"
    - "nic.*"
    - "time.*"
    - "beam.*"
    - "gcp.*"
    - "tfc.*"
    - "sentry.*"
  # This runner is root and colocated with the portal, so an admitted action
  # that prints a process environment or a container's env returns THIS host's
  # secrets: SECRET_KEY_BASE, RELEASE_COOKIE, PADDLE_API_KEY,
  # POSTMARK_API_TOKEN — and, from the runner's own /proc,
  # EMISAR_ENROLLMENT_KEY, TFE_TOKEN, and SENTRY_AUTH_TOKEN. The runner
  # deliberately refuses to put the enrollment key in inherit_env for exactly
  # that reason
  # (internal/config/config.go), and these read straight around it. The glob
  # allows above are broad on purpose; this list is the narrow subtraction.
  deny:
    - "debugging.pid_environ"
    - "docker.inspect"
  max_risk: critical

events:
  jsonl_path: /var/lib/emisar-admin-runner/log/events.jsonl
