name: Release - MCP Bridge

run-name: Release ${{ github.ref_name }}

# The tag-selected workflow is deliberately only a trigger. The reusable
# workflow owns the release policy and every authority-bearing job. This local
# reference is the extraction step; the hardening change pins it to the exact
# prerequisite commit once that SHA exists.

on:
  push:
    tags:
      - "mcp-v*.*.*"

concurrency:
  group: mcp-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Trusted MCP bridge release
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/mcp-release-trusted.yml
