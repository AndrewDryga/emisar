name: Release - Runner

run-name: Release ${{ github.ref_name }}

# The tag-selected workflow is deliberately only a trigger. The reusable
# workflow owns the release policy and every authority-bearing job. The full
# commit SHA is also the GCP `job_workflow_sha` trust anchor; rotate the workflow
# and federation condition together in a later reviewed change.

on:
  push:
    tags:
      - "runner-v*.*.*"

concurrency:
  group: runner-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Trusted runner release
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      packages: write
    uses: AndrewDryga/emisar/.github/workflows/runner-release-trusted.yml@1a2a47c132d148cf4e837634650839d582003d1e
