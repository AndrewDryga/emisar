name: Portal - Plan no-overlap recovery

# This workflow exists for the exceptional pre-v1 directory-group migration.
# The normal main CD path remains rolling and deliberately withholds its plan
# while that migration is pending. Recovery planning starts only after the old
# MIG is empty, runs outside that fleet, and still stops at HCP's manual apply.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-plan:
    name: Plan empty-fleet recovery
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portal-production-recovery-plan
      cancel-in-progress: false
    environment:
      name: portal-production-plan
    env:
      TF_CLOUD_ORGANIZATION: Dryga
      TFC_WORKSPACE: emisar
      PORTAL_IMAGE: ghcr.io/andrewdryga/emisar
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require current main and its exact published image
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$current_sha" = "$GITHUB_SHA" || {
            echo "::error::Recovery must run from current main (${current_sha}), not ${GITHUB_SHA}"
            exit 1
          }

          manifest=$(docker buildx imagetools inspect "${PORTAL_IMAGE}:latest" --format '{{json .Manifest}}')
          digest=$(jq -er .digest <<< "$manifest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Current portal image returned an invalid digest"
            exit 1
          }
          labels=$(docker buildx imagetools inspect "${PORTAL_IMAGE}@${digest}" --format '{{json .Image.Config.Labels}}')
          revision=$(jq -er '."org.opencontainers.image.revision"' <<< "$labels")
          test "$revision" = "$GITHUB_SHA" || {
            echo "::error::Published latest image revision ${revision} does not match current main ${GITHUB_SHA}"
            exit 1
          }

          image="${PORTAL_IMAGE}@${digest}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Require the reviewed pack catalog to be live
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 \
            https://registry.emisar.dev/v1/catalog.json -o /tmp/live-catalog.json
          cmp portal/apps/emisar/priv/packs/catalog.json /tmp/live-catalog.json || {
            echo "::error::The live pack registry does not match current main; finish or reject that separate release before recovering the Portal"
            exit 1
          }

      - name: Require the old serving fleet to be drained
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            https://emisar.dev/healthz -o /tmp/live-health.json; then
            echo "::error::Portal still serves /healthz; drain the old MIG before creating the recovery plan"
            exit 1
          fi

      - name: Verify HCP workspace
        id: workspace
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
        run: |
          set -euo pipefail
          api=https://app.terraform.io/api/v2
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}" -H "Content-Type: application/vnd.api+json")
          workspace=$(curl -fsS "${auth[@]}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TFC_WORKSPACE}")
          workspace_id=$(jq -er '.data.id' <<< "$workspace")
          test "$(jq -r '.data.attributes["auto-apply"]' <<< "$workspace")" = false || {
            echo "::error::HCP Terraform workspace auto-apply must remain disabled"
            exit 1
          }
          expected_terraform=$(awk '$1 == "terraform" {print $2}' .tool-versions)
          workspace_terraform=$(jq -r '.data.attributes["terraform-version"]' <<< "$workspace")
          test "$workspace_terraform" = "$expected_terraform" || {
            echo "::error::HCP workspace Terraform ${workspace_terraform} does not match tested ${expected_terraform}"
            exit 1
          }
          echo "workspace_id=${workspace_id}" >> "$GITHUB_OUTPUT"

      - name: Recheck current main before uploading production configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$current_sha" = "$GITHUB_SHA" || {
            echo "::error::Main advanced to ${current_sha}; restart recovery from that tested image"
            exit 1
          }

      - name: Upload provisional Terraform configuration
        id: upload
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
        run: |
          set -euo pipefail
          upload=$(docker run --rm \
            --env TF_API_TOKEN \
            --env TF_CLOUD_ORGANIZATION \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            hashicorp/tfci@sha256:6fc488db7a14bddb98bd92138cda8e0113758448d908981a479a1207546e48a8 \
            tfci upload -json \
              -workspace="${TFC_WORKSPACE}" \
              -directory=./infra \
              -provisional=true)
          echo "configuration_version_id=$(jq -er .configuration_version_id <<< "$upload")" >> "$GITHUB_OUTPUT"

      - name: Create the saved empty-fleet recovery plan
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
          WORKSPACE_ID: ${{ steps.workspace.outputs.workspace_id }}
          CONFIGURATION_VERSION_ID: ${{ steps.upload.outputs.configuration_version_id }}
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          api=https://app.terraform.io/api/v2
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}" -H "Content-Type: application/vnd.api+json")
          hcl_image=$(jq -cn --arg image "$IMAGE" '$image')
          payload=$(jq -cn \
            --arg message "no-overlap main ${GITHUB_SHA} (@${GITHUB_ACTOR}, gh run ${GITHUB_RUN_ID})" \
            --arg workspace "$WORKSPACE_ID" \
            --arg configuration "$CONFIGURATION_VERSION_ID" \
            --arg image "$hcl_image" \
            '{data: {type: "runs", attributes: {message: $message, "save-plan": true, "auto-apply": false, variables: [{key: "container_image", value: $image}, {key: "directory_group_cutover_ready", value: "true"}]}, relationships: {workspace: {data: {type: "workspaces", id: $workspace}}, "configuration-version": {data: {type: "configuration-versions", id: $configuration}}}}}')
          run=$(curl -fsS "${auth[@]}" -X POST -d "$payload" "${api}/runs")
          run_id=$(jq -er '.data.id' <<< "$run")
          run_link="https://app.terraform.io/app/${TF_CLOUD_ORGANIZATION}/workspaces/${TFC_WORKSPACE}/runs/${run_id}"

          for attempt in $(seq 1 150); do
            run=$(curl -fsS "${auth[@]}" "${api}/runs/${run_id}")
            status=$(jq -er '.data.attributes.status' <<< "$run")
            case "$status" in
              planned_and_saved) break ;;
              planned_and_finished)
                echo "::error::An empty production MIG produced no recovery changes; do not apply"
                exit 1
                ;;
              errored|canceled|force_canceled|discarded)
                echo "::error::HCP Terraform recovery plan ended ${status}"
                exit 1
                ;;
            esac
            if [ "$attempt" = 150 ]; then
              echo "::error::HCP Terraform recovery plan did not finish within 25 minutes (last: ${status})"
              exit 1
            fi
            sleep 10
          done

          {
            echo "### Empty-fleet Portal recovery plan"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- [review the complete HCP Terraform plan](${run_link})"
            echo "- HCP status: **${status}**"
            echo "- apply remains manual; this workflow has no apply credential and makes no infrastructure change"
            echo "- before confirming, require the MIG target-size repair, the new instance template, and no unexpected create/update/delete action"
            echo "- apply rechecks the Google managed-instance inventory and fails unless the old MIG is still empty"
          } >> "$GITHUB_STEP_SUMMARY"
