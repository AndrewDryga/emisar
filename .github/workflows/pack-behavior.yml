name: Pack behavior

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pack-behavior
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plans:
    name: Discover plans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: tools/go.*

      - id: discover
        name: Discover committed compatibility rows
        run: echo "matrix=$(go run ./tools/cmd/packtest --matrix --packs ./packs)" >> "$GITHUB_OUTPUT"

  behavior:
    name: ${{ matrix.pack }} ${{ matrix.version }}
    needs: plans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plans.outputs.matrix) }}
    env:
      GOTOOLCHAIN: local
      PACK: ${{ matrix.pack }}
      PACKTEST_VERSION: ${{ matrix.version }}
      PACKTEST_DIGEST: ${{ matrix.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache: true
          cache-dependency-path: |
            runner/go.sum
            tools/go.sum

      - name: Exercise pack behavior
        run: ./run test packs "$PACK"

      - name: Upload failed pack report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pack-behavior-${{ matrix.pack }}-${{ matrix.version }}
          path: dev/test-packs/reports/${{ matrix.pack }}.log
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
