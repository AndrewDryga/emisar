name: Pack behavior

# The weekly full sweep: every committed compatibility row, not just changed
# ones, because the registry world the rows pin against can move under an
# unchanged pack. The pipeline itself is pack-behavior-rows.yml — the same
# implementation CI runs on changed rows; calling it with no matrix input
# makes the prep job discover the full committed set.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pack-behavior
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rows:
    name: Weekly sweep
    uses: ./.github/workflows/pack-behavior-rows.yml

  host-access:
    name: Host-access recipes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: tools/go.*

      - name: Prove every published host-access recipe
        run: ./run test pack-access
