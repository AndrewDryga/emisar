name: CD

# Main-only delivery. Validation is the reusable CI workflow from this exact
# commit; write/OIDC permissions remain scoped to the individual delivery jobs.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  portal-publish:
    name: CD - Publish portal image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: portal-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portal-image-${{ github.sha }}
          path: /tmp/portal-image

      - name: Load tested image
        run: |
          set -euo pipefail
          gunzip -c /tmp/portal-image/emisar-portal-image.tar.gz | docker load

      - name: Download tested image SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portal-sbom-${{ github.sha }}
          path: /tmp/portal-sbom

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Publish tested image
        id: push
        env:
          IMAGE: ghcr.io/andrewdryga/emisar
        run: |
          set -euo pipefail
          revision=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' emisar/portal:ci)
          test "$revision" = "$GITHUB_SHA" || {
            echo "::error::Tested image revision ${revision} does not match current main ${GITHUB_SHA}"
            exit 1
          }

          # Include run identity so a re-run can never overwrite a tag with
          # different bytes if an upstream package repository changed.
          immutable="${IMAGE}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag emisar/portal:ci "$immutable"
          docker push "$immutable"
          repo_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$immutable")
          digest=${repo_digest#*@}
          test -n "$digest" && test "$digest" != "$repo_digest"

          {
            echo "image=${IMAGE}@${digest}"
            echo "immutable=${immutable}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published portal image"
            echo "- immutable tag: \`${immutable}\`"
            echo "- digest: \`${IMAGE}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/andrewdryga/emisar
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v4.1.0
        with:
          subject-name: ghcr.io/andrewdryga/emisar
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: /tmp/portal-sbom/emisar-portal.cdx.json
          push-to-registry: true

      - name: Check current main before moving latest
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping latest: ${GITHUB_SHA} is superseded by ${current_sha}."
          fi

      - name: Promote attested image to latest
        if: steps.latest.outputs.current == 'true'
        env:
          IMAGE: ghcr.io/andrewdryga/emisar
        run: |
          set -euo pipefail
          docker tag emisar/portal:ci "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

  packs-approval:
    name: CD - Approve pack registry release
    # Wait for the complete reusable CI call so publication cannot outpace the
    # catalog compatibility and portal image checks selected for the same commit.
    if: needs.ci.outputs.packs_release == 'true'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pack-registry-approval
      # Supersede only an approval that has not released publication yet. The
      # publication job below has a different, non-cancellable concurrency group.
      cancel-in-progress: true
    environment:
      name: pack-registry-approval
    permissions:
      contents: read
    steps:
      - name: Record approved release
        run: |
          {
            echo "### Pack registry release approved"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- publication remains serialized and cannot be canceled once started"
          } >> "$GITHUB_STEP_SUMMARY"

  packs-publish:
    name: CD - Publish pack registry
    if: needs.packs-approval.result == 'success'
    needs: [ci, packs-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: packs-publish
      cancel-in-progress: false
    environment:
      # The release decision and its supersede semantics live on the
      # pack-registry-approval gate above; this identity-bearing environment
      # binds the short-lived GCP WIF credentials to protected main (no admin
      # bypass) but does not re-prompt for a reviewer. A bare rerun of an old
      # publication job is already refused by the "Refuse a superseded release"
      # step below when a newer release has since published.
      name: pack-registry-production
    permissions:
      contents: read
      id-token: write
      # "Get an environment" is documented as needing actions:read.
      actions: read
    env:
      GOTOOLCHAIN: local
      REGISTRY_BASE: https://storage.googleapis.com/emisar-pack-registry
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache: true
          cache-dependency-path: runner/go.sum

      # Before any credential is minted. This environment is what binds the
      # short-lived GCP WIF credentials to protected main with no admin bypass —
      # a policy asserted only in the comment above until now, because the check
      # that verifies it ran in no gate and no workflow. If someone loosens the
      # environment in repo settings, publication stops here rather than
      # authenticating under a weaker binding than the comment claims.
      - name: Verify the publishing environment's protection rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./run check pack-environment "$GITHUB_REPOSITORY" pack-registry-production

      - name: Build pack publisher
        run: cd runner && go build -trimpath -o /tmp/packctl ./cmd/packctl

      - name: Require live registry domain
        # Preflight proves the DOMAIN serves (DNS, TLS, load balancer) — a
        # publish must never bake tarball URLs into a registry that cannot
        # serve them. The catalog OBJECT is deliberately not preflight: a
        # missing or malformed pointer is exactly the state this publication
        # repairs, and the drift probe (tools/internal/ci/select.go) forces
        # packs_release on it — refusing here would loop that repair run red
        # forever.
        run: |
          set -euo pipefail
          getent ahosts registry.emisar.dev >/dev/null || {
            echo "::error::registry.emisar.dev does not resolve; restore the registry serving domain (infra/load_balancer.tf, infra/dns.tf) before publishing packs"
            exit 1
          }
          status=$(curl -sS --retry 5 --retry-delay 2 -w '%{http_code}' \
            "https://registry.emisar.dev/v1/catalog.json" -o /tmp/domain-catalog.json) || {
            echo "::error::registry.emisar.dev is not serving HTTPS; restore the registry serving domain (infra/load_balancer.tf, infra/dns.tf) before publishing packs"
            exit 1
          }
          case "$status" in
            200)
              /tmp/packctl catalog validate /tmp/domain-catalog.json >/dev/null 2>&1 ||
                echo "::warning::live catalog at registry.emisar.dev is malformed; this publication repairs it"
              ;;
            404)
              echo "::warning::live catalog pointer is missing at registry.emisar.dev; this publication restores it"
              ;;
            *)
              echo "::error::registry.emisar.dev returned HTTP ${status} for v1/catalog.json; restore the registry serving path (infra/load_balancer.tf) before publishing packs"
              exit 1
              ;;
          esac

      - name: Fetch published catalog
        run: |
          set -euo pipefail
          metadata_url="https://storage.googleapis.com/storage/v1/b/emisar-pack-registry/o/v1%2Fcatalog.json"
          status=$(curl -sS -o /tmp/catalog-metadata.json -w '%{http_code}' "$metadata_url")
          case "$status" in
            200)
              media_url=$(jq -er .mediaLink /tmp/catalog-metadata.json)
              curl -fsS "$media_url" -o /tmp/previous.json
              # packctl refuses an unparseable --previous, so a malformed
              # published catalog would strand publication in the same red loop
              # the domain preflight avoids. Its history is unusable; repair
              # from the committed catalog exactly like the empty-registry
              # bootstrap below (immutable content-addressed objects stay
              # protected by publish's if-generation-match:0 either way).
              # The SAME check `catalog build --previous` applies, so this
              # decision and packctl's acceptance cannot drift. A jq predicate
              # here accepted catalogs packctl would carry forward with an
              # amputated history.
              if /tmp/packctl catalog validate /tmp/previous.json >/dev/null; then
                echo "using published catalog history from generation $(jq -r .generation /tmp/catalog-metadata.json)"
              else
                echo "::warning::published catalog is malformed; repairing its history from the committed catalog"
                cp portal/apps/emisar/priv/packs/catalog.json /tmp/previous.json
              fi
              ;;
            404)
              echo "registry is empty; bootstrapping from the committed catalog"
              cp portal/apps/emisar/priv/packs/catalog.json /tmp/previous.json
              ;;
            *) echo "::error::Registry catalog returned HTTP ${status}"; exit 1 ;;
          esac

      - name: Build registry artifacts
        run: |
          /tmp/packctl catalog build \
            --packs packs \
            --out dist/packs \
            --previous /tmp/previous.json

      # CI proved build(packs, previous=COMMITTED) == committed. This builds
      # against the LIVE catalog, so when live history has diverged — a manual
      # publish, or a run that failed after mutating the registry — the two
      # differ and we would publish an ungated catalog, then red the deploy on
      # deployment-plan's own cmp AFTER the public registry was already
      # overwritten. That ordering has bitten once. Compare before minting
      # credentials, not after publishing.
      - name: Refuse a catalog that differs from the tested one
        run: |
          set -euo pipefail
          if ! cmp -s dist/packs/v1/catalog.json portal/apps/emisar/priv/packs/catalog.json; then
            echo "::error::Built catalog differs from the committed, CI-verified catalog."
            echo "::error::Live registry history has diverged; reconcile it before publishing."
            diff <(jq -S . portal/apps/emisar/priv/packs/catalog.json) \
                 <(jq -S . dist/packs/v1/catalog.json) || true
            exit 1
          fi

      - name: Refuse a superseded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish superseded commit ${GITHUB_SHA}; current main is ${current_sha}"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/65212203604/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: emisar-pack-publisher@emisar.iam.gserviceaccount.com
          token_format: access_token

      - name: Publish registry artifacts
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          /tmp/packctl catalog publish --dir dist/packs | tee /tmp/publish.log
          {
            echo "### Pack registry published"
            echo '```'
            tail -20 /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published catalog
        run: |
          set -euo pipefail
          metadata_url="https://storage.googleapis.com/storage/v1/b/emisar-pack-registry/o/v1%2Fcatalog.json"
          for attempt in $(seq 1 5); do
            curl -fsS "$metadata_url" -o /tmp/catalog-metadata.json
            media_url=$(jq -er .mediaLink /tmp/catalog-metadata.json)
            curl -fsS "$media_url" -o /tmp/gcs-catalog.json
            cmp dist/packs/v1/catalog.json /tmp/gcs-catalog.json && break
            [ "$attempt" = 5 ] && { echo "::error::published catalog bytes did not converge"; exit 1; }
            sleep 2
          done
          cmp dist/packs/v1/catalog.json /tmp/gcs-catalog.json
          test "$(jq -r .cacheControl /tmp/catalog-metadata.json)" = no-store || {
            echo "::error::mutable catalog must publish with Cache-Control: no-store"
            exit 1
          }
          pack_object=$(jq -er '.objects[] | select(.path | startswith("v1/packs/linux-core/")) | .path' dist/packs/manifest.json)
          curl -fsS --retry 3 --retry-delay 2 \
            "${REGISTRY_BASE}/${pack_object}" -o /tmp/gcs-linux-core.tar.gz
          cmp "dist/packs/${pack_object}" /tmp/gcs-linux-core.tar.gz

          curl -fsS --retry 5 --retry-delay 2 \
            "https://registry.emisar.dev/v1/catalog.json" -o /tmp/canonical-catalog.json
          cmp dist/packs/v1/catalog.json /tmp/canonical-catalog.json

          # Collected into a variable, not piped through process substitution: a
          # `done < <(jq ...)` hides jq's exit status, so a manifest this build
          # could not parse read as "no tarballs to verify". And an EMPTY list
          # ran the loop zero times and then reported publication verified —
          # which is the one answer this step must never give for free.
          tarball_paths=$(jq -er '.objects[] | select(.path | endswith("/pack.tar.gz")) | .path' dist/packs/manifest.json)
          test -n "$tarball_paths" || {
            echo "::error::manifest lists no pack tarballs to verify"; exit 1
          }
          while IFS= read -r path; do
            published=/tmp/"$(basename "$(dirname "$path")")-$(basename "$path")"
            curl -fsS --retry 3 --retry-delay 2 \
              "https://registry.emisar.dev/${path}" -o "$published"
            cmp "dist/packs/${path}" "$published"
          done <<<"$tarball_paths"

          tarball_urls=$(jq -er '.packs[] | .tarball_url, (.previous_versions[]?.tarball_url)' /tmp/canonical-catalog.json | sort -u)
          test -n "$tarball_urls" || {
            echo "::error::published catalog lists no tarball URLs to verify"; exit 1
          }
          while IFS= read -r url; do
            case "$url" in
              https://registry.emisar.dev/v1/packs/*/pack.tar.gz) ;;
              *) echo "::error::catalog contains a non-canonical tarball URL: ${url}"; exit 1 ;;
            esac
            curl -fsSI --retry 3 --retry-delay 2 "$url" >/dev/null
          done <<<"$tarball_urls"

  production-cutover:
    name: CD - Check production cutover
    # Every successful main commit carries a freshly tested portal image. Never
    # plan with an older applied digest: that would hide application drift after
    # a failed plan behind an otherwise successful infrastructure reconciliation.
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.portal-publish.result == 'success' &&
      ((needs.ci.outputs.packs_release == 'true' && needs.packs-publish.result == 'success') ||
       (needs.ci.outputs.packs_release != 'true' && needs.packs-publish.result == 'skipped'))
    needs: [ci, portal-publish, packs-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      standard: ${{ steps.cutover.outputs.standard }}
    permissions:
      contents: read
    env:
      PUBLISHED_IMAGE: ${{ needs.portal-publish.outputs.image }}
    steps:
      - name: Protect the directory-group authorization cutover
        id: cutover
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_IMAGE" =~ ^ghcr\.io/andrewdryga/emisar@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::The cutover requires this commit's tested immutable image (got '$PUBLISHED_IMAGE')"
            exit 1
          }
          live_health=$(curl -fsS --retry 5 --retry-delay 2 https://emisar.dev/healthz)
          live_revision=$(jq -er .revision <<< "$live_health")
          [[ "$live_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Live health returned an invalid revision: ${live_revision}"
            exit 1
          }

          # Migration 20261004 changes authorization identity from the IdP's
          # reusable externalId to emisar's immutable DirectoryGroup UUID. A
          # v0.42 node serving beside the migrated schema can regrant a dormant
          # mapping after delete/recreate, so the normal rolling plan must not
          # be offered until production has crossed it under a no-overlap
          # maintenance procedure. This source-level hold is deliberately not
          # inferred from one /healthz response: the load balancer can return a
          # new node while an old node still serves. Remove the hold only after
          # the maintenance evidence proves the entire old fleet is gone.
          echo "standard=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Production Terraform plan withheld"
            echo "- live revision: \`${live_revision}\`"
            echo "- candidate revision: \`${GITHUB_SHA}\`"
            echo "- tested image: \`${PUBLISHED_IMAGE}\`"
            echo "- the candidate contains \`20261004000000_bind_authorization_mappings_to_directory_groups\`, which is not safe with old and new portal nodes serving together"
            echo "- use the reviewed no-overlap cutover: quiesce SSO/SCIM writes, drain every old portal node, migrate once, start only this candidate, verify authorization, then reopen traffic"
            echo "- after the migration commits, v0.42 is not a rollback candidate; rollback may use only an image that understands DirectoryGroup UUID mappings"
            echo "- the tested immutable image remains available to the maintenance procedure"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-plan:
    name: CD - Plan production
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.portal-publish.result == 'success' &&
      needs.production-cutover.result == 'success' &&
      needs.production-cutover.outputs.standard == 'true' &&
      ((needs.ci.outputs.packs_release == 'true' && needs.packs-publish.result == 'success') ||
       (needs.ci.outputs.packs_release != 'true' && needs.packs-publish.result == 'skipped'))
    needs: [ci, portal-publish, packs-publish, production-cutover]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-plan
      # A saved plan changes nothing — provisional configuration, no workspace
      # lock, and the workspace's auto-apply stays disabled — so a newer main
      # commit supersedes an older pending plan instead of queueing behind it.
      cancel-in-progress: true
    # Scopes the plan-only TFC token and restricts the job to main. Deliberately
    # NO required reviewer: the plan is non-destructive (see the concurrency
    # note) and the workspace's auto-apply is disabled, so the token cannot
    # change infrastructure. TFC "Confirm & Apply" is the single human gate;
    # gating the plan too only queued pushes behind a redundant approval.
    environment:
      name: portal-production-plan
    permissions:
      contents: read
    env:
      TF_CLOUD_ORGANIZATION: Dryga
      TFC_WORKSPACE: emisar
      PUBLISHED_IMAGE: ${{ needs.portal-publish.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify commit is still current main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Production Terraform plan"
              echo "Skipped because \`${GITHUB_SHA}\` is no longer current main (\`${current_sha}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify HCP workspace and select image
        if: steps.current.outputs.current == 'true'
        id: image
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
        run: |
          set -euo pipefail
          api=https://app.terraform.io/api/v2
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}" -H "Content-Type: application/vnd.api+json")
          workspace=$(curl -fsS "${auth[@]}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TFC_WORKSPACE}")
          workspace_id=$(jq -er '.data.id' <<< "$workspace")
          auto_apply=$(jq -r '.data.attributes["auto-apply"]' <<< "$workspace")
          test "$auto_apply" = false || {
            echo "::error::HCP Terraform workspace auto-apply must remain disabled"
            exit 1
          }
          expected_terraform=$(awk '$1 == "terraform" {print $2}' .tool-versions)
          workspace_terraform=$(jq -r '.data.attributes["terraform-version"]' <<< "$workspace")
          test "$workspace_terraform" = "$expected_terraform" || {
            echo "::error::HCP workspace Terraform ${workspace_terraform} does not match tested ${expected_terraform}"
            exit 1
          }

          image="$PUBLISHED_IMAGE"
          [[ "$image" =~ ^ghcr\.io/andrewdryga/emisar@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Every main plan requires the current commit's published immutable image (got '$image')"
            exit 1
          }

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"

      - name: Require published pack catalog
        # Only pack releases need the live registry equality check. Portal,
        # infra, and docs-only plans must not depend on registry availability.
        if: steps.current.outputs.current == 'true' && needs.ci.outputs.packs_release == 'true'
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 \
            https://registry.emisar.dev/v1/catalog.json -o /tmp/live-catalog.json
          cmp portal/apps/emisar/priv/packs/catalog.json /tmp/live-catalog.json || {
            echo "::error::Committed pack catalog is not published at registry.emisar.dev; recover pack publication, then rerun this deployment-plan job"
            exit 1
          }

      - name: Upload provisional Terraform configuration
        if: steps.current.outputs.current == 'true'
        id: upload
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
        run: |
          set -euo pipefail
          # tfci v1.3.2 supports provisional configuration versions, but its
          # GitHub Action wrapper does not expose the flag. Run the same pinned
          # tool directly so an unapplied plan cannot replace the workspace's
          # current configuration.
          upload=$(docker run --rm \
            --env TF_API_TOKEN \
            --env TF_CLOUD_ORGANIZATION \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            hashicorp/tfci@sha256:6fc488db7a14bddb98bd92138cda8e0113758448d908981a479a1207546e48a8 \
            tfci upload -json \
              -workspace="${TFC_WORKSPACE}" \
              -directory=./infra \
              -provisional=true)
          configuration_version_id=$(jq -er .configuration_version_id <<< "$upload")
          echo "configuration_version_id=$configuration_version_id" >> "$GITHUB_OUTPUT"

      - name: Plan production and summarize the manual apply
        if: steps.current.outputs.current == 'true'
        env:
          TF_API_TOKEN: ${{ secrets.TFC_PLAN_TOKEN }}
          WORKSPACE_ID: ${{ steps.image.outputs.workspace_id }}
          CONFIGURATION_VERSION_ID: ${{ steps.upload.outputs.configuration_version_id }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          api=https://app.terraform.io/api/v2
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}" -H "Content-Type: application/vnd.api+json")
          hcl_image=$(jq -cn --arg image "$IMAGE" '$image')
          payload=$(jq -cn \
            --arg message "main ${GITHUB_SHA} (@${GITHUB_ACTOR}, gh run ${GITHUB_RUN_ID})" \
            --arg workspace "$WORKSPACE_ID" \
            --arg configuration "$CONFIGURATION_VERSION_ID" \
            --arg image "$hcl_image" \
            '{data: {type: "runs", attributes: {message: $message, "save-plan": true, variables: [{key: "container_image", value: $image}]}, relationships: {workspace: {data: {type: "workspaces", id: $workspace}}, "configuration-version": {data: {type: "configuration-versions", id: $configuration}}}}}')
          # A saved plan is provisional, so HCP discards it the moment someone
          # confirms an apply — exactly what the summary below has always called
          # normal. Planning again against the new state is the honest response;
          # failing the push that happened to land during an apply is not, and
          # that false red cost a green main here. One retry only: a second
          # discard is a signal about the workspace, not a race.
          for plan_attempt in 1 2; do
            run=$(curl -fsS "${auth[@]}" -X POST -d "$payload" "${api}/runs")
            run_id=$(jq -er '.data.id' <<< "$run")
            RUN_LINK="https://app.terraform.io/app/${TF_CLOUD_ORGANIZATION}/workspaces/${TFC_WORKSPACE}/runs/${run_id}"
            for attempt in $(seq 1 150); do
              run=$(curl -fsS "${auth[@]}" "${api}/runs/${run_id}")
              status=$(jq -er '.data.attributes.status' <<< "$run")
              case "$status" in
                # HCP saves a reviewable plan when changes exist and finishes a
                # no-op immediately. Both are successful terminal plan states.
                planned_and_saved|planned_and_finished) break ;;
                discarded) break ;;
                errored|canceled|force_canceled)
                  echo "::error::HCP Terraform run ended ${status}"
                  exit 1
                  ;;
              esac
              if [ "$attempt" = 150 ]; then
                echo "::error::HCP Terraform run did not reach planned_and_saved within 25 minutes (last: ${status})"
                exit 1
              fi
              sleep 10
            done
            [ "$status" = discarded ] || break
            if [ "$plan_attempt" = 2 ]; then
              echo "::error::HCP Terraform discarded this commit's plan twice; review the workspace"
              exit 1
            fi
            echo "::notice::An apply superseded this plan; planning once more against the new state"
          done
          {
            echo "### Production Terraform plan"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- image revision: \`${GITHUB_SHA}\`"
            echo "- [review the complete HCP Terraform plan](${RUN_LINK})"
            echo "- HCP status: **${status}**"
            echo "- saved plan: it does not hold the workspace lock or wait behind another plan"
            echo "- HCP discards it if another apply changes state first, and CD then plans once more against that new state"
            echo "- GitHub waited for the complete saved plan before reporting success"
            echo "- CD stops here: review in HCP, then use **Confirm & Apply** only if the plan is correct"
            echo "- before applying, verify the run's \`main ${GITHUB_SHA}\` message and image revision match the commit you intend to deploy"
          } >> "$GITHUB_STEP_SUMMARY"
