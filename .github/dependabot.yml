version: 2

# One entry per ecosystem; multi-directory entries share the identical weekly
# cadence and release-age cooldown every ecosystem uses (Dependabot groups and
# opens PRs per directory). The dep-age CI gate enforces the same windows on
# the lock diffs themselves, so a hand-made bump can't dodge the cooldown.
updates:
  - package-ecosystem: "mix"
    directory: "/portal"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories: ["/runner", "/mcp", "/tools"]
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    # The Entra capture rigs are the repository's only JavaScript. They drive a
    # live tenant's admin console with its password and TOTP seed in process
    # memory, so their one dependency waits out the same cooldown as everything
    # else instead of arriving from a global npm root.
    directory: "/tools/cmd/entra-capture"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    # Docker directories are not recursive — every Dockerfile/compose location is
    # listed. "/" is the root docker-compose.yml (the signing-e2e/sso-e2e stack);
    # "/runner/release" is the published ghcr emisar-runner image customers pull,
    # which shares portal's debian base and must be bumped alongside it.
    directories:
      - "/"
      - "/portal"
      - "/runner/release"
      - "/dev/runner"
      - "/dev/mcp"
      - "/dev/cloud-init"
      - "/dev/test-host-access"
      - "/dev/test-packs"
      - "/packs/*/test"
      - "/packs/*/test/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
