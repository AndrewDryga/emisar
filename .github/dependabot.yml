version: 2

# One entry per ecosystem; multi-directory entries share the identical weekly
# cadence and the same 7-day release-age floor (Dependabot groups and opens PRs
# per directory). Only mix and gomod can hold major and minor bumps past that
# floor — GitHub supports the semver-* cooldown keys for those ecosystems, while
# terraform, docker, docker-compose, and github-actions accept `default-days` alone. The dep-age
# CI gate enforces the mix/gomod windows on the lock diffs themselves, so a
# hand-made bump can't dodge the cooldown.
updates:
  - package-ecosystem: "mix"
    directory: "/portal"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories: ["/runner", "/mcp", "/tools"]
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    # Dockerfiles. Docker directories are not recursive, so every location
    # Dependabot can usefully bump is listed. This ecosystem reads YAML only in
    # Kubernetes or Helm shapes, never a compose file: compose files have their
    # own docker-compose entry below. "/runner/release" is the published ghcr
    # emisar-runner image customers pull, which shares portal's debian base and
    # must be bumped alongside it. .agent/Dockerfile and
    # dev/test-packs/gcloud/Dockerfile stay outside on purpose: they build FROM
    # an ARG Dependabot cannot resolve; the coop box base is the operator's, and
    # the gcloud version is owned by each packs/gcp-*/test/cases.yaml (the pack
    # gate makes compose default PACKTEST_VERSION to it), so no bump is lost.
    # This list is not prose alone: the dependabot docker coverage phase of
    # `./run gate tooling` walks the repository for Dockerfiles and compose
    # files and fails on any whose directory matches no directory of its
    # ecosystem below and no entry in dependabotDockerExclusions
    # (tools/internal/devtool/dependabot_docker.go), which carries every
    # exclusion's rationale. Add a location to one or the other.
    directories:
      - "/portal"
      - "/runner/release"
      - "/infra/runtime/admin-runner/diagnostics"
      - "/dev/runner"
      - "/dev/mcp"
      - "/dev/cloud-init"
      - "/dev/test-host-access"
      - "/dev/test-packs"
      - "/packs/*/test"
      - "/packs/*/test/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    # The root docker-compose.yml (the signing-e2e/sso-e2e stack). Only "/" is
    # listed: dev/compose.yml and dev/review-compose.yml mirror its Postgres and
    # Keycloak pins byte for byte, and Dependabot opens PRs per directory, so
    # listing "/dev" would move one mirror off the reference on its own and fail
    # the shared service image pins phase of `./run gate tooling`. The mirrors
    # travel in the same commit as the root bump. Pack test compose files stay
    # out because each primary SUT image follows its test/cases.yaml matrix.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The repository's own reusable release workflows are pinned by commit on
    # purpose: infra/github_oidc.tf trusts that exact SHA for workload identity,
    # so a bump here without the Terraform rotation breaks the release at
    # authentication (PR #82). The release runbook rotates both together.
    # Only "/" is listed: the composite .github/actions/verify-release-tag is
    # part of that trusted release surface, so the same rotation moves its pins.
    ignore:
      - dependency-name: "AndrewDryga/emisar/.github/workflows/*"
