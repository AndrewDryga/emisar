version: 2

# One entry per ecosystem; multi-directory entries share the identical weekly
# cadence and the same 7-day release-age floor (Dependabot groups and opens PRs
# per directory). Only mix and gomod can hold major and minor bumps past that
# floor — GitHub supports the semver-* cooldown keys for those ecosystems, while
# terraform, docker, and github-actions accept `default-days` alone. The dep-age
# CI gate enforces the mix/gomod windows on the lock diffs themselves, so a
# hand-made bump can't dodge the cooldown.
updates:
  - package-ecosystem: "mix"
    directory: "/portal"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories: ["/runner", "/mcp", "/tools"]
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    # Docker directories are not recursive, so every location Dependabot can
    # usefully bump is listed. "/" is the root docker-compose.yml (the
    # signing-e2e/sso-e2e stack); "/runner/release" is the published ghcr
    # emisar-runner image customers pull, which shares portal's debian base and
    # must be bumped alongside it. Four repository-owned files stay outside the
    # lane on purpose. dev/compose.yml and dev/review-compose.yml mirror the root
    # Postgres and Keycloak pins byte for byte, and Dependabot opens PRs per
    # directory: listing "/dev" would move one mirror off the reference on its
    # own and fail the shared service image pins phase of `./run gate tooling`,
    # so only "/" is bumped and the mirrors travel in the same commit.
    # .agent/Dockerfile and dev/test-packs/gcloud/Dockerfile build FROM an ARG
    # Dependabot cannot resolve; the coop box base is the operator's, and the
    # gcloud version is owned by each packs/gcp-*/test/cases.yaml (the pack gate
    # makes compose default PACKTEST_VERSION to it), so no bump is lost.
    directories:
      - "/"
      - "/portal"
      - "/runner/release"
      - "/dev/runner"
      - "/dev/mcp"
      - "/dev/cloud-init"
      - "/dev/test-host-access"
      - "/dev/test-packs"
      - "/packs/*/test"
      - "/packs/*/test/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
