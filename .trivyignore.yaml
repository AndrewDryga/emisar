# Temporary, reviewed exceptions for Debian findings with no fixed package.
# Trivy fails closed when an exception expires; re-scan and re-triage each ID
# rather than restoring blanket --ignore-unfixed behavior.
#
# Expiries are STAGGERED on purpose. When every entry shared one date, the whole
# set lapsed at once and CD broke with thirteen findings and no warning ramp;
# batches of three or four keep re-triage a task rather than an incident. Give a
# renewed entry a date in the least-crowded batch.
