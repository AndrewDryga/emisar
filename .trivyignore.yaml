# Temporary, reviewed exceptions for Debian findings with no fixed package.
# Trivy fails closed when an exception expires; re-scan and re-triage each ID
# rather than restoring blanket --ignore-unfixed behavior.
#
# Expiries are STAGGERED on purpose. When every entry shared one date, the whole
# set lapsed at once and CD broke with thirteen findings and no warning ramp;
# batches of three or four keep re-triage a task rather than an incident. Give a
# renewed entry a date in the least-crowded batch.
vulnerabilities:
  - id: CVE-2026-53615
    purls:
      - pkg:deb/debian/bsdutils@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15&epoch=1
      - pkg:deb/debian/libblkid1@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/libmount1@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/libsmartcols1@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/libuuid1@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/mount@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/util-linux-extra@2.38.1-5%2Bdeb12u3?arch=amd64&distro=debian-12.15
    statement: Bookworm has no fixed util-linux package. The Portal runs as nobody with all capabilities dropped, no-new-privileges and no mapped block devices. Its release does not probe disk images or invoke partitioning tools.
    expired_at: 2026-12-23
  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libtinfo6@6.4-4?arch=amd64&distro=debian-12.15
      - pkg:deb/debian/ncurses-base@6.4-4?arch=all&distro=debian-12.15
      - pkg:deb/debian/ncurses-bin@6.4-4?arch=amd64&distro=debian-12.15
    statement: The affected program is infocmp. It is installed, but the Portal does not invoke it or process user-supplied terminal descriptions. Debian classifies this CLI issue as minor and has no Bookworm fix.
    expired_at: 2026-12-23
  - id: CVE-2026-85091
    purls:
      - pkg:deb/debian/zlib1g@1.2.13.dfsg-1?arch=amd64&distro=debian-12.15&epoch=1
    statement: Bookworm zlib is affected. Only dpkg-deb and libapt-pkg in the image import gzwrite, and no inspected ELF imports gzclearerr, which this version requires to reach the defect. The Portal does not use these package-management paths. ERTS builds its embedded zlib without gzwrite.c.
    expired_at: 2026-12-23
  - id: CVE-2026-54369
    statement: the running portal does not invoke ACL utilities or accept ACL input.
    expired_at: 2026-12-09
  - id: CVE-2026-9538
    statement: the running portal does not execute Perl; Debian has deferred a package fix.
    expired_at: 2026-12-09
  - id: CVE-2026-41992
    statement: gzip is present, but the portal never invokes external commands or feeds attacker-supplied archives to gzip.
    expired_at: 2026-12-09
  - id: CVE-2026-107494
    purls:
      - pkg:deb/debian/libssl3@3.0.22-1~deb12u2?arch=amd64
      - pkg:deb/debian/openssl@3.0.22-1~deb12u2?arch=amd64
    statement: these exact Bookworm OpenSSL 3.0 packages predate native QUIC. The OpenSSL advisory lists the affected branches as 3.5, 4.0, and 4.1.
    expired_at: 2026-12-09
  - id: CVE-2026-53613
    statement: the non-root portal cannot gain mount's SUID privileges under no-new-privileges, drops all capabilities, and has no user-mount fstab entry.
    expired_at: 2027-01-06
  - id: CVE-2026-16742
    statement: systemd-homed is absent from the image; the portal runs as nobody, not as a local homed-managed login.
    expired_at: 2027-01-06
  - id: CVE-2026-78410
    statement: the portal has no user-mount fstab entry and runs with all capabilities dropped and no-new-privileges, so restricted bind mounts are unreachable.
    expired_at: 2027-02-03
  - id: CVE-2023-45853
    statement: Debian confirms Bookworm's zlib build omits the affected MiniZip code; MiniZip binaries are absent from the image.
    expired_at: 2027-02-03
