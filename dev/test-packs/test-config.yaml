schema_version: 1

runner:
  group: pack-tests
  labels:
    purpose: ci

cloud:
  url: wss://does-not-connect.invalid/runner/v1
  enrollment_key_env: EMISAR_ENROLLMENT_KEY
  token_path: /tmp/emisar-test/token
  heartbeat_every: 30s
  reconnect_min: 1s
  reconnect_max: 60s

paths:
  data_dir: /tmp/emisar-test/data
  packs:
    - /packs

events:
  jsonl_path: /tmp/emisar-test/events.jsonl

execution:
  # The executor scrubs the action env to PATH/LANG/LC_ALL/TERM by default.
  # Every name here reaches every pack's actions, so list only what every
  # runner-tools container provides. A pack lists the names its own cases
  # pass to actions in its cases.yaml `inherit_env`; the harness adds them
  # to the private copy of this file it stages for that pack.
  inherit_env:
    - HOME
