schema_version: 1

runner:
  group: pack-tests
  labels:
    purpose: ci

cloud:
  url: wss://does-not-connect.invalid/runner/v1
  enrollment_key_env: EMISAR_ENROLLMENT_KEY
  token_path: /tmp/emisar-test/token
  heartbeat_every: 30s
  reconnect_min: 1s
  reconnect_max: 60s

paths:
  data_dir: /tmp/emisar-test/data
  work_dir: /tmp/emisar-test/work
  packs:
    - /packs

events:
  jsonl_path: /tmp/emisar-test/events.jsonl

execution:
  # The executor scrubs the action env to PATH/LANG/LC_ALL/TERM by default, so
  # every credential/endpoint var supplied by a pack's cases.yaml must be
  # allowlisted here or the action gets a silent "auth missing".
  inherit_env:
    - AWS_ACCESS_KEY_ID
    - AWS_DEFAULT_REGION
    - AWS_ENDPOINT_URL
    - AWS_SECRET_ACCESS_KEY
    - CADDY_ACCESS_LOG
    - CADDY_ADMIN
    - CH_HOST
    - CH_PASSWORD
    - CH_USER
    - COCKROACH_URL
    - CONSUL_HTTP_ADDR
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_CERTIFICATEMANAGER
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_COMPUTE
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_DNS
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_SQL
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_STORAGE
    - CLOUDSDK_AUTH_ACCESS_TOKEN
    - CQLSH_HOST
    - CQLSH_PASSWORD
    - CQLSH_PORT
    - ELASTIC_PASSWORD
    - ELASTIC_URL
    - ELASTIC_USER
    - ENVOY_ADMIN
    - GRAFANA_PASSWORD
    - GRAFANA_URL
    - GRAFANA_USER
    - HAPROXY_SOCK
    - HOME
    - HTTPD_ACCESS_LOG
    - HTTPD_ERROR_LOG
    - HTTPD_STATUS_URL
    - KAFKA_BOOTSTRAP
    - KUBECONFIG
    - MC_HOST_minio
    - MEMCACHED_HOST
    - MEMCACHED_PORT
    - MONGO_URI
    - MYSQL_HOST
    - MYSQL_PWD
    - NOMAD_ADDR
    - OIDC_CA_CERT
    - PGDATABASE
    - PGHOST
    - PGPASSWORD
    - PGUSER
    - PROM_URL
    - RABBITMQ_ERLANG_COOKIE
    - RABBITMQ_NODENAME
    - REDISCLI_AUTH
    - SNMP_COMMUNITY
    - SNMP_VERSION
    - TYPESENSE_API_KEY
    - TYPESENSE_URL
    - TF_DIR
    - TF_STATE_CANDIDATE_DIR
    - VAULT_ADDR
    - VAULT_TOKEN
    - VL_URL
    - VM_URL
