schema_version: 1

runner:
  group: pack-tests
  labels:
    purpose: ci

cloud:
  url: wss://does-not-connect.invalid/runner/v1
  enrollment_key_env: EMISAR_ENROLLMENT_KEY
  token_path: /tmp/emisar-test/token
  heartbeat_every: 30s
  reconnect_min: 1s
  reconnect_max: 60s

paths:
  data_dir: /tmp/emisar-test/data
  packs:
    - /packs

events:
  jsonl_path: /tmp/emisar-test/events.jsonl

execution:
  # The executor scrubs the action env to PATH/LANG/LC_ALL/TERM by default, so
  # every credential/endpoint var supplied by a pack's cases.yaml must be
  # allowlisted here or the action gets a silent "auth missing".
  inherit_env:
    - AIRFLOW_API_TOKEN
    - AIRFLOW_PASSWORD
    - AIRFLOW_URL
    - AIRFLOW_USERNAME
    - ARTIFACTORY_PASSWORD
    - ARTIFACTORY_TOKEN
    - ARTIFACTORY_URL
    - ARTIFACTORY_USER
    - AWS_ACCESS_KEY_ID
    - AWS_DEFAULT_REGION
    - AWS_ENDPOINT_URL
    - AWS_SECRET_ACCESS_KEY
    - BUNNY_API_KEY
    - BUNNY_CORE_API_BASE
    - BUNNY_LOGGING_API_BASE
    - BUNNY_ORIGIN_ERRORS_API_BASE
    - BUNNY_PACKTEST
    - CADDY_ACCESS_LOG
    - CADDY_ADMIN
    - CF_API_BASE
    - CF_API_TOKEN
    - CF_PACKTEST
    - CF_PURGE_URL
    - CH_HOST
    - CH_PASSWORD
    - CH_USER
    - COCKROACH_URL
    - CONSUL_HTTP_ADDR
    - DOCKER_HOST
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_BIGQUERY
    - CLOUDSDK_API_ENDPOINT_OVERRIDES_CERTIFICATEMANAGER
