# Shared action-client container for pack-owned behavior projects.
#
# Each packs/<name>/test/compose.yaml adds only that pack's disposable system
# under test. The devtool combines both files under a unique Compose project.
services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/dev/test-packs
      dockerfile: Dockerfile
    image: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
    user: ${PACKTEST_RUNNER_USER:-65532:65532}
    environment:
      HOME: /tmp/packtest
    volumes:
      - ${EMISAR_ROOT}/dev/test-packs/test-config.yaml:/workspace/test-packs/test-config.yaml:ro
      - ${EMISAR_ROOT}/packs:/packs:ro
      - ${EMISAR_ROOT}/dev/test-packs/bin:/opt/emisar/bin:ro
      - ${EMISAR_ROOT}/dev/test-packs/reports:/reports
