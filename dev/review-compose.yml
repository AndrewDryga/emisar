# Minimal dependency stack for Coop's disposable publication-review candidate.
services:
  db:
    # Same digest as docker-compose.yml; this stack decides whether a PR opens.
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emisar_test
    expose: ["5432"]
    labels:
      coop.service.scheme: postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emisar_test"]
      interval: 2s
      timeout: 3s
      retries: 20
