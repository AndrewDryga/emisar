schema_version: 1

# Minimal ordinary runner for the signed-dispatch e2e's published-runbook leg.
# It advertises only the linux-core pack that morning-edge-readiness actually
# executes; the interactive demo keeps its broad edge host catalog in
# edge-fra-01.yaml. The runbook targets `group:edge-web`, so this enrolls under
# its OWN id rather than adopting the seeded edge-fra-01 row: sharing that id
# meant `docker compose --profile test up -d` — the obvious manual command —
# brought up two live connections claiming one runner row. DEV ONLY.
runner:
  id: "runbook-edge-01"
  group: "edge-web"
  labels:
    env: prod
    region: eu-central
    role: edge

cloud:
  url: "http://portal:4000"
  allow_insecure: true
  enrollment_key_env: "EMISAR_ENROLLMENT_KEY"
  token_path: "/var/lib/emisar/token.json"
  heartbeat_every: "30s"
  reconnect_min: "1s"
  reconnect_max: "30s"

paths:
  data_dir: "/var/lib/emisar"
  packs:
    - "/opt/emisar/packs/linux-core"

execution:
  inherit_env: ["PATH", "LANG", "LC_ALL", "TERM"]
  cancel_grace: "30s"

events:
  jsonl_path: "/var/log/emisar/events.jsonl"
  max_size_bytes: 104857600
  max_backups: 5

redaction:
  rules: []
