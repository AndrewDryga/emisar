schema_version: 1
id: iscsi.session_detail
title: iscsiadm -m session -P 3
kind: exec
risk: low
description: >
  Show full per-session detail at print level 3 — target IQN, portal, session
  and connection state, negotiated parameters, and the attached SCSI disks.
  Returns nothing and succeeds when there are no active sessions (iscsiadm
  exits 21 in that case, which is treated as success, not failure).
side_effects: ["One iscsiadm read.", "Read-only."]
search_terms:
  - missing lun
args: []
execution:
  command: {binary: iscsiadm, argv: ["-m", "session", "-P", "3"]}
  timeout: 30s
  # iscsiadm exits 21 (ISCSI_ERR_NO_OBJS_FOUND, "No active sessions.") on a
  # healthy host with nothing attached, as iscsi.sessions does.
  success_exit_codes: [21]
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Detailed session view
    args: {}
