schema_version: 1
id: iscsi.nodes
title: iscsiadm -m node
kind: exec
risk: low
description: >
  List configured / discovered target nodes in the initiator database.
  Returns nothing and succeeds when the database has no records (iscsiadm
  exits 21, "No records found", which is treated as success, not failure).
side_effects: ["One iscsiadm read.", "Read-only."]
args: []
execution:
  command: {binary: iscsiadm, argv: ["-m", "node"]}
  timeout: 15s
  # iscsiadm exits 21 (ISCSI_ERR_NO_OBJS_FOUND) when no node record exists.
  # A non-root caller that cannot read the database fails instead (open-iscsi
  # 2.1.8: exit 6 on the database lock, or 1 on the node directory).
  success_exit_codes: [21]
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: List target nodes
    args: {}
