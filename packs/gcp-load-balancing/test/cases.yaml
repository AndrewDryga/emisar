services: [gcp-api]
versions:
  - version: 587.0.0-slim
    digest: "@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f"
    default: true
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_COMPUTE: http://gcp-api:8080/compute/v1/
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-access-token-f165
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-lb-secret-c3a7]
cases:
  - action: gcp.backend_services
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-backend, harness-neg, X-Harness-Request]
      json:
        /0/enableCdn: true
        /0/cdnPolicy/cacheMode: CACHE_ALL_STATIC
        /1/enableCdn: false
        /2/enableCdn: null
  - action: gcp.backend_service_describe
    args: {project: example-prod, backend_service: harness-backend, scope: global}
    expect:
      stdout_contains: [harness-backend, harness-neg, X-Harness-Request]
      json:
        /enableCdn: true
        /cdnPolicy/cacheMode: CACHE_ALL_STATIC
  - name: gcp.backend_service_describe-cdn-disabled
    action: gcp.backend_service_describe
    args: {project: example-prod, backend_service: harness-backend-cdn-disabled, scope: global}
    expect:
      json:
        /name: harness-backend-cdn-disabled
        /enableCdn: false
  - name: gcp.backend_service_describe-cdn-missing
    action: gcp.backend_service_describe
    args: {project: example-prod, backend_service: harness-backend-cdn-missing, scope: global}
    expect:
      json:
        /name: harness-backend-cdn-missing
        /enableCdn: null
  - action: gcp.backend_health
    args: {project: example-prod, backend_service: harness-backend, scope: global}
    expect:
      stdout_contains: [HEALTHY, 10.20.0.10]
  - action: gcp.health_checks
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-health, /readyz]
  - action: gcp.url_maps
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-map, /api/*, headerActionPresent]
  - action: gcp.http_proxies
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-http, harness-map]
  - action: gcp.https_proxies
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-https, harness-cert]
  - action: gcp.forwarding_rules
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-forwarding-rule, 203.0.113.20]
  - action: gcp.network_endpoint_groups
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-neg, GCE_VM_IP_PORT]
