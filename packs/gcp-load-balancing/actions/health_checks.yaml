schema_version: 1
id: gcp.health_checks
title: gcloud compute health-checks list
kind: script
risk: low
description: List bounded health-check probes, timing, thresholds, and logging state.
side_effects: ["Read-only Compute Engine API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum health checks to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/load_balancing.sh, interpreter: /bin/sh}
  argv: [health-checks, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 16384
examples:
  - title: Project health checks
    args: {project: example-prod}
