schema_version: 1
id: gcp.backend_service_describe
title: gcloud compute backend-services describe
kind: script
risk: low
description: Show one backend service without IAP secrets, AWS-auth keys, or header values.
side_effects: ["One read-only Compute Engine API call.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: backend_service
    type: string
    required: true
    description: Backend service name.
    validation: {pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$", max_length: 63}
  - name: scope
    type: string
    required: true
    description: Backend service scope.
    validation: {enum: [global, region]}
  - name: location
    type: string
    required: false
    default: ""
    description: Region for region scope; empty for global.
    validation: {pattern: "^([a-z0-9][a-z0-9-]{0,62})?$", max_length: 63}
execution:
  script: {path: scripts/load_balancing.sh, interpreter: /bin/sh}
  argv: [backend-service-describe, "{{ args.project }}", "{{ args.backend_service }}", "{{ args.scope }}", "{{ args.location }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Global application backend
    args: {project: example-prod, backend_service: app, scope: global}
