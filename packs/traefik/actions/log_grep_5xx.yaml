schema_version: 1
id: traefik.log_grep_5xx
title: Recent 5xx responses from access log
kind: exec
risk: low
description: >
  Greps the Traefik access log for 5xx responses and tails the most recent —
  the front-door view of backend failures. Matches both the JSON format
  (DownstreamStatus field) and the default CLF format. Needs an access log on
  disk, which Traefik writes only when accessLog.filePath is set; when it logs
  to stdout instead, query whichever log store collects it. Read-only.
side_effects:
  - Reads the Traefik access log.
  - Read-only.
search_terms:
  - internal server error
  - bad gateway
  - 500 errors
  - 502 errors
args:
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many recent 5xx lines to return.
    validation:
      min: 1
      max: 5000
  - name: log_path
    type: string
    required: false
    description: >
      Access log path. Omit to use $TRAEFIK_ACCESS_LOG, else
      /var/log/traefik/access.log. Constrained to /var/log/traefik — a host
      whose logs live elsewhere declares that in TRAEFIK_ACCESS_LOG, which
      only the host administrator can set.
    validation:
      pattern: "^/var/log/traefik/[A-Za-z0-9._/-]{1,128}$"
      # The pattern constrains lexical shape but NOT `..` — `.` and `/` are
      # literal charset members. allowed_prefixes runs the runner's Clean+EvalSymlinks
      # containment, collapsing any `../` escape to its real path and rejecting
      # anything outside the traefik log dir.
      allowed_prefixes:
        - /var/log/traefik
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Path precedence: the caller's arg (contained to /var/log/traefik) wins,
      # else the host administrator's TRAEFIK_ACCESS_LOG, else the default.
      # The env is deliberately NOT arg-validated — only root can set it, and
      # anyone who can already reads the file directly.
      # The pipeline exits with tail's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "no 5xx".
      - |
        log="$1"
        [ -n "$log" ] || log="${TRAEFIK_ACCESS_LOG:-/var/log/traefik/access.log}"
        [ -r "$log" ] || { echo "access log not readable: $log" >&2; exit 1; }
        grep -E '("DownstreamStatus":5[0-9][0-9]| 5[0-9][0-9] )' "$log" | tail -n {{ args.lines }}
      - "emisar"
      - "{{ args.log_path? }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Last 100 5xx
    args: {}
