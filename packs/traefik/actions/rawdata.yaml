schema_version: 1
id: traefik.rawdata
title: GET /api/rawdata
kind: script
risk: high
description: >
  Dump the complete dynamic configuration as Traefik currently sees it — all
  routers, services, and middlewares across HTTP/TCP/UDP, each with its
  errors, plus the "usedBy" dependency graph tying routers to services and
  middlewares. The single most complete read for "what is the actual live
  config and what depends on what?". Larger than the per-kind endpoints.
  Middleware config is operator-authored and can carry secrets (basicAuth /
  digestAuth user hashes, injected upstream auth headers, forwardAuth
  targets). The runner's redaction is a fail-closed backstop, not a
  guarantee — it is pattern-bound and can miss a bespoke secret whose name
  and value match no rule.
side_effects:
  - One read-only HTTP GET to the Traefik API.
  - Read-only, but exposes the full dynamic config (may include secrets).
args: []
execution:
  script:
    path: scripts/trget.sh
    interpreter: /bin/sh
  argv:
    - "/api/rawdata"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 8388608
  max_stderr_bytes: 8192
examples:
  - title: Full live dynamic config + dependency graph
    args: {}
