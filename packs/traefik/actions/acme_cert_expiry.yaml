schema_version: 1
id: traefik.acme_cert_expiry
title: ACME certificate expiry (from acme.json)
kind: exec
risk: low
description: >
  Show each ACME/Let's Encrypt certificate in acme.json with its domain and
  notAfter expiry date. Decodes only the public certificate (base64 PEM)
  through openssl — never touches the private key. Traefik auto-renews 30 days
  out, so anything closer than that which is NOT renewing is the thing to
  investigate. Read-only.
side_effects:
  - Reads the acme.json storage file (public certificate fields only).
  - Read-only.
search_terms:
  - expired
  - expiring soon
  - renewal failed
args:
  - name: acme_path
    type: string
    required: false
    default: /etc/traefik/acme.json
    description: Path to Traefik's ACME storage file.
    validation:
      pattern: "^/[A-Za-z0-9._/-]{1,256}$"
      # The pattern constrains lexical shape but NOT `..` (`.`/`/` are
      # literal charset members). allowed_prefixes runs the runner's
      # Clean+EvalSymlinks containment, scoping the read to Traefik's own ACME
      # storage dirs so this can't become an arbitrary-file read oracle.
      allowed_prefixes:
        - /etc/traefik
        - /letsencrypt
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A missing or malformed acme.json made jq fail into a pipeline whose exit
      # is the while-loop's, so "cannot read the cert store" and "no certificates
      # issued" were the same empty success. The inner 2>/dev/null pair is
      # different and stays: it is a per-certificate fallback that already
      # reports itself as <unreadable>.
      - |
        [ -r "$1" ] || { echo "acme storage not readable: $1" >&2; exit 1; }
        entries=$(jq -r 'to_entries[].value.Certificates[]? | "\(.domain.main) \(.certificate)"' "$1") || exit 1
        printf '%s\n' "$entries" | while read -r dom cert; do exp=$(printf '%s' "$cert" | base64 -d 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2); printf '%s\texpires %s\n' "$dom" "${exp:-<unreadable>}"; done
      - "emisar"
      - "{{ args.acme_path }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Per-domain cert expiry
    args: {}
