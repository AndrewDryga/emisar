services: [traefik, traefik-metrics-response]
versions:
  - version: v3.7.13
    digest: "@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259"
    default: true
secret_env: [TRAEFIK_BASICAUTH]
inherit_env: [TRAEFIK_METRICS_URL, TRAEFIK_PING_URL, TRAEFIK_URL, TRAEFIK_BASICAUTH]
env:
  TRAEFIK_URL: http://127.0.0.1:8080
  TRAEFIK_PING_URL: http://127.0.0.1:8082
  TRAEFIK_BASICAUTH: reader:packtest-canary-traefik-metrics-password-710a
defaults:
  expect:
    stdout_not_contains: [packtest-canary-traefik-metrics-password-710a, packtest-canary-traefik-error-secret-6f8d]
    stderr_not_contains: [packtest-canary-traefik-metrics-password-710a, packtest-canary-traefik-error-secret-6f8d]
cases:
  - name: traefik.metrics-busy-scrape-is-bounded
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/large"}
    expect:
      stdout_contains: ["traefik_config_last_reload_success 1", "returned=200 matching=12002 omitted=11802 skipped_buckets=1000", "truncated=true"]
      stdout_not_contains: ['service="busy-198@file"', "_bucket{"]
  - name: traefik.metrics-literal-prefix
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/large"}
    args: {metric_prefix: traefik_service_requests_total, max_samples: 3}
    expect:
      stdout_contains: ['service="busy-2@file"', "returned=3 matching=12000 omitted=11997"]
      stdout_not_contains: [traefik_config_reloads_total, 'service="busy-3@file"']
  - name: traefik.metrics-histogram-buckets-optional
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/small"}
    args: {include_buckets: true}
    expect:
      stdout_contains: ['_bucket{le="+Inf"} 4', "returned=6 matching=6 omitted=0 skipped_buckets=0"]
      stdout_not_contains: [go_goroutines]
  - name: traefik.metrics-empty-prefix-selects-all
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/small"}
    args: {metric_prefix: ""}
    expect:
      stdout_contains: ["go_goroutines 7", "returned=5 matching=5 omitted=0 skipped_buckets=2"]
  - name: traefik.metrics-no-matching-samples
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/small"}
    args: {metric_prefix: absent_}
    expect:
      stdout_contains: ["returned=0 matching=0 omitted=0 skipped_buckets=0", "truncated=false"]
      stdout_not_contains: [traefik_config_reloads_total]
  - name: traefik.metrics-whole-sample-byte-budget
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/long-samples"}
    args: {max_samples: 2000}
    expect:
      stdout_contains: ['id="3"', "returned=4 matching=10 omitted=6", "truncated=true"]
      stdout_not_contains: ['id="4"']
  - name: traefik.metrics-basic-auth
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/auth"}
    expect:
      stdout_contains: ["traefik_config_reloads_total 3", "returned=4 matching=4 omitted=0 skipped_buckets=2"]
  - name: traefik.metrics-auth-failure
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/auth"}
    unset_env: [TRAEFIK_BASICAUTH]
    expect: {status: failure, exit: [22], stdout_not_empty: false, stderr_contains: ["curl: (22)"]}
  - name: traefik.metrics-upstream-error-has-no-samples
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/http-error"}
    expect: {status: failure, exit: [22], stdout_not_empty: false, stderr_contains: ["curl: (22)"]}
  - name: traefik.metrics-partial-scrape-has-no-samples
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/partial"}
    expect: {status: failure, exit: [18], stdout_not_empty: false, stderr_contains: ["curl: (18)"]}
  - name: traefik.metrics-slow-scrape-has-no-samples
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/slow"}
    expect: {status: failure, exit: [28], stdout_not_empty: false, stderr_contains: ["curl: (28)"]}
  - name: traefik.metrics-reject-oversized-without-length
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/oversized"}
    expect: {status: failure, exit: [1], stdout_not_empty: false, stderr_contains: ["exceeded 8 MiB"]}
  - name: traefik.metrics-reject-invalid-exposition
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/invalid"}
    expect: {status: failure, exit: [1], stdout_not_empty: false, stderr_contains: ["invalid Prometheus samples"]}
  - name: traefik.metrics-reject-shell-metacharacters
    action: traefik.metrics
    env: {TRAEFIK_METRICS_URL: "http://traefik-metrics-response:8080/small"}
    args: {metric_prefix: "traefik_;echo injected"}
    expect: {status: failure, reason: argument_invalid, error_contains: ["must match pattern"], stdout_not_empty: false}
    probes:
      - argv: [/bin/sh, -c, "curl -fsS http://traefik-metrics-response:8080/stats | jq -e '.metrics_requests == 0'"]
        expect: {stdout_contains: ["true"]}
  - name: traefik.metrics-reject-regex-prefix
    action: traefik.metrics
    args: {metric_prefix: "traefik_.*"}
    expect: {status: failure, reason: argument_invalid, error_contains: ["must match pattern"], stdout_not_empty: false}
  - name: traefik.metrics-reject-too-many-samples
    action: traefik.metrics
    args: {max_samples: 2001}
    expect: {status: failure, reason: argument_invalid, stdout_not_empty: false}
  - name: traefik.metrics-reject-zero-samples
    action: traefik.metrics
    args: {max_samples: 0}
    expect: {status: failure, reason: argument_invalid, stdout_not_empty: false}
  - name: traefik.metrics-separated-entrypoint
    action: traefik.metrics
    env:
      TRAEFIK_METRICS_URL: http://127.0.0.1:9080
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics) || exit $?
            [ "$code" = 404 ] || exit 1
            metrics=$(curl -fsS http://127.0.0.1:9080/metrics) || exit $?
            printf '%s' "$metrics" | grep -F 'traefik_config_reloads_total' >/dev/null
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: [traefik_config_reloads_total, traefik_config_last_reload_success]
  - name: traefik.metrics-falls-back-to-base-url
    action: traefik.metrics
    env:
      TRAEFIK_URL: http://127.0.0.1:9080
    unset_env: [TRAEFIK_METRICS_URL]
    expect:
      stdout_contains: [traefik_config_reloads_total]
  - name: traefik.metrics-http-error
    action: traefik.metrics
    env:
      TRAEFIK_METRICS_URL: http://127.0.0.1:9080/does-not-exist
    expect:
      status: failure
      exit: [22]
      stderr_contains: ["curl: (22)"]
  - name: traefik.http_services-includes-second-page
    action: traefik.http_services
    arrange: &complete_inventory
      - argv: [/bin/sh, /packs/traefik/test/fixtures/check_inventory.sh]
        retry_for: 15s
        retry_every: 200ms
    expect:
      stdout_contains: ['"name":"zz-late-healthy@file"', '"name":"zz-late-down@file"']
      stdout_not_contains: ['[REDACTED]']
  - name: traefik.http_routers-includes-second-page
    action: traefik.http_routers
    arrange: *complete_inventory
    expect:
      stdout_contains: ['"name":"zz-late-healthy@file"', '"name":"zz-late-down@file"']
  - name: traefik.http_services_summary-includes-second-page
    action: traefik.http_services_summary
    arrange: *complete_inventory
    expect:
      stdout_contains: ['"name":"zz-late-healthy@file"', '"name":"zz-late-down@file"']
  - name: traefik.http_services_summary-unhealthy-second-page
    action: traefik.http_services_summary
    args: {only_unhealthy: true}
    arrange: *complete_inventory
    expect:
      stdout_contains: ['"name":"zz-late-down@file"']
      stdout_not_contains: ['"name":"zz-late-healthy@file"']
  - name: traefik.http_host_readiness-healthy-second-page
    action: traefik.http_host_readiness
    args: {host: latehealthy.packtest.example}
    arrange: *complete_inventory
    expect:
      json:
        /ready: true
        /router/name: zz-late-healthy@file
        /service/name: zz-late-healthy@file
        /backends/up: 1
        /failures: []
  - name: traefik.http_host_readiness-down-second-page
    action: traefik.http_host_readiness
    args: {host: latedown.packtest.example}
    arrange: *complete_inventory
    expect:
      json:
        /ready: false
        /router/name: zz-late-down@file
        /service/name: zz-late-down@file
        /backends/down: 1
        /failures: [no_up_backends]
  - action: traefik.version
    expect:
      stdout_contains: ['"Version":"3.7.13"']
  - action: traefik.ping
    expect:
      stdout_contains: [OK]
  - name: traefik.ping-http-error
    action: traefik.ping
    env:
      TRAEFIK_PING_URL: http://127.0.0.1:8080/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]

  # rawdata and http_middlewares are approval-gated because they hand back the
  # operator's own middleware config. The evidence that earns that tier is the
  # leak itself: the file provider's basicAuth user hash and the upstream
  # Authorization header it injects both come back in cleartext.
  - action: traefik.http_middlewares
    expect:
      stdout_contains:
        - packtest-auth@file
        - '$apr1$pAcKtEsT$'
        - packtest-traefik-upstream-header

  - action: traefik.rawdata
    expect:
      stdout_contains:
        - packtest-router@file
        - packtest-service@file
        - '$apr1$pAcKtEsT$'

  - action: traefik.http_services_summary
    arrange: &backend_down
      - argv: [/bin/sh, -c, 'curl -fsS http://127.0.0.1:8080/api/http/services | jq -e ''any(.[]; .name == "packtest-service@file" and .serverStatus["http://127.0.0.1:9999"] == "DOWN")''']
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: ['"name":"packtest-service@file"', '"down_servers":["http://127.0.0.1:9999"]']
      stdout_not_contains: ['[REDACTED]']

  - name: traefik.http_services-preserves-pathless-backend-and-provider-name
    action: traefik.http_services
    arrange: *backend_down
    expect:
      stdout_contains: ['"name":"packtest-service@file"', '"url":"http://127.0.0.1:9999"', '"http://127.0.0.1:9999":"DOWN"']
      stdout_not_contains: ['[REDACTED]']

  # The summary pipes an API read into jq, and jq exits 0 on empty stdin — so
  # before the capture, a 404 (an API that is down, moved, or 401-ing) returned
  # a successful empty summary that reads as "every service is healthy".
  - name: traefik.http-services-summary-fails-when-the-api-errors
    action: traefik.http_services_summary
    env:
      TRAEFIK_URL: http://127.0.0.1:8080/does-not-exist
    expect:
      status: failure
      exit: [22]
      stderr_contains: ["curl: (22)"]
