# A file provider, so the API answers with a real operator-authored middleware
# instead of only Traefik's internal ones. The basicAuth user hash and the
# injected upstream header are exactly what traefik.rawdata and
# traefik.http_middlewares hand back verbatim, which is why both are
# approval-gated — the cases assert that exposure rather than assume it.
# The apr1 hash is `openssl passwd -apr1` over "packtest-traefik-basicauth".
http:
  routers:
    packtest-router:
      rule: "Host(`packtest.example`)"
      service: packtest-service
      middlewares:
        - packtest-auth
        - packtest-upstream-header
