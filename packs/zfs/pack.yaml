schema_version: 1
id: zfs
name: ZFS pool + dataset operations
version: 0.1.13
retired_below: 0.1.9
description: >
  Pool status, dataset inventory, snapshot listing, scrub status, ARC
  stats, plus operator surface for storage incident response: scrub
  start/stop, clear pool errors, take/destroy snapshots, dataset
  rollback.
vendor: emisar
homepage: https://emisar.dev/packs/zfs

requires:
  os: [linux]
  binaries: [zpool, zfs]

setup:
  summary: >
    Operates on the ZFS pools of the local runner host — no credentials
    needed.
  notes:
    - "Status/list/iostat reads work as any user that can run zpool/zfs."
  host_access:
    - actions:
        - zfs.start_scrub
        - zfs.take_snapshot
        - zfs.scrub_stop
        - zfs.clear_pool_errors
        - zfs.snapshot_destroy
        - zfs.dataset_rollback
      requirement: Change ZFS pool and dataset state as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-zfs-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. ZFS mutations can destroy
            snapshots, roll datasets back, or change pool recovery state.
  verify: zfs.pool_list

actions:
  - actions/pool_list.yaml
  - actions/pool_status.yaml
  - actions/pool_iostat.yaml
  - actions/dataset_list.yaml
  - actions/snapshot_list.yaml
  - actions/properties.yaml
  - actions/arc_stats.yaml
  - actions/start_scrub.yaml
  - actions/take_snapshot.yaml
  - actions/scrub_stop.yaml
  - actions/clear_pool_errors.yaml
  - actions/snapshot_destroy.yaml
  - actions/dataset_rollback.yaml
