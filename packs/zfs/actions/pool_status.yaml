schema_version: 1
id: zfs.pool_status
title: zpool status -v
kind: exec
risk: low
description: Show per-pool vdev tree, scrub state, errors. Use to debug DEGRADED pools.
side_effects: ["Reads pool metadata.", "Read-only."]
args:
  - name: pool
    type: string
    required: false
    default: ""
    description: Specific pool (empty = all).
    validation:
      # OpenZFS pool_namecheck: a leading letter, then letters, digits, `_`,
      # `-`, `.`, `:` or space, under 240 bytes. The same pattern guards every
      # pool argument in this pack.
      pattern: "^([A-Za-z][A-Za-z0-9_.:\\- ]{0,238})?$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ -z \"${1}\" ]; then zpool status -v; else zpool status -v \"${1}\"; fi"
      - "emisar"
      - "{{ args.pool }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: All pools
    args: {}
