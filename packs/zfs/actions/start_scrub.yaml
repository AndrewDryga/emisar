schema_version: 1
id: zfs.start_scrub
title: zpool scrub <pool>
kind: exec
risk: high
description: Start a scrub on one pool. Re-reads every block and verifies checksums.
side_effects:
  - Heavy disk read load for hours-to-days.
  - Pool stays online; IO latency increases.
args:
  - name: pool
    type: string
    required: true
    description: Pool name.
    validation:
      # OpenZFS pool_namecheck: a leading letter, then letters, digits, `_`,
      # `-`, `.`, `:` or space, under 240 bytes. The same pattern guards every
      # pool argument in this pack.
      pattern: "^[A-Za-z][A-Za-z0-9_.:\\- ]{0,238}$"
execution:
  command: {binary: zpool, argv: ["scrub", "{{ args.pool }}"]}
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Start scrub
    args:
      pool: "tank"
