# These need a real pool, and a pool needs the zfs kernel module, which no
# container can load and which neither this workstation's kernel nor a GitHub
# runner's carries. Unlike most of this file's exceptions, no lane we could
# build changes this one — it wants a machine with ZFS installed.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    zfs.clear_pool_errors: requires_privileged_host
    zfs.dataset_rollback: requires_privileged_host
    zfs.snapshot_destroy: requires_privileged_host
    zfs.start_scrub: requires_privileged_host
