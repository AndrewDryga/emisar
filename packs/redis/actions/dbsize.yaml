schema_version: 1

id: redis.dbsize
title: DBSIZE
kind: script
risk: low

description: >
  Count the keys in the currently selected database. O(1).
  Read-only. Use as a sanity check before running operations that scan
  the keyspace.

side_effects:
  - Issues one DBSIZE command.
  - No keys read or written.

search_terms:
  - key count
  - how many keys

args:
  - name: db
    type: integer
    required: false
    default: 0
    description: >-
      Logical database index. The server's `databases` setting (16 by default) is
      the real limit; Redis refuses an index it does not have.
    validation:
      min: 0
      # Redis caps `databases` at INT_MAX, so INT_MAX - 1 is the highest
      # index any server can have.
      max: 2147483646

execution:
  script: {path: scripts/redis_cli.sh, interpreter: /bin/sh}
  argv:
    - "-n"
    - "{{ args.db }}"
    - "DBSIZE"
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192

examples:
  - title: Key count in DB 0
    args: {}
