schema_version: 1
id: redis.acl_getuser
title: ACL GETUSER
kind: exec
risk: medium
description: >
  Get the full rule listing for one ACL user — categories, commands, key
  patterns, channel patterns, flags. Read-only.
side_effects:
  - One ACL GETUSER command.
  - Read-only.
args:
  - name: username
    type: string
    required: true
    description: ACL username.
    validation:
      pattern: "^[A-Za-z0-9_][A-Za-z0-9_\\-]{0,63}$"
execution:
  command:
    binary: redis-cli
    argv: ["ACL", "GETUSER", "{{ args.username }}"]
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  redact:
    # ACL GETUSER returns each hash as a BARE 64-hex digest on its own line under
    # `passwords`. The `#` prefix is ACL rule-DSL syntax and appears only in ACL
    # LIST, so a rule requiring it never fired here. Verified against redis
    # 8.8.0. Optional `#` so both replies are covered by one rule.
    - name: redis-acl-password-hash
      type: regex
      pattern: '#?\b[0-9A-Fa-f]{64}\b'
      replacement: '[REDACTED ACL HASH]'
examples:
  - title: Inspect "metrics" user
    args:
      username: "metrics"
