schema_version: 1
id: redis.cluster_check
title: redis-cli --cluster check
kind: script
risk: low
description: >
  Run `redis-cli --cluster check` from the local Redis entry point at
  127.0.0.1:6379 — verifies slot coverage, master/replica health, and epoch
  consistency. Use after any topology change.
side_effects:
  - Talks to every cluster node briefly.
  - Read-only.
execution:
  script: {path: scripts/redis_cli.sh, interpreter: /bin/sh}
  argv: ["--cluster", "check", "127.0.0.1:6379"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 16384
examples:
  - title: Local cluster check
    args: {}
