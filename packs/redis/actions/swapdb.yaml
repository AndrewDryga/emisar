schema_version: 1
id: redis.swapdb
title: SWAPDB
kind: script
risk: high
description: >
  Atomically swap the contents of two logical databases. Clients
  connected to db i now see db j and vice versa. Used for
  blue/green cache rebuilds. Wrong indices flip live traffic to a
  stale dataset.
side_effects:
  - Two databases exchange visible contents atomically.
  - Connected clients immediately see the swapped dataset.
args:
  - name: i
    type: integer
    required: true
    description: >-
      First database index. The server's `databases` setting (16 by default) is
      the real limit; Redis refuses an index it does not have.
    validation:
      min: 0
      # Redis caps `databases` at INT_MAX, so INT_MAX - 1 is the highest
      # index any server can have.
      max: 2147483646
  - name: j
    type: integer
    required: true
    description: >-
      Second database index. The server's `databases` setting (16 by default) is
      the real limit; Redis refuses an index it does not have.
    validation:
      min: 0
      # Redis caps `databases` at INT_MAX, so INT_MAX - 1 is the highest
      # index any server can have.
      max: 2147483646
execution:
  script: {path: scripts/redis_cli.sh, interpreter: /bin/sh}
  argv: ["SWAPDB", "{{ args.i }}", "{{ args.j }}"]
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Swap into rebuild slot
    args:
      i: 0
      j: 1
