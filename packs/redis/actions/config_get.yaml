schema_version: 1

id: redis.config_get
title: CONFIG GET
kind: exec
risk: medium

description: >
  Read runtime config by glob pattern. Useful before any tuning
  conversation: confirm `maxmemory`, `maxmemory-policy`, `appendonly`,
  `save`, etc. Read-only. Pattern is restricted to safe globs against
  Redis config keys. Credential values are masked in the output — the key
  stays visible so you can see it is set.

side_effects:
  - Issues one CONFIG GET command.
  - No keys read or written.
  - Read-only, but the default `*` pattern returns the whole server config.
  - Redis owns this key space, so its credential keys are enumerable rather
    than guessed at. On 7.4.10 they are requirepass, masterauth,
    tls-key-file-pass and tls-client-key-file-pass.
  - Every one of those ends in a suffix the redaction rule matches. The near
    misses (masteruser, tls-key-file, tls-auth-clients) are a username, a path
    and a mode, not secrets.
  - That established coverage is why this is medium. A config that operators
    author as free text, like an nginx or Caddy dump, cannot claim it and
    stays high.

args:
  - name: pattern
    type: string
    required: false
    default: "*"
    description: Glob pattern (e.g. "maxmemory*", "save", "*").
    validation:
      pattern: "^[a-zA-Z0-9_*?][a-zA-Z0-9_\\-*?]{0,63}$"

execution:
  command:
    binary: redis-cli
    argv:
      - "CONFIG"
      - "GET"
      - "{{ args.pattern }}"
  timeout: 10s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
  redact:
    # CONFIG GET prints alternating key\nvalue lines; the secret config keys
    # would otherwise leak in cleartext. Mask the value line, keep the key line
    # so the operator still sees the key is set. Replacement needs a real
    # newline → YAML "\n".
    #
    # Match any key ENDING in a credential word rather than naming the two
    # Redis spellings: redis-cli drives Valkey unchanged, and Valkey renamed
    # masterauth to primaryauth — which the old allowlist printed in the clear.
    - name: redis-secret-config-value
      type: regex
      pattern: "(?im)^([a-z][a-z0-9_-]*(pass|auth|secret|key))\\n[^\\n]*"
      replacement: "${1}\n[REDACTED]"

examples:
  - title: Memory-related config
    args:
      pattern: "maxmemory*"
  - title: All persistence settings
    args:
      pattern: "save"
