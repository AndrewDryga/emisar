services: [redis]
versions:
  - version: "8.8.0"
    digest: "@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b"
    default: true
  - version: "7.4.2"
    digest: "@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9"
risk_accountability:
  mode: complete
  exceptions:
    redis.cluster_failover: requires_cluster
    redis.cluster_forget: requires_cluster
    redis.replicaof: requires_cluster
    redis.sentinel_failover: requires_cluster
    redis.sentinel_reset: requires_cluster
secret_env: [REDISCLI_AUTH]
env:
  REDISCLI_AUTH: packtest-canary-redis-c08d17
cases:
  # Both ACL reads emit SHA-256 password hashes, so each case provisions a user
  # with a known password and asserts its exact digest never reaches stdout.
  # Declaring a redaction rule only proves it compiles; nothing proved either
  # rule MATCHED, and acl_getuser's could not — ACL GETUSER returns a bare
  # digest while the rule required ACL LIST's `#` prefix.
  #
  # The digest is sha256("packtest-acl-secret"), computed outside the harness so
  # the assertion cannot be satisfied by the same code path that produces it.
  - action: redis.acl_list
    arrange:
      - name: provision an ACL user with a known password
        argv: [redis-cli, ACL, SETUSER, packtestacl, "on", ">packtest-acl-secret", "~t:*", +get]
    expect:
      stdout_contains: [user, default, "+@all", packtestacl, "[REDACTED ACL HASH]"]
      stdout_not_contains:
        - "7bb607cb8cb03eea0d0537e206a660fcddca975a24e72aee45a8c733aa63bcb1"

  - name: redis.acl-getuser-redacts-the-password-hash
    action: redis.acl_getuser
    args: {username: packtestacl}
    arrange:
      - name: provision an ACL user with a known password
        argv: [redis-cli, ACL, SETUSER, packtestacl, "on", ">packtest-acl-secret", "~t:*", +get]
    expect:
      stdout_contains: [passwords, "[REDACTED ACL HASH]", commands]
      stdout_not_contains:
        - "7bb607cb8cb03eea0d0537e206a660fcddca975a24e72aee45a8c733aa63bcb1"

  - action: redis.acl_whoami
    expect:
      stdout_contains: [default]
  - action: redis.client_list
    expect:
      stdout_contains: [addr=, cmd=client]
  - action: redis.command_stats
    expect:
      stdout_contains: [cmdstat]
  - name: redis.cluster_check-targets-local-instance
    action: redis.cluster_check
    expect:
      stdout_contains: [PACKTEST_REDIS_CLUSTER_TARGET, "127.0.0.1:6379"]
    probes:
      - argv: [cat, /tmp/packtest-redis-cluster-check-argv]
        expect:
          stdout_contains: ["--cluster check 127.0.0.1:6379"]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-redis-cluster-check-argv]
  - action: redis.config_get
    args: {pattern: maxmemory}
    expect:
      stdout_contains: [maxmemory]
  - action: redis.dbsize
    arrange:
      - argv: [redis-cli, SET, packtest:ready, "yes"]
    expect:
      stdout_contains: ["1"]
    cleanup:
      - argv: [redis-cli, DEL, packtest:ready]
  - action: redis.info
    args: {section: server}
    expect:
      stdout_contains: [redis_version, process_id]
  - action: redis.lastsave
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli LASTSAVE)" -gt 0 && echo valid-timestamp']
        expect:
          stdout_contains: [valid-timestamp]
  - action: redis.memory_doctor
    expect:
      stdout_contains: [memory]
  - action: redis.memory_stats
    expect:
      stdout_contains: [peak.allocated]
  - action: redis.memory_usage
    args: {key: "packtest:value"}
    arrange:
      - argv: [redis-cli, SET, "packtest:value", "fixture-value"]
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli MEMORY USAGE packtest:value)" -gt 0 && echo positive-bytes']
        expect:
          stdout_contains: [positive-bytes]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:value"]
  - action: redis.object_encoding
    args: {key: "packtest:value"}
    arrange:
      - argv: [redis-cli, SET, "packtest:value", "fixture-value"]
    expect:
      stdout_contains: [embstr]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:value"]
  - action: redis.object_idletime
    args: {key: "packtest:value"}
    arrange:
      - argv: [redis-cli, SET, "packtest:value", "fixture-value"]
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli OBJECT IDLETIME packtest:value)" -ge 0 && echo valid-idletime']
        expect:
          stdout_contains: [valid-idletime]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:value"]
  - action: redis.object_refcount
    args: {key: "packtest:value"}
    arrange:
      - argv: [redis-cli, SET, "packtest:value", "fixture-value"]
    expect:
      stdout_contains: ["1"]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:value"]
  - action: redis.randomkey
    arrange:
      - argv: [redis-cli, SET, "packtest:random", "fixture-value"]
    expect:
      stdout_contains: [packtest:random]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:random"]
  - action: redis.role
    expect:
      stdout_contains: [master]
  - name: redis.sentinel-is-master-down-preserves-election-state
    action: redis.sentinel_is_master_down
    args: {ip: 127.0.0.1, port: "6379"}
    arrange:
      - argv:
          - /bin/sh
          - -ec
          - >-
            redis-cli -p 26379 SENTINEL IS-MASTER-DOWN-BY-ADDR
            127.0.0.1 6379 7 1111111111111111111111111111111111111111 |
            tail -n 2 >/tmp/packtest-redis-sentinel-vote-before;
            attempts=0;
            until grep -q '^sentinel current-epoch 7$' /packtest-sentinel/election-state; do
              attempts=$((attempts + 1));
              test "$attempts" -lt 50;
              sleep 0.1;
            done;
            cat /packtest-sentinel/election-state >/tmp/packtest-redis-sentinel-epoch-before;
            test -s /tmp/packtest-redis-sentinel-vote-before;
            test "$(wc -l </tmp/packtest-redis-sentinel-epoch-before)" = 2
    expect:
      stdout_contains: ["0", "*"]
    probes:
      - name: action uses the fixed non-voting wire form
        argv:
          - /bin/sh
          - -ec
          - >-
            grep -Fqx -- '-p 26379 SENTINEL IS-MASTER-DOWN-BY-ADDR 127.0.0.1 6379 0 *'
            /tmp/packtest-redis-sentinel-argv;
            echo non-voting-argv
        expect:
          stdout_contains: [non-voting-argv]
      - name: current and leader epochs are unchanged
        argv:
          - /bin/sh
          - -ec
          - >-
            sleep 1;
            cat /packtest-sentinel/election-state >/tmp/packtest-redis-sentinel-epoch-after;
            test "$(cat /tmp/packtest-redis-sentinel-epoch-before)" =
            "$(cat /tmp/packtest-redis-sentinel-epoch-after)";
            echo epochs-unchanged
        expect:
          stdout_contains: [epochs-unchanged]
      - name: existing leader vote is unchanged
        argv:
          - /bin/sh
          - -ec
          - >-
            redis-cli -p 26379 SENTINEL IS-MASTER-DOWN-BY-ADDR
            127.0.0.1 6379 7 2222222222222222222222222222222222222222 |
            tail -n 2 >/tmp/packtest-redis-sentinel-vote-after;
            test "$(cat /tmp/packtest-redis-sentinel-vote-before)" =
            "$(cat /tmp/packtest-redis-sentinel-vote-after)";
            echo vote-unchanged
        expect:
          stdout_contains: [vote-unchanged]
    cleanup:
      - argv:
          - rm
          - -f
          - /tmp/packtest-redis-sentinel-argv
          - /tmp/packtest-redis-sentinel-vote-before
          - /tmp/packtest-redis-sentinel-vote-after
          - /tmp/packtest-redis-sentinel-epoch-before
          - /tmp/packtest-redis-sentinel-epoch-after
  - action: redis.scan
    args: {match: "packtest:*"}
    arrange:
      - argv: [redis-cli, SET, "packtest:scan", "fixture-value"]
    expect:
      stdout_contains: [packtest:scan]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:scan"]
  - action: redis.ttl_of
    args: {key: "packtest:ttl"}
    arrange:
      - argv: [redis-cli, SET, "packtest:ttl", "fixture-value", EX, "300"]
    probes:
      - argv: [/bin/sh, -c, 'ttl="$(redis-cli TTL packtest:ttl)"; test "$ttl" -gt 0 -a "$ttl" -le 300 && echo valid-ttl']
        expect:
          stdout_contains: [valid-ttl]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:ttl"]
  - action: redis.type_of
    args: {key: "packtest:value"}
    arrange:
      - argv: [redis-cli, SET, "packtest:value", "fixture-value"]
    expect:
      stdout_contains: [string]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:value"]
  - action: redis.xinfo_stream
    args: {key: "packtest:stream"}
    arrange:
      - argv: [redis-cli, XADD, "packtest:stream", "*", event, ready]
    expect:
      stdout_contains: [length, first-entry]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:stream"]
  - action: redis.xlen
    args: {key: "packtest:stream"}
    arrange:
      - argv: [redis-cli, XADD, "packtest:stream", "*", event, ready]
    expect:
      stdout_contains: ["1"]
    cleanup:
      - argv: [redis-cli, DEL, "packtest:stream"]
  - action: redis.config_set
    args: {parameter: maxmemory-policy, value: allkeys-lru}
    probes:
      - argv: [redis-cli, CONFIG, GET, maxmemory-policy]
        expect:
          stdout_contains: [allkeys-lru]
  - action: redis.client_kill
    args: {mode: ID}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            printf '%s\r\n' '*2' '$4' AUTH '$28' "$REDISCLI_AUTH" '*3' '$6' CLIENT '$7' SETNAME '$15' packtest-victim '*3' '$5' BLPOP '$14' packtest:never '$3' 120 >/tmp/packtest-redis-victim.req;
            nohup nc 127.0.0.1 6379 </tmp/packtest-redis-victim.req >/tmp/packtest-redis-victim.log 2>&1 &
    resolve_args:
      target:
        argv: [/bin/sh, -c, "redis-cli CLIENT LIST | sed -n 's/^id=\\([0-9][0-9]*\\).*name=packtest-victim .*/\\1/p'"]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: ["1"]
    probes:
      - argv: [/bin/sh, -c, "! redis-cli CLIENT LIST | grep -q 'name=packtest-victim ' && echo disconnected"]
        expect:
          stdout_contains: [disconnected]
  - action: redis.client_pause
    args: {ms: 1000}
    expect:
      stdout_contains: [OK]
    probes:
      - argv: [/bin/sh, -c, 'start=$(date +%s%3N); redis-cli PING >/dev/null; end=$(date +%s%3N); elapsed=$((end-start)); test "$elapsed" -ge 700 && echo "paused:${elapsed}ms"']
        expect:
          stdout_contains: [paused:]
  - action: redis.flush_db
    args: {db: 1, mode: SYNC}
    arrange:
      - argv: [redis-cli, -n, "1", SET, packtest:flushdb, present]
    probes:
      - argv: [redis-cli, -n, "1", DBSIZE]
        expect:
          stdout_contains: ["0"]
  - action: redis.flushall
    args: {mode: SYNC}
    arrange:
      - argv: [redis-cli, SET, packtest:flushall, present]
      - argv: [redis-cli, -n, "1", SET, packtest:flushall, present]
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli DBSIZE)" = 0 -a "$(redis-cli -n 1 DBSIZE)" = 0 && echo empty']
        expect:
          stdout_contains: [empty]
  - action: redis.shutdown_nosave
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli PING 2>&1; printf :$?)" != "PONG:0" && echo stopped']
        expect:
          stdout_contains: [stopped]
  - action: redis.swapdb
    args: {i: 0, j: 1}
    arrange:
      - argv: [redis-cli, SET, packtest:db, zero]
      - argv: [redis-cli, -n, "1", SET, packtest:db, one]
    probes:
      - argv: [/bin/sh, -c, 'test "$(redis-cli GET packtest:db)" = one -a "$(redis-cli -n 1 GET packtest:db)" = zero && echo swapped']
        expect:
          stdout_contains: [swapped]
