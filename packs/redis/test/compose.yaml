services:
  runner-tools:
    network_mode: service:redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${EMISAR_ROOT}/packs/redis/test/fixtures/redis-cli-spy.sh:/usr/local/bin/redis-cli:ro

  redis:
    image: redis:${PACKTEST_VERSION:-8.8.0}${PACKTEST_DIGEST-}
    command: redis-server --appendonly yes --requirepass packtest-canary-redis-c08d17
    environment:
      REDISCLI_AUTH: packtest-canary-redis-c08d17
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 10
