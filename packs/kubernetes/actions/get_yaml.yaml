schema_version: 1
id: kubernetes.get_yaml
title: Get resource YAML
kind: exec
risk: high
description: >
  Return the full YAML definition of one resource. The kind enum keeps secrets,
  configmaps and arbitrary CRDs of unknown size out, but that does not make the
  read safe: every workload kind serialises its pod template, so
  `containers[].env[].value` literals and the
  `kubectl.kubernetes.io/last-applied-configuration` annotation come back
  verbatim — injected credentials with them. Approval-gated for that reason;
  the runner's redaction is a pattern-bound backstop, not a guarantee.
side_effects:
  - One kubectl get invocation.
  - Read-only, but exposes container env literals (may include secrets).
args:
  - name: namespace
    type: string
    required: true
    description: Namespace.
    validation:
      pattern: "^[a-z0-9][a-z0-9\\-]{0,62}$"
  - name: kind
    type: string
    required: true
    description: Resource kind.
    validation:
      enum: [pod, deployment, statefulset, daemonset, service, ingress, pvc, hpa, cronjob, job]
  - name: name
    type: string
    required: true
    description: Resource name.
    validation:
      pattern: "^[a-z0-9][a-z0-9.\\-]{0,253}$"
  - name: context
    type: string
    required: false
    default: ""
    description: kubeconfig context.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{0,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "kubectl ${KCTX:+--context=$KCTX} -n \"$1\" get {{ args.kind }}/\"$2\" -o yaml"
      - "emisar"
      - "{{ args.namespace }}"
      - "{{ args.name }}"
  timeout: 15s
  env:
    KCTX: "{{ args.context }}"
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: YAML of one deployment
    args:
      namespace: default
      kind: deployment
      name: api
