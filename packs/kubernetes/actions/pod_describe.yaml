schema_version: 1
id: kubernetes.pod_describe
title: kubectl describe pod
kind: exec
risk: high
description: >
  Show the full describe output — events, container states, conditions, volume
  mounts, scheduled node. The canonical "why isn't this pod running?" answer.
  The `Environment:` block prints plain `env` values verbatim — only
  `valueFrom` references render as a placeholder — so injected credentials come
  back with them, the same exposure `kubernetes.get_yaml` carries.
  Approval-gated for that reason.
side_effects:
  - One kubectl describe invocation.
  - Read-only, but exposes container env literals (may include secrets).
args:
  - name: namespace
    type: string
    required: true
    description: Namespace.
    validation:
      pattern: "^[a-z0-9][a-z0-9\\-]{0,62}$"
  - name: name
    type: string
    required: true
    description: Pod name.
    validation:
      pattern: "^[a-z0-9][a-z0-9.\\-]{0,253}$"
  - name: context
    type: string
    required: false
    default: ""
    description: kubeconfig context.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{0,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "kubectl ${KCTX:+--context=$KCTX} -n \"$1\" describe pod \"$2\""
      - "emisar"
      - "{{ args.namespace }}"
      - "{{ args.name }}"
  timeout: 30s
  env:
    KCTX: "{{ args.context }}"
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Describe a pod
    args:
      namespace: default
      name: api-7d4f8c5b8c-x2nzp
