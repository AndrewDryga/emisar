schema_version: 1
id: kubernetes.events_warnings
title: Recent Warning events (all namespaces)
kind: exec
risk: low
description: >
  List the most recent Warning-type events cluster-wide, oldest-to-newest
  (FailedScheduling, BackOff, FailedMount, Unhealthy, …). The fastest
  cluster-wide "what is wrong right now". Read-only.
side_effects:
  - One kubectl get events invocation.
  - Read-only.
args:
  - name: context
    type: string
    required: false
    default: ""
    description: kubeconfig context. Empty = current-context.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{0,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # This is the "what is wrong right now" read, so an unreachable API
      # server reported as "no warnings" is the worst possible answer. kubectl
      # exits non-zero there; the pipe would throw that away. Capture keeps the
      # status and stops tail from SIGPIPE-ing kubectl on a busy cluster.
      - |
        events=$(kubectl ${KCTX:+--context=$KCTX} get events -A --field-selector type=Warning --sort-by=.lastTimestamp); status=$?
        printf '%s\n' "$events" | tail -n 60
        exit $status
  timeout: 30s
  env:
    KCTX: "{{ args.context }}"
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Warning events
    args: {}
