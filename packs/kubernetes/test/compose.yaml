services:
  runner-tools:
    volumes:
      - k3s_kubeconfig:/shared:ro

  k3s:
    image: rancher/k3s:${PACKTEST_VERSION:-v1.36.2-k3s1}${PACKTEST_DIGEST-}
    command: server --node-name=harness --tls-san=k3s --disable=traefik
    privileged: true
    environment:
      K3S_KUBECONFIG_MODE: "666"
      K3S_KUBECONFIG_OUTPUT: /shared/kubeconfig.yaml
    volumes:
      - k3s_kubeconfig:/shared
      - ${EMISAR_ROOT}/packs/kubernetes/test/fixtures/probe.yaml:/var/lib/rancher/k3s/server/manifests/probe.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes | grep -q ' Ready' && kubectl wait --for=condition=Ready pod/probe --timeout=2s >/dev/null && kubectl get crd harnesses.packtest.emisar.dev >/dev/null"]
      interval: 10s
      start_period: 120s
      # Poll cost scales with probe cost: this check spawns a heavyweight
      # client, and four cases boot at once on a four-core runner.
      start_interval: 5s
      retries: 30

  k3s-kubeconfig:
    image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    depends_on: [k3s]
    volumes:
      - k3s_kubeconfig:/shared
    command: sh -c 'until [ -f /shared/kubeconfig.yaml ]; do sleep 1; done; sed -i "s#https://127.0.0.1:6443#https://k3s:6443#" /shared/kubeconfig.yaml; touch /shared/ready; exec tail -f /dev/null'
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/ready"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  k3s_kubeconfig:
