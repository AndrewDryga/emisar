global
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 666 level admin

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 10s
    timeout server 10s

frontend fe_main
    bind *:8080
    default_backend be_main

backend be_main
    server s1 127.0.0.1:8081 check
