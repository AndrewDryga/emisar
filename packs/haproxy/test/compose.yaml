services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/haproxy/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
    image: emisar-packtest-haproxy-tools:latest
    volumes:
      - haproxy_run:/run/haproxy

  haproxy:
    image: haproxy:${PACKTEST_VERSION:-3.4.2}${PACKTEST_DIGEST-}
    user: root
    volumes:
      - haproxy_run:/run/haproxy
      - ${EMISAR_ROOT}/packs/haproxy/test/fixtures/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/run/haproxy/admin.sock"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  haproxy_run:
