schema_version: 1

id: haproxy
name: HAProxy operations
version: 0.1.14
# 0.1.13 and below rated show_errors `low`, so HAProxy's verbatim capture of a
# failing request — cookies and Authorization headers included — auto-ran.
retired_below: 0.1.14
description: >
  Stats, server state, frontends/backends, session inventory, plus narrow
  mutators to enable/disable backend servers. Talks to the HAProxy admin
  socket. Set HAPROXY_SOCK env var on the runner host.
vendor: emisar
homepage: https://emisar.dev/packs/haproxy

requires:
  os:
    - linux
  binaries:
    - socat

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - haproxy

setup:
  summary: >
    Talks to the local HAProxy admin/stats UNIX socket via socat on the
    runner host. There is no default — you must point `HAPROXY_SOCK` at the
    socket.
  env:
    - name: HAPROXY_SOCK
      required: true
      description: Path to the HAProxy admin/stats UNIX socket (the `stats socket` from haproxy.cfg).
      example: /run/haproxy/admin.sock
  notes:
    - "`HAPROXY_SOCK` only reaches an action when the runner allowlists it in `execution.inherit_env` — the action env is scrubbed to PATH/LANG/LC_ALL/TERM by default. There is NO fallback: unset, every action hands socat an empty address and fails with an `unknown device/address` error rather than naming the missing allowlist entry."
    - "The socket must be declared with `level admin` in haproxy.cfg for the enable/disable/set mutators to work."
  host_access:
    - actions:
        - haproxy.show_info
        - haproxy.show_stat
        - haproxy.show_servers_state
        - haproxy.show_pools
        - haproxy.show_errors
        - haproxy.show_sess
        - haproxy.show_map
        - haproxy.show_backend
        - haproxy.show_frontend
        - haproxy.enable_server
        - haproxy.disable_server
        - haproxy.set_maxconn
      requirement: Read and write the configured HAProxy admin socket.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-haproxy-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. An HAProxy admin-level socket
            can change backend availability and runtime limits beyond the actions in this pack.
  verify: haproxy.show_info

actions:
  - actions/show_info.yaml
  - actions/show_stat.yaml
  - actions/show_servers_state.yaml
  - actions/show_pools.yaml
  - actions/show_errors.yaml
  - actions/show_sess.yaml
  - actions/show_map.yaml
  - actions/show_backend.yaml
  - actions/show_frontend.yaml
  - actions/enable_server.yaml
  - actions/disable_server.yaml
  - actions/set_maxconn.yaml
