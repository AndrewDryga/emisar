schema_version: 1
id: haproxy.show_errors
title: show errors
kind: exec
risk: high
description: >
  List recent request/response errors captured by HAProxy. Use to debug 503s.
  Each entry is the verbatim captured buffer of the failing transaction — the
  request line and every header, so cookies, `Authorization` headers, and the
  leading body bytes come back as-is. That content is client-supplied and no
  redaction list enumerates it, so this is approval-gated. Read-only.
side_effects:
  - One admin socket command.
  - Read-only, but returns raw request/response bytes (may include credentials).
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "echo 'show errors' | socat - \"$HAPROXY_SOCK\""
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Errors
    args: {}
