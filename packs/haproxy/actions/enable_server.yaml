schema_version: 1
id: haproxy.enable_server
title: enable server <backend>/<server>
kind: exec
risk: high
description: Re-enable one backend server that was administratively disabled; it returns to rotation and live traffic reaches it again (subject to health checks). Fails with HAProxy's message when the admin socket rejects the command (an unknown backend or server, or a socket below level admin).
side_effects:
  - Server begins receiving traffic again (subject to health checks).
search_terms:
  - back into rotation
args:
  - name: backend
    type: string
    required: true
    description: Backend name.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,64}$"
  - name: server
    type: string
    required: true
    description: Server name within the backend.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,64}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - |
        out=$(printf '%s\n' "enable server $1/$2" | socat - "$HAPROXY_SOCK") || exit
        case $out in
        *[![:space:]]*) printf '%s\n' "$out" >&2; exit 1 ;;
        esac
      - "emisar"
      - "{{ args.backend }}"
      - "{{ args.server }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Enable api/srv1
    args:
      backend: "api"
      server: "srv1"
