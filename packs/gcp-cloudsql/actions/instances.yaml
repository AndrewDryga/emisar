schema_version: 1
id: gcp.sql_instances
title: gcloud sql instances list
kind: script
risk: low
description: List bounded Cloud SQL engine, HA, networking, backup, maintenance, and capacity summaries.
side_effects: ["Read-only Cloud SQL API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum instances to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/cloudsql.sh, interpreter: /bin/sh}
  argv: [instances, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: Project SQL instances
    args: {project: example-prod}
