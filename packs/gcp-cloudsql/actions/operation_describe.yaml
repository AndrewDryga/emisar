schema_version: 1
id: gcp.sql_operation_describe
title: gcloud sql operations describe
kind: script
risk: low
description: Show one Cloud SQL operation's type, target, status, timing, and error codes.
side_effects: ["One read-only Cloud SQL API call.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: operation
    type: string
    required: true
    description: Cloud SQL operation ID.
    validation: {pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$", max_length: 128}
execution:
  script: {path: scripts/cloudsql.sh, interpreter: /bin/sh}
  argv: [operation-describe, "{{ args.project }}", "{{ args.operation }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384
examples:
  - title: Inspect a failed operation
    args: {project: example-prod, operation: operation-123}
