schema_version: 1
id: gcp.sql_users
title: gcloud sql users list
kind: script
risk: low
description: List bounded Cloud SQL user identities, hosts, types, and password-policy state without passwords.
side_effects: ["Read-only Cloud SQL API pagination.", "Returns database user identities.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: instance
    type: string
    required: true
    description: Cloud SQL instance ID.
    validation: {pattern: "^[a-z](?:[a-z0-9-]{0,96}[a-z0-9])?$", max_length: 98}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum users to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/cloudsql.sh, interpreter: /bin/sh}
  argv: [users, "{{ args.project }}", "{{ args.instance }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Application database users
    args: {project: example-prod, instance: app-db}
