services: [gcp-api]
versions:
  - version: 577.0.0-slim
    digest: "@sha256:0d048f80b3bac596bdafc6f0b289b4267ecaaf1e73506e4f6da0b4bef8909fef"
    default: true
risk_accountability:
  mode: complete
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_SQL: http://gcp-api:8080/
  CLOUDSDK_API_ENDPOINT_OVERRIDES_MONITORING: https://gcp-api:8443/
  CURL_CA_BUNDLE: /packs/gcp-cloudsql/test/fixtures/server.crt
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-access-token-843c
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-sql-secret-da31]
cases:
  - action: gcp.sql_instances
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-sql, POSTGRES_16, db-custom-2-8192, cloudsql.iam_authentication]
  - action: gcp.sql_instance_describe
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness-sql, 10.20.0.40, REGIONAL]
  - action: gcp.sql_databases
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness_db, UTF8]
  - action: gcp.sql_users
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness_user, BUILT_IN]
  - action: gcp.sql_backups
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: ["1001", SUCCESSFUL, AUTOMATED]
  - action: gcp.sql_operations
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness-operation, UPDATE, DONE]
  - action: gcp.sql_operation_describe
    args: {project: example-prod, operation: harness-operation}
    expect:
      stdout_contains: [harness-operation, UPDATE, DONE]
  - action: gcp.sql_server_ca_certs
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness-server-ca, AB:CD:EF, 2027-07-27]
  - action: gcp.sql_instance_restart
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness-restart-operation, RESTART, PENDING]
    probes:
      - name: the provider received the restart
        argv: [curl, -fsS, http://gcp-api:8080/probe/state]
        expect:
          stdout_contains: ["restart:harness-sql"]
  - action: gcp.sql_instance_failover
    args: {project: example-prod, instance: harness-sql}
    expect:
      stdout_contains: [harness-failover-operation, FAILOVER, PENDING]
    probes:
      - name: the provider received the failover
        argv: [curl, -fsS, http://gcp-api:8080/probe/state]
        expect:
          stdout_contains: ["failover:harness-sql"]
  - name: gcp.sql_instance_restart-missing-instance
    action: gcp.sql_instance_restart
    args: {project: example-prod, instance: missing-sql}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [missing-sql]
  - name: gcp.sql_instance_failover-rejects-invalid-name
    action: gcp.sql_instance_failover
    args: {project: example-prod, instance: -bad-name-}
    expect:
      status: failure
      reason_contains: [must match pattern]
  - action: gcp.sql_query_insights
    args: {project: example-prod, instance: harness-sql, metric: execution_time, window_minutes: 60, top_n: 2}
    expect:
      stdout_contains:
        - '"unit":"us"'
        - '"ranking_complete":true'
        - '"rank":1'
        - '"value":9000000'
        - 'SELECT count(o0.\"id\") FROM \"orders\"'
      # top_n caps the ranking, so the third fixture series must not appear.
      stdout_not_contains: ['"rank":3']
  # A percentile comes from the cross-series reducer, not an aligner, so the
  # value type changes with it.
  - name: gcp.sql_query_insights-latency-percentile
    action: gcp.sql_query_insights
    args: {project: example-prod, instance: harness-sql, database: harness_db, metric: latency_p99, window_minutes: 180, top_n: 3}
    expect:
      stdout_contains: ['"metric":"latency_p99"', '"unit":"us"', '"value":2250000']
  - name: gcp.sql_query_insights-counts-are-not-microseconds
    action: gcp.sql_query_insights
    args: {project: example-prod, instance: harness-sql, metric: row_count}
    expect:
      stdout_contains: ['"metric":"row_count"', '"unit":"count"']
  # An empty window must not read as "no slow queries".
  - name: gcp.sql_query_insights-names-why-a-window-is-empty
    action: gcp.sql_query_insights
    args: {project: example-prod, instance: no-such-instance}
    expect:
      stdout_contains: ['"series_count":0', query_insights_enabled]
  - name: gcp.sql_query_insights-rejects-http-endpoint
    action: gcp.sql_query_insights
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_MONITORING: http://gcp-api:8080/
    args: {project: example-prod, instance: harness-sql}
    expect:
      status: failure
      exit: [2]
      stderr_contains: [Monitoring API endpoint must use HTTPS]
