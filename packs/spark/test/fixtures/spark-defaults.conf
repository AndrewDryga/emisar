# Shared Spark configuration for this pack's disposable cluster.
#
# The three settings a stock Spark leaves off are turned on deliberately, so the
# actions that depend on them are proved rather than skipped: the standalone
# REST submission server, worker decommissioning, and remote decommission
# requests. The pack's own action descriptions say each one is required.
spark.master.rest.enabled              true
spark.decommission.enabled             true
spark.master.ui.decommission.allow.mode ALLOW
spark.ui.killEnabled                   true

spark.eventLog.enabled                 true
spark.eventLog.dir                     file:///tmp/spark-events
spark.history.fs.logDirectory          file:///tmp/spark-events
spark.history.fs.update.interval        2s
