schema_version: 1
id: spark.applications
title: List Spark applications (GET /api/v1/applications)
kind: script
risk: low
description: >
  List Spark applications with their id, name, user, start and end times, and
  attempts. Against the history server this is the record of what ran; against
  a live driver it returns the one application that driver is running. Every
  other action in this pack takes the app_id this returns.
side_effects:
  - One read-only HTTP GET to the Spark monitoring API.
  - Read-only — never writes or mutates data.
search_terms:
  - list spark applications
  - which app is running
  - spark app id
  - completed applications
args:
  - name: source
    type: string
    required: false
    default: history
    description: Which UI to ask — the history server ($SPARK_HISTORY_URL) or a live driver ($SPARK_UI_URL).
    validation:
      enum: ["history", "driver"]
  - name: status
    type: string
    required: false
    default: ""
    description: >
      Restrict to applications that are still running or have completed. Empty
      returns both. On the history server, running means an application whose
      event log is still open.
    validation:
      enum: ["", "running", "completed"]
  - name: limit
    type: integer
    required: false
    default: 25
    description: Applications returned.
    validation: {min: 1, max: 200}
  - name: min_date
    type: string
    required: false
    default: ""
    description: Only applications that started at or after this date, e.g. 2026-08-05 or 2026-08-05T00:00:00.000GMT.
    validation:
      pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(GMT|Z)?)?)?$'
      max_length: 32
execution:
  script: {path: scripts/spark_api.sh, interpreter: /bin/bash}
  argv: [applications, "{{ args.source }}", "{{ args.status }}", "{{ args.limit }}", "{{ args.min_date }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Recent applications from the history server
    args: {}
  - title: The application running on this driver
    args: {source: driver}
  - title: Applications still in flight
    args: {status: running}
