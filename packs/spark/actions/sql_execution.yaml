schema_version: 1
id: spark.sql_execution
title: GET .../sql/{execution_id}
kind: script
risk: low
description: >
  Show one Spark SQL execution with its node-level metrics — rows produced,
  bytes read, shuffle sizes, and time per operator — and optionally the
  physical plan. This is where a query's cost is attributed: the node with the
  row explosion or the full scan is named here.
side_effects:
  - One read-only HTTP GET to the Spark monitoring API.
  - Read-only — never writes or mutates data.
  - The plan and node descriptions include table, column, and literal values from the query.
search_terms:
  - query plan
  - physical plan
  - why is the query slow
  - full table scan
  - broadcast join
args:
  - name: app_id
    type: string
    required: true
    description: Application id, from spark.applications.
    validation:
      pattern: "^[A-Za-z0-9._-]{1,128}$"
      max_length: 128
  - name: execution_id
    type: integer
    required: true
    description: SQL execution id, from spark.sql_executions.
    validation: {min: 0, max: 1000000}
  - name: source
    type: string
    required: false
    default: history
    description: Which UI to ask — the history server ($SPARK_HISTORY_URL) or a live driver ($SPARK_UI_URL).
    validation:
      enum: ["history", "driver"]
  - name: plan_description
    type: string
    required: false
    default: "true"
    description: Include the physical plan text.
    validation:
      enum: ["true", "false"]
execution:
  script: {path: scripts/spark_api.sh, interpreter: /bin/bash}
  argv:
    - sql
    - "{{ args.source }}"
    - "{{ args.app_id }}"
    - "{{ args.execution_id }}"
    - "{{ args.plan_description }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 8192
examples:
  - title: The plan and metrics for one query
    args: {app_id: app-20260805120000-0001, execution_id: 12}
