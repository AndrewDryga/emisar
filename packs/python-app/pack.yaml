schema_version: 1

id: python-app
name: Python application runtime
version: 0.1.15
description: >
  Inspect a Python deployment — interpreter + venv state, pip
  inventory + freeze, dependency conflicts, outdated packages, sys.path.
  Read-only. Most actions act on the venv at PY_VENV env var
  (default /opt/app/venv).
vendor: emisar
homepage: https://emisar.dev/packs/python-app

requires:
  os:
    - linux
  binaries:
    - python3

setup:
  summary: >
    Inspects a local Python deployment on the runner host — interpreter,
    venv, and pip state — no credentials needed.
  env:
    - name: PY_VENV
      description: Path to the application's virtualenv; the venv-scoped actions run its bin/python and bin/pip. Optional; defaults to `/opt/app/venv`. Add it to the runner's `inherit_env` if you override it.
      default: "/opt/app/venv"
  notes:
    - "System actions use `/usr/bin/python3`; venv actions use `PY_VENV`."
  host_access:
    - actions:
        - py.venv_python_version
        - py.pip_list
        - py.pip_freeze
        - py.pip_show
        - py.pip_check
        - py.pip_outdated
        - py.sys_path
        - py.site_packages_du
        - py.pip_cache_info
      requirement: Read and run a virtual environment owned by another operating-system user.
      recipes:
        - name: Add the Emisar service user to the group that owns the venv
          commands:
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-python-app-host-access.conf"
            - "sudo systemctl daemon-reload"
            - "test \"$(stat -c %g /opt/app/venv)\" -ne 0 || { echo 'Refusing to add emisar to group root (gid 0): give /opt/app/venv a dedicated group first.' >&2; false; } && sudo usermod -aG \"$(stat -c %G /opt/app/venv)\" emisar"
            - "sudo chmod -R g+rX /opt/app/venv"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = emisar"
            - "test \"$(stat -c %g /opt/app/venv)\" -ne 0"
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx \"$(stat -c %G /opt/app/venv)\""
            - "sudo -u emisar test -r /opt/app/venv/bin/python"
          impact: >
            These actions execute the venv's own `bin/python` and `bin/pip` as emisar, and every
            one except py.venv_python_version also runs the `.pth` files and `sitecustomize`
            module Python loads from the venv at startup. Whoever can write the venv (its owner,
            or anyone who compromises the application running as that user) therefore runs code
            as emisar, with this runner's own token and every other grant emisar holds. Every
            process running as emisar also gets whatever the deployment group is granted on this
            host, not only the venv, so the recipe refuses a venv whose group is root; it adds
            group read, never write. The first two commands undo this pack's earlier root override.
            Versions before 0.1.15 did not refuse a root-group venv; if `id -nG emisar` lists
            `root`, remove it with `sudo gpasswd -d emisar root` before restarting.
            Substitute your own `PY_VENV` for `/opt/app/venv`, and note that an action declaring
            `execution.user` replaces these inherited supplementary groups.
  verify: py.python_version_system

actions:
  - actions/python_version_system.yaml
  - actions/venv_python_version.yaml
  - actions/pip_list.yaml
  - actions/pip_freeze.yaml
  - actions/pip_show.yaml
  - actions/pip_check.yaml
  - actions/pip_outdated.yaml
  - actions/sys_path.yaml
  - actions/site_packages_du.yaml
  - actions/pip_cache_info.yaml
