schema_version: 1
id: py.pip_list
title: $PY_VENV/bin/pip list
kind: exec
risk: low
description: >
  List installed packages with versions.
  This executes the venv's own `bin/pip`, and the `.pth` and `sitecustomize`
  hooks its interpreter loads at startup, as the runner's user, so whoever can
  write the venv controls what this action runs.
side_effects: ["One pip list call.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "\"${PY_VENV:-/opt/app/venv}/bin/pip\" list --format=json"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: All packages
    args: {}
