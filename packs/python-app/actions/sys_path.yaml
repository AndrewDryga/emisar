schema_version: 1
id: py.sys_path
title: python -c 'import sys; print(sys.path)'
kind: exec
risk: low
description: >
  Show the effective sys.path for the venv interpreter.
  This executes the venv's own `bin/python`, and the `.pth` and
  `sitecustomize` hooks it loads at startup, as the runner's user, so whoever
  can write the venv controls what this action runs.
side_effects: ["One forked python process.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "\"${PY_VENV:-/opt/app/venv}/bin/python\" -c 'import sys; [print(p) for p in sys.path]'"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: sys.path
    args: {}
