schema_version: 1
id: py.site_packages_du
title: du -sh site-packages/*
kind: exec
risk: low
description: Show disk usage per installed package — find bloated installs.
side_effects: ["One file-system traversal of the venv's site-packages.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # An unresolved interpreter left SP empty, and `du -sh "$SP"/*` then
      # expanded to `du -sh /*` — a whole-root traversal reported as success,
      # because the pipeline exits with head's status either way.
      - |
        V=${PY_VENV:-/opt/app/venv}
        SP=$("$V/bin/python" -c 'import site; print(site.getsitepackages()[0])') || { echo "cannot resolve site-packages via $V/bin/python" >&2; exit 1; }
        [ -n "$SP" ] && [ -d "$SP" ] || { echo "site-packages is not a readable directory: $SP" >&2; exit 1; }
        # Captured, not piped: the guard above proves the directory exists, but
        # du is handed its ENTRIES, and an unreadable one made du fail while
        # head still returned 0 — "site-packages uses no disk" as a success.
        usage=$(du -sh "$SP"/*) || { echo "cannot measure $SP" >&2; exit 1; }
        printf '%s\n' "$usage" | sort -rh | head -50
  timeout: 5m
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Top packages by disk
    args: {}
