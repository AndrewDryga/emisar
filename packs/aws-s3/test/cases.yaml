services: [localstack, s3-api]
versions:
  - version: "4.14.0"
    digest: "@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a"
    default: true
secret_env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
env:
  AWS_ACCESS_KEY_ID: packtest-canary-aws-s3-access-924e
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: "http://localstack:4566"
  AWS_SECRET_ACCESS_KEY: packtest-canary-aws-s3-secret-7c31
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains:
      - packtest-canary-aws-s3-secret-7c31
      - packtest-canary-aws-s3-metadata-51fd
cases:
  - action: s3.bucket_encryption
    args: {bucket: emisar-packtest-encryption}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-encryption"]
      - argv: [aws, s3api, put-bucket-encryption, --bucket, emisar-packtest-encryption, --server-side-encryption-configuration, '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}']
    expect:
      stdout_contains: [ServerSideEncryptionConfiguration, AES256]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-encryption", --force]
  - action: s3.bucket_lifecycle
    args: {bucket: emisar-packtest-lifecycle}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-lifecycle"]
      - argv: [aws, s3api, put-bucket-lifecycle-configuration, --bucket, emisar-packtest-lifecycle, --lifecycle-configuration, '{"Rules":[{"ID":"expire-logs","Status":"Enabled","Filter":{"Prefix":"logs/"},"Expiration":{"Days":30}}]}']
    expect:
      stdout_contains: [expire-logs, Enabled]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-lifecycle", --force]
  - action: s3.bucket_location
    args: {bucket: emisar-packtest-location}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-location"]
    expect:
      stdout_contains: [LocationConstraint]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-location", --force]
  - action: s3.bucket_policy
    args: {bucket: emisar-packtest-policy}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-policy"]
      - argv: [aws, s3api, put-bucket-policy, --bucket, emisar-packtest-policy, --policy, '{"Version":"2012-10-17","Statement":[{"Sid":"HarnessRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::emisar-packtest-policy/*"}]}']
    expect:
      stdout_contains: [HarnessRead, s3:GetObject]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-policy", --force]
  - action: s3.bucket_versioning
    args: {bucket: emisar-packtest-versioning}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-versioning"]
      - argv: [aws, s3api, put-bucket-versioning, --bucket, emisar-packtest-versioning, --versioning-configuration, "Status=Enabled"]
    expect:
      json:
        /Status: Enabled
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-versioning", --force]
  - action: s3.list_buckets
    args: {limit: 25}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-list"]
    expect:
      stdout_contains: [emisar-packtest-list]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-list", --force]
  - action: s3.list_objects
    args: {bucket: emisar-packtest-objects, prefix: logs/, limit: 25}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-objects"]
      - argv: [/bin/sh, -c, 'printf harness-object | aws s3 cp - s3://emisar-packtest-objects/logs/probe.txt']
    expect:
      stdout_contains: [probe.txt]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-objects", --force]
  # The cursor must survive the runner's default redaction in both directions:
  # a page_cursor the caller feeds back reaches S3, and the emitted
  # next_page_cursor is the real token, not [REDACTED].
  - name: s3.list-objects-cursor-round-trips
    action: s3.list_objects
    args: {bucket: emisar-packtest-cursor, prefix: "logs/", limit: 2, page_cursor: cursor-in}
    env:
      AWS_ENDPOINT_URL: http://s3-api:8080
    expect:
      stdout_contains: ["logs/page-two.txt"]
      json:
        /next_page_cursor: cursor-out
  - action: s3.object_metadata
    args: {bucket: emisar-packtest-metadata, key: probe.txt}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-metadata"]
      - argv: [/bin/sh, -c, 'printf harness-object | aws s3 cp - s3://emisar-packtest-metadata/probe.txt --content-type text/plain --metadata secret=packtest-canary-aws-s3-metadata-51fd,owner=app']
    expect:
      stdout_contains: [ContentLength, ContentType, text/plain, MetadataKeys, secret, owner]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-metadata", --force]
  - action: s3.bucket_public_access
    args: {bucket: emisar-packtest-public-access}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-public-access"]
      - argv: [aws, s3api, put-public-access-block, --bucket, emisar-packtest-public-access, --public-access-block-configuration, "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"]
    expect:
      json:
        /PublicAccessBlockConfiguration/BlockPublicPolicy: true
        /PublicAccessBlockConfiguration/RestrictPublicBuckets: true
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-public-access", --force]
  - action: s3.bucket_policy_status
    args: {bucket: emisar-packtest-policy-status}
    env:
      AWS_ENDPOINT_URL: http://s3-api:8080
    expect:
      json:
        /PolicyStatus/IsPublic: true
  - action: s3.bucket_ownership
    args: {bucket: emisar-packtest-ownership}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-ownership"]
      - argv: [aws, s3api, put-bucket-ownership-controls, --bucket, emisar-packtest-ownership, --ownership-controls, '{"Rules":[{"ObjectOwnership":"BucketOwnerEnforced"}]}']
    expect:
      stdout_contains: [OwnershipControls, BucketOwnerEnforced]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-ownership", --force]
  - action: s3.bucket_replication
    args: {bucket: emisar-packtest-replication}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-replication"]
      - argv: [aws, s3, mb, "s3://emisar-packtest-replica"]
      - argv: [aws, s3api, put-bucket-versioning, --bucket, emisar-packtest-replication, --versioning-configuration, "Status=Enabled"]
      - argv: [aws, s3api, put-bucket-versioning, --bucket, emisar-packtest-replica, --versioning-configuration, "Status=Enabled"]
      - argv: [aws, s3api, put-bucket-replication, --bucket, emisar-packtest-replication, --replication-configuration, '{"Role":"arn:aws:iam::123456789012:role/replication","Rules":[{"ID":"replicate-logs","Status":"Enabled","Priority":1,"DeleteMarkerReplication":{"Status":"Disabled"},"Filter":{"Prefix":"logs/"},"Destination":{"Bucket":"arn:aws:s3:::emisar-packtest-replica"}}]}']
    expect:
      stdout_contains: [ReplicationConfiguration, replicate-logs, emisar-packtest-replica]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-replication", --force]
      - argv: [aws, s3, rb, "s3://emisar-packtest-replica", --force]
  - action: s3.bucket_logging
    args: {bucket: emisar-packtest-logging}
    arrange:
      - argv: [aws, s3, mb, "s3://emisar-packtest-logging"]
      - argv: [aws, s3, mb, "s3://emisar-packtest-log-target"]
      - argv: [aws, s3api, put-bucket-logging, --bucket, emisar-packtest-logging, --bucket-logging-status, '{"LoggingEnabled":{"TargetBucket":"emisar-packtest-log-target","TargetPrefix":"access/"}}']
    expect:
      stdout_contains: [LoggingEnabled, emisar-packtest-log-target, access/]
    cleanup:
      - argv: [aws, s3, rb, "s3://emisar-packtest-logging", --force]
      - argv: [aws, s3, rb, "s3://emisar-packtest-log-target", --force]
