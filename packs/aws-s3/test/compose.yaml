services:
  localstack:
    image: localstack/localstack:${PACKTEST_VERSION:-4.14.0}${PACKTEST_DIGEST-}
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1

  s3-api:
    image: localstack/localstack:${PACKTEST_VERSION:-4.14.0}${PACKTEST_DIGEST-}
    entrypoint: [python3, /fixture/server.py]
    volumes:
      - ${EMISAR_ROOT}/packs/aws-s3/test/fixtures/server.py:/fixture/server.py:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
