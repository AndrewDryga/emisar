schema_version: 1
id: s3.bucket_public_access
title: aws s3api get-public-access-block
kind: exec
risk: low
description: Show one bucket's public-access block controls.
side_effects: ["One API call.", "Read-only."]
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation: {pattern: "^[a-z0-9.\\-]{3,63}$"}
execution:
  command:
    binary: aws
    argv: [s3api, get-public-access-block, --bucket, "{{ args.bucket }}", --output, json]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Public access controls
    args: {bucket: my-bucket}
