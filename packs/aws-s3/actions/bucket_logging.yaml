schema_version: 1
id: s3.bucket_logging
title: aws s3api get-bucket-logging
kind: exec
risk: low
description: Show one bucket's server access logging destination and grants.
side_effects: ["One API call.", "Read-only."]
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation: {pattern: "^[a-z0-9.\\-]{3,63}$"}
execution:
  command:
    binary: /bin/sh
    argv:
      # A bucket that never had access logging answers with an empty configuration,
      # which the CLI prints as nothing. Report that successful empty answer as
      # {}; a failed call still exits with the CLI's own status.
      - "-c"
      - |-
        set -eu
        out=$(aws s3api get-bucket-logging --bucket "$1" --output json)
        if [ -n "$out" ]; then printf '%s\n' "$out"; else echo '{}'; fi
      - emisar
      - "{{ args.bucket }}"
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Access logging
    args: {bucket: my-bucket}
