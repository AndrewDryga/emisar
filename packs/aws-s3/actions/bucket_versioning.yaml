schema_version: 1
id: s3.bucket_versioning
title: aws s3api get-bucket-versioning
kind: exec
risk: low
description: Show versioning state of one bucket.
side_effects:
  - One API call.
  - Read-only.
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation:
      pattern: "^[a-z0-9.\\-]{3,63}$"
execution:
  command:
    binary: /bin/sh
    argv:
      # A bucket that never had versioning answers with an empty configuration,
      # which the CLI prints as nothing. Report that successful empty answer as
      # {}; a failed call still exits with the CLI's own status.
      - "-c"
      - |-
        set -eu
        out=$(aws s3api get-bucket-versioning --bucket "$1" --output json)
        if [ -n "$out" ]; then printf '%s\n' "$out"; else echo '{}'; fi
      - emisar
      - "{{ args.bucket }}"
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Versioning
    args:
      bucket: "my-bucket"
