schema_version: 1
id: s3.list_objects
title: aws s3api list-objects-v2
kind: script
risk: low
description: List one bounded page of object system metadata under a literal prefix.
side_effects:
  - One ListObjectsV2 call.
  - Read-only.
  - Uses a mode-0600 temporary response file and removes it before exit.
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation:
      pattern: "^[a-z0-9.\\-]{3,63}$"
  - name: prefix
    type: string
    required: false
    default: ""
    description: Key prefix.
    validation:
      pattern: "^[a-zA-Z0-9_.!*'(),/\\-]{0,512}$"
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum objects to return.
    validation: {min: 1, max: 1000}
  - name: continuation_token
    type: string
    required: false
    default: ""
    sensitive: true
    description: Opaque service continuation token from a previous result.
    validation: {pattern: "^[A-Za-z0-9+/=_-]*$", max_length: 4096}
execution:
  script: {path: scripts/s3_read.sh, interpreter: /bin/sh}
  argv: [objects, "{{ args.bucket }}", "{{ args.prefix }}", "{{ args.limit }}", "{{ args.continuation_token }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Objects under prefix
    args:
      bucket: "my-bucket"
      prefix: "logs/2026/"
