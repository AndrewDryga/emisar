schema_version: 1
id: s3.object_metadata
title: aws s3api head-object
kind: script
risk: low
description: Show one object's system metadata and custom metadata keys without its body or custom values.
side_effects:
  - One HeadObject call.
  - Read-only.
  - Uses a mode-0600 temporary response file and removes it before exit.
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation:
      pattern: "^[a-z0-9.\\-]{3,63}$"
  - name: key
    type: string
    required: true
    description: Object key.
    validation:
      pattern: "^[a-zA-Z0-9_.!*'(),/\\-]{1,1000}[a-zA-Z0-9_.!*'(),/\\-]{0,24}$"
execution:
  script: {path: scripts/s3_read.sh, interpreter: /bin/sh}
  argv: [object, "{{ args.bucket }}", "{{ args.key }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: One object
    args:
      bucket: "my-bucket"
      key: "logs/2026/06/01.log"
