schema_version: 1
id: s3.bucket_policy_status
title: aws s3api get-bucket-policy-status
kind: exec
risk: low
description: Show whether one bucket policy makes the bucket public.
side_effects: ["One API call.", "Read-only."]
args:
  - name: bucket
    type: string
    required: true
    description: Bucket name.
    validation: {pattern: "^[a-z0-9.\\-]{3,63}$"}
execution:
  command:
    binary: aws
    argv: [s3api, get-bucket-policy-status, --bucket, "{{ args.bucket }}", --output, json]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Policy public status
    args: {bucket: my-bucket}
