schema_version: 1

id: firewall
name: Firewall and netfilter
version: 0.1.15
description: >
  iptables, nftables, conntrack, and traffic-control inspection plus
  narrow operator actions for incident response (block IP, unblock IP,
  flush chain). Rule edits are not persisted across iptables service
  reload — use IaC for permanent rules.
vendor: emisar
homepage: https://emisar.dev/packs/firewall

requires:
  os:
    - linux
  binaries:
    - iptables
    - nft
    - jq

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  host_access:
    - actions:
        - fw.iptables_filter
        - fw.iptables_nat
        - fw.iptables_mangle
        - fw.nft_list_ruleset
        - fw.conntrack_count
        - fw.conntrack_list
        - fw.iptables_block_ip
        - fw.iptables_unblock_ip
        - fw.iptables_flush_chain
        - fw.nft_list_chain
        - fw.nft_port_rules
      requirement: Inspect and change the host network namespace with CAP_NET_ADMIN.
      recipes:
        - name: Grant CAP_NET_ADMIN to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_NET_ADMIN' | sudo tee /etc/systemd/system/emisar.service.d/10-firewall-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_net_admin"
          impact: >
            Every Emisar action on this runner inherits CAP_NET_ADMIN and can change routes,
            firewall rules, traffic control, and other network state in the host namespace.
  verify: fw.conntrack_count

actions:
  - actions/iptables_filter.yaml
  - actions/iptables_nat.yaml
  - actions/iptables_mangle.yaml
  - actions/nft_list_ruleset.yaml
  - actions/conntrack_count.yaml
  - actions/conntrack_list.yaml
  - actions/tc_qdisc_show.yaml
  - actions/ip_rule_show.yaml
  - actions/iptables_block_ip.yaml
  - actions/iptables_unblock_ip.yaml
  - actions/iptables_flush_chain.yaml
  - actions/nft_list_chain.yaml
  - actions/nft_port_rules.yaml
