schema_version: 1
id: fw.iptables_unblock_ip
title: iptables -D INPUT -s <ip> -j DROP
kind: exec
risk: high
description: >
  Remove a previously-inserted DROP rule for one IPv4 address or CIDR. Use to undo a
  manual block. Matches the rule by literal -s/-j signature; if the
  rule isn't found, iptables errors and nothing changes.
side_effects:
  - One matching DROP rule removed (or error if no match).
  - Traffic from that IP can flow again, subject to other rules.
search_terms:
  - unban
args:
  - name: ip
    type: string
    required: true
    description: Source IPv4 address or CIDR; the action runs `iptables`, which handles IPv4 only.
    validation:
      pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}(/[0-9]{1,2})?$"
execution:
  command:
    binary: iptables
    argv: ["-D", "INPUT", "-s", "{{ args.ip }}", "-j", "DROP"]
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Unblock after false-positive
    args:
      ip: "10.0.5.12"
