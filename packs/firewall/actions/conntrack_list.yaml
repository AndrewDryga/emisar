schema_version: 1
id: fw.conntrack_list
title: conntrack -L (capped)
kind: exec
risk: low
description: List the first 1000 connection-tracking entries. Use to see what's NAT'd right now.
side_effects:
  - One conntrack query.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # head -1000 SIGPIPEs conntrack by design on any large table, so the
      # pipeline's status is unusable here and capture would buffer an
      # unbounded table. Probe with -C instead, which needs the same netlink
      # privileges, so "no NAT entries" and "runner lacks CAP_NET_ADMIN" stop
      # looking identical. -L keeps its stderr for the same reason.
      - |
        conntrack -C >/dev/null 2>&1 || { echo "conntrack unavailable (module not loaded or missing CAP_NET_ADMIN)" >&2; exit 1; }
        conntrack -L | head -1000
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: First 1000 conntrack entries
    args: {}
