schema_version: 1
id: fw.nft_port_rules
title: Project nftables rules for one port
kind: script
risk: low
description: >
  Project rules with direct source or destination port expressions for one
  numeric port. Rules that reference named sets, maps, or unsupported
  expressions are returned separately as unresolved. This is inspection
  evidence, not an effective allow or deny decision: chain order, jumps,
  policies, and other predicates still apply.
side_effects:
  - One read-only terse nftables ruleset query.
  - Requires root or CAP_NET_ADMIN on most hosts.
args:
  - name: port
    type: integer
    required: true
    description: TCP, UDP, SCTP, DCCP, or generic transport port to inspect.
    validation:
      min: 1
      max: 65535
execution:
  script:
    path: scripts/nft_port_rules.sh
    interpreter: /bin/sh
  argv: ["{{ args.port }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  # No output.schema: each projected rule carries its native nftables expr
  # (unbounded — an anonymous set alone can run KiBs) and a busy port matches
  # an unbounded rule count, so the result can never promise to fit the
  # runner's 8 KiB structured-output cap. parser_required still fails a
  # non-JSON result.
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Find direct and indirect rules involving PostgreSQL
    args:
      port: 5432
