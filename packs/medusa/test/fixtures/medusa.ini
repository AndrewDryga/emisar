; Medusa's configuration for the behavior SUT. No secrets: the CQL and storage
; credentials arrive as MEDUSA_CQL_* and AWS_* environment variables.
[cassandra]
stop_cmd = /usr/local/bin/packtest-cassandra-stop
start_cmd = /usr/local/bin/packtest-cassandra-start
config_file = /etc/cassandra/cassandra.yaml
resolve_ip_addresses = False
use_sudo = False

[storage]
storage_provider = s3_compatible
host = minio
port = 9000
secure = False
bucket_name = medusa-packtest
prefix = packtest
fqdn = 127.0.0.1
max_backup_count = 2
backup_grace_period_in_days = 0
use_sudo_for_restore = False
