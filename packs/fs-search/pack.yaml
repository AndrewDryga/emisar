schema_version: 1

id: fs-search
name: Filesystem search and inspection
version: 0.1.11
# 0.1.8 and below let a low-risk, no-approval read reach /etc/emisar and
# /var/lib/emisar — the enrollment key, the operator's pack credentials, and
# this runner's bearer token. Those versions are unsafe to keep running.
retired_below: 0.1.9
description: >
  Generic filesystem operations an LLM-driven runner needs constantly:
  bounded find, recursive grep, file head/tail/hash, du, ls -la, stat.
  All read-only. Paths are validated against simple patterns; the runner's
  symlink-containment + audit redaction layers still apply on top.
vendor: emisar
homepage: https://emisar.dev/packs/fs-search

requires:
  os:
    - linux

setup:
  summary: >
    Reads the local filesystem on the runner host (find/grep/du/stat and
    friends) — no credentials needed; paths and patterns are passed as
    arguments.
  notes:
    - "The runner sees only what its uid can read; reaching root-owned or otherwise restricted paths requires running as root."
    - "The runner refuses any path inside its own configuration and state directories (`/etc/emisar` and `/var/lib/emisar` by default, or wherever --etc-dir/--data-dir put them) for every action, whatever a pack declares. Those hold the enrollment key, the pack credentials you exported, and this runner's bearer token."
    - "The content-returning reads — fs.head_file, fs.tail_file, fs.grep_file, fs.grep_recursive — are low risk, so under the shipped default policy they run with no approval and an operator or agent can read a log without a round trip. They return whatever the file holds. A fleet that wants a human in that loop adds a policy override (action fs.*_file or fs.grep_*, decision require_approval) instead of the tier changing for everyone."
  verify: fs.stat_path

actions:
  - actions/find_by_name.yaml
  - actions/find_recent_modified.yaml
  - actions/find_world_writable.yaml
  - actions/find_setuid.yaml
  - actions/find_large_files.yaml
  - actions/du_top.yaml
  - actions/ls_long.yaml
  - actions/stat_path.yaml
  - actions/sha256_file.yaml
  - actions/head_file.yaml
  - actions/tail_file.yaml
  - actions/grep_file.yaml
  - actions/grep_recursive.yaml
  - actions/count_lines.yaml
  - actions/file_type.yaml
