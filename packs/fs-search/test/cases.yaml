# fs-search reads the filesystem of the machine the ACTION runs on, which is the
# client container rather than a service to drive — so every case arranges the
# exact tree it asserts on under /tmp, and nothing here depends on state that
# outlives its own case. See compose.yaml for why a version row still names a
# real system under test.
services: [fs-target]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
secret_env: [FS_SEARCH_PACKTEST_CANARY]
env:
  # This lives in the emisar parent process. A regression that reads
  # /proc/self/environ exposes it even though the action does not inherit it.
  FS_SEARCH_PACKTEST_CANARY: packtest-canary-fs-search-environ-7d934b
risk_accountability:
  mode: complete
cases:
  # The pack's headline read, and the one shape a glob got wrong: `.cache` holds
  # more than any visible sibling and has to rank first, `toplevel.bin` proves a
  # file at that level still ranks alongside directories, and `.ssh` proves a
  # denied name stays out even now that dot-entries are listed. The trailing
  # newline in the last assertion is the point of it: every child line continues
  # with a '/', so only du's own total for the requested path could end a line
  # there — this pins the output to one row per entry underneath it.
  - action: fs.du_top
    args: {path: /tmp/packtest-du}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-du/.cache /tmp/packtest-du/.ssh /tmp/packtest-du/visible
            dd if=/dev/zero of=/tmp/packtest-du/.cache/blob bs=1M count=8 2>/dev/null
            dd if=/dev/zero of=/tmp/packtest-du/.ssh/id_ed25519 bs=1M count=12 2>/dev/null
            dd if=/dev/zero of=/tmp/packtest-du/visible/blob bs=1M count=2 2>/dev/null
            dd if=/dev/zero of=/tmp/packtest-du/toplevel.bin bs=1M count=4 2>/dev/null
    expect:
      # Contiguous, so this asserts the ranking order and not just that three
      # paths were mentioned somewhere.
      #
      # A DIRECTORY's total includes the directory's own block, and `du -h`
      # rounds up, so .cache reads 8.0M or 8.1M depending on the filesystem
      # under the runner — it read 8.0M on Docker Desktop and 8.1M on CI. Only
      # the file entry's size is pinned: the window opens at the tab after
      # .cache's size, and closes on the magnitude of visible's, which the
      # directory block cannot move.
      stdout_contains:
        - "\t/tmp/packtest-du/.cache\n4.0M\t/tmp/packtest-du/toplevel.bin\n2."
        - "M\t/tmp/packtest-du/visible\n"
      stdout_not_contains:
        - /tmp/packtest-du/.ssh
        - "/tmp/packtest-du\n"

  # The pipeline exits with head's status, so without the guard this path would
  # report success with no rows — "the directory is empty" rather than "there is
  # no such directory".
  - name: fs.du-top-missing-path
    action: fs.du_top
    args: {path: /tmp/packtest-du-absent}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["not a readable directory: /tmp/packtest-du-absent"]

  - action: fs.find_large_files
    args: {path: /tmp/packtest-large, min_mb: 5}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-large/nested
            dd if=/dev/zero of=/tmp/packtest-large/nested/culprit.bin bs=1M count=12 2>/dev/null
            dd if=/dev/zero of=/tmp/packtest-large/small.bin bs=1M count=1 2>/dev/null
    expect:
      stdout_contains: [/tmp/packtest-large/nested/culprit.bin]
      stdout_not_contains: [small.bin]

  - action: fs.find_by_name
    args: {path: /tmp/packtest-find, glob: "*.log"}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-find/nested && : > /tmp/packtest-find/nested/app.log && : > /tmp/packtest-find/app.conf"
    expect:
      stdout_contains: [/tmp/packtest-find/nested/app.log]
      stdout_not_contains: [app.conf]

  # The stale file carries an mtime far outside the window, so this asserts the
  # window really filtered rather than that the directory happened to hold one file.
  - action: fs.find_recent_modified
    args: {path: /tmp/packtest-recent, minutes: 10}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-recent
            : > /tmp/packtest-recent/fresh.log
            : > /tmp/packtest-recent/stale.log
            touch -d '2020-01-01 00:00:00' /tmp/packtest-recent/stale.log
    expect:
      stdout_contains: [/tmp/packtest-recent/fresh.log]
      stdout_not_contains: [stale.log]

  # A file owner may set the setuid bit on their own file, so the fixture needs
  # no privileged identity to plant what this scan is meant to find.
  - action: fs.find_setuid
    args: {path: /tmp/packtest-setuid}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-setuid && : > /tmp/packtest-setuid/helper && chmod 4755 /tmp/packtest-setuid/helper && : > /tmp/packtest-setuid/plain && chmod 0644 /tmp/packtest-setuid/plain"
    expect:
      stdout_contains: [/tmp/packtest-setuid/helper]
      stdout_not_contains: ["/plain"]

  - action: fs.find_world_writable
    args: {path: /tmp/packtest-worldwritable}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-worldwritable && : > /tmp/packtest-worldwritable/open.conf && chmod 0666 /tmp/packtest-worldwritable/open.conf && : > /tmp/packtest-worldwritable/closed.conf && chmod 0644 /tmp/packtest-worldwritable/closed.conf"
    expect:
      stdout_contains: [/tmp/packtest-worldwritable/open.conf]
      stdout_not_contains: [closed.conf]

  - action: fs.ls_long
    args: {path: /tmp/packtest-ls}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-ls/subdir && printf 'x' > /tmp/packtest-ls/entry.txt"
    expect:
      stdout_contains: ["total ", entry.txt, subdir]

  - action: fs.stat_path
    args: {path: /tmp/packtest-stat/notes.txt}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-stat && printf 'alpha\\nbravo\\ncharlie\\n' > /tmp/packtest-stat/notes.txt"
    expect:
      stdout_contains: ["File: /tmp/packtest-stat/notes.txt", "Size: 20", regular file]

  # The digest is of the exact bytes the arrange step writes, so this proves the
  # action hashed the file rather than that sha256sum exited cleanly.
  - action: fs.sha256_file
    args: {path: /tmp/packtest-hash/hashme.txt}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-hash && printf 'emisar-packtest-sha256\\n' > /tmp/packtest-hash/hashme.txt"
    expect:
      stdout_contains:
        - "a17a0507a770b1cfa801348fe868347b062d35ce0499fb3d444265f210ec5ee3  /tmp/packtest-hash/hashme.txt"

  - action: fs.head_file
    args: {path: /tmp/packtest-head/app.log, lines: 2}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-head && printf 'line-one\\nline-two\\nline-three\\n' > /tmp/packtest-head/app.log"
    expect:
      stdout_contains: [line-one, line-two]
      stdout_not_contains: [line-three]

  # The pack ships a PEM redaction rule for exactly this read; nothing executed
  # it before. The key body has to disappear across the line boundaries it spans
  # while the surrounding config still comes back.
  - name: fs.head-file-redacts-private-key
    action: fs.head_file
    args: {path: /tmp/packtest-pem/server.conf}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-pem
            printf '%s\n' \
              'listen 0.0.0.0:8443' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              '-----END OPENSSH PRIVATE KEY-----' \
              'server_name packtest.invalid' > /tmp/packtest-pem/server.conf
    expect:
      stdout_contains: ["[REDACTED PRIVATE KEY]", "listen 0.0.0.0:8443", server_name packtest.invalid]
      stdout_not_contains: [NOTAREALKEYpacktest]

  - action: fs.tail_file
    args: {path: /tmp/packtest-tail/app.log, lines: 2}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-tail && printf 'line-one\\nline-two\\nline-three\\n' > /tmp/packtest-tail/app.log"
    expect:
      stdout_contains: [line-two, line-three]
      stdout_not_contains: [line-one]

  # Same PEM redaction rule as fs.head_file, for the tail read. The key block
  # sits at the end of the file so the tailed window covers it; the rule spans
  # the block's lines and the key body never reaches stdout.
  - name: fs.tail-file-redacts-private-key
    action: fs.tail_file
    args: {path: /tmp/packtest-tail-pem/server.conf, lines: 5}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-tail-pem
            printf '%s\n' \
              'listen 0.0.0.0:8443' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              '-----END OPENSSH PRIVATE KEY-----' > /tmp/packtest-tail-pem/server.conf
    expect:
      stdout_contains: ["[REDACTED PRIVATE KEY]"]
      stdout_not_contains: [NOTAREALKEYpacktest]

  - action: fs.count_lines
    args: {path: /tmp/packtest-count/notes.txt}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-count && printf 'alpha\\nbravo\\ncharlie\\n' > /tmp/packtest-count/notes.txt"
    expect:
      stdout_contains: ["3 /tmp/packtest-count/notes.txt"]

  - action: fs.grep_file
    args: {path: /tmp/packtest-grep/app.log, pattern: "ERROR"}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-grep && printf 'alpha ok\\nbravo ERROR connect refused\\ncharlie ok\\n' > /tmp/packtest-grep/app.log"
    expect:
      stdout_contains: ["bravo ERROR connect refused"]
      stdout_not_contains: [alpha ok, charlie ok]

  # Same PEM redaction rule as fs.head_file, for the single-file grep that can
  # surface a key inside a matched file. `.` matches every line (the arg pattern
  # forbids `|`), so the whole block comes back and the rule spans it, keeping
  # the key body out of stdout.
  - name: fs.grep-file-redacts-private-key
    action: fs.grep_file
    args: {path: /tmp/packtest-grep-pem/id_ed25519, pattern: "."}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-grep-pem
            printf '%s\n' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              '-----END OPENSSH PRIVATE KEY-----' > /tmp/packtest-grep-pem/id_ed25519
    expect:
      stdout_contains: ["[REDACTED PRIVATE KEY]"]
      stdout_not_contains: [NOTAREALKEYpacktest]

  # Same guard as du_top, and the same failure it hides: grep's exit status is
  # lost to head, so an unreadable file would come back as "no matches".
  - name: fs.grep-file-missing-path
    action: fs.grep_file
    args: {path: /tmp/packtest-grep/absent.log, pattern: "ERROR"}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["file not readable: /tmp/packtest-grep/absent.log"]

  - action: fs.grep_recursive
    args: {path: /tmp/packtest-rgrep, pattern: "ERROR"}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-rgrep/nested
            printf 'alpha ok\nbravo ERROR connect refused\n' > /tmp/packtest-rgrep/nested/app.log
            printf 'nothing to see\n' > /tmp/packtest-rgrep/quiet.log
    expect:
      stdout_contains: ["/tmp/packtest-rgrep/nested/app.log:2:bravo ERROR connect refused"]
      stdout_not_contains: [quiet.log]

  # Same PEM redaction rule as fs.head_file, for the recursive search that can
  # surface a key committed into a source tree. grep prints each matching line
  # prefixed with file:line; `.` matches every line (the arg pattern forbids
  # `|`), so the whole block comes back and the rule spans it across those
  # prefixes, keeping the key body out of stdout.
  - name: fs.grep-recursive-redacts-private-key
    action: fs.grep_recursive
    args: {path: /tmp/packtest-rgrep-pem, pattern: "."}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            mkdir -p /tmp/packtest-rgrep-pem
            printf '%s\n' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              'NOTAREALKEYpacktestNOTAREALKEYpacktest' \
              '-----END OPENSSH PRIVATE KEY-----' > /tmp/packtest-rgrep-pem/id_ed25519
    expect:
      stdout_contains: ["[REDACTED PRIVATE KEY]"]
      stdout_not_contains: [NOTAREALKEYpacktest]

  # Each script-routed denial asserts the shared guard's own error and that the
  # delegating reader spy was untouched. This prevents kernel permissions or a
  # harmless empty device from making the security proof pass vacuously.
  - name: fs.head-file-rejects-canonical-self-environ-before-reader
    action: fs.head_file
    args: {path: /proc/self/environ}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path:"]
    probes:
      - name: head was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-head-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.tail-file-rejects-numeric-pid-memory-before-reader
    action: fs.tail_file
    args: {path: /proc/1/mem}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path: /proc/1/mem"]
    probes:
      - name: tail was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-tail-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-file-rejects-canonical-thread-environ-before-reader
    action: fs.grep_file
    args: {path: /proc/thread-self/environ, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path:"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-file-rejects-surviving-process-fd-before-reader
    action: fs.grep_file
    args: {path: /proc/self/fd/2147483647, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path:"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-process-root-before-reader
    action: fs.grep_recursive
    args: {path: /proc/1, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing recursive pseudo-filesystem root: /proc/1"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-proc-root-before-reader
    action: fs.grep_recursive
    args: {path: /proc, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing recursive pseudo-filesystem root: /proc"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-filesystem-root-before-reader
    action: fs.grep_recursive
    args: {path: /, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing recursive pseudo-filesystem root: /"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-process-task-root-before-reader
    action: fs.grep_recursive
    args: {path: /proc/1/task, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing recursive pseudo-filesystem root: /proc/1/task"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-thread-root-before-reader
    action: fs.grep_recursive
    args: {path: /proc/1/task/1, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing recursive pseudo-filesystem root: /proc/1/task/1"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-recursive-rejects-fd-root-before-reader
    action: fs.grep_recursive
    args: {path: /proc/1/fd, pattern: packtest}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path: /proc/1/fd"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.head-file-rejects-kcore-before-reader
    action: fs.head_file
    args: {path: /proc/kcore}
    expect:
      # kcore remains in the descriptor denylist as the first layer; the
      # shared script carries the same check as defense in depth.
      status: failure
      exit: [0]
      reason_contains: ["argument path: path /proc/kcore is denied"]
    probes:
      - name: head was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-head-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.tail-file-rejects-device-before-reader
    action: fs.tail_file
    args: {path: /dev/null}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path: /dev/null"]
    probes:
      - name: tail was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-tail-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  - name: fs.grep-file-rejects-symlinked-environ-before-reader
    action: fs.grep_file
    args: {path: /tmp/packtest-proc-alias/environ, pattern: packtest}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-proc-alias && ln -s /proc/1/environ /tmp/packtest-proc-alias/environ"
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["fs-search: refusing sensitive pseudo-filesystem path: /proc/1/environ"]
    probes:
      - name: grep was not invoked
        argv: [/bin/sh, -c, "test ! -e /tmp/packtest-grep-invoked && echo not-invoked"]
        expect: {stdout_contains: [not-invoked]}

  # Canonical path validation still leaves useful process, kernel-pressure, and
  # sysfs diagnostics available through the same shared reader.
  - name: fs.head-file-allows-symlinked-proc-meminfo
    action: fs.head_file
    args: {path: /tmp/packtest-proc-alias/meminfo, lines: 2}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-proc-alias && ln -s /proc/meminfo /tmp/packtest-proc-alias/meminfo"
    expect:
      stdout_contains: ["MemTotal:"]
    probes:
      - name: head spy delegated the allowed read
        argv: [/bin/sh, -c, "test -e /tmp/packtest-head-invoked && echo invoked"]
        expect: {stdout_contains: [invoked]}

  - name: fs.tail-file-allows-proc-pressure
    action: fs.tail_file
    args: {path: /proc/pressure/cpu, lines: 2}
    # The tail spy supplies this diagnostic on Docker hosts that do not mount
    # PSI files; reaching it is the assertion that the guard kept the path.
    expect:
      stdout_contains: ["some avg10="]
    probes:
      - name: tail spy handled the allowed read
        argv: [/bin/sh, -c, "test -e /tmp/packtest-tail-invoked && echo invoked"]
        expect: {stdout_contains: [invoked]}

  - name: fs.grep-recursive-allows-process-status-file
    action: fs.grep_recursive
    args: {path: /proc/1/status, pattern: "^Name:"}
    expect:
      stdout_contains: ["Name:"]
    probes:
      - name: grep spy delegated the allowed read
        argv: [/bin/sh, -c, "test -e /tmp/packtest-grep-invoked && echo invoked"]
        expect: {stdout_contains: [invoked]}

  - name: fs.grep-file-allows-process-limits
    action: fs.grep_file
    args: {path: /proc/1/limits, pattern: "^Max open files"}
    expect:
      stdout_contains: ["Max open files"]

  - name: fs.grep-recursive-allows-sys-diagnostic-file
    action: fs.grep_recursive
    args: {path: /sys/devices/system/cpu/online, pattern: "[0-9]"}
    expect:
      stdout_contains: ["/sys/devices/system/cpu/online:1:"]

  - name: fs.grep-file-treats-leading-dash-as-a-pattern
    action: fs.grep_file
    args: {path: /tmp/packtest-grep/dash.log, pattern: "-alpha"}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-grep && printf '%s\\n' '-alpha literal' 'beta' > /tmp/packtest-grep/dash.log"
    expect:
      stdout_contains: ["-alpha literal"]
      stdout_not_contains: [beta]

  - action: fs.file_type
    args: {path: /tmp/packtest-filetype/notes.txt}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/packtest-filetype && printf 'alpha\\n' > /tmp/packtest-filetype/notes.txt"
    expect:
      stdout_contains: ["/tmp/packtest-filetype/notes.txt: ASCII text"]
