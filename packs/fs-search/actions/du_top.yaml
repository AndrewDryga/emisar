schema_version: 1
id: fs.du_top
title: du -d1 — top N entries
kind: exec
risk: low
description: >
  Show the 20 largest entries directly under one path, largest first — files and
  directories, hidden ones included. Use to find where the space went.
side_effects:
  - One file-system traversal.
  - Read-only.
search_terms:
  - where did the space go
  - disk filling up
  - biggest directories
args:
  - name: path
    type: path
    required: true
    description: Root path.
    validation:
      pattern: "^/[a-zA-Z0-9_./\\-]{0,512}$"
      denied_paths:
        - /etc/shadow
        - /etc/gshadow
        - /etc/shadow-
        - /etc/gshadow-
        - /etc/sudoers
        - /proc/kcore
      denied_prefixes:
        - /etc/ssl/private
        - /root/.ssh
        - /etc/ssh
        - /etc/sudoers.d
        - /etc/emisar
        - /var/lib/emisar
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # du walks the tree itself rather than being handed a "$1"/* glob, because
      # a /bin/sh glob never matches a leading dot: every dot-directory under the
      # requested path was absent from the ranking, and on a home or app directory
      # .cache/.local/.venv IS usually the answer. -a keeps top-level files in the
      # ranking the way the glob did; awk drops du's own total for "$1" so the
      # output stays one line per entry underneath it.
      # 2>/dev/null suppresses per-entry permission noise, and the pipeline exits
      # with head's status — so a nonexistent path would report success with no
      # output, reading as "empty directory". Guard it explicitly.
      - |
        [ -d "$1" ] || { echo "not a readable directory: $1" >&2; exit 1; }
        du -ah --max-depth=1 --exclude=.ssh --exclude=ssh --exclude=private --exclude=sudoers.d "$1" 2>/dev/null | awk -F'\t' -v root="$1" '$2 != root' | sort -rh | head -20
      - "emisar"
      - "{{ args.path }}"
  timeout: 5m
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Where's the space in /var?
    args:
      path: "/var"
