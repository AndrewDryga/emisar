schema_version: 1
id: fs.grep_file
title: grep <pattern> <file>
kind: script
risk: low
description: Show matching lines in one file. Pattern is treated as POSIX ERE.
side_effects:
  - One read of the file.
  - Read-only.
args:
  - name: path
    type: path
    required: true
    description: File path.
    validation:
      pattern: "^/[a-zA-Z0-9_./\\-]{0,512}$"
      denied_paths:
        - /etc/shadow
        - /etc/gshadow
        - /etc/shadow-
        - /etc/gshadow-
        - /etc/sudoers
        - /proc/kcore
      denied_prefixes:
        - /etc/ssl/private
        - /root/.ssh
        - /etc/ssh
        - /etc/sudoers.d
        - /etc/emisar
        - /var/lib/emisar
  - name: pattern
    type: string
    required: true
    description: Regex.
    validation:
      pattern: "^[^'\"`$;|&<>]{1,256}$"
  - name: case_insensitive
    type: boolean
    required: false
    default: false
    description: -i mode.
execution:
  script:
    path: scripts/content_read.sh
    interpreter: /bin/sh
  argv:
    - grep-file
    - "{{ args.path }}"
    - "{{ args.pattern }}"
    - "{{ args.case_insensitive }}"
  timeout: 2m
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
  redact:
    - name: private-key-pem
      type: regex
      pattern: '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'
      replacement: '[REDACTED PRIVATE KEY]'
examples:
  - title: grep ERROR in syslog
    args:
      path: "/var/log/syslog"
      pattern: "ERROR"
