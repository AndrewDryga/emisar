services:
- metadata-api
versions:
- version: 587.0.0-slim
  digest: '@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f'
  default: true
secret_env:
- CLOUDSDK_AUTH_ACCESS_TOKEN
inherit_env:
- CLOUDSDK_AUTH_ACCESS_TOKEN
- CURL_CA_BUNDLE
env:
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-secret-manager-access-882d
  CURL_CA_BUNDLE: /packs/gcp-secret-manager/test/fixtures/server.crt
defaults:
  expect:
    stdout_not_contains:
    - packtest-canary-secret-manager-access-882d
    - packtest-canary-secret-manager-invalid-access-7c22
    - packtest-canary-secret-manager-private-extra-29ac
    - packtest-canary-secret-manager-auth-noise-48f2
    stderr_not_contains:
    - packtest-canary-secret-manager-access-882d
    - packtest-canary-secret-manager-invalid-access-7c22
    - packtest-canary-secret-manager-private-extra-29ac
    - packtest-canary-secret-manager-auth-noise-48f2
cases:
- name: gcp-secret-manager.version_details-numeric
  action: gcp-secret-manager.version_details
  args:
    project: example-prod
    secret: enabled-secret
    version: '7'
  expect:
    json:
      /name: projects/example-prod/secrets/enabled-secret/versions/7
      /state: ENABLED
      /create_time: '2026-11-07T22:00:00.123456789Z'
      /destroy_time: null
  probes:
  - name: Exact metadata-only provider request
    argv:
    - /bin/sh
    - -c
    - curl -fsS --cacert /packs/gcp-secret-manager/test/fixtures/server.crt https://metadata-api/probe/state
      | jq -c '{total:(.requests|length),access:.access_called,method:.requests[0].method,body_length:.requests[0].body_length,fields:.requests[0].query.fields[0],encoding:.requests[0].accept_encoding,host:.requests[0].host}'
    expect:
      json:
        /total: 1
        /access: false
        /method: GET
        /body_length: 0
        /fields: name,state,createTime,destroyTime
        /encoding: identity
        /host: secretmanager.googleapis.com
