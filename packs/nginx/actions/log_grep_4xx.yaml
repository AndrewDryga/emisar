schema_version: 1
id: nginx.log_grep_4xx
title: Recent 4xx responses from access log
kind: exec
risk: low
description: >
  Grep the access log for 4xx status codes. Needs the log on disk — the
  official container image symlinks it to stdout, where the host's log
  collector owns it instead. Read-only.
side_effects:
  - Reads /var/log/nginx/access.log.
  - Read-only.
args:
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many recent 4xx lines.
    validation:
      min: 1
      max: 5000
  - name: log_path
    type: string
    required: false
    description: >
      Access log path. Omit to use $NGINX_ACCESS_LOG, else
      /var/log/nginx/access.log. Constrained to /var/log/nginx — a host whose
      logs live elsewhere declares that in NGINX_ACCESS_LOG, which only the
      host administrator can set.
    validation:
      pattern: "^/var/log/nginx/[A-Za-z0-9._/-]{1,128}$"
      # The pattern constrains lexical shape but NOT `..` — `.` and `/` are
      # literal charset members. allowed_prefixes runs the runner's Clean+EvalSymlinks
      # containment, collapsing any `../` escape to its real path and rejecting
      # anything outside the nginx log dir.
      allowed_prefixes:
        - /var/log/nginx
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The pipeline exits with tail's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "no 4xx".
      - |
        log="$1"
        [ -n "$log" ] || log="${NGINX_ACCESS_LOG:-/var/log/nginx/access.log}"
        [ -r "$log" ] || { echo "access log not readable: $log" >&2; exit 1; }
        grep -E ' 4[0-9][0-9] ' "$log" | tail -n {{ args.lines }}
      - "emisar"
      - "{{ args.log_path? }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Last 100 4xx
    args: {}
