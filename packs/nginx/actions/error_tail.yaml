schema_version: 1

id: nginx.error_tail
title: Tail nginx error log
kind: exec
risk: medium

description: >
  Return the last N lines from /var/log/nginx/error.log. Use to spot
  upstream connect failures, SSL handshake errors, or worker crashes
  immediately after a reload. Read-only.

side_effects:
  - Reads /var/log/nginx/error.log.
  - Read-only.

args:
  - name: lines
    type: integer
    required: false
    default: 200
    description: How many tail lines.
    validation:
      min: 1
      max: 5000

  - name: log_path
    type: string
    required: false
    description: >
      Path to error log. Omit to use $NGINX_ERROR_LOG, else
      /var/log/nginx/error.log. Constrained to /var/log/nginx — a host whose
      logs live elsewhere declares that in NGINX_ERROR_LOG, which only the
      host administrator can set.
    validation:
      pattern: "^/var/log/nginx/[A-Za-z0-9._/-]{1,128}$"
      # The pattern constrains lexical shape but NOT `..` — `.` and `/` are
      # literal charset members. allowed_prefixes runs the runner's Clean+EvalSymlinks
      # containment, collapsing any `../` escape to its real path and rejecting
      # anything outside the nginx log dir.
      allowed_prefixes:
        - /var/log/nginx

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # No pipeline here, so tail's own status already surfaces a missing file.
      # The guard is for a consistent, named error across the log actions.
      - |
        log="$1"
        [ -n "$log" ] || log="${NGINX_ERROR_LOG:-/var/log/nginx/error.log}"
        [ -r "$log" ] || { echo "error log not readable: $log" >&2; exit 1; }
        tail -n {{ args.lines }} "$log"
      - "emisar"
      - "{{ args.log_path? }}"
  timeout: 30s

output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384

examples:
  - title: Last 200 error log lines
    args: {}
