schema_version: 1
id: nginx.upstream_list
title: List configured upstream blocks
kind: exec
risk: low
description: >
  List each `upstream` block from `nginx -T` with its name and `server`
  lines. Only those are returned: other directives inside or near an upstream
  block, such as `keepalive` or a location's `proxy_next_upstream` and
  `proxy_set_header`, never are. If the config does not parse, only nginx's own
  diagnostic lines are returned, as `nginx.test_config` returns them.
  Read-only.
side_effects:
  - One nginx -T invocation.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A config that doesn't parse made `nginx -T` fail, its reason vanish into
      # /dev/null, and awk emit nothing — reported as "no upstreams defined".
      # nginx dumps nothing on failure, and only its "nginx: " lines are kept.
      #
      # The dump is read as nginx reads it — words, quoted strings, comments
      # and the ; { } that end a statement — so only an `upstream NAME {`
      # statement in the http or stream block opens a block, wherever its
      # brace falls, and only its `server` statements print.
      - |
        dump=$(nginx -T 2>&1) || {
          printf '%s\n' "$dump" | grep '^nginx: ' >&2
          exit 1
        }
        printf '%s\n' "$dump" | grep -v '^nginx: ' | awk '
          function emit_word() { if (inword) t[nt++] = word; word = ""; inword = 0 }
          function end_statement(c,   i, s) {
            emit_word()
            if (c == ";") {
              if (inup && depth == updepth + 1 && nt > 1 && t[0] == "server") {
                s = "    server"
                for (i = 1; i < nt; i++) s = s " " t[i]
                print s ";"
              }
            } else if (c == "{") {
              if (!inup && depth == 1 && nt == 2 && t[0] == "upstream") {
                inup = 1; updepth = depth; print "upstream " t[1] " {"
              }
              depth++
            } else {
              depth--
              if (inup && depth == updepth) { inup = 0; print "}" }
            }
            nt = 0
          }
          {
            n = length($0)
            for (i = 1; i <= n; i++) {
              c = substr($0, i, 1)
              if (q != "") {
                if (esc) { word = word c; esc = 0 }
                else if (c == "\\") esc = 1
                else if (c == q) q = ""
                else word = word c
                continue
              }
              if (c == "#" && !inword) break
              if (c == "\"" || c == "\047") { q = c; inword = 1; continue }
              if (c == ";" || c == "{" || c == "}") { end_statement(c); continue }
              if (c == " " || c == "\t" || c == "\r") { emit_word(); continue }
              word = word c; inword = 1
            }
            if (q != "") word = word "\n"; else emit_word()
          }
        '
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: All upstreams
    args: {}
