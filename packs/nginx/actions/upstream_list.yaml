schema_version: 1
id: nginx.upstream_list
title: List configured upstream blocks
kind: exec
risk: low
description: Greps `nginx -T` for `upstream` + `server` directives inside upstream blocks. Read-only.
side_effects:
  - One nginx -T invocation.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A config that doesn't parse made `nginx -T` fail, its reason vanish into
      # /dev/null, and awk emit nothing — reported as "no upstreams defined".
      - |
        dump=$(nginx -T 2>&1) || { printf '%s\n' "$dump" >&2; exit 1; }
        printf '%s\n' "$dump" | awk '/upstream /{p=1; print; next} p && /\}/{p=0; print; next} p'
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: All upstreams
    args: {}
