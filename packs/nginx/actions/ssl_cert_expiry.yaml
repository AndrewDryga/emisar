schema_version: 1
id: nginx.ssl_cert_expiry
title: TLS cert expiry for one vhost
kind: exec
risk: low
description: Probe localhost:443 with SNI to read the cert expiry. Returns notBefore/notAfter and subject/issuer.
side_effects:
  - One openssl s_client to localhost.
  - Read-only.
args:
  - name: sni
    type: string
    required: true
    description: Server Name Indication (the vhost to probe).
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{1,253}$"
  - name: port
    type: integer
    required: false
    default: 443
    description: Port to probe.
    validation:
      min: 1
      max: 65535
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # s_client's stderr carries BOTH its handshake chatter and the reason a
      # connection failed. Discarding it left `openssl x509` to fail on empty
      # input, so a refused port reported "unable to load certificate" — a
      # parsing error for what was actually a connectivity problem. Capture the
      # handshake, and on failure surface s_client's own words.
      - |
        chain=$(openssl s_client -connect 127.0.0.1:{{ args.port }} -servername "$1" </dev/null 2>&1) || {
          printf '%s\n' "$chain" >&2
          exit 1
        }
        printf '%s\n' "$chain" | openssl x509 -noout -dates -subject -issuer
      - "emisar"
      - "{{ args.sni }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Expiry for example.com vhost
    args:
      sni: "example.com"
