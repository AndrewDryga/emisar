schema_version: 1
id: nginx.vhost_list
title: List configured server_name + listen blocks
kind: exec
risk: low
description: >
  Grep `nginx -T` output for `server_name` and `listen` directives — a compact view of every virtual host this nginx serves. Read-only.
side_effects:
  - One nginx -T invocation (config validation).
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A config that doesn't parse made `nginx -T` fail, its reason vanish into
      # /dev/null, and grep find nothing — reported as "this host serves no
      # vhosts". Keep nginx's own status and let its error reach stderr.
      - |
        dump=$(nginx -T 2>&1) || { printf '%s\n' "$dump" >&2; exit 1; }
        printf '%s\n' "$dump" | grep -E '^\s*(server_name|listen)\b'
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: All configured vhosts
    args: {}
