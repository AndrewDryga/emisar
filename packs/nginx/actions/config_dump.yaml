schema_version: 1
id: nginx.config_dump
title: Full loaded config (nginx -T)
kind: exec
risk: high
description: >
  Dump the loaded config — main + all includes — via `nginx -T`. Config
  text can carry secrets (authorization headers set via proxy_set_header,
  credentials embedded in proxy_pass URLs or map/return directives). The
  runner's redaction is a fail-closed backstop, not a guarantee — it is
  pattern-bound and can miss a bespoke secret whose name and value match
  no rule.
side_effects:
  - One nginx -T invocation.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # `nginx -T` exits non-zero on a broken config and prints the parse error.
      # Piping straight to head would discard that status and report success —
      # the worst possible answer from the action you run to check the config.
      - |
        dump=$(nginx -T 2>&1); status=$?
        printf '%s\n' "$dump" | head -800
        exit $status
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384
examples:
  - title: Show what nginx loaded
    args: {}
