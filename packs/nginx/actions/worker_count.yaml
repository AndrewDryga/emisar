schema_version: 1
id: nginx.worker_count
title: Live worker process count
kind: exec
risk: low
description: Count the workers spawned by the master via pgrep. Read-only.
side_effects:
  - One pgrep invocation.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # An unreadable pid file must not answer "0": zero live workers and no
      # master pid are opposite findings, and only one of them is an outage.
      - "MP=$(cat /run/nginx.pid 2>/dev/null); [ -n \"$MP\" ] || { echo 'cannot read the nginx master pid from /run/nginx.pid' >&2; exit 1; }; count=$(pgrep -c -P \"$MP\"); echo \"${count:-0}\""
  timeout: 5s
output:
  parser: text
  max_stdout_bytes: 64
  max_stderr_bytes: 4096
examples:
  - title: Worker count
    args: {}
