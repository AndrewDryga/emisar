schema_version: 1

id: nginx.access_top_clients
title: Top client IPs from access log
kind: exec
risk: low

description: >
  Tail the access log and return the top N source IPs by hit count.
  Assumes the default combined log format (client IP in column 1).
  Use to spot abusive crawlers or single-host traffic spikes that
  hint at a misconfigured client. Read-only.

side_effects:
  - Reads /var/log/nginx/access.log.
  - Read-only.

args:
  - name: lines
    type: integer
    required: false
    default: 100000
    description: How many tail lines to analyze.
    validation:
      min: 1000
      max: 1000000

  - name: limit
    type: integer
    required: false
    default: 30
    description: Top-N IPs.
    validation:
      min: 1
      max: 200

  - name: log_path
    type: string
    required: false
    description: >
      Path to access log. Omit to use $NGINX_ACCESS_LOG, else
      /var/log/nginx/access.log. Constrained to /var/log/nginx — a host whose
      logs live elsewhere declares that in NGINX_ACCESS_LOG, which only the
      host administrator can set.
    validation:
      pattern: "^/var/log/nginx/[A-Za-z0-9._/-]{1,128}$"
      # The pattern constrains lexical shape but NOT `..` — `.` and `/` are
      # literal charset members. allowed_prefixes runs the runner's Clean+EvalSymlinks
      # containment, collapsing any `../` escape to its real path and rejecting
      # anything outside the nginx log dir.
      allowed_prefixes:
        - /var/log/nginx

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The pipeline exits with head's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "no traffic".
      - |
        log="$1"
        [ -n "$log" ] || log="${NGINX_ACCESS_LOG:-/var/log/nginx/access.log}"
        [ -r "$log" ] || { echo "access log not readable: $log" >&2; exit 1; }
        tail -n {{ args.lines }} "$log" | awk '{print $1}' | sort | uniq -c | sort -nr | head -n {{ args.limit }}
      - "emisar"
      - "{{ args.log_path? }}"
  timeout: 60s

output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 16384

examples:
  - title: Top 30 source IPs
    args: {}
