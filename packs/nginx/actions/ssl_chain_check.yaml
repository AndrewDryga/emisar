schema_version: 1
id: nginx.ssl_chain_check
title: TLS chain dump for one vhost
kind: exec
risk: low
description: >
  Probe 127.0.0.1 at the given port (default 443) with SNI and dump the
  certificate chain it presents. Use to confirm the intermediate cert is
  being served. Only the chain is returned, never the session details
  openssl prints after it.
side_effects:
  - One openssl s_client to localhost.
  - Read-only.
args:
  - name: sni
    type: string
    required: true
    description: SNI to probe.
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{1,253}$"
  - name: port
    type: integer
    required: false
    default: 443
    description: Port to probe.
    validation:
      min: 1
      max: 65535
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - |
        set -eu
        status=0
        handshake=$(openssl s_client -connect 127.0.0.1:{{ args.port }} -servername "$1" -showcerts </dev/null 2>/dev/null) || status=$?
        # Print only the first server-sent chain, never later session or peer text.
        printf '%s\n' "$handshake" | awk '
          /^Certificate chain$/ && !seen { seen=1; printing=1 }
          printing { print }
          printing && /^---$/ { printing=0 }
        '
        if [ "$status" -ne 0 ]; then
          printf 'TLS connection to 127.0.0.1:%s failed\n' '{{ args.port }}' >&2
        fi
        exit "$status"
      - "emisar"
      - "{{ args.sni }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Chain for api.example.com
    args:
      sni: "api.example.com"
