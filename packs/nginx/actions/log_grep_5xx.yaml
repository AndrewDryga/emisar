schema_version: 1
id: nginx.log_grep_5xx
title: Recent 5xx responses from access log
kind: exec
risk: low
description: >
  Greps the access log for 5xx status codes (assumes combined log format).
  Needs the log on disk — the official container image symlinks it to stdout,
  where the host's log collector owns it instead. Read-only.
side_effects:
  - Reads /var/log/nginx/access.log.
  - Read-only.
args:
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many recent 5xx lines.
    validation:
      min: 1
      max: 5000
  - name: log_path
    type: string
    required: false
    default: /var/log/nginx/access.log
    description: Access log path.
    validation:
      pattern: "^/var/log/nginx/[A-Za-z0-9._/-]{1,128}$"
      # The pattern constrains lexical shape but NOT `..` — `.` and `/` are
      # literal charset members. allowed_prefixes runs the runner's Clean+EvalSymlinks
      # containment, collapsing any `../` escape to its real path and rejecting
      # anything outside the nginx log dir.
      allowed_prefixes:
        - /var/log/nginx
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The pipeline exits with tail's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "no 5xx".
      - |
        [ -r "$1" ] || { echo "access log not readable: $1" >&2; exit 1; }
        grep -E ' 5[0-9][0-9] ' "$1" | tail -n {{ args.lines }}
      - "emisar"
      - "{{ args.log_path }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Last 100 5xx
    args: {}
