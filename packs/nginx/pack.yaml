schema_version: 1

id: nginx
name: Nginx operations pack
version: 0.2.20
retired_below: 0.2.15
description: >
  Operator pack for nginx — read-only status + access-log analysis,
  TLS cert probes, and narrow operator actions (test_config, reload,
  graceful quit, stop). Full restart is intentionally not included;
  use systemd for that.
vendor: emisar
homepage: https://emisar.dev/packs/nginx

requires:
  os:
    - linux
  binaries:
    - nginx
    - curl

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - nginx

setup:
  summary: >
    Operates on the local nginx instance on the runner host — no
    credentials needed. Status actions curl the stub_status endpoint at
    127.0.0.1; config and signal actions run the nginx binary directly.
  env:
    - name: NGINX_ACCESS_LOG
      required: false
      default: /var/log/nginx/access.log
      description: >
        Where this host's nginx access log lives, for the access-log actions.
        Set it when the log is outside `/var/log/nginx` — the actions' own
        log_path argument is deliberately contained to that directory, so this
        is how the host administrator, rather than a caller, declares a
        non-standard location.
      example: /data/logs/nginx/access.log
    - name: NGINX_ERROR_LOG
      required: false
      default: /var/log/nginx/error.log
      description: Where this host's nginx error log lives, for error_tail. Same reasoning as `NGINX_ACCESS_LOG`.
      example: /data/logs/nginx/error.log
  notes:
    - "reload, quit_graceful, and stop_immediate signal the master process and need root (run the runner as root or via sudo)."
    - "Status actions require `stub_status on;` in a location reachable from 127.0.0.1; the `url` arg is loopback-only (127.0.0.1/localhost/[::1]) — pass a non-default port/path, not an off-host target."
    - "Logs outside `/var/log/nginx`: set `NGINX_ACCESS_LOG` / `NGINX_ERROR_LOG` (and allowlist them in the runner's `execution.inherit_env`). The log_path argument stays contained to `/var/log/nginx` because a caller — including an LLM — supplies it; the environment is host-administrator state, and anyone who can set it can already read the file. The official container image symlinks access.log to stdout, in which case no file exists to read at any path and the host's log collector owns it. For unrestricted `/var/log` access, install linux-core, whose name says so."
  verify: nginx.active_version

actions:
  # Server state
  - actions/active_version.yaml
  - actions/master_pid.yaml
  - actions/worker_count.yaml
  - actions/connections_now.yaml
  - actions/compiled_modules.yaml
  - actions/status.yaml
  # Config
  - actions/config_dump.yaml
  - actions/vhost_list.yaml
  - actions/upstream_list.yaml
  # Access log analysis
  - actions/access_top_urls.yaml
  - actions/access_top_clients.yaml
  - actions/log_grep_5xx.yaml
  - actions/log_grep_4xx.yaml
  - actions/slow_requests.yaml
  - actions/bytes_by_url.yaml
  - actions/error_tail.yaml
  # TLS
  - actions/ssl_cert_expiry.yaml
  - actions/ssl_chain_check.yaml
  # Mutators
  - actions/test_config.yaml
  - actions/reload.yaml
  - actions/quit_graceful.yaml
  - actions/stop_immediate.yaml
