schema_version: 1

id: nginx
name: Nginx operations pack
version: 0.2.12
retired_below: 0.2.9
description: >
  Operator pack for nginx — read-only status + access-log analysis,
  TLS cert probes, and narrow operator actions (test_config, reload,
  graceful quit, stop). Full restart is intentionally not included;
  use systemd for that.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os:
    - linux
  binaries:
    - nginx
    - curl

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - nginx

setup:
  summary: >
    Operates on the local nginx instance on the runner host — no
    credentials needed. Status actions curl the stub_status endpoint at
    127.0.0.1; config and signal actions run the nginx binary directly.
  notes:
    - "reload, quit_graceful, and stop_immediate signal the master process and need root (run the runner as root or via sudo)."
    - "Status actions require `stub_status on;` in a location reachable from 127.0.0.1; the `url` arg is loopback-only (127.0.0.1/localhost/[::1]) — pass a non-default port/path, not an off-host target."
    - "The access-log actions read files under /var/log/nginx only, so the pack grants what its name implies. If your logs live elsewhere, symlink the directory (ln -s /data/logs/nginx /var/log/nginx) — the runner resolves symlinks on both the allowed prefix and the input, so containment still holds. The official container image symlinks access.log to stdout, in which case no file exists to read and the host's log collector owns it. For unrestricted /var/log access, install linux-core, whose name says so."
  verify: nginx.active_version

actions:
  # Server state
  - actions/active_version.yaml
  - actions/master_pid.yaml
  - actions/worker_count.yaml
  - actions/connections_now.yaml
  - actions/compiled_modules.yaml
  - actions/status.yaml
  # Config
  - actions/config_dump.yaml
  - actions/vhost_list.yaml
  - actions/upstream_list.yaml
  # Access log analysis
  - actions/access_top_urls.yaml
  - actions/access_top_clients.yaml
  - actions/log_grep_5xx.yaml
  - actions/log_grep_4xx.yaml
  - actions/slow_requests.yaml
  - actions/bytes_by_url.yaml
  - actions/error_tail.yaml
  # TLS
  - actions/ssl_cert_expiry.yaml
  - actions/ssl_chain_check.yaml
  # Mutators
  - actions/test_config.yaml
  - actions/reload.yaml
  - actions/quit_graceful.yaml
  - actions/stop_immediate.yaml
