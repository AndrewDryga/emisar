worker_processes 1;
pid /var/run/nginx.pid;
# The master's signal messages (SIGHUP "reconfiguring") come from the core
# logger, not the http-context one below — nginx.reload's case greps for them.
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 128;
}

http {
    log_format packtest '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log packtest;
    error_log /var/log/nginx/error.log notice;

    # upstream servers: this comment, the one-line block, the brace on its own
    # line and the location below are the shapes nginx.upstream_list must read
    # without printing the directives around them.
    upstream packtest_backend {
        server 127.0.0.1:8081;
    }
    upstream packtest_inline { server 127.0.0.1:8082 weight=2; keepalive 4; }
    upstream packtest_split
    {
        zone packtest_split 64k;
        server 127.0.0.1:8083 max_fails=3;
    }

    server {
        listen 80 default_server;
        server_name packtest.local;

        location /nginx_status {
            stub_status;
        }

        location = /missing {
            return 404;
        }

        location = /error500 {
            return 500;
        }

        location = /log-error {
            root /nonexistent;
        }

        location / {
            return 200 "pack-test ok\n";
        }

        # A deliberately secret-shaped header: nginx.config_dump's behavior case
        # asserts `nginx -T` returns it redacted. Mirrors NGINX_PACKTEST_CANARY
        # in test/cases.yaml.
        location = /packtest-retry {
            proxy_next_upstream error timeout;
            proxy_set_header X-Api-Key packtest-upstream-neighbour-7e2a;
            proxy_pass http://packtest_split;
        }

        location = /packtest-proxied {
            proxy_set_header Authorization "Bearer packtest-canary-nginx-8c31f7";
            proxy_pass http://packtest_backend;
        }
    }
}
