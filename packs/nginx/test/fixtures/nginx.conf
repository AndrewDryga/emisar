worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    log_format packtest '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log packtest;
    error_log /var/log/nginx/error.log notice;

    upstream packtest_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80 default_server;
        server_name packtest.local;

        location /nginx_status {
            stub_status;
        }

        location = /missing {
            return 404;
        }

        location = /error500 {
            return 500;
        }

        location = /log-error {
            root /nonexistent;
        }

        location / {
            return 200 "pack-test ok\n";
        }
    }
}
