services: [nginx]
versions:
  - version: "1.31.5"
    digest: "@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4"
    default: true
secret_env: [NGINX_PACKTEST_CANARY]
env:
  # Mirrors the Authorization canary in test/fixtures/nginx.conf — declaring it
  # here makes the harness fail any surface that leaks it unredacted.
  NGINX_PACKTEST_CANARY: packtest-canary-nginx-8c31f7
cases:
  - action: nginx.active_version
    expect:
      stderr_contains: [nginx version]
  - action: nginx.compiled_modules
    expect:
      stdout_contains: [--with-http_ssl_module, --with-http_stub_status_module]
  - action: nginx.connections_now
    args: {url: http://127.0.0.1/nginx_status}
    expect:
      stdout_contains: [Active connections, Reading, Writing, Waiting]
  - action: nginx.status
    args: {url: http://127.0.0.1/nginx_status}
    expect:
      stdout_contains: [Active connections, server accepts handled requests]
  - action: nginx.config_dump
    expect:
      stdout_contains:
        - packtest.local
        - packtest_backend
        # The fixture's Authorization header comes back masked by the runner's
        # default redaction — the leak this action's high risk is about.
        - "Bearer [REDACTED]"
      stdout_not_contains:
        - packtest-canary-nginx-8c31f7
    probes:
      - argv: [curl, -fsS, http://127.0.0.1/]
        expect:
          stdout_contains: [pack-test ok]
  - action: nginx.vhost_list
    expect:
      stdout_contains: [packtest.local]
  # Only upstream names and their server lines: not the comment, the
  # keepalive or zone inside a block, nor the location lines after a
  # proxy_next_upstream, whose header value no redaction rule would mask.
  - action: nginx.upstream_list
    expect:
      stdout_contains:
        - "upstream packtest_backend {\n    server 127.0.0.1:8081;\n}"
        - "upstream packtest_inline {\n    server 127.0.0.1:8082 weight=2;\n}"
        - "upstream packtest_split {\n    server 127.0.0.1:8083 max_fails=3;\n}"
      stdout_not_contains:
        - packtest-upstream-neighbour-7e2a
        - proxy_next_upstream
        - keepalive
        - zone
        - "upstream servers"
        - packtest-canary-nginx-8c31f7
  - name: nginx.upstream_list-config-error
    action: nginx.upstream_list
    # The real nginx, pointed at a copy of the config that no longer parses.
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            set -eu
            cp /etc/nginx/nginx.conf /tmp/packtest-broken.conf
            printf '%s\n' 'packtest_broken_directive on;' >> /tmp/packtest-broken.conf
            mkdir -p /tmp/packtest-nginx-bin
            printf '%s\n' '#!/bin/sh' 'exec /usr/sbin/nginx -c /tmp/packtest-broken.conf "$@"' > /tmp/packtest-nginx-bin/nginx
            chmod 0755 /tmp/packtest-nginx-bin/nginx
    env:
      PATH: /tmp/packtest-nginx-bin:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      status: failure
      exit: [1]
      stderr_contains: ['nginx: [emerg] unknown directive "packtest_broken_directive"']
      stderr_not_contains: [packtest-upstream-neighbour-7e2a, packtest-canary-nginx-8c31f7]
  - action: nginx.access_top_urls
    args: {lines: 1000, limit: 30, log_path: /var/log/nginx/access.log}
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/packtest]
    expect:
      stdout_contains: [/packtest]
  - action: nginx.access_top_clients
    args: {lines: 1000, limit: 30, log_path: /var/log/nginx/access.log}
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
    expect:
      stdout_contains: [127.0.0.1]
  - action: nginx.log_grep_4xx
    args: {lines: 100, log_path: /var/log/nginx/access.log}
    arrange:
      - argv: [curl, -sS, -o, /dev/null, http://127.0.0.1/missing]
    expect:
      stdout_contains: [GET /missing, "404"]
  - action: nginx.log_grep_5xx
    args: {lines: 100, log_path: /var/log/nginx/access.log}
    arrange:
      - argv: [curl, -sS, -o, /dev/null, http://127.0.0.1/error500]
    expect:
      stdout_contains: [GET /error500, "500"]
  # The status is the field after the request, not any 3-digit number: a 200
  # with a 512- or 404-byte body is neither a 5xx nor a 4xx.
  - name: nginx.log_grep_5xx-status-field-only
    action: nginx.log_grep_5xx
    args: {lines: 100, log_path: /var/log/nginx/access.log}
    arrange: &status_lines
      - argv:
          - /bin/sh
          - -c
          - |
            printf '%s\n' \
              '203.0.113.1 - - [25/Sep/2026:10:00:00 +0000] "GET /ok-512 HTTP/1.1" 200 512 "-" "Mozilla/5.0"' \
              '203.0.113.2 - - [25/Sep/2026:10:00:01 +0000] "GET /ok-404 HTTP/1.1" 200 404 "-" "Mozilla/5.0"' \
              '203.0.113.3 - - [25/Sep/2026:10:00:02 +0000] "GET /gone HTTP/1.1" 404 500 "-" "Mozilla/5.0"' \
              '203.0.113.4 - - [25/Sep/2026:10:00:03 +0000] "GET /broken HTTP/1.1" 502 404 "-" "Mozilla/5.0"' \
              >> /var/log/nginx/access.log
    expect:
      stdout_contains: [GET /broken]
      stdout_not_contains: [/ok-512, /ok-404, /gone]
  - name: nginx.log_grep_4xx-status-field-only
    action: nginx.log_grep_4xx
    args: {lines: 100, log_path: /var/log/nginx/access.log}
    arrange: *status_lines
    expect:
      stdout_contains: [GET /gone]
      stdout_not_contains: [/ok-512, /ok-404, /broken]
  # Only the presented chain: never the session id, ticket or master key that
  # openssl prints after it for a TLS 1.2 connection.
  - action: nginx.ssl_chain_check
    args: {sni: packtest-chain.example, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/nginx/test/fixtures/tls-chain-fixture.sh, start]
      - argv: [/bin/sh, /packs/nginx/test/fixtures/tls-chain-fixture.sh, verify-raw]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: [Certificate chain, '0 s:CN=packtest-chain.example', '1 s:CN=Packtest-Chain-CA', '-----BEGIN CERTIFICATE-----']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK, Server certificate, Cipher is]
      stderr_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket]
    cleanup:
      - argv: [/bin/sh, /packs/nginx/test/fixtures/tls-chain-fixture.sh, stop]
  - name: nginx.ssl_chain_check-closed-port
    action: nginx.ssl_chain_check
    args: {sni: packtest-chain.example, port: 24444}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ['TLS connection to 127.0.0.1:24444 failed']
      stdout_not_contains: [Certificate chain, SSL-Session]
  - action: nginx.bytes_by_url
    args: {lines: 1000, limit: 30}
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/bytes]
    expect:
      stdout_contains: [/bytes]
  - action: nginx.slow_requests
    args: {lines: 1000, limit: 30, column: 14}
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/slow]
    expect:
      stdout_contains: [/slow]
  # nginx's stock combined format puts the referer at column 11, the default. A
  # row whose column is not a request time prints nothing, so a token in a
  # referer's query string never reaches the output; a row with a request time
  # there prints it with the path alone.
  - name: nginx.slow-requests-skips-a-non-numeric-column
    action: nginx.slow_requests
    args: {lines: 1000}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            printf '%s\n' \
              '203.0.113.9 - - [25/Sep/2026:10:00:00 +0000] "GET /app/page?x=1 HTTP/1.1" 200 512 "https://app.example.com/reset?token=PACKTESTSECRET" "Mozilla/5.0"' \
              '203.0.113.10 - - [25/Sep/2026:10:00:01 +0000] "GET /checkout?card=PACKTESTCARD HTTP/1.1" 200 512 0.731 "-" "Mozilla/5.0"' \
              >> /var/log/nginx/access.log
    expect:
      stdout_contains: ["0.731 /checkout 200"]
      stdout_not_contains: [PACKTESTSECRET, PACKTESTCARD, "token="]
  - action: nginx.error_tail
    args: {lines: 20, log_path: /var/log/nginx/error.log}
    arrange:
      - argv: [curl, -sS, -o, /dev/null, http://127.0.0.1/log-error]
    expect:
      stdout_contains: [/nonexistent/log-error, failed]
  - action: nginx.test_config
    expect:
      stderr_contains: [syntax is ok, test is successful]
  # Both stop actions ARE coverable — the probe is "is it gone?", the same shape
  # redis.shutdown_nosave uses. Each case runs in its own disposable Compose
  # project, so a stopped SUT costs nothing after it.
  - action: nginx.quit_graceful
    runner_user: root
    runner_reason: nginx -s quit signals the root-owned master read from its pid file; the kernel rejects the signal from the non-root runner.
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    probes:
      - name: nginx stopped serving
        argv: [/bin/sh, -c, 'curl -fsS -m 2 http://127.0.0.1/ >/dev/null 2>&1 || echo stopped']
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [stopped]

  - action: nginx.stop_immediate
    runner_user: root
    runner_reason: nginx -s stop signals the root-owned master read from its pid file; the kernel rejects the signal from the non-root runner.
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    probes:
      - name: nginx stopped serving
        argv: [/bin/sh, -c, 'curl -fsS -m 2 http://127.0.0.1/ >/dev/null 2>&1 || echo stopped']
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [stopped]

  - action: nginx.reload
    runner_user: root
    runner_reason: nginx -s reload sends SIGHUP to the root-owned master read from its pid file; the kernel rejects the signal from the non-root runner.
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    probes:
      - name: master logged the reconfigure
        argv: [/bin/sh, -c, "grep -Eq 'signal 1 \\(SIGHUP\\) received from [0-9]+, reconfiguring' /var/log/nginx/error.log && echo reload-reconfigured"]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [reload-reconfigured]
      - name: workers respawned and still serve
        argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [pack-test ok]
