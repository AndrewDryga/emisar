services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/nginx/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-1.31.3}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-nginx-tools:latest
    network_mode: service:nginx
    # nginx -s reload reads the master pid from /var/run/nginx.pid (the shared
    # /run volume below) and signals it, so the runner must live in the SUT's
    # pid namespace for the kill to reach it.
    pid: service:nginx
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_run:/run
      - ${EMISAR_ROOT}/packs/nginx/test/fixtures/nginx.conf:/etc/nginx/nginx.conf:ro

  nginx:
    image: nginx:${PACKTEST_VERSION:-1.31.3}${PACKTEST_DIGEST-}
    command:
      - /bin/sh
      - -c
      # nginx runs as root here and the log + /run volumes are shared with
      # runner-tools, where the non-root runner also opens these files — so
      # widen them once at creation rather than leaving root-owned 0644 files
      # the runner cannot use. The pre-created 0666 pid file keeps its mode
      # when the master truncates it in place, so the non-root runner's
      # `nginx -t`/`-T` (which open the configured pid file read-write) keep
      # working now that /run is shared.
      # NOT `exec`: runner-tools shares this pid namespace, so whatever is PID 1
      # here is PID 1 for the runner too. exec'ing nginx made the master PID 1,
      # and the stop/quit actions kill it by design — the kernel then SIGKILLs
      # every remaining process in the namespace, including the packtest process
      # still reading the result, which surfaced as an exit-137 harness error
      # rather than the action's own outcome. Keeping the shell as PID 1 and
      # idling after nginx exits lets the case finish; compose tears the whole
      # project down straight after it either way.
      - rm -f /var/log/nginx/access.log /var/log/nginx/error.log && touch /var/log/nginx/access.log /var/log/nginx/error.log /var/run/nginx.pid && chmod 0666 /var/log/nginx/access.log /var/log/nginx/error.log /var/run/nginx.pid && chmod 0777 /var/run && { /docker-entrypoint.sh nginx -g 'daemon off;'; exec sleep infinity; }
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_run:/run
      - ${EMISAR_ROOT}/packs/nginx/test/fixtures/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/nginx_status | grep -q 'Active connections'"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  nginx_logs:
  nginx_run:
