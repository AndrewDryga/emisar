services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/nginx/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-1.31.3}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-nginx-tools:latest
    network_mode: service:nginx
    volumes:
      - nginx_logs:/var/log/nginx
      - ${EMISAR_ROOT}/packs/nginx/test/fixtures/nginx.conf:/etc/nginx/nginx.conf:ro

  nginx:
    image: nginx:${PACKTEST_VERSION:-1.31.3}${PACKTEST_DIGEST-}
    command:
      - /bin/sh
      - -c
      # nginx runs as root here and the log volume is shared with runner-tools,
      # where the non-root runner also opens these files — so widen them once at
      # creation rather than leaving root-owned 0644 files the runner cannot use.
      - rm -f /var/log/nginx/access.log /var/log/nginx/error.log && touch /var/log/nginx/access.log /var/log/nginx/error.log && chmod 0666 /var/log/nginx/access.log /var/log/nginx/error.log && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - nginx_logs:/var/log/nginx
      - ${EMISAR_ROOT}/packs/nginx/test/fixtures/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/nginx_status | grep -q 'Active connections'"]
      interval: 2s
      retries: 20

volumes:
  nginx_logs:
