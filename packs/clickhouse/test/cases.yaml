services: [clickhouse, clickhouse-standalone]
# Each case now owns two heavyweight servers; cap simultaneous hostile SUTs
# at four (6 GiB total declared memory), rather than eight (12 GiB).
workers: 2
versions:
  - version: "26.9.7.9-alpine"
    digest: "@sha256:aa718f827374252d34a60aed1b065b01d78d1deae9788e84d817c9e0d36618ce"
    default: true
  - version: 26.8.14.3-alpine
    digest: "@sha256:6d7f6c28dcc30f7aad4ea2e0d0b52a7bc5dde54df2b08aa3fcb4b0eeb461ba89"
  - version: 25.8.33.6-alpine
    digest: "@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146"
secret_env: [CH_PASSWORD]
env:
  CH_HOST: clickhouse
  CH_PASSWORD: packtest-canary-clickhouse-98e4f2
  CH_USER: default
cases:
  - action: ch.table_definition_structure
    args: {target: default.packtest_ddl}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            native=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --param_database=default --param_table=packtest_ddl --query "SELECT normalizeQueryKeepNames(create_table_query) FROM system.tables WHERE database={database:String} AND name={table:String} LIMIT 1 FORMAT TabSeparatedRaw");
            case "$native" in *'FixedString(?)'*'TTL occurred_at + toIntervalDay(?)'*) ;; *) exit 1 ;; esac;
            case "$native" in *packtest-canary*) exit 1 ;; esac;
            echo ch-native-normalization-verified
        expect:
          stdout_contains: [ch-native-normalization-verified]
    expect:
      json:
        /database: default
        /name: packtest_ddl
        /engine: MergeTree
        /literals_omitted: true
        /recreatable_sql: false
      stdout_contains: ['FixedString(?)', 'PARTITION BY toYYYYMM(occurred_at)', 'ORDER BY (service, occurred_at)', 'TTL occurred_at + toIntervalDay(?)']
      stdout_not_contains: [packtest-canary-ch-ddl-default-316f, packtest-canary-ch-ddl-comment-406a, packtest-canary-ch-ddl-table-comment-54a9, 'FixedString(16)', 'toIntervalDay(30)']

  - action: ch.table_ddl
    args: {target: default.packtest_ddl}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            native=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --param_database=default --param_table=packtest_ddl --query "SHOW CREATE TABLE {database:Identifier}.{table:Identifier} FORMAT TabSeparatedRaw");
            case "$native" in *'FixedString(16)'*'TTL occurred_at + toIntervalDay(30)'*'packtest-canary-ch-ddl-table-comment-54a9'*) ;; *) exit 1 ;; esac;
            echo ch-native-full-ddl-verified
        expect:
          stdout_contains: [ch-native-full-ddl-verified]
    expect:
      stdout_contains: ['CREATE TABLE default.packtest_ddl', 'ENGINE = MergeTree', 'PARTITION BY toYYYYMM(occurred_at)', 'ORDER BY (service, occurred_at)', 'TTL occurred_at + toIntervalDay(30)', 'FixedString(16)', packtest-canary-ch-ddl-default-316f, packtest-canary-ch-ddl-comment-406a, packtest-canary-ch-ddl-table-comment-54a9]

  - name: ch.table_definition_structure-reserved-identifier
    action: ch.table_definition_structure
    args: {target: default.select}
    expect:
      json: {/database: default, /name: select, /engine: Memory}
      stdout_contains: ['ENGINE = Memory']

  - name: ch.table_ddl-hyphenated-identifiers
    action: ch.table_ddl
    args: {target: packtest-db.table-name}
    expect:
      stdout_contains: ['CREATE TABLE `packtest-db`.`table-name`', 'ENGINE = Memory']

  - name: ch.table_definition_structure-missing-table
    action: ch.table_definition_structure
    args: {target: default.packtest_missing}
    expect:
      status: failure
      stderr_contains: [table not found]
      stdout_not_contains: ['CREATE TABLE', 'normalized_definition']

  - name: ch.table_ddl-missing-table
    action: ch.table_ddl
    args: {target: default.packtest_missing}
    expect:
      status: failure
      stderr_contains: [CANNOT_GET_CREATE_TABLE_QUERY]
      stdout_not_contains: ['CREATE TABLE', 'statement']

  - name: ch.table_definition_structure-missing-database
    action: ch.table_definition_structure
    args: {target: packtest_missing.packtest_ddl}
    expect:
      status: failure
      stderr_contains: [table not found]
      stdout_not_contains: ['CREATE TABLE', 'normalized_definition']

  - name: ch.table_ddl-missing-database
    action: ch.table_ddl
    args: {target: packtest_missing.packtest_ddl}
    expect:
      status: failure
      stderr_contains: [UNKNOWN_DATABASE]
      stdout_not_contains: ['CREATE TABLE', 'statement']

  - name: ch.table_definition_structure-authentication-failure
    action: ch.table_definition_structure
    args: {target: default.packtest_ddl}
    env: {CH_PASSWORD: packtest-canary-ch-structure-invalid-auth-62c9}
    expect:
      status: failure
      stderr_contains: [AUTHENTICATION_FAILED]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_ddl-authentication-failure
    action: ch.table_ddl
    args: {target: default.packtest_ddl}
    env: {CH_PASSWORD: packtest-canary-ch-ddl-invalid-auth-953c}
    expect:
      status: failure
      stderr_contains: [AUTHENTICATION_FAILED]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_definition_structure-permission-failure
    action: ch.table_definition_structure
    args: {target: default.packtest_ddl}
    env: {CH_USER: packtest_no_tables}
    arrange:
      - argv: [/bin/sh, -c, 'CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user default --query "CREATE USER packtest_no_tables IDENTIFIED BY ''packtest-canary-clickhouse-98e4f2''"']
    expect:
      status: failure
      stderr_contains: [ACCESS_DENIED]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_ddl-permission-failure
    action: ch.table_ddl
    args: {target: default.packtest_ddl}
    env: {CH_USER: packtest_no_tables}
    arrange:
      - argv: [/bin/sh, -c, 'CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user default --query "CREATE USER packtest_no_tables IDENTIFIED BY ''packtest-canary-clickhouse-98e4f2''"']
    expect:
      status: failure
      stderr_contains: [ACCESS_DENIED]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_definition_structure-unavailable-server
    action: ch.table_definition_structure
    args: {target: default.packtest_ddl}
    env: {CH_HOST: 127.0.0.2}
    expect:
      status: failure
      stderr_contains: [NETWORK_ERROR]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_ddl-unavailable-server
    action: ch.table_ddl
    args: {target: default.packtest_ddl}
    env: {CH_HOST: 127.0.0.2}
    expect:
      status: failure
      stderr_contains: [NETWORK_ERROR]
      stdout_not_contains: ['CREATE TABLE']

  - name: ch.table_definition_structure-rejects-injection
    action: ch.table_definition_structure
    args: {target: 'default.packtest_ddl; SELECT 1'}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  - name: ch.table_ddl-rejects-quotes
    action: ch.table_ddl
    args: {target: 'default."packtest_ddl"'}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  - name: ch.table_definition_structure-rejects-extra-dot
    action: ch.table_definition_structure
    args: {target: default.packtest.ddl}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  - name: ch.table_ddl-rejects-empty-component
    action: ch.table_ddl
    args: {target: .packtest_ddl}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  - name: ch.table_definition_structure-rejects-129-byte-identifier
    action: ch.table_definition_structure
    args: {target: 'default.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  - name: ch.table_ddl-rejects-129-byte-identifier
    action: ch.table_ddl
    args: {target: 'default.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
    expect:
      status: failure
      reason: argument_invalid
      error_contains: [must match pattern]

  # These fixtures contain opaque, undeclared DDL literals. The normalized
  # read must omit them at the source, not rely on credential redaction.
  - name: ch.table_definition_structure-omits-large-comment
    action: ch.table_definition_structure
    args: {target: default.packtest_big_comment}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            comment=$(printf '%070000d' 0);
            CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "CREATE TABLE default.packtest_big_comment (id UInt8) ENGINE=Memory COMMENT '$comment'";
            bytes=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "SELECT length(create_table_query) FROM system.tables WHERE database='default' AND name='packtest_big_comment'");
            test "$bytes" -gt 65536;
            echo ch-native-large-comment-verified
        expect: {stdout_contains: [ch-native-large-comment-verified]}
    expect:
      json: {/name: packtest_big_comment, /literals_omitted: true, /recreatable_sql: false}
      stdout_contains: ['COMMENT ?']
      stdout_not_contains: ['00000000000000000000000000000000']

  - name: ch.table_ddl-rejects-large-comment
    action: ch.table_ddl
    args: {target: default.packtest_big_comment}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            comment=$(printf '%070000d' 0);
            CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "CREATE TABLE default.packtest_big_comment (id UInt8) ENGINE=Memory COMMENT '$comment'";
            bytes=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "SELECT length(create_table_query) FROM system.tables WHERE database='default' AND name='packtest_big_comment'");
            test "$bytes" -gt 65536;
            echo ch-native-large-comment-verified
        expect: {stdout_contains: [ch-native-large-comment-verified]}
    expect:
      status: failure
      stderr_contains: [TOO_MANY_ROWS_OR_BYTES]
      stdout_not_contains: ['CREATE TABLE', 'statement', '00000000000000000000000000000000']

  - name: ch.table_ddl-rejects-json-escaping-overflow
    action: ch.table_ddl
    args: {target: default.packtest_escaped_comment}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            comment=$(printf '%040000d' 0 | tr 0 '"');
            CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "CREATE TABLE default.packtest_escaped_comment (id UInt8) ENGINE=Memory COMMENT '$comment'";
            bytes=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "SELECT length(create_table_query) FROM system.tables WHERE database='default' AND name='packtest_escaped_comment'");
            test "$bytes" -lt 65536;
            native=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --max_result_bytes=65536 --result_overflow_mode=throw --query 'SHOW CREATE TABLE default.packtest_escaped_comment FORMAT JSONEachRow');
            test "${#native}" -gt 65536;
            echo ch-native-json-escaping-overflow-verified
        expect: {stdout_contains: [ch-native-json-escaping-overflow-verified]}
    expect:
      status: failure
      stderr_contains: [table definition exceeds output limit]
      stdout_not_contains: ['CREATE TABLE', 'statement']

  - name: ch.table_definition_structure-rejects-oversized-structure
    action: ch.table_definition_structure
    args: {target: default.packtest_wide}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - >-
            set -eu;
            query='CREATE TABLE default.packtest_wide ('; sep=''; i=0;
            while test "$i" -lt 900; do
              query="${query}${sep}column_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_${i} UInt8";
              sep=','; i=$((i + 1));
            done;
            query="${query}) ENGINE=Memory";
            CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "$query";
            bytes=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "SELECT length(normalizeQueryKeepNames(create_table_query)) FROM system.tables WHERE database='default' AND name='packtest_wide'");
            test "$bytes" -gt 65536;
            echo ch-native-large-structure-verified
        expect: {stdout_contains: [ch-native-large-structure-verified]}
    expect:
      status: failure
      stderr_contains: [TOO_MANY_ROWS_OR_BYTES]
      stdout_not_contains: ['CREATE TABLE', 'normalized_definition', 'column_aaaaaaaa']

  - action: ch.asynchronous_metrics
    expect:
      stdout_contains: ['"metric"', '"value"', '"metric":"MemoryResident"', '"metric":"Uptime"']
      stdout_not_contains: ['"description"', 'CPUFrequencyMHz', 'NetworkReceive', 'BlockRead', 'OSUserTimeCPU', '"value":null']
  - name: ch.zookeeper_connection-single-node
    action: ch.zookeeper_connection
    env:
      CH_HOST: clickhouse-standalone
    arrange:
      - argv: [/bin/sh, -c, 'set -eu; present=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "EXISTS TABLE system.zookeeper_connection FORMAT TabSeparated"); test "$present" = 0; echo ch-native-keeper-absent']
        expect:
          stdout_contains: [ch-native-keeper-absent]
    expect:
      stdout_contains: [no ZooKeeper/Keeper configured]
  - name: ch.zookeeper_connection-keeper-present
    action: ch.zookeeper_connection
    arrange:
      - argv: [/bin/sh, -c, 'set -eu; present=$(CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user "$CH_USER" --query "EXISTS TABLE system.zookeeper_connection FORMAT TabSeparated"); test "$present" = 1; echo ch-native-keeper-present']
        expect:
          stdout_contains: [ch-native-keeper-present]
    expect:
      stdout_contains: ['"host"', '"client_id"', '"keeper_api_version"']
      stdout_not_contains: [no ZooKeeper/Keeper configured]
  - name: ch.zookeeper_connection-authentication-failure
    action: ch.zookeeper_connection
    env:
      CH_HOST: clickhouse-standalone
      CH_PASSWORD: packtest-canary-clickhouse-invalid-auth-c21a
    expect:
      status: failure
      stderr_contains: [AUTHENTICATION_FAILED]
      stdout_not_contains: [no ZooKeeper/Keeper configured]
  - name: ch.zookeeper_connection-permission-failure
    action: ch.zookeeper_connection
    env:
      CH_USER: packtest_no_tables
    arrange:
      - argv: [/bin/sh, -c, 'CLICKHOUSE_PASSWORD="$CH_PASSWORD" clickhouse-client --host "$CH_HOST" --user default --query "CREATE USER packtest_no_tables IDENTIFIED BY ''packtest-canary-clickhouse-98e4f2''"']
    expect:
      status: failure
      stderr_contains: [ACCESS_DENIED]
      stdout_not_contains: [no ZooKeeper/Keeper configured]
  - name: ch.zookeeper_connection-unavailable-server
    action: ch.zookeeper_connection
    env:
      CH_HOST: 127.0.0.2
    expect:
      status: failure
      stderr_contains: [NETWORK_ERROR]
      stdout_not_contains: [no ZooKeeper/Keeper configured]
  - action: ch.disks
    expect:
      stdout_contains: ['"name":"default"', '"path"']
  - action: ch.parts_by_partition
    expect:
      stdout_contains: ['"table":"packtest_events"', '"rows":3']
  - action: ch.parts_summary
    expect:
      stdout_contains: ['"table":"packtest_events"', '"rows":3']
  - action: ch.processes
    expect:
      stdout_contains: ['"query_id"', system.processes]
  - action: ch.system_events
    expect:
      stdout_contains: ['"event"', '"value"']
  - action: ch.system_metrics
    expect:
      stdout_contains: ['"metric"', '"value"']
  - action: ch.table_sizes
    expect:
      stdout_contains: ['"name":"packtest_events"', '"total_rows":3']
  - action: ch.tables_overview
    expect:
      stdout_contains: ['"name":"packtest_events"', '"engine":"MergeTree"']
  - action: ch.uptime
    expect:
      stdout_contains: ["version()", "uptime()"]
  # Each seeds a canary where the old query read it raw: a Keeper node value,
  # a mutation's WHERE literal, an error message quoting its input, and a
  # dictionary's HTTP source URL (where presigned signatures that no redaction
  # rule names would sit; ClickHouse's own endpoint only accepts settings).
  - action: ch.keeper_status
    args: {path: /packtest}
    arrange:
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "INSERT INTO system.zookeeper (name, path, value) VALUES (''packtest-node'', ''/packtest'', ''packtest-canary-ch-keeper-value-8d41'')" && echo ch-keeper-seeded']
        expect:
          stdout_contains: [ch-keeper-seeded]
        retry_for: 30s
        retry_every: 1s
    expect:
      stdout_contains: ['"name":"packtest-node"', '"dataLength":36']
      stdout_not_contains: [packtest-canary-ch-keeper-value-8d41]
  - action: ch.mutation_queue
    arrange:
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SYSTEM STOP MERGES default.packtest_events"']
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "ALTER TABLE default.packtest_events DELETE WHERE service = ''packtest-canary-ch-mutation-5c1e''"']
    expect:
      stdout_contains: ['"table":"packtest_events"', 'service = ?']
      stdout_not_contains: [packtest-canary-ch-mutation-5c1e]
  - action: ch.errors
    arrange:
      - argv: [/bin/sh, -c, '! clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT toUInt64(''packtest-canary-ch-error-2b7a'')" 2>/dev/null && echo ch-error-raised']
        expect:
          stdout_contains: [ch-error-raised]
    expect:
      stdout_contains: ['"name":"CANNOT_PARSE_TEXT"']
      stdout_not_contains: [packtest-canary-ch-error-2b7a]
  - action: ch.dictionaries
    arrange:
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "CREATE USER dictsrc"']
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "CREATE DICTIONARY default.packtest_dict (id UInt64, v String) PRIMARY KEY id SOURCE(HTTP(URL ''http://127.0.0.1:8123/?user=dictsrc&log_comment=packtest-canary-ch-dict-9f3c&query=SELECT%201%20AS%20id,%20%27x%27%20AS%20v%20FORMAT%20TabSeparated'' FORMAT ''TabSeparated'')) LAYOUT(FLAT()) LIFETIME(0)"']
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SYSTEM RELOAD DICTIONARY default.packtest_dict"']
    expect:
      stdout_contains: ['"name":"packtest_dict"', '"status":"LOADED"', '"source_type":"http"']
      stdout_not_contains: [packtest-canary-ch-dict-9f3c]
  - action: ch.optimize_table
    args: {database: default, table: packtest_events}
    # stdout_contains matches a substring, so asserting "3" on a bare count also
    # accepts 13, 30 or 300 rows. Compare the count exactly in the shell and
    # assert the token that comparison prints instead.
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM default.packtest_events")" = 3 && echo ch-optimize-rows-kept']
        expect:
          stdout_contains: [ch-optimize-rows-kept]
  - action: ch.kill_query
    args: {query_id: packtest-kill-query}
    arrange:
      - argv: [/bin/sh, -c, 'nohup clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query_id packtest-kill-query --query "SELECT sleepEachRow(1) FROM numbers(120) SETTINGS max_block_size=1" >/tmp/packtest-kill-query.log 2>&1 &']
      # Exact comparison, not a substring match on "1": see optimize_table above.
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.processes WHERE query_id = ''packtest-kill-query''")" = 1 && echo ch-kill-query-running']
        expect:
          stdout_contains: [ch-kill-query-running]
        retry_for: 10s
        retry_every: 250ms
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.processes WHERE query_id = ''packtest-kill-query''")" = 0 && echo ch-kill-query-gone']
        expect:
          stdout_contains: [ch-kill-query-gone]
        retry_for: 10s
        retry_every: 250ms
  - action: ch.kill_mutation
    # Stop the merge/mutation scheduler so an ALTER…UPDATE mutation stays queued
    # (is_done=0), resolve its mutation_id from system.mutations, then KILL it.
    args:
      database: default
      table: packtest_events
    arrange:
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SYSTEM STOP MERGES default.packtest_events"']
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "ALTER TABLE default.packtest_events UPDATE duration_ms = duration_ms WHERE 1"']
      # Exact comparison, not a substring match on "1": see optimize_table above.
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0")" = 1 && echo ch-mutation-queued']
        expect:
          stdout_contains: [ch-mutation-queued]
        retry_for: 10s
        retry_every: 250ms
    resolve_args:
      mutation_id:
        argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT mutation_id FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0 ORDER BY create_time DESC LIMIT 1"']
        retry_for: 15s
        retry_every: 500ms
    expect:
      stdout_contains: [packtest_events]
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0")" = 0 && echo ch-mutation-gone']
        expect:
          stdout_contains: [ch-mutation-gone]
        retry_for: 15s
        retry_every: 500ms
  - action: ch.reload_config
    # The liveness answer is one row, so compare it exactly: a substring match on
    # "1" accepted any output that happened to carry the digit.
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT 1")" = 1 && echo ch-reload-config-alive']
        expect:
          stdout_contains: [ch-reload-config-alive]
