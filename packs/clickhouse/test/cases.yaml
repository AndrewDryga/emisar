services: [clickhouse]
versions:
  - version: 26.8.2.7-alpine
    digest: "@sha256:8f1dd1ec7213410276c8e9aee11b25b458fe9d53eee13ad8cfdf7c79e36aad17"
    default: true
  - version: 25.8.33.6-alpine
    digest: "@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146"
secret_env: [CH_PASSWORD]
env:
  CH_HOST: clickhouse
  CH_PASSWORD: packtest-canary-clickhouse-98e4f2
  CH_USER: default
cases:
  - action: ch.asynchronous_metrics
    expect:
      stdout_contains: ['"metric"', '"value"']
  - action: ch.disks
    expect:
      stdout_contains: ['"name":"default"', '"path"']
  - action: ch.parts_by_partition
    expect:
      stdout_contains: ['"table":"packtest_events"', '"rows":3']
  - action: ch.parts_summary
    expect:
      stdout_contains: ['"table":"packtest_events"', '"rows":3']
  - action: ch.processes
    expect:
      stdout_contains: ['"query_id"', system.processes]
  - action: ch.system_events
    expect:
      stdout_contains: ['"event"', '"value"']
  - action: ch.system_metrics
    expect:
      stdout_contains: ['"metric"', '"value"']
  - action: ch.table_sizes
    expect:
      stdout_contains: ['"name":"packtest_events"', '"total_rows":3']
  - action: ch.tables_overview
    expect:
      stdout_contains: ['"name":"packtest_events"', '"engine":"MergeTree"']
  - action: ch.uptime
    expect:
      stdout_contains: ["version()", "uptime()"]
  - action: ch.optimize_table
    args: {database: default, table: packtest_events}
    # stdout_contains matches a substring, so asserting "3" on a bare count also
    # accepts 13, 30 or 300 rows. Compare the count exactly in the shell and
    # assert the token that comparison prints instead.
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM default.packtest_events")" = 3 && echo ch-optimize-rows-kept']
        expect:
          stdout_contains: [ch-optimize-rows-kept]
  - action: ch.kill_query
    args: {query_id: packtest-kill-query}
    arrange:
      - argv: [/bin/sh, -c, 'nohup clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query_id packtest-kill-query --query "SELECT sleepEachRow(1) FROM numbers(120) SETTINGS max_block_size=1" >/tmp/packtest-kill-query.log 2>&1 &']
      # Exact comparison, not a substring match on "1": see optimize_table above.
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.processes WHERE query_id = ''packtest-kill-query''")" = 1 && echo ch-kill-query-running']
        expect:
          stdout_contains: [ch-kill-query-running]
        retry_for: 10s
        retry_every: 250ms
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.processes WHERE query_id = ''packtest-kill-query''")" = 0 && echo ch-kill-query-gone']
        expect:
          stdout_contains: [ch-kill-query-gone]
        retry_for: 10s
        retry_every: 250ms
  - action: ch.kill_mutation
    # Stop the merge/mutation scheduler so an ALTER…UPDATE mutation stays queued
    # (is_done=0), resolve its mutation_id from system.mutations, then KILL it.
    args:
      database: default
      table: packtest_events
    arrange:
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SYSTEM STOP MERGES default.packtest_events"']
      - argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "ALTER TABLE default.packtest_events UPDATE duration_ms = duration_ms WHERE 1"']
      # Exact comparison, not a substring match on "1": see optimize_table above.
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0")" = 1 && echo ch-mutation-queued']
        expect:
          stdout_contains: [ch-mutation-queued]
        retry_for: 10s
        retry_every: 250ms
    resolve_args:
      mutation_id:
        argv: [/bin/sh, -c, 'clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT mutation_id FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0 ORDER BY create_time DESC LIMIT 1"']
        retry_for: 15s
        retry_every: 500ms
    expect:
      stdout_contains: [packtest_events]
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT count() FROM system.mutations WHERE database = ''default'' AND table = ''packtest_events'' AND is_done = 0")" = 0 && echo ch-mutation-gone']
        expect:
          stdout_contains: [ch-mutation-gone]
        retry_for: 15s
        retry_every: 500ms
  - action: ch.reload_config
    # The liveness answer is one row, so compare it exactly: a substring match on
    # "1" accepted any output that happened to carry the digit.
    probes:
      - argv: [/bin/sh, -c, 'test "$(clickhouse-client --host clickhouse --user "$CH_USER" --password "$CH_PASSWORD" --query "SELECT 1")" = 1 && echo ch-reload-config-alive']
        expect:
          stdout_contains: [ch-reload-config-alive]
