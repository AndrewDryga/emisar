schema_version: 1
id: ch.optimize_table
title: OPTIMIZE TABLE FINAL
kind: exec
risk: high
description: Force merge of all parts into one. Heavy disk + CPU.
side_effects:
  - Background merge runs synchronously; can take minutes-to-hours on large tables.
  - Temporary doubling of disk space during the merge.
args:
  - name: database
    type: string
    required: true
    description: Database.
    validation:
      pattern: "^[a-zA-Z0-9_\\-]{1,128}$"
  - name: table
    type: string
    required: true
    description: Table.
    validation:
      pattern: "^[a-zA-Z0-9_\\-]{1,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Each name is backquoted on its own: unquoted, a hyphen parses as minus
      # and a trailing `--` comments out FINAL. The patterns admit no backquote.
      - "CLICKHOUSE_PASSWORD=\"$CH_PASSWORD\" clickhouse-client --host \"${CH_HOST:-localhost}\" --user \"${CH_USER:-default}\" --query \"OPTIMIZE TABLE \\`${1}\\`.\\`${2}\\` FINAL\""
      - "emisar"
      - "{{ args.database }}"
      - "{{ args.table }}"
  timeout: 1h
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Optimize table
    args:
      database: "default"
      table: "events"
