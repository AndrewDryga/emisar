schema_version: 1
id: mc.stats_sizes
title: stats sizes
kind: exec
risk: low
description: 'Show the histogram of item sizes. Needs memcached started with `-o track_sizes`; otherwise the reply is only `STAT sizes_status disabled`.'
side_effects: ["One `stats sizes` request; with size tracking enabled it reads the live histogram without scanning items.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "printf 'stats sizes\\nquit\\n' | nc -w 30 \"${MEMCACHED_HOST:-127.0.0.1}\" \"${MEMCACHED_PORT:-11211}\""
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Size histogram
    args: {}
