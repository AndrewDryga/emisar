# Every action here declares a `private-key-pem` redaction rule as a BACKSTOP.
# None of these commands can print a private key: the openssl reads all pass
# `-noout`/`-nokeys` (x509, pkcs12) and never emit the key even from a combined
# cert+key bundle, and find_certs prints file paths, not contents. So the rule
# cannot be made to fire, and each action is accounted for as unreachable below.
# The fixture still mints a real CA, leaf, PKCS#12 bundle, and a combined.pem
# (leaf certificate AND its private key), and each case asserts the command's
# real output while proving the key's own bytes never come back — the boundary
# that keeps the redaction rule a backstop rather than the active defence.
services: [ssl-material]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
env:
  PK12_PASSWORD: packtest-p12-pass
redaction_accountability:
  exceptions:
    # The command is the boundary on every action here: openssl x509/pkcs12 run
    # with -noout/-nokeys never print a key (even from the combined cert+key
    # bundle), key_modulus prints a digest of the modulus, and find_certs prints
    # paths. So the private-key-pem rule cannot fire — it is a backstop against a
    # future edit that makes one of these print certificate material. Measured,
    # not assumed: removing the rule leaves every case here green.
    ssl.cert_text: unreachable_by_construction
    ssl.cert_expiry: unreachable_by_construction
    ssl.cert_fingerprint: unreachable_by_construction
    ssl.find_certs: unreachable_by_construction
    ssl.key_modulus: unreachable_by_construction
    ssl.pkcs12_info: unreachable_by_construction
    ssl.verify_chain: unreachable_by_construction
defaults:
  expect:
    stdout_not_empty: true
cases:
  # The load-bearing case: a file that really does carry a PRIVATE KEY block.
  - name: ssl.cert-text-masks-a-key-in-a-combined-bundle
    action: ssl.cert_text
    args: {path: /etc/ssl/packtest/combined.pem}
    expect:
      stdout_contains: ["packtest.invalid", "Signature Algorithm"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----", "-----BEGIN RSA PRIVATE KEY-----"]

  - action: ssl.cert_expiry
    args: {path: /etc/ssl/packtest/leaf.crt}
    expect:
      stdout_contains: ["packtest.invalid", "notAfter"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----"]

  - action: ssl.cert_fingerprint
    args: {path: /etc/ssl/packtest/leaf.crt}
    expect:
      stdout_contains: ["Fingerprint"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----"]

  - action: ssl.find_certs
    args: {path: /etc/ssl/packtest}
    expect:
      stdout_contains: ["leaf.crt", "ca.crt"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----"]

  # key_modulus prints a SHA-256 OF the modulus on purpose — it exists to match
  # a key to a certificate without printing the modulus itself. The assertion is
  # that it is a bare digest and no PEM block came with it.
  - action: ssl.key_modulus
    args: {path: /etc/ssl/packtest/leaf.key}
    expect:
      stdout_contains: ["  -"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----", "-----BEGIN RSA PRIVATE KEY-----"]

  - action: ssl.verify_chain
    args: {cert: /etc/ssl/packtest/leaf.crt, ca_bundle: /etc/ssl/packtest/ca.crt}
    expect:
      stdout_contains: ["OK"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----"]

  - action: ssl.pkcs12_info
    args: {path: /etc/ssl/packtest/leaf.p12}
    expect:
      stdout_contains: ["Bag Attributes"]
      stdout_not_contains: ["-----BEGIN PRIVATE KEY-----", "-----BEGIN ENCRYPTED PRIVATE KEY-----"]
