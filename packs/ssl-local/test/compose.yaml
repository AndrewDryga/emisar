services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/ssl-local/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
    image: emisar-packtest-ssl-local-tools:latest
    volumes:
      - ssl-material:/etc/ssl/packtest:ro
    depends_on:
      ssl-material:
        condition: service_healthy

  # Mints the material into a volume both containers share, then stays up so
  # the harness can wait on it like any other SUT — a one-shot service would
  # exit, and `services:` waits for HEALTHY, not for completion. The healthcheck
  # is the generated bundle existing, so no case can read a half-written file.
  ssl-material:
    image: debian:${PACKTEST_VERSION:-13-slim}${PACKTEST_DIGEST-}
    volumes:
      - ssl-material:/out
    command:
      - /bin/sh
      - -ec
      - |
        apt-get update >/dev/null 2>&1
        apt-get install -y --no-install-recommends openssl >/dev/null 2>&1
        cd /out
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt \
          -days 3650 -subj "/CN=packtest-ca" >/dev/null 2>&1
        openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr \
          -subj "/CN=packtest.invalid" >/dev/null 2>&1
        openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -out leaf.crt -days 365 >/dev/null 2>&1
        # A combined PEM holding the leaf certificate AND its private key. This
        # is the shape the redaction rule exists for — an operator reading a
        # bundle must not get the key back through the model.
        cat leaf.crt leaf.key >combined.pem
        openssl pkcs12 -export -inkey leaf.key -in leaf.crt -out leaf.p12 \
          -passout pass:packtest-p12-pass >/dev/null 2>&1
        # A file whose CONTENT is a secret and whose FORMAT is not a
        # certificate — the shape the pack's tier decision turns on (authored
        # above actions/cert_text.yaml's `risk`). openssl has to refuse it and
        # echo none of it; the canary is what proves the second half.
        printf '%s\n%s\n' \
          'deploy:packtest-file-secret-9f3a2b' \
          'db.internal:5432:orders:emisar:packtest-file-secret-9f3a2b' \
          >not-a-cert.txt
        # A passphrase-protected key. openssl cannot read it unattended, and
        # must FAIL rather than hash an empty modulus — the regression the
        # argv comment in actions/key_modulus.yaml describes.
        openssl rsa -in leaf.key -aes256 -passout pass:packtest-key-pass \
          -out leaf-encrypted.key >/dev/null 2>&1
        chmod 0644 ca.crt ca.key leaf.crt leaf.key combined.pem leaf.p12 \
          not-a-cert.txt leaf-encrypted.key
        exec sleep infinity
    healthcheck:
      test: [CMD-SHELL, "test -s /out/combined.pem && test -s /out/leaf.p12 && test -s /out/not-a-cert.txt && test -s /out/leaf-encrypted.key"]
      interval: 2s
      start_period: 60s
      start_interval: 1s
      retries: 20

volumes:
  ssl-material:
