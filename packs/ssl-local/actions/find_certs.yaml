schema_version: 1
id: ssl.find_certs
title: find *.pem *.crt *.cer under <path>
kind: exec
risk: low
description: List certificate-like files under one path.
side_effects:
  - One file-system traversal.
  - Read-only.
args:
  - name: path
    type: string
    required: false
    default: "/etc/ssl"
    description: Root path.
    validation:
      pattern: "^/[a-zA-Z0-9_./\\-]{0,512}$"
      denied_paths:
        - /etc/shadow
        - /etc/gshadow
        - /etc/shadow-
        - /etc/gshadow-
      denied_prefixes:
        - /root/.ssh
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # 2>/dev/null suppresses per-entry permission noise, and the pipeline exits
      # with head's status — so a nonexistent path would report success with no
      # output, reading as "no certificates here". Guard it explicitly.
      - |
        [ -d "$1" ] || { echo "not a readable directory: $1" >&2; exit 1; }
        find "$1" -xdev -type f \( -name '*.pem' -o -name '*.crt' -o -name '*.cer' \) -print 2>/dev/null | head -500
      - "emisar"
      - "{{ args.path }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
  redact:
    # BACKSTOP, not the active defence. Measured by removing this rule and
    # re-running the behavior case: it still passed, because `-noout`/`-nokeys`
    # means openssl never prints a PEM private key however adversarial the
    # input. The rule earns its place against a future edit that drops that
    # flag — it does fire when a key block really is in the output.
    - name: private-key-pem
      type: regex
      pattern: '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'
      replacement: '[REDACTED PRIVATE KEY]'
examples:
  - title: Cert files under /etc/ssl
    args: {}
