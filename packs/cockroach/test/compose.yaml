services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/cockroach/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-v26.2.4}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-cockroach-tools:latest

  cockroach:
    image: cockroachdb/cockroach:${PACKTEST_VERSION:-v26.2.4}${PACKTEST_DIGEST-}
    command: start-single-node --insecure
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      start_period: 30s
      start_interval: 1s
      retries: 10
