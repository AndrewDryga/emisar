services: [cockroach]
versions:
  - version: v26.2.4
    digest: "@sha256:85417da0fd2f57e4f1b01ae8a4125402c977a38a56b43d0902db93dc2669ab09"
    default: true
env:
  COCKROACH_URL: "postgresql://root@cockroach:26257/defaultdb?sslmode=disable"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: cockroach.cluster_queries
    expect:
      stdout_contains: [query_id, cluster_queries]
  - action: cockroach.cluster_sessions
    expect:
      stdout_contains: [session_id, root]
  - action: cockroach.contention_events
    expect:
      stdout_contains: [collection_ts, contending_pretty_key]
  - action: cockroach.locks
    expect:
      stdout_contains: [range_id, lock_key_pretty]
  - action: cockroach.jobs
    expect:
      stdout_contains: [job_id, description, error]
  # Proves the redaction, not just the read: arrange a real OIDC client secret,
  # then assert the placeholder is present AND the secret's own bytes are gone.
  # Without the rule the value prints in cleartext — CockroachDB does not mask
  # it and the runner's defaults do not match the TSV shape.
  - action: cockroach.cluster_settings
    arrange:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e,
               "SET CLUSTER SETTING server.oidc_authentication.client_secret = 'packtest-oidc-secret'"]
    cleanup:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e,
               "RESET CLUSTER SETTING server.oidc_authentication.client_secret"]
    expect:
      stdout_contains: [version, setting, "server.oidc_authentication.client_secret\t[REDACTED]"]
      stdout_not_contains: ["packtest-oidc-secret"]
  - action: cockroach.databases
    expect:
      stdout_contains: [defaultdb]
  - action: cockroach.node_liveness
    expect:
      stdout_contains: [node_id, active]
  - action: cockroach.node_status
    expect:
      stdout_contains: [id, address, available]
  - action: cockroach.node_status_one
    args: {node_id: 1}
    expect:
      stdout_contains: ["1", available]
  - action: cockroach.replication_stats
    expect:
      stdout_contains: [total, under_replicated, unavailable]
  - action: cockroach.statement_stats
    arrange:
      - argv: [/bin/sh, -c, "i=0; while [ $i -lt 40 ]; do cockroach sql --url 'postgresql://root@cockroach:26257/defaultdb?sslmode=disable&application_name=packtest-statement-fingerprint' -e 'SELECT 424242 AS packtest_statement_fingerprint_probe' >/dev/null || exit $?; i=$((i + 1)); done"]
    expect:
      stdout_contains: [app_name, count, query, packtest-statement-fingerprint, packtest_statement_fingerprint_probe]
      stdout_not_contains: ["424242"]
  - action: cockroach.store_status
    expect:
      stdout_contains: [node_id, store_id, capacity]
  - action: cockroach.table_ranges
    args: {database: defaultdb, table: packtest_orders}
    arrange:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e, "CREATE TABLE IF NOT EXISTS packtest_orders (id INT PRIMARY KEY, status STRING); UPSERT INTO packtest_orders VALUES (1, 'paid'), (2, 'pending')"]
    expect:
      stdout_contains: [range_id, lease_holder]
    cleanup:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e, "DROP TABLE IF EXISTS packtest_orders"]
  - action: cockroach.table_row_counts
    arrange:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e, "CREATE TABLE IF NOT EXISTS packtest_rows (id INT PRIMARY KEY); UPSERT INTO packtest_rows VALUES (1), (2), (3); ANALYZE packtest_rows"]
      # ANALYZE returns before the statistic it wrote is readable, and the
      # action reads the statistic rather than the table.
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", --format=tsv, -e, "SET allow_unsafe_internals = true; SELECT table_name FROM crdb_internal.table_row_statistics WHERE table_name = 'packtest_rows'"]
        retry_for: 30s
        retry_every: 500ms
        expect:
          stdout_contains: [packtest_rows]
    expect:
      stdout_contains: [table_name, packtest_rows]
    cleanup:
      - argv: [cockroach, sql, --url, "postgresql://root@cockroach:26257/defaultdb?sslmode=disable", -e, "DROP TABLE IF EXISTS packtest_rows"]
