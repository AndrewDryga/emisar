services:
  mysql:
    image: mysql:${PACKTEST_VERSION:-9.7.1}${PACKTEST_DIGEST-}
    environment:
      MYSQL_ROOT_PASSWORD: packtest-canary-mysql-root-b813
      MYSQL_DATABASE: testdb
    volumes:
      - ${EMISAR_ROOT}/packs/mysql/test/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # The entrypoint seeds through a temporary loopback daemon. Dial the
      # routable address so health means a case on the bridge can connect.
      test: ["CMD-SHELL", "mysql -h \"$$(hostname -i)\" -uroot -ppacktest-canary-mysql-root-b813 -Nse 'SELECT COUNT(*) FROM testdb.orders' >/dev/null"]
      interval: 2s
      start_period: 30s
      # Poll cost scales with probe cost: this check spawns a heavyweight
      # client, and four cases boot at once on a four-core runner.
      start_interval: 5s
      retries: 30
