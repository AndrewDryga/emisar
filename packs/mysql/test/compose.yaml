services:
  mysql:
    image: mysql:9.7.1
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    volumes:
      - ${EMISAR_ROOT}/packs/mysql/test/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -ptestpass -Nse 'SELECT COUNT(*) FROM testdb.orders' >/dev/null"]
      interval: 2s
      retries: 30
