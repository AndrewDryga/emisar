services: [mysql]
versions:
  - version: "9.7.1"
    digest: "@sha256:c109c421c81637a50209b57ec6af7dc0685e8b1ce7efdca0c0902a3d95df6574"
    default: true
  - version: "8.4.6"
    digest: "@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9"
risk_accountability:
  mode: complete
secret_env: [MYSQL_PWD]
env:
  MYSQL_HOST: mysql
  MYSQL_PWD: packtest-canary-mysql-root-b813
cases:
  - action: mysql.analyze_table
    args: {database: testdb, table: packtest_analyze}
    arrange:
      - argv: [mysql, -e, "CREATE TABLE testdb.packtest_analyze (id INT PRIMARY KEY); INSERT INTO testdb.packtest_analyze VALUES (1)"]
    expect:
      stdout_contains: [testdb.packtest_analyze, status, OK]
    probes:
      - argv: [mysql, -NBe, "SELECT COUNT(*) FROM testdb.packtest_analyze"]
        expect:
          stdout_contains: ["1"]
    cleanup:
      - argv: [mysql, -e, "DROP TABLE IF EXISTS testdb.packtest_analyze"]
  - action: mysql.connections_summary
    expect:
      stdout_contains: [Threads_connected, max_connections]
  - action: mysql.db_sizes
    expect:
      stdout_contains: [testdb]
  - action: mysql.engines
    expect:
      stdout_contains: [InnoDB, DEFAULT]
  - action: mysql.index_unused
    arrange:
      - argv: [mysql, -e, "SELECT * FROM testdb.orders WHERE status = 'paid'"]
    expect:
      stdout_contains: [testdb, orders]
  - action: mysql.innodb_status
    expect:
      stdout_contains: [INNODB MONITOR OUTPUT]
  - action: mysql.kill_connection
    arrange:
      - argv: [/bin/sh, -c, 'nohup mysql -e "SELECT SLEEP(120) AS packtest_kill_connection" >/tmp/packtest-kill-connection.log 2>&1 &']
    resolve_args:
      thread_id:
        argv: [mysql, -NBe, "SELECT id FROM performance_schema.processlist WHERE info LIKE '%packtest_kill_connection%' AND id <> CONNECTION_ID() LIMIT 1"]
        retry_for: 10s
        retry_every: 250ms
    probes:
      - argv: [mysql, -NBe, "SELECT COUNT(*) FROM performance_schema.processlist WHERE info LIKE '%packtest_kill_connection%' AND id <> CONNECTION_ID()"]
        expect:
          stdout_contains: ["0"]
        retry_for: 10s
        retry_every: 250ms
  - action: mysql.kill_query
    arrange:
      - argv: [/bin/sh, -c, 'nohup mysql -e "SELECT SLEEP(120) AS packtest_kill_query" >/tmp/packtest-kill-query.log 2>&1 &']
    resolve_args:
      thread_id:
        argv: [mysql, -NBe, "SELECT id FROM performance_schema.processlist WHERE info LIKE '%packtest_kill_query%' AND id <> CONNECTION_ID() LIMIT 1"]
        retry_for: 10s
        retry_every: 250ms
    probes:
      - argv: [mysql, -NBe, "SELECT COUNT(*) FROM performance_schema.processlist WHERE info LIKE '%packtest_kill_query%' AND id <> CONNECTION_ID()"]
        expect:
          stdout_contains: ["0"]
        retry_for: 10s
        retry_every: 250ms
  - action: mysql.open_tables
    arrange:
      - argv: [mysql, -e, "SELECT * FROM testdb.orders"]
    expect:
      stdout_contains: [testdb, orders]
  - action: mysql.optimize_table
    args: {database: testdb, table: packtest_optimize}
    arrange:
      - argv: [mysql, -e, "CREATE TABLE testdb.packtest_optimize (id INT PRIMARY KEY); INSERT INTO testdb.packtest_optimize VALUES (1)"]
    expect:
      stdout_contains: [testdb.packtest_optimize, status, OK]
    probes:
      - argv: [mysql, -NBe, "SELECT COUNT(*) FROM testdb.packtest_optimize"]
        expect:
          stdout_contains: ["1"]
    cleanup:
      - argv: [mysql, -e, "DROP TABLE IF EXISTS testdb.packtest_optimize"]
  - action: mysql.processlist
    expect:
      stdout_contains: [root, Query]
  - action: mysql.slow_queries
    expect:
      stdout_contains: [SELECT COUNT, testdb, orders]
  - action: mysql.status
    expect:
      stdout_contains: [Threads_connected]
  - action: mysql.table_io_summary
    arrange:
      - argv: [mysql, -e, "SELECT * FROM testdb.orders WHERE customer = 'alice'"]
    expect:
      stdout_contains: [testdb, orders]
  - action: mysql.table_sizes
    expect:
      stdout_contains: [testdb, orders]
  - action: mysql.uptime
    expect:
      stdout_contains: [Uptime]
  - action: mysql.users_grants
    expect:
      stdout_contains: [root]
  - action: mysql.variables
    expect:
      stdout_contains: [innodb_buffer_pool_size]
