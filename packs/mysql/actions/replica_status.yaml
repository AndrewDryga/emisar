schema_version: 1
id: mysql.replica_status
title: SHOW REPLICA STATUS
kind: exec
risk: low
description: >
  Read SHOW REPLICA STATUS (or SHOW SLAVE STATUS on servers without it). Surfaces lag, last error, IO and SQL thread state, and binlog position. Returns 'not a replica' cleanly when this is a primary.
side_effects:
  - One SHOW REPLICA STATUS, or SHOW SLAVE STATUS on servers without it.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Each statement exists only on some servers, so only a syntax error moves on to
      # the other one. Any other failure, such as a missing privilege, is the answer:
      # falling back would replace it with a syntax error on servers that removed the
      # old statement. -E, not \G: the MySQL 9 client refuses local commands in batch
      # mode.
      - |
        err=$(mktemp) || exit 1
        trap 'rm -f "$err"' EXIT
        trap 'exit 143' INT TERM
        run() { mysql -E -e "SET SESSION lock_wait_timeout=5 /*!50708 , max_execution_time=13000 */ /*M!100108 , max_statement_time=13 */; $1" 2>"$err"; }
        status=0
        out=$(run 'SHOW REPLICA STATUS') || status=$?
        if [ "$status" -ne 0 ] && grep -q 'ERROR 1064' "$err"; then
          status=0
          out=$(run 'SHOW SLAVE STATUS') || status=$?
        fi
        cat "$err" >&2
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        if [ -z "$out" ]; then echo 'not a replica'; else printf '%s\n' "$out"; fi
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Replica state
    args: {}
