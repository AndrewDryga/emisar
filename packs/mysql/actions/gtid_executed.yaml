schema_version: 1
id: mysql.gtid_executed
title: GTID executed set
kind: exec
risk: low
description: '`SELECT @@GLOBAL.gtid_executed` — every GTID this server has applied. Use to compare primary vs replica progress.'
side_effects:
  - One SELECT.
  - Read-only.
args: []
execution:
  command:
    binary: mysql
    argv:
      - "-NBe"
      - "SET SESSION lock_wait_timeout=5 /*!50708 , max_execution_time=8000 */ /*M!100108 , max_statement_time=8 */; SELECT @@GLOBAL.gtid_executed"
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: GTID set
    args: {}
