schema_version: 1
id: mysql.processlist
title: SHOW FULL PROCESSLIST
kind: exec
risk: medium
description: List every active connection with its current command, state, and full query. The first stop for "what is the DB doing?" Rated medium because the output carries live query text, which can include literal request values no redaction list can enumerate.
side_effects:
  - One SHOW PROCESSLIST.
  - Read-only.
args: []
execution:
  command:
    binary: mysql
    argv:
      - "-e"
      - "SET SESSION lock_wait_timeout=5 /*!50708 , max_execution_time=13000 */ /*M!100108 , max_statement_time=13 */; SHOW FULL PROCESSLIST"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Active connections
    args: {}
