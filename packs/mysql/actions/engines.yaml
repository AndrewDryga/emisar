schema_version: 1
id: mysql.engines
title: SHOW ENGINES
kind: exec
risk: low
description: List available storage engines and which is default. Read-only.
side_effects:
  - One SHOW ENGINES.
  - Read-only.
args: []
execution:
  command:
    binary: mysql
    argv: ["-e", "SET SESSION lock_wait_timeout=5 /*!50708 , max_execution_time=8000 */ /*M!100108 , max_statement_time=8 */; SHOW ENGINES"]
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Engines
    args: {}
