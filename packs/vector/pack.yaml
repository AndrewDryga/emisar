schema_version: 1

id: vector
name: Vector observability pipeline
version: 0.1.16
retired_below: 0.1.3
description: >
  Read-only ops for a Vector (vector.dev) pipeline running on the runner
  host: version + compiled-component inventory, offline config validation,
  the configured topology as Graphviz DOT, a bounded live event tap, plus
  health and per-component counters. CLI subcommands use the local binary;
  health reads the API at 127.0.0.1:8686, and counters read the Prometheus
  exporter at 127.0.0.1:9598/metrics.
vendor: emisar
homepage: https://emisar.dev/packs/vector

requires:
  os:
    - linux
  binaries:
    - vector
    - curl

# `emisar pack suggest` detection: the Vector process + its default API port.
detect:
  processes:
    - vector
  ports:
    - 8686

setup:
  summary: >
    Inspect the Vector instance on this host using its CLI, health API,
    and Prometheus exporter. Configure the exporter separately from the API;
    neither read starts or reconfigures Vector.
  env:
    - name: VECTOR_API
      default: "http://127.0.0.1:8686"
      description: >
        Vector health API base URL; requires api.enabled=true in the
        Vector config.
    - name: VECTOR_METRICS_URL
      default: "http://127.0.0.1:9598/metrics"
      description: >
        Complete URL of this instance's Prometheus exporter. Connect an
        internal_metrics source with the default vector namespace to the sink.
  notes:
    - "Allowlist `VECTOR_API` and `VECTOR_METRICS_URL` in the runner's `execution.inherit_env` when overriding their defaults. Otherwise each read uses its loopback default."
    - "Enable the health API with `api.enabled: true` and `api.address: 127.0.0.1:8686`. The live tap also needs the API; version, list, validate, and graph use the local binary."
    - "For counters, add `sources.emisar_internal.type: internal_metrics` and `sources.emisar_internal.namespace: vector`; add `sinks.emisar_metrics.type: prometheus_exporter`, `sinks.emisar_metrics.inputs: [emisar_internal]`, and `sinks.emisar_metrics.address: 127.0.0.1:9598`. The exporter serves `/metrics` without needing `api.enabled`. Bind it explicitly to loopback: the sink's vendor default is 0.0.0.0:9598."
    - "Keep unauthenticated API/exporter endpoints private. `vector.component_metrics` supports the Vector 0.55+ exporter, requires curl 8.4+, and fails when no valid per-component counters arrive; it does not call the removed GraphQL endpoint."
    - "Every action is read-only — none start, stop, reload, or reconfigure Vector. `tap` adds slight overhead on the running instance while sampling, then auto-exits."
  host_access:
    - actions:
        - vector.validate
        - vector.graph
      requirement: Read Vector's protected configuration even when deployment replaces restrictive files.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-vector-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
            - "sudo test -r /etc/vector/vector.yaml"
          impact: >
            Every Emisar action on this runner executes as root and can read every Vector config,
            including sink credentials embedded directly in those files.
  verify: vector.health

actions:
  - actions/health.yaml
  - actions/version.yaml
  - actions/list.yaml
  - actions/validate.yaml
  - actions/graph.yaml
  - actions/tap.yaml
  - actions/component_metrics.yaml
