schema_version: 1
id: vector.component_metrics
title: Show per-component counters
kind: script
risk: low
description: >
  Show per-component counters from this Vector instance's Prometheus exporter:
  received and sent events and bytes, errors, and discarded events where
  present. Retains component id, kind, and type; sums other label dimensions
  and omits timestamps. Requires an internal_metrics source with the default
  vector namespace connected to a prometheus_exporter sink, and curl 8.4+.
  Reads VECTOR_METRICS_URL (default http://127.0.0.1:9598/metrics), independently
  of api.enabled. Returns sorted Prometheus text, bounded to 1 MiB, with
  floating-point totals. Empty, malformed, duplicate, nonfinite, or oversized
  counter data fails; a valid zero is retained.
side_effects:
  - One read-only HTTP GET to the configured Prometheus exporter.
  - Read-only.
search_terms:
  - backpressure
args: []
execution:
  script:
    path: scripts/component_metrics.sh
    interpreter: /bin/sh
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Per-component event and byte counters
    args: {}
