schema_version: 1
id: vector.version
title: vector --version
kind: exec
risk: low
description: >
  Show the Vector binary version and build metadata. Uses the local binary;
  needs neither the health API nor the Prometheus exporter.
side_effects: ["Reads the local Vector binary version.", "Read-only."]
args: []
execution:
  command: {binary: vector, argv: ["--version"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Show version and build metadata
    args: {}
