services:
- betterstack-api
versions:
- version: 3.14.7-alpine3.24
  digest: '@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01'
  default: true
secret_env:
- BETTERSTACK_API_TOKEN
- UNRELATED_CREDENTIAL
inherit_env:
- BETTERSTACK_API_TOKEN
- CURL_CA_BUNDLE
- UNRELATED_CREDENTIAL
env:
  BETTERSTACK_API_TOKEN: packtest-canary-betterstack-access-e391
  CURL_CA_BUNDLE: /packs/betterstack/test/fixtures/server.crt
  UNRELATED_CREDENTIAL: packtest-canary-betterstack-unrelated-97e2
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: &id001
    - packtest-canary-betterstack-access-e391
    - packtest-canary-betterstack-hidden-content-7ba2
    - packtest-canary-betterstack-error-8ac4
    - packtest-canary-betterstack-invalid-9b51
    - packtest-canary-betterstack-unrelated-97e2
    stderr_not_contains: *id001
cases:
- name: betterstack.monitors_list
  action: betterstack.monitors_list
  expect:
    json:
      /items/0/id: '101'
      /items/0/monitor_type: status
      /next_page: 2
- name: betterstack.heartbeats_list
  action: betterstack.heartbeats_list
  expect:
    json:
      /items/0/id: '201'
- name: betterstack.incidents_list
  action: betterstack.incidents_list
  expect:
    json:
      /items/0/id: '301'
      /items/0/monitor_id: '101'
- name: betterstack.status_pages_list
  action: betterstack.status_pages_list
  expect:
    json:
      /items/0/id: '401'
      /items/0/access_protected: true
- name: betterstack.monitor_details
  action: betterstack.monitor_details
  args:
    monitor_id: '101'
  expect:
    json:
      /id: '101'
      /check_frequency: 60
      /request_timeout: 15
- name: betterstack.heartbeat_details
  action: betterstack.heartbeat_details
  args:
    heartbeat_id: '201'
  expect:
    json:
      /id: '201'
      /period: 10800
      /grace: 300
- name: betterstack.incident_details
  action: betterstack.incident_details
  args:
    incident_id: '301'
  expect:
    json:
      /id: '301'
      /state: Started
      /resolved_at: null
- name: betterstack.status_page_details
  action: betterstack.status_page_details
  args:
    status_page_id: '401'
  expect:
    json:
      /id: '401'
      /aggregate_state: operational
      /published: true
- name: betterstack.monitor_availability
  action: betterstack.monitor_availability
  args:
    monitor_id: '101'
    from_date: '2026-11-01'
    to_date: '2026-11-07'
  expect:
    json:
      /availability: 99.98
      /number_of_incidents: 3
- name: betterstack.monitor_response_times
  action: betterstack.monitor_response_times
  args:
    monitor_id: '101'
  expect:
    json:
      /window_hours: 24
      /regions/0/sample_count: 3
      /regions/0/minimum_seconds: 0.1
      /regions/0/mean_seconds: 0.2
      /regions/0/maximum_seconds: 0.3
      /regions/0/latest_seconds: 0.3
      /regions/0/latest_at: '2026-11-07T12:34:53.123Z'
- name: betterstack.monitor_create
  action: betterstack.monitor_create
  args:
    url: https://example.com/health
    http_method: HEAD
    team_name: Team "quoted" \ literal
  expect:
    json:
      /id: '102'
      /http_method: head
      /verify_ssl: true
  probes:
  - name: Independent request and state postcondition
    argv:
    - python3
    - -I
    - /packs/betterstack/test/fixture.py
    - probe
    - monitor_create
    expect:
      json:
        /postcondition: true
- name: betterstack.monitor_update
  action: betterstack.monitor_update
  args:
    monitor_id: '101'
    check_frequency: 120
    request_timeout: 30
    confirmation_period: 180
    recovery_period: 300
  expect:
