schema_version: 1
id: betterstack.monitor_create
title: Create an HTTP status monitor
kind: script
risk: high
description: Create a new HTTP status monitor for a public credential-free URL, using GET or HEAD and
  verified SSL. Reject URL credentials, query strings, fragments and nonpublic IP literals. DNS names
  are syntax-validated without resolving them locally. Provider defaults determine notification routing,
  so creation may generate alerts. No custom headers, authentication, body or scripts are sent. Runtime
  changes must be reconciled with Terraform when it owns this resource.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: url
  type: string
  required: true
  description: Public HTTP(S) URL without userinfo, query or fragment.
  validation:
    pattern: ^https?://[^[:space:]]+$
    max_length: 2048
- name: http_method
  type: string
  required: false
  description: Fixed safe HTTP check method.
  validation:
    enum:
    - GET
    - HEAD
    max_length: 4
  default: GET
- name: check_frequency
  type: integer
  required: false
  description: Seconds; timeout may not exceed the check frequency.
  validation:
    min: 0
    max: 1800
    enum:
    - 30
    - 45
    - 60
    - 120
    - 180
    - 300
    - 600
    - 900
    - 1800
  default: 60
- name: request_timeout
  type: integer
  required: false
  description: Seconds; timeout may not exceed the check frequency.
  validation:
    min: 0
    max: 180
    enum:
    - 2
    - 3
    - 5
    - 10
    - 15
    - 30
    - 45
    - 60
    - 90
    - 120
    - 180
  default: 15
- name: confirmation_period
  type: integer
  required: false
  description: Seconds; timeout may not exceed the check frequency.
  validation:
    min: 0
    max: 86400
  default: 120
- name: recovery_period
  type: integer
  required: false
  description: Seconds; timeout may not exceed the check frequency.
  validation:
    min: 0
    max: 7200
    enum:
    - 0
    - 60
    - 180
    - 300
    - 900
    - 1800
    - 3600
    - 7200
  default: 180
- name: team_name
  type: string
  required: false
  description: Optional owner team name; required by Better Stack when using a global API credential.
  validation:
    max_length: 128
  default: ''
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - monitor_create
  - '{{ args.url }}'
  - '{{ args.http_method }}'
  - '{{ args.check_frequency }}'
  - '{{ args.request_timeout }}'
  - '{{ args.confirmation_period }}'
  - '{{ args.recovery_period }}'
  - '{{ args.team_name }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - monitor_type
    - state
    - paused
    - verify_ssl
    - call
    - sms
    - email
    - push
    - critical_alert
    - check_frequency
    - effective_check_frequency
    - request_timeout
    - confirmation_period
    - recovery_period
    - http_method
    - regions
    - last_checked_at
    - paused_at
    - created_at
    - updated_at
    properties:
      id:
        type: string
        maxLength: 20
      monitor_type:
        type: string
        maxLength: 24
        enum:
        - status
        - expected_status_code
        - keyword
        - keyword_absence
        - ping
        - tcp
        - udp
        - smtp
        - pop
        - imap
        - dns
        - playwright
      state:
        type:
        - string
        - 'null'
        maxLength: 16
        enum:
        - up
        - down
        - validating
        - paused
        - pending
        - maintenance
        - null
      paused:
        type:
        - boolean
        - 'null'
      verify_ssl:
        type:
        - boolean
        - 'null'
      call:
        type:
        - boolean
        - 'null'
      sms:
        type:
        - boolean
        - 'null'
      email:
        type:
        - boolean
        - 'null'
      push:
        type:
        - boolean
        - 'null'
      critical_alert:
        type:
        - boolean
        - 'null'
      check_frequency:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      effective_check_frequency:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      request_timeout:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      confirmation_period:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      recovery_period:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      http_method:
        type:
        - string
        - 'null'
        maxLength: 8
        enum:
        - get
        - head
        - post
        - put
        - patch
        - options
        - null
      regions:
        type: array
        maxItems: 4
        items:
          type: string
          maxLength: 2
          enum:
          - us
          - eu
          - as
          - au
      last_checked_at:
        type:
        - string
        - 'null'
        maxLength: 40
      paused_at:
        type:
        - string
        - 'null'
        maxLength: 40
      created_at:
        type:
        - string
        - 'null'
        maxLength: 40
      updated_at:
        type:
        - string
        - 'null'
        maxLength: 40
examples:
- title: Create an HTTP status monitor
  args:
    url: https://example.com/health
    http_method: HEAD
