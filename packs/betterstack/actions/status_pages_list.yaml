schema_version: 1
id: betterstack.status_pages_list
title: List Better Stack status pages
kind: script
risk: low
description: List one bounded page of selected status page IDs, state and typed operational settings.
  Omit names, URLs, hidden credentials, arbitrary content and raw provider errors. Continue with next_page
  and unchanged selectors; unsupported pagination fails explicitly.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: page
  type: integer
  required: false
  description: Page number; the 100000 ceiling bounds one continuation selector.
  validation:
    min: 1
    max: 100000
  default: 1
- name: per_page
  type: integer
  required: false
  description: Rows per request; six keeps the full selected page within the 8 KiB result budget.
  validation:
    min: 1
    max: 6
  default: 6
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - status_pages_list
  - '{{ args.page }}'
  - '{{ args.per_page }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - items
    - returned_count
    - more_available
    - next_page
    properties:
      items:
        type: array
        maxItems: 6
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - aggregate_state
          - published
          - access_protected
          - require_sso
          - hide_from_search_engines
          - created_at
          - updated_at
          properties:
            id:
              type: string
              maxLength: 20
            aggregate_state:
              type: string
              maxLength: 16
              enum:
              - operational
              - degraded
              - downtime
              - maintenance
            published:
              type:
              - boolean
              - 'null'
            access_protected:
              type:
              - boolean
              - 'null'
            require_sso:
              type:
              - boolean
              - 'null'
            hide_from_search_engines:
              type:
              - boolean
              - 'null'
            created_at:
              type:
              - string
              - 'null'
              maxLength: 40
            updated_at:
              type:
              - string
              - 'null'
              maxLength: 40
      returned_count:
        type: integer
        minimum: 0
        maximum: 6
      more_available:
        type: boolean
      next_page:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100000
examples:
- title: List Better Stack status pages
  args: {}
