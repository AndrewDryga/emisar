schema_version: 1
id: betterstack.heartbeat_details
title: Show a Better Stack heartbeat
kind: script
risk: low
description: Show one heartbeat using a closed projection of exact IDs, state, timestamps and typed operational
  settings. URLs, names, private authentication, request content, incident causes and page HTML are excluded.
  Missing optional values remain null; malformed present values fail.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: heartbeat_id
  type: string
  required: true
  description: Exact positive decimal resource ID; returned identifiers are preserved without clipping.
  validation:
    pattern: ^[1-9][0-9]{0,19}$
    max_length: 20
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - heartbeat_details
  - '{{ args.heartbeat_id }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - state
    - paused
    - call
    - sms
    - email
    - push
    - critical_alert
    - period
    - grace
    - paused_at
    - created_at
    - updated_at
    properties:
      id:
        type: string
        maxLength: 20
      state:
        type:
        - string
        - 'null'
        maxLength: 16
        enum:
        - up
        - down
        - validating
        - paused
        - pending
        - maintenance
        - null
      paused:
        type:
        - boolean
        - 'null'
      call:
        type:
        - boolean
        - 'null'
      sms:
        type:
        - boolean
        - 'null'
      email:
        type:
        - boolean
        - 'null'
      push:
        type:
        - boolean
        - 'null'
      critical_alert:
        type:
        - boolean
        - 'null'
      period:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      grace:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      paused_at:
        type:
        - string
        - 'null'
        maxLength: 40
      created_at:
        type:
        - string
        - 'null'
        maxLength: 40
      updated_at:
        type:
        - string
        - 'null'
        maxLength: 40
examples:
- title: Show a Better Stack heartbeat
  args:
    heartbeat_id: '201'
