schema_version: 1
id: betterstack.status_page_details
title: Show a Better Stack status page
kind: script
risk: low
description: Show one status page using a closed projection of exact IDs, state, timestamps and typed
  operational settings. URLs, names, private authentication, request content, incident causes and page
  HTML are excluded. Missing optional values remain null; malformed present values fail.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: status_page_id
  type: string
  required: true
  description: Exact positive decimal resource ID; returned identifiers are preserved without clipping.
  validation:
    pattern: ^[1-9][0-9]{0,19}$
    max_length: 20
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - status_page_details
  - '{{ args.status_page_id }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - aggregate_state
    - published
    - access_protected
    - require_sso
    - hide_from_search_engines
    - created_at
    - updated_at
    properties:
      id:
        type: string
        maxLength: 20
      aggregate_state:
        type: string
        maxLength: 16
        enum:
        - operational
        - degraded
        - downtime
        - maintenance
      published:
        type:
        - boolean
        - 'null'
      access_protected:
        type:
        - boolean
        - 'null'
      require_sso:
        type:
        - boolean
        - 'null'
      hide_from_search_engines:
        type:
        - boolean
        - 'null'
      created_at:
        type:
        - string
        - 'null'
        maxLength: 40
      updated_at:
        type:
        - string
        - 'null'
        maxLength: 40
examples:
- title: Show a Better Stack status page
  args:
    status_page_id: '401'
