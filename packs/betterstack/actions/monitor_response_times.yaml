schema_version: 1
id: betterstack.monitor_response_times
title: Summarize monitor response times
kind: script
risk: low
description: Show counts, minimum, mean, maximum and latest response time in seconds for the provider
  last-24-hour window, grouped by at most four fixed regions. Raw samples and request content are excluded.
  Empty region samples produce null metrics; missing or invalid samples fail. A response over 4 MiB fails
  explicitly rather than silently dropping data.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: monitor_id
  type: string
  required: true
  description: Exact positive decimal resource ID; returned identifiers are preserved without clipping.
  validation:
    pattern: ^[1-9][0-9]{0,19}$
    max_length: 20
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - monitor_response_times
  - '{{ args.monitor_id }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - window_hours
    - regions
    properties:
      id:
        type: string
        maxLength: 20
      window_hours:
        const: 24
      regions:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required:
          - region
          - sample_count
          - minimum_seconds
          - mean_seconds
          - maximum_seconds
          - latest_seconds
          - latest_at
          properties:
            region:
              type: string
              maxLength: 2
              enum:
              - us
              - eu
              - as
              - au
            sample_count:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            minimum_seconds:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 9007199254740991
            mean_seconds:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 9007199254740991
            maximum_seconds:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 9007199254740991
            latest_seconds:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 9007199254740991
            latest_at:
              type:
              - string
              - 'null'
              maxLength: 40
examples:
- title: Summarize monitor response times
  args:
    monitor_id: '101'
