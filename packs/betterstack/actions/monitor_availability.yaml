schema_version: 1
id: betterstack.monitor_availability
title: Show monitor availability
kind: script
risk: low
description: Show finite availability percentage and downtime/incident aggregates for an explicit window
  of at most 31 inclusive calendar days. Missing metrics fail instead of becoming zero. This is a client
  work budget, not a provider retention limit.
side_effects:
- One authenticated Better Stack HTTPS request; monitor timing updates perform a prior read. No automatic
  retries or paging.
args:
- name: monitor_id
  type: string
  required: true
  description: Exact positive decimal resource ID; returned identifiers are preserved without clipping.
  validation:
    pattern: ^[1-9][0-9]{0,19}$
    max_length: 20
- name: from_date
  type: string
  required: true
  description: Calendar date in YYYY-MM-DD format.
  validation:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    max_length: 10
- name: to_date
  type: string
  required: true
  description: Calendar date in YYYY-MM-DD format.
  validation:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    max_length: 10
execution:
  script:
    path: scripts/betterstack.sh
    interpreter: /bin/bash
  argv:
  - monitor_availability
  - '{{ args.monitor_id }}'
  - '{{ args.from_date }}'
  - '{{ args.to_date }}'
  timeout: 40s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - from
    - to
    - availability
    - total_downtime
    - number_of_incidents
    - longest_incident
    - average_incident
    properties:
      id:
        type: string
        maxLength: 20
      from:
        type: string
        maxLength: 10
      to:
        type: string
        maxLength: 10
      availability:
        type: number
        minimum: 0
        maximum: 100
      total_downtime:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      number_of_incidents:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      longest_incident:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      average_incident:
        type: integer
        minimum: 0
        maximum: 9007199254740991
examples:
- title: Show monitor availability
  args:
    monitor_id: '101'
    from_date: '2026-11-01'
    to_date: '2026-11-07'
