schema_version: 1
id: bunny.remove_hostname
title: Remove Pull Zone hostname
kind: script
risk: high
description: Remove a custom hostname from a Pull Zone; requests to that hostname stop being served by the zone immediately.
side_effects:
  - Detaches the custom hostname from the Pull Zone.
  - Interrupts CDN delivery through that hostname.
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: hostname
    type: string
    required: true
    description: DNS hostname to detach.
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$"
      max_length: 253
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [remove-hostname, "{{ args.pull_zone_id }}", "{{ args.hostname }}"]
  timeout: 60s
output: {parser: json, parser_required: true, max_stdout_bytes: 1048576, max_stderr_bytes: 8192}
examples:
  - title: Detach a hostname
    args: {pull_zone_id: 123456, hostname: old-cdn.example.com}
