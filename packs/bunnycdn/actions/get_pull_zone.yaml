schema_version: 1
id: bunny.get_pull_zone
title: Get Pull Zone
kind: script
risk: low
description: Show one Pull Zone's configuration and current monthly usage without credential or certificate fields.
side_effects: [One read-only Core API request.]
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [get-pull-zone, "{{ args.pull_zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Inspect a Pull Zone
    args: {pull_zone_id: 123456}
