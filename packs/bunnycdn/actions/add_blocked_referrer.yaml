schema_version: 1
id: bunny.add_blocked_referrer
title: Add blocked referrer
kind: script
risk: high
description: Block one referrer hostname on a Pull Zone; matching embedded requests begin failing immediately.
side_effects: [Changes hotlink-access policy and denies matching traffic.]
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: hostname
    type: string
    required: true
    description: Referrer hostname or wildcard pattern to block.
    validation:
      pattern: "^[A-Za-z0-9*][A-Za-z0-9.*-]{0,252}$"
      max_length: 253
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [add-blocked-referrer, "{{ args.pull_zone_id }}", "{{ args.hostname }}"]
  timeout: 60s
output: {parser: json, parser_required: true, max_stdout_bytes: 1048576, max_stderr_bytes: 8192}
examples:
  - title: Block one site
    args: {pull_zone_id: 123456, hostname: scraper.example}
