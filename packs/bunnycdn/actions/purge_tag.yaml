schema_version: 1
id: bunny.purge_tag
title: Purge cache tag
kind: script
risk: high
description: Purge every cached object carrying one tag in a Pull Zone; all matched objects become misses and can create a concentrated origin-load spike.
side_effects:
  - Removes every cached object carrying the tag in this Pull Zone.
  - Causes subsequent requests for matched objects to reach the origin.
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: cache_tag
    type: string
    required: true
    description: Exact Bunny cache tag to purge.
    validation:
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
      max_length: 128
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [purge-tag, "{{ args.pull_zone_id }}", "{{ args.cache_tag }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Purge one release tag
    args: {pull_zone_id: 123456, cache_tag: release-2026-07-31}
