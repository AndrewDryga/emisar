schema_version: 1
id: bunny.list_pull_zones
title: List Pull Zones
kind: script
risk: low
description: List one bounded page of Pull Zones accessible to the account API key.
side_effects: [One read-only Core API request.]
args:
  - name: search
    type: string
    required: false
    default: ""
    description: Optional name search.
    validation:
      pattern: "^[ -~]*$"
      max_length: 128
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number.
    validation: {min: 1, max: 2147483647}
  - name: per_page
    type: integer
    required: false
    default: 100
    description: Pull Zones returned in this page.
    validation: {min: 5, max: 1000}
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [list-pull-zones, "{{ args.search }}", "{{ args.page }}", "{{ args.per_page }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: First page
    args: {}
