schema_version: 1
id: bunny.add_hostname
title: Add Pull Zone hostname
kind: script
risk: high
description: Add a custom hostname to a Pull Zone; traffic for a correctly pointed DNS name can begin reaching this zone before TLS is forced.
side_effects:
  - Attaches a custom hostname to the Pull Zone.
  - Can begin serving traffic after DNS points at Bunny.
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: hostname
    type: string
    required: true
    description: DNS hostname to attach.
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$"
      max_length: 253
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [add-hostname, "{{ args.pull_zone_id }}", "{{ args.hostname }}"]
  timeout: 60s
output: {parser: json, parser_required: true, max_stdout_bytes: 1048576, max_stderr_bytes: 8192}
examples:
  - title: Attach a hostname
    args: {pull_zone_id: 123456, hostname: cdn.example.com}
