schema_version: 1
id: bunny.origin_errors
title: Get origin error logs
kind: script
risk: medium
description: >
  Get one day's failed-origin records for a Pull Zone. The result can contain
  origin request paths and failure detail, so policy should limit who may
  retrieve it; query strings and arbitrary embedded log fields are removed.
side_effects:
  - One read-only Origin Errors API request.
  - Returns origin failure detail into the governed run result and audit trail.
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: date
    type: string
    required: true
    description: UTC date in MM-DD-YYYY format.
    validation:
      pattern: "^[0-9]{2}-[0-9]{2}-20[0-9]{2}$"
      max_length: 10
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [origin-errors, "{{ args.pull_zone_id }}", "{{ args.date }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Origin failures for one UTC day
    args: {pull_zone_id: 123456, date: 07-31-2026}
