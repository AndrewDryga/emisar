schema_version: 1
id: bunny.set_cache_ttl
title: Change Pull Zone cache TTLs
kind: script
risk: high
description: Change edge or browser cache TTL overrides; shorter values increase origin traffic while longer values can keep stale content in circulation.
side_effects:
  - Changes caching for subsequent responses on the Pull Zone.
  - Does not purge objects already stored at the edge or in browsers.
args:
  - name: pull_zone_id
    type: integer
    required: true
    description: Pull Zone ID.
    validation: {min: 1, max: 9007199254740991}
  - name: edge_seconds
    type: string
    required: false
    default: unchanged
    description: Edge cache override in seconds, or unchanged.
    validation:
      pattern: "^(unchanged|[0-9]{1,9})$"
      max_length: 9
  - name: browser_seconds
    type: string
    required: false
    default: unchanged
    description: Browser cache override in seconds, or unchanged.
    validation:
      pattern: "^(unchanged|[0-9]{1,9})$"
      max_length: 9
execution:
  script: {path: scripts/bunny_api.sh, interpreter: /bin/bash}
  argv: [set-cache-ttl, "{{ args.pull_zone_id }}", "{{ args.edge_seconds }}", "{{ args.browser_seconds }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Cache at edge for one day and in browsers for one hour
    args: {pull_zone_id: 123456, edge_seconds: "86400", browser_seconds: "3600"}
