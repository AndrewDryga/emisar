schema_version: 1

id: bind
name: BIND DNS server
version: 0.1.16
# Unchanged: rndc_stats moving low -> medium corrects the tier for a file
# rewrite, but the shipped default auto-runs both, so no approval was skipped
# and no earlier version is unsafe to keep running.
retired_below: 0.1.7
description: >
  Authoritative/recursive BIND ops: rndc status + stats, zone validation,
  cache inspection, local resolution probes, plus narrow operator actions
  (rndc reload, zone freeze/thaw). Requires rndc key on the runner host.
vendor: emisar
homepage: https://emisar.dev/packs/bind

requires:
  os:
    - linux
  binaries:
    - rndc

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - named

setup:
  summary: >
    Operates on the local named instance on the runner host — no
    credentials needed. rndc controls named via its key file; dig queries
    127.0.0.1.
  notes:
    - "zone_dump (AXFR) requires named's allow-transfer to include 127.0.0.1."
  host_access:
    - actions:
        - bind.rndc_status
        - bind.rndc_stats
        - bind.named_checkconf
        - bind.named_checkzone
        - bind.rndc_reload
        - bind.rndc_freeze
        - bind.rndc_thaw
        - bind.rndc_flush
      requirement: Read BIND's protected configuration and RNDC key and control the local named process.
      recipes:
        - name: Add the default Emisar service user to bind on Debian or Ubuntu
          commands:
            - "sudo usermod -aG bind emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx bind"
            - "sudo -u emisar rndc status >/dev/null"
            - "sudo -u emisar named-checkconf"
          impact: >
            Every process running as emisar can read files exposed to the bind group and use
            the RNDC key to mutate named beyond the actions exposed by this pack.
        - name: Add the default Emisar service user to named on RHEL-family hosts
          commands:
            - "sudo usermod -aG named emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx named"
            - "sudo -u emisar rndc status >/dev/null"
            - "sudo -u emisar named-checkconf"
          impact: >
            Every process running as emisar can read files exposed to the named group and use
            the RNDC key to mutate named beyond the actions exposed by this pack.
  verify: bind.rndc_status

actions:
  - actions/rndc_status.yaml
  - actions/rndc_stats.yaml
  - actions/named_checkconf.yaml
  - actions/named_checkzone.yaml
  - actions/zone_dump.yaml
  - actions/query_local.yaml
  - actions/zone_serial.yaml
  - actions/rndc_reload.yaml
  - actions/rndc_freeze.yaml
  - actions/rndc_thaw.yaml
  - actions/rndc_flush.yaml
