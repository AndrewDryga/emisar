options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    allow-transfer { 127.0.0.1; };
    recursion no;
    statistics-file "/var/cache/bind/named.stats";
};

include "/etc/bind/rndc.key";

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys { "rndc-key"; };
};

zone "example.test" IN {
    type master;
    file "/etc/bind/example.test.zone";
};
