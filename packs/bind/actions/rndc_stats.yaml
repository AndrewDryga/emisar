schema_version: 1
id: bind.rndc_stats
title: rndc stats + read dump
kind: exec
risk: medium
description: Force a stats dump and read it. Includes query counts, cache stats, NSID.
side_effects: ["Writes /var/named/data/named_stats.txt.", "Rewrites BIND's own stats file; no service impact."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Fail when the dump did not happen. BIND APPENDS to its stats file, so a
      # failed rndc (missing key, named down, no control channel) would leave the
      # previous dump to be read back as if it were fresh.
      - "rndc stats || { echo 'rndc stats failed; not reading the previous dump' >&2; exit 1; }; sleep 1; cat /var/named/data/named_stats.txt 2>/dev/null || cat /var/cache/bind/named.stats"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Stats
    args: {}
