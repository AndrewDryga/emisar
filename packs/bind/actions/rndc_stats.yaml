schema_version: 1
id: bind.rndc_stats
title: rndc stats + read dump
kind: exec
risk: medium
description: Force a stats dump and read back that newest dump. Includes query counts, cache stats, NSID.
side_effects: ["Writes /var/named/data/named_stats.txt.", "Appends a dump to BIND's own stats file; no service impact."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Fail when the dump did not happen. BIND APPENDS to its stats file, so a
      # failed rndc (missing key, named down, no control channel) would leave the
      # previous dump to be read back as if it were fresh. For the same reason
      # only the last dump is printed: the runner keeps the head of stdout, so
      # older dumps would otherwise push the fresh one past the output cap.
      - "rndc stats || { echo 'rndc stats failed; not reading the previous dump' >&2; exit 1; }; sleep 1; f=/var/named/data/named_stats.txt; [ -r \"$f\" ] || f=/var/cache/bind/named.stats; awk 'index($0, \"+++ Statistics Dump +++\") == 1 { n = 0 } { line[++n] = $0 } END { for (i = 1; i <= n; i++) print line[i] }' \"$f\""
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Stats
    args: {}
