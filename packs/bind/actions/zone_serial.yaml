schema_version: 1
id: bind.zone_serial
title: SOA serial of <zone>
kind: exec
risk: low
description: Show SOA serial from localhost — use to confirm a zone reloaded.
side_effects: ["One DNS query.", "Read-only."]
args:
  - name: zone
    type: string
    required: true
    description: Zone name.
    validation:
      pattern: "^[a-zA-Z0-9.][a-zA-Z0-9.\\-]{0,252}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # dig exits 0 on an answer with no SOA (an unknown, refused, or failed
      # zone), so the serial itself is checked before it is reported.
      - "soa=$(dig @127.0.0.1 \"$1\" SOA +short) || exit 1; serial=$(printf '%s\\n' \"$soa\" | awk 'NR==1 {print $3}'); case $serial in ''|*[!0-9]*) echo \"no SOA serial for $1 from 127.0.0.1\" >&2; exit 1 ;; esac; printf '%s\\n' \"$serial\""
      - "emisar"
      - "{{ args.zone }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 1024
  max_stderr_bytes: 8192
examples:
  - title: Serial
    args:
      zone: "example.com"
