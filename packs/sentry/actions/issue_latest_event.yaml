schema_version: 1
id: sentry.issue_latest_event
title: Show latest issue event
kind: script
risk: medium
description: >
  Show an issue's latest event with its message, log entry, contexts, tags,
  breadcrumbs, request metadata, and all frames from exception, standalone,
  and thread stack traces. The JSON run output contains sensitive application
  data and is limited to 1 MiB. Request bodies, headers, cookies, and frame
  locals are excluded. Use sentry.list_organizations and sentry.list_issues
  to find the organization slug and issue ID.
side_effects: [One read-only API request.]
args:
  - name: organization
    type: string
    required: true
    description: Organization slug from sentry.list_organizations.
    validation:
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
      max_length: 64
  - name: issue_id
    type: string
    required: true
    description: Numeric issue ID from sentry.list_issues.
    validation:
      pattern: "^[0-9]{1,20}$"
execution:
  script: {path: scripts/sentry_api.sh, interpreter: /bin/bash}
  argv: [issue-latest-event, "{{ args.organization }}", "{{ args.issue_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Latest stacktrace
    args: {organization: acme, issue_id: "1234567890"}
