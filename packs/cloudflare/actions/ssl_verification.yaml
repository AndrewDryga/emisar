schema_version: 1
id: cf.ssl_verification
title: Show SSL verification status
kind: script
risk: low
description: Show edge certificate verification status for a zone's hostnames — what a browser will be served and whether validation is stuck.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [ssl-verification, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Verification status
    args: {zone_id: "abc123def456abc123def456abc123de"}
