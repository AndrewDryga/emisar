schema_version: 1
id: cf.list_load_balancers
title: List load balancers
kind: script
risk: low
description: List a zone's load balancers with their pool assignments, steering policy, and proxy status.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-load-balancers, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Load balancers
    args: {zone_id: "abc123def456abc123def456abc123de"}
