schema_version: 1
id: cf.purge_url
title: Purge cached URL
kind: script
risk: high
description: Purge one URL from a zone's edge cache; the next request for each purged variant reaches the origin and can increase origin load.
side_effects:
  - Removes cached variants matching the requested URL.
  - Causes subsequent requests to miss until the object is cached again.
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: url
    type: string
    required: true
    sensitive: true
    description: Absolute URL to purge. Query strings are sent to Cloudflare but redacted from the audit trail.
    validation:
      pattern: "^https?://[A-Za-z0-9][A-Za-z0-9.-]{0,252}(:[0-9]{1,5})?/[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*$"
      max_length: 2048
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [purge-url, "{{ args.zone_id }}"]
  env:
    CF_PURGE_URL: "{{ args.url }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Purge one asset
    args: {zone_id: "abc123def456abc123def456abc123de", url: "https://example.com/style.css"}
