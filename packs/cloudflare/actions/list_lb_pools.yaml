schema_version: 1
id: cf.list_lb_pools
title: List load balancer pools
kind: script
risk: low
description: List an account's load balancer origin pools with each pool's origins, weights, enabled state, and health.
side_effects: [One read-only API request.]
args:
  - name: account_id
    type: string
    required: true
    description: Account ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-lb-pools, "{{ args.account_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Pools
    args: {account_id: "9f8e7d6c5b4a39281706f5e4d3c2b1a0"}
