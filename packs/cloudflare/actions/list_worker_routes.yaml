schema_version: 1
id: cf.list_worker_routes
title: List Worker routes
kind: script
risk: low
description: List a zone's Worker routes — which URL patterns run which Worker script.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-worker-routes, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Worker routes
    args: {zone_id: "abc123def456abc123def456abc123de"}
