schema_version: 1
id: cf.list_pages_projects
title: List Pages projects
kind: script
risk: low
description: List one bounded page of an account's Cloudflare Pages projects with domains, production branch, and each project's latest deployment.
side_effects: [One read-only API request.]
args:
  - name: account_id
    type: string
    required: true
    description: Account ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number.
    validation: {min: 1, max: 2147483647}
  - name: per_page
    type: integer
    required: false
    default: 25
    description: Projects returned in this page.
    validation: {min: 5, max: 100}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-pages-projects, "{{ args.account_id }}", "{{ args.page }}", "{{ args.per_page }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 8192
examples:
  - title: Projects
    args: {account_id: "9f8e7d6c5b4a39281706f5e4d3c2b1a0"}
