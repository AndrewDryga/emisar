schema_version: 1
id: cf.firewall_rules
title: List WAF custom rules
kind: script
risk: low
description: >
  List zone WAF custom rules — the entrypoint ruleset for the
  http_request_firewall_custom phase. Replaces the legacy /firewall/rules
  API, which Cloudflare sunset on 2025-06-15.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [firewall-rules, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: WAF custom rules
    args: {zone_id: "abc123def456abc123def456abc123de"}
