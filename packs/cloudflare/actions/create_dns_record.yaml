schema_version: 1
id: cf.create_dns_record
title: Create DNS record
kind: script
risk: high
description: Create one DNS record in a zone; a wrong name or content changes where live traffic and mail resolve as soon as caches expire.
side_effects:
  - Resolvers pick up the new record as it propagates.
  - A proxied record routes its traffic through Cloudflare's edge.
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: record_type
    type: string
    required: true
    description: Record type. SRV, CAA, and other data-object types are not supported by this action.
    validation:
      enum: ["A", "AAAA", "CNAME", "TXT", "MX", "NS", "PTR"]
  - name: name
    type: string
    required: true
    description: Record name as a FQDN (use the zone apex itself for root records). A leading "*." makes it a wildcard.
    validation:
      pattern: "^(\\*\\.)?([A-Za-z0-9_]([A-Za-z0-9_-]{0,62}[A-Za-z0-9_])?\\.)*[A-Za-z0-9_]([A-Za-z0-9_-]{0,62}[A-Za-z0-9_])?$"
      max_length: 255
  - name: content
    type: string
    required: true
    description: Record content — an IP address, target hostname, or text value.
    validation:
      pattern: "^[ -~]+$"
      max_length: 2048
  - name: ttl
    type: integer
    required: false
    default: 1
    description: TTL in seconds; 1 means automatic. Cloudflare rejects values between 2 and 59.
    validation: {min: 1, max: 86400}
  - name: proxied
    type: boolean
    required: false
    default: false
    description: Proxy A/AAAA/CNAME traffic through Cloudflare's edge. Ignored for other types.
  - name: priority
    type: integer
    required: false
    default: 10
    description: MX preference. Ignored for other types.
    validation: {min: 0, max: 65535}
  - name: comment
    type: string
    required: false
    default: ""
    description: Optional record comment.
    validation:
      pattern: "^[ -~]*$"
      max_length: 500
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [create-dns-record, "{{ args.zone_id }}", "{{ args.record_type }}", "{{ args.name }}", "{{ args.content }}", "{{ args.ttl }}", "{{ args.proxied }}", "{{ args.priority }}", "{{ args.comment }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Point a host at an IP
    args: {zone_id: "abc123def456abc123def456abc123de", record_type: A, name: staging.example.com, content: 203.0.113.20, proxied: true}
  - title: Add an SPF record
    args: {zone_id: "abc123def456abc123def456abc123de", record_type: TXT, name: example.com, content: "v=spf1 include:_spf.example.com ~all"}
