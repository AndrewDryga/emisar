schema_version: 1
id: cf.purge_all_cache
title: Purge entire zone cache
kind: script
risk: critical
description: Purge ALL cached content for one zone; every URL misses to the origin at once, and on a busy zone that cold-cache spike can overload the origin.
side_effects:
  - The origin sees a 100% miss rate until the cache re-warms.
  - Rate-limited by Cloudflare to roughly once per minute per zone.
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [purge-all-cache, "{{ args.zone_id }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Full purge
    args: {zone_id: "abc123def456abc123def456abc123de"}
