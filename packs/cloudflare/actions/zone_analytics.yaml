schema_version: 1
id: cf.zone_analytics
title: Show zone HTTP analytics
kind: script
risk: low
description: >
  Show a zone's HTTP traffic for the last N hours via the GraphQL analytics
  API — request, bandwidth, cached, threat, and unique-visitor totals plus
  the hourly series. Replaces the legacy /analytics/dashboard API, which
  Cloudflare sunset.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: hours
    type: integer
    required: false
    default: 24
    description: How many hours back to report, up to a year (8760). The zone's plan sets how far back the hourly dataset reaches (about 30 days on Pro and Business); a range beyond it fails with the API's own error.
    validation: {min: 1, max: 8760}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [zone-analytics, "{{ args.zone_id }}", "{{ args.hours }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Last 24 hours
    args: {zone_id: "abc123def456abc123def456abc123de"}
