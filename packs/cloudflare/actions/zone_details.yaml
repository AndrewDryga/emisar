schema_version: 1
id: cf.zone_details
title: Show zone details
kind: script
risk: low
description: Show one zone's status, plan, nameservers, and activation state.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [zone-details, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Zone details
    args: {zone_id: "abc123def456abc123def456abc123de"}
