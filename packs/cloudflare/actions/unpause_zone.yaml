schema_version: 1
id: cf.unpause_zone
title: Unpause zone
kind: script
risk: medium
description: Resume Cloudflare on a paused zone; proxied traffic returns to the edge and the CDN cache, WAF, and DDoS protection re-engage.
side_effects:
  - Proxied traffic moves back through Cloudflare's edge.
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [set-zone-paused, "{{ args.zone_id }}", "false"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Unpause
    args: {zone_id: "abc123def456abc123def456abc123de"}
