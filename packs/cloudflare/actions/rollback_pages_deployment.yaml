schema_version: 1
id: cf.rollback_pages_deployment
title: Roll back Pages deployment
kind: script
risk: high
description: Roll a Pages project's production traffic back to an earlier deployment; the live site switches to that build's content immediately.
side_effects:
  - Production serves the selected deployment's content within seconds.
  - Rolling back skips whatever the newer deployments shipped, including fixes.
args:
  - name: account_id
    type: string
    required: true
    description: Account ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: project_name
    type: string
    required: true
    description: Pages project name.
    validation:
      pattern: "^[a-z0-9][a-z0-9-]{0,57}$"
      max_length: 58
  - name: deployment_id
    type: string
    required: true
    description: Production deployment to make live again (cf.pages_deployments returns it).
    validation:
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [rollback-pages-deployment, "{{ args.account_id }}", "{{ args.project_name }}", "{{ args.deployment_id }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Back to the last good build
    args: {account_id: "9f8e7d6c5b4a39281706f5e4d3c2b1a0", project_name: marketing-site, deployment_id: "bbbbcccc-dddd-4eee-8fff-000011112222"}
