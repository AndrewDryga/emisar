schema_version: 1
id: cf.dns_analytics_report
title: Show DNS analytics
kind: script
risk: low
description: Show a zone's DNS query analytics for the last N hours — query counts grouped by name, record type, and response code.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: hours
    type: integer
    required: false
    default: 24
    description: How many hours back to report.
    validation: {min: 1, max: 72}
  - name: limit
    type: integer
    required: false
    default: 20
    description: Result rows returned.
    validation: {min: 1, max: 100}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [dns-analytics-report, "{{ args.zone_id }}", "{{ args.hours }}", "{{ args.limit }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Top query names
    args: {zone_id: "abc123def456abc123def456abc123de"}
