schema_version: 1
id: cf.dev_mode_off
title: Disable development mode
kind: script
risk: medium
description: End development mode early; the edge cache resumes serving immediately and origin load drops back to normal.
side_effects:
  - Cache resumes serving from the edge.
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [dev-mode, "{{ args.zone_id }}", "off"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Dev mode off
    args: {zone_id: "abc123def456abc123def456abc123de"}
