schema_version: 1
id: cf.list_ip_access_rules
title: List IP access rules
kind: script
risk: low
description: List one bounded page of a zone's IP access rules — the block, challenge, and allowlist entries for IPs, CIDR ranges, ASNs, and countries.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: mode
    type: string
    required: false
    default: ""
    description: Optional rule mode filter.
    validation:
      enum: ["", "block", "challenge", "js_challenge", "managed_challenge", "whitelist"]
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number.
    validation: {min: 1, max: 2147483647}
  - name: per_page
    type: integer
    required: false
    default: 25
    description: Rules returned in this page.
    validation: {min: 5, max: 100}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-ip-access-rules, "{{ args.zone_id }}", "{{ args.mode }}", "{{ args.page }}", "{{ args.per_page }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: All access rules
    args: {zone_id: "abc123def456abc123def456abc123de"}
  - title: Blocks only
    args: {zone_id: "abc123def456abc123def456abc123de", mode: block}
