schema_version: 1
id: cf.audit_logs
title: List audit logs
kind: script
risk: low
description: List one bounded page of an account's Cloudflare audit log — who changed what through the dashboard and API, and when.
side_effects: [One read-only API request.]
args:
  - name: account_id
    type: string
    required: true
    description: Account ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
  - name: hours
    type: integer
    required: false
    default: 24
    description: How many hours back to read.
    validation: {min: 1, max: 168}
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number.
    validation: {min: 1, max: 2147483647}
  - name: per_page
    type: integer
    required: false
    default: 25
    description: Entries returned in this page.
    validation: {min: 5, max: 100}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [audit-logs, "{{ args.account_id }}", "{{ args.hours }}", "{{ args.page }}", "{{ args.per_page }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Last 24 hours
    args: {account_id: "9f8e7d6c5b4a39281706f5e4d3c2b1a0"}
