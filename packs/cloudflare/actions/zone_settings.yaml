schema_version: 1
id: cf.zone_settings
title: List zone settings
kind: script
risk: low
description: List every zone-level setting — cache level, security level, SSL mode, minimum TLS version, development mode, Always Use HTTPS, and the rest.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [zone-settings, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Settings
    args: {zone_id: "abc123def456abc123def456abc123de"}
