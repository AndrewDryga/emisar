schema_version: 1
id: cf.list_accounts
title: List accounts
kind: script
risk: low
description: List one bounded page of Cloudflare accounts the API token can read — the account IDs the tunnel, load-balancer pool, and audit-log actions need.
side_effects: [One read-only API request.]
args:
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number.
    validation: {min: 1, max: 2147483647}
  - name: per_page
    type: integer
    required: false
    default: 50
    description: Accounts returned in this page.
    validation: {min: 5, max: 50}
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-accounts, "{{ args.page }}", "{{ args.per_page }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Accounts
    args: {}
