schema_version: 1
id: cf.list_rulesets
title: List zone rulesets
kind: script
risk: low
description: List every ruleset attached to a zone — WAF managed and custom rules, rate limiting, redirects, transforms — with each ruleset's phase and version.
side_effects: [One read-only API request.]
args:
  - name: zone_id
    type: string
    required: true
    description: Zone ID.
    validation:
      pattern: "^[a-f0-9]{32}$"
execution:
  script: {path: scripts/cf_api.sh, interpreter: /bin/bash}
  argv: [list-rulesets, "{{ args.zone_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Rulesets
    args: {zone_id: "abc123def456abc123def456abc123de"}
