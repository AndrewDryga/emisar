schema_version: 1

id: postfix
name: Postfix mail server
version: 0.1.16
retired_below: 0.1.11
description: >
  Queue inspection, config dump, log tailing, plus narrow operator
  actions (flush, requeue, delete-by-queue-id). These mutators are high-
  or critical-risk; the reversible hold/release pause is medium. All are
  audited. Queue inspection and mutation run as root because the runner's
  no-new-privileges boundary prevents Postfix helpers from elevating.
vendor: emisar
homepage: https://emisar.dev/packs/postfix

requires:
  os:
    - linux

# `emisar pack suggest` detection: a postfix-specific CLI. The master
# process is generically named `master`, and :25 is shared by every MTA —
# neither discriminates postfix, so detect by a postfix-only binary.
detect:
  binaries:
    - postqueue

setup:
  summary: >
    Operates on the local Postfix instance on the runner host — no
    credentials needed. Uses the standard binaries (postqueue, postconf,
    mailq, postsuper) and reads the queue under `/var/spool/postfix`.
  notes:
    - "maillog actions read `/var/log/mail.log`, falling back to `/var/log/maillog` (RHEL-family)."
  host_access:
    - actions:
        - postfix.mailq
        - postfix.qshape
        - postfix.queue_counts
        - postfix.postcat_qid
        - postfix.flush_queue
        - postfix.delete_qid
        - postfix.check_config
        - postfix.reload
        - postfix.postsuper_hold
        - postfix.postsuper_release
        - postfix.postsuper_requeue
      requirement: Read protected queue files and mail logs, or validate and mutate Postfix state, as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-postfix-root.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. Postfix actions can remove,
            inspect, flush, requeue, hold, or release messages and reload the mail service.
    - actions:
        - postfix.maillog_tail
        - postfix.maillog_grep
      requirement: Read Postfix logs through the Debian or Ubuntu system log-reader group.
      recipes:
        - name: Add the default Emisar service user to adm
          commands:
            - "sudo usermod -aG adm emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx adm"
            - "sudo -u emisar test -r /var/log/mail.log"
          impact: >
            Every process running as emisar can read every host log granted to adm, not only
            Postfix logs. RHEL-family paths need an equivalent persistent log-reader grant.
  verify: postfix.mailq

actions:
  - actions/mailq.yaml
  - actions/qshape.yaml
  - actions/queue_counts.yaml
  - actions/postconf.yaml
  - actions/postcat_qid.yaml
  - actions/maillog_tail.yaml
  - actions/maillog_grep.yaml
  - actions/flush_queue.yaml
  - actions/delete_qid.yaml
  - actions/check_config.yaml
  - actions/reload.yaml
  - actions/postsuper_hold.yaml
  - actions/postsuper_release.yaml
  - actions/postsuper_requeue.yaml
