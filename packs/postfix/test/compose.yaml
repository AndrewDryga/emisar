services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/postfix/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-5.1.0-alpine}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-postfix-tools:latest
    network_mode: service:postfix
    pid: service:postfix
    volumes:
      - postfix_config:/etc/postfix
      - postfix_spool:/var/spool/postfix

  postfix:
    image: boky/postfix:${PACKTEST_VERSION:-5.1.0-alpine}${PACKTEST_DIGEST-}
    environment:
      HOSTNAME: postfix.example.test
      ALLOWED_SENDER_DOMAINS: example.test
    volumes:
      - postfix_config:/etc/postfix
      - postfix_spool:/var/spool/postfix
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null && postconf -h myhostname | grep -q postfix.example.test"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 30

volumes:
  postfix_config:
  postfix_spool:
