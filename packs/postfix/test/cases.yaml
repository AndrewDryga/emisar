services: [postfix]
versions:
  - version: 5.1.0-alpine
    digest: "@sha256:6e761312e833947f77af755072c0e77b67d298d127595470a79e9454008dd594"
    default: true
risk_accountability:
  mode: complete
cases:
  - action: postfix.mailq
    runner_user: root
    runner_reason: >-
      Postfix keeps the showq socket under a postdrop-group directory, and
      postqueue reaches it by being setgid postdrop. The runner sets
      no_new_privs on every action child, so that bit no longer elevates —
      exactly as the pack's own note requires, the runner user must own the
      queue or be a postdrop member, and this fixture's uid is neither.
    expect:
      stdout_contains: [Mail queue is empty]
  - action: postfix.qshape
    expect:
      stdout_contains: [TOTAL]
  - action: postfix.queue_counts
    expect:
      stdout_contains: [active, deferred, hold]
  - action: postfix.postconf
    expect:
      stdout_contains: [myhostname, postfix.example.test]
  - action: postfix.postcat_qid
    runner_user: root
    runner_reason: Postfix keeps queue files under /var/spool/postfix readable only by the superuser.
    arrange:
      # Defer all SMTP delivery (and pin short queue IDs) before enqueueing so
      # the message stays queued deterministically instead of racing the queue
      # manager to a bounce.
      - argv: [/bin/sh, -c, "postconf -e 'defer_transports = smtp relay' 'enable_long_queue_ids = no' && postfix reload"]
      - argv: [/bin/sh, -c, "printf 'Subject: packtest postcat\\n\\npacktest postcat body marker\\n' | sendmail -f sender@example.test recipient@undeliverable.example"]
    resolve_args:
      queue_id:
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest postcat' && {
                printf '%s\n' "$id"
                exit 0
              }
            done
            exit 1
        retry_for: 15s
        retry_every: 500ms
    expect:
      stdout_contains:
        - "Subject: packtest postcat"
        - packtest postcat body marker
  - action: postfix.check_config
    runner_user: root
    runner_reason: Postfix reserves the postfix command itself for the superuser.
    expect:
      exit: [0]
    probes:
      - argv: [/bin/sh, -c, "postfix check && echo config-valid"]
        expect:
          stdout_contains: [config-valid]
  - action: postfix.flush_queue
    runner_user: root
    runner_reason: Postfix reserves queue-control commands for the superuser.
    probes:
      - argv: [/bin/sh, -c, "postfix status && echo running"]
        expect:
          stdout_contains: [running]
  - action: postfix.delete_qid
    runner_user: root
    runner_reason: Postfix reserves queue-control commands for the superuser.
    arrange:
      # Same deterministic-queue setup as postcat_qid: defer delivery and pin
      # short queue IDs so the enqueued message stays put with an ID matching
      # the action's ^[A-F0-9]{6,20}$ pattern.
      - argv: [/bin/sh, -c, "postconf -e 'defer_transports = smtp relay' 'enable_long_queue_ids = no' && postfix reload"]
      - argv: [/bin/sh, -c, "printf 'Subject: packtest delete\\n\\npacktest delete body marker\\n' | sendmail -f sender@example.test recipient@undeliverable.example"]
    resolve_args:
      queue_id:
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest delete' && {
                printf '%s\n' "$id"
                exit 0
              }
            done
            exit 1
        retry_for: 15s
        retry_every: 500ms
    probes:
      - argv: [postqueue, -p]
        expect:
          stdout_contains: [Mail queue is empty]
        retry_for: 10s
        retry_every: 500ms
  - action: postfix.reload
    runner_user: root
    runner_reason: Postfix reserves daemon-control commands for the superuser.
    probes:
      - argv: [/bin/sh, -c, "postfix status && echo running"]
        expect:
          stdout_contains: [running]
  - name: postfix.reload-denied-nonroot
    action: postfix.reload
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [reserved for the superuser]
  - action: postfix.postsuper_hold
    runner_user: root
    runner_reason: Postfix reserves queue-control commands for the superuser.
    arrange:
      # Same deterministic-queue setup as postcat_qid/delete_qid: defer delivery
      # and pin short queue IDs so the enqueued message stays put with an ID
      # matching the action's ^[A-F0-9]{6,20}$ pattern.
      - argv: [/bin/sh, -c, "postconf -e 'defer_transports = smtp relay' 'enable_long_queue_ids = no' && postfix reload"]
      - argv: [/bin/sh, -c, "printf 'Subject: packtest hold\\n\\npacktest hold body marker\\n' | sendmail -f sender@example.test recipient@undeliverable.example"]
    resolve_args:
      qid:
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest hold' && {
                printf '%s\n' "$id"
                exit 0
              }
            done
            exit 1
        retry_for: 15s
        retry_every: 500ms
    probes:
      - argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/hold -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest hold' && {
                echo hold-marker-present
                exit 0
              }
            done
            exit 1
        expect:
          stdout_contains: [hold-marker-present]
        retry_for: 10s
        retry_every: 500ms
  - action: postfix.postsuper_release
    runner_user: root
    runner_reason: Postfix reserves queue-control commands for the superuser.
    arrange:
      - argv: [/bin/sh, -c, "postconf -e 'defer_transports = smtp relay' 'enable_long_queue_ids = no' && postfix reload"]
      - argv: [/bin/sh, -c, "printf 'Subject: packtest release\\n\\npacktest release body marker\\n' | sendmail -f sender@example.test recipient@undeliverable.example"]
      # Wait for this case's message to reach a stable queue, then hold its
      # exact ID. Retrying the whole command covers pickup+cleanup latency.
      - name: hold the enqueued message
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest release' || continue
              postsuper -h "$id" >/dev/null 2>&1 || exit 1
              postqueue -p | grep -Eq "^${id}!( |$)" && echo held && exit 0
            done
            exit 1
        expect:
          stdout_contains: [held]
        retry_for: 15s
        retry_every: 500ms
    resolve_args:
      qid:
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/hold -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest release' && {
                printf '%s\n' "$id"
                exit 0
              }
            done
            exit 1
        retry_for: 10s
        retry_every: 500ms
    probes:
      # Released back into a stable queue: this case's message is unheld.
      - argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest release' && {
                echo hold-cleared
                exit 0
              }
            done
            exit 1
        expect:
          stdout_contains: [hold-cleared]
        retry_for: 10s
        retry_every: 500ms
  - action: postfix.postsuper_requeue
    runner_user: root
    runner_reason: Postfix reserves queue-control commands for the superuser.
    arrange:
      - argv: [/bin/sh, -c, "postconf -e 'defer_transports = smtp relay' 'enable_long_queue_ids = no' && postfix reload"]
      - argv: [/bin/sh, -c, "printf 'Subject: packtest requeue\\n\\npacktest requeue body marker\\n' | sendmail -f sender@example.test recipient@undeliverable.example"]
      # Wait for this case's message to reach a stable queue, then hold its
      # exact ID. Retrying the whole command covers pickup+cleanup latency.
      - name: hold the enqueued message
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest requeue' || continue
              postsuper -h "$id" >/dev/null 2>&1 || exit 1
              postqueue -p | grep -Eq "^${id}!( |$)" && echo held && exit 0
            done
            exit 1
        expect:
          stdout_contains: [held]
        retry_for: 15s
        retry_every: 500ms
    resolve_args:
      qid:
        argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/hold -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest requeue' && {
                printf '%s\n' "$id"
                exit 0
              }
            done
            exit 1
        retry_for: 10s
        retry_every: 500ms
    probes:
      # Requeue moves the held message into maildrop for cleanup. Pickup may
      # already have moved it to deferred by the time this probe runs.
      - argv:
          - /bin/sh
          - -c
          - |
            for path in $(find /var/spool/postfix/maildrop /var/spool/postfix/deferred -type f); do
              id=${path##*/}
              postcat -q "$id" 2>/dev/null | grep -Fq 'Subject: packtest requeue' && {
                echo requeued-unheld
                exit 0
              }
            done
            exit 1
        expect:
          stdout_contains: [requeued-unheld]
        retry_for: 15s
        retry_every: 500ms
