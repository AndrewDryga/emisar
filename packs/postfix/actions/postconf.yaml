schema_version: 1
id: postfix.postconf
title: postconf -n
kind: exec
risk: high
description: >
  Show non-default Postfix config (`postconf -n`). A full parameter dump:
  `smtp_sasl_password_maps`-style parameters can inline `static:`
  credentials, so this can surface secrets. The runner's redaction is a
  pattern-bound backstop, not a guarantee.
side_effects:
  - One postconf call.
  - Read-only, but dumps every non-default parameter (may include inline credentials).
args: []
execution:
  command: {binary: postconf, argv: ["-n"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Effective config
    args: {}
