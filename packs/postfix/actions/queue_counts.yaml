schema_version: 1
id: postfix.queue_counts
title: Per-queue message counts
kind: exec
risk: low
description: Count messages in incoming/active/deferred/hold queues.
side_effects: ["Counts files in /var/spool/postfix/*.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Without the spool check, a host with no postfix at all reported every
      # queue as 0 — indistinguishable from "the queues are empty", which is the
      # healthy answer. The per-queue 2>/dev/null stays: it covers the normal
      # race of a message being delivered mid-walk.
      - |
        [ -d /var/spool/postfix ] || { echo "no postfix spool at /var/spool/postfix" >&2; exit 1; }
        for q in incoming active deferred hold; do n=$(find /var/spool/postfix/$q -type f 2>/dev/null | wc -l); echo "$q: $n"; done
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Counts
    args: {}
