schema_version: 1
id: postfix.postsuper_requeue
title: postsuper -r <qid|ALL>
kind: exec
risk: high
description: >
  Requeue one message, or with ALL every message in the hold, incoming,
  active and deferred queues (`postsuper -r`). Each is moved to the
  maildrop queue and re-processed by pickup and cleanup into a new queue
  file, so a held message is released and becomes eligible for delivery
  again.
side_effects:
  - Message(s) moved from the hold, incoming, active or deferred queue to maildrop and re-processed by cleanup.
  - Held messages are released and become eligible for delivery.
  - Delivery attempted on next tick.
  - ALL can cause a delivery burst on a large queue.
args:
  - name: qid
    type: string
    required: true
    description: Queue ID, short (hex) or long (enable_long_queue_ids = yes), or the literal "ALL" for every message in the hold, incoming, active and deferred queues.
    validation:
      pattern: "^([A-F0-9]{6,20}|[0-9B-DF-HJ-NP-TV-Zb-df-hj-np-tv-z]{10,14}z[0-9B-DF-HJ-NP-TV-Zb-df-hj-np-tv-y]{1,12}|ALL)$"
execution:
  command:
    binary: postsuper
    argv: ["-r", "{{ args.qid }}"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Requeue one
    args:
      qid: "3ABCDEF12345"
  - title: Requeue every queued message
    args:
      qid: "ALL"
