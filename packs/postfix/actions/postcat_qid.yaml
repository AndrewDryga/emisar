schema_version: 1
id: postfix.postcat_qid
title: postcat -q <queue-id>
kind: exec
risk: high
description: >
  Decode one queued message — headers + body. Message content is
  inherently sensitive (user PII, and bodies routinely carry password
  resets, tokens, and other credentials). The runner's redaction is a
  fail-closed backstop, not a guarantee — it is pattern-bound and can
  miss a bespoke secret whose name and value match no rule.
side_effects: ["Reads one spool file.", "Read-only — message content may include user PII."]
args:
  - name: queue_id
    type: string
    required: true
    description: Postfix queue ID.
    validation:
      pattern: "^[A-F0-9]{6,20}$"
execution:
  command:
    binary: postcat
    argv: ["-q", "{{ args.queue_id }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Show one deferred message
    args:
      queue_id: "3F7A8C001234"
