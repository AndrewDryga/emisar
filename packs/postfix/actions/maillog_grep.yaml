schema_version: 1
id: postfix.maillog_grep
title: grep mail.log for queue-id / address
kind: exec
risk: low
description: List all mail-log entries matching a string.
side_effects: ["One file read.", "Read-only."]
args:
  - name: pattern
    type: string
    required: true
    description: Literal match.
    validation:
      pattern: "^[a-zA-Z0-9_.@\\-]{1,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # `grep … | head` always exited 0, so the `||` fallback was dead code: on a
      # host with only /var/log/maillog this returned empty success and never
      # tried it. Pick the readable log first, then grep it once.
      - |
        if [ -r /var/log/mail.log ]; then log=/var/log/mail.log
        elif [ -r /var/log/maillog ]; then log=/var/log/maillog
        else echo "no readable mail log at /var/log/mail.log or /var/log/maillog" >&2; exit 1
        fi
        grep -F "$P" "$log" | head -2000
  env:
    P: "{{ args.pattern }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Trace one recipient
    args:
      pattern: "user@example.com"
