schema_version: 1
id: tf.plan_file_summary
title: Project a saved plan into a reviewable summary
kind: script
risk: low
search_terms:
  - review saved plan
  - review CI plan
  - what will this apply change
description: >
  List what a plan file already on disk would create, update, delete, or
  replace, in the same shape as tf.plan_summary but without contacting any
  provider — this reads a plan CI has already computed. The summary counts
  always cover the whole plan; the change, drift, and output lists keep a
  bounded sample — most destructive first — and `truncated` reports how many
  entries each list dropped, so the result fits the runner's structured-output
  cap on plans of any size. The filename must resolve beneath TF_PLAN_DIR;
  symlink and traversal escapes fail closed. A saved plan stores every
  attribute and output value in cleartext, sensitive ones included; this
  projection reads none of them.
side_effects:
  - Reads one saved plan file capped at 32 MiB, plus the workspace's provider schemas.
  - Contacts no provider and never modifies the plan or state.
args:
  - name: plan_file
    type: string
    required: true
    description: Saved plan basename under TF_PLAN_DIR.
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$"
      max_length: 127
execution:
  script:
    path: scripts/plan_summary.sh
    interpreter: /bin/bash
  argv: [file, "{{ args.plan_file }}"]
  timeout: 5m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [source, cli_version, summary, changes, drift, outputs, diagnostics, truncated]
    properties:
      source: {const: plan_file}
      cli_version: {type: string, maxLength: 32}
      summary:
        type: object
        additionalProperties: false
        required: [total, create, update, delete, replace, read, import, drifted]
        properties:
          total: {type: integer, minimum: 0}
          create: {type: integer, minimum: 0}
          update: {type: integer, minimum: 0}
          delete: {type: integer, minimum: 0}
          replace: {type: integer, minimum: 0}
          read: {type: integer, minimum: 0}
          import: {type: integer, minimum: 0}
          drifted: {type: integer, minimum: 0}
      changes:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action, reason]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
            reason: {type: string, maxLength: 36}
      drift:
        type: array
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
      outputs:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required: [name, action, sensitive]
          properties:
            name: {type: string, maxLength: 40}
            action: {type: string, maxLength: 12}
            sensitive: {type: boolean}
      diagnostics:
        type: array
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [severity, summary]
          properties:
            severity: {type: string, maxLength: 12}
            summary: {type: string, maxLength: 100}
      truncated:
        type: object
        additionalProperties: false
        required: [changes, drift, outputs, diagnostics]
        properties:
          changes: {type: integer, minimum: 0}
          drift: {type: integer, minimum: 0}
          outputs: {type: integer, minimum: 0}
          diagnostics: {type: integer, minimum: 0}
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Review the plan CI just built
    args:
      plan_file: review.tfplan
