schema_version: 1
id: tf.validate
title: terraform validate
kind: exec
risk: low
description: >
  Validate the workspace's HCL files. No state read or write. Terraform starts
  the provider plugins installed under `.terraform/providers` to load their
  schemas and check the configuration, as the runner's user, so whoever can
  write the workspace controls what this action runs.
side_effects:
  - Forks the configured CLI.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "cd \"$TF_DIR\" && \"${TF_BIN:-terraform}\" validate"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Validate
    args: {}
