schema_version: 1
id: tf.plan_summary
title: Project a fresh plan into a reviewable summary
kind: script
risk: medium
search_terms:
  - review plan
  - what will change
  - blast radius
  - destroy count
description: >
  List what a fresh plan would create, update, delete, or replace, with
  per-action counts, resources that drifted outside Terraform, planned output
  changes, and diagnostics. The summary counts always cover the whole plan;
  the change, drift, output, and diagnostic lists keep a bounded sample —
  most destructive first — and `truncated` reports how many entries each list
  dropped, so the result fits the runner's structured-output cap on plans of
  any size. Attribute and output VALUES are never emitted — only addresses,
  types, actions, and names — so a plan can be reviewed without dumping the
  secrets a full plan carries in cleartext. Saves no plan file, so nothing
  this returns can be applied. Needs a workspace that plans on this host: HCP
  Terraform and Terraform Enterprise workspaces set to remote or agent
  execution stream no structured output, and this fails rather than reporting
  an empty plan — review those with the hcp-terraform pack. A `cloud` block
  alone is fine; what decides it is the workspace's execution mode.
side_effects:
  - Calls every provider's read API to refresh state — quota usage applies.
  - Briefly holds the backend's state lock while planning.
  - Read-only — writes no state and saves no applyable plan.
args: []
execution:
  script:
    path: scripts/plan_summary.sh
    interpreter: /bin/bash
  argv: [live]
  timeout: 30m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [source, cli_version, summary, changes, drift, outputs, diagnostics, truncated]
    properties:
      source: {const: plan}
      cli_version: {type: string, maxLength: 32}
      summary:
        type: object
        additionalProperties: false
        required: [total, create, update, delete, replace, read, import, drifted]
        properties:
          total: {type: integer, minimum: 0}
          create: {type: integer, minimum: 0}
          update: {type: integer, minimum: 0}
          delete: {type: integer, minimum: 0}
          replace: {type: integer, minimum: 0}
          read: {type: integer, minimum: 0}
          import: {type: integer, minimum: 0}
          drifted: {type: integer, minimum: 0}
      changes:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action, reason]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
            reason: {type: string, maxLength: 36}
      drift:
        type: array
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
      outputs:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required: [name, action, sensitive]
          properties:
            name: {type: string, maxLength: 40}
            action: {type: string, maxLength: 12}
            sensitive: {type: boolean}
      diagnostics:
        type: array
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [severity, summary]
          properties:
            severity: {type: string, maxLength: 12}
            summary: {type: string, maxLength: 100}
      truncated:
        type: object
        additionalProperties: false
        required: [changes, drift, outputs, diagnostics]
        properties:
          changes: {type: integer, minimum: 0}
          drift: {type: integer, minimum: 0}
          outputs: {type: integer, minimum: 0}
          diagnostics: {type: integer, minimum: 0}
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Review what a plan would change
    args: {}
