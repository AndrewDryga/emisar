services: [terraform]
versions:
  - version: "1.15.8"
    digest: "@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963"
    default: true
secret_env: []
env:
  TF_DIR: /packs/terraform-readonly/test/fixtures/live
  TF_STATE_CANDIDATE_DIR: /packs/terraform-readonly/test/fixtures/candidates
cases:
  - action: tf.state_metadata
    expect:
      stdout_not_contains:
        - packtest-canary-terraform-state-secret-8d6a
        - packtest-canary-terraform-resource-secret-e9c4
      json:
        /source: live
        /state_format_version: 4
        /serial: 42
        /lineage: 11111111-2222-3333-4444-555555555555
        /resource_instance_count: 3

  - action: tf.state_file_metadata
    args: {candidate_file: older.tfstate}
    expect:
      stdout_not_contains: [packtest-canary-terraform-candidate-secret-0a5f]
      json:
        /source: candidate
        /serial: 41
        /resource_instance_count: 0

  - name: tf.state_compare_metadata-older
    action: tf.state_compare_metadata
    args: {candidate_file: older.tfstate}
    expect:
      json:
        /relation: candidate_older
        /serial_delta: -1

  - name: tf.state_compare_metadata-newer
    action: tf.state_compare_metadata
    args: {candidate_file: newer.tfstate}
    expect:
      json:
        /relation: candidate_newer
        /serial_delta: 1

  - name: tf.state_compare_metadata-equal
    action: tf.state_compare_metadata
    args: {candidate_file: equal.tfstate}
    expect:
      json:
        /relation: equal_serial
        /serial_delta: 0

  - name: tf.state_compare_metadata-lineage-mismatch
    action: tf.state_compare_metadata
    args: {candidate_file: mismatch.tfstate}
    expect:
      json:
        /relation: lineage_mismatch
        /serial_delta: null

  - name: tf.state_file_metadata-rejects-traversal
    action: tf.state_file_metadata
    args: {candidate_file: ../terraform.tfstate}
    expect:
      status: failure
      reason_contains: [must match pattern]

  # The plan fixtures need a writable, initialized workspace, and /packs is
  # mounted read-only, so each plan case stages and initializes its own copy.
  # `terraform init` reaches no network here: the fixture uses only the builtin
  # terraform_data resource.
  - name: tf.plan_summary
    action: tf.plan_summary
    env:
      TF_DIR: /tmp/tfreview/workspace
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfreview/workspace && cp /packs/terraform-readonly/test/fixtures/plan/main.tf /tmp/tfreview/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfreview/workspace && terraform init -input=false"]
    expect:
      # Terraform emits planned_change messages in no fixed order, so identity is
      # asserted by substring and quantity by the order-independent summary.
      stdout_contains:
        - terraform_data.database
        - "terraform_data.workers[0]"
        - "terraform_data.workers[1]"
      stdout_not_contains:
        - packtest-canary-terraform-plan-attribute-3f18
        - packtest-canary-terraform-plan-output-9c3d
        - packtest-canary-terraform-plan-secret-4b71
      json:
        /source: plan
        /summary/total: 3
        /summary/create: 3
        /summary/update: 0
        /summary/delete: 0
        /summary/replace: 0
        /summary/drifted: 0
        # A complete plan reports zero omitted entries.
        /truncated/changes: 0
        /truncated/outputs: 0

  - name: tf.plan_file_summary
    action: tf.plan_file_summary
    args: {plan_file: review.tfplan}
    env:
      TF_DIR: /tmp/tfreview/workspace
      TF_PLAN_DIR: /tmp/tfreview/plans
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfreview/workspace /tmp/tfreview/plans && cp /packs/terraform-readonly/test/fixtures/plan/main.tf /tmp/tfreview/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfreview/workspace && terraform init -input=false"]
      - name: save a plan the way CI would
        argv:
          - /bin/sh
          - -c
          - "cd /tmp/tfreview/workspace && terraform plan -input=false -out=/tmp/tfreview/plans/review.tfplan"
    expect:
      # A saved plan stores every value in cleartext, sensitive included — this
      # asserts the projection reads none of them.
      stdout_contains:
        - terraform_data.database
        - admin_token
      stdout_not_contains:
        - packtest-canary-terraform-plan-attribute-3f18
        - packtest-canary-terraform-plan-output-9c3d
        - packtest-canary-terraform-plan-secret-4b71
      json:
        /source: plan_file
        /summary/total: 3
        /summary/create: 3
        /summary/delete: 0
        /summary/drifted: 0

  # A remote-execution workspace streams the run's human output and emits only
  # the local CLI's version line as JSON. Skipping the unparseable lines would
  # yield a confident, entirely EMPTY summary for a plan that changes five
  # resources, so the action refuses rather than answers.
  - name: tf.plan_summary-refuses-remote-execution
    action: tf.plan_summary
    env:
      TF_DIR: /packs/terraform-readonly/test/fixtures/plan
      TF_BIN: /packs/terraform-readonly/test/fixtures/streams/remote-execution.sh
    expect:
      status: failure
      stderr_contains: [streamed no structured plan output]
      stdout_not_contains: ['"total":0']

  # The stream spells an unchanged output "noop" while a saved plan spells it
  # "no-op". Matching one spelling made the two paths report different outputs
  # for the same plan, so both filters run through one predicate now. The 14
  # changes also exceed the 10-entry list cap, so this doubles as the proof
  # that the summary still counts everything the truncated list dropped and
  # that the sample sorts most destructive first.
  - name: tf.plan_summary-filters-unchanged-outputs
    action: tf.plan_summary
    env:
      TF_DIR: /packs/terraform-readonly/test/fixtures/plan
      TF_BIN: /packs/terraform-readonly/test/fixtures/streams/local-noop-outputs.sh
    expect:
      stdout_not_contains: [output_0, noop]
      json:
        /summary/total: 14
        /summary/update: 5
        /summary/replace: 6
        /summary/read: 3
        /summary/drifted: 1
        /changes/0/action: replace
        /truncated/changes: 4
        /truncated/drift: 0
        /outputs/0/name: changed_output

  # A production-scale plan whose every field is hostile: 300 changes, more
  # drift, outputs, and diagnostics than the bounded sample keeps, every
  # string flooded past its clip with the bytes JSON escaping doubles. The
  # runner rejects a structured result over 8 KiB, so this case's success IS
  # the byte-cap proof; the truncated counts keep the partial lists honest,
  # and the sentinel deletes pin the exact clip boundary — 80 characters
  # survive intact, 81 clip to 79 plus an ellipsis.
  - name: tf.plan_summary-fits-the-cap-on-a-worst-case-stream
    action: tf.plan_summary
    env:
      TF_DIR: /packs/terraform-readonly/test/fixtures/plan
      TF_BIN: /packs/terraform-readonly/test/fixtures/streams/worst-case-flood.sh
    expect:
      json:
        /source: plan
        /cli_version: "1.15.8-worst-case-build-with-a-…"
        /summary/total: 300
        /summary/delete: 120
        /summary/replace: 60
        /summary/drifted: 40
        /changes/0/address: AAA-sentinel-delete-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        /changes/0/action: delete
        /changes/1/address: "AAB-sentinel-delete-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"
        /truncated/changes: 290
        /truncated/drift: 37
        /truncated/outputs: 36
        /truncated/diagnostics: 17

  # The saved-plan path at production scale with the real CLI: 150 resources
  # whose addresses exceed the 80-character clip and more outputs than the
  # sample keeps. Success is the byte-cap proof for project_file, same as the
  # stream case above proves project_stream.
  - name: tf.plan_file_summary-fits-the-cap-on-a-worst-case-plan
    action: tf.plan_file_summary
    args: {plan_file: flood.tfplan}
    env:
      TF_DIR: /tmp/tfflood/workspace
      TF_PLAN_DIR: /tmp/tfflood/plans
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfflood/workspace /tmp/tfflood/plans && cp /packs/terraform-readonly/test/fixtures/flood/main.tf /tmp/tfflood/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfflood/workspace && terraform init -input=false"]
      - name: save a production-scale plan the way CI would
        argv:
          - /bin/sh
          - -c
          - "cd /tmp/tfflood/workspace && terraform plan -input=false -out=/tmp/tfflood/plans/flood.tfplan"
    expect:
      json:
        /source: plan_file
        /summary/total: 150
        /summary/create: 150
        /summary/delete: 0
        /summary/drifted: 0
        /truncated/changes: 140
        /truncated/drift: 0
        /truncated/outputs: 2
        /truncated/diagnostics: 0

  # The stand-in hands `show -json` a document that still carries
  # format_version but a scalar where resource_changes belongs. Skipping the
  # type error would yield a confident, entirely EMPTY summary for a plan
  # whose contents are unknown, so the action refuses rather than answers.
  - name: tf.plan_file_summary-fails-closed-on-a-malformed-collection
    action: tf.plan_file_summary
    args: {plan_file: malformed.tfplan}
    env:
      TF_DIR: /packs/terraform-readonly/test/fixtures/plan
      TF_BIN: /packs/terraform-readonly/test/fixtures/streams/malformed-plan-show.sh
      TF_PLAN_DIR: /tmp/tfmalformed/plans
    arrange:
      - name: stage a placeholder saved plan
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfmalformed/plans && touch /tmp/tfmalformed/plans/malformed.tfplan"
    expect:
      status: failure
      stderr_contains: [resource_changes in the plan document is number rather than an array]
      stdout_not_contains: ['"total":0']

  - name: tf.plan_file_summary-rejects-traversal
    action: tf.plan_file_summary
    args: {plan_file: ../workspace/terraform.tfstate}
    env:
      TF_DIR: /tmp/tfreview/workspace
      TF_PLAN_DIR: /tmp/tfreview/plans
    expect:
      status: failure
      reason_contains: [must match pattern]

  # TF_BIN reaches both execution shapes: the /bin/sh -c argv programs and the
  # packaged script. Proving only one would leave the other free to drift back
  # to a hardcoded terraform.
  - name: tf.version-opentofu
    action: tf.version
    env: {TF_BIN: tofu}
    expect:
      stdout_contains: [OpenTofu]

  # terraform_version is what proves OpenTofu did the read: `state pull` rewrites
  # it to the CLI that ran, so it tracks the tofu pin in this pack's Dockerfile
  # rather than the fixture's recorded 1.15.8. Bumping that pin fails this case.
  - name: tf.state_metadata-opentofu
    action: tf.state_metadata
    env: {TF_BIN: tofu}
    expect:
      stdout_not_contains:
        - packtest-canary-terraform-state-secret-8d6a
        - packtest-canary-terraform-resource-secret-e9c4
      json:
        /source: live
        /state_format_version: 4
        /serial: 42
        /lineage: 11111111-2222-3333-4444-555555555555
        /terraform_version: 1.12.5
        /resource_instance_count: 3

  # show_json, output, and state_show exist to dump state in full, so the
  # evidence that earns their `high` tier is the leak itself: the fixture's
  # secret resource attribute and its `sensitive` output must come back in
  # cleartext. The metadata cases above assert the opposite for the projections
  # that are meant to redact; the two sets together are what keep that
  # distinction honest rather than assumed. Like the plan cases, each stages,
  # initializes, and applies its own copy because /packs is mounted read-only.
  # `terraform init` and `apply` reach no network here — the fixture uses only
  # the builtin provider.
  - name: tf.show_json
    action: tf.show_json
    env:
      TF_DIR: /tmp/tfdump/workspace
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfdump/workspace && cp /packs/terraform-readonly/test/fixtures/live/main.tf /tmp/tfdump/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform init -input=false"]
      - name: create state
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform apply -auto-approve -input=false"]
    expect:
      stdout_contains:
        - terraform_data.database
        - packtest-canary-terraform-resource-secret-e9c4

  - name: tf.output
    action: tf.output
    env:
      TF_DIR: /tmp/tfdump/workspace
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfdump/workspace && cp /packs/terraform-readonly/test/fixtures/live/main.tf /tmp/tfdump/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform init -input=false"]
      - name: create state
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform apply -auto-approve -input=false"]
    expect:
      # `output -json` deliberately un-masks a `sensitive` output. That is the
      # whole reason this read is approval-gated rather than free.
      stdout_contains:
        - packtest-canary-terraform-state-secret-8d6a

  - name: tf.state_show
    action: tf.state_show
    args: {address: terraform_data.database}
    env:
      TF_DIR: /tmp/tfdump/workspace
    arrange:
      - name: stage workspace
        argv:
          - /bin/sh
          - -c
          - "mkdir -p /tmp/tfdump/workspace && cp /packs/terraform-readonly/test/fixtures/live/main.tf /tmp/tfdump/workspace/"
      - name: initialize workspace
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform init -input=false"]
      - name: create state
        argv: [/bin/sh, -c, "cd /tmp/tfdump/workspace && terraform apply -auto-approve -input=false"]
    expect:
      stdout_contains:
        - packtest-canary-terraform-resource-secret-e9c4
