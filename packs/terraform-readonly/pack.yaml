schema_version: 1

id: terraform-readonly
name: Terraform / OpenTofu read-only ops
version: 0.7.3
description: >
  Read-only Terraform or OpenTofu CLI actions for inspecting a workspace.
  NO apply, NO destroy, NO state mutation — those should happen in CI, not
  via a runner. Operates in the directory given by TF_DIR env var, running
  whichever CLI TF_BIN names — `terraform` by default, `tofu` on an
  OpenTofu host, so one of those two must be on PATH.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os:
    - linux
  binaries:
    - jq

setup:
  summary: >
    Every action runs `cd "$TF_DIR" && terraform …`, so TF_DIR must point
    at an initialized working directory on the runner host. Set TF_BIN=tofu
    to drive OpenTofu instead. Provider and backend credentials come from
    that config, not from this pack.
  env:
    - name: TF_DIR
      required: true
      description: >
        Path to an initialized working directory (already `terraform
        init`-ed, with .terraform and a backend configured).
      example: /srv/infra/prod
    - name: TF_BIN
      description: >
        CLI that runs every action. Set it to `tofu` on an OpenTofu host;
        the two are command-compatible for everything this pack calls.
      default: terraform
      example: tofu
    - name: TF_STATE_CANDIDATE_DIR
      description: >
        Optional restricted directory containing candidate .tfstate files for
        metadata inspection and comparison.
      example: /srv/infra/recovery
    - name: TF_PLAN_DIR
      description: >
        Optional restricted directory where CI drops saved plan files for
        plan_file_summary to review.
      example: /srv/infra/plans
  notes:
    - "Provider and backend auth depend entirely on what the config uses: an AWS provider/backend reads AWS_* (or an EC2/role profile), GCP reads GOOGLE_APPLICATION_CREDENTIALS, and so on — allowlist whatever your config needs."
    - "state_list, state_show, show_json, output, state_metadata, and state_compare_metadata read the backend state, so the backend credentials must be reachable; validate, version, state_file_metadata, and plan_file_summary do not."
    - "plan_no_save and plan_summary (both risk medium) call every provider's read APIs (quota usage) and briefly hold the state lock, but never write state or save an applyable plan."
    - "For review, prefer plan_summary over plan_no_save and show_json: it returns addresses, actions, counts, drift, and diagnostics as JSON while emitting no attribute or output values. plan_file_summary returns the same shape for a plan CI already saved, without contacting a provider."
    - "plan_summary needs a workspace that plans ON THIS HOST. What decides that is the HCP Terraform / Terraform Enterprise workspace's execution mode, not the backend: a `cloud` block with execution mode `local` works fine, while `remote` and `agent` stream the run's human output instead of machine-readable messages. The action fails closed there rather than reporting an empty plan; use the hcp-terraform pack for those workspaces. plan_no_save still works everywhere, and the state-reading actions are unaffected."
    - "`state pull` may upgrade state to the local CLI's readable format; terraform_version in projected metadata can therefore reflect the runner's CLI rather than the writer of the remote snapshot."
    - "TF_BIN only reaches the action when the runner's inherit_env allowlists it, exactly like TF_DIR — an unset TF_BIN runs `terraform`."
  verify: tf.version

actions:
  - actions/version.yaml
  - actions/providers.yaml
  - actions/state_list.yaml
  - actions/state_show.yaml
  - actions/show_json.yaml
  - actions/output.yaml
  - actions/validate.yaml
  - actions/plan_no_save.yaml
  - actions/plan_summary.yaml
  - actions/plan_file_summary.yaml
  - actions/state_metadata.yaml
  - actions/state_file_metadata.yaml
  - actions/state_compare_metadata.yaml
