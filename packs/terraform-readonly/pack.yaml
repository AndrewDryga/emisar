schema_version: 1

id: terraform-readonly
name: Terraform / OpenTofu read-only ops
version: 0.7.12
description: >
  Read-only Terraform or OpenTofu CLI actions for inspecting a workspace's
  configuration, plans, and state. Keep applies, destroys, and state changes in
  your deployment workflow. For HCP Terraform run approvals and applies, use
  the `hcp-terraform` pack. This pack operates in the directory given by TF_DIR,
  using the CLI named by TF_BIN: `terraform` by default, or `tofu` for OpenTofu.
  Install that CLI on the runner host and make it available on PATH.
vendor: emisar
homepage: https://emisar.dev/packs/terraform-readonly

requires:
  os:
    - linux
  binaries:
    - jq
    - bash

setup:
  summary: >
    Every action runs `cd "$TF_DIR" && terraform …`, so `TF_DIR` must point
    at an initialized working directory on the runner host. Set `TF_BIN`=tofu
    to drive OpenTofu instead. Provider and backend credentials come from
    that config, not from this pack.
  env:
    - name: TF_DIR
      required: true
      description: >
        Path to an initialized working directory (already `terraform
        init`-ed, with .terraform and a backend configured).
      example: /srv/infra/prod
    - name: TF_BIN
      description: >
        CLI that runs every action. Set it to `tofu` on an OpenTofu host;
        the two are command-compatible for everything this pack calls.
      default: terraform
      example: tofu
    - name: TF_STATE_CANDIDATE_DIR
      description: >
        Optional restricted directory containing candidate .tfstate files for
        metadata inspection and comparison.
      example: /srv/infra/recovery
    - name: TF_PLAN_DIR
      description: >
        Optional restricted directory where CI drops saved plan files for
        plan_file_summary to review.
      example: /srv/infra/plans
  notes:
    - "Provider and backend auth depend entirely on what the config uses: an AWS provider/backend reads AWS_* (or an EC2/role profile), GCP reads GOOGLE_APPLICATION_CREDENTIALS, and so on — allowlist whatever your config needs."
    - "state_list, state_show, show_json, output, state_metadata, and state_compare_metadata read the backend state, so the backend credentials must be reachable; validate, version, state_file_metadata, and plan_file_summary do not."
    - "plan_no_save and plan_summary (both risk medium) call every provider's read APIs (quota usage) and briefly hold the state lock, but never write state or save an applyable plan."
    - "For review, prefer plan_summary over plan_no_save and show_json: it returns addresses, actions, counts, drift, and diagnostics as JSON while emitting no attribute or output values. plan_file_summary returns the same shape for a plan CI already saved, without contacting a provider."
    - "plan_summary needs a workspace that plans ON THIS HOST. What decides that is the HCP Terraform / Terraform Enterprise workspace's execution mode, not the backend: a `cloud` block with execution mode `local` works fine, while `remote` and `agent` stream the run's human output instead of machine-readable messages. The action fails closed there rather than reporting an empty plan; use the hcp-terraform pack for those workspaces. plan_no_save still works everywhere, and the state-reading actions are unaffected."
    - "`state pull` may upgrade state to the local CLI's readable format; terraform_version in projected metadata can therefore reflect the runner's CLI rather than the writer of the remote snapshot."
    - "`TF_BIN` only reaches the action when the runner's `inherit_env` allowlists it, exactly like `TF_DIR` — an unset `TF_BIN` runs `terraform`."
  host_access:
    - actions:
        - tf.version
        - tf.providers
        - tf.state_list
        - tf.state_show
        - tf.show_json
        - tf.output
        - tf.validate
        - tf.plan_file_summary
        - tf.state_metadata
        - tf.state_file_metadata
        - tf.state_compare_metadata
        - tf.plan_no_save
        - tf.plan_summary
      requirement: Read a Terraform working directory owned by another user, run the provider plugins it installed, and lock a local state file while planning.
      recipes:
        - name: Add the Emisar service user to the group that owns the workspace (remote state)
          commands:
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-terraform-host-access.conf"
            - "sudo systemctl daemon-reload"
            - "sudo usermod -aG \"$(stat -c %G /srv/infra/prod)\" emisar"
            - "sudo chmod -R g+rX /srv/infra/prod"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = emisar"
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx \"$(stat -c %G /srv/infra/prod)\""
            - "test -z \"$(sudo -u emisar find /srv/infra/prod ! -readable -print -quit)\""
            - "test -z \"$(sudo -u emisar find /srv/infra/prod -type f -perm -u+x ! -executable -print -quit)\""
          impact: >
            tf.validate, tf.state_show, tf.show_json, tf.plan_file_summary, tf.plan_no_save, and
            tf.plan_summary start the provider plugins under `.terraform/providers` as emisar, and
            both plan actions also run every `data "external"` program the configuration declares.
            Whoever can write this workspace (its owner, a developer, or a CI job) therefore runs
            code as emisar, with this runner's own token and every other grant emisar holds. Every
            process running as emisar can read the configuration, local state, and backend
            settings here, including the secrets they hold, and whatever else that group is
            granted on this host; the recipe itself adds group read, never write. This covers
            every action when state lives in a remote backend, which locks remotely; with a local
            `terraform.tfstate`, tf.plan_no_save and tf.plan_summary need the next recipe. The
            first two commands undo this pack's earlier root override.
            Substitute your own `TF_DIR` for `/srv/infra/prod`, give `TF_PLAN_DIR` and
            `TF_STATE_CANDIDATE_DIR` the same group and `g+rX` mode when you set them, and note
            that an action declaring `execution.user` replaces these inherited supplementary groups.
        - name: Add the Emisar service user to the workspace's group and let it lock local state
          commands:
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-terraform-host-access.conf"
            - "sudo systemctl daemon-reload"
            - "sudo usermod -aG \"$(stat -c %G /srv/infra/prod)\" emisar"
            - "sudo chmod -R g+rX /srv/infra/prod"
            - "sudo chmod g+w /srv/infra/prod /srv/infra/prod/terraform.tfstate"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = emisar"
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx \"$(stat -c %G /srv/infra/prod)\""
            - "test -z \"$(sudo -u emisar find /srv/infra/prod ! -readable -print -quit)\""
            - "test -z \"$(sudo -u emisar find /srv/infra/prod -type f -perm -u+x ! -executable -print -quit)\""
            - "sudo -u emisar test -w /srv/infra/prod"
            - "sudo -u emisar test -w /srv/infra/prod/terraform.tfstate"
          impact: >
            Everything the remote-state recipe grants, plus group write on this directory and its
            `terraform.tfstate`. tf.plan_no_save and tf.plan_summary need both with a local
            backend: Terraform opens the state file read-write to lock it and creates and removes
            `.terraform.tfstate.lock.info` beside it, and plan writes nothing else. Every process
            running as emisar can then rewrite or delete this workspace's state and add or replace
            files in the directory, including `.tf` files the owner's next plan or apply loads
            and runs as that owner.
  verify: tf.version

actions:
  - actions/version.yaml
  - actions/providers.yaml
  - actions/state_list.yaml
  - actions/state_show.yaml
  - actions/show_json.yaml
  - actions/output.yaml
  - actions/validate.yaml
  - actions/plan_no_save.yaml
  - actions/plan_summary.yaml
  - actions/plan_file_summary.yaml
  - actions/state_metadata.yaml
  - actions/state_file_metadata.yaml
  - actions/state_compare_metadata.yaml
