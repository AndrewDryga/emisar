services: [prometheus]
risk_accountability:
  exceptions:
    prom.delete_series: requires_external_service
versions:
  - version: v3.13.1
    digest: "@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
    default: true
env:
  PROM_URL: "http://prometheus:9090"
cases:
  # clean_tombstones needs a tombstone to clean, so the case makes one with
  # delete_series first and then probes that the TSDB accepted the cleanup —
  # the admin API answers 204 with an empty body, so `status` is the evidence.
  - action: prom.clean_tombstones
    args: {target: "http://prometheus:9090"}
    arrange:
      - name: a deletion leaves a tombstone behind
        argv: [/bin/sh, -c, "curl -sSf -X POST 'http://prometheus:9090/api/v1/admin/tsdb/delete_series?match[]=up'"]
        retry_for: 30s
        retry_every: 2s
    probes:
      - name: the admin API reports the tombstones gone
        argv: [/bin/sh, -c, "curl -s -o /dev/null -w %{http_code} -X POST http://prometheus:9090/api/v1/admin/tsdb/clean_tombstones"]
        expect:
          stdout_contains: ["204"]

  - action: prom.alertmanagers
    expect:
      stdout_contains: ['"status":"success"', '"activeAlertmanagers"']
  - action: prom.alerts
    expect:
      stdout_contains: ['"status":"success"', '"alerts"']
  - action: prom.build_info
    expect:
      stdout_contains: ['"status":"success"', '"version"']
  - name: prom.build-info-http-error
    action: prom.build_info
    env:
      PROM_URL: http://prometheus:9090/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: prom.flags
    expect:
      stdout_contains: ['"status":"success"', '"config.file"']
  - action: prom.query_instant
    args: {query: up}
    expect:
      stdout_contains: ['"status":"success"', '"resultType":"vector"', '"job":"prometheus"']
  - action: prom.rules
    expect:
      stdout_contains: ['"status":"success"', '"groups"']
  - action: prom.runtime_info
    expect:
      stdout_contains: ['"status":"success"', '"startTime"']
  - action: prom.targets
    expect:
      stdout_contains: ['"status":"success"', '"job":"prometheus"']
  - action: prom.tsdb_stats
    expect:
      stdout_contains: ['"status":"success"', '"headStats"']
  - action: prom.reload_config
    args: {target: "http://prometheus:9090"}
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$PROM_URL/api/v1/status/config" | grep -q ''"status":"success"'' && echo reloaded']
        expect:
          stdout_contains: [reloaded]
