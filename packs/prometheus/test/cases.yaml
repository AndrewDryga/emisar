services: [prometheus]
versions:
  - version: v3.13.1
    digest: "@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
    default: true
env:
  PROM_URL: "http://prometheus:9090"
cases:
  # clean_tombstones needs a tombstone to clean, so the case makes one with
  # delete_series first and then probes that the TSDB accepted the cleanup —
  # the admin API answers 204 with an empty body, so `status` is the evidence.
  - action: prom.clean_tombstones
    arrange:
      - name: a deletion leaves a tombstone behind
        argv: [/bin/sh, -c, "curl -sSf -X POST 'http://prometheus:9090/api/v1/admin/tsdb/delete_series?match[]=up'"]
        retry_for: 30s
        retry_every: 2s
    probes:
      - name: the admin API reports the tombstones gone
        argv: [/bin/sh, -c, "curl -s -o /dev/null -w %{http_code} -X POST http://prometheus:9090/api/v1/admin/tsdb/clean_tombstones"]
        expect:
          stdout_contains: ["204"]

  - action: prom.alertmanagers
    expect:
      stdout_contains: ['"status":"success"', '"activeAlertmanagers"']
  - action: prom.alerts
    expect:
      stdout_contains: ['"status":"success"', '"alerts"']
  - action: prom.build_info
    expect:
      stdout_contains: ['"status":"success"', '"version"']
  - name: prom.build-info-http-error
    action: prom.build_info
    env:
      PROM_URL: http://prometheus:9090/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: prom.flags
    expect:
      stdout_contains: ['"status":"success"', '"config.file"']
  - action: prom.query_instant
    args: {query: up}
    expect:
      stdout_contains: ['"status":"success"', '"resultType":"vector"', '"job":"prometheus"']
  - name: prom.query-range-normal-incident-window
    action: prom.query_range
    args: {query: up, window: 1h, step: 60s}
    expect:
      stdout_contains: ['"status":"success"', '"resultType":"matrix"', '"job":"prometheus"']
  - name: prom.query-range-allows-seven-days-at-one-minute
    action: prom.query_range
    args: {query: up, window: 7d, step: 60s}
    env:
      PROM_URL: http://cost-canary
    expect:
      stdout_contains: [PACKTEST_PROM_COST_CANARY]
    probes:
      - argv: [cat, /tmp/packtest-prometheus-cost-argv]
        expect:
          stdout_contains: [query=up, start=, end=, step=60s, timeout=30s]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-prometheus-cost-argv]
  - name: prom.query-range-rejects-over-point-limit-before-client
    action: prom.query_range
    args: {query: up, window: 7d, step: 59s}
    env:
      PROM_URL: http://cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [evaluation timestamps, maximum is 10081]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-prometheus-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  - name: prom.query-range-rejects-over-window-limit-before-client
    action: prom.query_range
    args: {query: up, window: 10081m, step: 60s}
    env:
      PROM_URL: http://cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [exceeds the 7d maximum]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-prometheus-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  - action: prom.rules
    expect:
      stdout_contains: ['"status":"success"', '"groups"']
  - action: prom.runtime_info
    expect:
      stdout_contains: ['"status":"success"', '"startTime"']
  - action: prom.targets
    expect:
      stdout_contains: ['"status":"success"', '"job":"prometheus"']
  - action: prom.tsdb_stats
    expect:
      stdout_contains: ['"status":"success"', '"headStats"']
  # The admin API answers 204 with an empty body, so the tombstone the delete
  # left behind is the evidence rather than the action's own output.
  - action: prom.delete_series
    args: {matcher: '{__name__="up"}'}
    probes:
      - name: the tombstoned series stops answering queries
        argv: [/bin/sh, -c, "curl -sSf 'http://prometheus:9090/api/v1/query?query=up'"]
        retry_for: 30s
        retry_every: 2s
        expect:
          stdout_contains: ['"result":[]']

  - action: prom.snapshot
    expect:
      stdout_contains: ['"status":"success"', '"name"']
    probes:
      - name: the snapshot directory exists on the TSDB path
        argv: [/bin/sh, -c, "ls /prometheus/snapshots | grep -q . && echo snapshot-created"]
        retry_for: 30s
        retry_every: 2s
        expect:
          stdout_contains: [snapshot-created]

  - action: prom.reload_config
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$PROM_URL/api/v1/status/config" | grep -q ''"status":"success"'' && echo reloaded']
        expect:
          stdout_contains: [reloaded]
