schema_version: 1
id: prom.clean_tombstones
title: POST /api/v1/admin/tsdb/clean_tombstones
kind: exec
risk: high
description: >
  Reclaim disk space after a delete_series call. Tombstones are
  removed and the data they marked is permanently deleted.
side_effects:
  - Tombstoned series permanently deleted from disk.
  - Disk usage drops.
  - Brief I/O spike.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "curl -q -fsS --globoff --proto =http,https -X POST \"${PROM_URL:-http://127.0.0.1:9090}/api/v1/admin/tsdb/clean_tombstones\""
  timeout: 120s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Reclaim after a delete
    args: {}
