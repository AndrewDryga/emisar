schema_version: 1
id: prom.query_range
title: GET /api/v1/query_range
kind: script
risk: low
description: >
  Run a range PromQL query over a trailing window ending now. The window is
  limited to 7 days and the window-to-step ratio to 10,081 evaluation
  timestamps per returned series. Use for bounded trends and incident graphs.
side_effects:
  - One PromQL range query — can be expensive on large series.
  - Read-only.
args:
  - name: query
    type: string
    required: true
    description: PromQL expression.
    validation:
      pattern: "^.{1,1000}$"
  - name: window
    type: string
    required: false
    default: "1h"
    description: 'Trailing window ending now, up to 7d, e.g. 1h, 6h, 24h, 7d.'
    validation:
      pattern: "^[1-9][0-9]{0,4}[smhd]$"
  - name: step
    type: string
    required: false
    default: "60s"
    description: 'Resolution between points. Window / step may produce at most 10,081 timestamps.'
    validation:
      pattern: "^[1-9][0-9]{0,4}[sm]$"
execution:
  script:
    path: scripts/query_range.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.query }}"
    - "{{ args.window }}"
    - "{{ args.step }}"
  timeout: 120s
output:
  parser: json
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: 1h CPU usage
    args:
      query: "rate(node_cpu_seconds_total[5m])"
      window: "1h"
      step: "60s"
  - title: One week at one-minute resolution
    args:
      query: "sum(rate(http_requests_total[5m]))"
      window: "7d"
      step: "1m"
