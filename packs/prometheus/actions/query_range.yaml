schema_version: 1
id: prom.query_range
title: GET /api/v1/query_range
kind: script
risk: low
description: >
  Run a range PromQL query over a trailing window ending now. The server's
  retention is the only bound on the window; window / step may produce at
  most 10,081 evaluation timestamps per series, just under the 11,000
  Prometheus itself refuses. Use for bounded trends and incident graphs.
side_effects:
  - One PromQL range query — can be expensive on large series.
  - Read-only.
args:
  - name: query
    type: string
    required: true
    description: PromQL expression.
    validation:
      pattern: "^.{1,1000}$"
  - name: window
    type: string
    required: false
    default: "1h"
    description: "Trailing window ending now, e.g. 1h, 24h, 7d, 30d; bounded by the server's retention."
    validation:
      pattern: "^[1-9][0-9]{0,4}[smhd]$"
  - name: step
    type: string
    required: false
    default: "60s"
    description: 'Resolution between points, e.g. 60s, 5m, 1h, 1d. Window / step may produce at most 10,081 timestamps.'
    validation:
      pattern: "^[1-9][0-9]{0,4}[smhd]$"
execution:
  script:
    path: scripts/query_range.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.query }}"
    - "{{ args.window }}"
    - "{{ args.step }}"
  timeout: 2m
output:
  parser: json
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: 1h CPU usage
    args:
      query: "rate(node_cpu_seconds_total[5m])"
      window: "1h"
      step: "60s"
  - title: One week at one-minute resolution
    args:
      query: "sum(rate(http_requests_total[5m]))"
      window: "7d"
      step: "1m"
  - title: Thirty days at hourly resolution
    args:
      query: "sum(rate(http_requests_total[5m]))"
      window: "30d"
      step: "1h"
