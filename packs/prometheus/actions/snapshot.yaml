schema_version: 1
id: prom.snapshot
title: POST /api/v1/admin/tsdb/snapshot
kind: exec
risk: medium
description: >
  Trigger an on-disk snapshot of the TSDB into data/snapshots/.
  Requires --web.enable-admin-api. Used before risky upgrades or
  for offline diff. Uses hardlinks initially — no extra disk until
  blocks rotate.
side_effects:
  - New snapshot directory under data/snapshots/.
  - Brief I/O spike.
  - Disk usage grows as blocks change over time.
args:
  - name: skip_head
    type: boolean
    required: false
    default: false
    description: Skip the in-memory head block (faster, less complete).
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "curl -q -fsS --globoff --proto =http,https -X POST \"${PROM_URL:-http://127.0.0.1:9090}/api/v1/admin/tsdb/snapshot?skip_head={{ args.skip_head }}\""
  timeout: 60s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Full snapshot
    args: {}
