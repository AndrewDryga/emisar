services: [gcp-api]
versions:
  - version: 587.0.0-slim
    digest: "@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f"
    default: true
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_DNS: http://gcp-api:8080/dns/v1/
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-access-token-27be
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-dns-secret-b521]
    stderr_not_contains: [packtest-canary-gcp-dns-secret-b521]
cases:
  - action: gcp.dns_record_sets
    env: &dns-rest
      CLOUDSDK_API_ENDPOINT_OVERRIDES_DNS: https://gcp-api:8443/dns/v1/
      CURL_CA_BUNDLE: /packs/gcp-dns/test/fixtures/server.crt
    args: {project: example-prod, zone: harness-zone, page_size: 2}
    expect:
      json:
        /record_sets/0/name: api.example.test.
        /record_sets/0/type: A
        /record_sets/0/ttl: 300
        /record_sets/0/rrdatas/0: 203.0.113.30
        /record_sets/1/type: AAAA
        /more_available: true
        /next_page_cursor: 'dns:2&value=+/"λ'
        /cursor_omitted: false
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS http://gcp-api:8080/probe/state | jq -e ''.requests | length == 1 and .[0].billing_project == null and .[0].query.maxResults == ["2"]''']
        expect: {stdout_contains: ["true"]}
  - name: gcp.dns_record_sets-next-page
    action: gcp.dns_record_sets
    env:
      <<: *dns-rest
    args: {"project":"example-prod","zone":"harness-zone","page_size":2,"page_cursor":"dns:2&value=+/\"λ"}
    expect: {"json":{"/record_sets/0/name":"txt.example.test.","/record_sets/0/rrdatas":["\"verification=value\"","\"quoted \\\"value\\\"\""],"/record_sets/1/name":"policy.example.test.","/record_sets/1/rrdatas":[],"/record_sets/1/routing_policy":true,"/next_page_cursor":"dns:4&value=+/\"λ"}}
    probes:
      - name: Verify the exact provider request
        argv: ["/bin/sh","-c","curl -fsS http://gcp-api:8080/probe/state | jq -e '.requests | length == 1 and .[0].project == \"example-prod\" and .[0].zone == \"harness-zone\" and .[0].query.pageToken == [\"dns:2&value=+/\\\"λ\"] and .[0].query.maxResults == [\"2\"]'"]
        expect: {stdout_contains: ["true"]}
  - name: gcp.dns_record_sets-final-page
    action: gcp.dns_record_sets
    env:
      <<: *dns-rest
    args: {"project":"example-prod","zone":"harness-zone","page_size":2,"page_cursor":"dns:4&value=+/\"λ"}
    expect: {"json":{"/record_sets/0/rrdatas":["10 mail.example.test.","20 backup.example.test."],"/more_available":false,"/next_page_cursor":null}}
  - name: gcp.dns_record_sets-empty
    action: gcp.dns_record_sets
    env:
      <<: *dns-rest
    args: {"project":"empty-prod","zone":"harness-zone","page_size":2}
    expect: {"json":{"/record_sets":[],"/more_available":false,"/cursor_omitted":false,"/next_page_cursor":null}}
  - name: gcp.dns_record_sets-empty-with-continuation
