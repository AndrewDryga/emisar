schema_version: 1
id: gcp.dns_record_lookup
title: gcloud dns record-sets list --name --type
kind: script
risk: low
description: Look up one exact DNS name and record type in a managed zone.
side_effects:
  - Read-only Cloud DNS API call capped at 100 matching record sets.
  - Returns record data, including TXT values when that type is requested.
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: zone
    type: string
    required: true
    description: Managed-zone name.
    validation: {pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$", max_length: 63}
  - name: name
    type: string
    required: true
    description: Fully qualified DNS name ending with a dot.
    validation: {pattern: "^[A-Za-z0-9_*](?:[A-Za-z0-9_.*-]{0,251}[A-Za-z0-9_*-])?\\.$", max_length: 253}
  - name: type
    type: string
    required: true
    description: DNS record type.
    validation:
      enum: [A, AAAA, CAA, CNAME, DS, IPSECKEY, MX, NAPTR, NS, PTR, SOA, SPF, SRV, SSHFP, TLSA, TXT]
execution:
  script: {path: scripts/dns.sh, interpreter: /bin/sh}
  argv: [record-lookup, "{{ args.project }}", "{{ args.zone }}", "{{ args.name }}", "{{ args.type }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 16384
examples:
  - title: Application address record
    args: {project: example-prod, zone: app, name: api.example.test., type: A}
