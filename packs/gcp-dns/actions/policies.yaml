schema_version: 1
id: gcp.dns_policies
title: gcloud dns policies list
kind: script
risk: low
description: List bounded Cloud DNS server policies, networks, forwarding targets, and logging state.
side_effects: ["Read-only Cloud DNS API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum policies to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/dns.sh, interpreter: /bin/sh}
  argv: [policies, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Project DNS policies
    args: {project: example-prod}
