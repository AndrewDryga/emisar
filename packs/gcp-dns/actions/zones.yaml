schema_version: 1
id: gcp.dns_zones
title: gcloud dns managed-zones list
kind: script
risk: low
description: List bounded managed-zone visibility, DNSSEC, nameservers, and forwarding or peering topology.
side_effects: ["Read-only Cloud DNS API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum zones to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/dns.sh, interpreter: /bin/sh}
  argv: [zones, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 16384
examples:
  - title: Project managed zones
    args: {project: example-prod}
