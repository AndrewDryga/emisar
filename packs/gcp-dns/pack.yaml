schema_version: 1

id: gcp-dns
name: Google Cloud DNS diagnostics
version: 0.1.0
description: >
  Read-only Cloud DNS diagnostics for managed zones, DNSSEC, exact record
  lookups, server policies, response policies, and response-policy rules.
  Zone-wide record dumps are intentionally excluded.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os: [linux]
  binaries: [gcloud, jq]

setup:
  summary: >
    Drives gcloud and projects Cloud DNS API responses locally before they
    leave the runner. Authenticate gcloud before loading the pack.
  env:
    - name: CLOUDSDK_CONFIG
      description: Optional gcloud configuration directory.
      example: /etc/emisar/gcloud
    - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
      description: Optional credential file that overrides the active gcloud account.
      example: /etc/emisar/gcp-reader.json
  notes:
    - "The principal needs roles/dns.reader or equivalent read permissions."
    - "Exact record and response-policy-rule actions return DNS record data, including TXT values when explicitly requested."
    - "Projected actions use mode-0600 temporary response files and remove them before exit."
    - "This remote-target pack declares no host detection signal and is never auto-suggested merely because gcloud is installed."
  verify: gcp.dns_zones

actions:
  - actions/zones.yaml
  - actions/zone_describe.yaml
  - actions/record_lookup.yaml
  - actions/policies.yaml
  - actions/response_policies.yaml
  - actions/response_policy_rules.yaml
