schema_version: 1
id: rds.pending_maintenance
title: aws rds describe-pending-maintenance-actions
kind: script
risk: low
description: List a bounded page of pending RDS maintenance with automatic, forced, and current apply dates.
side_effects: ["Read-only API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum resources to return.
    validation: {min: 1, max: 1000}
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque AWS CLI pagination cursor from a previous result.
    validation: {pattern: "^[A-Za-z0-9+/=_-]*$", max_length: 4096}
execution:
  script: {path: scripts/rds_read.sh, interpreter: /bin/sh}
  argv: [pending-maintenance, "{{ args.limit }}", "{{ args.page_cursor }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Pending maintenance
    args: {}
