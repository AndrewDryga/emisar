schema_version: 1
id: rds.recent_events
title: aws rds describe-events
kind: script
risk: low
description: List a bounded page of recent RDS events across instances, clusters, snapshots, and parameter groups.
side_effects: ["Read-only API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: duration_minutes
    type: integer
    required: false
    default: 60
    description: Lookback window in minutes.
    validation: {min: 1, max: 1440}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum events to return.
    validation: {min: 1, max: 1000}
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque AWS CLI pagination cursor from a previous result.
    validation: {pattern: "^[A-Za-z0-9+/=_-]*$", max_length: 4096}
execution:
  script: {path: scripts/rds_read.sh, interpreter: /bin/sh}
  argv: [events, "{{ args.duration_minutes }}", "{{ args.limit }}", "{{ args.page_cursor }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Last two hours
    args: {duration_minutes: 120}
