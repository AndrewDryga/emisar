schema_version: 1
id: rds.list_clusters
title: aws rds describe-db-clusters
kind: script
risk: low
description: List a bounded page of Aurora and Multi-AZ clusters with members, endpoints, backup, network, and encryption state.
side_effects: ["Read-only API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum clusters to return.
    validation: {min: 1, max: 1000}
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque AWS CLI pagination cursor from a previous result.
    validation: {pattern: "^[A-Za-z0-9+/=_-]*$", max_length: 4096}
execution:
  script: {path: scripts/rds_read.sh, interpreter: /bin/sh}
  argv: [clusters, "{{ args.limit }}", "{{ args.page_cursor }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Aurora clusters
    args: {}
