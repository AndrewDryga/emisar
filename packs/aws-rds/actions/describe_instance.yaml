schema_version: 1
id: rds.describe_instance
title: aws rds describe-db-instances --db-instance-identifier
kind: script
risk: low
description: Show one RDS instance's availability, network, storage, backup, maintenance, and encryption state.
side_effects: ["One read-only API call.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: instance
    type: string
    required: true
    description: Instance identifier.
    validation:
      pattern: "^[a-zA-Z][a-zA-Z0-9\\-]{0,62}$"
execution:
  script: {path: scripts/rds_read.sh, interpreter: /bin/sh}
  argv: [instance, "{{ args.instance }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: One instance
    args:
      instance: "prod-postgres-1"
