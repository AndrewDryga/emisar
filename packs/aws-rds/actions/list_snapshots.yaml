schema_version: 1
id: rds.list_snapshots
title: aws rds describe-db-snapshots
kind: script
risk: low
description: List a bounded page of RDS instance snapshots with source, status, engine, capacity, and encryption state.
side_effects: ["Read-only API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum snapshots to return.
    validation: {min: 1, max: 1000}
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque AWS CLI pagination cursor from a previous result.
    validation: {pattern: "^[A-Za-z0-9+/=_-]*$", max_length: 4096}
execution:
  script: {path: scripts/rds_read.sh, interpreter: /bin/sh}
  argv: [snapshots, "{{ args.limit }}", "{{ args.page_cursor }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Snapshots
    args: {}
