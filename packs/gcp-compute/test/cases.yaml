services: [gcp-api]
versions:
  - version: 587.0.0-slim
    digest: "@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f"
    default: true
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_COMPUTE: http://gcp-api:8080/compute/v1/
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-compute-access-token-011a
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-compute-secret-a951]
    stderr_not_contains: [packtest-canary-gcp-compute-secret-a951]
cases:
  - action: gcp.instances
    env: &compute-rest
      CLOUDSDK_API_ENDPOINT_OVERRIDES_COMPUTE: https://gcp-api:8443/compute/v1/
      CURL_CA_BUNDLE: /packs/gcp-compute/test/fixtures/server.crt
    args: {project: example-prod, page_size: 2}
    expect:
      json:
        /instances/0/name: harness-vm
        /instances/0/zone: us-central1-a
        /instances/0/status: RUNNING
        /instances/0/machine_type: e2-small
        /instances/0/internal_ips/0: 10.20.0.10
        /instances/0/internal_ips: [10.20.0.10, 10.21.0.10, "fd20::10"]
        /instances/0/external_ips: [203.0.113.10, "2001:db8::10"]
        /instances/0/labels/cluster: harness
        /instances/0/labels/password: "[REDACTED]"
        /instances/1/name: unmanaged-vm
        /instances/1/status: TERMINATED
        /more_available: true
        /next_page_cursor: 'compute:2&value=+/"λ'
        /cursor_omitted: false
      stdout_not_contains: [metadata, description, disks, serviceAccounts, unknown, packtest-canary-gcp-compute-secret-a951]
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS http://gcp-api:8080/probe/state | jq -e ''.requests | length == 1 and .[0].billing_project == null and .[0].query.maxResults == ["2"] and .[0].query.returnPartialSuccess == ["true"]''']
        expect: {stdout_contains: ["true"]}
  - name: gcp.instances-next-page
    action: gcp.instances
    env:
      <<: *compute-rest
    args: {"project":"example-prod","page_size":2,"page_cursor":"compute:2&value=+/\"λ"}
    expect: {"json":{"/instances/0/name":"third-vm","/instances/0/zone":"europe-west1-b","/instances/0/labels":{},"/instances/0/internal_ips":[],"/more_available":false,"/next_page_cursor":null}}
    probes:
      - name: Verify the exact provider request
        argv: ["/bin/sh","-c","curl -fsS http://gcp-api:8080/probe/state | jq -e '.requests | length == 1 and .[0].project == \"example-prod\" and .[0].query.pageToken == [\"compute:2&value=+/\\\"λ\"] and .[0].query.returnPartialSuccess == [\"true\"]'"]
        expect: {stdout_contains: ["true"]}
