schema_version: 1
id: gcp.operation_status
title: gcloud compute operations describe
kind: script
risk: low
description: >
  Show the status, progress, timing, target, warnings, and errors for one
  global, regional, or zonal Compute Engine operation.
side_effects:
  - One read-only Compute Engine API call.
  - Returns operation status only.
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: operation
    type: string
    required: true
    description: Compute Engine operation name.
    validation:
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$"
  - name: scope
    type: string
    required: true
    description: Operation scope.
    validation:
      enum: [global, region, zone]
  - name: location
    type: string
    required: false
    default: ""
    description: Region or zone for a scoped operation; empty for global.
    validation:
      pattern: "^([a-z0-9][a-z0-9-]{0,62})?$"
execution:
  script:
    path: scripts/compute_scope.sh
    interpreter: /bin/sh
  argv:
    - operation-status
    - "{{ args.operation }}"
    - "{{ args.scope }}"
    - "{{ args.location }}"
    - "{{ args.project }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Check a zonal operation
    args:
      project: example-prod
      operation: operation-1712345678901-abcdef
      scope: zone
      location: us-central1-a
