schema_version: 1
id: gcp.mig_instances
title: gcloud compute instance-groups managed list-instances
kind: script
risk: low
description: >
  List up to 500 instances in one zonal or regional managed instance group,
  including lifecycle state, current action, version, and last-attempt errors.
side_effects:
  - Read-only Compute Engine API pagination.
  - Returned managed-instance records are capped at 500.
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: group
    type: string
    required: true
    description: Managed instance group name.
    validation:
      pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  - name: scope
    type: string
    required: true
    description: Whether the managed instance group is zonal or regional.
    validation:
      enum: [zone, region]
  - name: location
    type: string
    required: true
    description: Zone or region selected by scope.
    validation:
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
execution:
  script:
    path: scripts/compute_scope.sh
    interpreter: /bin/sh
  argv:
    - mig-instances
    - "{{ args.group }}"
    - "{{ args.scope }}"
    - "{{ args.location }}"
    - "{{ args.project }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: List instances in a regional MIG
    args:
      project: example-prod
      group: api
      scope: region
      location: us-central1
