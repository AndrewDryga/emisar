services:
- nats-1
- nats-2
- nats-3
- nats-no-js
workers: 2
versions:
- version: 2.14.8-alpine
  digest: '@sha256:fce5fbf8b29ee0baa790e67bcd4abafebdd97363aa025f7d46a17489df002e30'
  default: true
- version: 2.15.2-alpine
  digest: '@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f'
secret_env:
- NATS_READ_PASSWORD
- NATS_ADMIN_PASSWORD
inherit_env:
- NATS_URL
- NATS_CA
- NATS_READ_USER
- NATS_READ_PASSWORD
- NATS_ADMIN_USER
- NATS_ADMIN_PASSWORD
- PYTHONPATH
env:
  NATS_URL: tls://nats-1:4222
  NATS_CA: /packs/nats/test/fixtures/ca.pem
  NATS_READ_USER: emisar_read
  NATS_READ_PASSWORD: packtest-canary-nats-read-password-2b67
  NATS_ADMIN_USER: emisar_admin
  NATS_ADMIN_PASSWORD: packtest-canary-nats-admin-password-2b67
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains:
    - packtest-canary-nats-read-password-2b67
    - packtest-canary-nats-admin-password-2b67
    - packtest-canary-nats-seed-password-2b67
    - packtest-canary-nats-private-metadata-5172
    - packtest-canary-nats-private-description-44a
    - packtest-canary-nats-message-payload-896f
    - packtest-canary-nats-wrong-password-91f7
    - packtest-canary-nats-denied-password-e499
    stderr_not_contains:
    - packtest-canary-nats-read-password-2b67
    - packtest-canary-nats-admin-password-2b67
    - packtest-canary-nats-private-metadata-5172
    - packtest-canary-nats-private-description-44a
    - packtest-canary-nats-message-payload-896f
    - packtest-canary-nats-wrong-password-91f7
    - packtest-canary-nats-denied-password-e499
