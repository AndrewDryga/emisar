  - argv:
    - python3
    - /packs/nats/test/fixture.py
    - seed
    - default
- name: nats.create_stream
  action: nats.create_stream
  args:
    stream: NEW_STREAM
    subject: new.events.>
    storage: file
    retention: limits
    max_bytes: '4096'
    max_messages: '10'
    replicas: 3
    max_age_seconds: 3600
  expect:
    json:
      /name: NEW_STREAM
      /max_bytes: '4096'
      /max_age_ns: '3600000000000'
  arrange:
  - argv:
    - python3
    - /packs/nats/test/fixture.py
    - seed
    - default
  probes:
  - argv:
    - python3
    - /packs/nats/test/fixture.py
    - probe
    - stream
    - NEW_STREAM
    expect:
      json:
        /name: NEW_STREAM
        /messages: '0'
        /max_bytes: '4096'
        /max_messages: '10'
        /max_age_ns: '3600000000000'
- name: nats.create_consumer
  action: nats.create_consumer
  args:
    stream: EMISAR_TEST
    consumer: new_worker
    filter_subject: emisar.test
    max_ack_pending: '42'
    max_deliver: '5'
