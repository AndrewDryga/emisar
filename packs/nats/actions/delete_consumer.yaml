schema_version: 1
id: nats.delete_consumer
title: Delete a JetStream consumer
kind: script
risk: critical
description: Delete one consumer and its delivery/ack state. On interest-retention streams, remove
  messages for which that consumer was the final interest; deleting the last consumer purges all stored
  messages in the stream. Other retention policies retain messages according to their limits, and
  recreation may redeliver them. Terraform-managed topology can be recreated by the initializer.
side_effects:
- One governed JetStream change; limit updates first read the current configuration.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
- name: consumer
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact consumer name with the same subject-safe 255-byte syntax as streams.
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - delete_consumer
  - '{{ args.stream }}'
  - '{{ args.consumer }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - accepted
    - stream
    - consumer
    properties:
      accepted:
        const: true
      stream:
        type: string
        maxLength: 255
      consumer:
        type: string
        maxLength: 255
examples:
- title: Delete a JetStream consumer
  args:
    stream: ORDERS
    consumer: worker
