schema_version: 1
id: nats.create_stream
title: Create a bounded JetStream stream
kind: script
risk: high
description: Create one stream with an explicit subject, storage, retention, capacities and replica
  count. No mirrors, sources, arbitrary metadata or raw configuration are accepted. This creates topology
  and may begin retaining matching application publications; no message payload is returned. Terraform-managed
  topology can be reconciled by its initializer.
side_effects:
- One governed JetStream change; limit updates first read the current configuration.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
- name: subject
  type: string
  required: true
  validation:
    pattern: ^(?:>|(?:[A-Za-z0-9_-]{1,64}|\*)(?:\.(?:[A-Za-z0-9_-]{1,64}|\*)){0,15}(?:\.>)?)$
    max_length: 255
  description: One bounded stream subject, with whole-token * and terminal > wildcards allowed.
- name: storage
  type: string
  required: true
  description: Stream storage backend.
  validation:
    enum:
    - file
    - memory
- name: retention
  type: string
  required: true
  description: JetStream stream retention policy.
  validation:
    enum:
    - limits
    - workqueue
    - interest
- name: max_bytes
  type: string
  required: true
  description: Positive byte capacity as an exact decimal int64 string; account quotas still apply.
  validation:
    pattern: ^[1-9][0-9]{0,18}$
    max_length: 19
- name: max_messages
  type: string
  required: true
  description: Positive message-count capacity as an exact decimal int64 string.
  validation:
    pattern: ^[1-9][0-9]{0,18}$
    max_length: 19
- name: replicas
  type: integer
  required: true
  description: Explicit replica count; JetStream supports one to five and requires enough servers.
  validation:
    min: 1
    max: 5
- name: max_age_seconds
  type: integer
  required: false
  default: 0
  description: Message expiry in seconds; zero disables expiry. The maximum mirrors signed-int64 nanoseconds.
  validation:
    min: 0
    max: 9223372036
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - create_stream
  - '{{ args.stream }}'
  - '{{ args.subject }}'
  - '{{ args.storage }}'
  - '{{ args.retention }}'
  - '{{ args.max_bytes }}'
  - '{{ args.max_messages }}'
  - '{{ args.replicas }}'
  - '{{ args.max_age_seconds }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - name
    - created
    - storage
    - retention
    - replicas
    - subjects
    - subjects_omitted
    - max_messages
    - max_bytes
    - max_age_ns
    - messages
    - bytes
    - first_sequence
    - last_sequence
    - consumer_count
    - cluster
    properties:
      name:
        type: string
        maxLength: 255
      created:
        type: string
        maxLength: 40
      storage:
        type: string
        maxLength: 16
      retention:
        type: string
        maxLength: 16
      replicas:
        type: integer
        minimum: 1
        maximum: 5
      subjects:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required:
          - value
          - truncated
          properties:
            value:
              type: string
              maxLength: 96
            truncated:
              type: boolean
      subjects_omitted:
        type: integer
        minimum: 0
      max_messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_age_ns:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      first_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      last_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      consumer_count:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      cluster:
        type: object
        additionalProperties: false
        required:
        - name
        - leader
        - leader_truncated
        - replicas
        - replicas_omitted
        properties:
          name:
            type: string
            maxLength: 48
          leader:
            type: string
            maxLength: 48
          leader_truncated:
            type: boolean
          replicas:
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - name_truncated
              - current
              - offline
              - lag
              - active_ns
              properties:
                name:
                  type: string
                  maxLength: 48
                name_truncated:
                  type: boolean
                current:
                  type: boolean
                offline:
                  type: boolean
                lag:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
                active_ns:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
          replicas_omitted:
            type: integer
            minimum: 0
examples:
- title: Create a bounded JetStream stream
  args:
    stream: ORDERS
    subject: orders.>
    storage: file
    retention: limits
    max_bytes: '1073741824'
    max_messages: '1000000'
    replicas: 3
