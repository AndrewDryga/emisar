schema_version: 1
id: nats.stream_info
title: Show a JetStream stream
kind: script
risk: low
description: Show one stream's selected storage/retention limits, counts, sequence range, subject
  summary and leader/replica state. Omit descriptions, metadata and message content. Return exact
  decimal strings for 64-bit values; subject and replica displays are bounded with explicit truncation
  or omission flags.
side_effects:
- One read-only JetStream metadata request.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - stream_info
  - '{{ args.stream }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - name
    - created
    - storage
    - retention
    - replicas
    - subjects
    - subjects_omitted
    - max_messages
    - max_bytes
    - max_age_ns
    - messages
    - bytes
    - first_sequence
    - last_sequence
    - consumer_count
    - cluster
    properties:
      name:
        type: string
        maxLength: 255
      created:
        type: string
        maxLength: 40
      storage:
        type: string
        maxLength: 16
      retention:
        type: string
        maxLength: 16
      replicas:
        type: integer
        minimum: 1
        maximum: 5
      subjects:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required:
          - value
          - truncated
          properties:
            value:
              type: string
              maxLength: 96
            truncated:
              type: boolean
      subjects_omitted:
        type: integer
        minimum: 0
      max_messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_age_ns:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      first_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      last_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      consumer_count:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      cluster:
        type: object
        additionalProperties: false
        required:
        - name
        - leader
        - leader_truncated
        - replicas
        - replicas_omitted
        properties:
          name:
            type: string
            maxLength: 48
          leader:
            type: string
            maxLength: 48
          leader_truncated:
            type: boolean
          replicas:
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - name_truncated
              - current
              - offline
              - lag
              - active_ns
              properties:
                name:
                  type: string
                  maxLength: 48
                name_truncated:
                  type: boolean
                current:
                  type: boolean
                offline:
                  type: boolean
                lag:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
                active_ns:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
          replicas_omitted:
            type: integer
            minimum: 0
examples:
- title: Show a JetStream stream
  args:
    stream: ORDERS
