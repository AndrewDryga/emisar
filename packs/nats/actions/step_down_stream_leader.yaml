schema_version: 1
id: nats.step_down_stream_leader
title: Step down a JetStream stream leader
kind: script
risk: high
description: Request a replicated stream leader step-down. Briefly interrupt delivery while the cluster
  elects a replacement. Return an acceptance acknowledgement; stream_info shows the resulting leader
  and replica catch-up.
side_effects:
- One governed JetStream change; limit updates first read the current configuration.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - step_down_stream_leader
  - '{{ args.stream }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - accepted
    - stream
    properties:
      accepted:
        const: true
      stream:
        type: string
        maxLength: 255
examples:
- title: Step down a JetStream stream leader
  args:
    stream: ORDERS
