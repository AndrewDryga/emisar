schema_version: 1
id: nats.consumer_names
title: List JetStream consumer names
kind: script
risk: low
description: List up to ten exact consumer names for one stream from one native names page. Return
  total, offset and next_offset advanced only by emitted names; no message delivery or acknowledgement
  occurs.
side_effects:
- One read-only JetStream metadata request.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
- name: offset
  type: integer
  required: false
  default: 0
  description: Server offset, up to the largest exact JSON integer; use next_offset from the prior
    page.
  validation:
    min: 0
    max: 9007199254740991
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - consumer_names
  - '{{ args.stream }}'
  - '{{ args.offset }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - names
    - offset
    - total
    - next_offset
    - omitted_in_response
    properties:
      names:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 255
      offset:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      total:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      next_offset:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 9007199254740991
      omitted_in_response:
        type: integer
        minimum: 0
examples:
- title: List JetStream consumer names
  args:
    stream: ORDERS
