schema_version: 1
id: nats.update_stream_limits
title: Update JetStream stream retention limits
kind: script
risk: critical
description: Update only selected stream byte, message and expiry limits after reading its current
  configuration. Preserve all other fields and integer precision privately; never return the complete
  configuration. Lowering limits can immediately discard stored messages. At least one change is required.
  The API writes the full configuration without a compare-and-swap guard, so concurrent edits can
  race. Terraform-managed limits can be reconciled by the initializer.
side_effects:
- One governed JetStream change; limit updates first read the current configuration.
args:
- name: stream
  type: string
  required: true
  validation:
    pattern: ^[A-Za-z0-9_-]{1,255}$
    max_length: 255
  description: Exact stream name; up to the server's 255-byte name limit, using ASCII letters, digits,
    underscores or hyphens.
- name: new_max_bytes
  type: string
  required: false
  default: ''
  description: Optional exact decimal int64; empty preserves the current value, -1 selects unlimited,
    and positive values set the limit.
  validation:
    pattern: ^(?:-1|[1-9][0-9]{0,18})?$
    max_length: 19
- name: new_max_messages
  type: string
  required: false
  default: ''
  description: Optional exact decimal int64; empty preserves the current value, -1 selects unlimited,
    and positive values set the limit.
  validation:
    pattern: ^(?:-1|[1-9][0-9]{0,18})?$
    max_length: 19
- name: new_max_age_seconds
  type: integer
  required: false
  default: -1
  description: -1 preserves expiry, zero disables it, and a positive number sets seconds within signed-int64
    nanoseconds.
  validation:
    min: -1
    max: 9223372036
execution:
  script:
    path: scripts/nats.sh
    interpreter: /bin/sh
  argv:
  - update_stream_limits
  - '{{ args.stream }}'
  - '{{ args.new_max_bytes }}'
  - '{{ args.new_max_messages }}'
  - '{{ args.new_max_age_seconds }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - name
    - created
    - storage
    - retention
    - replicas
    - subjects
    - subjects_omitted
    - max_messages
    - max_bytes
    - max_age_ns
    - messages
    - bytes
    - first_sequence
    - last_sequence
    - consumer_count
    - cluster
    properties:
      name:
        type: string
        maxLength: 255
      created:
        type: string
        maxLength: 40
      storage:
        type: string
        maxLength: 16
      retention:
        type: string
        maxLength: 16
      replicas:
        type: integer
        minimum: 1
        maximum: 5
      subjects:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required:
          - value
          - truncated
          properties:
            value:
              type: string
              maxLength: 96
            truncated:
              type: boolean
      subjects_omitted:
        type: integer
        minimum: 0
      max_messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      max_age_ns:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      messages:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      bytes:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      first_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      last_sequence:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      consumer_count:
        type: string
        maxLength: 20
        pattern: ^-?[0-9]{1,20}$
      cluster:
        type: object
        additionalProperties: false
        required:
        - name
        - leader
        - leader_truncated
        - replicas
        - replicas_omitted
        properties:
          name:
            type: string
            maxLength: 48
          leader:
            type: string
            maxLength: 48
          leader_truncated:
            type: boolean
          replicas:
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - name_truncated
              - current
              - offline
              - lag
              - active_ns
              properties:
                name:
                  type: string
                  maxLength: 48
                name_truncated:
                  type: boolean
                current:
                  type: boolean
                offline:
                  type: boolean
                lag:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
                active_ns:
                  type: string
                  maxLength: 20
                  pattern: ^-?[0-9]{1,20}$
          replicas_omitted:
            type: integer
            minimum: 0
examples:
- title: Update JetStream stream retention limits
  args:
    stream: ORDERS
    new_max_bytes: '2147483648'
