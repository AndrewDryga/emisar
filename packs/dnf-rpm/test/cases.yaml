# These write the RPM database of whatever root filesystem they run in, which
# in a disposable RPM-family container is the thing under test. Declared
# because that lane is not built, not because a host is required.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    rpm.dnf_autoremove: requires_privileged_host
    rpm.dnf_install: requires_privileged_host
    rpm.dnf_remove: requires_privileged_host
    rpm.dnf_upgrade: requires_privileged_host
