schema_version: 1
id: rpm.dnf_reinstall
title: dnf reinstall -y <package>
kind: exec
risk: high
description: >
  Reinstall one package to fix a corrupted on-disk state (missing
  files, bad checksums). Same version, same config. Runs the
  package's install scriptlets, which can restart its service, the
  same consequence that makes install, upgrade, and remove high risk.
side_effects:
  - Package files restored from the repo.
  - Marked config files (rpmnoreplace) preserved.
  - Package scriptlets run as root and may restart the package's service.
args:
  - name: package
    type: string
    required: true
    description: Package name.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_+.\\-]{0,127}$"
execution:
  command:
    binary: dnf
    argv: ["reinstall", "-y", "{{ args.package }}"]
  timeout: 10m
  cancel_grace: 60s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 16384
examples:
  - title: Repair a package
    args:
      package: "httpd"
