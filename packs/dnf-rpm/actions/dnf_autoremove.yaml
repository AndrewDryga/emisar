schema_version: 1
id: rpm.dnf_autoremove
title: dnf autoremove -y
kind: exec
risk: high
description: >
  Remove packages installed as dependencies that are no longer
  required by any installed package. It removes packages, not cached
  files under /var/cache. The action output lists each package
  removed, and `rpm.dnf_history` records the transaction afterwards.
side_effects:
  - Multiple packages removed.
  - Disk reclaimed.
  - Dependency mistakes can be ugly — review the action output.
args: []
execution:
  command:
    binary: dnf
    argv: ["autoremove", "-y"]
  timeout: 10m
  cancel_grace: 60s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 16384
examples:
  - title: Reclaim disk
    args: {}
