schema_version: 1
id: gcp.routers
title: gcloud compute routers list
kind: script
risk: low
description: List bounded Cloud Routers with BGP and Cloud NAT attachment summaries.
side_effects: ["Read-only Compute Engine API pagination."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum routers to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/networking.sh, interpreter: /bin/sh}
  argv: [routers, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 2097152
  max_stderr_bytes: 16384
examples:
  - title: Project Cloud Routers
    args: {project: example-prod}
