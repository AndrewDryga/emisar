schema_version: 1
id: gcp.router_status
title: gcloud compute routers get-status
kind: script
risk: low
description: Show BGP peer state and dynamic best routes for one Cloud Router.
side_effects: ["One read-only Compute Engine API call."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: router
    type: string
    required: true
    description: Cloud Router name.
    validation: {pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$", max_length: 63}
  - name: region
    type: string
    required: true
    description: Router region.
    validation: {pattern: "^[a-z0-9][a-z0-9-]{0,62}$", max_length: 63}
execution:
  script: {path: scripts/networking.sh, interpreter: /bin/sh}
  argv: [router-status, "{{ args.project }}", "{{ args.router }}", "{{ args.region }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: Router BGP status
    args: {project: example-prod, router: edge, region: us-central1}
