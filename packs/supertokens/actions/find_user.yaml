schema_version: 1
id: supertokens.find_user
title: Find users by email, phone or social login
kind: script
risk: medium
description: >
  Find users by one exact account detail with GET /users/by-accountinfo: an
  email address, a phone number, or a third-party provider id with the
  user's id at that provider. Returns each match's email addresses and phone
  numbers, login methods and verification state. The core lower-cases emails
  and normalises phone numbers before matching. No match is a count of 0.
side_effects:
  - One read-only HTTP GET to the core's /users/by-accountinfo endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - find user by email
  - user cannot log in
  - duplicate account
args:
  - name: email
    type: string
    required: false
    default: ""
    sensitive: true
    description: An exact email address. Set exactly one of email, phone, or the third-party pair.
    validation:
      pattern: "^([^@\\s\"\\\\]{1,64}@[^@\\s\"\\\\]{1,255})?$"
      max_length: 320
  - name: phone
    type: string
    required: false
    default: ""
    sensitive: true
    description: An exact phone number, preferably in E.164 form.
    validation:
      pattern: "^(\\+?[0-9 ().-]{4,32})?$"
      max_length: 33
  - name: third_party_id
    type: string
    required: false
    default: ""
    description: A third-party provider id such as google or github; set with third_party_user_id.
    validation:
      pattern: "^([A-Za-z0-9._-]{1,28})?$"
      max_length: 28
  - name: third_party_user_id
    type: string
    required: false
    default: ""
    sensitive: true
    description: The user's id at that provider.
    validation:
      pattern: "^([!#-\\[\\]-~]{1,256})?$"
      max_length: 256
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - find-user
  env:
    ARG_EMAIL: "{{ args.email }}"
    ARG_PHONE: "{{ args.phone }}"
    ARG_THIRD_PARTY_ID: "{{ args.third_party_id }}"
    ARG_THIRD_PARTY_USER_ID: "{{ args.third_party_user_id }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Find a user by email
    args: {email: alice@example.com}
  - title: Find a Google sign-in
    args: {third_party_id: google, third_party_user_id: "108234567890123456789"}
