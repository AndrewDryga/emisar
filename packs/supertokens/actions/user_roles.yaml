schema_version: 1
id: supertokens.user_roles
title: Show a user's roles and permissions
kind: script
risk: low
description: >
  Show the roles a user holds in the public tenant with GET
  /recipe/user/roles, and the union of those roles' permissions, which is what
  the SDK's permission claim carries. Fails with UNKNOWN_USER_ID_ERROR for an
  unknown user. A change reaches a live session only when its role claim
  refreshes; supertokens.user_sessions shows what each session carries.
side_effects:
  - One HTTP GET to look the user up, one for the user's roles, and one per role for its permissions.
  - Read-only — never writes or mutates data.
search_terms:
  - user missing permission
  - access denied for user
  - is the user an admin
args:
  - name: user_id
    type: string
    required: true
    description: A SuperTokens user id or a mapped external user id.
    validation:
      pattern: "^[!#-\\[\\]-~]{1,128}$"
      max_length: 128
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - user-roles
    - "{{ args.user_id }}"
  timeout: 90s
output:
  parser: json
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: A user's roles
    args: {user_id: 3f2c1a9e-7b1d-4c2e-9a4f-6d8e0b5c7a21}
