schema_version: 1
id: supertokens.active_users
title: Count recently active users
kind: script
risk: low
description: >
  Count users whose session was created or refreshed within the last
  window_minutes with GET /users/count/active. The core keeps no live session
  count, so this is the nearest measure of who is signed in. Core 12 records
  refresh activity at most every 5 minutes.
side_effects:
  - One read-only HTTP GET to the core's /users/count/active endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - active sessions
  - who is logged in
  - sessions count
args:
  - name: window_minutes
    type: integer
    required: false
    default: 60
    description: >
      How many minutes back to count, up to 10 years (5256000). The core keeps
      each user's last-active time indefinitely, so any window is one count.
    validation: {min: 1, max: 5256000}
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - active-users
    - "{{ args.window_minutes }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Users active in the last hour
    args: {window_minutes: 60}
