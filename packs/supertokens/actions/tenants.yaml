schema_version: 1
id: supertokens.tenants
title: List tenants and their login methods
kind: script
risk: low
description: >
  List every tenant with GET /recipe/multitenancy/tenant/list/v2 (core 9.1 or
  later): its id, first and required secondary factors (null means the core
  default), each third-party provider with its public OAuth client ids and
  scopes, and the names of its core config overrides. Client secrets, private
  keys, token-endpoint parameters and override values are dropped on the
  host; confidential says whether a client has a secret.
side_effects:
  - One read-only HTTP GET to the core's tenant list endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - login methods
  - social login broken
  - wrong oauth client id
  - tenant config
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - tenants
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Tenants
    args: {}
