schema_version: 1
id: supertokens.user_count
title: Count SuperTokens users
kind: script
risk: low
description: >
  Count users across every tenant with GET /users/count. Returns
  {"status":"OK","count":N}.
side_effects:
  - One read-only HTTP GET to the core's /users/count endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - how many users
  - total users
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - user-count
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Count users
    args: {}
