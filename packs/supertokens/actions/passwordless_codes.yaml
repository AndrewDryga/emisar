schema_version: 1
id: supertokens.passwordless_codes
title: Show pending passwordless codes for a user
kind: script
risk: low
description: >
  Show the pending passwordless sign-in codes for an email address or phone
  number with GET /recipe/signinup/codes: for each device, how many wrong
  codes were entered and when each code was created and expires. The core
  never returns the code or magic link here.
side_effects:
  - One read-only HTTP GET to the core's /recipe/signinup/codes endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - login code never arrived
  - otp expired
  - too many wrong codes
args:
  - name: email
    type: string
    required: false
    default: ""
    sensitive: true
    description: The email address the code was sent to. Set exactly one of email or phone.
    validation:
      pattern: "^([^@\\s\"\\\\]{1,64}@[^@\\s\"\\\\]{1,255})?$"
      max_length: 320
  - name: phone
    type: string
    required: false
    default: ""
    sensitive: true
    description: The phone number the code was sent to.
    validation:
      pattern: "^(\\+?[0-9 ().-]{4,32})?$"
      max_length: 33
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - passwordless-codes
  env:
    ARG_EMAIL: "{{ args.email }}"
    ARG_PHONE: "{{ args.phone }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Codes sent to an email
    args: {email: alice@example.com}
