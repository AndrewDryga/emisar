schema_version: 1
id: supertokens.remove_user_role
title: Remove a role from a user
kind: script
risk: high
description: >
  Remove a role from a user in the public tenant with POST
  /recipe/user/role/remove, after looking the user up. Fails with
  UNKNOWN_USER_ID_ERROR or UNKNOWN_ROLE_ERROR. had_role false means the user
  did not hold it and nothing changed. Live sessions lose the role when their
  role claim refreshes; supertokens.revoke_user_sessions applies it at once.
  supertokens.add_user_role reverses it.
side_effects:
  - Takes the role's permissions away from the user in the app, which can lock the user out of features they rely on.
search_terms:
  - revoke admin
  - remove access
  - unban user
args:
  - name: user_id
    type: string
    required: true
    description: A SuperTokens user id or a mapped external user id.
    validation:
      pattern: "^[!#-\\[\\]-~]{1,128}$"
      max_length: 128
  - name: role
    type: string
    required: true
    description: The role name, as supertokens.user_roles lists it.
    validation:
      pattern: "^[!#-\\[\\]-~]([ !#-\\[\\]-~]{0,253}[!#-\\[\\]-~])?$"
      max_length: 255
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - remove-user-role
    - "{{ args.user_id }}"
    - "{{ args.role }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Remove admin
    args: {user_id: 3f2c1a9e-7b1d-4c2e-9a4f-6d8e0b5c7a21, role: admin}
