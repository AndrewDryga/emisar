schema_version: 1
id: supertokens.api_version
title: Show supported core API versions
kind: script
risk: low
description: >
  Show the core driver interface (CDI) versions this SuperTokens core
  supports with GET /apiversion, sorted, with the newest as latest. A backend
  SDK needs one of them, so this explains SDK version errors after an
  upgrade. The core reports no release number; the newest CDI stands in for
  it: 5.4 is core 11.x, 5.5 is 12.0.8 or later, and 5.6 is 12.1 or later.
  Needs the API key when the core sets api_keys.
side_effects:
  - One read-only HTTP GET to the core's /apiversion endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - sdk version mismatch
  - unsupported cdi version
  - which supertokens version
execution:
  script:
    path: scripts/supertokens_api.sh
    interpreter: /bin/sh
  argv:
    - api-version
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Supported versions
    args: {}
