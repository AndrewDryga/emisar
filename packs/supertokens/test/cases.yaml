services: [supertokens]
versions:
  - version: 12.2.0
    digest: "@sha256:9c5254f1daca6cef8868f2bd2af50808ee5790e5f414c54e4186ab2a6ae676b5"
    default: true
  - version: 11.4.7
    digest: "@sha256:7a71606ee6ff6a1173f13e4dc1ee27bd0169c09a74515149a9e0ac82994cfac7"
secret_env: [SUPERTOKENS_API_KEY]
env:
  SUPERTOKENS_API_KEY: packtest-canary-supertokens-4f2a9c1e
  SUPERTOKENS_URL: "http://supertokens:3567"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: supertokens.hello
    expect:
      stdout_contains: [Hello]
  - name: supertokens.hello-without-key
    action: supertokens.hello
    unset_env: [SUPERTOKENS_API_KEY]
    expect:
      stdout_contains: [Hello]
  - action: supertokens.api_version
    expect:
      stdout_contains: ['"versions"']
  - name: supertokens.api_version-invalid-api-key
    action: supertokens.api_version
    env:
      SUPERTOKENS_API_KEY: packtest-canary-supertokens-invalid-7c21
    expect:
      status: failure
      exit: [22]
      stderr_contains: ["curl: (22)"]
      stdout_contains: [Invalid API key]
  - action: supertokens.user_count
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -H "api-key: $SUPERTOKENS_API_KEY" -H "Content-Type: application/json" -X POST "$SUPERTOKENS_URL/recipe/signup" -d "{\"email\":\"packtest@example.com\",\"password\":\"packtest-Passw0rd\"}" >/dev/null']
    expect:
      json:
        /count: 1
  - action: supertokens.active_users
    args: {window_minutes: 60}
    arrange:
      - argv: [/bin/sh, -c, 'user_id=$(curl -fsS -H "api-key: $SUPERTOKENS_API_KEY" -H "Content-Type: application/json" -X POST "$SUPERTOKENS_URL/recipe/signup" -d "{\"email\":\"packtest@example.com\",\"password\":\"packtest-Passw0rd\"}" | jq -r .user.id) && curl -fsS -H "api-key: $SUPERTOKENS_API_KEY" -H "Content-Type: application/json" -X POST "$SUPERTOKENS_URL/recipe/session" -d "{\"userId\":\"$user_id\",\"userDataInJWT\":{},\"userDataInDatabase\":{},\"enableAntiCsrf\":false}" >/dev/null']
    expect:
      json:
        /count: 1
  # The raw tenant list returns each provider's client secret; the action
  # must keep only the provider id.
  - action: supertokens.tenants
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -H "api-key: $SUPERTOKENS_API_KEY" -H "Content-Type: application/json" -X PUT "$SUPERTOKENS_URL/recipe/multitenancy/config/thirdparty" -d "{\"tenantId\":\"public\",\"config\":{\"thirdPartyId\":\"google\",\"name\":\"Google\",\"clients\":[{\"clientId\":\"packtest-google-client\",\"clientSecret\":\"packtest-canary-supertokens-google-secret-5d2e\"}]},\"skipValidation\":true}" >/dev/null']
    expect:
      stdout_contains: ['"tenant_id":"public"', '"third_party_providers":["google"]']
      stdout_not_contains: [packtest-canary-supertokens-google-secret-5d2e]
