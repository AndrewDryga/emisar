services:
  supertokens:
    image: supertokens/supertokens-postgresql:${PACKTEST_VERSION:-12.2.0}${PACKTEST_DIGEST-}
    environment:
      # No POSTGRESQL_* settings: the core falls back to its in-memory store.
      API_KEYS: packtest-canary-supertokens-4f2a9c1e
      DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3567/hello"]
      interval: 5s
      start_period: 90s
      start_interval: 1s
      retries: 30
