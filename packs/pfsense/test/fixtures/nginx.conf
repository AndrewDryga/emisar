# Serve the fixture tree as the pfSense REST API. Every response is JSON; the
# API key is not checked, because what is under test is the response projection,
# not pfSense's auth.
server {
  listen 80;
  default_type application/json;
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.json =404;
  }
}
