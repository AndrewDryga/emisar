services: [pfsense-api]
versions:
  - version: "1.29-alpine"
    digest: "@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de"
    default: true
env:
  PFSENSE_URL: "http://pfsense-api"
  # The fixture server does not check the key; it is declared so the harness
  # treats it as a secret and would catch it being echoed into output.
  PFSENSE_API_KEY: packtest-canary-pfsense-apikey-2d84
secret_env: [PFSENSE_API_KEY]
# Prove the important boundary on secret-bearing reads: their jq allowlist
# projection never emits the private-key
# material the endpoint returns. The SUT is an nginx serving real-shaped API
# bodies with a planted canary secret, which tests the projection completely
# without needing the appliance's behaviour at all.
# These endpoints return a secret beside the facts an operator wants: a
# certificate's private key, an NTP peer's authentication key, a WireGuard
# peer's pre-shared key, a resolver's free-text custom options. Each action
# pipes one GET through a jq allowlist projection that never NAMES the secret
# field, so it cannot be emitted; these cases prove that against a body which
# actually carries one. The canary is what must not appear — asserting the safe
# fields alone would pass even if the secret leaked alongside them.
#
# interface_config and virtual_ips are the only two reads that keep the raw
# body, with a regex redaction over the `"password"` key instead of a
# projection. The fixture holds that key on both endpoints — once plainly and
# once with an embedded escaped quote, the shape the old `[^"]*` rule stopped
# short of — so the rule is proven rather than excused.
cases:
  - action: pfsense.certificates
    expect:
      stdout_contains: [packtest-leaf, valid_days_left]
      stdout_not_contains: [packtest-canary-pfsense-privatekey-4f7a]
  - action: pfsense.certificate_authorities
    expect:
      stdout_contains: [packtest-ca, trust]
      stdout_not_contains: [packtest-canary-pfsense-cakey-9b3e]
  - action: pfsense.crls
    expect:
      stdout_contains: [packtest-crl, revoked]
      stdout_not_contains: [packtest-canary-pfsense-crlblob-71cd]
  - action: pfsense.dns_resolver_settings
    expect:
      stdout_contains: [dnssec, outgoing_interface]
      stdout_not_contains: [packtest-canary-pfsense-resolveropts-6c19]
  - action: pfsense.ntp_settings
    expect:
      stdout_contains: [serverauthalgo, ntpmaxpeers]
      stdout_not_contains: [packtest-canary-pfsense-ntpauthkey-3e82]
  - action: pfsense.wireguard_peers
    expect:
      stdout_contains: [packtest-peer, allowedips]
      stdout_not_contains: [packtest-canary-pfsense-wgpsk-8a47]
  - action: pfsense.interface_config
    expect:
      stdout_contains: [packtest-wan, '"[REDACTED]"']
      stdout_not_contains:
        - packtest-canary-pfsense-ifpassword-5e13
        - packtest-canary-pfsense-ifquoted-4b82
        - packtest-canary-pfsense-iftail-3d70
  - action: pfsense.virtual_ips
    expect:
      stdout_contains: [packtest-carp-vip, '"[REDACTED]"']
      stdout_not_contains:
        - packtest-canary-pfsense-vippassword-6c47
        - packtest-canary-pfsense-vipquoted-9a05
        - packtest-canary-pfsense-viptail-2f18
  - action: pfsense.dhcp_static_mappings
    args: {interface: lan}
    expect:
      stdout_contains: [packtest-printer, arp_table_static_entry]
