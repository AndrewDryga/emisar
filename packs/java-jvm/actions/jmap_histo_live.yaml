schema_version: 1
id: jvm.jmap_histo_live
title: jmap -histo:live (top 50)
kind: exec
risk: medium
description: List top classes by retained-heap size after a forced full GC. Use to find the leak candidate.
side_effects:
  - Triggers a full GC.
  - JVM pause for the duration of the GC.
search_terms:
  - memory leak
args:
  - name: pid
    type: integer
    required: true
    description: JVM PID.
    validation:
      min: 1
      max: 4194304
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A histogram always exceeds 50 lines, so piping live would SIGPIPE jmap
      # on every SUCCESSFUL run — propagating a pipe status here would fail the
      # good case. Capture first: the status is then jmap's own, which is
      # non-zero for a dead PID, a non-JVM process, or a denied attach.
      - |
        histo=$(jmap -histo:live {{ args.pid }}); status=$?
        printf '%s\n' "$histo" | head -50
        exit $status
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Top retained classes
    args:
      pid: 4321
