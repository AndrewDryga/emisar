schema_version: 1
id: braintree.set_subscription_price
title: Correct a subscription price
kind: script
risk: high
description: "Set the approved subscription price with proration disabled, preserving its plan association. Does not retroactively correct existing transactions."
side_effects: ["Changes the specified billing or dispute state; approval is required under the default policy.","This API has no native request deduplication. Sends one write; reconcile any ambiguous outcome before attempting it again."]
args:
  - name: subscription_id
    type: string
    required: true
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    validation: {"pattern":"^[A-Za-z0-9_=+/-]+$","max_length":255}
  - name: merchant_account_id
    type: string
    required: true
    description: "Approved processing account from the subscription."
    validation: {"pattern":"^[A-Za-z0-9_-]+$","max_length":255}
  - name: currency
    type: string
    required: true
    description: "Approved uppercase currency from the subscription plan."
    validation: {"pattern":"^[A-Z]{3}$","max_length":3}
  - name: expected_updated_at
    type: string
    required: true
    description: "UTC ISO-8601 timestamp, including Z; used exactly as returned by the provider."
    validation: {"pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$","max_length":40}
  - name: expected_price
    type: string
    required: true
    description: "Explicit decimal amount in major currency units, never floating point; use the currency and merchant account from the investigated object."
    validation: {"pattern":"^(0|[1-9][0-9]*)(\\.[0-9]{2,3})?$","max_length":20}
  - name: price
    type: string
    required: true
    description: "Explicit decimal amount in major currency units, never floating point; use the currency and merchant account from the investigated object."
    validation: {"pattern":"^(0|[1-9][0-9]*)(\\.[0-9]{2,3})?$","max_length":20}
  - name: environment
    type: string
    required: true
    description: "Explicitly approve the runner's configured environment."
    validation: {"enum":["sandbox","production"]}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [set_subscription_price]
  env:
    ARG_SUBSCRIPTION_ID: "{{ args.subscription_id }}"
    ARG_MERCHANT_ACCOUNT_ID: "{{ args.merchant_account_id }}"
    ARG_CURRENCY: "{{ args.currency }}"
    ARG_EXPECTED_UPDATED_AT: "{{ args.expected_updated_at }}"
    ARG_EXPECTED_PRICE: "{{ args.expected_price }}"
    ARG_PRICE: "{{ args.price }}"
    ARG_ENVIRONMENT: "{{ args.environment }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Correct a subscription price
    args:
      subscription_id: "b4x7kq"
      merchant_account_id: "emisar_usd"
      currency: "USD"
      expected_updated_at: "2026-09-10T18:04:11Z"
      expected_price: "24.99"
      price: "24.99"
      environment: "sandbox"
