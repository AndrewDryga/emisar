schema_version: 1
id: braintree.dispute
title: Show dispute
kind: script
risk: low
description: "Show one Braintree dispute with diagnostic state and billing linkage. Includes evidence inventory, deadlines, status history and the evidence hash used for final submission. Nested arrays return at most ten entries with explicit overflow flags."
side_effects: ["Reads selected billing information from Braintree."]
args:
  - name: id
    type: string
    required: true
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    validation: {"pattern":"^[A-Za-z0-9_=+/-]+$","max_length":255}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [dispute]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
