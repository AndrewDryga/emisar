schema_version: 1
id: braintree.void_transaction
title: Void a transaction
kind: script
risk: high
description: "Void one eligible authorization or unsettled transaction. This is distinct from refunding a settled payment."
side_effects: ["Changes the specified billing or dispute state; approval is required under the default policy.","Uses provider deduplication and never retries automatically. Preserve operation_id when reconciling an uncertain result."]
args:
  - name: transaction_id
    type: string
    required: true
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    validation: {"pattern":"^[A-Za-z0-9_=+/-]+$","max_length":255}
  - name: merchant_account_id
    type: string
    required: true
    description: "Approved merchant account from the transaction read."
    validation: {"pattern":"^[A-Za-z0-9_-]+$","max_length":255}
  - name: currency
    type: string
    required: true
    description: "Approved uppercase ISO currency code."
    validation: {"pattern":"^[A-Z]{3}$","max_length":3}
  - name: environment
    type: string
    required: true
    description: "Explicitly approve the runner's configured environment."
    validation: {"enum":["sandbox","production"]}
  - name: operation_id
    type: string
    required: true
    description: "Stable apiRequestKey; provider retains deduplication for 30 days after the initial request finishes. Reuse only with identical parameters."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._:-]*$","max_length":64}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [void_transaction]
  env:
    ARG_TRANSACTION_ID: "{{ args.transaction_id }}"
    ARG_MERCHANT_ACCOUNT_ID: "{{ args.merchant_account_id }}"
    ARG_CURRENCY: "{{ args.currency }}"
    ARG_ENVIRONMENT: "{{ args.environment }}"
    ARG_OPERATION_ID: "{{ args.operation_id }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
