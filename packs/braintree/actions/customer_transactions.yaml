schema_version: 1
id: braintree.customer_transactions
title: List customer transactions
kind: script
risk: low
description: "List one page of customer transactions with continuation for billing investigation."
side_effects: ["Reads selected billing information from Braintree."]
args:
  - name: customer_id
    type: string
    required: true
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    validation: {"pattern":"^[A-Za-z0-9_=+/-]+$","max_length":255}
  - name: limit
    type: integer
    required: false
    description: "Records per page; at most ten to bound the projected result within 64 KiB."
    default: 10
    validation: {"min":1,"max":10}
  - name: page_cursor
    type: string
    required: false
    description: Opaque continuation cursor from the previous result. Pass the token that result returned, with the other arguments unchanged.
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_=+/:.-]*$","max_length":2048}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [customer_transactions]
  env:
    ARG_CUSTOMER_ID: "{{ args.customer_id }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_PAGE_CURSOR: "{{ args.page_cursor }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
