schema_version: 1
id: braintree.stage_dispute_text
title: Stage dispute text evidence
kind: script
risk: high
description: "Add one categorized text evidence item without finalizing the dispute. GraphQL supports the published card-dispute categories; PayPal EVIDENCE_TYPE and sequence-number evidence require the provider control panel."
side_effects: ["Changes the specified billing or dispute state; approval is required under the default policy.","This API has no native request deduplication. Sends one write; reconcile any ambiguous outcome before attempting it again."]
args:
  - name: dispute_id
    type: string
    required: true
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    validation: {"pattern":"^[A-Za-z0-9_=+/-]+$","max_length":255}
  - name: category
    type: string
    required: true
    description: "Supported GraphQL text evidence category."
    validation: {"enum":["CARRIER_NAME","CREDIT_ISSUED_AMOUNT","CREDIT_ISSUED_ARN","CREDIT_ISSUED_DATE_TIME","DEVICE_ID","DEVICE_NAME","DOWNLOAD_DATE_TIME","GENERAL","GEOGRAPHICAL_LOCATION","PRIOR_DIGITAL_GOODS_TRANSACTION_ARN","PRIOR_DIGITAL_GOODS_TRANSACTION_DATE_TIME","PRIOR_DIGITAL_GOODS_TRANSACTION_ID","PRIOR_NON_DISPUTED_TRANSACTION_ARN","PRIOR_NON_DISPUTED_TRANSACTION_DATE_TIME","PRIOR_NON_DISPUTED_TRANSACTION_EMAIL_ADDRESS","PRIOR_NON_DISPUTED_TRANSACTION_ID","PRIOR_NON_DISPUTED_TRANSACTION_IP_ADDRESS","PRIOR_NON_DISPUTED_TRANSACTION_PHONE_NUMBER","PRIOR_NON_DISPUTED_TRANSACTION_PHYSICAL_ADDRESS","PURCHASER_EMAIL_ADDRESS","PURCHASER_IP_ADDRESS","PURCHASER_NAME","RECURRING_TRANSACTION_ARN","RECURRING_TRANSACTION_DATE_TIME","RECURRING_TRANSACTION_ID","REFUND_ID","TRACKING_NUMBER"]}
  - name: content
    type: string
    required: true
    description: "Evidence text, bounded to 10000 bytes in one action."
    sensitive: true
    validation: {"pattern":"^[\\s\\S]+$","max_length":10000}
  - name: environment
    type: string
    required: true
    description: "Explicitly approve the runner's configured environment."
    validation: {"enum":["sandbox","production"]}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [stage_dispute_text]
  env:
    ARG_DISPUTE_ID: "{{ args.dispute_id }}"
    ARG_CATEGORY: "{{ args.category }}"
    ARG_CONTENT: "{{ args.content }}"
    ARG_ENVIRONMENT: "{{ args.environment }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Stage the shipping narrative for a dispute
    args:
      dispute_id: "dispute_8xk2p4"
      category: "CARRIER_NAME"
      content: "Signed delivery confirmation, 2026-09-04, tracking 1Z999AA10123456784."
      environment: "sandbox"
