schema_version: 1
id: braintree.disputes
title: Search disputes
kind: script
risk: low
description: "List one bounded page of Braintree disputes matching the supplied criteria. Blank optional criteria intentionally impose no filter; returned cursors continue the same search."
side_effects: ["Reads selected billing information from Braintree."]
args:
  - name: transaction_id
    type: string
    required: false
    description: "Braintree GraphQL ID returned by a read or resolve_id; not a legacy control-panel ID."
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_=+/-]*$","max_length":255}
  - name: status
    type: string
    required: false
    description: "Optional dispute status."
    default: ""
    validation: {"enum":["","OPEN","ACCEPTED","AUTO_ACCEPTED","DISPUTED","EXPIRED","LOST","UNDER_REVIEW","WON"]}
  - name: limit
    type: integer
    required: false
    description: "Records per page; at most ten to bound the projected result within 64 KiB."
    default: 10
    validation: {"min":1,"max":10}
  - name: cursor
    type: string
    required: false
    description: "Use pagination.next_cursor with unchanged filters."
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_=+/:.-]*$","max_length":2048}
execution:
  script: {path: scripts/braintree.py, interpreter: python3}
  argv: [disputes]
  env:
    ARG_TRANSACTION_ID: "{{ args.transaction_id }}"
    ARG_STATUS: "{{ args.status }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_CURSOR: "{{ args.cursor }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
