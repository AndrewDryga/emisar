# run_script is the staging-only break-glass action: the operator supplies
# the whole /bin/sh program. It is critical and default-denied by design,
# and a behavior case for it would assert nothing about the arbitrary
# command it exists to carry.
# Declared rather than left silently uncovered, so the gap is a decision in
# the plan instead of an absence nobody sees.
risk_accountability:
  mode: complete
  exceptions:
    shell.run_script: requires_privileged_host
