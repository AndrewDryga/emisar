schema_version: 1
id: phpfpm.fpm_ping
title: GET /ping (FPM)
kind: exec
risk: low
description: >
  Check the FPM ping endpoint at PHP_FPM_PING_URL (default
  http://127.0.0.1/fpm-ping, the pool's `ping.path`); returns 'pong' if
  responsive.
side_effects: ["One HTTP GET.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "curl -q -fsS --globoff --proto =http,https \"${PHP_FPM_PING_URL:-http://127.0.0.1/fpm-ping}\""
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 1024
  max_stderr_bytes: 8192
examples:
  - title: Ping
    args: {}
