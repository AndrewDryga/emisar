schema_version: 1
id: phpfpm.fpm_status_full
title: GET /status?full (FPM per-process)
kind: exec
risk: medium
description: >
  Show per-process detail: pid, state, last request URI, current memory peak.
  The request URI is live client-supplied request data — query strings included
  — so it is rated with the pack's log tails rather than with the summary
  counters in `phpfpm.fpm_status`.
side_effects: ["One HTTP GET.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "curl -q -fsS --globoff --proto =http,https \"${PHP_FPM_STATUS_URL:-http://127.0.0.1/fpm-status}?full\""
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Per-process
    args: {}
