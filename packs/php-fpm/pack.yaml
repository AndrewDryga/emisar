schema_version: 1

id: php-fpm
name: PHP-FPM
version: 0.1.13
description: >
  PHP runtime + FPM pool introspection — version, modules, ini, pool
  status (via fpm_status endpoint), error + slow logs, OPcache state,
  Composer manifest. Read-only. Set PHP_FPM_STATUS_URL env to point
  to the FPM status endpoint.
vendor: emisar
homepage: https://emisar.dev/packs/php-fpm

requires:
  os:
    - linux

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - php-fpm

setup:
  summary: >
    Inspects the local PHP runtime and FPM pool on the runner host
    (php -v / --ini, logs, OPcache, Composer) — no credentials needed.
  env:
    - name: PHP_FPM_STATUS_URL
      description: URL of the FPM pool status page, used by the fpm_status/fpm_status_full/fpm_ping actions. Optional; defaults to http://127.0.0.1/fpm-status. Add it to the runner's `inherit_env` if you override it.
      default: "http://127.0.0.1/fpm-status"
    - name: PHP_FPM_ERROR_LOG
      description: Path to the PHP-FPM error log. Add it to the runner's `inherit_env` if you override it.
      default: /var/log/php-fpm/error.log
    - name: PHP_FPM_SLOW_LOG
      description: Path to the PHP-FPM slow-request log. Add it to the runner's `inherit_env` if you override it.
      default: /var/log/php-fpm/slow.log
    - name: COMPOSER_DIR
      description: Composer project directory inspected by composer_show. Add it to the runner's `inherit_env` if you override it.
      default: /var/www/html
  notes:
    - "The status page must be enabled in the pool config (pm.status_path) and reachable from the runner host for the fpm_status actions to return data."
    - "Debian/Ubuntu log paths vary by installed PHP version. Set and allowlist `PHP_FPM_ERROR_LOG` and `PHP_FPM_SLOW_LOG`, then grant persistent read access through that deployment's log group or rotation policy."
  host_access:
    - actions:
        - phpfpm.error_log_tail
        - phpfpm.slow_log_tail
        - phpfpm.composer_show
      requirement: Read PHP-FPM's root-owned logs and the deployment-owned Composer project.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-php-fpm-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
            - "sudo test -r /var/log/php-fpm/error.log"
            - "sudo test -r /var/log/php-fpm/slow.log"
            - "sudo test -r /var/www/html/composer.lock"
          impact: >
            Every Emisar action on this runner executes as root. PHP-FPM logs can contain request
            details and stack traces, while the application tree can contain source and secrets.
  verify: phpfpm.version

actions:
  - actions/version.yaml
  - actions/modules.yaml
  - actions/ini.yaml
  - actions/fpm_status.yaml
  - actions/fpm_status_full.yaml
  - actions/fpm_ping.yaml
  - actions/error_log_tail.yaml
  - actions/slow_log_tail.yaml
  - actions/opcache_status.yaml
  - actions/composer_show.yaml
