schema_version: 1
id: tailscale.ping
title: Ping a Tailscale peer
kind: exec
risk: low
description: >
  Ping a remote tailnet peer and show each reply's path (direct or DERP)
  and latency. Send count probes (default 5, max 20), waiting up to five
  seconds per probe, and succeed if any reply arrives. Resolution and
  LocalAPI errors still fail; a local-node target is reported without
  sending peer probes.
side_effects: ["Sends Tailscale ping probes to one peer.", "Read-only."]
search_terms:
  - peer unreachable
args:
  - name: host
    type: string
    required: true
    description: Peer to ping — a tailnet hostname, MagicDNS name, or Tailscale IP.
    validation:
      max_length: 128
      pattern: "^[A-Za-z0-9._:][A-Za-z0-9._:-]{0,127}$"
  - name: count
    type: integer
    required: false
    default: 5
    description: Number of pings to send (1-20).
    validation:
      min: 1
      max: 20
execution:
  command: {binary: tailscale, argv: ["ping", "--until-direct=false", "--timeout=5s", "--c", "{{ args.count }}", "{{ args.host }}"]}
  timeout: 3m
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Ping a peer by MagicDNS name
    args:
      host: db-1
  - title: Ping a peer ten times
    args:
      host: 100.101.102.103
      count: 10
