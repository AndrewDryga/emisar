schema_version: 1
id: consul.force_check_pass
title: PUT /v1/agent/check/pass/<check_id>
kind: script
risk: high
description: Force one TTL check into the PASSING state; discovery resumes routing traffic to the service even if it is genuinely unhealthy. The check stays passing until the next TTL expires.
side_effects:
  - Targeted check transitions to PASSING.
  - Services watching this check may resume routing traffic.
  - For non-TTL checks, the override is overwritten by the next actual run.
args:
  - name: check_id
    type: string
    required: true
    description: Check ID.
    validation:
      # First char is non-dash so a "-flag"-shaped value can't be parsed as a flag if this ever lands as a bare positional.
      pattern: "^[a-zA-Z0-9_.:][a-zA-Z0-9_.:\\-]{0,127}$"
  - name: note
    type: string
    required: false
    default: "operator override"
    description: Note attached to the check.
    validation:
      pattern: "^[A-Za-z0-9 _.,:/()#@=+-]{1,255}$"
execution:
  script:
    path: scripts/api_request.sh
    interpreter: /bin/sh
  argv: [PUT, "/v1/agent/check/pass/{{ args.check_id }}", --data-urlencode, "note={{ args.note }}", -G]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Force pass a TTL check
    args:
      check_id: "service:api:1"
