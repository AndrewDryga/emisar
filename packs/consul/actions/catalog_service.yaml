schema_version: 1
id: consul.catalog_service
title: GET /v1/catalog/service/<name>
kind: script
risk: low
description: List all instances of one service across the cluster.
side_effects: ["One API call.", "Read-only."]
args:
  - name: service
    type: string
    required: true
    description: Service name.
    validation:
      # First char is non-dash so a "-flag"-shaped value can't be parsed as a flag if this ever lands as a bare positional.
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,127}$"
execution:
  script:
    path: scripts/api_request.sh
    interpreter: /bin/sh
  argv: [GET, "/v1/catalog/service/{{ args.service }}"]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Service instances
    args:
      service: "api"
