schema_version: 1
id: consul.kv_get_recursive
title: consul kv get -recurse <prefix>
kind: exec
risk: high
description: Get all keys + values under a prefix.
side_effects: ["One KV request.", "Read-only, but returns every value under the prefix, which commonly includes secrets. Approval-gated for that reason; redaction is a pattern-bound backstop, not a guarantee."]
args:
  - name: prefix
    type: string
    required: true
    description: Key prefix.
    validation:
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_./\\-]{0,255}$"
execution:
  command: {binary: consul, argv: ["kv", "get", "-recurse", "{{ args.prefix }}"]}
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Recursive under config/
    args:
      prefix: "config/"
