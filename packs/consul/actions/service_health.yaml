schema_version: 1
id: consul.service_health
title: Health of a service's instances
kind: script
risk: low
description: Show per-node health for one service.
side_effects:
  - One health request.
  - Read-only.
search_terms:
  - service unhealthy
args:
  - name: service
    type: string
    required: true
    description: Service name.
    validation:
      # First char is non-dash so a "-flag"-shaped value can't be parsed as a flag if this ever lands as a bare positional.
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,127}$"
execution:
  script:
    path: scripts/api_request.sh
    interpreter: /bin/sh
  argv: [GET, "/v1/health/service/{{ args.service }}"]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Health for api
    args:
      service: "api"
