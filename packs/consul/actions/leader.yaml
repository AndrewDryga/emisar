schema_version: 1
id: consul.leader
title: GET /v1/status/leader
kind: script
risk: low
description: >
  Show the current Raft leader address for this datacenter. Reads the status
  endpoint, which is not ACL-gated, so it answers "is there a leader?"
  even when no CONSUL_HTTP_TOKEN is set.
side_effects:
  - One API call.
  - Read-only.
search_terms:
  - no leader
  - leader election
args: []
execution:
  script:
    path: scripts/api_request.sh
    interpreter: /bin/sh
  argv: [GET, /v1/status/leader]
  timeout: 15s
output:
  parser: json
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Leader address
    args: {}
