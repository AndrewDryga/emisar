schema_version: 1
id: consul.node_health
title: GET /v1/health/node/<node>
kind: script
risk: low
description: List all checks for one node + their status.
side_effects: ["One API call.", "Read-only."]
args:
  - name: node
    type: string
    required: true
    description: Node name.
    validation:
      # First char is non-dash so a "-flag"-shaped value can't be parsed as a flag if this ever lands as a bare positional.
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,127}$"
execution:
  script:
    path: scripts/api_request.sh
    interpreter: /bin/sh
  argv: [GET, "/v1/health/node/{{ args.node }}"]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: One node's checks
    args:
      node: "node-1"
