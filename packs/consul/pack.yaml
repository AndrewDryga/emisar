schema_version: 1

id: consul
name: HashiCorp Consul operations
version: 0.2.31
# The kv reads returned secret-bearing values at a tier the default policy
# auto-runs; every version below fails closed rather than skipping approval.
retired_below: 0.2.25
description: >
  Deep Consul ops — agent self/metrics/host introspection, operator
  raft + autopilot + reload, catalog (services + nodes + datacenters),
  health (passing/warning/critical) with force-pass/fail/warn check
  mutators, KV (get/list/recursive), ACL tokens/policies/roles, Connect
  mesh (CA roots, intentions), sessions, prepared queries, snapshots
  (save/inspect/restore), and narrow operator actions (deregister,
  maintenance, raft remove-peer). Auth via CONSUL_HTTP_ADDR +
  CONSUL_HTTP_TOKEN env vars.
vendor: emisar
homepage: https://emisar.dev/packs/consul

requires:
  os:
    - linux
  binaries:
    - consul
    - curl
    - jq

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - consul
  ports:
    - 8500

setup:
  summary: >
    Both the consul CLI and the curl-based API actions read the agent
    address, ACL token, and TLS certificate settings from the standard Consul
    environment variables on the runner host.
  env:
    - name: CONSUL_HTTP_ADDR
      description: >
        Agent HTTP address, including scheme (the curl actions build URLs
        directly from it).
      default: http://127.0.0.1:8500
      example: http://consul.internal:8500
    - name: CONSUL_HTTP_TOKEN
      description: >
        ACL token. Required when ACLs are enabled; its policy gates which
        actions succeed.
    - name: CONSUL_CACERT
      description: >
        Optional path to the CA certificate used to verify the agent's HTTPS
        certificate.
    - name: CONSUL_CLIENT_CERT
      description: Optional path to the client certificate when the agent requires mutual TLS.
    - name: CONSUL_CLIENT_KEY
      description: Optional path to the client certificate's private key when the agent requires mutual TLS.
  notes:
    - "Any Consul variable you set must also be allowlisted in the runner's `execution.inherit_env` — the action env is scrubbed to `PATH` / `LANG` / `LC_ALL` / `TERM` by default, so an env present on the host but not allowlisted is silently dropped (the action falls back to its local default or fails auth)."
    - On a cluster with ACLs enabled the token must grant the rights the action needs — operator/write for raft_remove_peer and reload, service/node write for the maintenance and deregister mutators, and key/read for the KV reads.
    - "For TLS-enabled agents use an `https://` `CONSUL_HTTP_ADDR`. `CONSUL_CACERT`, `CONSUL_CLIENT_CERT`, and `CONSUL_CLIENT_KEY` apply uniformly to the Consul CLI and raw API actions. Set the client certificate and key together."
  host_access:
    - actions:
        - consul.snapshot_save
        - consul.snapshot_inspect
        - consul.snapshot_restore
      requirement: Read and write Consul snapshot files in a dedicated host backup directory.
      recipes:
        - name: Create the Emisar Consul snapshot directory
          commands:
            - "sudo install -d -o root -g emisar -m 0770 /var/backups/emisar-consul"
          verify:
            - "sudo -u emisar test -r /var/backups/emisar-consul"
            - "sudo -u emisar test -w /var/backups/emisar-consul"
          impact: >
            Every process running as emisar can read, replace, and delete snapshots in this
            directory. Consul snapshots contain raw KV, ACL, service, and session state.
  verify: consul.members

actions:
  # Agent / cluster
  - actions/members.yaml
  - actions/leader.yaml
  - actions/raft_peers.yaml
  - actions/agent_self.yaml
  - actions/agent_metrics.yaml
  - actions/registration_churn_snapshot.yaml
  - actions/agent_host_info.yaml
  - actions/autopilot_state.yaml
  - actions/raft_remove_peer.yaml
  - actions/reload.yaml
  # Catalog
  - actions/list_services.yaml
  - actions/catalog_service.yaml
  - actions/list_nodes.yaml
  - actions/node_services.yaml
  - actions/catalog_datacenters.yaml
  # Services / health
  - actions/service_health.yaml
  - actions/service_passing_only.yaml
  - actions/agent_services.yaml
  - actions/agent_checks.yaml
  - actions/node_health.yaml
  - actions/list_checks_critical.yaml
  - actions/list_checks_warning.yaml
  - actions/force_check_pass.yaml
  - actions/force_check_fail.yaml
  - actions/force_check_warn.yaml
  # KV
  - actions/kv_list.yaml
  - actions/kv_get.yaml
  - actions/kv_get_recursive.yaml
  # ACL
  - actions/list_acl_tokens.yaml
  - actions/list_acl_policies.yaml
  - actions/list_acl_roles.yaml
  - actions/acl_token_self.yaml
  # Connect / mesh
  - actions/connect_ca_roots.yaml
  - actions/connect_ca_configuration.yaml
  - actions/intentions_list.yaml
  - actions/intentions_match.yaml
  # Sessions
  - actions/list_sessions.yaml
  - actions/destroy_session.yaml
  # Snapshots
  - actions/snapshot_save.yaml
  - actions/snapshot_inspect.yaml
  - actions/snapshot_restore.yaml
  # Prepared queries
  - actions/prepared_queries_list.yaml
  # Operator-tier (mutators)
  - actions/node_maintenance.yaml
  - actions/service_maintenance.yaml
  - actions/deregister_service.yaml
