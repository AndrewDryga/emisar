services: [consul]
versions:
  - version: "2.0.2"
    digest: "@sha256:7dcf35d6b2682831094f1680aa58be214134969505acce0a9b280249581aa7d2"
    default: true
risk_accountability:
  mode: complete
  exceptions:
    consul.raft_remove_peer: requires_cluster
env:
  CONSUL_HTTP_ADDR: "http://consul:8500"
cases:
  - action: consul.agent_checks
    expect:
      stdout_contains: ["{}"]
  - action: consul.agent_host_info
    expect:
      stdout_contains: [Memory, CPU]
  - action: consul.agent_metrics
    expect:
      stdout_contains: [Timestamp, Gauges]
  - action: consul.agent_self
    expect:
      stdout_contains: [Config, Member]
  - name: consul.agent-self-http-error
    action: consul.agent_self
    env:
      CONSUL_HTTP_ADDR: http://consul:8500/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: consul.agent_services
    expect:
      stdout_contains: ["{}"]
  - action: consul.autopilot_state
    expect:
      stdout_contains: [Healthy, Servers]
  - action: consul.catalog_datacenters
    expect:
      stdout_contains: [dc1]
  - action: consul.connect_ca_configuration
    expect:
      stdout_contains: [Provider, Config]
  - action: consul.connect_ca_roots
    expect:
      stdout_contains: [ActiveRootID, Roots]
  - action: consul.leader
    expect:
      stdout_contains: ["8300"]
  - action: consul.list_nodes
    expect:
      stdout_contains: [Node, Address]
  - action: consul.list_services
    expect:
      stdout_contains: [consul]
  - action: consul.members
    expect:
      stdout_contains: [alive, server]
  - action: consul.raft_peers
    expect:
      stdout_contains: [Node, leader]
  - action: consul.deregister_service
    args: {service_id: packtest-service}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"ID":"packtest-service","Name":"packtest-service"}'' "$CONSUL_HTTP_ADDR/v1/agent/service/register"']
    probes:
      - argv: [/bin/sh, -c, '! curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/services" | grep -q packtest-service && echo absent']
        expect:
          stdout_contains: [absent]
  - action: consul.destroy_session
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"Name":"packtest-session"}'' "$CONSUL_HTTP_ADDR/v1/session/create"']
    resolve_args:
      session_id:
        argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/session/list" | jq -r ''.[] | select(.Name == "packtest-session") | .ID''']
    expect:
      stdout_contains: ["true"]
    probes:
      - argv: [/bin/sh, -c, '! curl -fsS "$CONSUL_HTTP_ADDR/v1/session/list" | grep -q packtest-session && echo absent']
        expect:
          stdout_contains: [absent]
  - action: consul.force_check_fail
    args: {check_id: "service:packtest-service", note: packtest-failed}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"ID":"packtest-service","Name":"packtest-service","Check":{"TTL":"30s"}}'' "$CONSUL_HTTP_ADDR/v1/agent/service/register"']
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/checks" | grep -Eq ''"Status":[[:space:]]*"critical"'' && echo critical']
        expect:
          stdout_contains: [critical]
  - action: consul.force_check_pass
    args: {check_id: "service:packtest-service", note: packtest-passed}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"ID":"packtest-service","Name":"packtest-service","Check":{"TTL":"30s"}}'' "$CONSUL_HTTP_ADDR/v1/agent/service/register"']
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/checks" | grep -Eq ''"Status":[[:space:]]*"passing"'' && echo passing']
        expect:
          stdout_contains: [passing]
  - action: consul.force_check_warn
    args: {check_id: "service:packtest-service", note: packtest-warning}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"ID":"packtest-service","Name":"packtest-service","Check":{"TTL":"30s"}}'' "$CONSUL_HTTP_ADDR/v1/agent/service/register"']
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/checks" | grep -Eq ''"Status":[[:space:]]*"warning"'' && echo warning']
        expect:
          stdout_contains: [warning]
  - action: consul.node_maintenance
    args: {note: packtest-maintenance}
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/checks" | grep -q _node_maintenance && echo maintenance']
        expect:
          stdout_contains: [maintenance]
  - action: consul.reload
    expect:
      stdout_contains: [Configuration reload triggered]
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/self" | grep -q Member && echo healthy']
        expect:
          stdout_contains: [healthy]
  - action: consul.service_maintenance
    args: {service_id: packtest-service, note: packtest-maintenance}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -X PUT --data ''{"ID":"packtest-service","Name":"packtest-service"}'' "$CONSUL_HTTP_ADDR/v1/agent/service/register"']
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS "$CONSUL_HTTP_ADDR/v1/agent/checks" | grep -q _service_maintenance:packtest-service && echo maintenance']
        expect:
          stdout_contains: [maintenance]
  - action: consul.snapshot_restore
    args: {path: /tmp/packtest.snap}
    arrange:
      - argv: [consul, snapshot, save, /tmp/packtest.snap]
    probes:
      - argv: [consul, operator, raft, list-peers]
        expect:
          stdout_contains: [leader]
  - action: consul.kv_get
    args: {key: packtest/config/log_level}
    arrange:
      - argv: [consul, kv, put, packtest/config/log_level, debug]
    expect:
      stdout_contains: [debug]
    cleanup:
      - argv: [consul, kv, delete, packtest/config/log_level]
  - action: consul.kv_get_recursive
    args: {prefix: packtest/config/}
    arrange:
      - argv: [consul, kv, put, packtest/config/log_level, debug]
      - argv: [consul, kv, put, packtest/config/region, eu-west-1]
    expect:
      stdout_contains: [log_level, region]
    cleanup:
      - argv: [consul, kv, delete, -recurse, packtest/config/]
