services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/consul/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.0.2}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-consul-tools:latest

  consul:
    image: hashicorp/consul:${PACKTEST_VERSION:-2.0.2}${PACKTEST_DIGEST-}
    command: agent -dev -client=0.0.0.0 -config-file=/consul/config/packtest-tls.hcl
    volumes:
      - ${EMISAR_ROOT}/packs/consul/test/fixtures/consul-tls.hcl:/consul/config/packtest-tls.hcl:ro
      - ${EMISAR_ROOT}/packs/consul/test/fixtures/tls:/consul/config/packtest-tls:ro
    healthcheck:
      # Both signals, and each earns its place. An elected leader means the agent
      # is SERVING, not merely listening — the readiness question. Metrics is
      # here because /v1/agent/metrics serializes float gauges and answers 500
      # (json: unsupported value: NaN) during a window right after start on
      # arm64; consul.agent_metrics is a case, so letting the SUT go ready
      # before that window closes just moves the failure into the case.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8500/v1/status/leader | grep -q ':8300' && curl -fsS http://localhost:8500/v1/agent/metrics | grep -q '\"Timestamp\"'"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 30
