services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/mongodb/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-8.2.5}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-mongodb-tools:latest

  mongodb:
    image: mongo:${PACKTEST_VERSION:-8.2.5}${PACKTEST_DIGEST-}
    entrypoint: ["/bin/bash", "/fixture/bootstrap.sh"]
    environment:
      PACKTEST_ROOT_PASSWORD: packtest-canary-mongodb-c936
    volumes:
      - ${EMISAR_ROOT}/packs/mongodb/test/fixtures:/fixture:ro
    healthcheck:
      # Readiness proves seeded data and the same route the cases use.
      test: ["CMD-SHELL", "test -f /tmp/packtest-seeded && mongosh --host \"$$(hostname -i)\" --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      start_period: 30s
      # Poll cost scales with probe cost: this check spawns a heavyweight
      # client, and four cases boot at once on a four-core runner.
      start_interval: 5s
      retries: 10
