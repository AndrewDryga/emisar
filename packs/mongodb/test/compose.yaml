services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/mongodb/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-8.2.5}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-mongodb-tools:latest

  mongodb:
    image: mongo:${PACKTEST_VERSION:-8.2.5}${PACKTEST_DIGEST-}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: packtest-canary-mongodb-c936
    volumes:
      - ${EMISAR_ROOT}/packs/mongodb/test/fixtures/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      # Dial the routable address, never loopback. The entrypoint seeds through
      # a temporary mongod bound to 127.0.0.1 and shuts it down before the real
      # one starts, so a loopback ping reports healthy while a case connecting
      # over the network still gets ECONNREFUSED.
      test: ["CMD-SHELL", "mongosh --host \"$$(hostname -i)\" --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      start_period: 30s
      # Poll cost scales with probe cost: this check spawns a heavyweight
      # client, and four cases boot at once on a four-core runner.
      start_interval: 5s
      retries: 10
