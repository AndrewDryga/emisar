services: [mongodb]
versions:
  - version: "8.2.5"
    digest: "@sha256:60aa240412f473f672ec8b282fd5651aa156dcc7a220f81f5381ce768ccc3167"
    default: true
  - version: "7.0.17"
    digest: "@sha256:ac9e83c57e32bf767f875ac2b9a9d87800d2d91a7829180c3a4826e0599698e8"
secret_env: [MONGO_URI]
env:
  MONGO_URI: "mongodb://root:packtest-canary-mongodb-c936@mongodb:27017/?authSource=admin"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: mongo.build_info
    expect:
      stdout_contains: ['"version"']
    probes:
      - name: seeded server still rejects unauthenticated database reads
        argv: [mongosh, --host, mongodb, --quiet, --eval, 'try { db.getSiblingDB("packtest").orders.findOne(); quit(1); } catch (error) { if (error.code !== 13) throw error; print("unauthenticated read denied"); }']
        expect:
          stdout_contains: [unauthenticated read denied]
  - action: mongo.collection_list
    args: {database: packtest}
    expect:
      stdout_contains: [orders]
  - action: mongo.collection_stats
    args: {database: packtest, collection: orders}
    expect:
      stdout_contains: ['"ns":"packtest.orders"', '"count":3']
  - action: mongo.concurrent_transactions
    expect:
      stdout_contains: [read, write]
  - action: mongo.connection_stats
    expect:
      stdout_contains: ['"current"', '"available"']
  - action: mongo.connections
    expect:
      stdout_contains: ['"numClientConnections"']
  - action: mongo.current_op
    expect:
      stdout_contains: ['"inprog"']
  - action: mongo.cursor_stats
    expect:
      stdout_contains: ['"open"']
  - action: mongo.db_list
    expect:
      stdout_contains: ['"databases"', packtest]
  - action: mongo.db_stats
    args: {database: packtest}
    expect:
      stdout_contains: ['"db":"packtest"', '"collections"']
  - action: mongo.explain_query
    args:
      database: packtest
      collection: orders
      # Leading whitespace keeps the runner CLI from decoding this string as
      # an object before the action passes it to JSON.parse.
      filter_json: ' {"status":"paid"}'
    expect:
      stdout_contains: ['"queryPlanner"', status_1]
      # The tier promise: `executionStats` verbosity RUNS the winning plan to
      # completion, so a low-risk auto-running action must not ask for it.
      stdout_not_contains: ['"executionStats"']
  - action: mongo.get_parameter
    expect:
      stdout_contains: ['"authenticationMechanisms"']
  - action: mongo.global_lock
    expect:
      stdout_contains: ['"totalTime"']
  - action: mongo.host_info
    expect:
      stdout_contains: ['"system"', '"os"']
  - action: mongo.index_stats
    args: {database: packtest, collection: orders}
    expect:
      stdout_contains: [customer_1, status_1]
  - name: mongo.index_builds-shows-another-users-build
    action: mongo.index_builds
    arrange:
      - argv: [mongosh, --nodb, --quiet, --eval, 'db=new Mongo(process.env.MONGO_URI).getDB("admin");db.adminCommand({configureFailPoint:"hangAfterInitializingIndexBuild",mode:"alwaysOn"})']
      - argv: [/bin/sh, -c, 'nohup mongosh "mongodb://packtest-index-builder:packtest-index-builder-734a@mongodb:27017/packtest?authSource=packtest" --quiet --eval ''db.runCommand({createIndexes:"orders",indexes:[{key:{packtest_cross_user:1},name:"packtest_cross_user_1"}],comment:"packtest-index-build-cross-user"})'' >/tmp/packtest-index-build.log 2>&1 &']
      - argv: [mongosh, --nodb, --quiet, --eval, 'db=new Mongo(process.env.MONGO_URI).getDB("admin");var visible=db.aggregate([{$currentOp:{allUsers:true,idleConnections:true}},{$match:{"command.comment":"packtest-index-build-cross-user"}}]).toArray().length>0;print(visible?"visible":"")']
        expect:
          stdout_contains: [visible]
        retry_for: 15s
        retry_every: 250ms
    expect:
      stdout_contains: [packtest-index-build-cross-user]
    probes:
      - name: release the held index build
        argv: [mongosh, --nodb, --quiet, --eval, 'db=new Mongo(process.env.MONGO_URI).getDB("admin");db.adminCommand({configureFailPoint:"hangAfterInitializingIndexBuild",mode:"off"})']
        expect:
          stdout_contains: ["ok: 1"]
      - name: the other users index completes
        argv: [mongosh, --nodb, --quiet, --eval, 'db=new Mongo(process.env.MONGO_URI).getDB("admin");print(db.getSiblingDB("packtest").orders.getIndexes().filter(function(index){return index.name==="packtest_cross_user_1"}).length)']
        expect:
          stdout_contains: ["1"]
        retry_for: 15s
        retry_every: 250ms
  - action: mongo.drop_index
    # Create a throwaway index, drop it by name, and confirm it's gone.
    args:
      db_name: packtest
      collection: orders
      index_name: packtest_drop_idx
    arrange:
      - argv: [/bin/sh, -c, 'mongosh --nodb --quiet --eval "db=new Mongo(process.env.MONGO_URI).getDB(\"admin\");db.getSiblingDB(\"packtest\").getCollection(\"orders\").createIndex({packtest_drop_field:1},{name:\"packtest_drop_idx\"})"']
    expect:
      stdout_contains: [nIndexesWas]
    probes:
      - argv: [/bin/sh, -c, 'mongosh --nodb --quiet --eval "db=new Mongo(process.env.MONGO_URI).getDB(\"admin\");print(db.getSiblingDB(\"packtest\").getCollection(\"orders\").getIndexes().filter(function(i){return i.name===\"packtest_drop_idx\"}).length)"']
        expect:
          stdout_contains: ["0"]
  - action: mongo.kill_op
    # Start a long, interruptible op — a find over many docs whose $where sleeps
    # ~50ms per doc, so mongod checks for a kill between docs — identified by its
    # own collection namespace, resolve its opid from currentOp, then kill it.
    arrange:
      - argv: [mongosh, --nodb, --quiet, --eval, "db=new Mongo(process.env.MONGO_URI).getDB('admin');db.getSiblingDB('packtest').killop_fixture.insertMany(Array.from({length:400},function(_,i){return {n:i}}))"]
      - argv: ["/bin/sh", "-c", "nohup mongosh --nodb --quiet --eval 'db=new Mongo(process.env.MONGO_URI).getDB(\"admin\");db.getSiblingDB(\"packtest\").killop_fixture.find({$where:\"var e=new Date().getTime()+50;while(new Date().getTime()<e){};return true;\"}).toArray()' >/tmp/packtest-killop.log 2>&1 &"]
    resolve_args:
      opid:
        argv: [mongosh, --nodb, --quiet, --eval, "db=new Mongo(process.env.MONGO_URI).getDB('admin');var op=db.currentOp(true).inprog.find(function(o){return o.active && o.ns==='packtest.killop_fixture'});print(op ? op.opid : '')"]
        retry_for: 15s
        retry_every: 500ms
    expect:
      stdout_contains: ["attempting to kill op"]
    probes:
      - argv: [mongosh, --nodb, --quiet, --eval, "db=new Mongo(process.env.MONGO_URI).getDB('admin');print(db.currentOp(true).inprog.filter(function(o){return o.active && o.ns==='packtest.killop_fixture'}).length)"]
        expect:
          stdout_contains: ["0"]
        retry_for: 15s
        retry_every: 500ms
  - action: mongo.profiler_status
    args: {database: packtest}
    expect:
      stdout_contains: ['"was"', '"slowms"']
  - action: mongo.server_status
    expect:
      stdout_contains: ['"host"', '"connections"', '"version"']
  - action: mongo.top
    arrange:
      # Arrange the read whose collection-level counter the action must report.
      - argv:
          - /bin/sh
          - -c
          - mongosh "$MONGO_URI" --quiet --eval 'db.getSiblingDB("packtest").orders.find().toArray()'
    expect:
      stdout_contains: ['"totals"', packtest.orders]
  - action: mongo.wiredtiger_cache
    expect:
      stdout_contains: [maximum, bytes]

  # Compact the seeded collection on the same standalone mongod used by the
  # rest of the plan.
  - action: mongo.compact_collection
    args: {db_name: packtest, collection: orders}
    expect:
      stdout_contains: ["ok: 1"]
    probes:
      - argv: [/bin/sh, -c, 'mongosh --nodb --quiet --eval "db=new Mongo(process.env.MONGO_URI).getDB(\"packtest\");print(JSON.stringify(db.orders.countDocuments()))"']
        expect:
          stdout_contains: ["3"]
