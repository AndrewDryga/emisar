services: [mongodb]
versions:
  - version: "8.2.5"
    digest: "@sha256:60aa240412f473f672ec8b282fd5651aa156dcc7a220f81f5381ce768ccc3167"
    default: true
  - version: "7.0.17"
    digest: "@sha256:ac9e83c57e32bf767f875ac2b9a9d87800d2d91a7829180c3a4826e0599698e8"
secret_env: [MONGO_URI]
env:
  MONGO_URI: "mongodb://root:packtest-canary-mongodb-c936@mongodb:27017/?authSource=admin"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: mongo.build_info
    expect:
      stdout_contains: ['"version"']
  - action: mongo.collection_list
    args: {database: packtest}
    expect:
      stdout_contains: [orders]
  - action: mongo.collection_stats
    args: {database: packtest, collection: orders}
    expect:
      stdout_contains: ['"ns":"packtest.orders"', '"count":3']
  - action: mongo.concurrent_transactions
    expect:
      stdout_contains: [read, write]
  - action: mongo.connection_stats
    expect:
      stdout_contains: ['"current"', '"available"']
  - action: mongo.connections
    expect:
      stdout_contains: ['"numClientConnections"']
  - action: mongo.current_op
    expect:
      stdout_contains: ['"inprog"']
  - action: mongo.cursor_stats
    expect:
      stdout_contains: ['"open"']
  - action: mongo.db_list
    expect:
      stdout_contains: ['"databases"', packtest]
  - action: mongo.db_stats
    args: {database: packtest}
    expect:
      stdout_contains: ['"db":"packtest"', '"collections"']
  - action: mongo.explain_query
    args:
      database: packtest
      collection: orders
      # Leading whitespace keeps the runner CLI from decoding this string as
      # an object before the action passes it to JSON.parse.
      filter_json: ' {"status":"paid"}'
    expect:
      stdout_contains: ['"executionStats"', status_1]
  - action: mongo.get_parameter
    expect:
      stdout_contains: ['"authenticationMechanisms"']
  - action: mongo.global_lock
    expect:
      stdout_contains: ['"totalTime"']
  - action: mongo.host_info
    expect:
      stdout_contains: ['"system"', '"os"']
  - action: mongo.index_stats
    args: {database: packtest, collection: orders}
    expect:
      stdout_contains: [customer_1, status_1]
  - action: mongo.profiler_status
    args: {database: packtest}
    expect:
      stdout_contains: ['"was"', '"slowms"']
  - action: mongo.server_status
    expect:
      stdout_contains: ['"host"', '"connections"', '"version"']
  - action: mongo.top
    expect:
      stdout_contains: ['"totals"', packtest.orders]
  - action: mongo.wiredtiger_cache
    expect:
      stdout_contains: [maximum, bytes]
