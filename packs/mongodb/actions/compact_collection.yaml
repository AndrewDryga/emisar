schema_version: 1
id: mongo.compact_collection
title: db.runCommand({compact:"<coll>"})
kind: exec
risk: high
description: >
  Compact one collection on the connected node. Reclaims disk for
  WiredTiger after large deletes. Compaction does not block CRUD on the
  collection on supported releases, but it is I/O heavy: its frequent
  checkpoints can raise read latency and replication lag and delay
  backups while it runs. The command is not replicated, and a replica
  set primary refuses it (no `force` is passed), so run it on each
  secondary in a low-traffic window.
side_effects:
  - Heavy disk I/O and checkpoints until compaction finishes; reads and writes keep working but may slow.
  - Disk usage drops.
  - Other collections unaffected.
args:
  - name: db_name
    type: string
    required: true
    description: Database name.
    validation:
      pattern: "^[a-zA-Z0-9_\\-]{1,64}$"
  - name: collection
    type: string
    required: true
    description: Collection name.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "mongosh --nodb --quiet --eval \"db=new Mongo(process.env.MONGO_URI).getDB('admin');db.getSiblingDB('${1}').runCommand({compact: '${2}'})\""
      - "emisar"
      - "{{ args.db_name }}"
      - "{{ args.collection }}"
  timeout: 30m
  cancel_grace: 60s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Compact after a large delete
    args:
      db_name: "analytics"
      collection: "events"
