schema_version: 1
id: mongo.oplog_size
title: Oplog size and entry count
kind: exec
risk: low
description: 'Show oplog collection size, configured maximum size, and entry count (`collStats` on `local.oplog.rs`). Returns no timestamps; the oplog time window ("how far can a secondary fall behind?") is `mongo.replication_info`.'
side_effects:
  - Reads oplog metadata.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "mongosh '--nodb' '--quiet' '--eval' \"db=new Mongo(process.env.MONGO_URI).getDB('admin');JSON.stringify(db.getSiblingDB('local').runCommand({collStats:'oplog.rs'}))\""
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Oplog stats
    args: {}
