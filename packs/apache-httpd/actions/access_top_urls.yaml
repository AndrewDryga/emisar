schema_version: 1
id: httpd.access_top_urls
title: Top URLs from access log
kind: exec
risk: low
description: >
  Show a tally of request paths from the last N access log lines. The query
  string is stripped before the tally, so a one-shot credential in a
  password-reset, magic-link, or OAuth callback URL never leaves the host.
side_effects:
  - One file read.
  - Read-only.
args:
  - name: lines
    type: integer
    required: false
    default: 100000
    description: How many access-log lines to read.
    validation:
      min: 100
      max: 1000000
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The pipeline exits with head's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "no traffic".
      - |
        log="${HTTPD_ACCESS_LOG:-/var/log/apache2/access.log}"
        [ -r "$log" ] || { echo "access log not readable: $log" >&2; exit 1; }
        tail -n {{ args.lines }} "$log" | awk '{split($7, u, "?"); print u[1]}' | sort | uniq -c | sort -rn | head -50
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Top URLs
    args: {}
