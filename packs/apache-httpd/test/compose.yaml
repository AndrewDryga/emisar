services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/apache-httpd/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.4.68}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-apache-httpd-tools:latest
    network_mode: service:apache-httpd
    volumes:
      - apache_logs:/usr/local/apache2/logs
      - ${EMISAR_ROOT}/packs/apache-httpd/test/fixtures/packtest.conf:/usr/local/apache2/conf/extra/packtest.conf:ro

  apache-httpd:
    image: httpd:${PACKTEST_VERSION:-2.4.68}${PACKTEST_DIGEST-}
    command:
      - /bin/sh
      - -c
      - printf '\nInclude conf/extra/packtest.conf\n' >> /usr/local/apache2/conf/httpd.conf && exec httpd-foreground
    volumes:
      - apache_logs:/usr/local/apache2/logs
      - ${EMISAR_ROOT}/packs/apache-httpd/test/fixtures/packtest.conf:/usr/local/apache2/conf/extra/packtest.conf:ro
    healthcheck:
      test: ["CMD", "httpd", "-t"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  apache_logs:
