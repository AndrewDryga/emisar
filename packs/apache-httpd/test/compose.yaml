services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/apache-httpd/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.4.68}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-apache-httpd-tools:latest
    network_mode: service:apache-httpd
    # apachectl graceful/graceful-stop signal the master via the pid file in
    # the shared logs volume, so the runner must live in the SUT's pid
    # namespace for the kill to reach it.
    pid: service:apache-httpd
    volumes:
      - apache_logs:/usr/local/apache2/logs
      - ${EMISAR_ROOT}/packs/apache-httpd/test/fixtures/packtest.conf:/usr/local/apache2/conf/extra/packtest.conf:ro

  apache-httpd:
    image: httpd:${PACKTEST_VERSION:-2.4.68}${PACKTEST_DIGEST-}
    command:
      - /bin/sh
      - -c
      # The shell stays PID 1: if httpd were PID 1, graceful_stop's exit would
      # tear down the shared pid namespace and SIGKILL the probing runner
      # before it can observe the stopped state.
      - printf '\nInclude conf/extra/packtest.conf\n' >> /usr/local/apache2/conf/httpd.conf && httpd-foreground; tail -f /dev/null
    # PID 1 is a shell that ignores SIGTERM; skip the 10s stop timeout on this
    # disposable fixture.
    stop_grace_period: 2s
    volumes:
      - apache_logs:/usr/local/apache2/logs
      - ${EMISAR_ROOT}/packs/apache-httpd/test/fixtures/packtest.conf:/usr/local/apache2/conf/extra/packtest.conf:ro
    healthcheck:
      test: ["CMD", "httpd", "-t"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  apache_logs:
