services: [apache-httpd]
versions:
  - version: "2.4.68"
    digest: "@sha256:305fd8326a27a137fedb8900f26375699ab233cc37793f35cf5d7c65671fb252"
    default: true
env:
  HTTPD_ACCESS_LOG: /usr/local/apache2/logs/access_log
  HTTPD_ERROR_LOG: /usr/local/apache2/logs/error_log
  HTTPD_STATUS_URL: http://127.0.0.1/server-status?auto
cases:
  - action: httpd.version
    expect:
      stdout_contains: [Server version, Apache]
  - action: httpd.modules
    expect:
      stdout_contains: [Loaded Modules, core_module]
  - action: httpd.vhosts
    expect:
      stdout_contains: [ServerRoot, DocumentRoot]
  - action: httpd.test_config
    expect:
      stderr_contains: [Syntax OK]
  - action: httpd.status
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    expect:
      stdout_contains: [ServerVersion, BusyWorkers]
  - name: httpd.status-http-error
    action: httpd.status
    env:
      HTTPD_STATUS_URL: http://127.0.0.1/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: httpd.error_tail
    expect:
      stdout_contains: [resuming normal operations]
  - action: httpd.access_top_clients
    args: {lines: 100}
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
    expect:
      stdout_contains: [127.0.0.1]
  # The arranged request carries a query string, because the tally groups on
  # the log's request field and that field holds the query verbatim. The path
  # must survive; the token must not.
  - action: httpd.access_top_urls
    args: {lines: 100}
    arrange:
      - argv: [curl, -sS, -o, /dev/null, "http://127.0.0.1/packtest?token=packtest-canary-httpd-url-3b71"]
    expect:
      stdout_contains: [/packtest]
      stdout_not_contains: [packtest-canary-httpd-url-3b71]
  - action: httpd.graceful_reload
    runner_user: root
    runner_reason: apachectl signals the root-owned httpd master; the kernel rejects SIGUSR1 from the non-root runner.
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    probes:
      # The master announces the signal it actually received: every 2.4 MPM
      # logs AH00493, not the AH00171 "Graceful restart requested" line that
      # only the -k caller emits.
      - name: master logged the graceful restart
        argv: [grep, AH00493, /usr/local/apache2/logs/error_log]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: ["Doing graceful restart"]
      - name: workers respawned and still serve
        argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: ["It works!"]
  # Terminal case: the drained master does not come back, but this case owns
  # its disposable Compose project, so nothing after it shares the fixture.
  - action: httpd.graceful_stop
    runner_user: root
    runner_reason: apachectl signals the root-owned httpd master; the kernel rejects SIGWINCH from the non-root runner.
    arrange:
      - argv: [curl, -fsS, http://127.0.0.1/]
        retry_for: 20s
        retry_every: 1s
    probes:
      - name: httpd stopped serving
        argv: [/bin/sh, -c, "curl -fsS -m 2 http://127.0.0.1/ >/dev/null 2>&1 || echo stopped"]
        retry_for: 30s
        retry_every: 1s
        expect:
          stdout_contains: [stopped]
