schema_version: 1
id: gcp.service_account_policy
title: gcloud iam service-accounts get-iam-policy
kind: exec
risk: low
description: >
  Show the IAM policy attached to one service account, including bindings,
  members, conditions, etag, and policy version.
side_effects:
  - One read-only IAM API call.
  - Returns principal identities present in the policy.
search_terms:
  - service account impersonation
  - workloadIdentityUser
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: service_account
    type: string
    required: true
    description: Full service-account email address.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com$"
execution:
  command:
    binary: gcloud
    argv:
      - iam
      - service-accounts
      - get-iam-policy
      - "{{ args.service_account }}"
      - "--project={{ args.project }}"
      - --format=json
      - --quiet
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384
examples:
  - title: Service-account bindings
    args:
      project: example-prod
      service_account: deployer@example-prod.iam.gserviceaccount.com
