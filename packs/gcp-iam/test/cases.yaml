services: [gcp-api]
versions:
  - version: 587.0.0-slim
    digest: "@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f"
    default: true
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_IAM: http://gcp-api:8080/
  CLOUDSDK_API_ENDPOINT_OVERRIDES_CLOUDRESOURCEMANAGER: http://gcp-api:8080/
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-iam-access-token-093f
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-iam-access-token-093f]
cases:
  - name: gcp.projects-discovers-across-pages
    action: gcp.projects
    expect:
      json:
        /0/projectId: example-prod
        /0/projectNumber: '1001'
        /0/name: Example production
        /0/lifecycleState: ACTIVE
        /1/projectId: example-staging
      stdout_not_contains: [labels, private-fixture-label, createTime, DELETE_REQUESTED]
  - name: gcp.projects-respects-limit
    action: gcp.projects
    args: {limit: 1}
    expect:
      json:
        /0/projectId: example-prod
      stdout_not_contains: [example-staging]
  - name: gcp.projects-empty
    action: gcp.projects
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_CLOUDRESOURCEMANAGER: http://gcp-api:8080/empty/
    expect:
      json:
        '': []
  - name: gcp.projects-maximum-limit
    action: gcp.projects
    args: {limit: 500}
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_CLOUDRESOURCEMANAGER: http://gcp-api:8080/large/
    expect:
      json:
        /499/projectId: fixture-project-499
        /499/lifecycleState: ACTIVE
      stdout_not_contains: [fixture-project-500, labels, private-fixture-label]
  - name: gcp.projects-permission-denied
    action: gcp.projects
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_CLOUDRESOURCEMANAGER: http://gcp-api:8080/denied/
    expect:
      status: failure
      exit: [1]
      stdout_not_empty: false
      stderr_contains: [PERMISSION_DENIED]
  - name: gcp.projects-unauthenticated
    action: gcp.projects
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_CLOUDRESOURCEMANAGER: http://gcp-api:8080/unauthenticated/
    expect:
      status: failure
      exit: [1]
      stdout_not_empty: false
      stderr_contains: [UNAUTHENTICATED]
  - name: gcp.projects-rejects-zero-limit
    action: gcp.projects
    args: {limit: 0}
    expect:
      status: failure
      stdout_not_empty: false
      reason: argument_invalid
      error_contains: [must be >= 1]
  - name: gcp.projects-rejects-excessive-limit
    action: gcp.projects
    args: {limit: 501}
    expect:
      status: failure
      stdout_not_empty: false
      reason: argument_invalid
      error_contains: [must be <= 500]
  - action: gcp.workload_identity_pools
    args: {project: example-prod, limit: 5}
    expect:
      stdout_contains: [harness-pool, ACTIVE, Harness automation identities]
  - action: gcp.wif_provider_describe
    args:
      project: example-prod
      pool_id: harness-pool
      provider_id: harness-provider
    expect:
      stdout_contains: [harness-provider, https://issuer.example.test, attribute.repository]
  - action: gcp.service_account_policy
    args:
      project: example-prod
      service_account: runtime@example-prod.iam.gserviceaccount.com
    expect:
      stdout_contains:
        - roles/iam.workloadIdentityUser
        - principalSet://iam.googleapis.com/projects/1001/locations/global/workloadIdentityPools/harness-pool/*
