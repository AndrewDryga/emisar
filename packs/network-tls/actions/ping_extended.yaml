schema_version: 1
id: net.ping_extended
title: ping (with count + timeout)
kind: exec
risk: low
description: >
  Send N ICMP echo requests with explicit per-probe timeout. Needs CAP_NET_RAW on the runner identity where the host does not open `net.ipv4.ping_group_range`: ping ships setuid or file-capability elevation, and the runner's `no_new_privs` blocks both, so grant the capability from this pack's setup before enabling the action.
side_effects:
  - Outbound ICMP.
  - Read-only.
  - Opens an ICMP socket, so it fails without CAP_NET_RAW on a host with a closed ping group range.
search_terms:
  - unreachable
args:
  - name: host
    type: string
    required: true
    description: Target hostname or IP.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-:]{0,252}$"
  - name: count
    type: integer
    required: false
    default: 10
    description: Probes.
    validation:
      min: 1
      max: 100
  - name: timeout
    type: integer
    required: false
    default: 2
    description: Per-probe timeout seconds.
    validation:
      min: 1
      max: 10
execution:
  command:
    binary: ping
    argv:
      - "-c"
      - "{{ args.count }}"
      - "-W"
      - "{{ args.timeout }}"
      - "{{ args.host }}"
  timeout: 120s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: 10 probes to 1.1.1.1
    args:
      host: "1.1.1.1"
