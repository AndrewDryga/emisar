schema_version: 1
id: net.tls_chain_dump
title: TLS chain dump
kind: exec
risk: low
description: Dump the full certificate chain a server returns. Use to debug "browsers see incomplete chain" errors.
side_effects:
  - One openssl s_client connection.
  - Read-only.
search_terms:
  - missing intermediate
args:
  - name: host
    type: string
    required: true
    description: Host.
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{1,253}$"
  - name: port
    type: integer
    required: false
    default: 443
    description: Port.
    validation:
      min: 1
      max: 65535
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - |
        set -eu
        status=0
        handshake=$(openssl s_client -connect "$1":{{ args.port }} -servername "$1" -showcerts </dev/null 2>/dev/null) || status=$?
        # Print only the first server-sent chain, never later session or peer text.
        printf '%s\n' "$handshake" | awk '
          /^Certificate chain$/ && !seen { seen=1; printing=1 }
          printing { print }
          printing && /^---$/ { printing=0 }
        '
        if [ "$status" -ne 0 ]; then
          printf 'TLS connection to %s:%s failed\n' "$1" '{{ args.port }}' >&2
        fi
        exit "$status"
      - "emisar"
      - "{{ args.host }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Chain for example.com
    args:
      host: "example.com"
