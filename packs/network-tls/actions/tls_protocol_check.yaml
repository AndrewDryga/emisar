schema_version: 1
id: net.tls_protocol_check
title: TLS protocol support check
kind: script
risk: low
description: >
  Probe TLS 1.0/1.1/1.2/1.3 support on host:port one at a time, reporting which versions the server accepts. Use for compliance audits ("is TLS 1.0 still on?"). Fails outright when the target cannot be reached, and reports a version this runner's OpenSSL cannot offer as UNSUPPORTED-BY-CLIENT rather than REFUSED. Runs with OPENSSL_CONF=/dev/null so the host's system MinProtocol floor (TLSv1.2 on Debian) doesn't pre-fail the 1.0/1.1 probes — each result reflects the server, not the client.
side_effects:
  - One outbound reachability probe plus up to 4 version handshakes.
  - Read-only.
search_terms:
  - weak tls
args:
  - name: host
    type: string
    required: true
    description: Host.
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{1,253}$"
  - name: port
    type: integer
    required: false
    default: 443
    description: Port.
    validation:
      min: 1
      max: 65535
execution:
  script:
    path: scripts/tls_protocol_check.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.host }}"
    - "{{ args.port }}"
  env:
    OPENSSL_CONF: /dev/null
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 2048
  max_stderr_bytes: 4096
examples:
  - title: TLS support matrix
    args:
      host: "example.com"
