schema_version: 1
id: net.http_headers
title: HTTP response headers (curl -I)
kind: script
risk: low
description: >
  Dump response headers from a URL, following redirects. Use to confirm
  cache-control / hsts / set-cookie / cors setup. Set insecure=true to
  skip TLS verification for an internal or self-signed certificate.
  An optional resolve mapping selects one IP for the URL's exact hostname and
  port while preserving Host, SNI, and certificate verification. Redirects
  keep that mapping only for the same hostname and port; other destinations
  use normal DNS. A mapping bypasses proxies for the whole redirect chain;
  without it, normal proxy settings apply.
side_effects:
  - One curl HEAD request plus up to five HTTP(S) redirects.
  - Read-only.
search_terms:
  - what headers does it return
  - check a redirect

args:
  - name: url
    type: string
    required: true
    description: URL.
    validation:
      max_length: 520
      pattern: "^https?://[a-zA-Z0-9.:/_\\-?=&%+\\[\\]]{1,512}$"
  - name: resolve
    type: string
    required: false
    default: ""
    description: "One hostname:port:IP mapping matching the URL's hostname and effective port (80 for HTTP, 443 for HTTPS). Use a literal IPv4 or bracketed IPv6 address, for example example.com:443:[2001:db8::1]."
    validation:
      max_length: 512
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9.\\-]{0,252}:[1-9][0-9]{0,4}:([0-9]{1,3}(\\.[0-9]{1,3}){3}|\\[[0-9a-fA-F:.]{2,45}\\]))?$"
  - name: insecure
    type: boolean
    required: false
    default: false
    description: Skip TLS certificate verification (curl -k). Use for internal or self-signed certs.
execution:
  script:
    path: scripts/http.sh
    interpreter: /bin/sh
  argv: [headers, "{{ args.url }}", "{{ args.resolve }}", "{{ args.insecure }}", "10"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Headers for example.com
    args:
      url: "https://example.com/"
