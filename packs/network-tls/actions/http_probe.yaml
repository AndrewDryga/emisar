schema_version: 1
id: net.http_probe
title: HTTP probe with timing
kind: script
risk: low
description: >
  Probe a URL with curl, returning HTTP status, DNS / TCP / TLS / total
  timings, and bytes transferred. Use as a synthetic check. Set
  insecure=true to skip TLS verification when the endpoint serves an
  internal or self-signed certificate (otherwise such a probe reports
  http_code=000). HTTP 4xx and 5xx responses are successful probe executions:
  the status is the evidence, not a reason to repeat the same request. A DNS,
  connection, or TLS failure exits unsuccessfully with curl's diagnostic; do
  not retry it unchanged unless the target may have recovered.
  An optional resolve mapping selects one destination IP for the URL's exact
  hostname and port, without changing Host, SNI, or certificate verification.
  A mapping bypasses proxies for this request; without it, normal proxy and
  DNS settings apply. This probe does not follow redirects.
side_effects:
  - Outbound HTTP(S) to the URL.
  - Read-only.
search_terms:
  - site down
  - website unreachable
  - is the site up
  - slow website
args:
  - name: url
    type: string
    required: true
    description: URL to probe.
    validation:
      max_length: 520
      pattern: "^https?://[a-zA-Z0-9.:/_\\-?=&%+\\[\\]]{1,512}$"
  - name: resolve
    type: string
    required: false
    default: ""
    description: "One hostname:port:IP mapping matching the URL's hostname and effective port (80 for HTTP, 443 for HTTPS). Use a literal IPv4 or bracketed IPv6 address, for example example.com:443:[2001:db8::1]."
    validation:
      max_length: 512
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9.\\-]{0,252}:[1-9][0-9]{0,4}:([0-9]{1,3}(\\.[0-9]{1,3}){3}|\\[[0-9a-fA-F:.]{2,45}\\]))?$"
  - name: max_time
    type: integer
    required: false
    default: 10
    description: Max total seconds.
    validation:
      min: 1
      max: 60
  - name: insecure
    type: boolean
    required: false
    default: false
    description: Skip TLS certificate verification (curl -k). Use for internal or self-signed certs.
execution:
  script:
    path: scripts/http.sh
    interpreter: /bin/sh
  argv: [probe, "{{ args.url }}", "{{ args.resolve }}", "{{ args.insecure }}", "{{ args.max_time }}"]
  timeout: 90s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Probe example.com
    args:
      url: "https://example.com/"
  - title: Probe an internal endpoint with a self-signed cert
    args:
      url: "https://10.0.0.5:8443/healthz"
      insecure: true
  - title: Check a new backend before changing DNS
    args:
      url: "https://example.com/healthz"
      resolve: "example.com:443:192.0.2.10"
