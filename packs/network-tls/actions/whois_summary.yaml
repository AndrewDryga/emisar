schema_version: 1
id: net.whois_summary
title: Domain registration summary
kind: script
risk: low
description: >
  Show registrar, dates and nameservers from WHOIS, falling back to RDAP when
  WHOIS fails or has no recognized fields. RDAP uses IANA's DNS bootstrap and
  returns only registrar names/IDs, domain events and nameserver names, not
  contact records. Accepts ASCII or punycode domain names. Bounds each response
  to 16 MiB and clips the rendered summary at 8 KiB with a notice. A failed or
  missing lookup does not establish that a domain is available to register.
side_effects:
  - One WHOIS lookup; on fallback, one IANA bootstrap and one RDAP domain request.
  - Read-only. Does not follow HTTP redirects or RDAP referrals.
search_terms:
  - who owns this domain
  - domain expiry

args:
  - name: domain
    type: string
    required: true
    description: ASCII or punycode domain; an optional trailing dot is normalized.
    validation:
      max_length: 254
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-]{0,253}$"
execution:
  script:
    path: scripts/whois_summary.sh
    interpreter: bash
  argv:
    - "{{ args.domain }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Registration details for example.dev
    args: {domain: example.dev}
