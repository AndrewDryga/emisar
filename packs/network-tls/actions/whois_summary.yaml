schema_version: 1
id: net.whois_summary
title: whois (registrar + expiry)
kind: exec
risk: low
description: Show filtered whois output — registrar, dates, name servers. Use to check "is this domain about to expire?"
side_effects:
  - One whois query to the registry.
  - Read-only.
args:
  - name: domain
    type: string
    required: true
    description: Domain.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-]{0,252}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Empty output here reads as "domain not registered", so a transport
      # failure must never look like one. whois exits non-zero on transport
      # errors; the pipe discarded that. Residual this cannot fix: a rate-limit
      # reply ("WHOIS LIMIT EXCEEDED") or an unusual ccTLD field set arrives as
      # exit-0 text that the filter drops — hence the note on a dropped reply.
      - |
        raw=$(whois "$1"); status=$?
        printf '%s\n' "$raw" | grep -iE 'registrar|registry|domain name|expir|name server|status' | head -30
        if [ "$status" -eq 0 ] && [ -n "$raw" ] && \
           ! printf '%s\n' "$raw" | grep -qiE 'registrar|registry|domain name|expir|name server|status'; then
          echo "whois replied but no summary fields matched — raw reply may be a rate-limit or an unusual ccTLD format" >&2
        fi
        exit $status
      - "emisar"
      - "{{ args.domain }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: whois example.com
    args:
      domain: "example.com"
