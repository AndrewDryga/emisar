schema_version: 1
id: net.tls_cert_expiry
title: TLS cert expiry probe
kind: script
risk: low
description: >
  Connect to host:port with SNI and show certificate subject, issuer, notBefore,
  and notAfter. Connection, DNS, plaintext, and handshake failures retain the
  OpenSSL diagnostic instead of being reported as a certificate parse error.
  Use for "when does this cert expire?" alerts.
side_effects:
  - One openssl s_client connection.
  - Read-only.
search_terms:
  - renewal
  - certificate error
args:
  - name: host
    type: string
    required: true
    description: Host to probe.
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{1,253}$"
  - name: port
    type: integer
    required: false
    default: 443
    description: Port.
    validation:
      min: 1
      max: 65535
  - name: sni
    type: string
    required: false
    default: ""
    description: SNI override (default = host).
    validation:
      pattern: "^[a-zA-Z0-9.\\-]{0,253}$"
execution:
  script:
    path: scripts/tls_cert_expiry.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.host }}"
    - "{{ args.port }}"
    - "{{ args.sni }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Cert for example.com
    args:
      host: "example.com"
