services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/network-tls/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
    image: emisar-packtest-network-tls-tools:latest
    # Fixture-only listeners exercise implicit HTTP/HTTPS ports without making
    # the runner root or granting a host capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
      net.ipv6.conf.all.disable_ipv6: "0"

  tcp:
    image: nginx:${PACKTEST_VERSION:-1.31.5}${PACKTEST_DIGEST-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 2s
      start_period: 20s
      start_interval: 1s
      retries: 20
