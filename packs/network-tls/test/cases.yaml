services: [tcp, rdap-api]
secret_env: [RDAP_RESPONSE_CANARY]
env:
  RDAP_RESPONSE_CANARY: packtest-canary-rdap-contact-62c37
versions:
  - version: "1.31.5"
    digest: "@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4"
    default: true
cases:
  - name: net.whois_summary-rdap
    action: net.whois_summary
    args: {domain: EXAMPLE.DEV.}
    env:
      NET_RDAP_PACKTEST: '1'
      NET_RDAP_BOOTSTRAP_URL: http://rdap-api:8080/bootstrap.json
      PACKTEST_WHOIS_MODE: failure
      PATH: /opt/packtest-whois/bin:/opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      stdout_contains: [Fixture RDAP Registrar, '2030-01-02T03:04:05Z', ns1.example.dev]
      stdout_not_contains: [contact, registrant, email, remarks, eventActor]
    probes:
      - argv: [bash, /packs/network-tls/test/fixtures/rdap-matrix.sh, fallback]
        expect: {stdout_contains: ['RDAP fallback: 7 executor cases verified']}
      - argv: [bash, /packs/network-tls/test/fixtures/rdap-matrix.sh, bootstrap]
        expect: {stdout_contains: ['RDAP bootstrap: 11 executor cases verified']}
      - argv: [bash, /packs/network-tls/test/fixtures/rdap-matrix.sh, responses]
        expect: {stdout_contains: ['RDAP responses: 11 executor cases verified']}
      - argv: [bash, /packs/network-tls/test/fixtures/rdap-matrix.sh, bounds]
        expect: {stdout_contains: ['RDAP bounds: 4 executor cases verified']}
      - argv: [bash, /packs/network-tls/test/fixtures/rdap-matrix.sh, inputs]
        expect: {stdout_contains: ['RDAP inputs: 13 executor cases verified']}
  - name: net.tls_protocol_check-tls1
    action: net.tls_protocol_check
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start, tls1]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, verify-legacy, tls1]
        expect: {stdout_contains: [completed TLSv1 handshake]}
    expect:
      stdout_contains: ['tls1: OK', 'tls1_1: REFUSED', 'tls1_2: REFUSED', 'tls1_3: REFUSED']
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]
  - name: net.tls_protocol_check-tls1_1
    action: net.tls_protocol_check
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start, tls1_1]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, verify-legacy, tls1_1]
        expect: {stdout_contains: [completed TLSv1.1 handshake]}
    expect:
      stdout_contains: ['tls1: REFUSED', 'tls1_1: OK', 'tls1_2: REFUSED', 'tls1_3: REFUSED']
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]
  - name: net.tls_protocol_check-tls1_2
    action: net.tls_protocol_check
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start, tls1_2]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
    expect:
      stdout_contains: ['tls1: REFUSED', 'tls1_1: REFUSED', 'tls1_2: OK', 'tls1_3: REFUSED']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, Resumption PSK]
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]
  - name: net.tls_protocol_check-tls1_3
    action: net.tls_protocol_check
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start, tls1_3]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
    expect:
      stdout_contains: ['tls1: REFUSED', 'tls1_1: REFUSED', 'tls1_2: REFUSED', 'tls1_3: OK']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, Resumption PSK]
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]
  - name: net.tls_protocol_check-closed-port
    action: net.tls_protocol_check
    args: {host: 127.0.0.1, port: 24444}
    expect:
      status: failure
      stderr_contains: ['cannot reach 127.0.0.1:24444']
      stdout_not_contains: ['tls1:']
  - name: net.tls_protocol_check-dns-failure
    action: net.tls_protocol_check
    args: {host: does-not-exist.invalid, port: 443}
    expect:
      status: failure
      stderr_contains: ['cannot reach does-not-exist.invalid:443']
      stdout_not_contains: ['tls1:']
  - name: net.tls_protocol_check-plaintext
    action: net.tls_protocol_check
    args: {host: tcp, port: 80}
    expect:
      stdout_contains: ['tls1: REFUSED', 'tls1_1: REFUSED', 'tls1_2: REFUSED', 'tls1_3: REFUSED']
  - name: net.http_probe-verified-address-mapping
    action: net.http_probe
    args: {url: 'https://packtest.invalid:24443/selected', resolve: 'packtest.invalid:24443:127.0.0.1'}
    env: {CURL_CA_BUNDLE: /tmp/packtest-net-fixture/ca.crt}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect:
      stdout_contains: [http_code=201, appconnect=]
    probes:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, observe]
        expect: {stdout_contains: [HTTP Host and TLS SNI retained]}
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, matrix, addresses]
        expect: {stdout_contains: [HTTP addresses contract verified]}
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, matrix, inputs]
        expect: {stdout_contains: [HTTP inputs contract verified]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_probe-proxy-and-status-contract
    action: net.http_probe
    args: {url: 'https://packtest.invalid:24443/selected', resolve: 'packtest.invalid:24443:127.0.0.1'}
    env: {CURL_CA_BUNDLE: /tmp/packtest-net-fixture/ca.crt}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect: {stdout_contains: [http_code=201]}
    probes:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, matrix, proxy-status]
        expect: {stdout_contains: [HTTP proxy-status contract verified]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_headers-address-mapping-redirect-contract
    action: net.http_headers
    args: {url: 'http://packtest.invalid:24480/selected', resolve: 'packtest.invalid:24480:127.0.0.1'}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect: {stdout_contains: ['201 Created', 'X-Fixture-Host: packtest.invalid:24480']}
    probes:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, matrix, redirects]
        expect: {stdout_contains: [HTTP redirects contract verified]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_probe-wrong-san-still-fails
    action: net.http_probe
    args: {url: 'https://packtest.invalid:24443/selected', resolve: 'packtest.invalid:24443:127.0.0.1'}
    env: {CURL_CA_BUNDLE: /tmp/packtest-net-fixture/ca.crt}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start, wrong-san]
    expect: {status: failure, stderr_contains: [packtest.invalid], stdout_contains: [http_code=000]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_headers-unknown-ca-still-fails
    action: net.http_headers
    args: {url: 'https://packtest.invalid:24443/selected', resolve: 'packtest.invalid:24443:127.0.0.1'}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect: {status: failure, stderr_contains: [SSL certificate problem]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_probe-explicit-insecure-opt-out
    action: net.http_probe
    args: {url: 'https://packtest.invalid:24443/selected', resolve: 'packtest.invalid:24443:127.0.0.1', insecure: true}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start, wrong-san]
    expect: {stdout_contains: [http_code=201]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.http_probe-unresolved-without-mapping
    action: net.http_probe
    args: {url: 'http://does-not-exist.invalid/'}
    expect: {status: failure, stderr_contains: [Could not resolve host], stdout_contains: [http_code=000]}
  - name: net.tls_cert_expiry-ipv6-with-dns-sni
    action: net.tls_cert_expiry
    args: {host: '::1', port: 24446, sni: packtest.invalid}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect: {stdout_contains: [notBefore=, notAfter=, packtest.invalid]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - name: net.tls_cert_expiry-ipv6-closed-port
    action: net.tls_cert_expiry
    args: {host: '::1', port: 24447}
    expect: {status: failure, stderr_contains: ['TLS connection to ::1:24447 failed'], stdout_not_contains: [notAfter=]}
  - name: net.tls_cert_expiry-default-sni-preserves-dns-not-ip
    action: net.tls_cert_expiry
    args: {host: '::1', port: 24446}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, start]
    expect: {stdout_contains: [notAfter=, packtest.invalid]}
    probes:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, matrix, expiry-sni]
        expect: {stdout_contains: [HTTP expiry-sni contract verified]}
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/http-fixture.sh, stop]
  - action: net.tls_cert_expiry
    args: {host: 127.0.0.1, port: 24443, sni: packtest.example}
    arrange:
      - argv: [/bin/sh, -c, "openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=packtest.example -keyout /tmp/packtest-tls.key -out /tmp/packtest-tls.crt -days 1 >/dev/null 2>&1; openssl s_server -quiet -accept 24443 -cert /tmp/packtest-tls.crt -key /tmp/packtest-tls.key >/tmp/packtest-tls.log 2>&1 & echo $! >/tmp/packtest-tls.pid"]
    expect:
      stdout_contains: [notBefore=, notAfter=, packtest.example]
    cleanup:
      - argv: [/bin/sh, -c, "kill $(cat /tmp/packtest-tls.pid) 2>/dev/null || true"]

  - name: net.tls_cert_expiry-closed-port-keeps-connect-error
    action: net.tls_cert_expiry
    args: {host: 127.0.0.1, port: 24444}
    expect:
      status: failure
      stderr_contains: ["TLS connection to 127.0.0.1:24444 failed"]
      stdout_not_contains: [notAfter=]

  - name: net.tls_chain_dump-tls12-certificate-chain-only
    action: net.tls_chain_dump
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, verify-raw-tls12]
    expect:
      stdout_contains: [Certificate chain, '0 s:CN=packtest-chain.example', '1 s:CN=Packtest-Chain-CA', '-----BEGIN CERTIFICATE-----', '-----END CERTIFICATE-----']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK, Server certificate, Cipher is]
      stderr_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK]
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]

  - name: net.tls_chain_dump-closed-port-keeps-exit-status
    action: net.tls_chain_dump
    args: {host: 127.0.0.1, port: 24444}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ['TLS connection to 127.0.0.1:24444 failed']
      stdout_not_contains: [Certificate chain, SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK]

  - name: net.tls_chain_dump-tls13-certificate-chain-only
    action: net.tls_chain_dump
    args: {host: 127.0.0.1, port: 24443}
    arrange:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, start, tls1_3]
      - argv: [nc, -z, 127.0.0.1, '24443']
        retry_for: 5s
        retry_every: 100ms
    expect:
      stdout_contains: [Certificate chain, '0 s:CN=packtest-chain.example', '1 s:CN=Packtest-Chain-CA', '-----BEGIN CERTIFICATE-----', '-----END CERTIFICATE-----']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK, Server certificate, Cipher is, Post-Handshake New Session Ticket]
      stderr_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK]
    cleanup:
      - argv: [/bin/sh, /packs/network-tls/test/fixtures/tls-chain-fixture.sh, stop]

  - name: net.tls_chain_dump-plaintext-keeps-exit-status
    action: net.tls_chain_dump
    args: {host: tcp, port: 80}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ['TLS connection to tcp:80 failed']
      stdout_not_contains: [SSL-Session, Session-ID, Master-Key, TLS session ticket, Resumption PSK, Cipher is]

  - name: net.tls_cert_expiry-plaintext-keeps-handshake-error
    action: net.tls_cert_expiry
    args: {host: tcp, port: 80}
    expect:
      status: failure
      stderr_contains: ["TLS connection to tcp:80 failed", "wrong version number"]
      stdout_not_contains: [notAfter=]

  - name: net.tls_cert_expiry-dns-error-keeps-connect-error
    action: net.tls_cert_expiry
    args: {host: does-not-exist.invalid, port: 443}
    expect:
      status: failure
      stderr_contains: ["TLS connection to does-not-exist.invalid:443 failed"]
      stdout_not_contains: [notAfter=]

  - action: net.tcp_probe
    args: {host: tcp, port: 80, timeout: 3}
    expect:
      stdout_contains: [reachable=true, host=tcp, port=80]

  - name: net.tcp_probe-closed-port
    action: net.tcp_probe
    args: {host: tcp, port: 81, timeout: 3}
    expect:
      status: failure
      exit: [1]
      stderr_contains: [reachable=false, host=tcp, port=81]

  # Both raw-socket actions run as an identity that really holds CAP_NET_RAW.
  # The runner sets no_new_privs on every action child, so the setuid bit and
  # the file capability these binaries ship with grant nothing — running them
  # as anyone else would only assert the denial the pack's host_access recipe
  # exists to remove.
  - action: net.ping_extended
    args: {host: tcp, count: 2, timeout: 2}
    runner_user: root
    runner_reason: >
      ICMP echo needs CAP_NET_RAW, which no_new_privs stops ping's own file
      capability from supplying.
    expect:
      stdout_contains: ["2 packets transmitted", "0% packet loss"]

  - action: net.traceroute_mtr
    args: {host: tcp, cycles: 1}
    runner_user: root
    runner_reason: >
      mtr opens a raw socket, which no_new_privs stops its own file capability
      from supplying.
    expect:
      # mtr truncates the hop name to its column width, so the evidence that the
      # raw socket worked is a reported hop, not the target's full name.
      stdout_contains: ["HOST:", "Loss%", "1.|--"]
