schema_version: 1
id: vault.seal_status
title: vault status (seal fields)
kind: exec
risk: low
description: Show sealed/unsealed state + threshold + progress.
side_effects:
  - One sys/seal-status request.
  - Read-only.
args: []
execution:
  command:
    binary: vault
    argv:
      - "status"
      - "-format=json"
  timeout: 15s
  # `vault status` exits 0 unsealed, 2 sealed, 1 on error: a sealed Vault is a
  # status answer (`"sealed": true`), while exit 1 stays a failed run.
  success_exit_codes: [2]
output:
  parser: json
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Seal status
    args: {}
