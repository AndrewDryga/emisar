services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/vault/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.0.3}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-vault-tools:latest

  vault:
    image: hashicorp/vault:${PACKTEST_VERSION:-2.0.3}${PACKTEST_DIGEST-}
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: packtest-canary-vault-token-f34c
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 10
