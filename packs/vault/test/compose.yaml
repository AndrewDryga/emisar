services:
  vault:
    image: hashicorp/vault:${PACKTEST_VERSION:-2.0.3}${PACKTEST_DIGEST-}
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: test-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      retries: 10
