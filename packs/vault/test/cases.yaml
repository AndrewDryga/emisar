services: [vault]
versions:
  - version: "2.0.3"
    digest: "@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54"
    default: true
secret_env: [VAULT_TOKEN]
env:
  VAULT_ADDR: "http://vault:8200"
  VAULT_TOKEN: packtest-canary-vault-token-f34c
defaults:
  expect:
    stdout_not_empty: true
cases:
  # Both risky actions ARE coverable — each probe asks "did it happen?", the
  # shape redis.shutdown_nosave uses. Each case gets its own disposable Compose
  # project, so a sealed Vault costs nothing after it.
  - action: vault.lease_revoke_prefix
    args: {prefix: auth/token}
    arrange:
      - name: a revocable lease exists under the prefix
        argv: [/bin/sh, -c, "vault token create -ttl=30m >/dev/null"]
    probes:
      - name: the prefix has no leases left
        argv: [/bin/sh, -c, "vault list sys/leases/lookup/auth/token >/dev/null 2>&1 || echo revoked"]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [revoked]

  - action: vault.operator_seal
    probes:
      # `vault status` exits 2 when sealed and 0 when unsealed, so the exit code
      # is the assertion.
      - name: Vault reports itself sealed
        argv: [/bin/sh, -c, "vault status >/dev/null 2>&1; test $? -eq 2 && echo sealed"]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: [sealed]

  - action: vault.leases_count
    args: {prefix: auth/token}
    expect:
      json:
        /0: create/
  - action: vault.list_audit
    arrange:
      - argv: [vault, audit, enable, file, "file_path=/tmp/packtest-audit.log"]
    expect:
      stdout_contains: [file/, type]
    cleanup:
      - argv: [vault, audit, disable, file/]
  - action: vault.list_auth
    expect:
      stdout_contains: [token/, token]
  - action: vault.list_mounts
    expect:
      stdout_contains: [secret/, kv]
  - action: vault.list_policies
    expect:
      stdout_contains: [default, root]
  - action: vault.operator_step_down
    probes:
      - argv: [vault, status, -format=json]
        expect:
          stdout_contains: ['"sealed": false']
        retry_for: 15s
        retry_every: 500ms
  - action: vault.read_policy
    args: {name: default}
    expect:
      stdout_contains: [path]
  - action: vault.revoke_lease
    arrange:
      - argv: [vault, secrets, enable, pki]
      - argv: [vault, write, pki/root/generate/internal, common_name=packtest, ttl=1h]
      - argv: [vault, write, pki/roles/packtest, allow_any_name=true, generate_lease=true, max_ttl=30m]
      - argv: [vault, write, -field=serial_number, pki/issue/packtest, common_name=packtest.example.com, ttl=10m]
    resolve_args:
      lease_id:
        argv: [/bin/sh, -c, 'keys="$(vault list sys/leases/lookup/pki/issue/packtest/)" && echo "pki/issue/packtest/$(echo "$keys" | tail -n 1)"']
        retry_for: 10s
        retry_every: 250ms
    probes:
      - argv: [/bin/sh, -c, 'vault list sys/leases/lookup/pki/issue/packtest/ >/dev/null 2>&1 || echo lease-gone']
        expect:
          stdout_contains: [lease-gone]
        retry_for: 15s
        retry_every: 500ms
  - action: vault.seal_status
    expect:
      json:
        /sealed: false
  - action: vault.status
    expect:
      json:
        /sealed: false
  - action: vault.token_lookup_self
    # `token lookup` returns the token itself as data.id; redaction rewrites it
    # to "[REDACTED]" so the canary root token never reaches stdout.
    expect:
      stdout_contains: [display_name, root, '"[REDACTED]"']
      stdout_not_contains: [packtest-canary-vault-token-f34c]
