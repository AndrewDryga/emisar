schema_version: 1

id: linux.mdadm_status
title: mdadm RAID array status
kind: exec
risk: low

description: >
  Read /proc/mdstat plus `mdadm --detail` for every active array.
  Surfaces array state, devices, sync progress, faults. Read-only.
  Returns "no arrays" cleanly when there's no mdadm RAID configured.

side_effects:
  - One cat + one mdadm --detail per array.
  - Read-only.

search_terms:
  - raid rebuild
  - raid degraded
  - failed drive

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Only whole arrays (/dev/md<digits>) are examined; partitions such as
      # /dev/md126p1 and the literal glob of the no-array case are skipped,
      # and the no-array case prints "no arrays" and exits 0. The first
      # failing `mdadm --detail` sets the exit status while the remaining
      # arrays are still shown. A host without the md driver has no
      # /proc/mdstat; an unreadable one fails the run.
      - "rc=0; found=0; [ ! -e /proc/mdstat ] || cat /proc/mdstat || rc=$?; for md in /dev/md[0-9]*; do case ${md#/dev/md} in *[!0-9]*) continue ;; esac; [ -e \"$md\" ] || continue; found=1; echo; mdadm --detail \"$md\" || { s=$?; [ \"$rc\" -ne 0 ] || rc=$s; }; done; [ \"$found\" = 1 ] || { echo; echo 'no arrays'; }; exit \"$rc\""
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Array health snapshot
    args: {}
