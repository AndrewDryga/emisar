schema_version: 1

id: linux.systemctl_start
title: Start a systemd unit
kind: exec
risk: high

description: >
  `systemctl start <unit>`. Brings a unit up and waits for the start job
  to finish, so a successful run means the unit reached its started
  state — a failed start fails the run rather than reporting a queued
  job.

side_effects:
  - Starts the unit (and any required dependencies).
  - Triggers ExecStartPre/Post hooks declared in the unit.

args:
  - name: unit
    type: string
    required: true
    description: Systemd unit name (e.g. nginx.service).
    validation:
      pattern: "^[a-zA-Z0-9@:_.][a-zA-Z0-9@:_.\\-]{0,127}$"

# The execution contract matches systemd.unit_start — same command, same
# deadline, whichever pack the operator installed.
execution:
  command:
    binary: systemctl
    argv:
      - "start"
      - "{{ args.unit }}"
  timeout: 120s

output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192

examples:
  - title: Start nginx
    args:
      unit: nginx.service
