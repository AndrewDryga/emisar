schema_version: 1

id: linux.systemctl_status
title: Systemd unit status
kind: exec
risk: medium

description: >
  Show a named systemd unit's runtime state and processes plus up to 10 recent
  journal lines. Those lines can carry application, request, or personal
  data no redaction list can enumerate. Use to confirm whether a service is
  active before recommending diagnostic or remediation actions.

side_effects:
  - Reads systemd state and recent journal entries.
  - May expose application, request, or personal data written to the journal.
  - Touches no files.

search_terms:
  - service won't start
  - unit down
  - not running

args:
  - name: unit
    type: string
    required: true
    description: Systemd unit to query.
    validation:
      # Any valid systemd unit name. A generic pack can't enumerate every
      # service a fleet runs; the regex keeps the argument injection-safe
      # without baking in one environment's service list.
      pattern: "^[a-zA-Z0-9@:_.][a-zA-Z0-9@:_.\\-]{0,127}$"

execution:
  command:
    # Resolved from PATH (systemctl is under /usr/bin or /bin depending on
    # the distro's usr-merge). Alpine + minimal images don't ship
    # systemd-tools at all — the runner will error out cleanly there.
    binary: systemctl
    argv:
      - "status"
      - "{{ args.unit }}"
      - "--no-pager"
      - "--lines=10"
  timeout: 10s
  cwd: /

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Check Cassandra status
    args:
      unit: cassandra
