schema_version: 1

id: linux.crontab_all
title: All user crontabs + system cron dirs
kind: exec
risk: high

description: >
  Dump every per-user crontab AND the system cron dirs (/etc/crontab,
  /etc/cron.d/, /etc/cron.{hourly,daily,weekly,monthly}/). Use to
  answer "what's scheduled on this host?" Read-only. Cron command lines
  routinely carry inline credentials (a `curl` bearer token, a `mysql
  -p<pw>`), so this can surface secrets. The runner's redaction is a
  fail-closed backstop, not a guarantee — it is pattern-bound and can
  miss a bespoke secret whose name and value match no rule.

side_effects:
  - Iterates user crontabs + reads /etc/cron.*.
  - Read-only, but requires root and exposes cron command lines (may include
    inline secrets).

search_terms:
  - scheduled jobs
  - scheduled tasks

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Guard the enumeration the way sudoers_dump is guarded. Reading another
      # user's crontab is root-reserved (`crontab` being setgid does not help —
      # the runner sets no_new_privs), so an unprivileged runner used to discard
      # every refusal and answer "what is scheduled on this host?" with a clean
      # empty list, which reads as "nothing is scheduled". Test the identity
      # rather than crontab's exit status: cronie exits 1 both for "no crontab
      # for this user" and for "must be privileged to use -u", so the status
      # cannot tell an honest empty answer from a refused one.
      - "[ \"$(id -u)\" = 0 ] || { echo 'reading every user crontab requires root; this runner identity would report an incomplete schedule' >&2; exit 1; }; for u in $(getent passwd | awk -F: '$7 !~ /nologin|false/ {print $1}'); do echo \"--- crontab -u $u ---\"; crontab -l -u \"$u\" 2>/dev/null; done; echo '--- /etc/crontab ---'; cat /etc/crontab 2>/dev/null; echo '--- /etc/cron.d/ ---'; ls -la /etc/cron.d/ 2>/dev/null; for d in hourly daily weekly monthly; do echo \"--- /etc/cron.$d/ ---\"; ls -la \"/etc/cron.$d/\" 2>/dev/null; done"
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 16384

examples:
  - title: Every scheduled job on this host
    args: {}
