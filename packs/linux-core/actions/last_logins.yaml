schema_version: 1

id: linux.last_logins
title: Recent successful logins
kind: exec
risk: medium

description: >
  Show the last N successful logins via `last`. Depending on the distribution,
  `last` reads the legacy wtmp file or the wtmpdb login-history database. Shows
  user, terminal, source IP, and duration. Read-only.

side_effects:
  - One last invocation.
  - Reads the host's login-history database (legacy wtmp or wtmpdb).

args:
  - name: count
    type: integer
    required: false
    default: 50
    description: How many recent logins to return.
    validation:
      min: 1
      max: 500

execution:
  command:
    binary: last
    argv:
      - "-F"
      - "-n"
      - "{{ args.count }}"
  timeout: 10s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Last 50 successful logins
    args: {}
