schema_version: 1

id: linux.inode_usage
title: Inode usage per filesystem
kind: exec
risk: low

description: >
  Show a bounded inode-usage snapshot of disk filesystems (`df -i`),
  excluding tmpfs, devtmpfs, overlay and squashfs mounts. A "disk full" report
  that doesn't match `df -h` is almost always inode exhaustion —
  this surfaces it directly. Read-only.

side_effects:
  - One df invocation.
  - Read-only.

search_terms:
  - out of inodes

args: []

execution:
  command:
    binary: df
    argv:
      - "-i"
      - "-h"
      - "-x"
      - tmpfs
      - "-x"
      - devtmpfs
      - "-x"
      - overlay
      - "-x"
      - squashfs
  timeout: 10s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Inode usage snapshot
    args: {}
