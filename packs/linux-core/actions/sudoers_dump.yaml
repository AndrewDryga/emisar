schema_version: 1

id: linux.sudoers_dump
title: sudoers configuration audit
kind: exec
risk: medium

description: >
  Dump /etc/sudoers and the index of /etc/sudoers.d/. Use for an
  audit pass — "who can sudo to what?". Output is the host's
  privilege-escalation policy — security-sensitive recon, but sudoers
  stores rules, never credentials. Read-only.

side_effects:
  - Reads /etc/sudoers and ls of /etc/sudoers.d/.
  - Requires root or sudo-readable perms.

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # Guard the read: /etc/sudoers is 0440 root:root, and an unreadable file
      # must fail rather than answer a privilege-escalation audit with a blank
      # page that reads as "no sudo rules".
      - "[ -r /etc/sudoers ] || { echo '/etc/sudoers is not readable by this runner identity' >&2; exit 1; }; cat /etc/sudoers; echo; ls -la /etc/sudoers.d/"
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Sudoers audit
    args: {}
