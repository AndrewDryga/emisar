schema_version: 1

id: linux.journalctl_grep
title: Grep recent systemd journal entries
kind: script
risk: medium

description: >
  Read a bounded recent slice for one unit, then return entries matching a
  POSIX extended regular expression. Filtering uses grep -E instead of
  journalctl --grep, so it works when journalctl was built without PCRE2. Use
  when you already know the rough request ID, host, IP, or error text. No match
  is a successful empty result; an invalid expression or unreadable journal is
  a failure. Output is redacted before leaving the host.

side_effects:
  - Reads service logs which may contain operational secrets.
  - Output is run through the runner's redactor before egress.
  - Read-only; does not modify anything.

args:
  - name: unit
    type: string
    required: true
    description: Systemd unit name to inspect (e.g. nginx, nomad, consul.service, foo@bar.service).
    validation:
      pattern: "^[a-zA-Z0-9@:_.][a-zA-Z0-9@:_.\\-]{0,127}$"
      max_length: 128

  - name: grep
    type: string
    required: true
    description: POSIX extended regular expression passed to grep -E.
    validation:
      pattern: '^.{1,512}$'

  - name: since
    type: duration
    required: false
    default: "2h"
    description: Look back at most this far.
    validation:
      max_duration: 24h

  - name: priority
    type: string
    required: false
    default: "warning"
    description: Minimum priority level for entries.
    validation:
      enum:
        - debug
        - info
        - notice
        - warning
        - err
        - crit
        - alert
        - emerg

  - name: entry_limit
    type: integer
    required: false
    default: 2000
    description: Maximum recent journal entries read before filtering; at most 500 matches are returned.
    validation:
      min: 1
      max: 10000

execution:
  script:
    path: scripts/journalctl_grep.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.unit }}"
    - "{{ args.since }}"
    - "{{ args.priority }}"
    - "{{ args.entry_limit }}"
    - "{{ args.grep }}"
  timeout: 30s
  timeout_min: 5s
  timeout_max: 5m
  cwd: /

output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192

examples:
  - title: Cassandra journal entries mentioning compaction
    args:
      unit: cassandra
      grep: 'compact'
      since: "6h"
  - title: Nginx 5xx in journal
    args:
      unit: nginx
      grep: ' (5[0-9][0-9]) '
      priority: notice
