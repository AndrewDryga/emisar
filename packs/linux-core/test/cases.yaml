# The service manager these unit verbs drive runs as PID 1 in its own
# privileged, disposable container; the runner joins that container's PID
# namespace and /run, which is all systemctl needs. The crontab reads are the
# other half of this pack and work differently: they read the passwd file and
# spool of the machine the ACTION runs on, which is the client container, so
# their fixture lives there.
services: [systemd]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
runner:
  user: root
  reason: >
    Changing units and reading every user's crontab are privileged operations;
    a case that ran them as anyone else would only ever assert the denial.
cases:
  - action: linux.journalctl_grep
    args:
      unit: packtest-journal.service
      grep: "packtest-(alpha|beta)"
      since: 1h
      priority: info
      entry_limit: 100
    env:
      PATH: /opt/journal-without-pcre:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    arrange:
      - argv: [systemd-run, --unit=packtest-journal, --wait, /bin/sh, -c, "echo packtest-alpha >&2"]
      - argv: [/bin/sh, -c, "journalctl -u packtest-journal.service --no-pager | grep -Fq packtest-alpha"]
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: [packtest-alpha]

  - name: linux.journalctl_grep-rejects-an-invalid-extended-regex
    action: linux.journalctl_grep
    args:
      unit: cron.service
      grep: "["
      since: 1h
    expect:
      status: failure
      exit: [2]
      stderr_contains: [invalid extended regular expression]

  - name: linux.journalctl-grep-no-match-is-successful
    action: linux.journalctl_grep
    args:
      unit: packtest-journal.service
      grep: packtest-journalctl-grep-does-not-exist
      since: 1h
      entry_limit: 20
    env:
      PATH: /opt/journal-without-pcre:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      status: success
      stdout_not_contains: [packtest-journalctl-grep-does-not-exist]
    probes:
      - name: the bounded source really has no matching entry
        argv: [/bin/sh, -c, "! journalctl -u packtest-journal.service --since=-1h --no-pager -n 20 | grep -Fq packtest-journalctl-grep-does-not-exist && echo no-match"]
        expect:
          stdout_contains: [no-match]

  - action: linux.systemctl_status
    args: {unit: packtest-status.service}
    arrange:
      - argv: [/bin/sh, -c, "printf '%s\n' packtest-status-journal-line > /run/packtest-status-message"]
      - argv: [systemd-run, --unit=packtest-status, --property=RemainAfterExit=yes, /bin/sh, -c, "cat /run/packtest-status-message"]
      - argv: [systemctl, is-active, packtest-status.service]
        retry_for: 10s
        retry_every: 200ms
      - argv: [/bin/sh, -c, "journalctl -u packtest-status.service --no-pager | grep -Fq packtest-status-journal-line"]
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: ["Active: active", packtest-status-journal-line]
    probes:
      - name: reading status leaves the unit active
        argv: [systemctl, is-active, packtest-status.service]
        expect:
          stdout_contains: [active]

  - action: linux.systemctl_start
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, stop, cron.service]
    probes:
      - name: the unit reaches the running state
        argv: [systemctl, is-active, cron.service]
        retry_for: 10s
        retry_every: 500ms
        expect:
          stdout_contains: [active]

  - action: linux.systemctl_stop
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, start, cron.service]
    probes:
      - name: the unit leaves the running state
        argv: [/bin/sh, -c, "systemctl is-active cron.service; echo probed"]
        retry_for: 10s
        retry_every: 500ms
        expect:
          stdout_contains: [inactive, probed]

  # The main PID is what changes when a unit really restarts; asserting it is
  # still active would pass whether or not anything happened.
  - action: linux.systemctl_restart
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, start, cron.service]
      - argv: [/bin/sh, -c, "systemctl show cron.service -p MainPID --value > /run/packtest-mainpid"]
    probes:
      - name: the service came back under a new main PID
        argv: [/bin/sh, -c, "test \"$(systemctl show cron.service -p MainPID --value)\" != \"$(cat /run/packtest-mainpid)\" && systemctl is-active cron.service"]
        expect:
          stdout_contains: [active]

  - action: linux.systemctl_reload
    args: {unit: dbus.service}
    probes:
      - name: the reloaded unit is still up
        argv: [systemctl, is-active, dbus.service]
        expect:
          stdout_contains: [active]

  - action: linux.systemctl_enable
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, disable, cron.service]
    probes:
      - name: the unit is wanted at boot
        argv: [systemctl, is-enabled, cron.service]
        expect:
          stdout_contains: [enabled]

  - action: linux.systemctl_disable
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, enable, cron.service]
    probes:
      - name: the unit is no longer wanted at boot
        argv: [/bin/sh, -c, "systemctl is-enabled cron.service; echo probed"]
        expect:
          stdout_contains: [disabled, probed]

  # The image plants a crontab for a real login user, so this asserts the
  # enumeration found it rather than that the command exited cleanly.
  - action: linux.crontab_all
    expect:
      stdout_contains: ["crontab -u deploy", packtest-nightly, "/etc/crontab"]

  # The false all-clear this guard closes: reading another user's crontab is
  # root-reserved, and the enumeration used to discard every refusal — so an
  # unprivileged runner answered "what is scheduled on this host?" with an
  # empty list, which an operator or a model reads as "nothing is scheduled".
  - name: linux.crontab_all-refuses-an-unprivileged-identity
    action: linux.crontab_all
    runner_user: nonroot
    expect:
      status: failure
      stderr_contains: ["requires root"]
      stdout_not_contains: ["/etc/crontab"]

  # The image's @reboot job fires when the SUT boots, so cron has really logged
  # a job run by the time this reads. The wait is an arrange step rather than a
  # sleep — and do NOT restart cron to trigger it, which makes cron skip @reboot
  # ("not system startup") and leaves nothing to find.
  - action: linux.cron_recent
    args: {count: 20}
    arrange:
      - argv: [/bin/sh, -c, "journalctl -u cron -u crond -t CRON -t CROND --no-pager -n 20 | grep -q CMD"]
        retry_for: 30s
        retry_every: 1s
    expect:
      stdout_contains: ["CMD (/bin/true)"]
