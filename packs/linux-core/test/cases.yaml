# Every unit verb here, and reading every user's crontab, works in a
# privileged container running systemd as PID 1 — measured, not assumed. They
# stay declared because that lane is not built, NOT because a host is required.
# reboot_host is the exception's exception: rebooting a container is not
# rebooting a host, so it says nothing about the action either way.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    linux.cron_recent: requires_privileged_host
    linux.crontab_all: requires_privileged_host
    linux.reboot_host: requires_privileged_host
    linux.systemctl_disable: requires_privileged_host
    linux.systemctl_enable: requires_privileged_host
    linux.systemctl_reload: requires_privileged_host
    linux.systemctl_restart: requires_privileged_host
    linux.systemctl_start: requires_privileged_host
    linux.systemctl_stop: requires_privileged_host
