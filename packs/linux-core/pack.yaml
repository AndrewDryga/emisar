schema_version: 1

id: linux-core
name: Linux core operations pack
version: 0.4.11
# 0.4.9 and below let journalctl_grep answer a truncated slice exactly like a
# clean window, so "that error never appeared" was indistinguishable from
# "we only searched the last 2,000 entries".
retired_below: 0.4.10
description: >
  Read-only Linux diagnostics plus narrow service control. Disk, mem,
  uptime, journalctl, log grep + tail, users/auth introspection, cron
  audit, network state, kernel info, and systemctl control. The
  front-line pack every Linux host gets.
vendor: emisar
homepage: https://emisar.dev/packs/linux-core

requires:
  os:
    - linux

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  notes:
    - "Most read-only diagnostics need no privilege. Journal, protected-log, storage, policy, service-control, and reboot actions are mapped below."
    - "linux.last_logins requires the `last` command. On Debian 13 install `wtmpdb`; install `libpam-wtmpdb` as well so PAM records login history in wtmpdb."
  host_access:
    - actions:
        - linux.disk_smart
        - linux.lvm_status
        - linux.mdadm_status
        - linux.hardware_summary
        - linux.sudoers_dump
        - linux.crontab_all
        - linux.systemctl_start
        - linux.systemctl_stop
        - linux.systemctl_restart
        - linux.systemctl_reload
        - linux.systemctl_enable
        - linux.systemctl_disable
        - linux.reboot_host
      requirement: Read protected storage and policy state, control arbitrary services, or reboot the host.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-linux-core-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. The listed actions can read
            sensitive host policy, control any systemd unit, and reboot the machine.
    - actions:
        - linux.journalctl
        - linux.journalctl_grep
        - linux.systemctl_status
        - linux.grep_log
        - linux.tail_log
        - linux.failed_logins
        - linux.cron_recent
      requirement: Read systemd journal entries and protected logs on Debian or Ubuntu.
      recipes:
        - name: Add the Emisar service user to system log-reader groups
          commands:
            - "sudo usermod -aG adm,systemd-journal emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx adm"
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx systemd-journal"
            - "sudo -u emisar journalctl --no-pager -n 1 >/dev/null"
          impact: >
            Every process running as emisar can read the system journal and every host log
            granted to adm, including logs unrelated to the selected actions.
  verify: linux.uptime

actions:
  # Filesystem & storage
  - actions/disk_usage.yaml
  - actions/mount_status.yaml
  - actions/inode_usage.yaml
  - actions/disk_smart.yaml
  - actions/lvm_status.yaml
  - actions/mdadm_status.yaml
  # System info
  - actions/cpu_info.yaml
  - actions/memory.yaml
  - actions/memory_detailed.yaml
  - actions/uptime.yaml
  - actions/os_release.yaml
  - actions/kernel_modules.yaml
  - actions/hardware_summary.yaml
  # Logs
  - actions/journalctl.yaml
  - actions/journalctl_grep.yaml
  - actions/grep_log.yaml
  - actions/tail_log.yaml
  # Users & auth
  - actions/who_now.yaml
  - actions/last_logins.yaml
  - actions/failed_logins.yaml
  - actions/sudoers_dump.yaml
  # Cron
  - actions/crontab_all.yaml
  - actions/cron_recent.yaml
  # Network state
  - actions/network_interfaces.yaml
  - actions/network_routes.yaml
  - actions/arp_neighbors.yaml
  # Systemd
  - actions/systemctl_status.yaml
  - actions/systemctl_start.yaml
  - actions/systemctl_stop.yaml
  - actions/systemctl_restart.yaml
  - actions/systemctl_reload.yaml
  - actions/systemctl_enable.yaml
  - actions/systemctl_disable.yaml
  # Host
  - actions/reboot_host.yaml
