schema_version: 1
id: emqx.auth_metrics
title: Show authentication and authorization outcomes
kind: script
risk: low
description: >
  Show each authenticator's and authorization source's enabled and up
  status, success, failure, and no-match counts per authenticator, allow and
  deny counts and rule count per source, and the ban count, summed across
  the cluster, as Prometheus text from GET /api/v5/prometheus/auth. Runner
  redaction masks the backend in password-based authenticator IDs, so they
  read password_based:[REDACTED]; every counter stays readable.
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/prometheus/auth endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - mqtt auth failures
  - clients rejected
  - acl denied
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - auth-metrics
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Authentication and authorization outcomes
    args: {}
