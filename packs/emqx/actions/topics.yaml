schema_version: 1
id: emqx.topics
title: List MQTT topic routes
kind: script
risk: low
description: >
  List the topic filters at least one client subscribes to, with the node
  that routes each one, with GET /api/v5/topics, or check one exact topic
  filter. An empty result for a filter means no client is subscribed to it
  anywhere in the cluster.
args:
  - name: topic
    type: string
    required: false
    default: ""
    description: One exact topic filter, such as plant/+/temp. Empty lists every route.
    validation:
      pattern: "^[!-~]{0,512}$"
      max_length: 512
  - name: limit
    type: integer
    required: false
    default: 100
    description: Routes to return, from the first page. At most 1,000 per call.
    validation:
      min: 1
      max: 1000
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/topics endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - no subscribers
  - topic has no subscribers
  - routing table
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - topics
    - "{{ args.limit }}"
    - "{{ args.topic }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Is anyone subscribed to plant/alerts
    args:
      topic: plant/alerts
