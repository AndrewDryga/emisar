schema_version: 1
id: emqx.nodes
title: Show EMQX cluster nodes
kind: script
risk: low
description: >
  Show each EMQX node's status, version, edition, role, uptime, connection
  count, memory, and process use with GET /api/v5/nodes.
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/nodes endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - mqtt down
  - broker down
  - node not running
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - nodes
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Cluster nodes
    args: {}
