schema_version: 1
id: emqx.rules
title: List rule engine rules
kind: script
risk: low
description: >
  List rule engine rules with GET /api/v5/rules: each rule's ID, name,
  description, whether it is enabled, the topics it reads, its SQL, the
  actions it sends results to, and when it was created and last changed.
  Per-rule counters are in emqx.rule_metrics.
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Rules to return, from the first page. At most 1,000 per call.
    validation:
      min: 1
      max: 1000
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/rules endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - rule sql
  - which rule writes to the database
  - data integration rules
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - rules
    - "{{ args.limit }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Rules
    args: {}
