schema_version: 1
id: emqx.banned
title: List banned MQTT clients
kind: script
risk: low
description: >
  List the ban table with GET /api/v5/banned: each ban's kind (client ID,
  username, or peer host), value, reason, who created it, and when it
  started and ends.
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Bans to return, from the first page. At most 1,000 per call.
    validation:
      min: 1
      max: 1000
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/banned endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - client banned
  - not authorised
  - blocklist
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - banned
    - "{{ args.limit }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Bans
    args: {}
