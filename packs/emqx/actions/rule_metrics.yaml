schema_version: 1
id: emqx.rule_metrics
title: Show rule engine metrics
kind: script
risk: low
description: >
  Show matched, passed, and failed counts per rule, plus action and connector
  metrics, summed across the cluster, with
  GET /api/v5/prometheus/data_integration. Rule ids only; rule SQL is not
  returned.
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/prometheus/data_integration endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - rule not firing
  - bridge failing
  - messages not forwarded
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - rule-metrics
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Rule engine metrics
    args: {}
