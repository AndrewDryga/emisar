schema_version: 1
id: emqx.stats
title: Show connection, subscription, and retained-message counts
kind: script
risk: low
description: >
  Show cluster-wide current counts and peaks for connections, sessions,
  subscriptions, topics, and retained messages with
  GET /api/v5/stats?aggregate=true.
side_effects:
  - One read-only HTTP GET to the EMQX /api/v5/stats endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - how many clients
  - connection count
  - retained messages
execution:
  script:
    path: scripts/emqx_api.sh
    interpreter: /bin/sh
  argv:
    - stats
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Cluster counts
    args: {}
