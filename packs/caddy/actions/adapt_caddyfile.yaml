schema_version: 1
id: caddy.adapt_caddyfile
title: caddy adapt --config <file>
kind: exec
risk: high
description: >
  Convert a Caddyfile to JSON config without loading it. The output is the
  full resulting config — the same content class as `caddy.config_dump` —
  and can carry secrets (TLS private-key material, basic-auth hashes,
  upstream credentials, API tokens); adapt errors also quote offending
  Caddyfile lines back. The runner's redaction is a fail-closed backstop,
  not a guarantee — it is pattern-bound and can miss a bespoke secret.
side_effects:
  - One forked process.
  - Read-only, but emits the full adapted config (may include secrets).
args:
  - name: file
    type: string
    required: false
    default: "/etc/caddy/Caddyfile"
    description: Caddyfile path.
    validation:
      pattern: "^/[a-zA-Z0-9_./\\-]{1,512}$"
      # The pattern constrains lexical shape but NOT `..` (`.`/`/` are
      # literal charset members). allowed_prefixes runs the runner's
      # Clean+EvalSymlinks containment, scoping this to Caddy's standard config
      # roots so it can't become an arbitrary-file read oracle — adapt parses
      # the file and quotes offending lines back in its errors, so an
      # unscoped path leaks the contents of any runner-readable secret.
      allowed_prefixes:
        - /etc/caddy
        - /srv
        - /opt
execution:
  command:
    binary: caddy
    argv: ["adapt", "--config", "{{ args.file }}", "--pretty"]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 2097152
  max_stderr_bytes: 16384
examples:
  - title: Adapt the default Caddyfile
    args: {}
