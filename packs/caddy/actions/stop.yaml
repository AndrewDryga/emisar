schema_version: 1
id: caddy.stop
title: caddy stop
kind: exec
risk: high
description: >
  Stop the running Caddy process via its admin API. All listeners
  close; in-flight requests drain. Recovery requires starting Caddy
  again via systemd or `caddy start`. Use as a last resort during
  incidents.
side_effects:
  - All Caddy listeners closed.
  - In-flight requests drain then terminate.
  - Reverse-proxy traffic to backends stops.
  - Process exits; supervisor decides restart.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      # The admin API, like every other action in this pack — not `caddy stop`.
      # The CLI reads CADDY_ADMIN as a host:port while the pack (and its own
      # manifest) documents it as a full URL, so the CLI built
      # `http:///127.0.0.1:2019/stop` and failed with "no Host in request URL"
      # the moment an operator set the variable the pack tells them to set.
      - "-c"
      - "curl -fsS --globoff --proto =http,https -X POST \"${CADDY_ADMIN:-http://127.0.0.1:2019}/stop\""
  timeout: 30s
  cancel_grace: 10s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Stop Caddy
    args: {}
