schema_version: 1
id: caddy.reload_config
title: caddy reload --config <file>
kind: exec
risk: high
description: Live-swap the running config. No connection drops on success; rejected config keeps the old one running.
side_effects:
  - Replaces the in-memory config atomically.
  - Existing connections keep running on their handlers.
args:
  - name: file
    type: string
    required: false
    default: "/etc/caddy/Caddyfile"
    description: Config path.
    validation:
      pattern: "^/[a-zA-Z0-9_./\\-]{1,512}$"
      # The pattern constrains lexical shape but NOT `..` (`.`/`/` are
      # literal charset members). allowed_prefixes runs the runner's
      # Clean+EvalSymlinks containment, scoping this to Caddy's standard config
      # roots so a caller can't point the live-config swap at an arbitrary file
      # (reload reads, parses AND APPLIES the config) or escape via `..`/symlink.
      allowed_prefixes:
        - /etc/caddy
        - /srv
        - /opt
execution:
  command:
    binary: /bin/sh
    argv:
      # `caddy reload` takes the admin address from the config's own `admin`
      # listener, else from CADDY_ADMIN, which it parses as a network address
      # (host:port), while this pack documents CADDY_ADMIN as a URL. Strip an
      # http:// URL down to host:port and hand it on as CADDY_ADMIN rather than
      # --address, so a config that names its listener still wins.
      - "-c"
      - |-
        case ${CADDY_ADMIN-} in
          http://*) admin=${CADDY_ADMIN#http://}; CADDY_ADMIN=${admin%%/*}; export CADDY_ADMIN ;;
        esac
        exec caddy reload --config "$1"
      - caddy.reload_config
      - "{{ args.file }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 16384
examples:
  - title: Reload
    args: {}
