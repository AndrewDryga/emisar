schema_version: 1
id: caddy.pki_certs
title: Show one PKI CA's certificate chain
kind: exec
risk: low
description: Show the root and intermediate certificate chain of one Caddy internal PKI CA (default `local`) with GET /pki/ca/<id>/certificates. Leaf certificates the CA issued are not listed.
side_effects: ["One admin GET.", "Read-only."]
args:
  - name: ca
    type: string
    required: false
    default: "local"
    description: CA ID.
    validation:
      pattern: "^[a-z0-9_\\-]{1,32}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "curl -q -fsS --globoff --proto =http,https \"${CADDY_ADMIN:-http://127.0.0.1:2019}/pki/ca/${1}/certificates\""
      - "emisar"
      - "{{ args.ca }}"
  timeout: 15s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Local CA certs
    args: {}
