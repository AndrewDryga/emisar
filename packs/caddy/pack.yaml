schema_version: 1

id: caddy
name: Caddy web server
version: 0.1.24
retired_below: 0.1.16
description: >
  Caddy v2 ops via its admin API (default http://127.0.0.1:2019) and CLI.
  Config dump, upstream health, PKI inventory, config validation, plus
  reload (live config swap). Set CADDY_ADMIN env var if not on default.
vendor: emisar
homepage: https://emisar.dev/packs/caddy

requires:
  os:
    - linux
  binaries:
    - caddy
    - curl

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - caddy
  ports:
    - 2019

setup:
  summary: >
    Operates on the local Caddy instance on the runner host — no
    credentials needed. Inventory/health actions curl the admin API at
    127.0.0.1:2019; validate/reload/stop run the caddy binary directly.
  env:
    - name: CADDY_ADMIN
      description: Base URL of the Caddy admin API; set only if it does not listen on the default.
      default: "http://127.0.0.1:2019"
    - name: CADDY_ACCESS_LOG
      description: Path to the Caddy access log for access_log_tail.
      default: /var/log/caddy/access.log
  notes:
    - "`CADDY_ADMIN` and `CADDY_ACCESS_LOG` only reach an action when the runner allowlists them in `execution.inherit_env` — the action env is scrubbed to PATH/LANG/LC_ALL/TERM by default. Unset, both fall back to their defaults above, so a non-default admin endpoint or log path silently reads the local one instead of yours."
  host_access:
    - actions:
        - caddy.access_log_tail
        - caddy.adapt_caddyfile
        - caddy.validate_config
        - caddy.reload_config
      requirement: >
        Read Caddy's protected log and configuration files. Reload also requires the
        separately configured admin endpoint to accept the request.
      recipes:
        - name: Add the Emisar service user to caddy
          commands:
            - "sudo usermod -aG caddy emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx caddy"
            - "sudo -u emisar test -r /etc/caddy/Caddyfile"
          impact: >
            Every process running as emisar can read files exposed to the caddy group. Reload
            can replace the live server configuration when the admin endpoint also permits it.
  verify: caddy.version

actions:
  # Inventory
  - actions/version.yaml
  - actions/config_dump.yaml
  - actions/pki_certs.yaml
  - actions/adapt_caddyfile.yaml
  # Health + logs
  - actions/reverse_proxy_upstreams.yaml
  - actions/runtime_metrics.yaml
  - actions/access_log_tail.yaml
  # Mutators
  - actions/validate_config.yaml
  - actions/reload_config.yaml
  - actions/stop.yaml
