# exportfs needs the nfsd kernel module, which a container borrows from its
# host rather than loading itself. A GitHub Linux runner carries it and this
# workstation's kernel does not, so this class is CI's to decide.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    nfs.exportfs_r: requires_privileged_host
    nfs.exportfs_unexport_path: requires_privileged_host
