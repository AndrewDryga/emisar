schema_version: 1

id: nfs
name: NFS server + client
version: 0.1.9
description: >
  Inspect a host's NFS exports, mounted shares, RPC state, active client
  connections. Plus two narrow operator actions: exportfs -r (re-export) and
  exportfs -u (unexport one client:path — evicts that client). Read-only
  otherwise.
vendor: emisar
homepage: https://emisar.dev/packs/nfs

requires:
  os:
    - linux

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - nfsd
  ports:
    - 2049

setup:
  summary: >
    Inspects the local runner host's NFS server/client state — no
    credentials needed.
  notes:
    - "showmount, nfsstat, rpcinfo, the kernel mount inventory, and the exported-table file read work without elevated host access."
  host_access:
    - actions:
        - nfs.exportfs_v
        - nfs.exportfs_r
        - nfs.exportfs_unexport_path
      requirement: Read and change the kernel NFS export table as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-nfs-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. Export actions can expose or
            withdraw host filesystems from NFS clients.
  verify: nfs.exportfs_v

actions:
  - actions/exportfs_v.yaml
  - actions/showmount_e.yaml
  - actions/nfsstat_s.yaml
  - actions/nfsstat_c.yaml
  - actions/rpcinfo_p.yaml
  - actions/cat_etab.yaml
  - actions/nfs_mounts.yaml
  - actions/exportfs_r.yaml
  - actions/exportfs_unexport_path.yaml
