schema_version: 1
id: gcp.billing_budgets
title: gcloud billing budgets list
kind: exec
risk: low
description: List budgets on one Cloud Billing account, with their amounts, threshold rules, and the projects or services each one filters.
side_effects:
  - Read-only Cloud Billing Budget API pagination.
  - Returned budgets are capped by limit.
  - A budget states its threshold, not current spend; the cost actions report spend.
args:
  - name: billing_account
    type: string
    required: true
    description: Billing account ID, such as 01B678-5ED3E1-AD1F9F.
    validation:
      pattern: "^[A-Z0-9]{6}-[A-Z0-9]{6}-[A-Z0-9]{6}$"
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum budgets to return.
    validation:
      min: 1
      max: 500
execution:
  command:
    binary: gcloud
    argv:
      - billing
      - budgets
      - list
      - "--billing-account={{ args.billing_account }}"
      - "--limit={{ args.limit }}"
      - --format=json
      - --quiet
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: Budgets and thresholds on one account
    args:
      billing_account: 01B678-5ED3E1-AD1F9F
      limit: 100
