schema_version: 1

id: podman
name: Podman containers
version: 0.1.10
retired_below: 0.1.8
description: >
  Read-only inventory + per-container introspection plus narrow mutators
  (restart, stop, kill, prune). Drop-in alternative for Docker on RHEL /
  Fedora hosts. Rootless mode supported as long as the runner uid matches
  the user that owns the containers.
vendor: emisar
homepage: https://emisar.dev/packs/podman

requires:
  os:
    - linux
  binaries:
    - podman

setup:
  summary: >
    Drives the local podman CLI on the runner host — no credentials
    needed.
  notes:
    - "Rootless containers require a dedicated runner installed as their owner. The setup recipe cannot name that deployment-specific identity safely."
  host_access:
    - actions:
        - podman.info
        - podman.ps
        - podman.inspect
        - podman.logs
        - podman.stats
        - podman.images
        - podman.system_df
        - podman.restart
        - podman.stop
        - podman.kill
        - podman.system_prune
      requirement: Reach rootful or system-wide Podman containers as root.
      recipes:
        - name: Run the Emisar service as root for rootful Podman
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-podman-root.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
            - "sudo podman info >/dev/null"
          impact: >
            Every Emisar action on this runner executes as root and can read or change all
            rootful containers and the host resources they can mount.
  verify: podman.ps

actions:
  - actions/info.yaml
  - actions/version.yaml
  - actions/ps.yaml
  - actions/inspect.yaml
  - actions/logs.yaml
  - actions/stats.yaml
  - actions/images.yaml
  - actions/system_df.yaml
  - actions/restart.yaml
  - actions/stop.yaml
  - actions/kill.yaml
  - actions/system_prune.yaml
