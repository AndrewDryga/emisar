# These drive a container runtime, and the docker pack proved that need not
# mean the HOST's socket: a disposable daemon sibling in the case's own project
# is as isolated as any other SUT. Podman has no equally clean equivalent of
# docker:dind, so this one is declared pending its own measurement rather than
# on the disproven "socket means host root" reasoning.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    podman.inspect: requires_privileged_host
    podman.kill: requires_privileged_host
    podman.restart: requires_privileged_host
    podman.stop: requires_privileged_host
    podman.system_prune: requires_privileged_host
