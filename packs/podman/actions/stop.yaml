schema_version: 1
id: podman.stop
title: podman stop <id>
kind: exec
risk: high
description: Stop one container. Podman sends SIGTERM, then SIGKILL once the container's stop timeout expires (10 seconds unless the container sets its own).
side_effects:
  - Container stops.
  - Restart policy may bring it back unless --rm.
args:
  - name: container
    type: string
    required: true
    description: Container ID or name.
    validation:
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,63}$"
execution:
  command: {binary: podman, argv: ["stop", "{{ args.container }}"]}
  timeout: 2m
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Stop one
    args:
      container: "web"
