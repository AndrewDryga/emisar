schema_version: 1

id: debian.dpkg_changes
title: Recent dpkg installs/removes
kind: exec
risk: low

description: >
  Show recent dpkg install / remove / upgrade activity across
  /var/log/dpkg.log and its rotated logs (.1 and .*.gz), returned in
  time order. Use to answer "what was changed on this host recently?"
  before deeper forensics. Read-only.

side_effects:
  - Reads /var/log/dpkg.log and its rotated logs (/var/log/dpkg.log.1, /var/log/dpkg.log.*.gz).

search_terms:
  - what changed recently
  - recent installs
  - package history

args:
  - name: lines
    type: integer
    required: false
    default: 200
    description: How many tail lines.
    validation:
      min: 1
      max: 5000

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # 2>/dev/null covers the rotated-glob miss, and the pipeline exits with
      # tail's status — so a host with no dpkg.log at all would report success
      # with no output, reading as "nothing was installed recently".
      - |
        [ -r /var/log/dpkg.log ] || { echo "no readable dpkg log at /var/log/dpkg.log" >&2; exit 1; }
        zcat -f /var/log/dpkg.log /var/log/dpkg.log.* 2>/dev/null | sort | tail -n {{ args.lines }}
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384

examples:
  - title: Last 200 dpkg log lines
    args: {}
