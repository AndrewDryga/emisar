schema_version: 1

id: debian
name: Debian/Ubuntu package operations
version: 0.1.12
description: >
  Operator pack for Debian/Ubuntu hosts. Read-only inventory and
  patching diagnostics, plus narrow apt install/remove actions for a
  single named package. Designed for production hosts where a human
  approver must see the package name before a write happens.
vendor: emisar
homepage: https://emisar.dev/packs/debian

requires:
  os:
    - linux
  binaries:
    - apt-get
    - dpkg

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  notes:
    - "Read-only inventory (dpkg_status, apt_upgradable, apt_security_check, kernel_info) needs no privilege."
  host_access:
    - actions:
        - debian.apt_update
        - debian.apt_install
        - debian.apt_remove
        - debian.apt_autoremove
      requirement: Update apt state and install or remove packages as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-debian-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. Package actions can run
            maintainer scripts and change any file or service those packages control.
  verify: debian.dpkg_status

actions:
  - actions/apt_update.yaml
  - actions/apt_upgradable.yaml
  - actions/apt_security_check.yaml
  - actions/dpkg_status.yaml
  - actions/dpkg_changes.yaml
  - actions/kernel_info.yaml
  - actions/apt_install.yaml
  - actions/apt_remove.yaml
  - actions/apt_autoremove.yaml
