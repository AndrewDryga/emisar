# apt-get install and remove work as root in a disposable container —
# measured — and the package set they mutate is that container's, which is
# exactly what a case should assert. Declared because the root lane is not
# built, not because a host is required.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    debian.apt_autoremove: requires_privileged_host
    debian.apt_install: requires_privileged_host
    debian.apt_remove: requires_privileged_host
