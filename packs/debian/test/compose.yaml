services:
  # There is no separate SUT here: apt writes the package database of the
  # container the action runs in, which is this one, recreated per case and
  # thrown away with it. That IS the machine under test.
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/debian/test
      dockerfile: Dockerfile
      target: tools
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-13-slim}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-debian-tools:latest

  # The release whose apt and dpkg are under test. It serves no case — apt runs
  # in the runner container, which is the machine these actions mutate — but it
  # is what pins the matrix row and proves the digest, the same job docker-cli
  # does in the docker pack.
  debian:
    image: debian:${PACKTEST_VERSION:-13-slim}${PACKTEST_DIGEST-}
    command: ["sleep", "3600"]
    healthcheck:
      test: ["CMD", "apt-get", "--version"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
