services: [fail2ban]
versions:
  - version: "trixie-20260918-slim"
    digest: "@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"
    default: true
workers: 1
cases:
  - name: status-uses-the-recipe-granted-socket
    action: f2b.status
    expect:
      stdout_contains: [Status]

  - name: socket-grant-survives-daemon-and-runner-restarts
    action: f2b.status
    runner_user: root
    runner_reason: Restarts the disposable systemd-owned Fail2ban service before probing the unprivileged identity.
    arrange:
      - argv: [systemctl, restart, fail2ban.service]
      - argv: [systemctl, restart, emisar.service]
      - argv: [systemctl, restart, fail2ban.service]
    expect:
      stdout_contains: [Status]
    probes:
      - name: the emisar uid can still use the recreated socket
        argv: [setpriv, --reuid=65532, --regid=65532, --clear-groups, fail2ban-client, status]
        expect:
          stdout_contains: [Status]
      - name: the runner service restarted successfully
        argv: [systemctl, is-active, emisar.service]
        expect:
          stdout_contains: [active]

  # Without a jail the action reloads everything: an empty jail argument is not
  # the same request, since fail2ban-client treats only no argument or --all as
  # a full reload and takes anything else as a jail name.
  - name: reload-without-a-jail-reloads-every-jail
    action: f2b.reload
    expect:
      status: success
      stdout_contains: [OK]
    probes:
      - name: the server answers after the full reload
        argv: [fail2ban-client, status]
        expect:
          stdout_contains: [Status]
