services: [fail2ban]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
risk_accountability:
  mode: complete
  exceptions:
    # A container ban changes only its disposable netfilter namespace, so it
    # cannot prove the action protects the host that runs the container.
    f2b.banip: requires_privileged_host
workers: 1
cases:
  - name: status-uses-the-recipe-granted-socket
    action: f2b.status
    expect:
      stdout_contains: [Status]

  - name: socket-grant-survives-daemon-and-runner-restarts
    action: f2b.status
    runner_user: root
    runner_reason: Restarts the disposable systemd-owned Fail2ban service before probing the unprivileged identity.
    arrange:
      - argv: [systemctl, restart, fail2ban.service]
      - argv: [systemctl, restart, emisar.service]
      - argv: [systemctl, restart, fail2ban.service]
    expect:
      stdout_contains: [Status]
    probes:
      - name: the emisar uid can still use the recreated socket
        argv: [setpriv, --reuid=65532, --regid=65532, --clear-groups, fail2ban-client, status]
        expect:
          stdout_contains: [Status]
      - name: the runner service restarted successfully
        argv: [systemctl, is-active, emisar.service]
        expect:
          stdout_contains: [active]
