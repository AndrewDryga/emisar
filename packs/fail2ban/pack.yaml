schema_version: 1

id: fail2ban
name: fail2ban
version: 0.1.9
description: >
  fail2ban inventory + per-jail banned-IP listings plus operator mutators
  for incident response: ban an IP into a jail, unban a false positive,
  reload jail filters from disk.
vendor: emisar
homepage: https://emisar.dev/packs/fail2ban

requires:
  os:
    - linux
  binaries:
    - fail2ban-client

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - fail2ban-server

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  notes:
    - "The fail2ban-client actions talk to the local daemon socket and need write access through its owner, group, or ACL. f2b.log_tail instead needs read access to /var/log/fail2ban.log. Grant only the access the actions you enable require; sudo cannot elevate an action because the runner enforces no_new_privs."
  verify: f2b.status

actions:
  - actions/status.yaml
  - actions/version.yaml
  - actions/jail_status.yaml
  - actions/banned_ips.yaml
  - actions/log_tail.yaml
  - actions/unban_ip.yaml
  - actions/banip.yaml
  - actions/reload.yaml
