schema_version: 1
id: tfc.plan_summary
title: Project an HCP Terraform plan into a reviewable summary
kind: script
risk: low
search_terms:
  - review plan
  - what will change
  - destroy count
description: >
  List what a run's plan would create, update, delete, or replace, with
  per-action counts, drift, and planned output changes. The summary counts
  always cover the whole plan; the change, drift, and output lists keep a
  bounded sample — most destructive first — and `truncated` reports how many
  entries each list dropped, so the result fits the runner's structured-output
  cap on plans of any size. Attribute and output VALUES are never emitted —
  only addresses, types, actions, names, and the bounded `replace_paths` that
  identify replacement-forcing attributes — because the structured plan HCP
  Terraform serves carries every value in cleartext, sensitive ones included.
  Needs a user or team token with admin access to the workspace;
  tfc.run_details gives counts on a read-only token.
side_effects:
  - One read-only HTTP GET, followed to the API's presigned redirect.
  - Read-only.
args:
  - name: run_id
    type: string
    required: true
    description: Run ID from list_runs (run-…).
    validation:
      pattern: "^run-[A-Za-z0-9]{1,32}$"
      max_length: 36
execution:
  script:
    path: scripts/tfc.sh
    interpreter: /bin/bash
  argv: [plan_summary, "{{ args.run_id }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [source, cli_version, summary, changes, drift, outputs, truncated]
    properties:
      source: {const: hcp_plan}
      cli_version: {type: string, maxLength: 32}
      summary:
        type: object
        additionalProperties: false
        required: [total, create, update, delete, replace, read, import, drifted]
        properties:
          total: {type: integer, minimum: 0}
          create: {type: integer, minimum: 0}
          update: {type: integer, minimum: 0}
          delete: {type: integer, minimum: 0}
          replace: {type: integer, minimum: 0}
          read: {type: integer, minimum: 0}
          import: {type: integer, minimum: 0}
          drifted: {type: integer, minimum: 0}
      changes:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action, reason, replace_paths, replace_paths_truncated]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
            reason: {type: string, maxLength: 36}
            replace_paths:
              type: array
              maxItems: 2
              items: {type: string, maxLength: 32}
            replace_paths_truncated: {type: integer, minimum: 0}
      drift:
        type: array
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [address, resource_type, module, action]
          properties:
            address: {type: string, maxLength: 80}
            resource_type: {type: string, maxLength: 44}
            module: {type: string, maxLength: 32}
            action: {type: string, maxLength: 12}
      outputs:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required: [name, action, sensitive]
          properties:
            name: {type: string, maxLength: 40}
            action: {type: string, maxLength: 12}
            sensitive: {type: boolean}
      truncated:
        type: object
        additionalProperties: false
        required: [changes, drift, outputs]
        properties:
          changes: {type: integer, minimum: 0}
          drift: {type: integer, minimum: 0}
          outputs: {type: integer, minimum: 0}
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Review what a run would change
    args:
      run_id: run-4Qm7TvLpXsRbNc2d
