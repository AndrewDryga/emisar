schema_version: 1
id: tfc.lock_workspace
title: POST /workspaces/<id>/actions/lock
kind: script
risk: medium
description: >
  Lock a workspace and record why, so queued and new runs hold before planning
  or applying and nothing can write its state until it is unlocked.
  Speculative plan-only runs still work. Reversible with tfc.unlock_workspace;
  a workspace that is already locked answers 409. Returns the workspace's lock
  state afterwards.
side_effects:
  - New and queued runs hold before planning or applying until the workspace is unlocked.
  - Blocks state writes; reversible with tfc.unlock_workspace.
  - Requires a user or team token with the workspace's lock/unlock permission.
search_terms:
  - freeze a workspace
  - maintenance lock
args:
  - name: workspace_id
    type: string
    required: true
    description: Workspace to lock (ws-…).
    validation:
      pattern: "^ws-[A-Za-z0-9]{1,32}$"
      max_length: 35
  - name: reason
    type: string
    required: false
    default: ""
    description: Reason recorded on the lock in HCP Terraform.
    validation:
      max_length: 512
execution:
  script:
    path: scripts/tfc.sh
    interpreter: /bin/bash
  argv: [lock, "{{ args.workspace_id }}", "{{ args.reason }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [workspace]
    properties:
      workspace:
        type: object
        additionalProperties: false
        required:
          - id
          - name
          - execution_mode
          - terraform_version
          - auto_apply
          - locked
          - locked_reason
          - locked_by
          - current_run_id
          - vcs_repo
          - working_directory
          - resource_count
          - updated_at
        properties:
          id: {type: string}
          name: {type: string, maxLength: 90}
          execution_mode: {type: string}
          terraform_version: {type: string, maxLength: 64}
          auto_apply: {type: boolean}
          locked: {type: boolean}
          locked_reason: {type: string, maxLength: 160}
          locked_by:
            type: [object, "null"]
            additionalProperties: false
            required: [type, id]
            properties:
              type: {type: string, maxLength: 24}
              id: {type: string, maxLength: 48}
          current_run_id: {type: [string, "null"]}
          vcs_repo:
            type: [object, "null"]
            additionalProperties: false
            required: [identifier, branch]
            properties:
              identifier: {type: string, maxLength: 120}
              branch: {type: string, maxLength: 80}
          working_directory: {type: string, maxLength: 120}
          resource_count: {type: integer}
          updated_at: {type: string}
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Freeze a workspace during an investigation
    args:
      workspace_id: ws-8Rp2nKcQvWxYzA1b
      reason: Incident 4821 investigation
