schema_version: 1
id: tfc.cancel_run
title: POST /runs/<id>/actions/cancel
kind: script
risk: medium
description: >
  Interrupt a run that is currently planning or applying. Cancelling mid-apply
  stops Terraform partway, so the workspace can be left with some changes made
  and others not; prefer discard_run for a run that has only planned. Returns
  the run's state afterwards.
side_effects:
  - Interrupts the run; an apply already in flight stops partway through.
  - Can leave infrastructure partially changed and state needing reconciliation.
  - Requires a user or team token with permission to apply runs.
args:
  - name: run_id
    type: string
    required: true
    description: Run ID to cancel (run-…).
    validation:
      pattern: "^run-[A-Za-z0-9]{1,32}$"
      max_length: 36
  - name: comment
    type: string
    required: false
    default: ""
    description: Comment recorded on the run in HCP Terraform.
    validation:
      max_length: 512
execution:
  script:
    path: scripts/tfc.sh
    interpreter: /bin/bash
  argv: [cancel, "{{ args.run_id }}", "{{ args.comment }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [run]
    properties:
      run:
        type: object
        additionalProperties: false
        required:
          - id
          - status
          - message
          - is_destroy
          - plan_only
          - has_changes
          - source
          - created_at
          - workspace_id
          - actions
        properties:
          id: {type: string}
          status: {type: string}
          message: {type: string, maxLength: 100}
          is_destroy: {type: boolean}
          plan_only: {type: boolean}
          has_changes: {type: boolean}
          source: {type: string}
          created_at: {type: string}
          workspace_id: {type: string}
          actions:
            type: object
            additionalProperties: false
            required: [confirmable, discardable, cancelable]
            properties:
              confirmable: {type: boolean}
              discardable: {type: boolean}
              cancelable: {type: boolean}
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Interrupt a stuck run
    args:
      run_id: run-4Qm7TvLpXsRbNc2d
      comment: Interrupting a hung plan
