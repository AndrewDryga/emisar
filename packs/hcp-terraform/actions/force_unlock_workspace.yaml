schema_version: 1
id: tfc.force_unlock_workspace
title: POST /workspaces/<id>/actions/force-unlock
kind: script
risk: high
description: >
  Force-unlock a workspace, breaking a lock held by a run, another user, or a
  team. This is the recovery for a dead run that never released its lock — but
  if that run is in fact still applying, breaking the lock lets a second
  writer at the state and can corrupt or lose it. First read the holder from
  tfc.workspace_details and confirm with tfc.run_details that it is finished,
  and when a plain unlock answers 503 (state still finalizing), retry
  tfc.unlock_workspace instead of escalating to force. Returns the workspace's
  lock state afterwards.
side_effects:
  - Breaks any lock, including a live run's — an apply still writing then shares state with the next writer, which can corrupt or lose state.
  - Pending runs proceed; on an auto-apply workspace an apply can start without further review.
  - Requires a user or team token with admin access to the workspace.
search_terms:
  - force unlock a stuck workspace
  - lock held by a dead run
args:
  - name: workspace_id
    type: string
    required: true
    description: Workspace to force-unlock (ws-…).
    validation:
      pattern: "^ws-[A-Za-z0-9]{1,32}$"
      max_length: 35
execution:
  script:
    path: scripts/tfc.sh
    interpreter: /bin/bash
  argv: [force-unlock, "{{ args.workspace_id }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [workspace]
    properties:
      workspace:
        type: object
        additionalProperties: false
        required:
          - id
          - name
          - execution_mode
          - terraform_version
          - auto_apply
          - locked
          - locked_reason
          - locked_by
          - current_run_id
          - vcs_repo
          - working_directory
          - resource_count
          - updated_at
        properties:
          id: {type: string}
          name: {type: string, maxLength: 90}
          execution_mode: {type: string}
          terraform_version: {type: string, maxLength: 64}
          auto_apply: {type: boolean}
          locked: {type: boolean}
          locked_reason: {type: string, maxLength: 160}
          locked_by:
            type: [object, "null"]
            additionalProperties: false
            required: [type, id]
            properties:
              type: {type: string, maxLength: 24}
              id: {type: string, maxLength: 48}
          current_run_id: {type: [string, "null"]}
          vcs_repo:
            type: [object, "null"]
            additionalProperties: false
            required: [identifier, branch]
            properties:
              identifier: {type: string, maxLength: 120}
              branch: {type: string, maxLength: 80}
          working_directory: {type: string, maxLength: 120}
          resource_count: {type: integer}
          updated_at: {type: string}
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Break a dead run's lock
    args:
      workspace_id: ws-8Rp2nKcQvWxYzA1b
