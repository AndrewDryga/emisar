schema_version: 1
id: tfc.create_plan_only_run
title: POST /runs (plan-only)
kind: script
risk: medium
description: >
  Queue a speculative plan-only run against a workspace's current configuration.
  A plan-only run can never be applied, so this asks "what would change?"
  without putting an applyable plan in front of anyone. Review the result with
  tfc.plan_summary once it finishes.
side_effects:
  - Queues work on HCP Terraform's runners and consumes plan minutes.
  - Calls every provider's read API to refresh state — quota usage applies.
  - Creates no applyable plan; a plan-only run cannot be confirmed.
search_terms:
  - what would change
  - speculative plan
  - dry run
args:
  - name: workspace_id
    type: string
    required: true
    description: Workspace to plan against (ws-…).
    validation:
      pattern: "^ws-[A-Za-z0-9]{1,32}$"
      max_length: 35
  - name: message
    type: string
    required: false
    default: ""
    description: Message recorded on the run in HCP Terraform.
    validation:
      max_length: 512
execution:
  script:
    path: scripts/tfc.sh
    interpreter: /bin/bash
  argv: [create_plan_only_run, "{{ args.workspace_id }}", "{{ args.message }}"]
  timeout: 2m
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [run]
    properties:
      run:
        type: object
        additionalProperties: false
        required:
          - id
          - status
          - message
          - is_destroy
          - plan_only
          - has_changes
          - source
          - created_at
          - workspace_id
          - actions
        properties:
          id: {type: string}
          status: {type: string}
          message: {type: string}
          is_destroy: {type: boolean}
          plan_only: {type: boolean}
          has_changes: {type: boolean}
          source: {type: string}
          created_at: {type: string}
          workspace_id: {type: string}
          actions:
            type: object
            additionalProperties: false
            required: [confirmable, discardable, cancelable]
            properties:
              confirmable: {type: boolean}
              discardable: {type: boolean}
              cancelable: {type: boolean}
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Ask what a workspace would change
    args:
      workspace_id: ws-8Rp2nKcQvWxYzA1b
      message: Pre-change review
