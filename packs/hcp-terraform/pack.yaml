schema_version: 1

id: hcp-terraform
name: HCP Terraform run review and gating
version: 0.8.7
description: >
  Review HCP Terraform (formerly Terraform Cloud) and Terraform Enterprise runs
  and gate what happens next: list workspaces and runs, project a run's plan
  into a summary that carries no resource or output values but does identify
  the bounded attribute paths that force replacement, read why a run
  failed from a bounded tail of its plan or apply log, queue a speculative
  plan-only run, retry a failed run against its exact configuration version,
  and confirm, discard, or cancel a run through emisar's policy and approval
  path instead of the HCP UI.
vendor: emisar
homepage: https://emisar.dev/packs/hcp-terraform

requires:
  os:
    - linux
  binaries:
    - curl
    - jq
    - bash

setup:
  summary: >
    Calls the HCP Terraform JSON:API over HTTPS with curl, sending the token in
    an Authorization: Bearer header read from `TFE_TOKEN`, so allowlist that
    variable in `inherit_env`. Point `TFE_ADDRESS` at your Terraform Enterprise host
    to use this against a self-managed install.
  env:
    - name: TFE_TOKEN
      required: true
      description: >
        API token. A user or team token scoped to the workspaces you want
        reviewable; see the notes for what each action needs.
    - name: TFE_ADDRESS
      description: API host, for Terraform Enterprise or a private HCP region.
      default: https://app.terraform.io
      example: https://tfe.example.com
  notes:
    - "Create a user token at [app.terraform.io/app/settings/tokens](https://app.terraform.io/app/settings/tokens), or a team token under Organization Settings → Teams → the team → Team API token. The organization token (Organization Settings → API tokens) is the one several actions here reject."
    - "plan_summary calls the plan's json-output endpoint, which HashiCorp does NOT allow organization tokens to reach: it needs a user or team token with admin access to the workspace. run_details works with any token that can read runs and still reports the plan's add/change/destroy counts, so prefer it when you do not want to hand out workspace admin."
    - "apply_run, discard_run, and cancel_run also reject organization tokens — HCP requires a user or team token with permission to apply runs for the workspace."
    - "The token can do everything these actions expose, so scope it to the workspaces you actually want reachable and let emisar policy decide who may reach the mutating actions."
    - "Needs curl 7.76 or newer: the actions use --fail-with-body so a rejected request reports the API's error document instead of failing with empty output."
    - "json-output answers with a one-minute presigned redirect. curl drops the Authorization header on that cross-host hop by design; the redirect target carries its own signature."
    - "run_diagnostics downloads the failed phase's log through the presigned URL HCP returns. That URL is a credential and never appears in output or audit, but the log text itself becomes part of the governed result — which is why this read is medium risk and policy-gated."
    - "retry_run creates a standard run, so HCP requires a user or team token that can queue plans in the workspace. The new run is created with auto-apply off and still needs tfc.apply_run before anything changes."
    - "create_plan_only_run needs a remote- or agent-execution workspace and a usable configuration already associated with it. Local-execution workspaces and never-configured workspaces cannot plan through HCP runners."
  verify: tfc.list_organizations

actions:
  - actions/list_organizations.yaml
  - actions/list_workspaces.yaml
  - actions/workspace_details.yaml
  - actions/list_runs.yaml
  - actions/run_details.yaml
  - actions/plan_summary.yaml
  - actions/run_diagnostics.yaml
  - actions/create_plan_only_run.yaml
  - actions/retry_run.yaml
  - actions/apply_run.yaml
  - actions/discard_run.yaml
  - actions/cancel_run.yaml
  - actions/lock_workspace.yaml
  - actions/unlock_workspace.yaml
  - actions/force_unlock_workspace.yaml
