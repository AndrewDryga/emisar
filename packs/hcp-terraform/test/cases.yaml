services: [tfc-api]
versions:
  - version: "3.14.0-alpine3.22"
    digest: "@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710"
    default: true
secret_env: [TFE_TOKEN]
env:
  TFE_ADDRESS: http://tfc-api:8080
  TFE_TOKEN: packtest-canary-tfe-token-6d2a
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains:
      - packtest-canary-tfe-token-6d2a
      - packtest-canary-tfe-plan-secret-91c7
      # The signature of a presigned log URL is a credential; no action may
      # emit the URL it fetched a log through.
      - packtest-canary-tfe-log-signature-4b9e
cases:
  - action: tfc.list_organizations
    expect:
      json:
        /organizations/0/name: example-corp
        /organizations/0/email: platform@example.test
        /next_page: null

  # Page 2 is the fixture's maximal page: as many organizations as one request
  # may ask for, every contact email longer than the 100-character clip. The
  # success status is the byte-cap proof — an oversized page fails validation.
  - name: tfc.list_organizations-fits-the-cap-at-the-maximum-page-size
    action: tfc.list_organizations
    args: {page_size: 20, page: 2}
    expect:
      json:
        /organizations/19/name: mega-operations-team-19
        /organizations/19/email: "team-19-operations-operations-operations-operations-operations-operations-operations-operations-ope…"
        /next_page: 3

  # Page 3 floods every email with U+2028 — the six-byte-escape codepoint — so
  # all twenty rows hit the calculated per-entry maximum at once.
  - name: tfc.list_organizations-fits-the-cap-when-every-row-is-worst-case
    action: tfc.list_organizations
    args: {page_size: 20, page: 3}
    expect:
      json:
        /organizations/19/name: mega-operations-team-19
        /next_page: 4

  - action: tfc.list_workspaces
    args: {organization: example-corp}
    expect:
      json:
        /workspaces/0/id: ws-8Rp2nKcQvWxYzA1b
        /workspaces/0/name: production-network
        /workspaces/0/auto_apply: false
        /workspaces/0/locked: true
        /workspaces/0/resource_count: 47
        # The API said there is a second page, so the caller is told rather than
        # being handed a silently truncated list.
        /next_page: 2

  # The mega organization's workspaces all carry 90-character names — the
  # longest HCP Terraform accepts — and a TFE custom Terraform version longer
  # than the 64-codepoint clip, at the maximum advertised page_size. The
  # success status is the byte-cap proof — an oversized page fails validation.
  - name: tfc.list_workspaces-fits-the-cap-at-the-maximum-page-size
    action: tfc.list_workspaces
    args: {organization: example-mega-corp, page_size: 20}
    expect:
      json:
        /workspaces/19/name: platform-network-segment-19-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        /workspaces/19/terraform_version: "1.13.1-custom-enterprise-build-with-provider-mirror-2026-07-28-…"
        /next_page: 2

  - action: tfc.list_runs
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b}
    expect:
      json:
        /runs/0/id: run-4Qm7TvLpXsRbNc2d
        /runs/0/status: planned
        /runs/0/workspace_id: ws-8Rp2nKcQvWxYzA1b
        /runs/0/actions/confirmable: true
        /next_page: null

  # The runner rejects a structured result over 8 KiB, so a full page at the
  # maximum advertised page_size must clear it against the nastiest messages a
  # workspace accumulates: whole CI commit lines, floods of the characters JSON
  # escaping doubles, multibyte text, and raw ANSI/control bytes — ESC, BEL,
  # NUL, tab, newline, DEL and a C1 byte, which is the full span the cleanup
  # claims (Unicode Cc, U+0000–U+001F and U+007F–U+009F). Success here IS the
  # byte-cap proof — an oversized page fails validation. The clipped projection
  # cuts to 100 characters with an ellipsis and collapses each control run to
  # one space, leaving a space already in the text alone, so no escape byte
  # survives into the output.
  - name: tfc.list_runs-fits-the-cap-at-the-maximum-page-size
    action: tfc.list_runs
    args: {workspace_id: ws-MaxPageWyXz9Qb7c, page_size: 12}
    expect:
      stdout_not_contains:
        - '\u001b'
      json:
        /runs/0/message: "Merge pull request #4821 from blitz/renovate/major-terraform-google-modules aaaaaaaaaaaaaaaaaaaaaaa…"
        /runs/6/message: "deploy: [31m red  bell null tab line2 del c1 line3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"
        /runs/11/id: run-Worst00000000011
        /next_page: 2

  # jq's regex builtins are optional: a jq configured --with-oniguruma=no
  # raises "jq was compiled without ONIGURUMA regex library" the moment a
  # filter reaches one, so this pack's projections stay on core jq. The shared
  # client image builds that jq at /opt/jq-without-regex, and these cases put
  # it ahead of the packaged one on PATH — everything else here keeps running
  # against the Oniguruma-enabled jq an operator's host actually has.
  #
  # This is the same worst page as the case above, asserted the same way: the
  # control-run collapse, the clip, and the page bounds are what used to need
  # gsub.
  - name: tfc.list_runs-projects-the-worst-page-without-jq-regex-support
    action: tfc.list_runs
    args: {workspace_id: ws-MaxPageWyXz9Qb7c, page_size: 12}
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      stdout_not_contains:
        - '\u001b'
      json:
        /runs/6/message: "deploy: [31m red  bell null tab line2 del c1 line3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"
        /runs/11/id: run-Worst00000000011
        /next_page: 2

  # Every message on this page is a flood of U+2028 — the one codepoint whose
  # JSON escape costs six bytes — so all twelve rows sit at the projection's
  # calculated per-entry maximum at once, not just in a mixed sample.
  - name: tfc.list_runs-fits-the-cap-when-every-row-is-worst-case
    action: tfc.list_runs
    args: {workspace_id: ws-AllWorstZq3Vf8Xk, page_size: 12}
    expect:
      json:
        /runs/11/id: run-Worst00000000011
        /runs/11/workspace_id: ws-AllWorstZq3Vf8Xk
        /next_page: 2

  - name: tfc.list_runs-rejects-a-page-size-over-the-cap
    action: tfc.list_runs
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b, page_size: 13}
    expect:
      status: failure
      reason_contains: ["must be <= 12"]

  - action: tfc.run_details
    args: {run_id: run-4Qm7TvLpXsRbNc2d}
    expect:
      json:
        /run/status: planned
        /plan/status: finished
        /plan/resource_additions: 1
        /plan/resource_changes: 1
        /plan/resource_destructions: 2

  # The fixture's plan carries the canary in a sensitive output AND in resource
  # attributes, exactly where a real plan carries a secret. The default
  # stdout_not_contains proves the projection reads neither. The lists sort
  # most destructive first, and a complete plan reports zero omitted entries.
  - action: tfc.plan_summary
    args: {run_id: run-4Qm7TvLpXsRbNc2d}
    expect:
      stdout_contains:
        - aws_instance.api
        - module.db
        - delete_because_no_resource_config
        - db_password
      stdout_not_contains:
        # no-op resources and outputs are review noise and are filtered out.
        - aws_iam_role.unchanged
        - stable
      json:
        /source: hcp_plan
        /cli_version: 1.13.1
        /summary/total: 3
        /summary/create: 0
        /summary/update: 1
        /summary/delete: 1
        /summary/replace: 1
        /summary/drifted: 1
        /changes/0/address: aws_s3_bucket.legacy
        /changes/0/action: delete
        /changes/1/address: aws_instance.api
        /changes/1/replace_paths/0: user_data
        /changes/1/replace_paths_truncated: 0
        /drift/0/address: aws_security_group.web
        /outputs/0/name: db_password
        /outputs/0/sensitive: true
        /truncated/changes: 0
        /truncated/drift: 0
        /truncated/outputs: 0

  # A production-scale plan whose every field is hostile: 400 changes, 200
  # drifted resources, 47 changed outputs, every string flooded past its clip
  # with the bytes JSON escaping doubles. The runner rejects a structured
  # result over 8 KiB, so this case's success IS the byte-cap proof; the
  # truncated counts keep the partial lists honest, and the sentinel deletes
  # pin the exact clip boundary — 80 characters survive intact, 81 clip to 79
  # plus an ellipsis.
  - name: tfc.plan_summary-fits-the-cap-on-a-worst-case-plan
    action: tfc.plan_summary
    args: {run_id: run-HugePlanWorstCase}
    expect:
      json:
        /source: hcp_plan
        /cli_version: "1.13.1-enterprise-worst-case-bu…"
        /summary/total: 400
        /summary/delete: 120
        /summary/replace: 80
        /summary/drifted: 200
        /changes/0/address: AAA-sentinel-delete-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        /changes/0/action: delete
        /changes/1/address: "AAB-sentinel-delete-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"
        /changes/0/replace_paths_truncated: 1
        /truncated/changes: 390
        /truncated/drift: 197
        /truncated/outputs: 43

  # The fixture's document still reads back as a plan but carries a scalar
  # where a collection belongs. Skipping the type error would yield a
  # confident, entirely EMPTY summary for a plan whose contents are unknown,
  # so the action refuses rather than answers.
  - name: tfc.plan_summary-fails-closed-on-a-malformed-collection
    action: tfc.plan_summary
    args: {run_id: run-MalformedPlanDoc}
    expect:
      status: failure
      stderr_contains: [resource_drift in the plan document is string rather than an array]
      stdout_not_contains: ['"total":0']

  # The fixture serves a document from a format major no released CLI emits.
  # The JSON-format contract says a consumer must reject an unsupported major
  # — a 2.x document could keep these collection types while changing what
  # the members mean — so the action refuses, naming the version.
  - name: tfc.plan_summary-refuses-an-unsupported-format-version
    action: tfc.plan_summary
    args: {run_id: run-FutureFormatPlan}
    expect:
      status: failure
      stderr_contains: ['format_version "2.0" in the plan document is not a supported 0.x or 1.x plan format']
      stdout_not_contains: ['"total":0']

  # The plan projection under the jq built without Oniguruma: the supported
  # 1.x document still projects, and the 2.x document is still refused by name
  # — the two sides of the version gate that used to be a test() call, plus the
  # clip that builds that refusal message.
  - name: tfc.plan_summary-projects-without-jq-regex-support
    action: tfc.plan_summary
    args: {run_id: run-4Qm7TvLpXsRbNc2d}
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      json:
        /source: hcp_plan
        /cli_version: 1.13.1
        /summary/total: 3
        /summary/delete: 1
        /summary/replace: 1
        /changes/0/address: aws_s3_bucket.legacy

  - name: tfc.plan_summary-refuses-an-unsupported-format-version-without-jq-regex-support
    action: tfc.plan_summary
    args: {run_id: run-FutureFormatPlan}
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      status: failure
      stderr_contains: ['format_version "2.0" in the plan document is not a supported 0.x or 1.x plan format']
      stdout_not_contains: ['"total":0']

  # The plan is the failed phase. The tail keeps only the last 60 lines and
  # 2 KiB with ANSI control codes stripped ('\u001b' is how a surviving
  # escape byte would read in the JSON output), and the presigned log URL
  # stays out of stdout — its signature canary sits in the default
  # stdout_not_contains. Against the fixture's 304-line log both bounds cut:
  # line 42 falls outside the 60-line window, line 250 survives the line
  # window but not the 2 KiB byte cap, and the error block at the end is what
  # the tail keeps.
  - action: tfc.run_diagnostics
    args: {run_id: run-2PlanErrVt8Kq5Wd}
    expect:
      stdout_contains:
        - "Error: creating S3 Bucket (emisar-legacy): AccessDenied"
        - refresh line 280
      stdout_not_contains:
        - '\u001b'
        - refresh line 42
        - refresh line 250
      json:
        /phase: plan
        /run/status: errored
        /diagnostics/status: errored
        /diagnostics/started_at: "2026-07-30T02:11:04+00:00"
        /diagnostics/ended_at: "2026-07-30T02:12:31+00:00"
        /log/available: true

  # The worst structured result this action can emit: every log byte is
  # invalid UTF-8, which jq replaces with three-byte U+FFFD — the worst
  # raw-to-encoded expansion the tail can meet — and the run message is a
  # U+2028 flood whose escape doubles during the runner's canonical
  # re-encode. The runner rejects a structured result over 8 KiB, so this
  # case's success IS the byte-cap proof, and the sentinel shows the tail
  # still ends with the error line an operator diagnoses from.
  - name: tfc.run_diagnostics-fits-the-cap-when-the-tail-is-worst-case
    action: tfc.run_diagnostics
    args: {run_id: run-1TailFloodMx9Kd4Ws}
    expect:
      stdout_contains:
        - "Error: worst-case tail flood sentinel"
      json:
        /phase: plan
        /diagnostics/status: errored
        /log/available: true

  - name: tfc.run_diagnostics-selects-the-apply-phase
    action: tfc.run_diagnostics
    args: {run_id: run-3ApplyErrJn6Rt4c}
    expect:
      stdout_contains:
        - "Error: updating RDS DB Instance (emisar-db): timeout while waiting for state"
      json:
        /phase: apply
        /diagnostics/status: errored
        /diagnostics/ended_at: "2026-07-29T10:02:47+00:00"
        /log/available: true

  # HCP returned no log-read-url for the errored plan: say so instead of
  # emitting an empty tail that reads as "the log was clean".
  - name: tfc.run_diagnostics-reports-a-missing-log
    action: tfc.run_diagnostics
    args: {run_id: run-5NoLogWp4Hs2Ym8q}
    expect:
      json:
        /phase: plan
        /log/available: false
        /log/reason: HCP returned no log for this phase

  - name: tfc.run_diagnostics-reports-an-unreadable-log
    action: tfc.run_diagnostics
    args: {run_id: run-6DeniedBv1Zx7Qf3}
    expect:
      json:
        /phase: plan
        /log/available: false
        /log/reason: the log is gone or this token may not read it

  # curl expands {a,b} in a URL into one transfer per alternative, which would
  # hand the presigned signature to a second host of the API's choosing. The
  # log must stay unfetched — the error line the fixture would serve proves it
  # if it ever appears.
  - name: tfc.run_diagnostics-refuses-a-log-url-that-smuggles-a-second-host
    action: tfc.run_diagnostics
    args: {run_id: run-9GlobUrlYz2Bc5Df}
    expect:
      stdout_not_contains:
        - "Error: creating S3 Bucket (emisar-legacy): AccessDenied"
      json:
        /phase: plan
        /log/available: false
        /log/reason: HCP returned a malformed log URL

  - name: tfc.run_diagnostics-refuses-a-run-that-did-not-fail
    action: tfc.run_diagnostics
    args: {run_id: run-4Qm7TvLpXsRbNc2d}
    expect:
      status: failure
      exit: [1]
      stderr_contains: [has no errored or canceled plan or apply phase]

  - action: tfc.create_plan_only_run
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b, message: Pre-change review}
    expect:
      json:
        /run/id: run-9Zk3WdFyHnJqEr5t
        /run/plan_only: true
        /run/status: pending
        /run/actions/confirmable: false
    probes:
      - name: the speculative run exists and can never be confirmed
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/runs/run-9Zk3WdFyHnJqEr5t"]
        expect:
          stdout_contains: ['"status": "pending"']

  - action: tfc.retry_run
    args: {source_run_id: run-2PlanErrVt8Kq5Wd, message: Retry after fixing IAM}
    expect:
      json:
        /run/id: run-7Xb5RetryNpQw3Ke
        /run/status: pending
        /run/plan_only: false
        /source_run_id: run-2PlanErrVt8Kq5Wd
        /configuration_version_id: cv-6JmJpQnRsTuVwX2y
    probes:
      - name: the retry pinned the exact configuration version and still needs a human apply
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/runs/run-7Xb5RetryNpQw3Ke"]
        expect:
          stdout_contains:
            - '"status": "pending"'
            - '"plan-only": false'
            - '"auto-apply": false'
            - '"configuration-version": "cv-6JmJpQnRsTuVwX2y"'

  - name: tfc.retry_run-refuses-a-non-terminal-source
    action: tfc.retry_run
    args: {source_run_id: run-4Qm7TvLpXsRbNc2d}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["retry only re-runs an errored, canceled, force_canceled, or discarded run"]

  # The canceled status passes the terminal gate; the absent configuration
  # version is what must fail closed.
  - name: tfc.retry_run-fails-closed-without-a-configuration-version
    action: tfc.retry_run
    args: {source_run_id: run-8NoCvFh9Kl4Tq6wY}
    expect:
      status: failure
      exit: [1]
      stderr_contains: [must be a cv-]

  - action: tfc.apply_run
    args: {run_id: run-4Qm7TvLpXsRbNc2d, comment: Reviewed via emisar}
    expect:
      json:
        /run/status: applying
        /run/actions/confirmable: false
    probes:
      - name: the run really left the planned state
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/runs/run-4Qm7TvLpXsRbNc2d"]
        expect:
          stdout_contains: ['"status": "applying"']

  - action: tfc.discard_run
    args: {run_id: run-4Qm7TvLpXsRbNc2d, comment: Superseded}
    expect:
      json:
        /run/status: discarded
        /run/actions/confirmable: false
    probes:
      - name: the plan can no longer be applied
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/runs/run-4Qm7TvLpXsRbNc2d"]
        expect:
          stdout_contains: ['"status": "discarded"']

  - action: tfc.cancel_run
    args: {run_id: run-4Qm7TvLpXsRbNc2d, comment: Interrupting a hung plan}
    expect:
      json:
        /run/status: canceled
    probes:
      - name: the run was interrupted
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/runs/run-4Qm7TvLpXsRbNc2d"]
        expect:
          stdout_contains: ['"status": "canceled"']

  - name: tfc.run_details-rejects-foreign-id
    action: tfc.run_details
    args: {run_id: ws-8Rp2nKcQvWxYzA1b}
    expect:
      status: failure
      reason_contains: [must match pattern]

  - action: tfc.workspace_details
    args: {organization: example-corp, workspace: production-network}
    expect:
      json:
        /workspace/id: ws-8Rp2nKcQvWxYzA1b
        /workspace/locked: true
        /workspace/locked_reason: release freeze
        /workspace/locked_by/type: user
        /workspace/vcs_repo/identifier: example-corp/network

  # The fixture workspace starts locked, so lock has to release it first — and
  # that arrange step is also what proves the action is not simply reporting a
  # state it found.
  - action: tfc.lock_workspace
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b, reason: Incident 4821 investigation}
    arrange:
      - argv: [/bin/sh, -c, "curl -fsS -X POST -H 'Content-Type: application/vnd.api+json' -H 'Authorization: Bearer packtest-canary-tfe-token-6d2a' http://tfc-api:8080/api/v2/workspaces/ws-8Rp2nKcQvWxYzA1b/actions/unlock"]
    expect:
      json:
        /workspace/locked: true
        /workspace/locked_reason: Incident 4821 investigation
    probes:
      - name: the workspace really holds the lock
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/workspace-lock"]
        expect:
          stdout_contains: ['"locked": true']

  - action: tfc.unlock_workspace
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b}
    expect:
      json:
        /workspace/locked: false
        /workspace/locked_by: null
    probes:
      - name: the lock was really released
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/workspace-lock"]
        expect:
          stdout_contains: ['"locked": false']

  # The fixture models a lock held by another run so force-unlock exercises the
  # real conflict rather than an already-unlocked workspace.
  - action: tfc.force_unlock_workspace
    args: {workspace_id: ws-8Rp2nKcQvWxYzA1b}
    arrange:
      - argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/hold-lock-by-run"]
    expect:
      json:
        /workspace/locked: false
    probes:
      - name: a lock held by a run was released
        argv: [/bin/sh, -c, "curl -fsS http://tfc-api:8080/probe/workspace-lock"]
        expect:
          stdout_contains: ['"locked": false']

  - name: tfc.lock_workspace-rejects-foreign-id
    action: tfc.lock_workspace
    args: {workspace_id: run-4Qm7TvLpXsRbNc2d, reason: ""}
    expect:
      status: failure
      reason_contains: [must match pattern]
