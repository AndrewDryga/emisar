schema_version: 1
id: pm2.restart
title: pm2 restart <name>
kind: exec
risk: high
description: >
  Hard-restart (kill + spawn) the processes `name` selects: one id, every
  instance carrying a name, `all` (every app the runner's PM2 daemon
  manages), or, when no process has that name, every process in the
  namespace it names. Drops in-flight requests.
side_effects:
  - Each selected process is killed and respawned.
  - Open sockets close; in-flight requests drop.
args:
  - name: name
    type: string
    required: true
    description: >-
      Process id or name, `all`, or a namespace. A name matches every instance
      that carries it; `all` and a namespace act on every matching process.
    validation:
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,63}$"
execution:
  command:
    binary: pm2
    argv:
      - "restart"
      - "{{ args.name }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Restart one
    args:
      name: "api"
