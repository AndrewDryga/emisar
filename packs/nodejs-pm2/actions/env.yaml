schema_version: 1
id: pm2.env
title: pm2 env <id>
kind: exec
risk: high
description: Show effective environment for one process (post-merge of system + app env).
side_effects:
  - One PM2 IPC call.
  - Read-only, but it prints the process's whole environment.
  - The app operator names those variables, so no rule set can enumerate the
    secret-bearing ones; redaction here is a best-effort backstop.
args:
  - name: id
    type: integer
    required: true
    description: PM2 process id.
    validation:
      min: 0
      max: 1000
execution:
  command:
    binary: pm2
    argv:
      - "env"
      - "{{ args.id }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Env for id 0
    args:
      id: 0
