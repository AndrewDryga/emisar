schema_version: 1
id: pm2.stop
title: pm2 stop <name>
kind: exec
risk: high
description: >
  Stop the processes `name` selects: one id, every instance carrying a
  name, `all` (every app the runner's PM2 daemon manages), or, when no
  process has that name, every process in the namespace it names. PM2
  won't auto-restart them until you `start`/`restart`.
side_effects:
  - Each selected process is stopped.
  - PM2 marks it `stopped`; it will not auto-respawn.
args:
  - name: name
    type: string
    required: true
    description: >-
      Process id or name, `all`, or a namespace. A name matches every instance
      that carries it; `all` and a namespace act on every matching process.
    validation:
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,63}$"
execution:
  command:
    binary: pm2
    argv:
      - "stop"
      - "{{ args.name }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Stop one
    args:
      name: "api"
