services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/minio/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-latest}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-minio-tools:latest

  minio:
    image: minio/minio:${PACKTEST_VERSION:-latest}${PACKTEST_DIGEST-}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: packtest-canary-minio-74a9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9000/minio/health/live"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 10
