services:
  minio:
    image: minio/minio:${PACKTEST_VERSION:-latest}${PACKTEST_DIGEST-@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10
