services: [minio]
versions:
  - version: latest
    digest: "@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
    default: true
risk_accountability:
  mode: complete
secret_env: [MC_HOST_minio]
env:
  MC_HOST_minio: "http://minio_admin:packtest-canary-minio-74a9@minio:9000"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: minio.admin_info
    args: {alias: minio}
    expect:
      stdout_contains: ['"status":"success"', '"servers"']
  - action: minio.ls_buckets
    args: {alias: minio}
    arrange:
      - argv: [mc, mb, "--ignore-existing", minio/harness-bucket]
    expect:
      stdout_contains: [harness-bucket]
    cleanup:
      - argv: [mc, rb, "--force", minio/harness-bucket]
  - action: minio.bucket_stat
    args: {alias: minio, bucket: harness-bucket}
    arrange:
      - argv: [mc, mb, "--ignore-existing", minio/harness-bucket]
      - argv: [/bin/sh, -c, 'printf packtest | mc pipe minio/harness-bucket/probe.txt']
    expect:
      stdout_contains: [harness-bucket, object]
    cleanup:
      - argv: [mc, rb, "--force", minio/harness-bucket]
  # The four-drive single-node erasure pool exposes the heal API. mc only
  # prompts for confirmation when stdout+stderr are TTYs, so the runner's
  # piped invocation scans to completion without --force. The final progress
  # UI prints the "N/M objects; SIZE in TIME" line and health table.
  - action: minio.heal_summary
    args: {alias: minio}
    arrange:
      - argv: [mc, mb, "--ignore-existing", minio/harness-bucket]
      - argv: [/bin/sh, -c, 'printf packtest | mc pipe minio/harness-bucket/probe.txt']
    expect:
      stdout_contains: ["objects;", Green]
    probes:
      - argv: [mc, cat, minio/harness-bucket/probe.txt]
        expect:
          stdout_contains: [packtest]
    cleanup:
      - argv: [mc, rb, "--force", minio/harness-bucket]
  # Bucket-scoped heal shares heal_summary's code path: mc splits the
  # alias/bucket URL and follows the same heal status UI, so the same
  # progress line and health table prove the scan completed.
  - action: minio.heal_bucket
    args: {alias: minio, bucket: harness-bucket}
    arrange:
      - argv: [mc, mb, "--ignore-existing", minio/harness-bucket]
      - argv: [/bin/sh, -c, 'printf packtest | mc pipe minio/harness-bucket/probe.txt']
    expect:
      stdout_contains: ["objects;", Green]
    probes:
      - argv: [mc, cat, minio/harness-bucket/probe.txt]
        expect:
          stdout_contains: [packtest]
    cleanup:
      - argv: [mc, rb, "--force", minio/harness-bucket]
  - action: minio.list_policies
    args: {alias: minio}
    expect:
      stdout_contains: [consoleAdmin, readonly]
  - action: minio.list_users
    args: {alias: minio}
    arrange:
      - argv: [mc, admin, user, add, minio, harness_user, harness_password]
    expect:
      stdout_contains: ['"userStatus":"enabled"']
    cleanup:
      - argv: [mc, admin, user, remove, minio, harness_user]
  - action: minio.user_disable
    args: {alias: minio, user: harness_user}
    arrange:
      - argv: [mc, admin, user, add, minio, harness_user, harness_password]
    expect:
      stdout_contains: [Disabled, successfully]
    probes:
      - argv: [mc, admin, user, info, minio, harness_user]
        expect:
          stdout_contains: [disabled]
    cleanup:
      - argv: [mc, admin, user, remove, minio, harness_user]
  - action: minio.user_enable
    args: {alias: minio, user: harness_user}
    arrange:
      - argv: [mc, admin, user, add, minio, harness_user, harness_password]
      - argv: [mc, admin, user, disable, minio, harness_user]
    expect:
      stdout_contains: [Enabled, successfully]
    probes:
      - argv: [mc, admin, user, info, minio, harness_user]
        expect:
          stdout_contains: [enabled]
    cleanup:
      - argv: [mc, admin, user, remove, minio, harness_user]
  # The server re-execs itself in place on restart, so the container (and its
  # /data) survives; mc prints one compact JSON line (piped stdin turns on
  # JSONLine mode). The probes retry through the restart window and prove the
  # server came back serving the pre-restart object.
  - action: minio.service_restart
    args: {alias: minio}
    arrange:
      - argv: [mc, mb, "--ignore-existing", minio/harness-bucket]
      - argv: [/bin/sh, -c, 'printf packtest | mc pipe minio/harness-bucket/probe.txt']
    expect:
      stdout_contains: ['"status":"success"', restartDuration]
    probes:
      - name: server healthy again after the restart
        argv: [mc, admin, info, minio, --json]
        retry_for: 60s
        retry_every: 1s
        expect:
          stdout_contains: ['"status":"success"']
      - name: pre-restart data survived
        argv: [mc, cat, minio/harness-bucket/probe.txt]
        retry_for: 15s
        retry_every: 1s
        expect:
          stdout_contains: [packtest]
    cleanup:
      - argv: [mc, rb, "--force", minio/harness-bucket]
