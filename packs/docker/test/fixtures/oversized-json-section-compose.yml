# A stack whose IMAGE section is past the 64 KiB the summary will carry,
# while every other section stays well inside it: 320 distinct image
# references of 220 characters, so the `--format json` capture that feeds the
# image list prints 70,720 bytes through jq against a 65,536-byte bound. The
# service names are short on purpose — the services section is 7,680 bytes, so
# the section that overflows is the one the JSON-list helper captures, not the
# one the plain-list helper does.
#
# Nothing here is ever started; the action only parses the file. The registry
# is the reserved .invalid TLD, so no reachable image is named even by
# accident.

