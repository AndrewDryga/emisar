# A stack whose service-name section alone is past the 64 KiB the summary will
# carry: 360 names of 200 characters, so `docker compose config --services`
# prints 72,360 bytes against a 65,536-byte bound. The action must refuse it
# with the authored size message rather than summarize a clipped section, and
# the bound is on the section the script captures, not on this file.
#
# busybox is inert — nothing here is ever started; the action only parses the
# file. Nothing but the names matters, which is why every service is identical.

