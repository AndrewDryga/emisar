# These actions drive a daemon, which used to be declared uncoverable on the
# grounds that covering one means handing the runner a Docker socket — root on
# the host by another name. That conflated the HOST's daemon with a daemon: the
# docker-dind sibling is in this case's own disposable project, as isolated as
# the database SUTs other packs run, and `privileged` lands on it rather than on
# the runner. So every one of them is a real case now, driving a real daemon,
# with a probe for what it actually changed.
services: [docker-cli, docker-dind]
env:
  DOCKER_HOST: tcp://docker-dind:2375
versions:
  - version: "29.8.0-cli"
    digest: "@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66"
    default: true
cases:
  # docker.compose_config is the one action in this pack that needs no daemon —
  # it parses a file — which is what makes it testable in a disposable project
  # without handing the runner a Docker socket. It is also where the summary's
  # clip lives: that clip used to be a gsub call, and jq links the regex family
  # only when it was built against Oniguruma, so on the supported
  # --with-oniguruma=no build the action failed after the parse had succeeded.
  # The shared client image builds that jq at /opt/jq-without-regex, and
  # putting it first on PATH is how this case opts in.
  #
  # The fixture is 25 services against a 24-entry sample, so `truncated` counts
  # the one it dropped, and its first name is past the 48-character clip — the
  # ellipsis is the clip's own evidence.
  - name: docker.compose_config-summarizes-a-stack-without-jq-regex-support
    action: docker.compose_config
    args: {file: /opt/stack/docker-compose.yml}
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      json:
        /valid: true
        /file: /opt/stack/docker-compose.yml
        /services/0: "a-deliberately-long-compose-service-name-for-cl…"
        /services/1: svc-01
        /images/0: busybox:1.36
        /truncated/services: 1
        /truncated/images: 0

  # The case above proves the clip and a single dropped service. This one proves
  # the BYTE budget at the maximum size the action advertises, which is what
  # `.agent/kb/rules/packs-structured-output-fits-the-cap.md` asks for: every
  # list past its cap AT ONCE, every name past its clip, so the projection is
  # carrying its largest possible payload.
  #
  #     30 services (cap 24) · 15 images (12) · 10 networks (8)
  #     10 volumes  (cap 8)  ·  8 profiles (6)
  #
  # Success IS the byte assertion. The runner refuses a structured result over
  # 8 KiB, so a passing run is the proof it fits — measured at 3,743 bytes, less
  # than half the cap, which is the headroom the sweep claimed by arithmetic.
  - name: docker.compose_config-fits-the-structured-cap-at-its-worst-advertised-size
    action: docker.compose_config
    args: {file: /opt/worst-case/docker-compose.yml}
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      json:
        /valid: true
        # Non-zero on every list: without these the case would pass on a small
        # file and the byte proof would mean nothing.
        /truncated/services: 6
        /truncated/images: 3
        /truncated/networks: 2
        /truncated/volumes: 2
        /truncated/profiles: 2

  # The 64 KiB bound is on the section `docker compose config` prints, not on
  # the file: 360 service names of 200 characters is 72,360 bytes against a
  # 65,536-byte budget. The action has to say so and fail, because a summary
  # assembled from a clipped section is a confidently wrong answer about which
  # services a stack defines.
  #
  # The script reaches that message while holding only the bound: it keeps one
  # byte past it with `head -c`, drains the remainder into /dev/null so the
  # producer still reaches its own exit, and measures the retained bytes with
  # `wc -c`. Each of those three is load-bearing — capturing the section whole
  # instead ends the action on bash's `xrealloc: cannot allocate` on a large
  # enough stack, dropping the drain SIGPIPEs the producer into a 141 under
  # `pipefail`, and measuring with `${#value}` counts characters rather than
  # bytes. The byte-exact boundary, trailing-newline and multibyte rows live in
  # tools/internal/devtool/pack_compose_config_test.go, which drives the same
  # script through a stub producer; no Compose file can dictate those.
  - name: docker.compose_config-refuses-a-section-past-64-kib
    action: docker.compose_config
    args: {file: /opt/oversized/docker-compose.yml}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["Compose config summary section exceeded 64 KiB"]

  # The case above overflows the plain-list helper, which captures `docker
  # compose config --services` directly. The image and profile lists go through
  # a second helper with its own capture and an extra producer in the pipe,
  # `--format json | jq -r`, so it gets its own file: 320 image references of
  # 220 characters is a 70,720-byte image section behind a 7,680-byte services
  # section, so the sections checked before it all pass and the refusal can only
  # have come from the JSON-list capture.
  - name: docker.compose_config-refuses-a-json-list-section-past-64-kib
    action: docker.compose_config
    args: {file: /opt/oversized-json/docker-compose.yml}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["Compose config summary section exceeded 64 KiB"]

  # The fixture image is pinned by digest and pulled into the case's own empty
  # daemon, so nothing here depends on what the host happens to have cached.
  - action: docker.inspect
    args: {container: packtest-probe}
    arrange:
      - argv: [docker, run, -d, --name, packtest-probe, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", sleep, "600"]
    expect:
      stdout_contains: ["packtest-probe", "Running"]

  - action: docker.image_inspect
    args: {image: "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"}
    arrange:
      - argv: [docker, pull, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"]
    expect:
      stdout_contains: ["Architecture", "RootFS"]

  - action: docker.image_history
    args: {image: "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"}
    arrange:
      - argv: [docker, pull, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"]
    expect:
      stdout_contains: ["CREATED", "SIZE"]

  # The container appends a line every time its entrypoint runs, so the probe
  # counts starts. Asserting it is merely still running would pass without the
  # restart having happened at all.
  - action: docker.restart
    args: {container: packtest-probe, timeout: 2}
    arrange:
      - argv: [docker, run, -d, --name, packtest-probe, --entrypoint, /bin/sh, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", -c, "echo started >> /tmp/starts; sleep 600"]
    probes:
      - name: the entrypoint ran a second time
        argv: [docker, exec, packtest-probe, wc, -l, /tmp/starts]
        expect:
          stdout_contains: ["2 /tmp/starts"]

  - action: docker.kill
    args: {container: packtest-probe, signal: KILL}
    arrange:
      - argv: [docker, run, -d, --name, packtest-probe, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", sleep, "600"]
    probes:
      - name: the container was killed, not stopped
        argv: [/bin/sh, -c, "docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' packtest-probe"]
        expect:
          stdout_contains: ["exited/137"]

  - action: docker.stop
    args: {container: packtest-probe, timeout: 2}
    arrange:
      - argv: [docker, run, -d, --name, packtest-probe, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", sleep, "600"]
    probes:
      - name: the container left the running state
        argv: [/bin/sh, -c, "docker inspect -f '{{.State.Status}}' packtest-probe"]
        expect:
          stdout_contains: [exited]

  # A stopped container is what prune is entitled to remove; a running one is
  # not, so the case keeps one of each and the probe checks both outcomes.
  - action: docker.system_prune
    arrange:
      - argv: [docker, run, -d, --name, packtest-keep, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", sleep, "600"]
      - argv: [docker, run, --name, packtest-spent, "alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce", "true"]
    probes:
      - name: the spent container is gone and the running one is not
        argv: [/bin/sh, -c, "docker ps -a --format '{{.Names}}'"]
        expect:
          stdout_contains: [packtest-keep]
          stdout_not_contains: [packtest-spent]

  - action: docker.volume_prune
    arrange:
      - argv: [docker, volume, create, packtest-orphan]
    probes:
      - name: the unused volume is gone
        argv: [/bin/sh, -c, "docker volume ls --format '{{.Name}}'; echo listed"]
        expect:
          stdout_contains: [listed]
          stdout_not_contains: [packtest-orphan]

  # compose_restart drives a stack rather than parsing one, so its fixture is a
  # single service brought up in the case's daemon — and it counts starts for
  # the same reason docker.restart does.
  - action: docker.compose_restart
    args: {file: /opt/running/docker-compose.yml, service: app}
    arrange:
      - argv: [docker, compose, -f, /opt/running/docker-compose.yml, up, -d, --wait]
    probes:
      - name: the service entrypoint ran a second time
        argv: [docker, compose, -f, /opt/running/docker-compose.yml, exec, -T, app, wc, -l, /tmp/starts]
        expect:
          stdout_contains: ["2 /tmp/starts"]

  # compose_images reports what the DAEMON says the project's containers were
  # created from, so it needs that same stack up. Its size refusal and its
  # capture live in tools/internal/devtool/pack_compose_images_test.go, which
  # drives the script through a stub producer; this is the only row where the
  # document the script's jq reads is Compose's real one — an array of one
  # object per created container, which is what `type == "array"` requires and
  # what a `null` from a project with no containers is projected around.
  #
  # The fixture pins its image by digest, and that is where the projection is
  # worth pinning. Compose derives Repository and Tag from the reference the
  # container carries (reference.ParseDockerRef), and a digest-only reference is
  # Canonical, never Tagged — so Tag is the EMPTY string here. `<none>` is the
  # table formatter's substitution for an empty field and never reaches
  # --format json, so asserting it would assert the wrong formatter.
  - action: docker.compose_images
    args: {file: /opt/running/docker-compose.yml}
    arrange:
      - argv: [docker, compose, -f, /opt/running/docker-compose.yml, up, -d, --wait]
    expect:
      # The image ID the action's description promises; the inventory is keyed
      # by container, not by the service's configured image reference.
      stdout_contains: ["sha256:"]
      json:
        # The project name is the fixture directory's basename and Compose joins
        # the container name with "-", so the one created container is
        # <project>-<service>-1.
        /0/ContainerName: running-app-1
        /0/Repository: alpine
        /0/Tag: ""
