schema_version: 1
id: docker.compose_ls
title: docker compose ls --all
kind: exec
risk: low
description: >
  List all known Compose projects, including projects with stopped containers,
  with their status and resolved configuration-file paths.
side_effects:
  - One read-only Docker daemon query.
  - Includes stopped Compose projects.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - -c
      - |
        set -eu
        if probe=$(LC_ALL=C docker compose version 2>&1); then
          :
        else
          rc=$?
          case "$rc:$probe" in
            "1:docker: 'compose' is not a docker command.
        See 'docker --help'"|"1:docker: unknown command: docker compose

        Run 'docker --help' for more information")
              printf '%s\n' 'docker compose plugin is not installed' >&2
              exit 127 ;;
          esac
          printf '%s\n' "$probe" >&2
          exit "$rc"
        fi
        exec docker "$@"
      - docker-compose
      - compose
      - ls
      - --all
      - --format
      - json
  timeout: 15s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Discover active and orphaned projects
    args: {}
