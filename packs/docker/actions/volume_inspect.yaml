schema_version: 1
id: docker.volume_inspect
title: docker volume inspect
kind: script
risk: low
description: >
  Show one volume's driver, scope, mountpoint, creation time, and labels,
  projected from `docker volume inspect`. Driver options and driver status are
  never returned — CIFS/NFS and plugin volume options can carry mount
  credentials. Read-only.
side_effects:
  - One docker volume inspect invocation.
  - Read-only.
args:
  - name: name
    type: string
    required: true
    description: Volume name.
    validation:
      pattern: "^[a-zA-Z0-9_.][a-zA-Z0-9_.\\-]{0,127}$"
execution:
  script:
    path: scripts/volume_inspect.sh
    interpreter: /bin/bash
  argv: ["{{ args.name }}"]
  timeout: 10s
output:
  parser: json
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Inspect "pgdata"
    args:
      name: pgdata
