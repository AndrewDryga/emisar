schema_version: 1

id: docker.system_prune
title: docker system prune
kind: exec
risk: high

description: >
  Remove stopped containers, dangling images, unused networks, and
  unused build cache (`docker system prune -f`, without `-a`). Tagged
  images that no container uses are kept. Does NOT remove unused
  volumes (intentional — volume data is the riskiest thing to delete).
  Run `docker.system_df` first to scope what will be freed.
  Irreversible.

side_effects:
  - Deletes stopped containers.
  - Deletes dangling images; tagged images are kept.
  - Deletes unused build cache.
  - Deletes networks not used by any container.
  - Frees disk; cannot be undone.

search_terms:
  - free disk space
  - reclaim space
  - disk full

args: []

execution:
  command:
    binary: docker
    argv:
      - "system"
      - "prune"
      - "-f"
  timeout: 5m

output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 65536

examples:
  - title: Prune stopped containers, dangling images, and unused build cache
    args: {}
