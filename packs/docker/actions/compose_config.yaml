schema_version: 1
id: docker.compose_config
title: Summarize a Docker Compose configuration
kind: script
risk: low
description: >
  Parse one contained Compose file without interpolation or environment
  resolution, then return only service, image, network, volume, and profile
  names as sorted, capped samples with per-list truncation counts. Raw YAML,
  environment values, secrets, labels, and build arguments are never returned.
side_effects:
  - Parses one Compose file beneath an approved deployment root.
  - Does not query or modify containers.
args:
  - name: file
    type: string
    required: true
    description: Path to docker-compose.yml.
    validation:
      pattern: "^/[A-Za-z0-9._/-]{1,256}$"
      allowed_prefixes:
        - /opt
        - /srv
        - /var/www
        - /data
        - /usr/local
execution:
  script:
    path: scripts/compose_config.sh
    interpreter: /bin/bash
  argv: ["{{ args.file }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [valid, file, services, images, networks, volumes, profiles, truncated]
    properties:
      valid: {const: true}
      file: {type: string, maxLength: 257}
      services: {type: array, maxItems: 24, items: {type: string, maxLength: 48}}
      images: {type: array, maxItems: 12, items: {type: string, maxLength: 96}}
      networks: {type: array, maxItems: 8, items: {type: string, maxLength: 48}}
      volumes: {type: array, maxItems: 8, items: {type: string, maxLength: 48}}
      profiles: {type: array, maxItems: 6, items: {type: string, maxLength: 32}}
      truncated:
        type: object
        additionalProperties: false
        required: [services, images, networks, volumes, profiles]
        properties:
          services: {type: integer, minimum: 0}
          images: {type: integer, minimum: 0}
          networks: {type: integer, minimum: 0}
          volumes: {type: integer, minimum: 0}
          profiles: {type: integer, minimum: 0}
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Secret-safe stack summary
    args:
      file: /opt/stack/docker-compose.yml
