schema_version: 1
id: docker.events_tail
title: docker events — lifecycle + failures (bounded window)
kind: script
risk: low
description: >
  Replay docker daemon events from the last N minutes, focused on container
  lifecycle and failures (create, start, restart, stop, die, kill, oom, destroy,
  health_status) — the "why did the container restart / OOM / go unhealthy?"
  read. exec_* events are never shown: an exec_create or exec_start carries the
  command line it ran, and a health check's can hold a password. Read-only.
side_effects:
  - One docker events query bounded to the requested window.
  - Read-only.
search_terms:
  - restart loop
  - crash loop
  - oom killed
args:
  - name: minutes
    type: integer
    required: false
    default: 5
    description: How many minutes of events to replay, up to a year (525600). The daemon keeps only its last 256 events, so a long window returns at most those.
    validation:
      min: 1
      max: 525600
execution:
  script:
    path: scripts/events_tail.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.minutes }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Recent restarts / OOM / health changes (last 5 minutes)
    args: {}
  - title: Last 30 minutes of lifecycle and health events
    args:
      minutes: 30
