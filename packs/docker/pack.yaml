schema_version: 1

id: docker
name: Docker operations pack
version: 0.2.21
retired_below: 0.2.14
description: >
  Operator pack for Docker hosts: read-only inventory and per-container
  introspection, plus narrow mutators (restart, stop, kill, prune).
  Includes docker-compose support. The runner uid must be in the
  docker group; this pack does NOT escalate.
vendor: emisar
homepage: https://emisar.dev/packs/docker

requires:
  os:
    - linux
  binaries:
    - docker
    - bash

# `emisar pack suggest` detection — default process names / ports.
detect:
  processes:
    - dockerd

setup:
  summary: >
    Talks to the local Docker daemon on the runner host via its Unix
    socket — no credentials needed.
  notes:
    - "Membership in the docker group is effectively root-equivalent on the host, since a container can mount and write the host filesystem."
    - "Compose actions also need ordinary read access to their selected project files. docker.compose_config needs only that file access, so no universal host-access recipe can name it."
  host_access:
    - actions:
        - docker.ps
        - docker.info
        - docker.version
        - docker.events_tail
        - docker.container_top
        - docker.stats
        - docker.images
        - docker.image_inspect
        - docker.image_history
        - docker.pull_image
        - docker.inspect
        - docker.logs
        - docker.volume_ls
        - docker.volume_inspect
        - docker.volume_prune
        - docker.network_ls
        - docker.network_inspect
        - docker.compose_ps
        - docker.compose_logs
        - docker.compose_restart
        - docker.compose_ls
        - docker.compose_images
        - docker.system_df
        - docker.system_prune
        - docker.restart
        - docker.stop
        - docker.kill
      requirement: Connect to the Docker daemon socket.
      recipes:
        - name: Add the Emisar service user to the docker group
          commands:
            - "sudo usermod -aG docker emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx docker"
            - "sudo -u emisar docker info >/dev/null"
          impact: >
            Every process running as emisar can control Docker. Docker socket access is
            effectively root-equivalent because containers can mount and write the host.
  verify: docker.ps

actions:
  # Discovery
  - actions/ps.yaml
  - actions/info.yaml
  - actions/version.yaml
  - actions/events_tail.yaml
  - actions/container_top.yaml
  - actions/stats.yaml
  # Images
  - actions/images.yaml
  - actions/image_inspect.yaml
  - actions/image_history.yaml
  - actions/pull_image.yaml
  # Per-container
  - actions/inspect.yaml
  - actions/logs.yaml
  # Volumes
  - actions/volume_ls.yaml
  - actions/volume_inspect.yaml
  - actions/volume_prune.yaml
  # Networks
  - actions/network_ls.yaml
  - actions/network_inspect.yaml
  # Compose
  - actions/compose_ps.yaml
  - actions/compose_logs.yaml
  - actions/compose_restart.yaml
  - actions/compose_ls.yaml
  - actions/compose_config.yaml
  - actions/compose_images.yaml
  # System & mutators
  - actions/system_df.yaml
  - actions/system_prune.yaml
  - actions/restart.yaml
  - actions/stop.yaml
  - actions/kill.yaml
