services: [victoriametrics]
versions:
  - version: v1.124.0
    digest: "@sha256:2d7fc1f0f19160a06b0d72daff6c96ddd58de1a4560d1d827aa79633b5382524"
    default: true
env:
  VM_URL: "http://victoriametrics:8428/prometheus"
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: vm.query_instant
    args: {query: harness_metric}
    arrange: &ingest_metric
      # Keep the sample away from the range query's moving "now" boundary.
      - argv: [/bin/sh, -c, 'printf ''harness_metric{job="packtest"} 7 %s000\n'' "$(( $(date +%s) - 120 ))" | curl -fsS -X POST --data-binary @- http://victoriametrics:8428/api/v1/import/prometheus']
      - name: wait for the imported series
        argv: [/bin/sh, -c, 'curl -fsSG --data-urlencode query=harness_metric http://victoriametrics:8428/prometheus/api/v1/query']
        expect:
          stdout_contains: [harness_metric, packtest]
        retry_for: 30s
        retry_every: 250ms
    expect:
      stdout_contains: ['"status":"success"', harness_metric, packtest]
  - name: vm.query-instant-http-error
    action: vm.query_instant
    args: {query: up}
    env:
      VM_URL: http://victoriametrics:8428/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: vm.query_range
    args: {query: harness_metric, window: 1h, step: 1m}
    arrange: *ingest_metric
    expect:
      stdout_contains: ['"status":"success"', matrix, harness_metric]
  - name: vm.query-range-allows-seven-days-at-one-minute
    action: vm.query_range
    args: {query: harness_metric, window: 7d, step: 60s}
    env:
      VM_URL: http://cost-canary
    expect:
      stdout_contains: [PACKTEST_VM_COST_CANARY]
    probes:
      - argv: [cat, /tmp/packtest-victoriametrics-cost-argv]
        expect:
          stdout_contains: [query=harness_metric, start=-7d, end=now, step=60s, timeout=30s]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-victoriametrics-cost-argv]
  - name: vm.query-range-rejects-over-point-limit-before-client
    action: vm.query_range
    args: {query: harness_metric, window: 7d, step: 59s}
    env:
      VM_URL: http://cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [evaluation timestamps, maximum is 10081]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-victoriametrics-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  - name: vm.query-range-rejects-over-window-limit-before-client
    action: vm.query_range
    args: {query: harness_metric, window: 10081m, step: 60s}
    env:
      VM_URL: http://cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [exceeds the 7d maximum]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-victoriametrics-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  - action: vm.series
    args: {match: harness_metric, limit: 10}
    arrange: *ingest_metric
    expect:
      stdout_contains: [harness_metric, packtest]
  - action: vm.labels
    arrange: *ingest_metric
    expect:
      stdout_contains: [__name__, job]
  - action: vm.label_values
    args: {label: job}
    arrange: *ingest_metric
    expect:
      stdout_contains: [packtest]
  - action: vm.tsdb_status
    args: {top_n: 10}
    arrange: *ingest_metric
    expect:
      stdout_contains: [seriesCountByMetricName, harness_metric]
  - action: vm.active_queries
    expect:
      stdout_contains: ['"status":"ok"', '"data"']
  - action: vm.top_queries
    args: {top_n: 10}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -G --data-urlencode query=harness_metric http://victoriametrics:8428/prometheus/api/v1/query >/dev/null']
    expect:
      stdout_contains: [topByCount, topByAvgDuration]
