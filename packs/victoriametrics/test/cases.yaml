services: [victoriametrics]
versions:
  - version: v1.153.0
    digest: "@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd"
    default: true
# Both credentials ride every real call: basic-auth userinfo in VM_URL, whose
# user name carries a quote and a backslash for the stdin config document, and
# a bearer token. The SUT checks neither; the spy records where they travelled.
secret_env: [VM_URL, VM_BEARER_TOKEN]
inherit_env: [VM_URL, VM_BEARER_TOKEN]
env:
  VM_URL: 'http://pack"te\st:packtest-canary-vm-basic-3c7e@victoriametrics:8428/prometheus'
  VM_BEARER_TOKEN: packtest-canary-vm-bearer-81d5
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: vm.query_instant
    args: {query: harness_metric}
    arrange: &ingest_metric
      # Keep the sample away from the range query's moving "now" boundary.
      - argv: [/bin/sh, -c, 'printf ''harness_metric{job="packtest"} 7 %s000\n'' "$(( $(date +%s) - 120 ))" | curl -fsS -X POST --data-binary @- http://victoriametrics:8428/api/v1/import/prometheus']
      - name: wait for the imported series
        argv: [/bin/sh, -c, 'curl -fsSG --data-urlencode query=harness_metric http://victoriametrics:8428/prometheus/api/v1/query']
        expect:
          stdout_contains: [harness_metric, packtest]
        retry_for: 30s
        retry_every: 250ms
    expect:
      stdout_contains: ['"status":"success"', harness_metric, packtest]
  - name: vm.query-instant-http-error
    action: vm.query_instant
    args: {query: up}
    env:
      VM_URL: http://packtest:packtest-canary-vm-basic-3c7e@victoriametrics:8428/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: vm.query_range
    args: {query: harness_metric, window: 1h, step: 1m}
    arrange: *ingest_metric
    expect:
      stdout_contains: ['"status":"success"', matrix, harness_metric]
  - name: vm.query-range-allows-seven-days-at-one-minute
    action: vm.query_range
    args: {query: harness_metric, window: 7d, step: 60s}
    env:
      VM_URL: http://packtest:packtest-canary-vm-basic-3c7e@cost-canary
    expect:
      stdout_contains: [PACKTEST_VM_COST_CANARY]
    probes:
      - argv: [cat, /tmp/packtest-victoriametrics-cost-argv]
        expect:
          stdout_contains: [query=harness_metric, start=-7d, end=now, step=60s, timeout=30s]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-victoriametrics-cost-argv]
  - name: vm.query-range-rejects-over-point-limit-before-client
    action: vm.query_range
    args: {query: harness_metric, window: 7d, step: 59s}
    env:
      VM_URL: http://packtest:packtest-canary-vm-basic-3c7e@cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [evaluation timestamps, maximum is 10081]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-victoriametrics-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  - name: vm.query-range-allows-thirty-days-at-one-hour
    action: vm.query_range
    args: {query: harness_metric, window: 30d, step: 1h}
    env:
      VM_URL: http://packtest:packtest-canary-vm-basic-3c7e@cost-canary
    expect:
      stdout_contains: [PACKTEST_VM_COST_CANARY]
    probes:
      - argv: [cat, /tmp/packtest-victoriametrics-cost-argv]
        expect:
          stdout_contains: [query=harness_metric, start=-30d, end=now, step=1h, timeout=30s]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-victoriametrics-cost-argv]
  # The span itself is no longer capped; the point guard is what still rejects
  # a long window at a fine step before the client runs.
  - name: vm.query-range-rejects-over-point-limit-on-a-long-window
    action: vm.query_range
    args: {query: harness_metric, window: 10081m, step: 60s}
    env:
      VM_URL: http://packtest:packtest-canary-vm-basic-3c7e@cost-canary
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [evaluation timestamps, maximum is 10081]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-victoriametrics-cost-argv && echo client-not-invoked"]
        expect:
          stdout_contains: [client-not-invoked]
  # The credentials reach curl only through its stdin config document.
  - name: vm.labels-credentials-stay-off-argv
    action: vm.labels
    arrange: *ingest_metric
    expect:
      stdout_contains: [__name__, job]
    probes:
      - argv: [/bin/sh, -c, 'grep -q -- "--config -" /tmp/packtest-victoriametrics-argv && ! grep -q -e packtest-canary -e victoriametrics:8428 /tmp/packtest-victoriametrics-argv && echo argv-clean']
        expect:
          stdout_contains: [argv-clean]
      - argv: [/bin/sh, -c, 'grep -qF ''url = "http://pack\"te\\st:packtest-canary-vm-basic-3c7e@victoriametrics:8428/prometheus/api/v1/labels"'' /tmp/packtest-victoriametrics-config && grep -qF ''header = "Authorization: Bearer packtest-canary-vm-bearer-81d5"'' /tmp/packtest-victoriametrics-config && echo config-carries-both']
        expect:
          stdout_contains: [config-carries-both]
  - name: vm.labels-basic-auth-url-only
    action: vm.labels
    unset_env: [VM_BEARER_TOKEN]
    arrange: *ingest_metric
    expect:
      stdout_contains: [__name__, job]
    probes:
      - argv: [/bin/sh, -c, '! grep -q -e packtest-canary -e victoriametrics:8428 /tmp/packtest-victoriametrics-argv && grep -q packtest-canary-vm-basic-3c7e /tmp/packtest-victoriametrics-config && ! grep -q "^header" /tmp/packtest-victoriametrics-config && echo url-only-off-argv']
        expect:
          stdout_contains: [url-only-off-argv]
  - name: vm.labels-url-line-break
    action: vm.labels
    env:
      VM_URL: "http://packtest:packtest-canary-vm-basic-3c7e@victoriametrics:8428/prometheus\nheader = \"X-Injected: 1\""
    expect:
      status: failure
      exit: [2]
      stderr_contains: [VM_URL must not contain a line break]
  - action: vm.series
    args: {match: harness_metric, limit: 10}
    arrange: *ingest_metric
    expect:
      stdout_contains: [harness_metric, packtest]
  - action: vm.labels
    arrange: *ingest_metric
    expect:
      stdout_contains: [__name__, job]
  - action: vm.label_values
    args: {label: job}
    arrange: *ingest_metric
    expect:
      stdout_contains: [packtest]
  - action: vm.tsdb_status
    args: {top_n: 10}
    arrange: *ingest_metric
    expect:
      stdout_contains: [seriesCountByMetricName, harness_metric]
  - action: vm.active_queries
    expect:
      stdout_contains: ['"status":"ok"', '"data"']
  - action: vm.top_queries
    args: {top_n: 10}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -G --data-urlencode query=harness_metric http://victoriametrics:8428/prometheus/api/v1/query >/dev/null']
    expect:
      stdout_contains: [topByCount, topByAvgDuration]
