schema_version: 1
id: vm.query_range
title: GET /api/v1/query_range
kind: script
risk: low
description: >
  Run a range PromQL/MetricsQL query against VictoriaMetrics — evaluates one
  expression across a trailing window ending now, limited to 7 days and 10,081
  outer evaluation timestamps per returned series. Use for trends and rates
  over time; use vm.query_instant for a single current value. A successful
  range response can legitimately contain no matching series, so refine or
  discover the selector instead of repeating an unchanged query. Query
  cardinality and inner ranges can still make this expensive.
side_effects:
  - One read-only HTTP GET to the VictoriaMetrics query API.
  - Reads a range of samples — may be expensive on large series.
args:
  - name: query
    type: string
    required: true
    description: PromQL or MetricsQL expression.
    validation:
      pattern: '^[\s\S]{1,1000}$'
  - name: window
    type: string
    required: false
    default: "1h"
    description: 'Trailing window ending now, up to 7d, e.g. 30m, 1h, 6h, 24h, 7d.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdwy]$'
  - name: step
    type: string
    required: false
    default: "60s"
    description: 'Resolution between points. Window / step may produce at most 10,081 timestamps.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smh]$'
execution:
  script:
    path: scripts/vmget.sh
    interpreter: /bin/sh
  argv:
    - "--bounded-range"
    - "{{ args.window }}"
    - "{{ args.step }}"
    - "/api/v1/query_range"
    - "--data-urlencode"
    - "query={{ args.query }}"
    - "--data-urlencode"
    - "start=-{{ args.window }}"
    - "--data-urlencode"
    - "end=now"
    - "--data-urlencode"
    - "step={{ args.step }}"
    - "--data-urlencode"
    - "timeout=30s"
  timeout: 120s
output:
  parser: json
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: 1h request rate
    args:
      query: "sum(rate(vm_http_requests_total[5m]))"
      window: "1h"
      step: "60s"
  - title: Peak memory working set by allocation over 24h
    args:
      query: 'max_over_time(sum by (alloc_id) (container_memory_working_set_bytes{alloc_id!=""})[24h:5m])'
      window: "24h"
      step: "5m"
