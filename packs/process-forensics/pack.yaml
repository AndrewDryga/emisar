schema_version: 1

id: process-forensics
name: Process forensics
version: 0.1.10
# 0.1.9 and below answered "this process has no threads" for a pid that had
# exited or that hidepid keeps from the runner — an empty success on a low,
# auto-running diagnostic.
retired_below: 0.1.10
description: >
  Deep per-process diagnostics for "why is this process stuck / slow /
  leaking?" — strace (HIGH RISK; slows the target), pid memory maps,
  per-thread state, /proc walking, gdb backtrace, full lsof, syscall
  summary. Read-only — but strace and gdb attach via ptrace and WILL
  slow the target.
vendor: emisar
homepage: https://emisar.dev/packs/process-forensics

requires:
  os:
    - linux

setup:
  summary: >
    Inspects processes on the local runner host — no credentials needed.
  host_access:
    - actions:
        - forensics.pid_maps
        - forensics.pid_smaps_summary
        - forensics.pid_threads_state
        - forensics.pid_open_files
        - forensics.pid_status
        - forensics.pid_io
        - forensics.pid_syscall
        - forensics.strace_pid_short
        - forensics.gdb_backtrace
        - forensics.strace_summary
      requirement: Inspect protected process files and attach to processes owned by other users.
      recipes:
        - name: Grant process-inspection capabilities to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH' | sudo tee /etc/systemd/system/emisar.service.d/10-process-forensics-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_sys_ptrace"
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_dac_read_search"
          impact: >
            Every Emisar action on this runner inherits CAP_SYS_PTRACE and
            CAP_DAC_READ_SEARCH. It can inspect or attach to processes outside the
            runner user, including their memory and secrets, and bypass file read and
            directory search permissions across the host.
  verify: forensics.pid_status

actions:
  - actions/pid_maps.yaml
  - actions/pid_smaps_summary.yaml
  - actions/pid_threads_state.yaml
  - actions/pid_open_files.yaml
  - actions/pid_status.yaml
  - actions/pid_io.yaml
  - actions/pid_syscall.yaml
  - actions/strace_pid_short.yaml
  - actions/gdb_backtrace.yaml
  - actions/strace_summary.yaml
