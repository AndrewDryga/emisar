schema_version: 1
id: forensics.pid_status
title: /proc/PID/status
kind: exec
risk: low
description: Show full /proc/PID/status — uid/gid, capability set, signal state, oom score.
side_effects:
  - One /proc read.
  - Read-only.
args:
  - name: pid
    type: integer
    required: true
    description: PID.
    validation:
      min: 1
      max: 4194304
execution:
  # The execution contract matches debugging.pid_status — same command, same deadline
  # and caps, whichever pack the operator installed.
  command:
    binary: cat
    argv:
      - "/proc/{{ args.pid }}/status"
  timeout: 5s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 4096
examples:
  - title: Status of PID 1
    args:
      pid: 1
