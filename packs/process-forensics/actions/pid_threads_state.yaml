schema_version: 1
id: forensics.pid_threads_state
title: Per-thread state for one PID
kind: exec
risk: low
description: Tabulate each thread's state (R/S/D/Z) from /proc/PID/task/*/status.
side_effects:
  - Reads /proc/PID/task/.
  - Read-only.
search_terms:
  - d state
  - uninterruptible sleep
  - zombie threads
args:
  - name: pid
    type: integer
    required: true
    description: PID.
    validation:
      min: 1
      max: 4194304
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # sort ends the pipeline, so without this guard a pid that has exited —
      # or one hidepid keeps from this runner — produced an empty stdout and
      # exit 0, which reads as "this process has no threads". The guard covers
      # all three shapes: a gone pid has no /proc entry, hidepid=2 hides it,
      # and hidepid=1 makes /proc/<pid> unreadable to a non-owner.
      - "[ -d /proc/{{ args.pid }}/task ] || { echo 'no such process: {{ args.pid }} (or /proc hides it from this runner)' >&2; exit 1; }; for f in /proc/{{ args.pid }}/task/*/status; do tid=$(basename $(dirname $f)); awk -v tid=$tid '/^State:/ {print tid, $2, $3}' $f; done | sort -k2"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Per-thread state of PID 1
    args:
      pid: 1
