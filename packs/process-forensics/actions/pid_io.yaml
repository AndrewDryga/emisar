schema_version: 1
id: forensics.pid_io
title: Process I/O accounting
kind: exec
risk: low
description: >
  Show `/proc/<pid>/io` for one process — bytes read and written (logical and
  physical), syscall counts, and cancelled writes. Use to find which process is
  driving disk I/O.
side_effects:
  - One /proc read.
  - Read-only.
search_terms:
  - io hog
  - disk io per process
args:
  - name: pid
    type: integer
    required: true
    description: PID to inspect.
    validation:
      min: 1
      max: 4194304
execution:
  # The execution contract AND the operator-facing copy match debugging.pid_io —
  # same command, deadline, caps, and words, whichever pack the
  # operator installed.
  command:
    binary: cat
    argv:
      - "/proc/{{ args.pid }}/io"
  timeout: 5s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 4096
examples:
  - title: PID 1
    args:
      pid: 1
