recipes:
  - access: 0
    recipe: 0
    fixture: debian
    action: forensics.pid_io
    prepare:
      - useradd --uid 60001 --user-group --no-create-home --shell /usr/sbin/nologin packtest-process-victim
      - systemd-run --unit=packtest-process-victim --property=User=packtest-process-victim /bin/sleep infinity
      - systemctl show packtest-process-victim.service --property=MainPID --value > /run/packtest-process-victim.pid
    probe: pid=$(cat /run/packtest-process-victim.pid); test "$pid" -gt 1; head -n 1 "/proc/$pid/io" >/dev/null; test -r "/proc/$pid/fd"; ls "/proc/$pid/fd" >/dev/null
