# `strace -p` works in a container granted CAP_SYS_PTRACE — measured. What is
# missing is a SUT that runs a target process worth attaching to, which is a
# fixture rather than a privilege the harness cannot hold.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    forensics.gdb_backtrace: requires_privileged_host
    forensics.strace_pid_short: requires_privileged_host
    forensics.strace_summary: requires_privileged_host
