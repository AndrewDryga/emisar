services: [kafka]
risk_accountability:
  exceptions: {}
versions:
  - version: "4.1.1"
    digest: "@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40"
    default: true
env:
  KAFKA_BOOTSTRAP: kafka:9092
cases:
  - action: kafka.cluster_info
    expect:
      stdout_contains: [kafka:9092, Produce, Fetch]
  - action: kafka.broker_api_versions
    expect:
      stdout_contains: [Produce, Fetch]
  - action: kafka.broker_configs
    args: {broker_id: "1"}
    expect:
      stdout_contains: [Dynamic configs for broker 1]
  - action: kafka.list_topics
    expect:
      stdout_contains: [orders]
  - action: kafka.describe_topic
    args: {topic: orders}
    expect:
      stdout_contains: [Topic, orders, PartitionCount, "2"]
  - action: kafka.topic_configs
    args: {topic: orders}
    expect:
      stdout_contains: [Dynamic configs for topic orders]
  - action: kafka.list_acls
    arrange:
      - argv: [kafka-acls.sh, --bootstrap-server, kafka:9092, --add, --allow-principal, "User:ANONYMOUS", --operation, Read, --topic, orders]
    expect:
      stdout_contains: [User:ANONYMOUS, orders]
    cleanup:
      - argv: [kafka-acls.sh, --bootstrap-server, kafka:9092, --remove, --allow-principal, "User:ANONYMOUS", --operation, Read, --topic, orders, --force]
  # The three consumer-group mutations each need a group that EXISTS but has no
  # active member (reset/delete refuse an active group): produce a few records,
  # consume them with a group that commits its offsets and then exits on the
  # idle timeout, leaving it empty. Each case uses its own group name.
  - action: kafka.reset_offsets_to_earliest
    args:
      group: packtest-reset-earliest
      topic: orders
    arrange:
      - argv: [/bin/sh, -c, 'printf "m1\nm2\nm3\n" | kafka-console-producer.sh --bootstrap-server kafka:9092 --topic orders']
      - argv: [/bin/sh, -c, 'kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic orders --group packtest-reset-earliest --from-beginning --timeout-ms 5000 --consumer-property enable.auto.commit=true --consumer-property auto.commit.interval.ms=500 >/dev/null 2>&1 || true']
    expect:
      stdout_contains: [packtest-reset-earliest, orders]
    probes:
      # Offsets are back at the start, so the group re-reads the first record.
      - argv: [/bin/sh, -c, 'kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic orders --group packtest-reset-earliest --timeout-ms 6000 --max-messages 1 2>/dev/null || true']
        expect:
          stdout_contains: [m1]
  - action: kafka.reset_offsets_to_latest
    args:
      group: packtest-reset-latest
      topic: orders
    arrange:
      - argv: [/bin/sh, -c, 'printf "m1\nm2\nm3\n" | kafka-console-producer.sh --bootstrap-server kafka:9092 --topic orders']
      - argv: [/bin/sh, -c, 'kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic orders --group packtest-reset-latest --from-beginning --timeout-ms 5000 --consumer-property enable.auto.commit=true --consumer-property auto.commit.interval.ms=500 >/dev/null 2>&1 || true']
    expect:
      stdout_contains: [packtest-reset-latest, orders]
    probes:
      # The group now carries committed offsets at the log's end for orders.
      - argv: [/bin/sh, -c, 'kafka-consumer-groups.sh --bootstrap-server kafka:9092 --describe --group packtest-reset-latest']
        expect:
          stdout_contains: [packtest-reset-latest, orders]
  - action: kafka.delete_consumer_group
    args:
      group: packtest-delete-group
    arrange:
      - argv: [/bin/sh, -c, 'printf "m1\nm2\nm3\n" | kafka-console-producer.sh --bootstrap-server kafka:9092 --topic orders']
      - argv: [/bin/sh, -c, 'kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic orders --group packtest-delete-group --from-beginning --timeout-ms 5000 --consumer-property enable.auto.commit=true --consumer-property auto.commit.interval.ms=500 >/dev/null 2>&1 || true']
    expect:
      stdout_contains: [packtest-delete-group, successful]
    probes:
      - argv: [/bin/sh, -c, 'kafka-consumer-groups.sh --bootstrap-server kafka:9092 --list | grep -c packtest-delete-group || true']
        expect:
          stdout_contains: ["0"]
  - action: kafka.leader_partitions
    expect:
      stdout_contains: ["2 1"]
  - action: kafka.under_replicated
    expect:
      exit: [0]
    probes:
      - argv: [/bin/sh, -c, 'test -z "$(kafka-topics.sh --bootstrap-server kafka:9092 --describe --under-replicated-partitions)" && echo fully-replicated']
        expect:
          stdout_contains: [fully-replicated]
  - action: kafka.unavailable_partitions
    expect:
      exit: [0]
    probes:
      - argv: [/bin/sh, -c, 'test -z "$(kafka-topics.sh --bootstrap-server kafka:9092 --describe --unavailable-partitions)" && echo all-partitions-available']
        expect:
          stdout_contains: [all-partitions-available]
  - action: kafka.reassign_status
    expect:
      stdout_contains: [No partition reassignments found]
  - action: kafka.preferred_leader_election
    expect:
      exit: [0]
    probes:
      # A healthy KRaft cluster omits election-not-needed partitions from the
      # all-partitions response, so the tool prints nothing on success; the
      # semantic proof is that every orders partition is led by its preferred
      # (sole) replica, broker 1, after the election.
      - argv: [/bin/sh, -c, 'test "$(kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic orders | grep -c "Leader: 1")" = 2 && echo preferred-leaders-hold']
        expect:
          stdout_contains: [preferred-leaders-hold]
  - action: kafka.alter_topic_retention
    args: {topic: orders, retention_ms: 60000}
    probes:
      - argv: [/opt/kafka/bin/kafka-configs.sh, --bootstrap-server, kafka:9092, --describe, --entity-type, topics, --entity-name, orders]
        expect:
          stdout_contains: [retention.ms=60000]
    cleanup:
      - argv: [/opt/kafka/bin/kafka-configs.sh, --bootstrap-server, kafka:9092, --alter, --entity-type, topics, --entity-name, orders, --delete-config, retention.ms]
