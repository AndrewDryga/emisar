services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/kafka/test
      dockerfile: Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-4.1.1}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-kafka-tools:latest

  kafka:
    image: apache/kafka:${PACKTEST_VERSION:-4.1.1}${PACKTEST_DIGEST-}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: User:ANONYMOUS
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --create --if-not-exists --topic orders --partitions 2 --replication-factor 1 >/dev/null && /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list | grep -q orders"]
      interval: 5s
      start_period: 90s
      start_interval: 2s
      timeout: 10s
      retries: 30
