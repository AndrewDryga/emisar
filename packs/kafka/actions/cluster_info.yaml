schema_version: 1
id: kafka.cluster_info
title: Cluster metadata
kind: exec
risk: low
description: Show broker IDs, controller, cluster ID. Read-only.
side_effects:
  - One metadata request.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # This action is the pack's setup.verify probe, so masking the exit code
      # meant an unreachable broker verified the pack green. The CLI exits
      # non-zero on connection refused and DNS failure; capture keeps that, and
      # keeps multi-broker output from SIGPIPE-ing the JVM at head's cutoff.
      - |
        info=$(kafka-broker-api-versions.sh --bootstrap-server "$KAFKA_BOOTSTRAP"); status=$?
        printf '%s\n' "$info" | head -50
        exit $status
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Cluster info
    args: {}
