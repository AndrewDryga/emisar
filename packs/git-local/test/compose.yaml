services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/git-local/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
    image: emisar-packtest-git-local-tools:latest

  # These actions run git against a checkout on the machine the ACTION runs on,
  # which is the client container, so every case seeds its own checkout there
  # and nothing here is a service to drive. The version row still names the
  # Debian release whose git package the client installs, which keeps the
  # compatibility matrix able to say which git these assertions were proved
  # against.
  git-host:
    image: debian:${PACKTEST_VERSION:-trixie-20260918-slim}${PACKTEST_DIGEST-}
    command: [sleep, infinity]
    healthcheck:
      test: [CMD, "true"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
