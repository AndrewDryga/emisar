services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/git-local/test
      dockerfile: Dockerfile
      args:
        PACKTEST_IMAGE: ${PACKTEST_IMAGE:-buildpack-deps:${PACKTEST_VERSION:-trixie-scm}${PACKTEST_DIGEST-}}
    image: emisar-packtest-git-local-tools:${PACKTEST_VERSION:-trixie-scm}

  # These actions run git against a checkout on the machine the ACTION runs on,
  # which is the client container above, built from this same pinned image, so
  # every case seeds its own checkout there and nothing here is a service to
  # drive. This service keeps the version row and the git under test the same
  # image.
  git:
    image: ${PACKTEST_IMAGE:-buildpack-deps:${PACKTEST_VERSION:-trixie-scm}${PACKTEST_DIGEST-}}
    init: true
    command: [sleep, infinity]
    healthcheck:
      test: [CMD, git, --version]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
