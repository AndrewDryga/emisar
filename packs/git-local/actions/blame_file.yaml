schema_version: 1
id: git.blame_file
title: git blame -- <path>
kind: exec
risk: medium
description: 'Show per-line authorship for one file. Path is relative to repo root.'
side_effects:
  - One git blame.
  - Read-only.
search_terms:
  - who changed this line
args:
  - name: path
    type: string
    required: true
    description: Path relative to repo root.
    validation:
      # Every segment must carry a non-dot character, so no component can be
      # "." or "..". The old charset made both literal members: it read as
      # containment and was not. git refuses a path outside the repository
      # anyway, but the pack should not be declaring a boundary it does not
      # hold.
      max_length: 512
      pattern: "^[A-Za-z0-9_.-]*[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_.-]*[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "cd \"$GIT_REPO\" && git blame -- \"$1\""
      - "emisar"
      - "{{ args.path }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Blame config/runtime.exs
    args:
      path: "config/runtime.exs"
