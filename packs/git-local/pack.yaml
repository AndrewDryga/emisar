schema_version: 1

id: git-local
name: Host-side git
version: 0.1.12
# 0.1.11 and below printed remote URLs verbatim, so the low, auto-run
# remote_list handed a token embedded as a URL user name
# (`https://<PAT>@dev.azure.com/...`) to the model and the audit trail; the
# runner's `user:pass@` redaction does not match that form. 0.1.10 and below
# also rated blame_file, diff_head and show_commit low while they return
# whole-file contents and patches.
retired_below: 0.1.12
description: >
  Read-only git operations against a checkout living on the runner host
  (e.g. /opt/myapp). For remote-GitHub-API work, see the `github-cli`
  pack. The repo directory must live at GIT_REPO env var on the runner
  host.
vendor: emisar
homepage: https://emisar.dev/packs/git-local

requires:
  os:
    - linux
  binaries:
    - git

setup:
  summary: >
    Runs read-only git commands against a checkout on the runner host —
    no credentials needed (nothing fetches or pushes to a remote).
  env:
    - name: GIT_REPO
      required: true
      description: Absolute path to the git checkout on the runner host that every action operates in. Add it to the runner's `inherit_env`.
      example: /opt/myapp
  notes:
    - "The runner uid must own the repository or receive read/traverse access through its group or a persistent ACL. Git's safe.directory only accepts different ownership; it does not grant filesystem access. For another user's private checkout, install a dedicated runner as that owner."
  verify: git.status

actions:
  - actions/status.yaml
  - actions/log_recent.yaml
  - actions/diff_head.yaml
  - actions/branch_list.yaml
  - actions/show_commit.yaml
  - actions/blame_file.yaml
  - actions/reflog.yaml
  - actions/remote_list.yaml
