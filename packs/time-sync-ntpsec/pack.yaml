schema_version: 1

id: time-sync-ntpsec
name: NTPsec time sync diagnostics
version: 0.1.0
description: >
  NTPsec peer visibility for hosts that run ntpd rather than Chrony. Keep this
  backend-specific pack off Chrony hosts so the catalog reflects executable
  capabilities instead of mutually exclusive time daemons.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os:
    - linux
  binaries:
    - ntpq

detect:
  processes:
    - ntpd

setup:
  summary: Query the local NTPsec daemon with ntpq; no credentials are needed.
  notes:
    - "Install only on hosts that run NTPsec/ntpd. Chrony hosts use the time-sync pack."
  verify: time.ntpq_peers

actions:
  - actions/ntpq_peers.yaml
