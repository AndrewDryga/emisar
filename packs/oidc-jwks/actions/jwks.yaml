schema_version: 1
id: oidc.jwks
title: Fetch a public JWKS
kind: script
risk: low
description: >
  Fetch and validate one explicit public JWKS. The action rejects redirects,
  oversized key sets, malformed keys, and private or symmetric key material.
side_effects:
  - One unauthenticated HTTPS GET to the exact JWKS URL.
  - Writes the public response to a mode-0600 temporary file and removes it before exit.
args:
  - name: jwks_uri
    type: string
    required: true
    description: Exact HTTPS JWKS URL without credentials, a query, or a fragment.
    validation:
      pattern: "^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~!$&'()*+,=:;%@/-]*)?$"
      max_length: 768
execution:
  script:
    path: scripts/oidc.sh
    interpreter: /bin/bash
  argv: [jwks, "{{ args.jwks_uri }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required: [keys]
    properties:
      keys:
        type: array
        minItems: 1
        maxItems: 128
        items:
          type: object
          required: [kty]
          properties:
            kty: {type: string, minLength: 1}
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Inspect issuer signing keys
    args:
      jwks_uri: https://accounts.example.com/keys
