events {}

http {
  server {
    listen 443 ssl;
    server_name oidc;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location = /health {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /.well-known/openid-configuration {
      default_type application/json;
      return 200 '{"issuer":"https://oidc","jwks_uri":"https://oidc/keys","authorization_endpoint":"https://oidc/auth"}';
    }

    location = /wrong/.well-known/openid-configuration {
      default_type application/json;
      return 200 '{"issuer":"https://different.example","jwks_uri":"https://oidc/keys"}';
    }

    location = /keys {
      default_type application/jwk-set+json;
      return 200 '{"keys":[{"kty":"RSA","kid":"current","n":"abc","e":"AQAB"},{"kty":"EC","kid":"next","crv":"P-256","x":"abc","y":"def"}]}';
    }

    location = /private {
      default_type application/json;
      return 200 '{"keys":[{"kty":"RSA","kid":"unsafe","d":"private"}]}';
    }

    location = /redirect {
      return 302 /keys;
    }
  }
}
