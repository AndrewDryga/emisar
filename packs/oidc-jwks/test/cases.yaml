services: [oidc]
versions:
  - version: "1.31.3"
    digest: "@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942"
    default: true
env:
  OIDC_CA_CERT: /packs/oidc-jwks/test/fixtures/server.crt
cases:
  - action: oidc.discovery
    args: {issuer: https://oidc}
    expect:
      json:
        /issuer: https://oidc
        /jwks_uri: https://oidc/keys

  - action: oidc.validate_discovery
    args: {issuer: https://oidc}
    expect:
      json:
        /valid: true
        /discovery_url: https://oidc/.well-known/openid-configuration
        /jwks_uri: https://oidc/keys

  - action: oidc.jwks
    args: {jwks_uri: https://oidc/keys}
    expect:
      json:
        /keys/0/kid: current
        /keys/1/kid: next

  - action: oidc.compare_key_ids
    args:
      authoritative_key_ids_json: '["current","next","current"]'
      consumer_key_ids_json: '["current","old"]'
    expect:
      json:
        /relation: consumer_missing_and_extra
        /missing_from_consumer/0: next
        /extra_in_consumer/0: old
        /exact_match: false
        /shared_count: 1
        /missing_count: 1
        /extra_count: 1
        /truncated/missing_from_consumer: 0
        /truncated/extra_in_consumer: 0

  - action: oidc.jwt_header
    args:
      jwt: eyJhbGciOiJSUzI1NiIsImtpZCI6ImN1cnJlbnQiLCJ0eXAiOiJKV1QifQ.e30.signature
    expect:
      json:
        /serialization: jws
        /segment_count: 3
        /alg: RS256
        /kid: current

  - name: oidc.jwks-rejects-private-material
    action: oidc.jwks
    args: {jwks_uri: https://oidc/private}
    expect:
      status: failure
      exit: [1]
      stderr_contains: [contains private key material]

  - name: oidc.validate-discovery-rejects-issuer-mismatch
    action: oidc.validate_discovery
    args: {issuer: https://oidc/wrong}
    expect:
      status: failure
      exit: [5]
      stderr_contains: [does not exactly match]

  - name: oidc.jwks-rejects-redirect
    action: oidc.jwks
    args: {jwks_uri: https://oidc/redirect}
    expect:
      status: failure
      exit: [1]
      stderr_contains: [non-200 response]

  # Real providers ship discovery documents larger than the runner's 8 KiB
  # structured-output cap, so the action returns the whole document as parsed
  # JSON instead of declaring a structured contract it cannot keep. This
  # document is 9430 bytes; success proves the passthrough survives it.
  - name: oidc.discovery-returns-a-document-larger-than-the-structured-cap
    action: oidc.discovery
    args: {issuer: https://oidc/big}
    expect:
      json:
        /issuer: https://oidc/big
        /jwks_uri: https://oidc/keys
        /scopes_supported/119: resource.scope119.readwrite

  # The advertised worst case of the jwks contract: 128 RSA-shaped keys
  # (~52 KiB), far over the structured cap the action no longer declares.
  - name: oidc.jwks-returns-the-128-key-contract-maximum
    action: oidc.jwks
    args: {jwks_uri: https://oidc/keys-large}
    expect:
      json:
        /keys/0/kid: k000
        /keys/127/kid: k127

  # Both diff lists at their 16-entry cap with every ID past the 64-byte clip,
  # from fully disjoint 100-character key sets. The runner rejects a structured
  # result over 8 KiB, so this case's success IS the byte-cap proof; the
  # counts and truncated markers keep the capped lists honest.
  - name: oidc.compare_key_ids-fits-the-cap-with-full-truncated-lists
    action: oidc.compare_key_ids
    args:
      authoritative_key_ids_json: '["auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa00","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa01","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa02","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa03","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa04","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa05","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa06","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa07","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa08","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa09","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa10","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa11","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa12","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa13","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa14","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa15","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa16","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa17","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa18","auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa19"]'
      consumer_key_ids_json: '["cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc00","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc01","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc02","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc03","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc04","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc05","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc06","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc07","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc08","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc09","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc10","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc11","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc12","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc13","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc14","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc15","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc16","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc17","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc18","cons-ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc19"]'
    expect:
      json:
        /relation: consumer_missing_and_extra
        /authoritative_count: 20
        /consumer_count: 20
        /shared_count: 0
        /missing_count: 20
        /extra_count: 20
        /missing_from_consumer/0: "auth-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa…"
        /extra_in_consumer/15: "cons-cccccccccccccccccccccccccccccccccccccccccccccccccccccccccc…"
        /truncated/missing_from_consumer: 4
        /truncated/extra_in_consumer: 4

  # Every recognized header field at its exact byte bound plus crit at its
  # 16x64 maximum. The action declares output.schema, so the runner enforces
  # the 8 KiB structured cap — success IS the worst-case byte proof.
  - name: oidc.jwt_header-fits-the-cap-at-every-field-bound
    action: oidc.jwt_header
    args:
      jwt: .e30.signature
    expect:
      json:
        /serialization: jws
        /segment_count: 3
        /zip: ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ
        /x5t_s256: ssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssss
        /crit/15: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        /present_fields/10: "x5t#S256"

  - name: oidc.jwt_header-rejects-an-oversized-kid
    action: oidc.jwt_header
    args:
      jwt: .e30.signature
    expect:
      status: failure
      exit: [5]
      stderr_contains: [exceeds 256 bytes]
