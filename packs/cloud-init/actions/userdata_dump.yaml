schema_version: 1
id: cloud-init.userdata_dump
title: cat /var/lib/cloud/instance/user-data.txt
kind: exec
risk: high
description: >
  Dump raw user-data as cloud-init received it (after MIME decoding, before
  cloud-config merging). Compare against what you set in the launch
  config to confirm delivery. User-data classically embeds credentials,
  keys, and tokens; the runner's redaction is a pattern-bound backstop,
  not a guarantee.
side_effects:
  - Reads one file.
  - Read-only, but exposes raw user-data (may include secrets).
args: []
execution:
  command:
    binary: cat
    argv: ["/var/lib/cloud/instance/user-data.txt"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 4096
examples:
  - title: Raw user-data
    args: {}
