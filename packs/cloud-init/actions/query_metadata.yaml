schema_version: 1
id: cloud-init.query_metadata
title: cloud-init query <key>
kind: exec
risk: high
description: >
  Pull one key out of cloud-init's runtime metadata (instance-id,
  hostname, region, availability_zone, …), or pass `--all` (the default)
  to dump everything. cloud-init redacts sensitive values only for
  non-root callers: as root, `--all` and the `userdata` / `vendordata` /
  `combined_cloud_config` keys return raw user-data, which classically
  embeds credentials, keys, and tokens. The runner's redaction is a
  pattern-bound backstop, not a guarantee.
side_effects:
  - One CLI call.
  - Read-only.
args:
  - name: key
    type: string
    required: false
    default: "--all"
    description: Metadata key, or "--all" for everything.
    validation:
      pattern: "^(--all|[a-zA-Z0-9_./\\-]{1,128})$"
execution:
  command:
    binary: cloud-init
    argv: ["query", "{{ args.key }}"]
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: All metadata
    args: {}
  - title: Instance id only
    args:
      key: "instance-id"
  - title: Cloud-config user-data
    args:
      key: "userdata"
