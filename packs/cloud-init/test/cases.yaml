# These re-run or reset cloud-init's boot stages, so they need a SUT that was
# cloud-init-provisioned: systemd as PID 1 plus a seed datasource. That is a
# fixture we have not built, not a privilege a container cannot hold — systemd
# itself runs fine in a privileged container.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    cloud-init.clean: requires_privileged_host
    cloud-init.cloud_config_dump: requires_privileged_host
    cloud-init.init: requires_privileged_host
    cloud-init.init_local: requires_privileged_host
    cloud-init.modules_config: requires_privileged_host
    cloud-init.modules_final: requires_privileged_host
    cloud-init.query_metadata: requires_privileged_host
    cloud-init.single_module: requires_privileged_host
    cloud-init.userdata_dump: requires_privileged_host
    cloud-init.vendor_data_dump: requires_privileged_host
