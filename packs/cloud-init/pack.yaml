schema_version: 1

id: cloud-init
name: cloud-init operations
version: 0.1.16
retired_below: 0.1.11
description: >
  cloud-init introspection + boot diagnostics + stage re-runs. Use when
  an EC2/GCE/Azure VM finishes booting but the workload didn't come up
  the way it should: check overall status, blame slow modules, dump
  user-data / cloud-config / vendor-data as the instance actually saw
  them, tail the cloud-init logs, and (with operator approval) re-run
  individual modules or the full init pipeline.
vendor: emisar
homepage: https://emisar.dev/packs/cloud-init

requires:
  os:
    - linux
  binaries:
    - cloud-init

setup:
  summary: >
    Reads the local runner host's cloud-init status, logs, and results —
    no credentials needed.
  notes:
    - "Status, version, schema validation, and instance-id reads work without elevated host access."
  host_access:
    - actions:
        - cloud-init.analyze_show
        - cloud-init.analyze_blame
        - cloud-init.analyze_dump
        - cloud-init.userdata_dump
        - cloud-init.cloud_config_dump
        - cloud-init.vendor_data_dump
        - cloud-init.log_tail
        - cloud-init.output_log_tail
        - cloud-init.journal_tail
        - cloud-init.collect_logs
        - cloud-init.modules_config
        - cloud-init.modules_final
        - cloud-init.single_module
        - cloud-init.init_local
        - cloud-init.init
        - cloud-init.clean_logs
        - cloud-init.clean
      requirement: Read protected cloud-init state and logs, or rerun and clean boot stages, as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-cloud-init-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. Cloud-init reads may expose
            raw user-data secrets, and mutators can reapply provisioning or erase instance state.
  verify: cloud-init.status

actions:
  # Status / boot diagnostics
  - actions/version.yaml
  - actions/status.yaml
  - actions/status_long.yaml
  - actions/analyze_show.yaml
  - actions/analyze_blame.yaml
  - actions/analyze_dump.yaml
  - actions/schema_validate.yaml
  - actions/instance_id.yaml
  # Query metadata
  - actions/query_metadata.yaml
  - actions/userdata_dump.yaml
  - actions/cloud_config_dump.yaml
  - actions/vendor_data_dump.yaml
  # Logs
  - actions/log_tail.yaml
  - actions/output_log_tail.yaml
  - actions/journal_tail.yaml
  - actions/collect_logs.yaml
  # Mutators
  - actions/modules_config.yaml
  - actions/modules_final.yaml
  - actions/single_module.yaml
  - actions/init_local.yaml
  - actions/init.yaml
  - actions/clean_logs.yaml
  - actions/clean.yaml
