schema_version: 1
id: systemd.boot_errors
title: Boot-time journal errors
kind: exec
risk: medium
description: '`journalctl -b -p err` — the most recent 100 error-priority log lines from the current boot. Use to triage an "is everything healthy?" check.'
side_effects:
  - One journalctl invocation.
  - Read-only.
args: []
execution:
  command:
    binary: journalctl
    argv:
      - -b
      - -p
      - err
      - --no-pager
      - -n
      - "100"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Boot errors
    args: {}
