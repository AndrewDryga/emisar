schema_version: 1
id: systemd.analyze_blame
title: systemd-analyze blame
kind: exec
risk: low
description: 'Show the top 30 units sorted by how long they took to start. Use to find a slow boot.'
side_effects:
  - One systemd-analyze invocation.
  - Read-only.
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A pipeline exits with head's status, so systemd-analyze failing — no
      # systemd, an unreachable manager, a container — recorded a SUCCESSFUL
      # read with empty stdout. "Nothing slow at boot" and "I could not look"
      # must not be the same answer.
      - "out=$(systemd-analyze blame 2>&1); status=$?; printf '%s\\n' \"$out\" | head -30; exit $status"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Slowest 30 units
    args: {}
