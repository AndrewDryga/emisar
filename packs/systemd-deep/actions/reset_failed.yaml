schema_version: 1
id: systemd.reset_failed
title: systemctl reset-failed [unit]
kind: exec
risk: medium
description: >
  Clear the "failed" state from units that crashed. Required before
  start-limit thresholds reset and the unit can be auto-restarted.
  Without a unit name, resets every failed unit.
side_effects:
  - Failed-state flag cleared.
  - Start-limit counter reset.
  - Unit not started — explicit start still needed if desired.
args:
  - name: unit
    type: string
    required: false
    default: ""
    description: Unit name (empty for all failed units).
    validation:
      pattern: "^([a-zA-Z0-9@:_.][a-zA-Z0-9@:_.\\-]{0,127})?$"
execution:
  command:
    # The optional marker DROPS the whole element when `unit` is empty, which
    # is what "resets every failed unit" needs: systemctl takes the reset-all
    # path only when it is given no operand, and an empty one fails
    # unit_name_mangle. The old /bin/sh wrapper passed a quoted "" instead, so
    # the example above could never succeed.
    binary: systemctl
    argv: ["reset-failed", "{{ args.unit? }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Reset all failed
    args: {}
  - title: Reset one unit
    args:
      unit: "myapp.service"
