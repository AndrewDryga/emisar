# The service manager under test runs as PID 1 in its own privileged, disposable
# container, and the runner drives it by joining that container's PID namespace
# and /run — systemctl is a D-Bus client, so that is all it needs. The runner
# stays unprivileged; `privileged` is on the SUT, where systemd needs it. This
# is the lane the environment-limits card describes; see it for what else it
# reaches.
services: [systemd]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
# Every unit verb here changes the service manager, which is what the actions
# are for, so they run as root against a manager that exists only for the case.
runner:
  user: root
  reason: >
    systemctl's mutating verbs are privileged operations on the service manager;
    a case that ran them as anyone else would only ever assert the denial.
cases:
  - name: systemd.boot-errors-reads-current-boot
    action: systemd.boot_errors
    arrange:
      - argv: [systemd-cat, -t, packtest-boot-errors, -p, err, echo, packtest-boot-error-marker]
      - argv: [/bin/sh, -c, "journalctl -b -p err --no-pager -n 100 | grep -Fq packtest-boot-error-marker"]
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: [packtest-boot-error-marker]

  - name: systemd.boot-errors-fails-when-journal-is-unreadable
    action: systemd.boot_errors
    env:
      PATH: /opt/packtest-journalctl-failure:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      status: failure
      exit: [13]
      stderr_contains: [journal is not readable]

  - action: systemd.unit_show
    args: {unit: cron.service}
    expect:
      stdout_contains: [Id=cron.service, ActiveState=]

  # "Without a unit name, resets every failed unit" is the action's own example,
  # and it could not work: the old /bin/sh wrapper handed systemctl a quoted
  # empty operand, which fails unit_name_mangle instead of taking the reset-all
  # path. This case runs exactly that example.
  - name: systemd.reset-failed-clears-every-failed-unit
    action: systemd.reset_failed
    args: {}
    arrange:
      - argv: [systemd-run, --unit=packtest-failed.service, /bin/false]
      - argv: [/bin/sh, -c, "systemctl is-failed packtest-failed.service | grep -Fqx failed"]
        retry_for: 10s
        retry_every: 200ms
    probes:
      - name: the manager holds no failed unit
        argv: [/bin/sh, -c, "systemctl list-units --failed --plain --no-legend --no-pager; echo probed"]
        expect:
          stdout_contains: [probed]
          stdout_not_contains: [packtest-failed.service]

  - name: systemd.watchdog-status-lists-a-supervised-unit
    action: systemd.watchdog_status
    arrange:
      - argv: [systemd-run, --unit=packtest-watchdog.service, --property=WatchdogSec=30, /bin/sleep, "600"]
      - argv: [/bin/sh, -c, "test \"$(systemctl show packtest-watchdog.service -p WatchdogUSec --value)\" != 0"]
        retry_for: 10s
        retry_every: 200ms
    expect:
      stdout_contains: [packtest-watchdog.service]
    cleanup:
      - argv: [systemctl, stop, packtest-watchdog.service]

  # The unit list ended a pipeline whose last command always succeeded, so a
  # host where systemctl cannot reach the manager answered "no service has a
  # watchdog" — the same false all-clear the journal case above pins.
  - name: systemd.watchdog-status-fails-when-the-manager-is-unreachable
    action: systemd.watchdog_status
    env:
      PATH: /opt/packtest-systemctl-failure:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    expect:
      status: failure
      exit: [1]
      stderr_contains: [Failed to connect to bus]

  - action: systemd.unit_start
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, stop, cron.service]
    probes:
      - name: the unit is running
        argv: [systemctl, is-active, cron.service]
        expect:
          stdout_contains: [active]

  - action: systemd.unit_stop
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, start, cron.service]
    probes:
      - name: the unit is no longer running
        argv: [/bin/sh, -c, "systemctl is-active cron.service; echo probed"]
        expect:
          stdout_contains: [inactive, probed]

  # The main PID is what changes when a unit really restarts; asserting it is
  # still active would pass whether or not anything happened.
  - action: systemd.unit_restart
    args: {unit: cron.service}
    arrange:
      - argv: [systemctl, start, cron.service]
      - argv: [/bin/sh, -c, "systemctl show cron.service -p MainPID --value > /run/packtest-mainpid"]
    probes:
      - name: the service came back under a new main PID
        argv: [/bin/sh, -c, "test \"$(systemctl show cron.service -p MainPID --value)\" != \"$(cat /run/packtest-mainpid)\" && systemctl is-active cron.service"]
        expect:
          stdout_contains: [active]

  - action: systemd.unit_reload
    args: {unit: dbus.service}
    probes:
      - name: the reloaded unit is still up
        argv: [systemctl, is-active, dbus.service]
        expect:
          stdout_contains: [active]

  - action: systemd.unit_kill
    args: {unit: cron.service, signal: SIGKILL}
    arrange:
      - argv: [systemctl, start, cron.service]
    probes:
      - name: systemd recorded a signal, not a clean exit
        argv: [systemctl, show, cron.service, -p, Result, --value]
        expect:
          stdout_contains: [signal]

  # Masking is the one that cannot be walked back by a start, so the probe is
  # that a start now fails rather than that the symlink exists.
  - action: systemd.unit_mask
    args: {unit: cron.service}
    probes:
      - name: the masked unit refuses to start
        argv: [/bin/sh, -c, "systemctl start cron.service 2>&1 | grep -q masked && echo refused"]
        expect:
          stdout_contains: [refused]
    cleanup:
      - argv: [systemctl, unmask, cron.service]

  # The probe checks BOTH halves — that archived journals existed and that they
  # are gone — because either alone passes vacuously: a machine with nothing
  # archived vacuums nothing successfully. The rotate guarantees the first half
  # rather than trusting the SUT to have rotated on its own. Verified by widening
  # the cutoff to 9999w, which succeeds, removes nothing, and fails the probe.
  # The journal is volatile here, so it lives under the /run the SUT shares.
  - action: systemd.vacuum_journal
    args: {cutoff: 1s}
    arrange:
      - argv: [journalctl, --rotate]
      - argv: [/bin/sh, -c, "ls /run/log/journal/*/*@*.journal /var/log/journal/*/*@*.journal 2>/dev/null | wc -l > /run/packtest-archived"]
    expect:
      stderr_contains: ["Vacuuming done"]
    probes:
      - name: archived journals existed and are now gone
        argv: [/bin/sh, -c, "test \"$(cat /run/packtest-archived)\" -gt 0 && test \"$(ls /run/log/journal/*/*@*.journal /var/log/journal/*/*@*.journal 2>/dev/null | wc -l)\" -eq 0 && echo vacuumed"]
        expect:
          stdout_contains: [vacuumed]
