# systemctl start/restart/mask/unmask and journalctl --vacuum-time all work
# against systemd running as PID 1 in a privileged container — measured. These
# stay declared because that lane is not built, not because a host is required.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    systemd.unit_kill: requires_privileged_host
    systemd.unit_mask: requires_privileged_host
    systemd.unit_reload: requires_privileged_host
    systemd.unit_restart: requires_privileged_host
    systemd.unit_show: requires_privileged_host
    systemd.unit_start: requires_privileged_host
    systemd.unit_stop: requires_privileged_host
    systemd.vacuum_journal: requires_privileged_host
