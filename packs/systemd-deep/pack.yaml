schema_version: 1

id: systemd-deep
name: Systemd deep introspection pack
version: 0.1.21
# 0.1.20 and below let watchdog_status report "no service has a watchdog" for a
# host where systemctl could not reach the manager at all — a false all-clear
# from a low, auto-running read.
retired_below: 0.1.21
description: >
  Deeper systemd state than linux-core: failed units, list-units,
  timers, cgroup tree, journal disk usage, systemd-analyze for boot
  diagnosis, plus full operator surface (daemon-reload, start/stop/
  restart/reload, kill -s signal, mask/unmask, reset-failed) for
  remediating runtime issues.
vendor: emisar
homepage: https://emisar.dev/packs/systemd-deep

requires:
  os:
    - linux
  binaries:
    - systemctl
    - journalctl

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  notes:
    - "Most introspection (failed_units, list_units, timers, cgroup_tree, analyze_*, unit_show) is read-only and needs no privilege."
  host_access:
    - actions:
        - systemd.boot_errors
      requirement: Read the complete system journal.
      recipes:
        - name: Add the Emisar service user to systemd-journal
          commands:
            - "sudo usermod -aG systemd-journal emisar"
            - "sudo systemctl restart emisar"
          verify:
            - "id -nG emisar | tr ' ' '\\n' | grep -Fx systemd-journal"
            - "sudo -u emisar journalctl -b -n 1 --no-pager >/dev/null"
          impact: >
            Every process running as emisar can read the full system journal, which may
            contain application output, usernames, addresses, and secrets written by services.
    - actions:
        - systemd.vacuum_journal
        - systemd.daemon_reload
        - systemd.unit_start
        - systemd.unit_stop
        - systemd.unit_restart
        - systemd.unit_reload
        - systemd.unit_kill
        - systemd.unit_mask
        - systemd.unit_unmask
        - systemd.reset_failed
      requirement: Change arbitrary systemd units and journal retention as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-systemd-deep-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. These actions can stop,
            mask, kill, or reconfigure any systemd unit and permanently delete journal history.
  verify: systemd.failed_units

actions:
  - actions/failed_units.yaml
  - actions/list_units.yaml
  - actions/list_unit_files.yaml
  - actions/timers.yaml
  - actions/sockets.yaml
  - actions/cgroup_tree.yaml
  - actions/cgroup_top.yaml
  - actions/boot_errors.yaml
  - actions/analyze_blame.yaml
  - actions/analyze_critical_chain.yaml
  - actions/analyze_security.yaml
  - actions/journal_disk_usage.yaml
  - actions/unit_show.yaml
  - actions/watchdog_status.yaml
  - actions/vacuum_journal.yaml
  - actions/daemon_reload.yaml
  - actions/unit_start.yaml
  - actions/unit_stop.yaml
  - actions/unit_restart.yaml
  - actions/unit_reload.yaml
  - actions/unit_kill.yaml
  - actions/unit_mask.yaml
  - actions/unit_unmask.yaml
  - actions/reset_failed.yaml
