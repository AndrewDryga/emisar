schema_version: 1
id: airflow.dag_run_clear
title: Clear and re-run a DAG run (POST .../dagRuns/{dag_run_id}/clear)
kind: script
risk: high
description: >
  Clear task instances in one DAG run and let the scheduler run them again.
  This is the standard "retry last night's failure" action, and the cleared
  tasks execute for real with all their side effects. Run
  airflow.dag_run_clear_preview first to see exactly what it will touch.
side_effects:
  - Resets the matching task instances and re-queues them for execution.
  - Cleared tasks run again with their real side effects, including writes and third-party calls.
  - Sets the DAG run back to a running state.
search_terms:
  - clear dag run
  - retry failed tasks
  - rerun the run
  - restart the run
args:
  - name: dag_id
    type: string
    required: true
    description: DAG id.
    validation:
      pattern: "^[A-Za-z0-9._-]{1,250}$"
      max_length: 250
  - name: dag_run_id
    type: string
    required: true
    description: Run id.
    validation:
      pattern: "^[A-Za-z0-9._:+-]{1,250}$"
      max_length: 250
  - name: only_failed
    type: string
    required: false
    default: "true"
    description: >
      Clear only failed task instances (true, the default) or every task
      instance in the run. Clearing everything re-runs tasks that already
      succeeded.
    validation:
      enum: ["true", "false"]
execution:
  script: {path: scripts/airflow_api.sh, interpreter: /bin/bash}
  argv: [clear-dag-run, "{{ args.dag_id }}", "{{ args.dag_run_id }}", "false", "{{ args.only_failed }}"]
  timeout: 120s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Retry the failed tasks in a run
    args: {dag_id: daily_sales_etl, dag_run_id: "scheduled__2026-08-05T00:00:00+00:00"}
