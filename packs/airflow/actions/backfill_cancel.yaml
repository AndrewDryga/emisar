schema_version: 1
id: airflow.backfill_cancel
title: Cancel a backfill (PUT /api/v2/backfills/{backfill_id}/cancel)
kind: script
risk: high
description: >
  Cancel a backfill. Its queued runs are dropped and running task instances are
  stopped, so a partially reprocessed date range is left partially reprocessed
  — which downstream consumers may read as complete. Prefer
  airflow.backfill_pause when the goal is only to free capacity.
side_effects:
  - Stops the backfill and cancels its remaining runs.
  - Task instances still running are terminated mid-flight, which can leave partial writes.
  - The date range is left partly reprocessed; the backfill cannot be resumed.
search_terms:
  - cancel backfill
  - stop backfill
  - kill backfill
args:
  - name: backfill_id
    type: integer
    required: true
    description: Backfill id, as reported by airflow.backfills.
    validation: {min: 1, max: 9007199254740991}
execution:
  script: {path: scripts/airflow_api.sh, interpreter: /bin/bash}
  argv: [cancel-backfill, "{{ args.backfill_id }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Abandon a backfill started with the wrong range
    args: {backfill_id: 7}
