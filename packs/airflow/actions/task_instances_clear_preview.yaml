schema_version: 1
id: airflow.task_instances_clear_preview
title: Preview clearing task instances (POST .../clearTaskInstances, dry run)
kind: script
risk: low
description: >
  Show which task instances airflow.task_instances_clear would reset, without
  changing anything. Use it to check the reach of include_downstream before
  clearing a task in the middle of a DAG.
side_effects:
  - One HTTP POST with dry_run fixed true; Airflow computes the affected task instances and changes nothing.
  - Read-only in effect — no task instance or run state is modified.
search_terms:
  - what would clearing this task do
  - preview downstream clear
  - dry run clear task
args:
  - name: dag_id
    type: string
    required: true
    description: DAG id.
    validation:
      pattern: "^[A-Za-z0-9._-]{1,250}$"
      max_length: 250
  - name: dag_run_id
    type: string
    required: false
    default: ""
    description: Restrict to one run. Empty considers every run of the DAG.
    validation:
      pattern: "^[A-Za-z0-9._:+-]{0,250}$"
      max_length: 250
  - name: task_ids
    type: string
    required: false
    default: ""
    description: Comma-separated task ids to clear. Empty considers every task.
    validation:
      pattern: "^[A-Za-z0-9._,-]{0,1000}$"
      max_length: 1000
  - name: only_failed
    type: string
    required: false
    default: "true"
    description: Consider only failed task instances (true, the default) or every matching task instance.
    validation:
      enum: ["true", "false"]
  - name: include_downstream
    type: string
    required: false
    default: "false"
    description: Also consider every task downstream of the selected ones.
    validation:
      enum: ["true", "false"]
execution:
  script: {path: scripts/airflow_api.sh, interpreter: /bin/bash}
  argv:
    - clear-task-instances
    - "{{ args.dag_id }}"
    - "true"
    - "{{ args.dag_run_id }}"
    - "{{ args.task_ids }}"
    - "{{ args.only_failed }}"
    - "{{ args.include_downstream }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: What clearing one task and its downstream would touch
    args: {dag_id: daily_sales_etl, task_ids: extract_orders, include_downstream: "true"}
