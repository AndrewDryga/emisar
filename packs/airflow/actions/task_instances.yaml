schema_version: 1
id: airflow.task_instances
title: List task instances (GET .../dagRuns/{dag_run_id}/taskInstances)
kind: script
risk: low
description: >
  List task instances with state, try number, duration, hostname, operator,
  pool, and queue. Pass `~` for dag_id and dag_run_id to search across every
  DAG and run: `state: failed` finds every failing task in the deployment,
  `state: queued` with a pool filter shows what a saturated pool is holding up.
side_effects:
  - One read-only HTTP GET to the Airflow task-instance list endpoint.
  - Read-only — never writes or mutates data.
search_terms:
  - failed tasks
  - stuck tasks
  - queued task instances
  - which task failed
  - tasks up for retry
args:
  - name: dag_id
    type: string
    required: false
    default: "~"
    description: DAG id, or ~ (the default) to search across every DAG.
    validation:
      pattern: "^([A-Za-z0-9._-]{1,250}|~)$"
      max_length: 250
  - name: dag_run_id
    type: string
    required: false
    default: "~"
    description: Run id, or ~ (the default) to search across every run.
    validation:
      pattern: "^([A-Za-z0-9._:+-]{1,250}|~)$"
      max_length: 250
  - name: task_id
    type: string
    required: false
    default: ""
    description: Restrict to one task id. Empty lists every task.
    validation:
      pattern: "^[A-Za-z0-9._-]{0,250}$"
      max_length: 250
  - name: state
    type: string
    required: false
    default: ""
    description: Restrict to task instances in this state. Empty lists every state.
    validation:
      enum: ["", "removed", "scheduled", "queued", "running", "success", "restarting", "failed", "up_for_retry", "up_for_reschedule", "upstream_failed", "skipped", "deferred", "awaiting_input"]
  - name: pool
    type: string
    required: false
    default: ""
    description: Restrict to task instances assigned to one pool.
    validation:
      pattern: "^[A-Za-z0-9._-]{0,256}$"
      max_length: 256
  - name: limit
    type: integer
    required: false
    default: 50
    description: Task instances returned in this page.
    validation: {min: 1, max: 200}
  - name: order_by
    type: string
    required: false
    default: "-start_date"
    description: Sort field, prefixed with - for descending.
    validation:
      pattern: "^-?[a-z_]{1,64}$"
      max_length: 65
execution:
  script: {path: scripts/airflow_api.sh, interpreter: /bin/bash}
  argv:
    - task-instances
    - "{{ args.dag_id }}"
    - "{{ args.dag_run_id }}"
    - "{{ args.task_id }}"
    - "{{ args.state }}"
    - "{{ args.pool }}"
    - "{{ args.limit }}"
    - "{{ args.order_by }}"
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Every failed task across the deployment
    args: {state: failed}
  - title: Tasks in one run
    args: {dag_id: daily_sales_etl, dag_run_id: "scheduled__2026-08-05T00:00:00+00:00"}
  - title: What a saturated pool is holding
    args: {state: queued, pool: warehouse}
