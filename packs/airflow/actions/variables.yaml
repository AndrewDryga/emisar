schema_version: 1
id: airflow.variables
title: List variable inventory (GET /api/v2/variables)
kind: script
risk: low
description: >
  List Airflow variable keys with their description, whether they are
  encrypted, and how many bytes the value holds. Values never leave the runner
  — an Airflow variable routinely holds an API key or a DSN, and no redaction
  pattern can be trusted to catch every shape — so this answers "does this
  variable exist and is it set", never "what is it".
side_effects:
  - One read-only HTTP GET to the Airflow /api/v2/variables endpoint.
  - Read-only — never writes or mutates data.
  - Returns variable keys and value length only; values are removed on the host.
search_terms:
  - list variables
  - is the variable set
  - variable key
args:
  - name: variable_key_pattern
    type: string
    required: false
    default: ""
    description: Substring the variable key must contain. Empty lists every variable.
    validation:
      pattern: "^[A-Za-z0-9._-]{0,250}$"
      max_length: 250
  - name: limit
    type: integer
    required: false
    default: 100
    description: Variables returned in this page.
    validation: {min: 1, max: 300}
execution:
  script: {path: scripts/airflow_api.sh, interpreter: /bin/bash}
  argv: [variables, "{{ args.variable_key_pattern }}", "{{ args.limit }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Every variable key
    args: {}
