services: [airflow]
versions:
  - version: "3.3.0"
    digest: "@sha256:fb2c895e33395e4224c3de041e1751b095ee2c214cdf2d330bbaf62fcce0f54b"
    default: true
    env: {AIRFLOW_API_VERSION: v2}
  - version: "2.10.4-python3.11"
    digest: "@sha256:5afa55b7c6087112770605f9b9851afd665f5c7f3719b390fcb4bd28a47a7f9a"
    env: {AIRFLOW_API_VERSION: v1}
# Each fresh stack takes over two minutes in CI. Five shards keep the two-worker
# waves inside the execution budget while leaving time for cleanup and reports.
shards: 5
# Each case starts scheduler, webserver, triggerer and metadata database.
# Two concurrent stacks keep provider imports inside Airflow 2's startup bound.
workers: 2
secret_env: [AIRFLOW_PASSWORD, PACKTEST_VARIABLE_VALUE, PACKTEST_CONN_PASSWORD, PACKTEST_CONN_EXTRA_TOKEN]
env:
  AIRFLOW_URL: "http://airflow:8080"
  AIRFLOW_USERNAME: admin
  AIRFLOW_PASSWORD: packtest-canary-airflow-admin-5b7d
  PACKTEST_VARIABLE_VALUE: packtest-canary-airflow-variable-4f1c
  PACKTEST_CONN_PASSWORD: packtest-canary-airflow-conn-9a3e
  PACKTEST_CONN_EXTRA_TOKEN: packtest-canary-airflow-extra-77b2
defaults:
  expect:
    stdout_not_empty: true
    # The SUT seeds a variable, a connection password, and a connection extra
    # with these values. No action in this pack may return any of them.
    stdout_not_contains:
      - packtest-canary-airflow-admin-5b7d
      - packtest-canary-airflow-variable-4f1c
      - packtest-canary-airflow-conn-9a3e
      - packtest-canary-airflow-extra-77b2
cases:
  - action: airflow.backfill_cancel
    name: airflow.backfill_cancel-v1-unsupported
    versions: ["2.10.4-python3.11"]
    args: {backfill_id: 1}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.backfill_cancel requires Airflow 3"]

  - action: airflow.backfill_pause
    name: airflow.backfill_pause-v1-unsupported
    versions: ["2.10.4-python3.11"]
    args: {backfill_id: 1}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.backfill_pause requires Airflow 3"]

  - action: airflow.backfill_create
    name: airflow.backfill_create-v1-unsupported
    versions: ["2.10.4-python3.11"]
    args: {dag_id: packtest_scheduled, from_date: "2026-01-01T00:00:00Z", to_date: "2026-01-03T00:00:00Z"}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.backfill_create requires Airflow 3"]

  - action: airflow.backfills
    name: airflow.backfills-v1-unsupported
    versions: ["2.10.4-python3.11"]
    args: {dag_id: packtest_scheduled}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.backfills requires Airflow 3"]

  - action: airflow.asset_events
    name: airflow.asset_events-v1-unsupported
    versions: ["2.10.4-python3.11"]
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.asset_events requires Airflow 3"]

  - action: airflow.assets
    name: airflow.assets-v1-unsupported
    versions: ["2.10.4-python3.11"]
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.assets requires Airflow 3"]

  - action: airflow.jobs
    name: airflow.jobs-v1-unsupported
    versions: ["2.10.4-python3.11"]
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["airflow.jobs requires Airflow 3"]

  # ------------------------------------------------------------- health
  - action: airflow.health
    expect:
      json:
        /scheduler/status: healthy
        /metadatabase/status: healthy

  - action: airflow.version
    expect:
      stdout_contains: ['"version"', '"git_version"']

  - action: airflow.jobs
    versions: ["3.3.0"]
    expect:
      stdout_contains: [SchedulerJob, TriggererJob]

  # -------------------------------------------------------- DAG inventory
  - action: airflow.dags
    expect:
      stdout_contains: [packtest_pipeline, packtest_failing]

  - action: airflow.dags
    name: airflow.dags-filtered-by-tag
    args: {tags: failure}
    expect:
      stdout_contains: [packtest_failing]
      stdout_not_contains: [packtest_pipeline]

  - action: airflow.dag
    args: {dag_id: packtest_pipeline}
    expect:
      json:
        /dag_id: packtest_pipeline
        /is_paused: false

  - action: airflow.dag
    name: airflow.dag-unknown-fails
    args: {dag_id: no-such-dag}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["Airflow API request failed", "/dags/no-such-dag"]

  # Brackets are how IPv6 spells a literal host. The shape check used to reject
  # them alongside braces, which disabled all the actions on an IPv6-only or
  # ::-bound deployment before a request was ever attempted. It now gets past
  # the guard and fails at the first transfer (the token mint), where nothing
  # is listening.
  - action: airflow.dags
    name: airflow.dags-accepts-a-literal-ipv6-endpoint
    versions: ["3.3.0"]
    env:
      AIRFLOW_URL: "http://[::1]:8080"
    expect:
      status: failure
      stderr_contains: ["minting an Airflow API token from http://[::1]:8080/auth/token failed"]
      stderr_not_contains: ["must not contain braces"]

  - action: airflow.dag_details
    args: {dag_id: packtest_pipeline}
    expect:
      stdout_contains: ['"catchup"', packtest_pipeline]

  - action: airflow.dag_stats
    args: {dag_ids: "packtest_pipeline,packtest_failing"}
    expect:
      stdout_contains: [packtest_pipeline, packtest_failing, '"success"']

  - action: airflow.dag_tasks
    args: {dag_id: packtest_pipeline}
    expect:
      stdout_contains: [extract, load]

  - action: airflow.import_errors
    expect:
      json:
        /total_entries: 0

  - action: airflow.dag_warnings
    expect:
      json:
        /total_entries: 0

  - action: airflow.providers
    args: {limit: 5}
    expect:
      stdout_contains: [apache-airflow-providers]

  # ------------------------------------------------- runs and task instances
  - action: airflow.dag_runs
    args: {state: failed}
    expect:
      stdout_contains: [packtest_seed_failed, packtest_failing]

  - action: airflow.dag_run
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed}
    expect:
      json:
        /dag_run_id: packtest_seed_failed
        /state: failed

  - action: airflow.task_instances
    args: {state: failed}
    expect:
      stdout_contains: [probe, packtest_failing, '"failed"']

  - action: airflow.task_instance
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed, task_id: probe}
    expect:
      json:
        /task_id: probe
        /state: failed

  - action: airflow.task_log
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed, task_id: probe, try_number: 1}
    expect:
      stdout_contains:
        - "Task failed with exception"
        - "RuntimeError: packtest deliberate failure"
        - "packtest_failing.py"

  - action: airflow.event_logs
    args: {limit: 10}
    expect:
      stdout_contains: ['"event_logs"']

  # ------------------------------------------------- scheduling resources
  - action: airflow.pools
    expect:
      stdout_contains: [packtest_pool, default_pool, '"open_slots"']

  # The seeded connection carries a canary password and a canary token inside
  # its extra document; the plan-wide stdout_not_contains is what proves
  # neither leaves the host.
  - action: airflow.connections
    versions: ["3.3.0"]
    expect:
      stdout_contains: [packtest_conn, warehouse.packtest.invalid, '"has_auth":true', '"has_extra":true']

  - action: airflow.variables
    expect:
      stdout_contains: [packtest_variable, '"value_bytes":37']

  - action: airflow.assets
    versions: ["3.3.0"]
    expect:
      json:
        /total_entries: 0

  - action: airflow.asset_events
    versions: ["3.3.0"]
    expect:
      json:
        /total_entries: 0

  - action: airflow.backfills
    versions: ["3.3.0"]
    args: {dag_id: packtest_scheduled}
    expect:
      json:
        /total_entries: 0

  # -------------------------------------------------------------- controls
  - action: airflow.dag_pause
    args: {dag_id: packtest_pipeline}
    expect:
      json:
        /dag_id: packtest_pipeline
        /is_paused: true
    probes:
      - name: the DAG reads back paused
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag, packtest_pipeline]
        expect:
          json: {/is_paused: true}

  # packtest_scheduled ships paused, so this proves the transition rather than
  # a no-op write.
  - action: airflow.dag_unpause
    args: {dag_id: packtest_scheduled}
    expect:
      json:
        /dag_id: packtest_scheduled
        /is_paused: false
    probes:
      - name: the DAG reads back unpaused
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag, packtest_scheduled]
        expect:
          json: {/is_paused: false}

  - action: airflow.dag_run_trigger
    args:
      dag_id: packtest_pipeline
      dag_run_id: packtest_case_trigger
      conf: '{"region":"eu"}'
      note: 'triggered by the "airflow" pack behavior plan'
    expect:
      json:
        /dag_run_id: packtest_case_trigger
        /run_type: manual
        /conf/region: eu
    probes:
      - name: the run exists with the conf and note it was given
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag-run, packtest_pipeline, packtest_case_trigger]
        expect:
          json: {/conf/region: eu}
          stdout_contains: ['behavior plan']

  # Retiring a finished run is the stable direction to assert: a run marked
  # failed stays failed, where one sent back to queued is immediately the
  # scheduler's again.
  - action: airflow.dag_run_set_state
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_seed_success, state: failed}
    expect:
      json:
        /dag_run_id: packtest_seed_success
        /state: failed
    probes:
      - name: the run reads back failed
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag-run, packtest_pipeline, packtest_seed_success]
        expect:
          json: {/state: failed}

  - action: airflow.dag_run_clear_preview
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed}
    expect:
      stdout_contains: [probe]
    probes:
      - name: run stays failed after a dry run
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag-run, packtest_failing, packtest_seed_failed]
        expect:
          json: {/state: failed}

  - action: airflow.dag_run_clear
    versions: ["3.3.0"]
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed}
    expect:
      json:
        /dag_run_id: packtest_seed_failed
        /state: queued
    probes:
      # The point of a clear is that the work runs again, so the probe waits
      # for the second attempt rather than for the intermediate state.
      - name: the task runs a second time
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_failing, packtest_seed_failed, probe, "-1"]
        retry_for: 180s
        retry_every: 5s
        expect:
          json: {/try_number: 2, /state: failed}

  - action: airflow.task_instances_clear_preview
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed, task_ids: probe}
    expect:
      stdout_contains: [probe]
    probes:
      - name: task stays failed after a dry run
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_failing, packtest_seed_failed, probe, "-1"]
        expect:
          json: {/state: failed}

  - action: airflow.task_instances_clear
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed, task_ids: probe}
    expect:
      stdout_contains: [probe]
    probes:
      - name: the task runs a second time
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_failing, packtest_seed_failed, probe, "-1"]
        retry_for: 180s
        retry_every: 5s
        expect:
          json: {/try_number: 2, /state: failed}

  - action: airflow.task_instance_set_state
    args:
      dag_id: packtest_failing
      dag_run_id: packtest_seed_failed
      task_id: probe
      state: success
    expect:
      stdout_contains: [probe, '"state":"success"']
    probes:
      - name: the task reads back successful without having run
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_failing, packtest_seed_failed, probe, "-1"]
        expect:
          json: {/state: success}

  - action: airflow.dag_run_delete
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_case_delete}
    arrange:
      - name: create the run this case deletes
        argv:
          - bash
          - /packs/airflow/scripts/airflow_api.sh
          - trigger
          - packtest_pipeline
        env:
          AF_LOGICAL_DATE: ""
          AF_DAG_RUN_ID: packtest_case_delete
          AF_CONF: ""
          AF_NOTE: ""
      # Airflow refuses to delete a run that is still queued or running, and
      # packtest_pipeline is trivial enough that the trigger above wins the race
      # to the delete. Wait for it to finish, so the case tests the delete
      # rather than the scheduler's head start.
      - name: the run reaches a terminal state
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag-run, packtest_pipeline, packtest_case_delete]
        retry_for: 180s
        retry_every: 5s
        expect:
          json: {/state: success}
    expect:
      json:
        /deleted: true
        /dag_run_id: packtest_case_delete
    probes:
      - name: the run is gone while the seeded one remains
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, dag-runs, packtest_pipeline, "", "", "", "10", "-run_after"]
        expect:
          stdout_contains: [packtest_seed_success]
          stdout_not_contains: [packtest_case_delete]

  - action: airflow.pool_set_slots
    args: {pool_name: packtest_pool, slots: 6}
    expect:
      json:
        /name: packtest_pool
        /slots: 6
    probes:
      - name: the pool lists its new slot count
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, pools, "", "10"]
        expect:
          json: {/pools/1/name: packtest_pool, /pools/1/slots: 6}

  # Airflow refuses a backfill on a DAG without a periodic schedule, so the
  # backfill cases use packtest_scheduled.
  - action: airflow.backfill_create
    versions: ["3.3.0"]
    args:
      dag_id: packtest_scheduled
      from_date: "2026-01-01T00:00:00Z"
      to_date: "2026-01-03T00:00:00Z"
      max_active_runs: 2
    expect:
      json:
        /dag_id: packtest_scheduled
        /id: 1
    probes:
      - name: the backfill is listed for the DAG
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, backfills, packtest_scheduled, "5", "-id"]
        expect:
          stdout_contains: ['"id":1', packtest_scheduled]

  - action: airflow.backfill_pause
    versions: ["3.3.0"]
    args: {backfill_id: 1}
    arrange:
      - name: create the backfill this case pauses
        argv:
          - bash
          - /packs/airflow/scripts/airflow_api.sh
          - create-backfill
          - packtest_scheduled
          - "2026-01-01T00:00:00Z"
          - "2026-01-03T00:00:00Z"
          - none
          - "2"
          - "false"
    expect:
      json:
        /id: 1
        /dag_id: packtest_scheduled
    probes:
      - name: the backfill reads back paused
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, backfills, packtest_scheduled, "5", "-id"]
        expect:
          stdout_contains: ['"is_paused":true']

  - action: airflow.backfill_cancel
    versions: ["3.3.0"]
    args: {backfill_id: 1}
    arrange:
      - name: create the backfill this case cancels
        argv:
          - bash
          - /packs/airflow/scripts/airflow_api.sh
          - create-backfill
          - packtest_scheduled
          - "2026-01-01T00:00:00Z"
          - "2026-01-03T00:00:00Z"
          - none
          - "2"
          - "false"
    expect:
      json:
        /id: 1
        /dag_id: packtest_scheduled
    probes:
      - name: the backfill is closed out
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, backfills, packtest_scheduled, "5", "-id"]
        expect:
          stdout_contains: ['"id":1', packtest_scheduled]
          stdout_not_contains: ['"completed_at":null']

  # ------------------------------------------------------------- auth path
  # A wrong password must fail the action, not return an empty success.
  - action: airflow.dags
    name: airflow.dags-invalid-credentials
    versions: ["3.3.0"]
    env:
      AIRFLOW_PASSWORD: packtest-canary-airflow-wrong-1c4a
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["minting an Airflow API token"]

  - action: airflow.dags
    name: airflow.dags-invalid-basic-credentials
    versions: ["2.10.4-python3.11"]
    env:
      AIRFLOW_PASSWORD: packtest-canary-airflow-wrong-1c4a
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["Airflow API request failed", "401"]

  - action: airflow.dags
    name: airflow.dags-missing-credentials
    unset_env: [AIRFLOW_USERNAME, AIRFLOW_PASSWORD]
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["Airflow API request failed"]

  - action: airflow.dags
    name: airflow.dags-invalid-api-version
    env: {AIRFLOW_API_VERSION: v0}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["AIRFLOW_API_VERSION must be v1"]

  - action: airflow.dags
    name: airflow.dags-v1-unsupported-filter
    versions: ["2.10.4-python3.11"]
    args: {last_dag_run_state: failed}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["last_dag_run_state is not supported by Airflow 2"]

  - action: airflow.connections
    name: airflow.connections-v1-unknown-auth-flags
    versions: ["2.10.4-python3.11"]
    expect:
      stdout_contains: [packtest_conn, warehouse.packtest.invalid, '"has_auth":null', '"has_extra":null']

  - action: airflow.task_instances
    name: airflow.task_instances-filtered-by-task
    args: {task_id: probe, state: failed}
    expect:
      stdout_contains: [probe, packtest_failing]
      stdout_not_contains: [extract, load]

  - action: airflow.dag_run_clear
    name: airflow.dag_run_clear-v1
    versions: ["2.10.4-python3.11"]
    args: {dag_id: packtest_failing, dag_run_id: packtest_seed_failed}
    expect:
      stdout_contains: [probe]
    probes:
      - name: the task runs a second time
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_failing, packtest_seed_failed, probe, "-1"]
        retry_for: 180s
        retry_every: 5s
        expect:
          json: {/try_number: 2, /state: failed}

  - action: airflow.task_instance
    name: airflow.task_instance-mapped
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_seed_success, task_id: mapped, map_index: 1}
    expect:
      json:
        /task_id: mapped
        /map_index: 1
        /state: success

  - action: airflow.task_instance_set_state
    name: airflow.task_instance_set_state-mapped
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_seed_success, task_id: mapped, map_index: 1, state: failed}
    expect:
      stdout_contains: [mapped, '"failed"']
    probes:
      - name: only the selected mapped instance changed
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_pipeline, packtest_seed_success, mapped, "1"]
        expect:
          json: {/state: failed}
      - name: the other mapped instance stays successful
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_pipeline, packtest_seed_success, mapped, "0"]
        expect:
          json: {/state: success}

  - action: airflow.task_instance_set_state
    name: airflow.task_instance_set_state-downstream
    # Airflow 2 clears failed downstream tasks after applying a state, so skipped
    # is the stable transition that proves the entire selected branch changed.
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_seed_success, task_id: extract, state: skipped, include_downstream: "true"}
    expect:
      stdout_contains: [extract]
    probes:
      - name: the downstream task changed without execution
        argv: [bash, /packs/airflow/scripts/airflow_api.sh, task-instance, packtest_pipeline, packtest_seed_success, load, "-1"]
        expect:
          json: {/state: skipped}

  - action: airflow.task_instance_set_state
    name: airflow.task_instance_set_state-v1-mapped-downstream-unsupported
    versions: ["2.10.4-python3.11"]
    args: {dag_id: packtest_pipeline, dag_run_id: packtest_seed_success, task_id: mapped, map_index: 1, state: failed, include_downstream: "true"}
    expect:
      status: failure
      exit: [1]
      stderr_contains: ["Airflow 2 cannot update mapped task instances with include_downstream=true"]
