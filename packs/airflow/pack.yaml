schema_version: 1

id: airflow
name: Apache Airflow
version: 0.1.9
# 0.1.0 shipped task_log as low risk, so it auto-ran with no approval while
# returning whatever a task printed — including secrets Airflow's masker does
# not recognize. A mislabelled tier that skipped the gate is a security fix.
retired_below: 0.1.1
description: >
  Governed Apache Airflow 2 and 3 operations over the stable REST API:
  scheduler/triggerer/dag-processor health and job heartbeats, DAG inventory
  and per-DAG detail, run and task-instance search across every DAG, task
  logs, import errors and DAG warnings, pools, asset events, connection and
  variable inventory (names and routing only — never values), and the
  incident controls an operator actually reaches for: pause and unpause a
  DAG, trigger a run, mark a run or task succeeded/failed, preview then
  perform a clear, retune a pool, and start, pause, or cancel a backfill.
  Airflow 2 uses API v1 and Basic authentication; Airflow 3 uses API v2 with
  AIRFLOW_API_TOKEN or a JWT minted from AIRFLOW_USERNAME/AIRFLOW_PASSWORD.
  Jobs, assets, and backfills require Airflow 3.
vendor: emisar
homepage: https://emisar.dev/packs/airflow

requires:
  os:
    - linux
  binaries:
    - curl
    - jq
    - bash

# `emisar pack suggest`: the airflow console script identifies a host that runs
# Airflow. The API server's port only corroborates it — 8080 names no owner.
detect:
  binaries:
    - airflow
  ports:
    - 8080

setup:
  summary: >
    Actions call the Airflow API at `$AIRFLOW_URL` from the runner host.
    Set `AIRFLOW_API_VERSION=v1` for Airflow 2 or leave the default `v2` for
    Airflow 3. Authentication headers and credentials reach curl through stdin,
    never process arguments or the audit log. Use HTTPS or an encrypted tunnel
    when the server is not on loopback.
  env:
    - name: AIRFLOW_URL
      default: http://127.0.0.1:8080
      description: >
        Base URL of the Airflow API server — scheme, host, and port. Each
        action appends its own path (e.g. /api/v2/dags).
      example: https://airflow.internal
    - name: AIRFLOW_API_VERSION
      default: v2
      description: >
        API family: `v1` for Airflow 2.10.4, `v2` for Airflow 3.3.0.
        Selection is explicit; authentication failures never trigger a fallback.
    - name: AIRFLOW_API_TOKEN
      required: false
      description: >
        Airflow 3 API JWT, sent as the Authorization header over curl stdin.
        Unsupported with `AIRFLOW_API_VERSION=v1`.
        Takes precedence over `AIRFLOW_USERNAME`/`AIRFLOW_PASSWORD`. Airflow JWTs
        expire ([api_auth] jwt_expiration_time, 24h by default), so a static
        token suits a short-lived runner; a long-lived one should carry
        credentials instead and let each action mint its own.
    - name: AIRFLOW_USERNAME
      required: false
      description: >
        Dedicated Airflow user. With API v1, enable
        `airflow.api.auth.backend.basic_auth` in `[api] auth_backends` alongside
        `airflow.api.auth.backend.session`, and create a FAB user with
        `airflow users create` (or the FAB user administration UI).
        Assign a role with only the DAG/resource permissions needed; Viewer is
        a starting point for reads, not mutation permission. With API v2, these
        credentials mint a JWT through POST /auth/token when the token is unset.
      example: emisar
    - name: AIRFLOW_PASSWORD
      required: false
      description: >
        Password for `AIRFLOW_USERNAME`. Read from the environment by jq and
        sent as a Basic header for API v1 or posted to /auth/token for API v2
        over curl stdin; never placed in argv.
  notes:
    - "Allowlist configured `AIRFLOW_URL`, `AIRFLOW_API_VERSION`, `AIRFLOW_API_TOKEN`, `AIRFLOW_USERNAME`, and `AIRFLOW_PASSWORD` in the runner's `execution.inherit_env`; otherwise actions cannot see them."
    - "The jobs, assets, asset_events, and backfill actions require Airflow 3 and fail explicitly on Airflow 2. Airflow 2 also rejects last_dag_run_state, filename_pattern, pool_name_pattern, connection_id_pattern, variable_key_pattern, run_type, and task-instance order_by filters. Omit those filters. dag_stats requires explicit dag_ids. Provider limits are applied locally after a bounded response. DAG-run run_after sorting maps to execution_date."
    - "Airflow 2 connection listings do not report whether authentication or extra fields exist, so has_auth and has_extra are null (unknown). Variable is_encrypted is likewise unknown. DAG-run clear returns affected task references on Airflow 2; use dag_run to read the resulting run state."
    - "POST /auth/token is served by the simple auth manager and by the FAB provider's auth manager. A deployment behind an external identity provider that does not expose it needs `AIRFLOW_API_TOKEN` instead."
    - "airflow.connections and airflow.variables deliberately return inventory only — connection extra fields and variable values routinely hold credentials, and no redaction pattern can be trusted to catch every shape. Read a specific value on the host with the operator's own secrets tooling."
    - "airflow.task_log returns whatever the task wrote. Airflow's secrets masker hides known connection and variable values; anything else a task prints reaches the result."
    - "dag_id and dag_run_id accept ~ on the search actions (airflow.dag_runs, airflow.task_instances) to search across every DAG or run — that is how you find every failed task in the fleet in one call."
  verify: airflow.health

actions:
  # Control-plane health
  - actions/health.yaml
  - actions/version.yaml
  - actions/jobs.yaml
  # DAG inventory
  - actions/dags.yaml
  - actions/dag.yaml
  - actions/dag_details.yaml
  - actions/dag_stats.yaml
  - actions/dag_tasks.yaml
  - actions/import_errors.yaml
  - actions/dag_warnings.yaml
  - actions/providers.yaml
  # Runs and task instances
  - actions/dag_runs.yaml
  - actions/dag_run.yaml
  - actions/task_instances.yaml
  - actions/task_instance.yaml
  - actions/task_log.yaml
  - actions/event_logs.yaml
  # Scheduling resources
  - actions/pools.yaml
  - actions/connections.yaml
  - actions/variables.yaml
  - actions/assets.yaml
  - actions/asset_events.yaml
  - actions/backfills.yaml
  # Controls
  - actions/dag_pause.yaml
  - actions/dag_unpause.yaml
  - actions/dag_run_trigger.yaml
  - actions/dag_run_set_state.yaml
  - actions/dag_run_clear_preview.yaml
  - actions/dag_run_clear.yaml
  - actions/task_instances_clear_preview.yaml
  - actions/task_instances_clear.yaml
  - actions/task_instance_set_state.yaml
  - actions/dag_run_delete.yaml
  - actions/pool_set_slots.yaml
  - actions/backfill_create.yaml
  - actions/backfill_pause.yaml
  - actions/backfill_cancel.yaml
