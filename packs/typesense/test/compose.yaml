services:
  typesense:
    image: typesense/typesense:${PACKTEST_VERSION:-29.0}${PACKTEST_DIGEST-}
    command: ["--data-dir=/data", "--api-key=packtest-canary-typesense-09ae", "--listen-port=8108"]
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '\"ok\":true' <&3"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 20

volumes:
  typesense_data:
