schema_version: 1
id: typesense.slow_requests
title: Recent slow requests from the server log
kind: exec
risk: low
description: >
  Tail slow requests from the Typesense server log — slow requests are written to the
  server log prefixed "SLOW REQUEST" (enable with
  --log-slow-requests-time-ms). This greps the log for those lines and tails
  the most recent ones. Read-only.
side_effects:
  - Reads the Typesense server log file.
  - Read-only.
search_terms:
  - slow queries
args:
  - name: log_path
    type: string
    required: false
    default: /var/log/typesense/typesense.log
    description: Typesense server log path.
    validation:
      pattern: '^/var/log/typesense/[A-Za-z0-9._/-]{1,128}$'
      # Scoped to Typesense's own log dir, not all of /var/log — a service pack
      # grants what its name implies. The pattern is lexical shape only; this
      # prefix is what runs the runner's Clean+EvalSymlinks containment. A host
      # that keeps its logs elsewhere symlinks the dir here: allow-rules are
      # symlink-resolved too, so containment still holds. All of /var/log is
      # available deliberately, under linux-core, whose name says so.
      allowed_prefixes:
        - /var/log/typesense
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many recent slow-request lines.
    validation:
      min: 1
      max: 5000
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The pipeline exits with tail's status, so guard the log first — otherwise
      # a missing file reports success with no output, reading as "nothing slow".
      - |
        [ -r "$1" ] || { echo "server log not readable: $1" >&2; exit 1; }
        grep -F 'SLOW REQUEST' "$1" | tail -n {{ args.lines }}
      - "emisar"
      - "{{ args.log_path }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Last 100 slow requests
    args: {}
