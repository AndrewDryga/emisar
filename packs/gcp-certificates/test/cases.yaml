services: [gcp-api]
versions:
  - version: 583.0.0-slim
    digest: "@sha256:87eaf69da735ab8dfc1c640df1e85a467a4feedf2256d35dad368f970d9cd35f"
    default: true
secret_env: [CLOUDSDK_AUTH_ACCESS_TOKEN]
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_CERTIFICATEMANAGER: http://gcp-api:8080/
  CLOUDSDK_API_ENDPOINT_OVERRIDES_COMPUTE: http://gcp-api:8080/compute/v1/
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-gcp-access-token-1a6d
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains: [packtest-canary-gcp-certificate-secret-1f4b]
cases:
  - action: gcp.ssl_certificates
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-legacy-cert, example.test, ACTIVE]
  - action: gcp.ssl_certificate_describe
    args: {project: example-prod, certificate: harness-legacy-cert, scope: global}
    expect:
      stdout_contains: [harness-legacy-cert, example.test, ACTIVE]
  - action: gcp.managed_certificates
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-managed-cert, example.test, ACTIVE]
  - action: gcp.managed_certificate_describe
    args: {project: example-prod, certificate: harness-managed-cert}
    expect:
      stdout_contains: [harness-managed-cert, example.test, ACTIVE]
  - action: gcp.certificate_maps
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-map, harness-https]
  - action: gcp.certificate_map_entries
    args: {project: example-prod, map: harness-map}
    expect:
      stdout_contains: [harness-entry, example.test, harness-managed-cert]
  - action: gcp.dns_authorizations
    args: {project: example-prod}
    expect:
      stdout_contains: [harness-authorization, _acme-challenge.example.test, validation.example.test]
