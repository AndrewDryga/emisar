! FRR config for this pack's SUT. Goal: every read returns real rows, and the
! drain has a neighbor to shut.
!
! dum0 carries the router-id and the advertised subnet (entrypoint.sh creates
! it). The two neighbors never establish — nothing answers 10.0.0.2/10.0.0.3 —
! which is exactly a real "is the session up?" read: the rows exist with their
! remote-AS and address, and PfxSnt is what the drain changes.
frr defaults traditional
log syslog informational
!
interface dum0
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.3 remote-as 65000
 address-family ipv4 unicast
  network 10.0.1.0/24
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
 exit-address-family
exit
!
ip route 10.0.2.0/24 blackhole
