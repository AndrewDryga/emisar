# The FRR daemons run as PID 1 in their own disposable container and the runner
# drives them over the shared /run/frr VTY sockets — vtysh is a socket client,
# so that is all it needs. The two `high` mutators shut and re-advertise a real
# configured neighbor, and each proves the resulting state with a probe rather
# than the command's own output.
services: [frr]
versions:
  - version: "13-slim"
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
# vtysh's sockets are root:frrvty 0660 and the pack's own host-access recipe is
# "add the service user to frrvty" — an unprivileged runner in a second
# container has no such group, so these run as root. The denial path is what
# packs/frr/test/host_access.yaml proves on a real systemd host.
runner:
  user: root
  reason: >
    vtysh reaches FRR through root:frrvty sockets; a case running as anyone
    else in this container would only ever assert the connection refusal.
cases:
  - action: frr.bgp_summary
    expect:
      stdout_contains: ["10.0.0.2", "65001"]

  - action: frr.bgp_neighbors
    expect:
      stdout_contains: ["BGP neighbor is 10.0.0.2", "remote AS 65001"]

  - action: frr.route_summary
    expect:
      stdout_contains: ["Route Source", "connected"]

  - action: frr.interfaces
    expect:
      stdout_contains: ["dum0", "10.0.0.1"]

  # bfdd is running with no peers configured, which is the answer an operator
  # gets on a healthy node that does not use BFD — and proves the daemon is
  # reachable rather than absent.
  - action: frr.bfd_peers
    expect:
      stdout_contains: ["BFD Peers"]

  - name: frr.bgp-neighbor-shutdown-drains-the-peer
    action: frr.bgp_neighbor_shutdown
    args: {asn: 65000, peer: "10.0.0.2"}
    probes:
      - name: the neighbor is administratively down
        argv: [vtysh, -c, "show bgp neighbor 10.0.0.2"]
        expect:
          stdout_contains: ["Administratively shut down"]
    cleanup:
      - argv: [vtysh, -c, "configure terminal", -c, "router bgp 65000", -c, "no neighbor 10.0.0.2 shutdown"]

  - name: frr.bgp-neighbor-no-shutdown-re-advertises
    action: frr.bgp_neighbor_no_shutdown
    args: {asn: 65000, peer: "10.0.0.2"}
    arrange:
      - argv: [vtysh, -c, "configure terminal", -c, "router bgp 65000", -c, "neighbor 10.0.0.2 shutdown"]
      - argv: [/bin/sh, -c, "vtysh -c 'show bgp neighbor 10.0.0.2' | grep -q 'Administratively shut down'"]
        retry_for: 10s
        retry_every: 200ms
    probes:
      - name: the neighbor is no longer administratively down
        argv: [/bin/sh, -c, "vtysh -c 'show bgp neighbor 10.0.0.2' | grep -c 'Administratively shut down' || true"]
        expect:
          stdout_contains: ["0"]
