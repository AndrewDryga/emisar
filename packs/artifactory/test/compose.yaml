services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:${PACKTEST_VERSION:-7.146.34}${PACKTEST_DIGEST-}
    depends_on:
      artifactory-db:
        condition: service_healthy
    environment:
      # 7.14x refuses to start on the old embedded Derby — PostgreSQL is
      # required — so the fixture carries the same helper database a real
      # install does.
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://artifactory-db:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: packtest-artifactory-db-3c7a
      PACKTEST_ADMIN_PASSWORD: packtest-canary-artifactory-9d4e
    volumes:
      - ${EMISAR_ROOT}/packs/artifactory/test/fixtures/seed.sh:/opt/jfrog/seed.sh:ro
    # bootstrap.creds is the documented way to create the admin user with a
    # known password; access consumes and deletes it on boot, so it must
    # exist before the real entrypoint starts. The seed then arranges the
    # artifact state, and only its marker lets the healthcheck go healthy.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /opt/jfrog/artifactory/var/etc/access
        printf 'admin@*=%s\n' "$${PACKTEST_ADMIN_PASSWORD}" > /opt/jfrog/artifactory/var/etc/access/bootstrap.creds
        chmod 600 /opt/jfrog/artifactory/var/etc/access/bootstrap.creds
        /entrypoint-artifactory.sh &
        artifactory=$$!
        bash /opt/jfrog/seed.sh &
        wait "$$artifactory"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/packtest-seeded &&
          curl -fsS -m 3 http://localhost:8082/artifactory/api/system/ping >/dev/null
      interval: 5s
      start_period: 420s
      start_interval: 2s
      retries: 30

  # The metadata database is a helper, not the product under test, so its
  # version is pinned independently of PACKTEST_VERSION.
  artifactory-db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: packtest-artifactory-db-3c7a
      POSTGRES_DB: artifactory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h \"$$(hostname -i)\" -U artifactory"]
      interval: 5s
      start_period: 60s
      start_interval: 1s
      retries: 20
