schema_version: 1
id: artifactory.license
title: GET /artifactory/api/system/license
kind: script
risk: low
description: >
  Show license type, expiry, and licensed-to (never the license key itself).
side_effects: ["One API call.", "Read-only."]
search_terms:
  - artifactory license expired
args: []
execution:
  script:
    path: scripts/artifactory_api.sh
    interpreter: /bin/sh
  argv:
    - license
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: License
    args: {}
