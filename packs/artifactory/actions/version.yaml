schema_version: 1
id: artifactory.version
title: GET /artifactory/api/system/version
kind: script
risk: low
description: Show Artifactory version, revision, and enabled addons.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  script:
    path: scripts/artifactory_api.sh
    interpreter: /bin/sh
  argv:
    - version
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Version
    args: {}
