schema_version: 1
id: artifactory.file_stats
title: GET /artifactory/api/storage/<repo>/<path>?stats
kind: script
risk: low
description: >
  Show download stats for one artifact — download count, last downloaded
  time, and who downloaded it last.
side_effects: ["One API call.", "Read-only."]
search_terms:
  - is this artifact still used
args:
  - name: repo
    type: string
    required: true
    description: Repository key.
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
  - name: path
    type: string
    required: true
    description: Artifact path within the repository.
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._+/-]{0,254}$"
execution:
  script:
    path: scripts/artifactory_api.sh
    interpreter: /bin/sh
  argv:
    - file-stats
    - "{{ args.repo }}"
    - "{{ args.path }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Download stats
    args:
      repo: libs-release-local
      path: com/example/app/1.0.0/app-1.0.0.jar
