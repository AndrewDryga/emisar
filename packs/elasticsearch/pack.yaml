schema_version: 1

id: elasticsearch
name: Elasticsearch / OpenSearch ops
version: 0.1.20
description: >
  Cluster + index introspection plus narrow mutators (cache_clear,
  force_merge, flush, close_index). Auth via ELASTIC_USER +
  ELASTIC_PASSWORD env vars on the runner host. Does NOT include
  delete_index — too easy to misuse.
vendor: emisar
homepage: https://emisar.dev/packs/elasticsearch

requires:
  os:
    - linux
  binaries:
    - curl
    - bash

# `emisar pack suggest` detection: Elasticsearch runs inside the JVM (the
# process is just `java`, too generic to match), so detect by its HTTP port.
detect:
  binaries:
    - elasticsearch
  processes:
    - elasticsearch
  ports:
    - 9200

setup:
  summary: >
    Each action reaches the cluster at `ELASTIC_URL` with curl. When
    `ELASTIC_USER` is set, `ELASTIC_USER` and `ELASTIC_PASSWORD` become an HTTP
    Basic `Authorization` header piped to curl on stdin, so the credential never
    reaches the command line or a `ps` listing.
  env:
    - name: ELASTIC_URL
      default: http://127.0.0.1:9200
      description: Base URL of the cluster, scheme and port included. Defaults to a local node.
      example: "https://es.internal:9200"
    - name: ELASTIC_USER
      description: Username for HTTP basic auth; needs privileges for the actions you enable. Leave unset for a cluster with security disabled.
      example: elastic
    - name: ELASTIC_PASSWORD
      description: Password for `ELASTIC_USER`.
  notes:
    - "Create the user in Kibana under Stack Management → Security → Users, or with bin/elasticsearch-users useradd on a self-managed node. The reads need the monitor cluster privilege plus read on the target indices."
    - "Whichever of these you set must also be allowlisted in the runner's `inherit_env` — the action env is scrubbed to PATH/LANG/LC_ALL/TERM by default, so a variable present on the host but not inherited is silently dropped."
    - "A cluster without security enabled needs no placeholder credential: leave `ELASTIC_USER` unset and no `Authorization` header is sent."
    - Mutators (cache_clear, force_merge, flush, close_index) need a role with manage privileges on the target indices.
  verify: es.cluster_health

actions:
  # Cluster
  - actions/cluster_health.yaml
  - actions/cluster_settings.yaml
  - actions/cluster_allocation_explain.yaml
  - actions/pending_tasks.yaml
  # _cat
  - actions/cat_nodes.yaml
  - actions/cat_indices.yaml
  - actions/cat_shards.yaml
  - actions/cat_aliases.yaml
  - actions/cat_thread_pool.yaml
  - actions/cat_recovery.yaml
  - actions/cat_segments.yaml
  # Index introspection
  - actions/index_settings.yaml
  - actions/index_stats.yaml
  - actions/index_mapping.yaml
  - actions/index_count.yaml
  # Snapshots
  - actions/snapshot_list.yaml
  - actions/snapshot_status.yaml
  # Mutators
  - actions/cache_clear.yaml
  - actions/force_merge.yaml
  - actions/flush.yaml
  - actions/close_index.yaml
