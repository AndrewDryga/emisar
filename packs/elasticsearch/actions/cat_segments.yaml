kind: script
risk: low
description: Show per-segment doc + bytes counts. Use to plan a force_merge.
side_effects:
  - One GET request.
  - Read-only.
args: []
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [cat-segments]
  timeout: 30s
