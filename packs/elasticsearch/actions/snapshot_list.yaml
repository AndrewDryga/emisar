schema_version: 1
id: es.snapshot_list
title: GET /_snapshot/<repo>/_all
kind: exec
risk: low
description: List snapshots in one repository.
side_effects:
  - One GET request.
  - Read-only.
args:
  - name: repository
    type: string
    required: true
    description: Snapshot repository.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,128}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "{ printf 'Authorization: Basic '; printf '%s:%s' \"$ELASTIC_USER\" \"$ELASTIC_PASSWORD\" | base64 | tr -d '\\n'; printf '\\n'; } | curl -fsS -H @- \"${ELASTIC_URL:-http://127.0.0.1:9200}/_snapshot/${1}/_all?pretty\""
      - "emisar"
      - "{{ args.repository }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Snapshots in 's3-backup'
    args:
      repository: "s3-backup"
