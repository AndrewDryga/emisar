schema_version: 1
id: es.cat_indices
title: GET /_cat/indices
kind: script
risk: low
description: List every index with its primary count, doc count, store size. Sorted by size descending.
side_effects:
  - One GET request.
  - Read-only.
args: []
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [cat-indices]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: All indices
    args: {}
