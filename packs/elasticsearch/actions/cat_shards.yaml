schema_version: 1
id: es.cat_shards
title: GET /_cat/shards
kind: script
risk: low
description: List every shard with state (STARTED/UNASSIGNED/INITIALIZING/RELOCATING) and node. Sorted by store size.
side_effects:
  - One GET request.
  - Read-only.
args: []
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [cat-shards]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: All shards
    args: {}
