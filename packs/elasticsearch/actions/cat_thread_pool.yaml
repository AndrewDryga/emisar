schema_version: 1
id: es.cat_thread_pool
title: GET /_cat/thread_pool
kind: script
risk: low
description: Show per-node thread pool queue + rejection counts. Use to spot search/write thread saturation.
side_effects:
  - One GET request.
  - Read-only.
args: []
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [cat-thread-pool]
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Thread pools
    args: {}
