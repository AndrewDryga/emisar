schema_version: 1
id: es.index_stats
title: GET /<index>/_stats
kind: script
risk: low
description: Show index-level stats — docs, store, indexing/search rates, fielddata.
side_effects:
  - One GET request.
  - Read-only.
args:
  - name: index
    type: string
    required: true
    description: Index name.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,255}$"
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [index-stats, "{{ args.index }}"]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Stats for one index
    args:
      index: "logs-2026-06-01"
