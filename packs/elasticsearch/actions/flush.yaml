schema_version: 1
id: es.flush
title: POST /<index>/_flush (flush index)
kind: script
risk: medium
description: >
  Flush the index — forces a Lucene commit so the translog is cleared, which
  speeds recovery if a shard later restarts. (Looking for synced flush? That
  API was removed in ES 8.0; a normal flush gives the same recovery benefit.)
side_effects:
  - Brief pause to write segments to disk.
args:
  - name: index
    type: string
    required: true
    description: Index name.
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,255}$"
execution:
  script: {path: scripts/es_api.sh, interpreter: /bin/bash}
  argv: [flush, "{{ args.index }}"]
  timeout: 5m
output:
  parser: json
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Flush an index
    args:
      index: "logs-2026-06-01"
