services: [elasticsearch]
versions:
  - version: "9.4.4"
    digest: "@sha256:a3545404e436e348721786bed638042a81f2181ebe2e2636501bb43940677747"
    default: true
secret_env: [ELASTIC_PASSWORD]
env:
  ELASTIC_PASSWORD: packtest-canary-elasticsearch-5a28
  ELASTIC_URL: "http://elasticsearch:9200"
  ELASTIC_USER: elastic
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: es.cat_aliases
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null && curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X POST "$ELASTIC_URL/_aliases" -d "{\"actions\":[{\"add\":{\"index\":\"packtest\",\"alias\":\"packtest-ready\"}}]}" >/dev/null']
    expect:
      stdout_contains: [packtest-ready, packtest]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.cat_indices
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: [packtest, open]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.cat_nodes
    expect:
      stdout_contains: [ip, heap.percent]
  - action: es.cat_shards
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: [packtest, STARTED]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.cat_thread_pool
    expect:
      stdout_contains: [node_name, active]
  - action: es.cluster_health
    expect:
      stdout_contains: ['"cluster_name"']
  - name: es.cluster-health-http-error
    action: es.cluster_health
    env:
      ELASTIC_URL: http://elasticsearch:9200/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: es.cluster_settings
    expect:
      stdout_contains: ['"persistent"', '"transient"']
  - action: es.index_count
    args: {index: packtest}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: ['"count":1']
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.index_mapping
    args: {index: packtest}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: [packtest, status, keyword]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.index_settings
    args: {index: packtest}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: [packtest, number_of_shards]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.index_stats
    args: {index: packtest}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: [packtest, primaries, docs]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest" >/dev/null']
  - action: es.pending_tasks
    expect:
      stdout_contains: ['"tasks"']

  # Run these mutations against the live Elasticsearch SUT and probe their
  # resulting state.
  - action: es.close_index
    args: {index: packtest-close}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest-close/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: ['"acknowledged"', "true"]
    probes:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" "$ELASTIC_URL/_cat/indices/packtest-close?h=status"']
        expect:
          stdout_contains: [close]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest-close" >/dev/null']

  - action: es.force_merge
    args: {index: packtest-merge, max_segments: 1}
    arrange:
      # Two refreshes make two segments, so merging to one is observable.
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest-merge/_doc/1?refresh=true" -d "{\"n\":1}" >/dev/null && curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest-merge/_doc/2?refresh=true" -d "{\"n\":2}" >/dev/null']
    expect:
      stdout_contains: ['"successful"']
    probes:
      - argv: [/bin/sh, -c, 'echo "segments=$(curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" "$ELASTIC_URL/_cat/segments/packtest-merge?h=segment" | grep -c .)"']
        expect:
          stdout_contains: ["segments=1"]
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest-merge" >/dev/null']

  - action: es.cache_clear
    args: {index: packtest-cache}
    arrange:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -H "Content-Type: application/json" -X PUT "$ELASTIC_URL/packtest-cache/_doc/1?refresh=true" -d "{\"status\":\"ready\"}" >/dev/null']
    expect:
      stdout_contains: ['"successful"', '"failed":0']
    probes:
      # The observable state: the index answers queries after its caches drop.
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" "$ELASTIC_URL/packtest-cache/_count"']
        expect:
          stdout_contains: ['"count":1']
    cleanup:
      - argv: [/bin/sh, -c, 'curl -fsS -u "$ELASTIC_USER:$ELASTIC_PASSWORD" -X DELETE "$ELASTIC_URL/packtest-cache" >/dev/null']
