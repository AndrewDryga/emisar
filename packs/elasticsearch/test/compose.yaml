services:
  elasticsearch:
    image: ${PACKTEST_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:${PACKTEST_VERSION:-9.4.4}${PACKTEST_DIGEST-}}
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
      # Elasticsearch sizes its heap from visible memory, which on a CI runner
      # means it reserves more than the box has left and gets OOM-killed
      # (exit 137) before the first case runs. A read-only single node serving
      # a handful of test documents needs a fraction of that; cassandra pins
      # its heap for the same reason.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: {soft: -1, hard: -1}
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9200/_cluster/health"]
      interval: 10s
      start_period: 120s
      start_interval: 1s
      retries: 20
