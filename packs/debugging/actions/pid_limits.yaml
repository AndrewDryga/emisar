schema_version: 1

id: debugging.pid_limits
title: Resource limits applied to a PID
kind: exec
risk: low

description: >
  Read /proc/<pid>/limits — every ulimit applied (open files,
  stack size, NPROC, memlock, msgqueue, niceness). Use to confirm
  whether a process is actually getting the higher limits its
  service file requested.

side_effects:
  - One /proc read.
  - Read-only.

search_terms:
  - ulimit for a process
  - hit a resource limit

args:
  - name: pid
    type: integer
    required: true
    description: PID to inspect.
    validation:
      min: 1
      max: 4194304

execution:
  command:
    binary: cat
    argv:
      - "/proc/{{ args.pid }}/limits"
  # Twin of elixir-beam's `beam.process_limits`, which reads the same
  # /proc/<pid>/limits. This copy keeps a tight 5s/8 KiB envelope for a generic
  # host pid; the BEAM copy runs wider (15s/16 KiB) because it is reached during
  # a live node investigation where the process table is larger. Keep them in
  # sync when the read itself changes.
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 4096

examples:
  - title: Limits for PID 4321
    args:
      pid: 4321
