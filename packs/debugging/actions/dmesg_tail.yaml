schema_version: 1

id: debugging.dmesg_tail
title: Recent kernel messages
kind: script
# Raw kernel ring-buffer lines, up to 5000 of them, and the fallback path IS
# `journalctl -k` — the same content linux.journalctl serves at medium.
risk: medium

description: >
  Return the last N kernel log lines. Surfaces OOM kills, hardware
  errors, network link flaps, and dropped packets. Reads the kernel ring
  buffer via dmesg; when that is not permitted (modern kernels gate it
  behind CAP_SYSLOG) it falls back to `journalctl -k`, which works when
  the runner can read the journal (root, or a member of systemd-journal /
  adm). Read-only.

side_effects:
  - One dmesg (or journalctl -k) invocation.
  - Read-only.

args:
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many tail lines.
    validation:
      min: 1
      max: 5000

execution:
  script:
    path: scripts/dmesg_read.sh
    interpreter: /bin/sh
  argv: [tail, "{{ args.lines }}"]
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 16384

examples:
  - title: Last 100 kernel log lines
    args: {}
