schema_version: 1

id: debugging.slabtop
title: Kernel slab cache top consumers
kind: exec
risk: low

description: >
  `slabtop -o -s c | head -40` — top 40 kernel slab caches by cache
  size. Use when /proc/meminfo shows high `Slab` but no userland
  process accounts for the memory. dentry / inode pressure is the
  usual answer.

side_effects:
  - One slabtop invocation.
  - Read-only.

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # A pipeline exits with head's status, so slabtop failing — /proc/slabinfo
      # is protected by file permissions and the runner is non-root by default,
      # and the binary is
      # absent on a slim host — recorded a SUCCESSFUL read with empty stdout.
      # "No slab pressure" and "I could not look" must not be the same answer.
      - "out=$(slabtop -o -s c 2>&1); status=$?; printf '%s\\n' \"$out\" | head -40; exit $status"
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192

examples:
  - title: Top kernel slab caches
    args: {}
