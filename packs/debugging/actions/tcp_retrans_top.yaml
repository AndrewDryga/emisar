schema_version: 1

id: debugging.tcp_retrans_top
title: TCP connections with retransmits
kind: script
risk: low

description: >
  List up to 50 established TCP sockets ranked by lifetime retransmit total
  from `ss -tnpi state established`. Return total/current counters, local and
  peer endpoints, and process ownership when permitted. Sockets with no
  retransmits are omitted. Read-only.

side_effects:
  - One ss invocation.
  - Read-only.

search_terms:
  - retransmissions
  - packet loss

args: []

execution:
  script:
    path: scripts/tcp_retrans_top.sh
    interpreter: /bin/sh
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Top retransmitting flows
    args: {}
