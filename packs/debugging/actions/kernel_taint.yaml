schema_version: 1

id: debugging.kernel_taint
title: Kernel taint state
kind: exec
risk: low

description: >
  Reads /proc/sys/kernel/tainted. A non-zero value means a binary
  module, a proprietary driver, or a kernel crash has compromised
  the integrity of the running kernel. The number is a bitmask;
  this action returns both the raw value and the decoded flags.

side_effects:
  - Two /proc reads.
  - Read-only.

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # `cat … | head` always exited 0, so the `||` notice was dead code and an
      # absent doc left the flags silently undecoded. The doc is optional, so
      # test for it and say so — never fail the taint read itself.
      - |
        echo "tainted: $(cat /proc/sys/kernel/tainted)"
        doc=/usr/share/doc/linux-doc/admin-guide/tainted-kernels.rst
        if [ -r "$doc" ]; then head -50 "$doc"; else echo 'flags doc not installed'; fi
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 4096

examples:
  - title: Is the kernel tainted?
    args: {}
