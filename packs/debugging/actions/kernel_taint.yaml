schema_version: 1

id: debugging.kernel_taint
title: Kernel taint state
kind: script
risk: low

description: >
  Read /proc/sys/kernel/tainted and decode its diagnostic bitmask without
  installed kernel documentation. Return the raw value and set flag letters
  for bits 0–19, or "unknown bit N" for newer flags. Zero means not tainted;
  nonzero records events such as warnings, external modules or live patching,
  not necessarily a current kernel failure. Read-only.

side_effects:
  - One /proc read.
  - Read-only.

search_terms:
  - tainted kernel
  - unsupported module loaded

args: []

execution:
  script:
    path: scripts/kernel_taint.sh
    interpreter: /bin/sh
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 4096

examples:
  - title: Is the kernel tainted?
    args: {}
