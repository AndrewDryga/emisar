schema_version: 1

id: debugging.top_open_files
title: Top processes by open-file count
kind: exec
risk: low

description: >
  Aggregate `lsof` by PID and return the top 20 PIDs holding the
  most file descriptors. Use to find FD-leak candidates before
  EMFILE breaks something. Unless the runner runs as root it sees only
  its own user's processes, so the ranking is scoped to those. Read-only.

side_effects:
  - One lsof invocation.
  - Read-only; may be slow on large systems.

search_terms:
  - too many open files

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # lsof prints one permission line PER process it cannot inspect, which on
      # a busy host buries the answer. That is per-item noise, not the reason the
      # command failed: lsof still exits non-zero when it cannot run at all, and
      # the pipeline is guarded by that below.
      - |
        lsof -F p 2>/dev/null | sort | uniq -c | sort -rn | head -20
        exit ${PIPESTATUS:-0}
  timeout: 30s

output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 16384

examples:
  - title: Top 20 PIDs by FD count
    args: {}
