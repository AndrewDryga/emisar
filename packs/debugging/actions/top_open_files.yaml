schema_version: 1

id: debugging.top_open_files
title: Top processes by open-file count
kind: script
risk: low

description: >
  Count `/proc/<pid>/fd` entries and return the top 20 readable processes.
  This reads directory entries without resolving every descriptor target, so
  a process with tens of thousands of sockets does not turn the diagnostic
  into another global lsof crawl. Use debugging.pid_fd_summary on a candidate
  to compare its count with its own open-files limit. Without the
  process-inspection host-access recipe it sees only permitted processes. Do
  not retry an unchanged timeout; use the targeted summary when you already
  know the PID. Read-only.

side_effects:
  - One bounded pass over readable /proc process FD directories.
  - Read-only; descriptor targets are not resolved.

search_terms:
  - too many open files

args: []

execution:
  script:
    path: scripts/open_files.sh
    interpreter: /bin/sh
  argv: [top]
  timeout: 20s

output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 16384

examples:
  - title: Top 20 PIDs by FD count
    args: {}
