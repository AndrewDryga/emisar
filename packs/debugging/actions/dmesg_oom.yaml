schema_version: 1

id: debugging.dmesg_oom
title: OOM-kill events from dmesg
kind: script
# Stays low where its dmesg_tail sibling is medium: this is a projection, not a
# raw read — 30 lines matched on the OOM vocabulary, never arbitrary log text.
risk: low

description: >
  Filter dmesg for OOM-killer events and return the last 30 matching
  kernel log lines, which show process id, name, RSS, and OOM score for
  the most recent kills. The "why did mysqld vanish?" answer. Falls back
  to `journalctl -k` when dmesg is not permitted (needs CAP_SYSLOG / root,
  or journal read access via systemd-journal / adm); the fallback searches
  the latest 10,000 kernel messages. Read-only.

side_effects:
  - One dmesg (or journalctl -k) invocation.
  - Read-only.

search_terms:
  - out of memory
  - process disappeared

args: []

execution:
  script:
    path: scripts/dmesg_read.sh
    interpreter: /bin/sh
  argv: [oom, "10000"]
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Recent OOM kills
    args: {}
