schema_version: 1

id: debugging.dmesg_oom
title: OOM-kill events from dmesg
kind: exec
risk: low

description: >
  Filter dmesg for OOM-killer events. Returns the kernel log lines
  showing process id, name, RSS, and OOM score for every killed
  process. The "why did mysqld vanish?" answer. Falls back to
  `journalctl -k` when dmesg is not permitted (needs CAP_SYSLOG / root,
  or journal read access via systemd-journal / adm). Read-only.

side_effects:
  - One dmesg (or journalctl -k) invocation.
  - Read-only.

search_terms:
  - out of memory
  - process disappeared

args: []

execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # The suppressed stderr is dmesg's "Operation not permitted" on a host with
      # restricted dmesg (kernel.dmesg_restrict=1). That is the PROBE failing, and
      # the `||` is what handles it — journalctl runs instead and reports its own
      # errors normally. Nothing is hidden: if both sources fail, journalctl's
      # stderr surfaces and the pipeline reports it.
      - "{ dmesg -T 2>/dev/null || journalctl -k --no-pager; } | grep -i -E 'oom|killed process|out of memory' | tail -30"
  timeout: 15s

output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192

examples:
  - title: Recent OOM kills
    args: {}
