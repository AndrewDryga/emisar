schema_version: 1

id: debugging.pid_status
title: Process status block
kind: exec
risk: low

description: >
  Show `/proc/<pid>/status` for one process — uid/gid, capability set, signal
  masks, RSS and peak RSS, voluntary and involuntary context switches, and OOM
  score. More detail than `ps` for one PID.
side_effects:
  - One /proc read.
  - Read-only.

search_terms:
  - process capabilities
  - oom score
args:
  - name: pid
    type: integer
    required: true
    description: PID to inspect.
    validation:
      min: 1
      max: 4194304

execution:
  # The execution contract AND the operator-facing copy match forensics.pid_status —
  # same command, deadline, caps, and words, whichever pack the
  # operator installed.
  command:
    binary: cat
    argv:
      - "/proc/{{ args.pid }}/status"
  timeout: 5s

output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 4096

examples:
  - title: PID 1
    args:
      pid: 1
