schema_version: 1

id: debugging
name: Linux debugging toolkit
version: 0.2.23
retired_below: 0.2.14
description: >
  General-purpose Linux diagnostics + low-level remediation: process
  and memory tops, vmstat/iostat snapshots, socket inventories,
  per-PID inspection, kernel-state checks, network reachability, plus
  fix-it actions (drop_caches, kill_pid by signal, sysctl_set).
  Use as the first-touch pack when something is wrong.
vendor: emisar
homepage: https://emisar.dev/packs/debugging

requires:
  os:
    - linux
  binaries:
    - ps
    - ss

setup:
  summary: >
    Operates on the local runner host — no credentials needed.
  notes:
    - "Basic diagnostics such as vmstat, loadavg, and host-permitted process reads work unprivileged. Protected process, network, and kernel state is mapped below."
    - Apply every host-access recipe that covers an action you enable. The recipes are additive and remove the retired blanket-root drop-in when first applied.
  host_access:
    - actions:
        - debugging.netstat_listen
        - debugging.lsof_port
        - debugging.top_open_files
        - debugging.pid_context
        - debugging.pid_env_keys
        - debugging.pid_connections
        - debugging.pid_argv
        - debugging.pid_environ
        - debugging.pid_cwd
        - debugging.pid_fds
        - debugging.pid_fd_summary
        - debugging.pid_status
        - debugging.pid_threads
        - debugging.pid_limits
        - debugging.pid_io
        - debugging.tcp_retrans_top
      requirement: Inspect protected process state owned by other users.
      recipes:
        - name: Grant process-inspection capabilities to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH' | sudo tee /etc/systemd/system/emisar.service.d/20-debugging-process-inspection.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_sys_ptrace"
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_dac_read_search"
          impact: >
            Every Emisar action on this runner can inspect, attach to, and modify
            processes outside the runner user, including their arguments,
            environments, file descriptors, memory-related metadata, and secrets,
            and bypass host file read and directory search permissions.
    - actions:
        - debugging.slabtop
      requirement: Read protected kernel slab metadata from /proc/slabinfo.
      recipes:
        - name: Grant protected-file read access to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_DAC_READ_SEARCH' | sudo tee /etc/systemd/system/emisar.service.d/21-debugging-kernel-files.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_dac_read_search"
          impact: >
            Every Emisar action on this runner can bypass file read and directory
            search permissions across the host, including files unrelated to slab
            diagnostics.
    - actions:
        - debugging.dmesg_tail
        - debugging.dmesg_oom
      requirement: Read the protected kernel message ring buffer.
      recipes:
        - name: Grant kernel-log access to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_SYSLOG' | sudo tee /etc/systemd/system/emisar.service.d/22-debugging-kernel-log.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_syslog"
          impact: >
            Every Emisar action on this runner can read or clear the host kernel
            message ring buffer, change console logging, and view restricted kernel
            addresses. Kernel logs may contain device, process, address, and failure
            details.
    - actions:
        - debugging.kill_pid
      requirement: Signal processes owned by other users.
      recipes:
        - name: Grant process-signalling access to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_KILL' | sudo tee /etc/systemd/system/emisar.service.d/23-debugging-process-signal.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_kill"
          impact: >
            Every Emisar action on this runner can signal processes owned by other
            users, including terminating or force-killing them.
    - actions:
        - debugging.ping_host
      requirement: Open ICMP sockets where the host has a closed ping group range.
      recipes:
        - name: Grant raw-socket access to the Emisar service
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'AmbientCapabilities=CAP_NET_RAW' | sudo tee /etc/systemd/system/emisar.service.d/24-debugging-network.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "systemctl show emisar --property=AmbientCapabilities --value | grep -Fwi cap_net_raw"
          impact: >
            Every Emisar action on this runner can open raw sockets, including
            sending crafted packets and reading traffic on this host's interfaces.
    - actions:
        - debugging.pid_stack
        - debugging.drop_caches
        - debugging.sysctl_set
      requirement: Read privileged kernel stacks or change protected kernel state.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "sudo rm -f /etc/systemd/system/emisar.service.d/10-debugging-host-access.conf"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/30-debugging-root.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. Debug actions can read other
            processes' arguments and environments, kill processes, and change kernel settings.
  verify: debugging.loadavg

actions:
  # Process tops
  - actions/processes_top.yaml
  - actions/mem_top.yaml
  # System samples
  - actions/vmstat.yaml
  - actions/iostat.yaml
  - actions/sar_recent.yaml
  - actions/loadavg.yaml
  - actions/disk_free.yaml
  # Network state
  - actions/netstat_listen.yaml
  - actions/netstat_connections.yaml
  - actions/lsof_port.yaml
  - actions/tcp_summary.yaml
  - actions/tcp_retrans_top.yaml
  - actions/socket_summary.yaml
  - actions/top_open_files.yaml
  # Per-PID introspection
  - actions/pid_context.yaml
  - actions/pid_env_keys.yaml
  - actions/pid_connections.yaml
  - actions/pid_argv.yaml
  - actions/pid_environ.yaml
  - actions/pid_cwd.yaml
  - actions/pid_fds.yaml
  - actions/pid_fd_summary.yaml
  - actions/pid_status.yaml
  - actions/pid_stack.yaml
  - actions/pid_threads.yaml
  - actions/pid_limits.yaml
  - actions/pid_io.yaml
  # Kernel state
  - actions/dmesg_tail.yaml
  - actions/dmesg_oom.yaml
  - actions/kernel_taint.yaml
  - actions/slabtop.yaml
  - actions/swap_status.yaml
  # Reachability
  - actions/ping_host.yaml
  # Mutators
  - actions/drop_caches.yaml
  - actions/kill_pid.yaml
  - actions/sysctl_set.yaml
