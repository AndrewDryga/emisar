# Two different reasons, kept apart on purpose. drop_caches and sysctl_set
# reach kernel state a container SHARES with its host, so even a privileged
# lane would mutate the CI machine — these stay uncovered by choice. kill_pid
# and pid_environ only need a target process in the same PID namespace, which
# a SUT can provide; they are declared because that lane is not built.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    debugging.drop_caches: requires_privileged_host
    debugging.kill_pid: requires_privileged_host
    debugging.pid_environ: requires_privileged_host
    debugging.sysctl_set: requires_privileged_host
