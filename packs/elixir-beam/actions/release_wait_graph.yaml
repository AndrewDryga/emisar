schema_version: 1
id: beam.release_wait_graph
title: Elixir release wait graph
kind: script
risk: low
description: >
  Show which BEAM processes are blocked in a GenServer call and what they wait on:
  the targets with the most waiters, what each target is doing, and any deadlock
  cycles, with no limit on their length. A caller holding exactly one monitor gives
  an edge. A caller holding several, or a process in Task.await, is listed with its
  candidates and counts toward no target or cycle, because monitors do not say
  which one it waits for, so a cycle through such a process does not appear.
side_effects:
  - Resolves the target release from running BEAM processes (reads /proc; docker exec when container is set).
  - One release rpc call with a fixed expression, at low priority, stopped on the node at its deadline or heap limit.
  - Reads the current function of every process, and the monitors of the blocked ones. Waits 200 ms to confirm a cycle.
  - Read-only.
search_terms:
  - deadlock
  - genserver call timeout
  - genserver bottleneck
  - calls are hanging
  - who is waiting on whom
args:
  - name: limit
    type: integer
    required: false
    default: 25
    description: Maximum targets and maximum uncertain waiters to list. Cycles are always listed in full.
    validation:
      min: 1
      max: 200
  - name: container
    type: string
    required: false
    default: ""
    description: Docker container name or ID when the release runs inside a container (see beam.release_targets); omit for a release running directly on the host.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"
      max_length: 128
  - name: release
    type: string
    required: false
    default: ""
    description: Release name when several Elixir releases run on the target (see beam.release_targets); omit when only one runs or ELIXIR_RELEASE_CTL pins the target.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,63})?$"
      max_length: 64
execution:
  script:
    path: scripts/release_ctl.sh
    interpreter: /bin/bash
  argv:
    - "--mode"
    - "wait_graph"
    - "--limit"
    - "{{ args.limit }}"
    - "--container"
    - "{{ args.container }}"
    - "--release"
    - "{{ args.release }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Who waits on whom
    args: {}
