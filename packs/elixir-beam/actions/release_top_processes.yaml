schema_version: 1
id: beam.release_top_processes
title: Elixir release top BEAM processes
kind: script
risk: low
description: >
  List top BEAM processes in the running release by memory, mailbox length,
  binary memory, heap size, or the work done over a sampling window, and show
  what each unnamed process runs. A single read shows how much, not how fast, so
  reductions are always sampled, and window_ms ranks any other metric by how much
  it changed. Sorting by memory or binary_memory costs the most on a node with
  many processes; reductions and message_queue_len are the cheap scans.
side_effects:
  - Resolves the target release from running BEAM processes (reads /proc; docker exec when container is set).
  - One release rpc call with a fixed expression, at low priority, stopped on the node at its deadline or heap limit.
  - Scans every process once, or twice with a window, and reads details only for the rows it returns.
  - Reads only the $initial_call and $ancestors entries of a process dictionary, and never mailbox contents or process state.
  - binary_memory counts a shared binary for every process holding it, and forces no garbage collection.
  - Read-only.
search_terms:
  - message queue backlog
  - mailbox growing
  - busiest processes
  - which process is burning cpu
  - process memory growing
  - who holds binaries
args:
  - name: limit
    type: integer
    required: false
    default: 25
    description: Maximum processes to return.
    validation:
      min: 1
      max: 100
  - name: sort_by
    type: string
    required: false
    default: memory
    description: Process metric to sort by.
    validation:
      enum:
        - memory
        - message_queue_len
        - reductions
        - total_heap_size
        - binary_memory
  - name: window_ms
    type: integer
    required: false
    default: 0
    description: Sample twice this many milliseconds apart and rank by the difference. 0 ranks by the current value, except reductions, which is a lifetime counter and samples for 1000 ms. The maximum leaves room in the action's 20s timeout for both scans.
    validation:
      min: 0
      max: 10000
  - name: container
    type: string
    required: false
    default: ""
    description: Docker container name or ID when the release runs inside a container (see beam.release_targets); omit for a release running directly on the host.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"
      max_length: 128
  - name: release
    type: string
    required: false
    default: ""
    description: Release name when several Elixir releases run on the target (see beam.release_targets); omit when only one runs or ELIXIR_RELEASE_CTL pins the target.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,63})?$"
      max_length: 64
execution:
  script:
    path: scripts/release_ctl.sh
    interpreter: /bin/bash
  argv:
    - "--mode"
    - "top_processes"
    - "--limit"
    - "{{ args.limit }}"
    - "--sort-by"
    - "{{ args.sort_by }}"
    - "--window-ms"
    - "{{ args.window_ms }}"
    - "--container"
    - "{{ args.container }}"
    - "--release"
    - "{{ args.release }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: What is burning CPU now
    args:
      limit: 10
      sort_by: reductions
  - title: What is growing, over 5 seconds
    args:
      limit: 10
      sort_by: memory
      window_ms: 5000
  - title: Top processes by memory
    args:
      limit: 25
      sort_by: memory
  - title: Top processes by mailbox length
    args:
      limit: 25
      sort_by: message_queue_len
