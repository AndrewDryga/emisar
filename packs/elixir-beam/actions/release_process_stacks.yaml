schema_version: 1
id: beam.release_process_stacks
title: Elixir release process stack samples
kind: script
risk: low
description: >
  Sample where one BEAM process is, repeatedly, and show the stacks it was seen in
  most often with how many samples were running or waiting. Find which call a busy
  or stuck GenServer is in, without tracing. A sample counts a blocked process the
  same as a running one, so this shows where time passes, not CPU use.
side_effects:
  - Resolves the target release from running BEAM processes (reads /proc; docker exec when container is set).
  - One release rpc call with a fixed expression, at low priority, stopped on the node at its deadline or heap limit.
  - Reads the stack of one process up to samples times, with no tracing.
  - A stack shows function names, arities, and source locations, never arguments.
  - Read-only.
search_terms:
  - which call is slow
  - process is stuck
  - genserver is busy
  - where is it spending time
args:
  - name: erlang_pid
    type: string
    required: true
    description: BEAM PID as the other reads print it, for example "#PID<0.123.0>" or "<0.123.0>".
    validation:
      pattern: "^(#PID)?<[0-9]+\\.[0-9]+\\.[0-9]+>$"
      max_length: 32
  - name: samples
    type: integer
    required: false
    default: 50
    description: Number of stack samples. With interval_ms at its maximum, 200 samples take 10 seconds, which leaves room in the action's 20s timeout.
    validation:
      min: 1
      max: 200
  - name: interval_ms
    type: integer
    required: false
    default: 10
    description: Milliseconds between samples.
    validation:
      min: 1
      max: 50
  - name: container
    type: string
    required: false
    default: ""
    description: Docker container name or ID when the release runs inside a container (see beam.release_targets); omit for a release running directly on the host.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"
      max_length: 128
  - name: release
    type: string
    required: false
    default: ""
    description: Release name when several Elixir releases run on the target (see beam.release_targets); omit when only one runs or ELIXIR_RELEASE_CTL pins the target.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,63})?$"
      max_length: 64
execution:
  script:
    path: scripts/release_ctl.sh
    interpreter: /bin/bash
  argv:
    - "--mode"
    - "process_stacks"
    - "--erlang-pid"
    - "{{ args.erlang_pid }}"
    - "--samples"
    - "{{ args.samples }}"
    - "--interval-ms"
    - "{{ args.interval_ms }}"
    - "--container"
    - "{{ args.container }}"
    - "--release"
    - "{{ args.release }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Half a second of samples
    args:
      erlang_pid: "#PID<0.123.0>"
