schema_version: 1
id: beam.release_mailbox_senders
title: Elixir release mailbox senders
kind: script
risk: high
description: >
  Trace who sends messages to one BEAM process for a bounded window and show the
  senders with their message counts, to find what floods a mailbox. Needs OTP 27 or
  newer, which traces in an isolated session that cannot disturb other tracing. High
  risk because send tracing adds work to every message sent on the node while it
  runs. Sees processes on this node that address the target by pid or registered
  name, and the ports it owns when the trace starts. Messages from other nodes, from
  timers, or through an alias do not appear.
side_effects:
  - Resolves the target release from running BEAM processes (reads /proc; docker exec when container is set).
  - One release rpc call with a fixed expression, stopped on the node at its deadline or heap limit.
  - Turns on send tracing for every process and for the ports the target owns, for up to duration_ms, in an isolated trace session it always destroys.
  - Copies each matching message into a tracer on the node, which keeps only the sender. Message contents are never printed or recorded.
  - Stops early at max_events, or if the tracer falls behind by 1000 messages or its own memory passes 64 MiB.
  - Adds work to every message sent on the node while it runs.
search_terms:
  - who is flooding this mailbox
  - who sends these messages
  - mailbox flood
args:
  - name: erlang_pid
    type: string
    required: true
    description: BEAM PID as the other reads print it, for example "#PID<0.123.0>" or "<0.123.0>".
    validation:
      pattern: "^(#PID)?<[0-9]+\\.[0-9]+\\.[0-9]+>$"
      max_length: 32
  - name: duration_ms
    type: integer
    required: false
    default: 1000
    description: Trace window in milliseconds.
    validation:
      min: 100
      max: 5000
  - name: max_events
    type: integer
    required: false
    default: 10000
    description: Stop tracing after this many messages to the target.
    validation:
      min: 1
      max: 100000
  - name: container
    type: string
    required: false
    default: ""
    description: Docker container name or ID when the release runs inside a container (see beam.release_targets); omit for a release running directly on the host.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"
      max_length: 128
  - name: release
    type: string
    required: false
    default: ""
    description: Release name when several Elixir releases run on the target (see beam.release_targets); omit when only one runs or ELIXIR_RELEASE_CTL pins the target.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,63})?$"
      max_length: 64
execution:
  script:
    path: scripts/release_ctl.sh
    interpreter: /bin/bash
  argv:
    - "--mode"
    - "mailbox_senders"
    - "--erlang-pid"
    - "{{ args.erlang_pid }}"
    - "--duration-ms"
    - "{{ args.duration_ms }}"
    - "--max-events"
    - "{{ args.max_events }}"
    - "--container"
    - "{{ args.container }}"
    - "--release"
    - "{{ args.release }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: One second on a flooded process
    args:
      erlang_pid: "#PID<0.123.0>"
