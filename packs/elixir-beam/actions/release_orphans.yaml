schema_version: 1
id: beam.release_orphans
title: Elixir release orphan processes
kind: script
risk: low
description: >
  List candidate orphan processes in the running Elixir release, largest first:
  processes nothing links to, monitors, or is monitored by, so nothing notices if
  one dies and nothing restarts it. Legitimate processes can match, so each is a
  candidate to look at rather than a fault. The runtime system's own processes are
  left out.
side_effects:
  - Resolves the target release from running BEAM processes (reads /proc; docker exec when container is set).
  - One release rpc call with a fixed expression, at low priority, stopped on the node at its deadline or heap limit.
  - Reads the links, monitors, and memory of every process.
  - Read-only.
search_terms:
  - orphan process
  - unsupervised process
  - process leak
  - process count keeps growing
args:
  - name: limit
    type: integer
    required: false
    default: 25
    description: Maximum candidates to list. The output says how many exist.
    validation:
      min: 1
      max: 200
  - name: container
    type: string
    required: false
    default: ""
    description: Docker container name or ID when the release runs inside a container (see beam.release_targets); omit for a release running directly on the host.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"
      max_length: 128
  - name: release
    type: string
    required: false
    default: ""
    description: Release name when several Elixir releases run on the target (see beam.release_targets); omit when only one runs or ELIXIR_RELEASE_CTL pins the target.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,63})?$"
      max_length: 64
execution:
  script:
    path: scripts/release_ctl.sh
    interpreter: /bin/bash
  argv:
    - "--mode"
    - "orphans"
    - "--limit"
    - "{{ args.limit }}"
    - "--container"
    - "{{ args.container }}"
    - "--release"
    - "{{ args.release }}"
  timeout: 20s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Largest candidates
    args: {}
