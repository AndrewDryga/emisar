        expect:
          stdout_contains: [tracing-is-off]
  # The trace is on a function nothing calls, so only the deadline can end it. The
  # client is killed while the trace runs, and the node must clear it on its own.
  - name: beam.recon_trace_calls-clears-itself-after-the-client-dies
    action: beam.release_runtime
    arrange:
      - argv:
          - /bin/sh
          - -c
          - |
            setsid /bin/bash /packs/elixir-beam/scripts/release_ctl.sh --mode recon_trace_calls --module FixtureApp.Cart --function handle_call --arity 3 --duration-ms 6000 >/dev/null 2>&1 &
            client=$!
            up() { /opt/fixture_app/bin/fixture_app rpc 'if Process.whereis(:recon_trace_tracer), do: IO.puts("up")' | grep -q up; }
            tries=0
            until up; do tries=$((tries + 1)); test "$tries" -lt 25 || exit 1; sleep 0.2; done
            kill -s KILL -- "-$client"
            status=0
            wait "$client" || status=$?
            test "$status" = 137 && up && echo the-trace-outlived-its-client
        expect:
          stdout_contains: [the-trace-outlived-its-client]
    expect:
      stdout_contains: ["otp_release:"]
    probes:
      - argv:
          - /opt/fixture_app/bin/fixture_app
          - rpc
          - |
            flags = :erlang.trace_info(Process.whereis(FixtureApp.Sender), :flags)
            if flags == {:flags, []} and Process.whereis(:recon_trace_tracer) == nil, do: IO.puts("the-trace-cleared-itself")
        expect:
          stdout_contains: [the-trace-cleared-itself]
        retry_for: 12s
        retry_every: 500ms
  - action: beam.recon_trace_clear
    arrange:
      - argv:
          - /bin/sh
          - -c
          - nohup /bin/bash /packs/elixir-beam/scripts/release_ctl.sh --mode recon_trace_calls --module FixtureApp.Cart --function handle_call --arity 3 --duration-ms 10000 >/tmp/call-trace.log 2>&1 &
      - argv: [/opt/fixture_app/bin/fixture_app, rpc, 'if Process.whereis(:recon_trace_tracer), do: IO.puts("call-trace-running")']
        expect:
          stdout_contains: [call-trace-running]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: ["cleared: :ok"]
    probes:
      - argv: [/opt/fixture_app/bin/fixture_app, rpc, 'if Process.whereis(:recon_trace_tracer) == nil, do: IO.puts("call-trace-stopped")']
        expect:
          stdout_contains: [call-trace-stopped]
