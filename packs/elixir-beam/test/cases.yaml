      exit: [1]
      stderr_contains: ["needs OTP 27 or newer"]

  # The traced function's arguments carry a canary, and by default only its arity prints.
  - name: beam.recon_trace_calls-prints-arity-only-by-default
    action: beam.recon_trace_calls
    args: {module: FixtureApp.Sender, function: deliver, arity: 3, max_traces: 3, duration_ms: 1000}
    expect:
      stdout_contains: ["trace_patterns_started: 1", "deliver/3"]
    probes:
      - argv:
          - /opt/fixture_app/bin/fixture_app
          - rpc
          - 'if :erlang.trace_info(Process.whereis(FixtureApp.Sender), :flags) == {:flags, []}, do: IO.puts("tracing-is-off")'
        expect:
          stdout_contains: [tracing-is-off]
