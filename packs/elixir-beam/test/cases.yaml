  # A trace session is isolated, so it neither stops nor is stopped by a call trace.
  - name: beam.release_mailbox_senders-leaves-a-running-call-trace-alone
    action: beam.release_mailbox_senders
    versions: ["1.20.5-otp-29", "1.18.4-otp-27"]
    args: {duration_ms: 300}
    arrange:
      - argv:
          - /bin/sh
          - -c
          - nohup /bin/bash /packs/elixir-beam/scripts/release_ctl.sh --mode recon_trace_calls --module FixtureApp.Cart --function handle_call --arity 3 --duration-ms 10000 >/tmp/call-trace.log 2>&1 &
      - argv: [/opt/fixture_app/bin/fixture_app, rpc, 'if Process.whereis(:recon_trace_tracer), do: IO.puts("call-trace-running")']
        expect:
          stdout_contains: [call-trace-running]
        retry_for: 10s
        retry_every: 250ms
    resolve_args:
      erlang_pid:
        argv: [/opt/fixture_app/bin/fixture_app, rpc, "IO.write(inspect(:persistent_term.get(:fixture_inbox)))"]
    expect:
      stdout_contains: ["registered_name: FixtureApp.Sender"]
    probes:
      - argv:
          - /opt/fixture_app/bin/fixture_app
          - rpc
          - |
            {:flags, flags} = :erlang.trace_info(Process.whereis(FixtureApp.Sender), :flags)
            if Process.whereis(:recon_trace_tracer) && :call in flags, do: IO.puts("call-trace-still-running")
        expect:
          stdout_contains: [call-trace-still-running]
