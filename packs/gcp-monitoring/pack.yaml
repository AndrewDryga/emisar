schema_version: 1

id: gcp-monitoring
name: Google Cloud Logging and Monitoring operations
version: 0.3.0
description: >
  Google Cloud Logging and Monitoring diagnostics plus governed alert
  control: bounded log discovery and queries, metric queries, metric
  descriptors, Cloud Interconnect attachment utilization, and alert-policy
  reads, and enable or disable of one exact alert policy. Logging and metric
  reads plus the alert-policy mutations use stable Google Cloud REST APIs —
  the mutations patch only the policy's enabled field; the alert-policy list
  uses the GA gcloud command.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os: [linux]
  binaries: [gcloud, curl, jq]

setup:
  summary: >
    Uses gcloud authentication on the runner host. The Logging, metric, and
    alert-policy REST actions obtain a short-lived access token from gcloud and
    send it only to fixed Google Cloud API endpoints without placing it in argv
    or output.
  env:
    - name: CLOUDSDK_CONFIG
      description: Optional gcloud configuration directory.
      example: /etc/emisar/gcloud
    - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
      description: Optional path to a credential file that overrides the active gcloud account.
      example: /etc/emisar/gcp-reader.json
  notes:
    - "Any credential/config env you set must be allowlisted in the runner's execution.inherit_env; attached service accounts and workload identity need no credential env."
    - "Grant least privilege for the actions you enable: ordinary Logging reads need roles/logging.viewer; private and Data Access logs additionally need roles/logging.privateLogViewer. Monitoring reads need roles/monitoring.viewer, and alert-policy enable or disable needs roles/monitoring.alertPolicyEditor-equivalent permissions. User or quota-project credentials may also need serviceusage.services.use on the named project for the X-Goog-User-Project quota header."
    - "For a credential file, populate a dedicated CLOUDSDK_CONFIG with `gcloud auth login --cred-file=...` or set CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; ordinary gcloud commands do not authenticate from GOOGLE_APPLICATION_CREDENTIALS."
    - "This remote-target pack declares no host detection signal and is never auto-suggested merely because gcloud is installed."
    - "Metric query pageSize with view=FULL caps returned points rather than the number of time-series objects; follow nextPageToken for another page."
  verify: gcp.alert_policies

actions:
  - actions/log_names.yaml
  - actions/log_entries.yaml
  - actions/metric_query.yaml
  - actions/metric_descriptors.yaml
  - actions/interconnect_utilization.yaml
  - actions/alert_policies.yaml
  - actions/alert_policy_enable.yaml
  - actions/alert_policy_disable.yaml
