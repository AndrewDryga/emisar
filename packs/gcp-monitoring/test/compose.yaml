services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/gcp-monitoring/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-577.0.0-slim}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-gcp-monitoring-tools:latest

  gcp-api:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:${PACKTEST_VERSION:-577.0.0-slim}${PACKTEST_DIGEST-}
    entrypoint: [python3, /fixture/server.py]
    volumes:
      - ${EMISAR_ROOT}/packs/gcp-monitoring/test/fixtures/server.py:/fixture/server.py:ro
      - ${EMISAR_ROOT}/packs/gcp-monitoring/test/fixtures/server.crt:/fixture/server.crt:ro
      - ${EMISAR_ROOT}/packs/gcp-monitoring/test/fixtures/server.key:/fixture/server.key:ro
    healthcheck:
      test: [CMD, python3, -c, "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8443/health', context=ssl._create_unverified_context())"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
