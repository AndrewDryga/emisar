schema_version: 1
id: gcp.interconnect_utilization
title: Query Cloud Interconnect attachment utilization
kind: script
risk: low
description: >
  Query capacity plus received and sent byte rates for one Cloud Interconnect
  attachment, then calculate independent ingress and egress utilization
  ratios. The link is full duplex, so directions are never summed. The window
  reaches 730 days at a coarse alignment: window / alignment_seconds must fit
  the 1000-point page each metric is read in.
side_effects:
  - One gcloud token read and three read-only Monitoring API requests.
  - Writes public metric responses to mode-0600 temporary files and removes them before exit.
search_terms:
  - Interconnect saturation
  - VLAN attachment utilization
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: attachment
    type: string
    required: true
    description: Cloud Interconnect attachment name.
    validation:
      pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  - name: region
    type: string
    required: true
    description: Attachment region.
    validation:
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  - name: window_minutes
    type: integer
    required: false
    default: 60
    description: Trailing window in minutes ending now, up to 730 days (1051200); window / alignment_seconds must fit the 1000-point page.
    validation:
      min: 5
      max: 1051200
  - name: alignment_seconds
    type: integer
    required: false
    default: 60
    description: Alignment period for the three rate and capacity series, from one minute to one week (604800).
    validation:
      min: 60
      max: 604800
execution:
  script:
    path: scripts/monitoring_api.sh
    interpreter: /bin/sh
  argv:
    - interconnect-utilization
    - "{{ args.project }}"
    - "{{ args.attachment }}"
    - "{{ args.region }}"
    - "{{ args.window_minutes }}"
    - "{{ args.alignment_seconds }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Last hour for a VLAN attachment
    args:
      project: example-prod
      attachment: va1-primary
      region: us-central1
      window_minutes: 60
  - title: Two weeks at hourly points
    args:
      project: example-prod
      attachment: va1-primary
      region: us-central1
      window_minutes: 20160
      alignment_seconds: 3600
