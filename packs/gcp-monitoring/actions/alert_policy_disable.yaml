schema_version: 1
id: gcp.alert_policy_disable
title: Disable a Cloud Monitoring alert policy
kind: script
risk: high
description: >
  Disable one exact alerting policy so its conditions stop evaluating and
  notifying. Incidents the policy would catch go unnoticed until it is
  re-enabled with gcp.alert_policy_enable — that is the rollback. Idempotent:
  disabling an already-disabled policy succeeds and changes nothing. Returns
  the updated policy.
side_effects:
  - One gcloud token read and one Monitoring API PATCH restricted to the policy's enabled field.
  - The policy stops alerting; its notification channels stay silent until re-enabled.
search_terms:
  - disable alert
  - silence policy
  - stop alerting
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: policy
    type: string
    required: true
    description: >
      Numeric alert-policy ID — the last segment of
      projects/PROJECT/alertPolicies/ID. Find it with gcp.alert_policies.
    validation:
      pattern: "^[0-9]{1,20}$"
execution:
  script:
    path: scripts/monitoring_api.sh
    interpreter: /bin/sh
  argv:
    - alert-policy-set-enabled
    - "{{ args.project }}"
    - "{{ args.policy }}"
    - "false"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 262144
  max_stderr_bytes: 16384
examples:
  - title: Silence a flapping alert policy during an incident
    args:
      project: example-prod
      policy: "8675309001234"
