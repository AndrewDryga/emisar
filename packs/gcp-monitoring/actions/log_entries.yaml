schema_version: 1
id: gcp.log_entries
title: Query Cloud Logging entries
kind: script
risk: medium
description: >
  Query up to five Cloud Logging entries in a trailing or exact historical interval
  in a Google Cloud project or a named view in its global _Default bucket,
  optionally narrowed by minimum severity, resource type, exact Compute Engine
  instance ID, exact log ID, and a jsonPayload.message event name,
  matched as the whole message or its first word.
  Returns fixed, clipped diagnostic fields including jsonPayload.job and error,
  plus a continuation cursor. Use gcp.log_entry_detail with an exact log ID and
  returned timestamp for full nested health-check, audit or container payloads
  rather than asking someone to export the JSON. Log content is arbitrary application
  output, so redaction is best-effort and the result should be treated as
  sensitive diagnostics.
side_effects:
  - One gcloud token read and one read-only Cloud Logging API request per page.
  - Returns application-controlled log content into the governed run result and audit trail.
search_terms:
  - query gcp logs
  - find cloud logging errors
  - recent google cloud logs
  - historical VM scheduler logs
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: minimum_severity
    type: string
    required: false
    default: DEFAULT
    description: Minimum normalized Cloud Logging severity to return.
    validation:
      enum: [DEFAULT, DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL, ALERT, EMERGENCY]
  - name: resource_type
    type: string
    required: false
    default: ""
    description: Optional exact monitored-resource type, such as gce_instance or cloud_run_revision.
    validation:
      pattern: "^([a-z][a-z0-9_]{0,127})?$"
      max_length: 128
  - name: log_id
    type: string
    required: false
    default: ""
    description: Optional exact URL-encoded log ID, without the projects/PROJECT/logs/ prefix.
    validation:
      pattern: "^([A-Za-z0-9][A-Za-z0-9._~%+/-]{0,511})?$"
      max_length: 512
  - name: view_id
    type: string
    required: false
    default: ""
    description: Optional view ID in the project's global _Default bucket; use a view-scoped IAM grant instead of project-wide log access.
    validation:
      pattern: "^([A-Za-z][A-Za-z0-9_-]{0,99})?$"
      max_length: 100
  - name: json_message
    type: string
    required: false
    default: ""
    description: >-
      Optional event name matched as the whole jsonPayload.message or its first
      word, such as recurrent_job.failed, or sweep.row_failed for its
      `sweep.row_failed row=<id>` lines.
    validation:
      pattern: "^([A-Za-z0-9._-]{1,128})?$"
      max_length: 128
  - name: window_minutes
    type: integer
    required: false
    default: 60
    description: Trailing window in minutes ending at the first page's query time, up to 3650 days (5256000), the longest bucket retention. Ignored when start_time and end_time select an exact interval; the _Default bucket keeps 30 days unless configured.
    validation:
      min: 1
      max: 5256000
  - name: page_size
    type: integer
    required: false
    default: 5
    description: Maximum entries to return.
    validation:
      min: 1
      max: 5
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Continuation from next_page_cursor; keep all other arguments unchanged.
    validation:
      pattern: "^[A-Za-z0-9+./=_~-]*$"
      max_length: 1152
  - name: start_time
    type: string
    required: false
    default: ""
    description: Inclusive UTC start of a historical interval, paired with end_time. The interval may cover up to 3650 days, the longest bucket retention.
    validation:
      pattern: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$'
      max_length: 20
  - name: end_time
    type: string
    required: false
    default: ""
    description: Inclusive UTC end of a historical interval, after start_time and no later than now. Both bounds must be supplied together.
    validation:
      pattern: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$'
      max_length: 20
  - name: instance_id
    type: string
    required: false
    default: ""
    description: Exact numeric Compute Engine instance ID from retained resource evidence. Requires resource_type gce_instance; it does not resolve a current VM by name.
    validation:
      pattern: '^(?:[1-9][0-9]{0,19})?$'
      max_length: 20
execution:
  script:
    path: scripts/logging_api.sh
    interpreter: /bin/sh
  argv:
    - log-entries
    - "{{ args.project }}"
    - "{{ args.minimum_severity }}"
    - "{{ args.resource_type }}"
    - "{{ args.log_id }}"
    - "{{ args.window_minutes }}"
    - "{{ args.page_size }}"
    - "{{ args.view_id }}"
    - "{{ args.json_message }}"
    - "{{ args.page_cursor }}"
    - "{{ args.start_time }}"
    - "{{ args.end_time }}"
    - "{{ args.instance_id }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [entries, more_available, next_page_cursor, cursor_omitted]
    properties:
      entries:
        type: array
        maxItems: 5
        items:
          type: object
          additionalProperties: false
          required: [timestamp, severity, resource_type, log_name, job, error, message, message_truncated]
          properties:
            timestamp: {type: string, maxLength: 40}
            severity: {type: string, maxLength: 16}
            resource_type: {type: string, maxLength: 64}
            log_name: {type: string, maxLength: 160}
            job: {type: string, maxLength: 100}
            error: {type: string, maxLength: 100}
            message: {type: string, maxLength: 200}
            message_truncated: {type: boolean}
      next_page_cursor: {type: [string, "null"], maxLength: 1152}
      cursor_omitted: {type: boolean}
      more_available: {type: boolean}
  max_stdout_bytes: 16384
  max_stderr_bytes: 16384
  redact:
    - name: bearer-authorization
      type: regex
      pattern: '(?i)(authorization[":= ]+bearer[[:space:]]+)[A-Za-z0-9._~+/=-]{8,}'
      replacement: '${1}[REDACTED]'
examples:
  - title: Recent VM errors
    args:
      project: example-prod
      minimum_severity: ERROR
      resource_type: gce_instance
      window_minutes: 60
      page_size: 5
