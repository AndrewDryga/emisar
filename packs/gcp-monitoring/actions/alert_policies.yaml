schema_version: 1
id: gcp.alert_policies
title: gcloud monitoring policies list
kind: exec
risk: low
description: List alerting policies in one Google Cloud project.
side_effects:
  - Read-only Cloud Monitoring API pagination.
  - Returned policies are capped by limit.
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation:
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum policies to return.
    validation:
      min: 1
      max: 500
execution:
  command:
    binary: gcloud
    argv:
      - monitoring
      - policies
      - list
      - "--project={{ args.project }}"
      - "--limit={{ args.limit }}"
      - --format=json
      - --quiet
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: Project alert policies
    args:
      project: example-prod
      limit: 100
