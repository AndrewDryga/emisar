schema_version: 1
id: pure.snapshots
title: List FlashArray protection-group snapshots
kind: script
risk: low
description: >
  List protection-group snapshots, including creation time, source group,
  destroyed state, and retention time. Results are bounded to one page.
side_effects:
  - One read-only HTTP GET to /protection-group-snapshots.
  - Read-only - never creates, destroys, or eradicates a snapshot.
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum snapshots in this page.
    validation:
      min: 1
      max: 1000
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque next_page_cursor from a prior result.
    validation:
      pattern: "^[A-Za-z0-9._~+/=-]*$"
      max_length: 2048
execution:
  script:
    path: scripts/purelist.sh
    interpreter: /bin/sh
  argv:
    - snapshots
    - "{{ args.limit }}"
    - "{{ args.page_cursor }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Most recent snapshot page
    args: {}
