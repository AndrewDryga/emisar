schema_version: 1

id: rabbitmq
name: RabbitMQ operations
version: 0.1.15
retired_below: 0.1.9
description: >
  Cluster, queue, exchange, binding, connection, channel, and consumer
  inventory plus narrow operator actions (purge_queue, set_policy,
  force_close_connection). Uses rabbitmqctl + rabbitmqadmin on the
  runner host.
vendor: emisar
homepage: https://emisar.dev/packs/rabbitmq

requires:
  os:
    - linux
  binaries:
    - rabbitmqctl

# `emisar pack suggest` detection — default process names / ports.
detect:
  binaries:
    - rabbitmqctl
  ports:
    - 5672
    - 15672

setup:
  summary: >
    rabbitmqctl and rabbitmq-diagnostics talk to the RabbitMQ node on the same
    host and authenticate with the Erlang cookie, not a username or URL. No
    connection env vars — provisioning is about running as the right user.
  notes:
    - "These tools target the local node only. To manage a remote node you would need -n <node>, which these actions do not set."
  host_access:
    - actions:
        - rmq.cluster_status
        - rmq.node_health_check
        - rmq.list_nodes
        - rmq.list_vhosts
        - rmq.list_users
        - rmq.list_policies
        - rmq.list_parameters
        - rmq.list_queues
        - rmq.list_exchanges
        - rmq.list_bindings
        - rmq.list_connections
        - rmq.list_channels
        - rmq.list_consumers
        - rmq.purge_queue
        - rmq.close_connection
        - rmq.sync_queue
        - rmq.start_app
        - rmq.stop_app
      requirement: Read RabbitMQ's Erlang cookie and act as a local node administrator.
      recipes:
        - name: Run the Emisar service as root with RabbitMQ's live cookie
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-rabbitmq-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
            - "sudo env HOME=/var/lib/rabbitmq rabbitmq-diagnostics -q ping"
          impact: >
            Every Emisar action on this runner executes as root. Root can use the live Erlang
            cookie selected by the pack to administer the local node, including operations
            outside this pack.
  verify: rmq.node_health_check

actions:
  # Cluster
  - actions/cluster_status.yaml
  - actions/node_health_check.yaml
  - actions/list_nodes.yaml
  # Vhosts / users / policies
  - actions/list_vhosts.yaml
  - actions/list_users.yaml
  - actions/list_policies.yaml
  - actions/list_parameters.yaml
  # Topology
  - actions/list_queues.yaml
  - actions/list_exchanges.yaml
  - actions/list_bindings.yaml
  # Live traffic
  - actions/list_connections.yaml
  - actions/list_channels.yaml
  - actions/list_consumers.yaml
  # Mutators
  - actions/purge_queue.yaml
  - actions/close_connection.yaml
  - actions/sync_queue.yaml
  - actions/start_app.yaml
  - actions/stop_app.yaml
