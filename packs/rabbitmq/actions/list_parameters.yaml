schema_version: 1
id: rmq.list_parameters
title: rabbitmqctl list_parameters
kind: exec
risk: low
description: List the runtime parameters in the default vhost `/` (federation upstreams, shovel definitions, etc). Other vhosts are not shown; `rmq.list_vhosts` lists them.
side_effects:
  - One CLI call.
  - Read-only.
args: []
execution:
  env:
    HOME: /var/lib/rabbitmq
  command:
    binary: rabbitmqctl
    argv:
      - "list_parameters"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Parameters
    args: {}
