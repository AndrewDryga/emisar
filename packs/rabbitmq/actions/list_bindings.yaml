schema_version: 1
id: rmq.list_bindings
title: rabbitmqctl list_bindings
kind: exec
risk: low
description: List the bindings between exchanges and queues in the default vhost `/`. Other vhosts are not shown; `rmq.list_vhosts` lists them.
side_effects:
  - One CLI call.
  - Read-only.
args: []
execution:
  env:
    HOME: /var/lib/rabbitmq
  command:
    binary: rabbitmqctl
    argv:
      - "list_bindings"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Bindings
    args: {}
