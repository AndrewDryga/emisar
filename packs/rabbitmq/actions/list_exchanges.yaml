schema_version: 1
id: rmq.list_exchanges
title: rabbitmqctl list_exchanges
kind: exec
risk: low
description: List the exchanges in the default vhost `/` with type + durability. Other vhosts are not shown; `rmq.list_vhosts` lists them.
side_effects:
  - One CLI call.
  - Read-only.
args: []
execution:
  env:
    HOME: /var/lib/rabbitmq
  command:
    binary: rabbitmqctl
    argv:
      - "list_exchanges"
      - "name"
      - "type"
      - "durable"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Exchanges
    args: {}
