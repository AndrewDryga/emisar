services: [rabbitmq]
versions:
  - version: 4.3.4-management
    digest: "@sha256:eb5295d083325da5929a5ade766684d4019ffd2bce8bc7e43d6f9a05cafc8646"
    default: true
secret_env: [RABBITMQ_ERLANG_COOKIE]
env:
  HOME: /var/lib/rabbitmq
  RABBITMQ_ERLANG_COOKIE: packtest-canary-rabbitmq-cookie-d8b5
  RABBITMQ_NODENAME: rabbit@rabbitmq
defaults:
  expect:
    stdout_not_empty: true
cases:
  # stop_app stops the RabbitMQ application while leaving the node running, so
  # the probe asks the node itself — the shape redis.shutdown_nosave uses. Its
  # own disposable Compose project means nothing after it is affected.
  - action: rmq.stop_app
    probes:
      - name: the application is no longer running
        argv: [/bin/sh, -c, "rabbitmq-diagnostics -q check_running >/dev/null 2>&1 || echo stopped"]
        retry_for: 30s
        retry_every: 1s
        expect:
          stdout_contains: [stopped]

  - action: rmq.cluster_status
    expect:
      stdout_contains: [Cluster status, rabbit@rabbitmq]
  - action: rmq.node_health_check
    expect:
      stdout_contains: [fully booted and running]
  - action: rmq.list_nodes
    expect:
      stdout_contains: [rabbit@rabbitmq]
  - action: rmq.list_vhosts
    expect:
      stdout_contains: [Listing vhosts, /]
  - action: rmq.list_users
    expect:
      stdout_contains: [guest, administrator]
  - action: rmq.list_policies
    expect:
      stdout_contains: [Listing policies]
  - action: rmq.list_parameters
    expect:
      stdout_contains: [Listing runtime parameters]
  - action: rmq.list_queues
    expect:
      stdout_contains: [packtest, messages_ready]
  - action: rmq.close_connection
    # Open and HOLD two AMQP connections (pika clients with heartbeats off that
    # sleep), resolve the holder's connection pid from list_connections, then
    # close that one alone.
    args:
      note: "packtest closing it"
    arrange:
      - argv: [/bin/sh, -c, 'rabbitmqctl add_user packtest-holder packtest-holder-pw && rabbitmqctl set_permissions packtest-holder ".*" ".*" ".*"']
      - argv: [/bin/sh, -c, 'rabbitmqctl add_user packtest-keeper packtest-keeper-pw && rabbitmqctl set_permissions packtest-keeper ".*" ".*" ".*"']
      - argv: ["/bin/sh", "-c", "nohup python3 -c 'import pika; c=pika.BlockingConnection(pika.ConnectionParameters(host=\"rabbitmq\", credentials=pika.PlainCredentials(\"packtest-holder\",\"packtest-holder-pw\"), heartbeat=0, client_properties={\"connection_name\":\"packtest-holder\"})); c.sleep(300)' >/tmp/packtest-rmq-holder.log 2>&1 &"]
      - argv: ["/bin/sh", "-c", "nohup python3 -c 'import pika; c=pika.BlockingConnection(pika.ConnectionParameters(host=\"rabbitmq\", credentials=pika.PlainCredentials(\"packtest-keeper\",\"packtest-keeper-pw\"), heartbeat=0, client_properties={\"connection_name\":\"packtest-keeper\"})); c.sleep(300)' >/tmp/packtest-rmq-keeper.log 2>&1 &"]
      - argv: [rabbitmqctl, -q, list_connections, user]
        expect:
          stdout_contains: [packtest-holder, packtest-keeper]
        retry_for: 15s
        retry_every: 500ms
    resolve_args:
      pid:
        argv: [/bin/sh, -c, "rabbitmqctl -q list_connections pid user | awk '/packtest-holder/ {print $1; exit}'"]
        retry_for: 15s
        retry_every: 500ms
    expect:
      status: success
    # Absence alone cannot prove a close: a node that died between the action
    # and the probe also lists no packtest-holder. The probe reads the raw
    # connection listing and asserts the untouched keeper connection is still
    # there before asserting the holder is gone, so an unreachable node fails
    # the case instead of passing it — and the close is proved to have dropped
    # the resolved pid rather than every connection.
    probes:
      - name: the held connection is gone and the other one survives
        argv: [rabbitmqctl, -q, list_connections, user]
        expect:
          stdout_contains: [packtest-keeper]
          stdout_not_contains: [packtest-holder]
        retry_for: 15s
        retry_every: 500ms
  - action: rmq.list_exchanges
    expect:
      stdout_contains: [amq.direct, direct]
  - action: rmq.list_bindings
    expect:
      stdout_contains: [Listing bindings]
  - action: rmq.list_connections
    expect:
      stdout_contains: [Listing connections]
  - action: rmq.list_channels
    expect:
      stdout_contains: [Listing channels]
  - action: rmq.list_consumers
    expect:
      stdout_contains: [Listing consumers]
  - action: rmq.purge_queue
    args: {vhost: /, queue: packtest}
    arrange:
      - argv: [rabbitmqadmin, -u, guest, -p, guest, publish, message, --routing-key, packtest, --payload, ready, --non-interactive]
    # stdout_contains matches each needle independently anywhere in the output,
    # so [packtest, "0"] accepted any listing carrying both — a queue depth of
    # 10, or a "0" belonging to some other queue's row. Pick packtest's own
    # messages_ready column and compare it exactly instead.
    probes:
      - argv: [/bin/sh, -c, "test \"$(rabbitmqctl -q list_queues name messages_ready | awk '$1 == \"packtest\" {print $2}')\" = 0 && echo purge-queue-empty"]
        expect:
          stdout_contains: [purge-queue-empty]
    cleanup:
      - argv: [rabbitmqadmin, -u, guest, -p, guest, publish, message, --routing-key, packtest, --payload, ready, --non-interactive]
