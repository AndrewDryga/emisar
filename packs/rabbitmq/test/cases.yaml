services: [rabbitmq]
versions:
  - version: 4.3.3-management
    digest: "@sha256:d8b3d416236ae5ba3f6a9f4e4651fdacda01780181a7d83a71b640248d8f0a69"
    default: true
secret_env: [RABBITMQ_ERLANG_COOKIE]
env:
  HOME: /var/lib/rabbitmq
  RABBITMQ_ERLANG_COOKIE: packtest-canary-rabbitmq-cookie-d8b5
  RABBITMQ_NODENAME: rabbit@rabbitmq
defaults:
  expect:
    stdout_not_empty: true
risk_accountability:
  exceptions: {}
cases:
  # stop_app stops the RabbitMQ application while leaving the node running, so
  # the probe asks the node itself — the shape redis.shutdown_nosave uses. Its
  # own disposable Compose project means nothing after it is affected.
  - action: rmq.stop_app
    probes:
      - name: the application is no longer running
        argv: [/bin/sh, -c, "rabbitmq-diagnostics -q check_running >/dev/null 2>&1 || echo stopped"]
        retry_for: 30s
        retry_every: 1s
        expect:
          stdout_contains: [stopped]

  - action: rmq.cluster_status
    expect:
      stdout_contains: [Cluster status, rabbit@rabbitmq]
  - action: rmq.node_health_check
    expect:
      stdout_contains: [fully booted and running]
  - action: rmq.list_nodes
    expect:
      stdout_contains: [rabbit@rabbitmq]
  - action: rmq.list_vhosts
    expect:
      stdout_contains: [Listing vhosts, /]
  - action: rmq.list_users
    expect:
      stdout_contains: [guest, administrator]
  - action: rmq.list_policies
    expect:
      stdout_contains: [Listing policies]
  - action: rmq.list_parameters
    expect:
      stdout_contains: [Listing runtime parameters]
  - action: rmq.list_queues
    expect:
      stdout_contains: [packtest, messages_ready]
  - action: rmq.close_connection
    # Open and HOLD an AMQP connection (a pika client with heartbeats off that
    # sleeps), resolve its connection pid from list_connections, then close it.
    args:
      note: "packtest closing it"
    arrange:
      - argv: [/bin/sh, -c, 'rabbitmqctl add_user packtest-holder packtest-holder-pw && rabbitmqctl set_permissions packtest-holder ".*" ".*" ".*"']
      - argv: ["/bin/sh", "-c", "nohup python3 -c 'import pika; c=pika.BlockingConnection(pika.ConnectionParameters(host=\"rabbitmq\", credentials=pika.PlainCredentials(\"packtest-holder\",\"packtest-holder-pw\"), heartbeat=0, client_properties={\"connection_name\":\"packtest-holder\"})); c.sleep(300)' >/tmp/packtest-rmq-holder.log 2>&1 &"]
      - argv: [/bin/sh, -c, 'rabbitmqctl -q list_connections user | grep -c packtest-holder']
        expect:
          stdout_contains: ["1"]
        retry_for: 15s
        retry_every: 500ms
    resolve_args:
      pid:
        argv: [/bin/sh, -c, "rabbitmqctl -q list_connections pid user | awk '/packtest-holder/ {print $1; exit}'"]
        retry_for: 15s
        retry_every: 500ms
    expect:
      status: success
    probes:
      - argv: [/bin/sh, -c, 'rabbitmqctl -q list_connections user | grep -c packtest-holder || true']
        expect:
          stdout_contains: ["0"]
        retry_for: 15s
        retry_every: 500ms
  - action: rmq.list_exchanges
    expect:
      stdout_contains: [amq.direct, direct]
  - action: rmq.list_bindings
    expect:
      stdout_contains: [Listing bindings]
  - action: rmq.list_connections
    expect:
      stdout_contains: [Listing connections]
  - action: rmq.list_channels
    expect:
      stdout_contains: [Listing channels]
  - action: rmq.list_consumers
    expect:
      stdout_contains: [Listing consumers]
  - action: rmq.purge_queue
    args: {vhost: /, queue: packtest}
    arrange:
      - argv: [rabbitmqadmin, -u, guest, -p, guest, publish, message, --routing-key, packtest, --payload, ready, --non-interactive]
    probes:
      - argv: [rabbitmqctl, list_queues, name, messages_ready]
        expect:
          stdout_contains: [packtest, "0"]
    cleanup:
      - argv: [rabbitmqadmin, -u, guest, -p, guest, publish, message, --routing-key, packtest, --payload, ready, --non-interactive]
