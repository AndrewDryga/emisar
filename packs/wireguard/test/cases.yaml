# These need the wireguard kernel module, which a container borrows from its
# host rather than loading itself. A GitHub Linux runner carries it and this
# workstation's kernel does not, so this class is CI's to decide — a local
# check proves nothing about it either way.
# See .agent/kb/pack-behavior-environment-limits.md for what was measured.
risk_accountability:
  mode: complete
  exceptions:
    wg.quick_down: requires_privileged_host
    wg.quick_up: requires_privileged_host
    wg.set_peer_remove: requires_privileged_host
