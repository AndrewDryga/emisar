schema_version: 1
id: gcp.storage_buckets
title: gcloud storage buckets list
kind: script
risk: low
description: List bounded bucket location, storage, retention, lifecycle, encryption, access, and namespace configuration.
side_effects: ["Read-only Cloud Storage API pagination.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum buckets to return.
    validation: {min: 1, max: 500}
execution:
  script: {path: scripts/storage.sh, interpreter: /bin/sh}
  argv: [buckets, "{{ args.project }}", "{{ args.limit }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 4194304
  max_stderr_bytes: 16384
examples:
  - title: Project buckets
    args: {project: example-prod}
