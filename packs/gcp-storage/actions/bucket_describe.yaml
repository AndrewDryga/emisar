schema_version: 1
id: gcp.storage_bucket_describe
title: gcloud storage buckets describe
kind: script
risk: low
description: Show one bucket's location, storage, retention, lifecycle, encryption, access, and namespace configuration.
side_effects: ["One read-only Cloud Storage API call.", "Uses a mode-0600 temporary response file and removes it before exit."]
args:
  - name: project
    type: string
    required: true
    description: Google Cloud project ID.
    validation: {pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", max_length: 30}
  - name: bucket
    type: string
    required: true
    description: Cloud Storage bucket name.
    validation: {pattern: "^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$", max_length: 63}
execution:
  script: {path: scripts/storage.sh, interpreter: /bin/sh}
  argv: [bucket-describe, "{{ args.project }}", "{{ args.bucket }}"]
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Application bucket
    args: {project: example-prod, bucket: example-prod-assets}
