schema_version: 1
id: envoy.drain_listeners
title: POST /drain_listeners
kind: exec
risk: high
description: >
  Mark all listeners as draining. Existing connections close on
  their own as requests complete; no new connections accepted on
  drained listeners. Use during a planned restart to drain traffic
  before flipping a load balancer.
side_effects:
  - All listeners stop accepting new connections.
  - Existing connections drain over the configured grace.
  - Health checks may fail externally during drain.
search_terms:
  - graceful shutdown
args:
  - name: inboundonly
    type: boolean
    required: false
    default: false
    description: Drain only inbound listeners.
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ '{{ args.inboundonly }}' = 'true' ]; then curl -q -fsS --globoff --proto =http,https -XPOST \"${ENVOY_ADMIN:-http://127.0.0.1:9901}/drain_listeners?inboundonly\"; else curl -q -fsS --globoff --proto =http,https -XPOST \"${ENVOY_ADMIN:-http://127.0.0.1:9901}/drain_listeners\"; fi"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Drain inbound listeners
    args:
      inboundonly: true
