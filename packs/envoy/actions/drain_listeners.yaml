schema_version: 1
id: envoy.drain_listeners
title: POST /drain_listeners
kind: exec
risk: high
description: >
  Stop all listeners (or inbound listeners only) from accepting new
  connections, immediately. This calls `POST /drain_listeners` without
  `graceful`, which on Envoy 1.39 stops the listeners at once and skips
  the drain period. A stopped listener stays stopped until Envoy
  restarts. Use during a planned restart after the load balancer has
  moved traffic away.
side_effects:
  - The listeners stop accepting new connections at once; there is no graceful drain period.
  - The listeners stay stopped until Envoy restarts.
  - Health checks may fail externally.
search_terms:
  - graceful shutdown
args:
  - name: inboundonly
    type: boolean
    required: false
    default: false
    description: Drain only inbound listeners.
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ '{{ args.inboundonly }}' = 'true' ]; then curl -q -fsS --globoff --proto =http,https -XPOST \"${ENVOY_ADMIN:-http://127.0.0.1:9901}/drain_listeners?inboundonly\"; else curl -q -fsS --globoff --proto =http,https -XPOST \"${ENVOY_ADMIN:-http://127.0.0.1:9901}/drain_listeners\"; fi"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Drain inbound listeners
    args:
      inboundonly: true
