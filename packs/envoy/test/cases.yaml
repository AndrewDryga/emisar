services: [envoy]
versions:
  - version: v1.39.0
    digest: "@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66"
    default: true
env:
  ENVOY_ADMIN: "http://envoy:9901"
defaults:
  expect:
    stdout_not_empty: true
cases:
  # healthcheck_fail flips the admin's health flag, which /ready then reports —
  # so the probe reads the state the action changed, not the action's own reply.
  - action: envoy.healthcheck_fail
    probes:
      - name: envoy now reports itself draining
        argv: [/bin/sh, -c, "curl -s -o /dev/null -w %{http_code} http://envoy:9901/ready"]
        retry_for: 20s
        retry_every: 1s
        expect:
          stdout_contains: ["503"]

  - action: envoy.certs
    expect:
      stdout_contains: [certificates]
  - action: envoy.clusters
    expect:
      stdout_contains: [harness_backend]
  - action: envoy.config_dump
    expect:
      stdout_contains: [configs]
  - action: envoy.listeners
    expect:
      stdout_contains: [listener_0, "10000"]
  - action: envoy.logging_get
    expect:
      stdout_contains: [active loggers]
  - action: envoy.ready
    expect:
      stdout_contains: ["200"]
  - action: envoy.runtime
    expect:
      stdout_contains: [layers]
  - action: envoy.server_info
    expect:
      stdout_contains: [version, state]
  - name: envoy.server-info-http-error
    action: envoy.server_info
    env:
      ENVOY_ADMIN: http://envoy:9901/does-not-exist
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)"]
  - action: envoy.stats
    args: {filter: server}
    expect:
      stdout_contains: [server.]

  # Both branches of the drain argv run: they are separate curl invocations, so
  # one case can only ever prove one of them. The data-plane port is the state
  # each drains — it serves "pack-test ok" until the listener stops accepting.
  - action: envoy.drain_listeners
    expect:
      stdout_contains: [OK]
    probes:
      - name: the data-plane listener stops accepting connections
        argv: [/bin/sh, -c, "curl -s -m 5 http://envoy:10000/ || echo listener-drained"]
        retry_for: 30s
        retry_every: 2s
        expect:
          stdout_contains: [listener-drained]
          stdout_not_contains: ["pack-test ok"]

  - name: envoy.drain-listeners-inbound-only
    action: envoy.drain_listeners
    args: {inboundonly: true}
    expect:
      stdout_contains: [OK]
    probes:
      - name: the inbound listener stops accepting connections
        argv: [/bin/sh, -c, "curl -s -m 5 http://envoy:10000/ || echo listener-drained"]
        retry_for: 30s
        retry_every: 2s
        expect:
          stdout_contains: [listener-drained]
          stdout_not_contains: ["pack-test ok"]
