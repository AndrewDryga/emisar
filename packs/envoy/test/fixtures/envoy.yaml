admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  clusters:
    - name: harness_backend
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: harness_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 10000 }
  listeners:
    - name: listener_0
      # Declared INBOUND so drain_listeners?inboundonly reaches it too — without
      # a direction Envoy leaves the listener alone and that branch has nothing
      # observable to prove.
      traffic_direction: INBOUND
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                http_filters:
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match: { exact: "/healthz" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "pack-test ok" }
