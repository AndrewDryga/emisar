services:
  stripe-api:
    image: python:${PACKTEST_VERSION:-3.14.7-alpine3.24}${PACKTEST_DIGEST-}
    entrypoint: [python3, /fixture/server.py]
    volumes:
      - ${EMISAR_ROOT}/packs/stripe/test/fixtures:/fixture:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
