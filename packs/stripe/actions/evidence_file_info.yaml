schema_version: 1
id: stripe.evidence_file_info
title: Inspect an evidence file
kind: script
risk: low
description: "Show the size, type, and SHA256 of a staged PDF, PNG, or JPEG without exposing file contents."
side_effects: ["Reads one regular file in STRIPE_EVIDENCE_DIR and returns metadata only."]
args:
  - name: file_name
    type: string
    required: true
    description: "Single regular file basename in the operator-configured evidence directory; symlinks and path traversal are refused."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._-]*$","max_length":200}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [evidence_file_info]
  env:
    ARG_FILE_NAME: "{{ args.file_name }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Confirm an evidence file before uploading it
    args:
      file_name: "delivery-confirmation.pdf"
