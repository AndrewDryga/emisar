schema_version: 1
id: stripe.pause_collection
title: Pause subscription collection
kind: script
risk: high
description: "Pause invoice collection with an explicit treatment of new invoices. Subscription status stays unchanged; existing invoices can continue retrying."
side_effects: ["Changes the named customer's billing or dispute state; approval is required under the default policy.","Sends at most one write request; after an ambiguous failure investigate provider state before another correction."]
args:
  - name: subscription
    type: string
    required: true
    description: "sub_ identifier returned by a Stripe read."
    validation: {"pattern":"^sub_[A-Za-z0-9]+$","max_length":255}
  - name: behavior
    type: string
    required: true
    description: "Treatment of invoices created during the pause."
    validation: {"enum":["keep_as_draft","mark_uncollectible","void"]}
  - name: resumes_at
    type: integer
    required: false
    description: "Unix time to resume collection; 0 leaves the pause open ended."
    default: 0
    validation: {"min":0,"max":999999999999}
  - name: mode
    type: string
    required: true
    description: "Explicitly approve the runner's configured Stripe mode."
    validation: {"enum":["test","live"]}
  - name: operation_id
    type: string
    required: true
    description: "Stable correction identifier for Stripe Idempotency-Key. Reuse with identical parameters within the provider's retention window (at least 24 hours); reconcile before retrying later."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._:-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [pause_collection]
  env:
    ARG_SUBSCRIPTION: "{{ args.subscription }}"
    ARG_BEHAVIOR: "{{ args.behavior }}"
    ARG_RESUMES_AT: "{{ args.resumes_at }}"
    ARG_MODE: "{{ args.mode }}"
    ARG_OPERATION_ID: "{{ args.operation_id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
