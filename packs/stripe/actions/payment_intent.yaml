schema_version: 1
id: stripe.payment_intent
title: Show payment intent
kind: script
risk: low
description: "Show one Stripe payment intent with selected diagnostic fields. Returns identifiers and state without raw metadata, client secrets, or signed URLs."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "pi_ identifier returned by a Stripe read."
    validation: {"pattern":"^pi_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [payment_intent]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Diagnose a declined payment
    args:
      id: "pi_3PqL2wCZ6qsJmT1a1YbKcNfH"
