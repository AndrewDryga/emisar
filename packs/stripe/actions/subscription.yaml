schema_version: 1
id: stripe.subscription
title: Show subscription
kind: script
risk: low
description: "Show one Stripe subscription with selected diagnostic fields. Includes ten subscription items and an explicit overflow flag; use subscription_items to continue."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "sub_ identifier returned by a Stripe read."
    validation: {"pattern":"^sub_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [subscription]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
