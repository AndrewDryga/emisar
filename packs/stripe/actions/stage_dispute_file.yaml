schema_version: 1
id: stripe.stage_dispute_file
title: Stage dispute file evidence
kind: script
risk: high
description: "Attach an existing Stripe dispute-evidence file to one named evidence field with submit=false."
side_effects: ["Changes the named customer's billing or dispute state; approval is required under the default policy.","Sends at most one write request; after an ambiguous failure investigate provider state before another correction."]
args:
  - name: dispute
    type: string
    required: true
    description: "dp_ or du_ identifier returned by a Stripe read."
    validation: {"pattern":"^(dp|du)_[A-Za-z0-9]+$","max_length":255}
  - name: field
    type: string
    required: true
    description: "Stripe file evidence field."
    validation: {"enum":["cancellation_policy","customer_communication","customer_signature","duplicate_charge_documentation","receipt","refund_policy","service_documentation","shipping_documentation","uncategorized_file"]}
  - name: file
    type: string
    required: true
    description: "file_ identifier returned by a Stripe read."
    validation: {"pattern":"^file_[A-Za-z0-9]+$","max_length":255}
  - name: mode
    type: string
    required: true
    description: "Explicitly approve the runner's configured Stripe mode."
    validation: {"enum":["test","live"]}
  - name: operation_id
    type: string
    required: true
    description: "Stable correction identifier for Stripe Idempotency-Key. Reuse with identical parameters within the provider's retention window (at least 24 hours); reconcile before retrying later."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._:-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [stage_dispute_file]
  env:
    ARG_DISPUTE: "{{ args.dispute }}"
    ARG_FIELD: "{{ args.field }}"
    ARG_FILE: "{{ args.file }}"
    ARG_MODE: "{{ args.mode }}"
    ARG_OPERATION_ID: "{{ args.operation_id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Stage delivery proof for a dispute
    args:
      dispute: "dp_1PqL33CZ6qsJmT1aH8sWkY2N"
      field: "cancellation_policy"
      file: "file_1PqL35CZ6qsJmT1aXo9BvTqL"
      mode: "test"
      operation_id: "emisar-2026-09-11-a1b2c3"
