schema_version: 1
id: stripe.event
title: Show event
kind: script
risk: low
description: "Show one Stripe event with selected diagnostic fields. Returns identifiers and state without raw metadata, client secrets, or signed URLs."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "evt_ identifier returned by a Stripe read."
    validation: {"pattern":"^evt_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [event]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
