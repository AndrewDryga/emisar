schema_version: 1
id: stripe.subscription_items
title: List subscription items
kind: script
risk: low
description: "List one page of subscription items with useful billing links and continuation. "
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: subscription
    type: string
    required: true
    description: "sub_ identifier returned by a Stripe read."
    validation: {"pattern":"^sub_[A-Za-z0-9]+$","max_length":255}
  - name: limit
    type: integer
    required: false
    description: "Records in one bounded page; at most ten to keep the projected result within the 64 KiB output limit."
    default: 10
    validation: {"min":1,"max":10}
  - name: cursor
    type: string
    required: false
    description: "Use pagination.next_cursor from the preceding page; keep filters unchanged."
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [subscription_items]
  env:
    ARG_SUBSCRIPTION: "{{ args.subscription }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_CURSOR: "{{ args.cursor }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
