schema_version: 1
id: stripe.payment_methods
title: List customer payment methods
kind: script
risk: low
description: "List one page of customer payment methods with useful billing links and continuation. Card output is limited to brand, last four digits, expiry, and verification results."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: customer
    type: string
    required: true
    description: "cus_ identifier returned by a Stripe read."
    validation: {"pattern":"^cus_[A-Za-z0-9]+$","max_length":255}
  - name: type
    type: string
    required: false
    description: "Optional payment method family."
    default: ""
    validation: {"enum":["","card","us_bank_account","sepa_debit","bacs_debit","au_becs_debit","paypal"]}
  - name: limit
    type: integer
    required: false
    description: "Records in one bounded page; at most ten to keep the projected result within the 64 KiB output limit."
    default: 10
    validation: {"min":1,"max":10}
  - name: page_cursor
    type: string
    required: false
    description: Opaque continuation cursor from the previous result. Pass the token that result returned, with the other arguments unchanged.
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [payment_methods]
  env:
    ARG_CUSTOMER: "{{ args.customer }}"
    ARG_TYPE: "{{ args.type }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_PAGE_CURSOR: "{{ args.page_cursor }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Check which card a customer has on file
    args:
      customer: "cus_QhT4mKpR2xVbLa"
