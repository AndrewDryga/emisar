schema_version: 1
id: stripe.cancel_subscription
title: Cancel a subscription immediately
kind: script
risk: high
description: "Cancel an existing subscription immediately. Explicit invoice_now and prorate choices can create a final invoice or credit. DELETE has no Stripe idempotency support; inspect state after an uncertain response."
side_effects: ["Changes the named customer's billing or dispute state; approval is required under the default policy.","Sends at most one write request; after an ambiguous failure investigate provider state before another correction."]
args:
  - name: subscription
    type: string
    required: true
    description: "sub_ identifier returned by a Stripe read."
    validation: {"pattern":"^sub_[A-Za-z0-9]+$","max_length":255}
  - name: invoice_now
    type: boolean
    required: true
    description: "Issue a final invoice for usage and pending prorations."
  - name: prorate
    type: boolean
    required: true
    description: "Create prorations for the remaining period."
  - name: mode
    type: string
    required: true
    description: "Explicitly approve the runner's configured Stripe mode."
    validation: {"enum":["test","live"]}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [cancel_subscription]
  env:
    ARG_SUBSCRIPTION: "{{ args.subscription }}"
    ARG_INVOICE_NOW: "{{ args.invoice_now }}"
    ARG_PRORATE: "{{ args.prorate }}"
    ARG_MODE: "{{ args.mode }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Cancel a subscription after a chargeback
    args:
      subscription: "sub_1PqL31CZ6qsJmT1aT5cFyLw3"
      invoice_now: false
      prorate: false
      mode: "test"
