schema_version: 1
id: stripe.create_credit_note
title: Issue a credit note
kind: script
risk: high
description: "Reduce the invoice amount and apply the explicitly approved post-payment credit, refund, or external-refund allocation. Suppresses the credit-note email."
side_effects: ["Changes the named customer's billing or dispute state; approval is required under the default policy.","Sends at most one write request; after an ambiguous failure investigate provider state before another correction."]
args:
  - name: invoice
    type: string
    required: true
    description: "in_ identifier returned by a Stripe read."
    validation: {"pattern":"^in_[A-Za-z0-9]+$","max_length":255}
  - name: amount
    type: integer
    required: true
    description: "Amount in the currency's smallest unit, explicitly approved; maximum eight digits."
    validation: {"min":1,"max":99999999}
  - name: currency
    type: string
    required: true
    description: "Approved lowercase currency of the invoice."
    validation: {"pattern":"^[a-z]{3}$","max_length":3}
  - name: existing_refund
    type: string
    required: false
    description: "Optional already-issued refund to allocate without creating another refund."
    default: ""
    validation: {"pattern":"^(re_[A-Za-z0-9]+)?$","max_length":255}
  - name: existing_refund_amount
    type: integer
    required: false
    description: "Amount allocated from the existing refund; must be positive when an existing_refund is specified."
    default: 0
    validation: {"min":0,"max":99999999}
  - name: reason
    type: string
    required: true
    description: "Credit note reason."
    validation: {"enum":["duplicate","fraudulent","order_change","product_unsatisfactory"]}
  - name: credit_amount
    type: integer
    required: false
    description: "Post-payment portion credited to the customer's balance."
    default: 0
    validation: {"min":0,"max":99999999}
  - name: refund_amount
    type: integer
    required: false
    description: "Post-payment portion refunded to the original payment method."
    default: 0
    validation: {"min":0,"max":99999999}
  - name: out_of_band_amount
    type: integer
    required: false
    description: "Post-payment portion refunded outside Stripe; must have been paid externally."
    default: 0
    validation: {"min":0,"max":99999999}
  - name: mode
    type: string
    required: true
    description: "Explicitly approve the runner's configured Stripe mode."
    validation: {"enum":["test","live"]}
  - name: operation_id
    type: string
    required: true
    description: "Stable correction identifier for Stripe Idempotency-Key. Reuse with identical parameters within the provider's retention window (at least 24 hours); reconcile before retrying later."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._:-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [create_credit_note]
  env:
    ARG_INVOICE: "{{ args.invoice }}"
    ARG_AMOUNT: "{{ args.amount }}"
    ARG_CURRENCY: "{{ args.currency }}"
    ARG_EXISTING_REFUND: "{{ args.existing_refund }}"
    ARG_EXISTING_REFUND_AMOUNT: "{{ args.existing_refund_amount }}"
    ARG_REASON: "{{ args.reason }}"
    ARG_CREDIT_AMOUNT: "{{ args.credit_amount }}"
    ARG_REFUND_AMOUNT: "{{ args.refund_amount }}"
    ARG_OUT_OF_BAND_AMOUNT: "{{ args.out_of_band_amount }}"
    ARG_MODE: "{{ args.mode }}"
    ARG_OPERATION_ID: "{{ args.operation_id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Credit an invoice for a service outage
    args:
      invoice: "in_1PqL2yCZ6qsJmT1aR4dGpZ8W"
      amount: 2500
      currency: "usd"
      reason: "duplicate"
      mode: "test"
      operation_id: "emisar-2026-09-11-a1b2c3"
