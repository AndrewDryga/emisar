schema_version: 1
id: stripe.invoice
title: Show invoice
kind: script
risk: low
description: "Show one Stripe invoice with selected diagnostic fields. Returns identifiers and state without raw metadata, client secrets, or signed URLs."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "in_ identifier returned by a Stripe read."
    validation: {"pattern":"^in_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [invoice]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Open the invoice a customer is asking about
    args:
      id: "in_1PqL2yCZ6qsJmT1aR4dGpZ8W"
