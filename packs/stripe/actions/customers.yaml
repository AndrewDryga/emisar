schema_version: 1
id: stripe.customers
title: List customers
kind: script
risk: medium
description: "List one page of Stripe customers with linkage, amounts, statuses, and an explicit continuation. Retrieve a returned ID for full diagnostics."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: email
    type: string
    required: false
    description: "Exact, case-sensitive customer email; blank lists all customers."
    sensitive: true
    default: ""
    validation: {"pattern":"^[^\\r\\n]*$","max_length":320}
  - name: created_gte
    type: integer
    required: false
    description: "Inclusive Unix timestamp lower bound; 0 omits the filter."
    default: 0
    validation: {"min":0,"max":999999999999}
  - name: created_lte
    type: integer
    required: false
    description: "Inclusive Unix timestamp upper bound; 0 omits the filter."
    default: 0
    validation: {"min":0,"max":999999999999}
  - name: limit
    type: integer
    required: false
    description: "Records in one bounded page; at most ten to keep the projected result within the 64 KiB output limit."
    default: 10
    validation: {"min":1,"max":10}
  - name: page_cursor
    type: string
    required: false
    description: Opaque continuation cursor from the previous result. Pass the token that result returned, with the other arguments unchanged.
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [customers]
  env:
    ARG_EMAIL: "{{ args.email }}"
    ARG_CREATED_GTE: "{{ args.created_gte }}"
    ARG_CREATED_LTE: "{{ args.created_lte }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_PAGE_CURSOR: "{{ args.page_cursor }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
