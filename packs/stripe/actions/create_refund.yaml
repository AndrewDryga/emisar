schema_version: 1
id: stripe.create_refund
title: Issue a refund
kind: script
risk: high
description: "Refund an explicit amount from one charge to the original payment method. Does not cancel the subscription. A fraudulent reason also adds the card and email to Stripe Radar block lists; Connect flags move additional funds."
side_effects: ["Changes the named customer's billing or dispute state; approval is required under the default policy.","Sends at most one write request; after an ambiguous failure investigate provider state before another correction."]
args:
  - name: charge
    type: string
    required: true
    description: "ch_ identifier returned by a Stripe read."
    validation: {"pattern":"^ch_[A-Za-z0-9]+$","max_length":255}
  - name: amount
    type: integer
    required: true
    description: "Amount in the currency's smallest unit, explicitly approved; maximum eight digits."
    validation: {"min":1,"max":99999999}
  - name: currency
    type: string
    required: true
    description: "Three-letter lowercase currency; must match the investigated payment."
    validation: {"pattern":"^[a-z]{3}$","max_length":3}
  - name: reason
    type: string
    required: true
    description: "Provider refund reason."
    validation: {"enum":["duplicate","fraudulent","requested_by_customer"]}
  - name: reverse_transfer
    type: boolean
    required: false
    description: "Reverse the proportional Connect transfer as part of the refund."
    default: false
  - name: refund_application_fee
    type: boolean
    required: false
    description: "Refund the proportional Connect application fee."
    default: false
  - name: mode
    type: string
    required: true
    description: "Explicitly approve the runner's configured Stripe mode."
    validation: {"enum":["test","live"]}
  - name: operation_id
    type: string
    required: true
    description: "Stable correction identifier for Stripe Idempotency-Key. Reuse with identical parameters within the provider's retention window (at least 24 hours); reconcile before retrying later."
    validation: {"pattern":"^[A-Za-z0-9][A-Za-z0-9._:-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [create_refund]
  env:
    ARG_CHARGE: "{{ args.charge }}"
    ARG_AMOUNT: "{{ args.amount }}"
    ARG_CURRENCY: "{{ args.currency }}"
    ARG_REASON: "{{ args.reason }}"
    ARG_REVERSE_TRANSFER: "{{ args.reverse_transfer }}"
    ARG_REFUND_APPLICATION_FEE: "{{ args.refund_application_fee }}"
    ARG_MODE: "{{ args.mode }}"
    ARG_OPERATION_ID: "{{ args.operation_id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
