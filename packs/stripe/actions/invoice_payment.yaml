schema_version: 1
id: stripe.invoice_payment
title: Show invoice payment
kind: script
risk: low
description: "Show one Stripe invoice payment with selected diagnostic fields. Returns identifiers and state without raw metadata, client secrets, or signed URLs."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "inpay_ identifier returned by a Stripe read."
    validation: {"pattern":"^inpay_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [invoice_payment]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Trace one payment against an invoice
    args:
      id: "inpay_1PqL2vCZ6qsJmT1aK7dQxRnM"
