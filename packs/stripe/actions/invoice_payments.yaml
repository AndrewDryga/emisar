schema_version: 1
id: stripe.invoice_payments
title: List invoice payments
kind: script
risk: low
description: "List one page of invoice payments with useful billing links and continuation. "
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: invoice
    type: string
    required: true
    description: "in_ identifier returned by a Stripe read."
    validation: {"pattern":"^in_[A-Za-z0-9]+$","max_length":255}
  - name: status
    type: string
    required: false
    description: "Optional payment status."
    default: ""
    validation: {"enum":["","open","paid","canceled"]}
  - name: limit
    type: integer
    required: false
    description: "Records in one bounded page; at most ten to keep the projected result within the 64 KiB output limit."
    default: 10
    validation: {"min":1,"max":10}
  - name: page_cursor
    type: string
    required: false
    description: Opaque continuation cursor from the previous result. Pass the token that result returned, with the other arguments unchanged.
    default: ""
    validation: {"pattern":"^[A-Za-z0-9_-]*$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [invoice_payments]
  env:
    ARG_INVOICE: "{{ args.invoice }}"
    ARG_STATUS: "{{ args.status }}"
    ARG_LIMIT: "{{ args.limit }}"
    ARG_PAGE_CURSOR: "{{ args.page_cursor }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: See every payment attempt on an invoice
    args:
      invoice: "in_1PqL2yCZ6qsJmT1aR4dGpZ8W"
