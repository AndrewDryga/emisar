schema_version: 1
id: stripe.charge
title: Show charge
kind: script
risk: low
description: "Show one Stripe charge with selected diagnostic fields. Returns identifiers and state without raw metadata, client secrets, or signed URLs."
side_effects: ["Reads bounded billing information from Stripe."]
args:
  - name: id
    type: string
    required: true
    description: "ch_ identifier returned by a Stripe read."
    validation: {"pattern":"^ch_[A-Za-z0-9]+$","max_length":255}
execution:
  script: {path: scripts/stripe.py, interpreter: python3}
  argv: [charge]
  env:
    ARG_ID: "{{ args.id }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Look up the charge behind a customer complaint
    args:
      id: "ch_3PqL2xCZ6qsJmT1a0KdXbYnQ"
