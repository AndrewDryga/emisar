  - actions/nodetool_cleanup.yaml
  - actions/nodetool_verify.yaml
  - actions/nodetool_compact.yaml
  - actions/nodetool_stop_compaction.yaml
  - actions/nodetool_garbagecollect.yaml
  - actions/nodetool_scrub.yaml
  - actions/nodetool_upgradesstables.yaml
  - actions/nodetool_relocatesstables.yaml
