  - actions/nodetool_enableautocompaction.yaml
  # Hints + batchlog
  - actions/nodetool_listpendinghints.yaml
  - actions/nodetool_pausehandoff.yaml
  - actions/nodetool_resumehandoff.yaml
  - actions/nodetool_disablehandoff.yaml
  - actions/nodetool_enablehandoff.yaml
