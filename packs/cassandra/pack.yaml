  - actions/nodetool_refresh.yaml
  - actions/nodetool_refreshsizeestimates.yaml
  - actions/nodetool_reloadlocalschema.yaml
  - actions/nodetool_reloadseeds.yaml
  - actions/nodetool_reloadssl.yaml
  # Compaction switches
