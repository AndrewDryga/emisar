schema_version: 1

id: cassandra
name: Cassandra operations
version: 0.6.0
retired_below: 0.4.10
description: >
  Deep Cassandra ops via nodetool + cqlsh: topology (status, ring,
  gossip, describering, failure detector), health (tpstats, netstats,
  proxy + table histograms, compaction stats + history, GC, clients, hot
  and large partitions, tombstones), schema introspection down to one
  table, effective runtime configuration, approval-gated data reads,
  runtime limits a running node accepts without a restart (stream and
  inter-datacenter throughput, compaction, hints, batchlog replay,
  snapshots, request timeouts, caches, stage concurrency, tracing),
  switches for compaction, hints, and backup, maintenance mutators
  (snapshot, flush, cleanup, verify, compact, scrub, garbage collect,
  upgrade + relocate SSTables, cache invalidation), repair workflows,
  node lifecycle (drain, decommission, assassinate, removenode, rebuild,
  bootstrap resume), default-denied native transport and gossip
  switches, and logging level control. JMX on 127.0.0.1:7199.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os:
    - linux
  binaries:
    - nodetool
    - bash

# `emisar pack suggest` detection — default process names / ports.
detect:
  binaries:
    - nodetool
    - cqlsh
  processes:
    - CassandraDaemon
  ports:
    - 9042

setup:
  summary: >
    nodetool actions connect to the local node's JMX port (127.0.0.1:7199 by
    default, set per call) and take no credentials. cqlsh actions read
    CQLSH_HOST and CQLSH_PORT on the runner host (defaulting to 127.0.0.1:9042)
    and authenticate, when the cluster requires it, from ~/.cassandra/cqlshrc.
  env:
    - name: CQLSH_HOST
      description: Host for the cqlsh actions (schema/keyspace/role introspection).
      default: 127.0.0.1
    - name: CQLSH_PORT
      description: Native CQL port for the cqlsh actions.
      default: "9042"
  notes:
    - nodetool host/port come from each action's args (default 127.0.0.1:7199), not the environment; this pack passes no JMX username/password, so it works only against a node without JMX auth.
    - "cqlsh credentials belong in ~/.cassandra/cqlshrc (with a [authentication] username/password) on the runner host — read from disk, so it needs no inherit_env entry; the actions pass no -u/-p."
    - Lifecycle and maintenance mutators (repair, drain, decommission, assassinate, removenode, cleanup, compact) are cluster-affecting; run the read actions first.
    - The runtime limit actions change one node and take effect at once, but a restart returns it to cassandra.yaml — after any node restart, read the limits back and set them again.
  verify: cassandra.nodetool_status

actions:
  # Topology / cluster state
  - actions/nodetool_status.yaml
  - actions/nodetool_describecluster.yaml
  - actions/nodetool_info.yaml
  - actions/nodetool_version.yaml
  - actions/nodetool_gossipinfo.yaml
  - actions/nodetool_ring.yaml
  - actions/nodetool_failuredetector.yaml
  - actions/nodetool_describering.yaml
  # Health
  - actions/nodetool_tpstats.yaml
  - actions/nodetool_netstats.yaml
  - actions/nodetool_proxyhistograms.yaml
  - actions/nodetool_tablehistograms.yaml
  - actions/nodetool_tablestats.yaml
  - actions/nodetool_compactionstats.yaml
  - actions/nodetool_compactionhistory.yaml
  - actions/nodetool_gcstats.yaml
  - actions/nodetool_clientstats.yaml
  - actions/nodetool_datapaths.yaml
  - actions/nodetool_getsstables.yaml
  - actions/nodetool_toppartitions.yaml
  - actions/nodetool_viewbuildstatus.yaml
  - actions/cqlsh_largest_partitions.yaml
  - actions/cqlsh_tombstones_per_read.yaml
  - actions/analyze_disk_pressure.yaml
  # Runtime limits — read and change on a running node
  - actions/nodetool_getcompactionthroughput.yaml
  - actions/nodetool_setcompactionthroughput.yaml
  - actions/nodetool_getconcurrentcompactors.yaml
  - actions/nodetool_setconcurrentcompactors.yaml
  - actions/nodetool_getcompactionthreshold.yaml
  - actions/nodetool_setcompactionthreshold.yaml
  - actions/nodetool_getstreamthroughput.yaml
  - actions/nodetool_setstreamthroughput.yaml
  - actions/nodetool_getinterdcstreamthroughput.yaml
  - actions/nodetool_setinterdcstreamthroughput.yaml
  - actions/nodetool_getmaxhintwindow.yaml
  - actions/nodetool_setmaxhintwindow.yaml
  - actions/nodetool_sethintedhandoffthrottlekb.yaml
  - actions/nodetool_getbatchlogreplaythrottle.yaml
  - actions/nodetool_setbatchlogreplaythrottle.yaml
  - actions/nodetool_getsnapshotthrottle.yaml
  - actions/nodetool_setsnapshotthrottle.yaml
  - actions/nodetool_gettimeout.yaml
  - actions/nodetool_settimeout.yaml
  - actions/nodetool_getconcurrency.yaml
  - actions/nodetool_setconcurrency.yaml
  - actions/nodetool_getconcurrentviewbuilders.yaml
  - actions/nodetool_setconcurrentviewbuilders.yaml
  - actions/nodetool_setcachecapacity.yaml
  - actions/nodetool_gettraceprobability.yaml
  - actions/nodetool_settraceprobability.yaml
  # Configuration as the node is running it
