  - actions/nodetool_invalidatecredentialscache.yaml
  - actions/nodetool_invalidatepermissionscache.yaml
  - actions/nodetool_invalidaterolescache.yaml
  # Repair
  - actions/nodetool_repair.yaml
  - actions/nodetool_repair_admin_list.yaml
  - actions/cqlsh_repair_history.yaml
  # Lifecycle
  - actions/nodetool_drain.yaml
  - actions/nodetool_decommission.yaml
  - actions/nodetool_assassinate.yaml
  - actions/nodetool_removenode.yaml
