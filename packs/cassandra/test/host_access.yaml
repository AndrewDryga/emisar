recipes:
  - access: 0
    recipe: 0
    fixture: debian
    action: cassandra.analyze_disk_pressure
    prepare:
      - install -d -o root -g cassandra -m 0750 /etc/cassandra '/srv/cassandra data one/proof' '/srv/cassandra data two/proof' '/srv/cassandra commitlog/proof'
      - >-
        printf 'data_file_directories:\n  - "/srv/cassandra data one"\n  - "/srv/cassandra data two"\ncommitlog_directory: "/srv/cassandra commitlog"\n'
        > /etc/cassandra/cassandra.yaml && chown root:cassandra /etc/cassandra/cassandra.yaml && chmod 0640 /etc/cassandra/cassandra.yaml
    recreate:
      - rmdir -- '/srv/cassandra data one/proof' '/srv/cassandra data two/proof' '/srv/cassandra commitlog/proof' && install -d -o root -g cassandra -m 0750 '/srv/cassandra data one/proof' '/srv/cassandra data two/proof' '/srv/cassandra commitlog/proof'
    probe: test -r /etc/cassandra/cassandra.yaml && test -r '/srv/cassandra data one/proof' && test -x '/srv/cassandra data one/proof' && test -r '/srv/cassandra data two/proof' && test -x '/srv/cassandra data two/proof' && test -r '/srv/cassandra commitlog/proof' && test -x '/srv/cassandra commitlog/proof'
