services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/cassandra/test
      dockerfile: Dockerfile
      target: client
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-5.0.8}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-cassandra-tools:latest
    network_mode: service:cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra:ro

  cassandra:
    build:
      context: ${EMISAR_ROOT}/packs/cassandra/test
      dockerfile: Dockerfile
      target: sut
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-5.0.8}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-cassandra-sut:latest
    environment:
      CASSANDRA_CLUSTER_NAME: packtest
      # The image defaults listen (and therefore broadcast) address to the
      # container's bridge IP, which the network assigns fresh on every run, so
      # any case asserting the node's own address could only match by accident.
      # A single node with replication_factor 1 gossips with nobody, and
      # runner-tools shares its network namespace, so loopback is both reachable
      # and stable.
      CASSANDRA_LISTEN_ADDRESS: 127.0.0.1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nodetool status | grep -q UN &&
          (cqlsh -u cassandra -p packtest-canary-cassandra-49ab -e "CREATE KEYSPACE IF NOT EXISTS packtest WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
          CREATE TABLE IF NOT EXISTS packtest.events (id int PRIMARY KEY, value text);
          INSERT INTO packtest.events (id, value) VALUES (1, 'ready');" >/dev/null ||
          (cqlsh -u cassandra -p cassandra -e "ALTER ROLE cassandra WITH PASSWORD = 'packtest-canary-cassandra-49ab';
          CREATE KEYSPACE IF NOT EXISTS packtest WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
          CREATE TABLE IF NOT EXISTS packtest.events (id int PRIMARY KEY, value text);
          INSERT INTO packtest.events (id, value) VALUES (1, 'ready');" >/dev/null && exit 1))
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 10s
      retries: 30
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  cassandra_data:
