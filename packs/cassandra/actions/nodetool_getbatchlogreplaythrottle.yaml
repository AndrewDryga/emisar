schema_version: 1
id: cassandra.nodetool_getbatchlogreplaythrottle
title: nodetool getbatchlogreplaythrottle
kind: exec
risk: low
description: Show the current batchlog replay throttle in KiB/s.
side_effects: ["One JMX call.", "Read-only."]
args: []
execution:
  command: {binary: nodetool, argv: ["getbatchlogreplaythrottle"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 1024
  max_stderr_bytes: 8192
examples:
  - title: Current batchlog replay throttle
    args: {}
