schema_version: 1
id: cassandra.cqlsh_largest_partitions
title: cqlsh -e "SELECT * FROM system_views.max_partition_size"
kind: exec
risk: low
description: >
  List each table's largest partition on this node, in mebibytes — the read that
  finds the wide partition behind slow reads, timeouts, or heap pressure.
side_effects: ["One CQL query against a virtual table.", "Read-only."]
args:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Rows to return.
    validation:
      min: 1
      max: 500
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "exec cqlsh -e \"SELECT keyspace_name, table_name, mebibytes FROM system_views.max_partition_size LIMIT $1;\" \"${CQLSH_HOST:-127.0.0.1}\" \"${CQLSH_PORT:-9042}\""
      - "emisar"
      - "{{ args.limit }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Largest partition per table
    args: {}
