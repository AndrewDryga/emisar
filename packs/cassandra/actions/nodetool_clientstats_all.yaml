schema_version: 1
id: cassandra.nodetool_clientstats_all
title: List client connections
kind: exec
risk: low
description: >
  List this node's connections with address, authenticated user, keyspace,
  protocol, request count, driver name and driver version using
  `nodetool clientstats --all`. Exclude client options and credentials.
side_effects: ["One JMX call.", "Read-only."]
args: []
execution:
  command: {binary: nodetool, argv: ["clientstats", "--all"]}
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Connected clients by address and driver
    args: {}
