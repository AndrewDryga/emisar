schema_version: 1
id: cassandra.nodetool_gettimeout
title: nodetool gettimeout <type>
kind: exec
risk: low
description: Show one of this node's request or internode timeouts, in milliseconds.
side_effects: ["One JMX call.", "Read-only."]
args:
  - name: timeout_type
    type: string
    required: true
    description: Timeout to read.
    validation:
      enum:
        - "read"
        - "range"
        - "write"
        - "counterwrite"
        - "cascontention"
        - "truncate"
        - "internodeconnect"
        - "internodeuser"
        - "internodestreaminguser"
        - "misc"
execution:
  command: {binary: nodetool, argv: ["gettimeout", "{{ args.timeout_type }}"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 1024
  max_stderr_bytes: 8192
examples:
  - title: Current read timeout
    args:
      timeout_type: "read"
