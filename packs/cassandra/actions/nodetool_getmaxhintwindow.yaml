schema_version: 1
id: cassandra.nodetool_getmaxhintwindow
title: nodetool getmaxhintwindow
kind: exec
risk: low
description: Show how long this node keeps writing hints for an unreachable peer, in milliseconds.
side_effects: ["One JMX call.", "Read-only."]
args: []
execution:
  command: {binary: nodetool, argv: ["getmaxhintwindow"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 1024
  max_stderr_bytes: 8192
examples:
  - title: Current hint window
    args: {}
