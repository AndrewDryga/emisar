schema_version: 1
id: cassandra.cqlsh_list_tables
title: cqlsh -e "SELECT table_name FROM system_schema.tables"
kind: exec
risk: low
description: >
  List the tables in one keyspace by name — the cheap look-up before
  cassandra.cqlsh_describe_table, without the full DDL that
  cassandra.cqlsh_describe_keyspace dumps.
side_effects: ["One CQL query.", "Read-only."]
args:
  - name: keyspace
    type: string
    required: true
    description: Keyspace to list.
    validation:
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,47}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "exec cqlsh -e \"SELECT table_name FROM system_schema.tables WHERE keyspace_name = '$1';\" \"${CQLSH_HOST:-127.0.0.1}\" \"${CQLSH_PORT:-9042}\""
      - "emisar"
      - "{{ args.keyspace }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Tables in a keyspace
    args:
      keyspace: valorant_ks
