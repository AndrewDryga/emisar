schema_version: 1
id: cassandra.nodetool_invalidatecredentialscache
title: nodetool invalidatecredentialscache
kind: exec
risk: medium
description: >
  Drop this node's cached credentials so a changed or revoked password takes
  effect now instead of when the cache expires. Needs PasswordAuthenticator.
side_effects:
  - The next authentication for each role reads from the auth keyspace, so sign-ins are briefly slower.
  - Sessions already authenticated are not disconnected.
args: []
execution:
  command: {binary: nodetool, argv: ["invalidatecredentialscache"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Apply a password change now
    args: {}
