schema_version: 1
id: cassandra.nodetool_gcstats
title: nodetool gcstats
kind: exec
risk: low
description: >
  Show garbage-collection statistics since the last call — pause counts, max and
  total elapsed time, and memory reclaimed. Long pauses here explain client
  timeouts that the latency histograms alone do not.
side_effects:
  - One JMX call.
  - Read-only.
  - Counters reset on read, so each call reports the interval since the previous one.
args: []
execution:
  command: {binary: nodetool, argv: ["gcstats"]}
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: GC since the last read
    args: {}
