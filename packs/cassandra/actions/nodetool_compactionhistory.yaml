schema_version: 1
id: cassandra.nodetool_compactionhistory
title: Show recent compactions
kind: script
risk: low
description: >
  List the newest compactions with keyspace, table, time, bytes in/out and
  merged-row counts. Fetch the full native history and display up to the limit,
  with showing N of M. Long lines are visibly clipped to 512 UTF-8 bytes so
  1000 records plus headers and the count fit the 512 KiB output budget.
  The limit bounds display, not the backend query or captured history size.
side_effects: ["One JMX call.", "Read-only."]
args:
  - name: limit
    type: integer
    required: false
    default: 20
    description: Maximum records to display, up to 1000 within the per-run output budget.
    validation: {min: 1, max: 1000}
execution:
  script:
    path: scripts/nodetool_compactionhistory.sh
    interpreter: /bin/bash
  argv: ["{{ args.limit }}"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Recent compactions
    args: {}
