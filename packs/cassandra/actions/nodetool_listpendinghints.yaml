schema_version: 1
id: cassandra.nodetool_listpendinghints
title: nodetool listpendinghints
kind: exec
risk: low
description: >
  List the hints this node is holding for peers that were unreachable — how much
  replay is waiting, and for whom. Reports plainly when there are none.
side_effects: ["One JMX call.", "Read-only."]
args: []
execution:
  command: {binary: nodetool, argv: ["listpendinghints"]}
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Hints waiting to replay
    args: {}
