schema_version: 1
id: cassandra.nodetool_clientstats
title: Count connected clients by user
kind: exec
risk: low
description: >
  Count this node's connected clients by authenticated user, with the total.
  Use cassandra.nodetool_clientstats_all for connection addresses and drivers.
side_effects: ["One JMX call.", "Read-only."]
args: []
execution:
  command: {binary: nodetool, argv: ["clientstats"]}
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Connected clients
    args: {}
