schema_version: 1
id: cassandra.nodetool_setinterdcstreamthroughput
title: nodetool setinterdcstreamthroughput <value>
kind: exec
risk: medium
description: >
  Set this node's cross-datacenter streaming cap — the rate it sends SSTable
  data to peers in other datacenters during rebuild, bootstrap, and repair.
  Protects a shared or metered inter-datacenter link while local streaming keeps
  its own cap from cassandra.nodetool_setstreamthroughput. 0 disables throttling.
side_effects:
  - Applies immediately, to streams already in flight as well as new ones.
  - A cap under the current rate slows a running cross-datacenter rebuild; 0 lets it saturate the link.
  - Runtime-only — a restart returns the node to its cassandra.yaml value.
args:
  - name: value
    type: integer
    required: true
    description: 'Cap in the unit named by cap; 0 disables throttling.'
    validation:
      min: 0
      max: 100000
  - name: cap
    type: string
    required: false
    default: stream_megabits
    description: >
      Which cap to set, and in which unit. stream_megabits is nodetool's own
      default (Mb/s); stream_mib is the same cap in MiB/s; entire_sstable_mib is
      the separate zero-copy entire-SSTable cap, which is always MiB/s.
    validation:
      enum: ["stream_megabits", "stream_mib", "entire_sstable_mib"]
execution:
  command:
    binary: /bin/sh
    # nodetool reads the value as megabits unless -m says MiB/s, and -e sets a
    # different cap (zero-copy entire-SSTable streaming, always MiB/s) that
    # nodetool refuses to combine with -m. One enum arg names exactly one legal
    # combination; the value itself arrives through the environment.
    argv:
      - "-c"
      - |
        case "$CAP" in
          stream_megabits) flag="" ;;
          stream_mib) flag="-m" ;;
          entire_sstable_mib) flag="-e" ;;
          *) printf 'unsupported cap: %s\n' "$CAP" >&2; exit 2 ;;
        esac
        exec nodetool setinterdcstreamthroughput $flag -- "$VALUE"
  env:
    VALUE: "{{ args.value }}"
    CAP: "{{ args.cap }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Hold cross-datacenter streaming to 800 Mb/s
    args:
      value: 800
  - title: Hold cross-datacenter streaming to 40 MiB/s
    args:
      value: 40
      cap: "stream_mib"
