schema_version: 1

id: cassandra.analyze_disk_pressure
title: Analyze Cassandra disk pressure
kind: script
risk: low

description: >
  Show filesystem usage and sizes for every data directory and the commitlog
  directory in the selected cassandra.yaml. Include a separately configured
  local system data directory. Show up to 20 largest immediate entries per
  data root and, optionally, one literal keyspace's tables. Return metadata,
  not file contents. Missing configuration, unsupported storage syntax,
  unavailable roots or measurement failures fail the read without a root-disk
  fallback. This is selected local configuration, not proof of the running
  JVM's effective configuration.

side_effects:
  - Reads filesystem metadata (df, du counts).
  - Does not modify Cassandra data or configuration.
  - Reads the complete selected configuration file, capped at 1 MiB, without returning its contents.

search_terms:
  - disk full
  - running out of space

args:
  - name: keyspace_filter
    type: string
    required: false
    default: ""
    description: Optional literal keyspace name, up to Cassandra's 48 ASCII word characters; no glob patterns.
    validation:
      max_length: 48
      pattern: "^[A-Za-z0-9_]{0,48}$"

execution:
  script:
    path: scripts/analyze_disk_pressure.sh
    interpreter: /bin/bash
  argv:
    - "--keyspace-filter"
    - "{{ args.keyspace_filter }}"
  timeout: 60s
  cwd: /

output:
  parser: text
  max_stdout_bytes: 1048576
  max_stderr_bytes: 65536

examples:
  - title: Analyze without keyspace filter
    args: {}
