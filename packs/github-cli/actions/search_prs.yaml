schema_version: 1
id: gh.search_prs
title: gh search prs
kind: script
risk: low
description: Search PRs across GitHub with separate query terms and a caller limit of up to 100 results per bounded response.
side_effects:
  - One API call.
  - Read-only.
args:
  - name: query
    type: string_array
    required: true
    description: 'One term per element, e.g. ["repo:owner/name", "author:foo", "state:open"]. Keep a qualifier with spaces in one element, e.g. "label:help wanted". Empty terms are refused.'
    validation:
      max_items: 16
      max_length: 512
  - name: limit
    type: integer
    default: 100
    description: Maximum results in this response, capped at 100 to bound output.
    validation:
      min: 1
      max: 100
execution:
  script:
    path: scripts/search_prs.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.limit }}"
    - "{{ args.query }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: My open PRs
    args:
      query: ["author:@me", "state:open"]
      limit: 25
