schema_version: 1
id: gh.pr_checks
title: gh pr checks
kind: script
risk: low
description: >
  List visible checks for a captured PR head commit as JSON; failed or pending
  checks are data, not a failed query. If GitHub denies check contexts, return
  commit statuses and up to 10 Actions runs with the first 100 jobs of each
  observed attempt. Each REST collection is one page of up to 100; omitted
  rows and unavailable non-Actions checks are explicit. This is a bounded
  observation, not proof of branch-protection satisfaction or mergeability.
side_effects:
  - Multiple bounded read-only API calls (at most 15 CLI invocations in the fallback).
  - Read-only.
search_terms:
  - checks red
args:
  - name: repo
    type: string
    required: true
    description: 'Repo in owner/name form.'
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,40}/[a-zA-Z0-9_.\\-]{1,100}$"
  - name: pr
    type: integer
    required: true
    description: PR number.
    validation:
      min: 1
      max: 9999999
execution:
  script:
    path: scripts/pr_checks.sh
    interpreter: /bin/sh
  argv:
    - checks
    - "{{ args.repo }}"
    - "{{ args.pr }}"
  timeout: 90s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: PR checks
    args:
      repo: "andrewdryga/emisar"
      pr: 1
