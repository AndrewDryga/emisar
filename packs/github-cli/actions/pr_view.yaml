schema_version: 1
id: gh.pr_view
title: gh pr view
kind: script
risk: medium
description: >
  Show one PR's title, body, state, review decision and visible head-commit
  checks. The body is arbitrary application text and may contain sensitive
  data. Checks use the same bounded, explicitly partial fallback as
  gh.pr_checks when the credential cannot read check contexts; this is not
  an all-checks or mergeability verdict. An oversized JSON result fails rather
  than returning a truncated document.
side_effects:
  - Multiple bounded read-only API calls (at most 15 CLI invocations in the fallback).
  - Read-only.
args:
  - name: repo
    type: string
    required: true
    description: 'Repo in owner/name form.'
    validation:
      pattern: "^[a-zA-Z0-9_.\\-]{1,40}/[a-zA-Z0-9_.\\-]{1,100}$"
  - name: pr
    type: integer
    required: true
    description: PR number.
    validation:
      min: 1
      max: 9999999
execution:
  script:
    path: scripts/pr_checks.sh
    interpreter: /bin/sh
  argv:
    - view
    - "{{ args.repo }}"
    - "{{ args.pr }}"
  timeout: 90s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: One PR
    args:
      repo: "andrewdryga/emisar"
      pr: 1
