schema_version: 1

id: github-cli
name: GitHub CLI operations
version: 0.1.17
retired_below: 0.1.8
description: >
  GitHub introspection — PRs, issues, repos, workflow runs, releases,
  commit checks, search — plus operator actions: merge PR, close PR,
  rerun workflow, dispatch workflow. Authenticates via the runner host's
  `gh auth status` token (i.e. ~/.config/gh).
vendor: emisar
homepage: https://emisar.dev/packs/github-cli

requires:
  os:
    - linux
  binaries:
    - gh
    - jq

setup:
  summary: >
    Actions use `gh` on the runner host; PR check projections also need `jq`.
    gh authenticates with `GH_TOKEN`
    (or `GITHUB_TOKEN`) if set, otherwise with the token stored by `gh auth
    login`. Provide one of those so gh is signed in.
  env:
    - name: GH_TOKEN
      description: 'Create a token in GitHub Settings → Developer settings → Personal access tokens. Omit if the runner user is already signed in via `gh auth login`.'
  notes:
    - "[Create a fine-grained token](https://github.com/settings/personal-access-tokens/new) for the selected repositories. Grant read-only Contents, Pull requests, Issues, Actions, and Commit statuses for the corresponding reads. Organization approval may be required."
    - "PR checks first use the check contexts visible to the credential. When GitHub denies those contexts, the result falls back to Actions runs/jobs and commit statuses for the captured head commit. Non-Actions check runs are explicitly not visible in that fallback; it is not an all-checks or mergeability verdict. GitHub's fine-grained PAT Checks support varies by endpoint and is still listed as a limitation in its PAT guide."
    - "[Classic tokens](https://github.com/settings/tokens/new?scopes=repo&description=emisar%20runner) need `repo` for private repositories; that scope is not read-only. `gh auth login` stores a credential in the runner user's `~/.config/gh/hosts.yml`, rather than making the connection token-free."
    - "Merging/closing PRs requires Pull requests write; rerunning/dispatching workflows requires Actions write (dispatch also needs Contents read). Traffic (`repo_clone_count`) requires repository write access and Administration read for a fine-grained token, or `repo` for a classic token."
  verify: gh.auth_status

actions:
  # Auth + repo
  - actions/auth_status.yaml
  - actions/repo_view.yaml
  - actions/repo_clone_count.yaml
  - actions/branch_list.yaml
  - actions/release_list.yaml
  # Pull requests
  - actions/pr_list.yaml
  - actions/pr_view.yaml
  - actions/pr_checks.yaml
  - actions/search_prs.yaml
  # Issues
  - actions/issue_list.yaml
  - actions/issue_view.yaml
  # Workflows
  - actions/workflow_list.yaml
  - actions/workflow_run_list.yaml
  - actions/workflow_run_view.yaml
  - actions/workflow_run_logs.yaml
  # Mutators
  - actions/pr_merge.yaml
  - actions/pr_close.yaml
  - actions/workflow_rerun.yaml
  - actions/workflow_dispatch.yaml
