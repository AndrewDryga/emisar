services: [zookeeper, zookeeper-no-ruok]

# Four JVMs starting at once starve the NIO thread that answers four-letter
# words, and a starved one closes the connection without a reply. Each case
# boots two nodes, so cases run one at a time.
workers: 1
versions:
  - version: "7.9.10"
    digest: "@sha256:1a870111c6e861f1e6015094fac902779981edb5cb1d2ad6b7437d2a6b8ba064"
    default: true
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: zk.conf
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [clientPort, dataDir]
  - action: zk.cons
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [queued, recved]
  - action: zk.envi
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Environment, zookeeper.version]
  - action: zk.mntr
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [zk_version, zk_server_state]
  - action: zk.ruok
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [imok]
  # The node answers, but with the whitelist refusal instead of imok.
  - name: zk.ruok-fails-without-imok
    action: zk.ruok
    args: {server: "zookeeper-no-ruok:2181"}
    expect:
      status: failure
      exit: [1]
      stdout_contains: [not in the whitelist]
      stderr_contains: [zookeeper did not answer imok]
  - action: zk.srvr
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Zookeeper version, Mode]
  - action: zk.stat
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Zookeeper version, Connections]
  - action: zk.wchs
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [connections watching, Total watches]
