services: [zookeeper]

# Four JVMs starting at once starve the NIO thread that answers four-letter
# words, and a starved one closes the connection without a reply.
workers: 2
versions:
  - version: "7.9.9"
    digest: "@sha256:45c52af17d5eaea5fb7f395d7918949c71293df42da157e31e8bebd66e48127f"
    default: true
defaults:
  expect:
    stdout_not_empty: true
cases:
  - action: zk.conf
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [clientPort, dataDir]
  - action: zk.cons
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [queued, recved]
  - action: zk.envi
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Environment, zookeeper.version]
  - action: zk.mntr
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [zk_version, zk_server_state]
  - action: zk.ruok
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [imok]
  - action: zk.srvr
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Zookeeper version, Mode]
  - action: zk.stat
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [Zookeeper version, Connections]
  - action: zk.wchs
    args: {server: "zookeeper:2181"}
    expect:
      stdout_contains: [connections watching, Total watches]
