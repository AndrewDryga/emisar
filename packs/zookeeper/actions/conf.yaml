schema_version: 1
id: zk.conf
title: conf (server config)
kind: exec
risk: low
description: >
  Show the server's effective configuration via the `conf` four-letter
  word. The output is a fixed, bounded property list (client ports,
  data/log dirs and sizes, tick + session timeouts, serverId, and on
  quorum members the election/quorum ports and membership) — it discloses
  paths and topology; stock ZooKeeper does not dump zoo.cfg or arbitrary
  properties here, so auth material like `superDigest` never appears.
side_effects:
  - One 4lw command.
  - Read-only; discloses paths and topology — no secret values.
args:
  - name: server
    type: string
    required: true
    description: host:port.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-]{0,254}:[0-9]{1,5}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "S=''\"$1\"''; echo conf | nc -w 5 ${S%:*} ${S##*:}"
      - "emisar"
      - "{{ args.server }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Conf
    args:
      server: "zk1:2181"
