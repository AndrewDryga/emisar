schema_version: 1
id: zk.envi
title: envi (server env)
kind: exec
risk: low
description: >
  Show the server's JVM + OS environment via the `envi` four-letter word.
  The output is a fixed, bounded property list (zookeeper.version,
  host.name, java.version/vendor/home, class + library paths,
  java.io.tmpdir, os.*, user.name/home/dir, JVM memory totals) — it
  discloses install paths, usernames, and topology; stock ZooKeeper does
  not print arbitrary system properties or injected secret values here.
side_effects:
  - One 4lw command.
  - Read-only; discloses install paths, usernames, and topology — no secret values.
args:
  - name: server
    type: string
    required: true
    description: host:port.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-]{0,254}:[0-9]{1,5}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "S=''\"$1\"''; echo envi | nc -w 5 ${S%:*} ${S##*:}"
      - "emisar"
      - "{{ args.server }}"
  timeout: 15s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Server env
    args:
      server: "zk1:2181"
