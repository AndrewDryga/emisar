schema_version: 1
id: gcp-dataproc.cluster_details
title: Show a Dataproc cluster
kind: script
risk: low
description: Show one classic cluster's state, UUID, capacity, machine types, attached service-account
  email, image, autoscaling policy ID and deletion schedule. Return selected metadata only; arbitrary
  properties, labels, startup configuration and credentials are excluded. Free-text fields are clipped
  to their schema bounds.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 GET.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: cluster
  type: string
  required: true
  description: Exact classic Dataproc cluster name.
  validation:
    pattern: ^[a-z](?:[a-z0-9-]{0,49}[a-z0-9])?$
    max_length: 51
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - cluster_details
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.cluster }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - name
    - state
    - state_started
    - workers
    - secondary_workers
    - image
    - uuid
    - master_machine
    - worker_machine
    - zone
    - service_account
    - autoscaling_policy
    - idle_delete_ttl
    - auto_delete_time
    properties:
      name:
        type: string
        maxLength: 51
      state:
        type: string
        maxLength: 24
      state_started:
        type: string
        maxLength: 40
      workers:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 2147483647
      secondary_workers:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 2147483647
      image:
        type: string
        maxLength: 32
      uuid:
        type: string
        maxLength: 36
      master_machine:
        type: string
        maxLength: 64
      worker_machine:
        type: string
        maxLength: 64
      zone:
        type: string
        maxLength: 64
      service_account:
        type: string
        maxLength: 128
      autoscaling_policy:
        type: string
        maxLength: 50
      idle_delete_ttl:
        type: string
        maxLength: 32
      auto_delete_time:
        type: string
        maxLength: 40
examples:
- title: Show a Dataproc cluster
  args:
    project: example-prod
    region: us-central1
    cluster: analytics-20261107
