schema_version: 1
id: gcp-dataproc.job_errors
title: Read Dataproc job failure details
kind: script
risk: medium
description: Read bounded raw job failure text from status.details and the last four lifecycle states.
  Error text may contain application data or credentials and receives the runner's redaction; it
  is not a driver log fetch. Return at most 512 characters of details and count omitted history
  entries.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 GET.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: job
  type: string
  required: true
  description: Exact Dataproc job ID.
  validation:
    pattern: ^[A-Za-z0-9_-]{1,100}$
    max_length: 100
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - job_errors
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.job }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - state
    - details
    - history
    - history_omitted
    properties:
      id:
        type: string
        maxLength: 100
      state:
        type: string
        maxLength: 24
      details:
        type: string
        maxLength: 512
      history:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required:
          - state
          - started
          properties:
            state:
              type: string
              maxLength: 24
            started:
              type: string
              maxLength: 40
      history_omitted:
        type: integer
        minimum: 0
examples:
- title: Read Dataproc job failure details
  args:
    project: example-prod
    region: us-central1
    job: job-20261107
