schema_version: 1
id: gcp-dataproc.cluster_start
title: Start a Dataproc cluster
kind: script
risk: high
description: Start one stopped classic cluster guarded by its exact UUID. Return the long-running
  operation without waiting; inspect operation_details for completion. Starting resumes VM billing
  and scheduled work can resume.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 lifecycle request; no automatic polling
  or retry.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: cluster
  type: string
  required: true
  description: Exact classic Dataproc cluster name.
  validation:
    pattern: ^[a-z](?:[a-z0-9-]{0,49}[a-z0-9])?$
    max_length: 51
- name: cluster_uuid
  type: string
  required: true
  description: Exact cluster UUID from cluster_details, protecting against a deleted name being
    reused.
  validation:
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    max_length: 36
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - cluster_start
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.cluster }}'
  - '{{ args.cluster_uuid }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - done
    - cluster
    - type
    - state
    - state_started
    - error_code
    properties:
      id:
        type: string
        maxLength: 40
      done:
        type: boolean
      cluster:
        type: string
        maxLength: 51
      type:
        type: string
        maxLength: 24
      state:
        type: string
        maxLength: 24
      state_started:
        type: string
        maxLength: 40
      error_code:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 2147483647
examples:
- title: Start a Dataproc cluster
  args:
    project: example-prod
    region: us-central1
    cluster: analytics-20261107
    cluster_uuid: 9e52399f-eaa6-4fd0-a41b-d847812b356b
