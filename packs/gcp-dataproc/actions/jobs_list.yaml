schema_version: 1
id: gcp-dataproc.jobs_list
title: List Dataproc jobs
kind: script
risk: low
description: List Dataproc jobs in one region with optional exact cluster and active-state selectors.
  Return job IDs, cluster, state and job type, a continuation and the count of unreachable encrypted
  jobs. Job arguments, properties, driver output and submitted payloads are excluded.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 GET.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: page_size
  type: integer
  required: false
  default: 6
  description: Rows in one bounded result, up to six to fit the 8 KiB structured-output budget.
  validation:
    min: 1
    max: 6
- name: page_cursor
  type: string
  required: false
  default: ''
  description: Continuation from the preceding result with the same project, region and selectors.
    An omitted provider cursor requires a new query.
  validation:
    pattern: ^[A-Za-z0-9._~+/=-]*$
    max_length: 1024
- name: cluster_filter
  type: string
  required: false
  default: ''
  description: Optional exact cluster name for the server-side job selector.
  validation:
    pattern: ^(?:[a-z](?:[a-z0-9-]{0,49}[a-z0-9])?)?$
    max_length: 51
- name: state
  type: string
  required: false
  default: ALL
  description: Server-side job lifecycle selection.
  validation:
    enum:
    - ALL
    - ACTIVE
    - NON_ACTIVE
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - jobs_list
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.page_size }}'
  - '{{ args.page_cursor }}'
  - '{{ args.cluster_filter }}'
  - '{{ args.state }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - items
    - returned_count
    - omitted_in_response
    - more_available
    - next_page_cursor
    - cursor_omitted
    - unreachable_count
    properties:
      items:
        type: array
        maxItems: 6
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - cluster
          - state
          - state_started
          - type
          properties:
            id:
              type: string
              maxLength: 100
            cluster:
              type: string
              maxLength: 51
            state:
              type: string
              maxLength: 24
            state_started:
              type: string
              maxLength: 40
            type:
              type: string
              maxLength: 24
      returned_count:
        type: integer
        minimum: 0
        maximum: 6
      omitted_in_response:
        type: integer
        minimum: 0
      more_available:
        type: boolean
      next_page_cursor:
        type:
        - string
        - 'null'
        maxLength: 1024
      cursor_omitted:
        type: boolean
      unreachable_count:
        type: integer
        minimum: 0
examples:
- title: List Dataproc jobs
  args:
    project: example-prod
    region: us-central1
