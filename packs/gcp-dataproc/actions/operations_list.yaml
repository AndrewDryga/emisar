schema_version: 1
id: gcp-dataproc.operations_list
title: List Dataproc operations
kind: script
risk: low
description: List one page of regional Dataproc operations with IDs, lifecycle state, type, completion
  flag and error code. Return only selected operation metadata, never response payloads or raw error
  messages.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 GET.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: page_size
  type: integer
  required: false
  default: 6
  description: Rows in one bounded result, up to six to fit the 8 KiB structured-output budget.
  validation:
    min: 1
    max: 6
- name: page_cursor
  type: string
  required: false
  default: ''
  description: Continuation from the preceding result with the same project, region and selectors.
    An omitted provider cursor requires a new query.
  validation:
    pattern: ^[A-Za-z0-9._~+/=-]*$
    max_length: 1024
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - operations_list
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.page_size }}'
  - '{{ args.page_cursor }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - items
    - returned_count
    - omitted_in_response
    - more_available
    - next_page_cursor
    - cursor_omitted
    - unreachable_count
    properties:
      items:
        type: array
        maxItems: 6
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - done
          - cluster
          - type
          - state
          - state_started
          - error_code
          properties:
            id:
              type: string
              maxLength: 40
            done:
              type: boolean
            cluster:
              type: string
              maxLength: 51
            type:
              type: string
              maxLength: 24
            state:
              type: string
              maxLength: 24
            state_started:
              type: string
              maxLength: 40
            error_code:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 2147483647
      returned_count:
        type: integer
        minimum: 0
        maximum: 6
      omitted_in_response:
        type: integer
        minimum: 0
      more_available:
        type: boolean
      next_page_cursor:
        type:
        - string
        - 'null'
        maxLength: 1024
      cursor_omitted:
        type: boolean
      unreachable_count:
        type: integer
        minimum: 0
examples:
- title: List Dataproc operations
  args:
    project: example-prod
    region: us-central1
