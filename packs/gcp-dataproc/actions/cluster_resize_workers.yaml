schema_version: 1
id: gcp-dataproc.cluster_resize_workers
title: Resize Dataproc primary workers
kind: script
risk: high
description: Resize only the primary worker count on one RUNNING classic cluster. Patch config.worker_config.num_instances
  and no other field. Shrinking can interrupt work after the graceful deadline; growing incurs VM
  charges. An attached autoscaling policy can change capacity again. Return the operation without
  waiting; inspect operation_details for completion.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 lifecycle request; no automatic polling
  or retry.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: cluster
  type: string
  required: true
  description: Exact classic Dataproc cluster name.
  validation:
    pattern: ^[a-z](?:[a-z0-9-]{0,49}[a-z0-9])?$
    max_length: 51
- name: workers
  type: integer
  required: true
  description: Desired worker count. The API uses int32; project quotas and Dataproc cluster constraints
    still apply.
  validation:
    min: 2
    max: 2147483647
- name: graceful_seconds
  type: integer
  required: false
  default: 600
  description: YARN graceful decommission deadline before forced removal, from zero to the API maximum
    of one day.
  validation:
    min: 0
    max: 86400
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - cluster_resize_workers
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.cluster }}'
  - '{{ args.workers }}'
  - '{{ args.graceful_seconds }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - done
    - cluster
    - type
    - state
    - state_started
    - error_code
    properties:
      id:
        type: string
        maxLength: 40
      done:
        type: boolean
      cluster:
        type: string
        maxLength: 51
      type:
        type: string
        maxLength: 24
      state:
        type: string
        maxLength: 24
      state_started:
        type: string
        maxLength: 40
      error_code:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 2147483647
examples:
- title: Resize Dataproc primary workers
  args:
    project: example-prod
    region: us-central1
    cluster: analytics-20261107
    workers: 4
