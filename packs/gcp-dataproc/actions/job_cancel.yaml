schema_version: 1
id: gcp-dataproc.job_cancel
title: Cancel a Dataproc job
kind: script
risk: high
description: Request cancellation of one Dataproc job. The returned state can still be CANCEL_PENDING
  or CANCEL_STARTED; inspect job_details until cancellation finishes. Cancellation interrupts the
  workload and does not roll back its external writes.
side_effects:
- One gcloud credential read and one authenticated Dataproc v1 lifecycle request; no automatic polling
  or retry.
args:
- name: project
  type: string
  required: true
  description: Google Cloud project ID.
  validation:
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
    max_length: 30
- name: region
  type: string
  required: true
  description: Explicit Dataproc region, such as us-central1.
  validation:
    pattern: ^[a-z][a-z0-9-]{0,62}$
    max_length: 63
- name: job
  type: string
  required: true
  description: Exact Dataproc job ID.
  validation:
    pattern: ^[A-Za-z0-9_-]{1,100}$
    max_length: 100
execution:
  script:
    path: scripts/dataproc.sh
    interpreter: /bin/bash
  argv:
  - job_cancel
  - '{{ args.project }}'
  - '{{ args.region }}'
  - '{{ args.job }}'
  timeout: 60s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - id
    - cluster
    - state
    - state_started
    - type
    properties:
      id:
        type: string
        maxLength: 100
      cluster:
        type: string
        maxLength: 51
      state:
        type: string
        maxLength: 24
      state_started:
        type: string
        maxLength: 40
      type:
        type: string
        maxLength: 24
examples:
- title: Cancel a Dataproc job
  args:
    project: example-prod
    region: us-central1
    job: job-20261107
