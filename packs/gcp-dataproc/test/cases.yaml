services:
- gcp-api
versions:
- version: 587.0.0-slim
  digest: '@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f'
  default: true
secret_env:
- CLOUDSDK_AUTH_ACCESS_TOKEN
inherit_env:
- CLOUDSDK_API_ENDPOINT_OVERRIDES_DATAPROC
- CLOUDSDK_AUTH_ACCESS_TOKEN
- CURL_CA_BUNDLE
env:
  CLOUDSDK_API_ENDPOINT_OVERRIDES_DATAPROC: https://gcp-api:8443/
  CURL_CA_BUNDLE: /packs/gcp-dataproc/test/fixtures/server.crt
  CLOUDSDK_AUTH_ACCESS_TOKEN: packtest-canary-dataproc-access-27bb
defaults:
  expect:
    stdout_not_empty: true
    stdout_not_contains:
    - packtest-canary-dataproc-access-27bb
    - packtest-canary-dataproc-invalid-access-933d
    - packtest-canary-dataproc-private-payload-946c
    - packtest-canary-dataproc-error-envelope-8fe1
    - packtest-canary-dataproc-error-bearer-8442
    stderr_not_contains:
    - packtest-canary-dataproc-access-27bb
    - packtest-canary-dataproc-invalid-access-933d
    - packtest-canary-dataproc-private-payload-946c
    - packtest-canary-dataproc-error-envelope-8fe1
    - packtest-canary-dataproc-error-bearer-8442
cases:
- name: gcp-dataproc.clusters_list
  action: gcp-dataproc.clusters_list
  args:
    project: example-prod
    region: us-central1
  expect:
    json:
      /items/0/name: lol-20261107
      /items/0/state: RUNNING
      /items/0/workers: 2
      /next_page_cursor: page-two
- name: gcp-dataproc.cluster_details
  action: gcp-dataproc.cluster_details
  args:
    project: example-prod
    region: us-central1
    cluster: lol-20261107
  expect:
    json:
      /uuid: 9e52399f-eaa6-4fd0-a41b-d847812b356b
      /workers: 2
      /secondary_workers: 4
      /autoscaling_policy: analytics
      /idle_delete_ttl: 1800s
      /service_account: analytics@example-prod.iam.gserviceaccount.com
- name: gcp-dataproc.cluster_metrics
  action: gcp-dataproc.cluster_metrics
  args:
    project: example-prod
    region: us-central1
    cluster: lol-20261107
  expect:
    json:
      /available: true
      /hdfs/0/name: CapacityTotal
      /hdfs/0/value: '1099511627776'
      /yarn/0/value: '2'
      /omitted:
        hdfs: 0
        yarn: 0
- name: gcp-dataproc.jobs_list
  action: gcp-dataproc.jobs_list
  args:
    project: example-prod
    region: us-central1
  expect:
    json:
      /items/0/id: failed-job
      /items/0/type: pyspark
      /items/1/state: RUNNING
      /unreachable_count: 1
- name: gcp-dataproc.job_details
  action: gcp-dataproc.job_details
  args:
    project: example-prod
    region: us-central1
    job: failed-job
  expect:
    json:
      /id: failed-job
      /uuid: 9e52399f-eaa6-4fd0-a41b-d847812b356b
      /yarn/0/state: FAILED
      /yarn/0/progress: 42
- name: gcp-dataproc.job_errors
  action: gcp-dataproc.job_errors
  args:
    project: example-prod
    region: us-central1
    job: failed-job
  expect:
    json:
      /state: ERROR
      /details: 'Executor failed Authorization: Bearer [REDACTED]'
      /history/0/state: RUNNING
  probes:
  - name: Error read is one GET without a state change
    argv:
    - /bin/sh
    - -c
    - curl -fsS --cacert /packs/gcp-dataproc/test/fixtures/server.crt https://gcp-api:8443/probe/state
      | jq -c '{methods:[.requests[].method],state:.jobs["failed-job"].status.state}'
    expect:
      json:
        /methods:
        - GET
        /state: ERROR
- name: gcp-dataproc.operations_list
  action: gcp-dataproc.operations_list
  args:
    project: example-prod
    region: us-central1
  expect:
    json:
      /items/0/id: 11111111-1111-4111-8111-111111111111
      /items/0/done: false
      /items/0/type: UPDATE
- name: gcp-dataproc.operation_details
  action: gcp-dataproc.operation_details
  args:
    project: example-prod
    region: us-central1
    operation: 11111111-1111-4111-8111-111111111111
  expect:
    json:
      /done: true
      /error_code: 9
      /message: 'Quota blocked Authorization: Bearer [REDACTED]'
  probes:
  - name: Error read is one GET without a state change
    argv:
    - /bin/sh
    - -c
    - curl -fsS --cacert /packs/gcp-dataproc/test/fixtures/server.crt https://gcp-api:8443/probe/state
      | jq -c '{methods:[.requests[].method],state:.jobs["failed-job"].status.state}'
    expect:
      json:
        /methods:
        - GET
        /state: ERROR
