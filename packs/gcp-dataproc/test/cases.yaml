# A production investigation fell back to 117 pages after this exact provider
# failure. Successful retained submissions must remain searchable after deletion.
- name: gcp-dataproc.jobs_list-retained-deleted-cluster
  action: gcp-dataproc.jobs_list
  args:
    project: history-prod
    region: us-central1
    cluster_filter: deleted-cluster
  expect:
    json:
      /items/0/id: export-try-49
      /items/0/state: DONE
      /returned_count: 6
      /more_available: true

- name: gcp-dataproc.jobs_list-retained-cluster-continuation
  action: gcp-dataproc.jobs_list
  args: &retained-history-query
    project: history-prod
    region: us-central1
    cluster_filter: deleted-cluster
    start_time: '2026-11-08T00:00:00Z'
    end_time: '2026-11-09T00:00:00Z'
  resolve_args: &retained-history-first-page
    page_cursor:
      argv: [/bin/sh, /packs/gcp-dataproc/test/fixtures/jobs-first-page.sh, history-prod, us-central1, '6', deleted-cluster, ALL, '2026-11-08T00:00:00Z', '2026-11-09T00:00:00Z']
  expect:
    json:
      /items/0/id: export-try-55
      /items/1/id: export-try-56
      /returned_count: 2
      /more_available: false
      /next_page_cursor: null
  probes:
  - name: historical bounds reach the provider without resolving the deleted cluster
    argv: [curl, -fsS, --cacert, /packs/gcp-dataproc/test/fixtures/server.crt, https://gcp-api:8443/probe/state]
    expect:
      stdout_contains: ['insertTime >= \"2026-11-08T00:00:00Z\" AND insertTime <= \"2026-11-09T00:00:00Z\"']
      stdout_not_contains: ['clusterName=']
- name: gcp-dataproc.jobs_list-rejects-changed-cluster
  action: gcp-dataproc.jobs_list
  args: {<<: *retained-history-query, cluster_filter: different-cluster}
  resolve_args: *retained-history-first-page
  expect: {status: failure, stdout_not_empty: false, stderr_contains: ['Invalid Dataproc history query or continuation']}
- name: gcp-dataproc.jobs_list-rejects-changed-interval
  action: gcp-dataproc.jobs_list
  args: {<<: *retained-history-query, start_time: '2026-11-07T00:00:00Z'}
  resolve_args: *retained-history-first-page
  expect: {status: failure, stdout_not_empty: false, stderr_contains: ['Invalid Dataproc history query or continuation']}
- name: gcp-dataproc.jobs_list-rejects-incomplete-interval
  action: gcp-dataproc.jobs_list
  args: {project: example-prod, region: us-central1, start_time: '2026-11-08T00:00:00Z'}
  expect: {status: failure, stdout_not_empty: false, stderr_contains: ['Invalid Dataproc history query or continuation']}
- name: gcp-dataproc.jobs_list-rejects-raw-provider-cursor
  action: gcp-dataproc.jobs_list
