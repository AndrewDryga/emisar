    - -c
    - curl -fsS --cacert /packs/gcp-dataproc/test/fixtures/server.crt https://gcp-api:8443/probe/state
      | jq -c '{state:.clusters["lol-20261107"].status.state, request:.requests[-1]}'
    expect:
      json:
        /state: STOPPING
        /request/method: POST
        /request/body:
          clusterUuid: 9e52399f-eaa6-4fd0-a41b-d847812b356b
- name: gcp-dataproc.cluster_resize_workers
  action: gcp-dataproc.cluster_resize_workers
  args:
    project: example-prod
    region: us-central1
    cluster: lol-20261107
    workers: 5
    graceful_seconds: 86400
  expect:
    json:
      /id: 11111111-1111-4111-8111-111111111111
      /done: false
  probes:
  - name: Exact fixture state and request shape
    argv:
    - /bin/sh
