services: [postgres]
versions:
  - version: "18.6"
    digest: "@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
    default: true
  - version: "17.11"
    digest: "@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
  - version: "16.15"
    digest: "@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d"
secret_env: [PGPASSWORD]
env:
  PGDATABASE: testdb
  PGHOST: postgres
  PGPASSWORD: packtest-canary-postgres-2a6e1c
  PGUSER: postgres
cases:
  - action: postgres.activity_states
    expect:
      stdout_contains: [active]
  - action: postgres.bgwriter_stats
    expect:
      stdout_contains: [buffers_clean, buffers_alloc, stats_reset]
    probes:
      - argv: [psql, -XAt, -c, "SELECT 'bgwriter-row' FROM pg_stat_bgwriter"]
        expect:
          stdout_contains: [bgwriter-row]
  - name: postgres.bgwriter-stats-separate-checkpointer
    action: postgres.bgwriter_stats
    versions: ["17.11", "18.6"]
    arrange:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/checkpoint.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT 'checkpoint-ready' FROM pg_stat_checkpointer WHERE num_requested > 0 AND buffers_written > 0"]
        expect:
          stdout_contains: [checkpoint-ready]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: [buffers_clean, buffers_alloc, num_timed, num_requested, buffers_written, stats_reset]
  - name: postgres.bgwriter-stats-combined-checkpointer
    action: postgres.bgwriter_stats
    versions: ["16.15"]
    arrange:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/checkpoint.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT 'checkpoint-ready' FROM pg_stat_bgwriter WHERE checkpoints_req > 0 AND buffers_checkpoint > 0"]
        expect:
          stdout_contains: [checkpoint-ready]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: [buffers_clean, buffers_alloc, checkpoints_timed, checkpoints_req, buffers_checkpoint, stats_reset]
  - name: postgres.progress-vacuum-active
    action: postgres.progress_vacuum
    arrange:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/vacuum_progress.sql]
      - argv:
          - /bin/sh
          - -c
          - >-
            nohup env PGAPPNAME=packtest-vacuum-progress
            PGOPTIONS='-c vacuum_cost_delay=100ms -c vacuum_cost_limit=1 -c statement_timeout=120s'
            psql -XAt -v ON_ERROR_STOP=1 -c 'VACUUM (DISABLE_PAGE_SKIPPING) packtest_vacuum_progress'
            >/tmp/packtest-vacuum-progress.log 2>&1 &
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT 'vacuum-progress-ready' FROM pg_stat_progress_vacuum p WHERE relid = 'packtest_vacuum_progress'::regclass AND phase = 'scanning heap' AND heap_blks_scanned > 0 AND heap_blks_scanned < heap_blks_total AND COALESCE(to_jsonb(p)->>'num_dead_item_ids', to_jsonb(p)->>'num_dead_tuples')::bigint > 0"]
        expect:
          stdout_contains: [vacuum-progress-ready]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: [packtest_vacuum_progress, scanning heap]
      stdout_not_contains: ["|0\n", "||"]
    cleanup:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT pg_cancel_backend(pid) FROM pg_stat_activity WHERE application_name = 'packtest-vacuum-progress'"]
  - name: postgres.seq-scan-offenders-strict-filter
    action: postgres.seq_scan_offenders
    arrange:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/seq_scans_setup.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/seq_scans_reset.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/seq_scans_sequential.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/seq_scans_index.sql]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -f, /packs/postgres/test/fixtures/seq_scans_ready.sql]
        expect:
          stdout_contains: [seq-scans-ready]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: [public.packtest_seq_indexless, "|100.00|"]
      stdout_not_contains: [packtest_seq_exact_half, packtest_seq_index_dominated, packtest_seq_threshold]
  - action: postgres.connections
    expect:
      stdout_contains: [psql]
  - action: postgres.database_stats
    expect:
      stdout_contains: [testdb]
  - action: postgres.db_sizes
    expect:
      stdout_contains: [testdb]
  - action: postgres.duplicate_indexes
    arrange:
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "CREATE INDEX idx_orders_customer_duplicate ON orders (customer)"]
    expect:
      stdout_contains: [idx_orders_customer, idx_orders_customer_duplicate, orders]
    cleanup:
      - argv: [psql, -XAt, -c, "DROP INDEX IF EXISTS idx_orders_customer_duplicate"]
  - action: postgres.explain_query
    args:
      query: "SELECT * FROM orders WHERE customer = 'alice'"
    expect:
      stdout_contains: ['"Plan"', idx_orders_customer]
  - action: postgres.extensions_installed
    expect:
      stdout_contains: [pg_stat_statements]
  - action: postgres.index_sizes
    expect:
      stdout_contains: [idx_orders_customer]
  - action: postgres.is_in_recovery
    expect:
      stdout_contains: ["f"]
  - action: postgres.largest_tables_full
    expect:
      stdout_contains: [public.orders]
  - action: postgres.last_vacuum_per_table
    expect:
      stdout_contains: [public.orders]
  - action: postgres.pg_hba_rules
    expect:
      stdout_contains: [scram-sha-256]
  - action: postgres.settings_non_default
    expect:
      stdout_contains: [max_connections, configuration file]
  - action: postgres.ssl_connections
    expect:
      stdout_contains: [postgres, psql]
  - action: postgres.table_io
    expect:
      stdout_contains: [public.orders]
  - action: postgres.table_sizes
    expect:
      stdout_contains: [public, orders]
  - action: postgres.unused_indexes
    expect:
      stdout_contains: [orders, idx_orders]
  - action: postgres.uptime
    expect:
      stdout_contains: [PostgreSQL]
  - action: postgres.vacuum_status
    expect:
      stdout_contains: [public, orders]
  - action: postgres.wal_archive_status
    probes:
      - argv: [psql, -XAt, -c, "SELECT 'archiver-row' FROM pg_stat_archiver"]
        expect:
          stdout_contains: [archiver-row]
  - action: postgres.wal_status
    expect:
      stdout_contains: ["f"]
  - action: postgres.xid_wraparound_proximity
    expect:
      stdout_contains: [testdb]
  - action: postgres.explain_analyze
    args:
      query: "SELECT * FROM orders WHERE customer = 'alice'"
    expect:
      json:
        /0/Plan/Relation Name: orders
  - action: postgres.reindex_concurrent
    args: {schema: public, index: idx_orders_customer}
    probes:
      - argv: [psql, -XAt, -c, "SELECT indisvalid FROM pg_index WHERE indexrelid = 'public.idx_orders_customer'::regclass"]
        expect:
          stdout_contains: ["t"]
  - action: postgres.reload_conf
    probes:
      - argv: [psql, -XAt, -c, "SELECT pg_conf_load_time() > now() - interval '10 seconds'"]
        expect:
          stdout_contains: ["t"]
  - action: postgres.vacuum_table
    args: {schema: public, table: orders, analyze: true}
    probes:
      - argv: [psql, -XAt, -c, "SELECT last_vacuum IS NOT NULL FROM pg_stat_user_tables WHERE relname = 'orders'"]
        expect:
          stdout_contains: ["t"]
  - action: postgres.cancel_query
    arrange:
      - argv: [/bin/sh, -c, 'nohup env PGAPPNAME=packtest-cancel-query psql -XAt -c "SELECT pg_sleep(120)" >/tmp/packtest-cancel-query.log 2>&1 &']
    resolve_args:
      pid:
        argv: [psql, -XAt, -c, "SELECT pid FROM pg_stat_activity WHERE application_name = 'packtest-cancel-query' AND state = 'active' LIMIT 1"]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: ["t"]
    # stdout_contains matches a substring, so asserting "0" on a bare count also
    # accepts 10, 20 or 100 active backends. Compare the count exactly in the
    # shell and assert the token that comparison prints instead.
    probes:
      - argv: ["/bin/sh", "-c", "test \"$(psql -XAt -c \"SELECT count(*) FROM pg_stat_activity WHERE application_name = 'packtest-cancel-query' AND state = 'active'\")\" = 0 && echo cancel-query-drained"]
        expect:
          stdout_contains: [cancel-query-drained]
        retry_for: 10s
        retry_every: 250ms
  - action: postgres.terminate_backend
    arrange:
      - argv: [/bin/sh, -c, 'nohup env PGAPPNAME=packtest-terminate-backend psql -XAt -c "SELECT pg_sleep(120)" >/tmp/packtest-terminate-backend.log 2>&1 &']
    resolve_args:
      pid:
        argv: [psql, -XAt, -c, "SELECT pid FROM pg_stat_activity WHERE application_name = 'packtest-terminate-backend' AND state = 'active' LIMIT 1"]
        retry_for: 10s
        retry_every: 250ms
    expect:
      stdout_contains: ["t"]
    # Exact comparison, not a substring match on "0": see cancel_query above.
    probes:
      - argv: ["/bin/sh", "-c", "test \"$(psql -XAt -c \"SELECT count(*) FROM pg_stat_activity WHERE application_name = 'packtest-terminate-backend'\")\" = 0 && echo terminate-backend-drained"]
        expect:
          stdout_contains: [terminate-backend-drained]
        retry_for: 10s
        retry_every: 250ms
  - action: postgres.kill_idle
    # Needs a backend idle-in-transaction past older_than_seconds (min 60): open
    # one on a pipe held by sleep, age it beyond 60s across sub-30s pg_sleep
    # waits, then terminate it. The three active waiter backends are a different
    # application_name and never idle, so the action leaves them alone.
    args:
      older_than_seconds: 60
    arrange:
      - argv: ["/bin/sh", "-c", "nohup sh -c 'export PGAPPNAME=packtest-kill-idle; { printf \"BEGIN; SELECT 1;\\n\"; sleep 300; } | psql -XAt' >/tmp/packtest-kill-idle.log 2>&1 &"]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT pg_sleep(25)"]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT pg_sleep(25)"]
      - argv: [psql, -XAt, -v, "ON_ERROR_STOP=1", -c, "SELECT pg_sleep(20)"]
    expect:
      stdout_contains: [packtest-kill-idle]
    # Exact comparison, not a substring match on "0": see cancel_query above.
    probes:
      - argv: ["/bin/sh", "-c", "test \"$(psql -XAt -c \"SELECT count(*) FROM pg_stat_activity WHERE application_name = 'packtest-kill-idle' AND state = 'idle in transaction'\")\" = 0 && echo kill-idle-drained"]
        expect:
          stdout_contains: [kill-idle-drained]
        retry_for: 10s
        retry_every: 250ms
  - name: postgres.uptime-missing-credentials
    action: postgres.uptime
    unset_env: [PGPASSWORD]
    expect:
      status: failure
      exit: [2]
      reason_contains: [process exited with code 2]
      stderr_contains: [no password supplied]
  - name: postgres.uptime-unavailable-service
    action: postgres.uptime
    env: {PGHOST: 127.0.0.2}
    expect:
      status: failure
      exit: [2]
      reason_contains: [process exited with code 2]
      stderr_contains: [Connection refused]
  - name: postgres.bgwriter-stats-missing-credentials
    action: postgres.bgwriter_stats
    unset_env: [PGPASSWORD]
    expect:
      status: failure
      exit: [2]
      reason_contains: [process exited with code 2]
      stderr_contains: [no password supplied]
      stderr_not_contains: [Password for user, password authentication failed]
  - name: postgres.bgwriter-stats-unavailable-service
    action: postgres.bgwriter_stats
    env: {PGHOST: 127.0.0.2}
    expect:
      status: failure
      exit: [2]
      reason_contains: [process exited with code 2]
      stderr_contains: [Connection refused]
  - name: postgres.vacuum-table-invalid-arguments
    action: postgres.vacuum_table
    args: {schema: public}
    expect:
      status: failure
      exit: [0]
      reason: argument_invalid
      error_contains: [argument table, is required]
  - name: postgres.vacuum-table-missing-target
    action: postgres.vacuum_table
    args: {schema: public, table: missing_table, analyze: true}
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [relation "public.missing_table" does not exist]
