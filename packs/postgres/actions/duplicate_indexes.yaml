schema_version: 1
id: postgres.duplicate_indexes
title: Candidate duplicate indexes (same column list)
kind: exec
risk: low
description: >
  List groups of indexes on one table that share the same column list
  (pg_index.indkey). Each group is an overlap candidate, not proof that any
  index is redundant: indkey records every expression column as 0 and ignores
  expressions, partial-index predicates, operator classes, the key/INCLUDE
  split, uniqueness, and access method, so indexes in one group can serve different
  queries. Each index's full definition is in pg_get_indexdef.
side_effects: ["One SELECT.", "Read-only."]
args: []
execution:
  command:
    binary: psql
    argv:
      - "-XAtq"
      - "-c"
      - "SET LOCAL statement_timeout = '28s'; SET LOCAL lock_timeout = '5s'; SELECT array_agg(indexrelid::regclass::text ORDER BY indexrelid) AS indexes, indrelid::regclass AS table, indkey::text AS columns FROM pg_index GROUP BY indrelid, indkey HAVING count(*) > 1 LIMIT 50;"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Duplicates
    args: {}
