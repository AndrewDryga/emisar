schema_version: 1
id: postgres.progress_vacuum
title: pg_stat_progress_vacuum
kind: exec
risk: low
description: Show in-flight VACUUMs with phase, heap block progress and the dead-item counter on PostgreSQL 16 and later.
side_effects: ["One SELECT.", "Read-only."]
args: []
execution:
  command:
    binary: psql
    argv:
      - "-XAt"
      - "-c"
      - "SELECT pid, datname, p.relid::regclass AS table, phase, heap_blks_total, heap_blks_scanned, heap_blks_vacuumed, COALESCE(to_jsonb(p)->>'num_dead_item_ids', to_jsonb(p)->>'num_dead_tuples')::bigint AS num_dead_item_ids FROM pg_stat_progress_vacuum p;"
  timeout: 10s
output:
  parser: text
  max_stdout_bytes: 32768
  max_stderr_bytes: 8192
examples:
  - title: Live VACUUMs
    args: {}
