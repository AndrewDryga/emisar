schema_version: 1

id: time-sync
name: Time sync diagnostics
version: 0.1.12
description: >
  Clock-sync state for a Linux host on either time daemon: Chrony tracking and
  sources, the NTPsec peer table, current time, drift estimate, timezone, plus
  fix actions (chronyc makestep, enable/disable NTP). Use when a host's clock
  is drifting (a common cause of TLS / auth / log-correlation bugs).
vendor: emisar
homepage: https://emisar.dev/packs/time-sync

requires:
  os:
    - linux

# `emisar pack suggest` detection — the daemon that owns the clock, either one.
detect:
  processes:
    - chronyd
    - ntpd

setup:
  summary: >
    Queries and adjusts Chrony, NTPsec, and systemd time state on the local
    runner host — no credentials needed.
  notes:
    - "Read actions (timedatectl, chronyc tracking/sources, ntpq peers, date) need no privileges."
    - "A host runs one time daemon, so the actions for the other one fail with a missing binary: the chronyc actions need Chrony, and `time.ntpq_peers` needs NTPsec/ntpd. `timedatectl` and `date` answer on either."
  host_access:
    - actions:
        - time.chronyc_makestep
        - time.timedatectl_set_ntp
      requirement: Step the system clock or change the host NTP setting as root.
      recipes:
        - name: Run the Emisar service as root
          commands:
            - "sudo install -d -m 0755 /etc/systemd/system/emisar.service.d"
            - "printf '%s\\n' '[Service]' 'User=root' 'Group=root' | sudo tee /etc/systemd/system/emisar.service.d/10-time-sync-host-access.conf >/dev/null"
            - "sudo systemctl daemon-reload"
            - "sudo systemctl restart emisar"
          verify:
            - "test \"$(systemctl show emisar --property=User --value)\" = root"
          impact: >
            Every Emisar action on this runner executes as root. These actions can abruptly
            step wall-clock time or change which daemon controls synchronization.
  verify: time.timedatectl

actions:
  - actions/timedatectl.yaml
  - actions/chrony_tracking.yaml
  - actions/chrony_sources.yaml
  - actions/ntpq_peers.yaml
  - actions/date_now.yaml
  - actions/chronyc_makestep.yaml
  - actions/timedatectl_set_ntp.yaml
