services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/nomad/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.0.4}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-nomad-tools:latest

  nomad:
    image: hashicorp/nomad:${PACKTEST_VERSION:-2.0.4}${PACKTEST_DIGEST-}
    # ACLs on with a fixed bootstrap token, so acl_token_self has a real Secret
    # ID to return (and redact). Every case authenticates with the same
    # management token (NOMAD_TOKEN below), so the read/inspect cases are
    # unaffected. The token is a canary the harness scans for unredacted.
    environment:
      NOMAD_TOKEN: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    # The image entrypoint is `nomad`, so override it to run a shell wrapper that
    # enables ACLs, starts the agent, then bootstraps the fixed management token.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'acl { enabled = true }' > /tmp/acl.hcl
        nomad agent -server -bootstrap-expect=1 -data-dir=/tmp/nomad -bind=0.0.0.0 -config=/tmp/acl.hcl &
        echo 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee' > /tmp/boot.token
        until (unset NOMAD_TOKEN; nomad acl bootstrap /tmp/boot.token) >/dev/null 2>&1; do sleep 1; done
        wait
    privileged: true
    healthcheck:
      test: ["CMD", "nomad", "server", "members"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 10

  # Independent transport faults, supplementary to the real Nomad action.
  # This helper image must not follow PACKTEST_VERSION (a Nomad version).
  nomad-response:
    image: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
    entrypoint: [python3, /fixture/response-server.py]
    volumes:
      - ${EMISAR_ROOT}/packs/nomad/test/fixtures/response-server.py:/fixture/response-server.py:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10
