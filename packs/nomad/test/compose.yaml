services:
  runner-tools:
    build:
      context: ${EMISAR_ROOT}/packs/nomad/test
      dockerfile: Dockerfile
      args:
        PACKTEST_RUNNER_IMAGE: ${PACKTEST_RUNNER_IMAGE:-emisar-runner-tools:latest}
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.0.7}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-nomad-tools:latest
    volumes:
      - nomad-api-sockets:/fixture-sockets:ro

  nomad:
    image: hashicorp/nomad:${PACKTEST_VERSION:-2.0.7}${PACKTEST_DIGEST-}
    # ACLs on with a fixed bootstrap token, so acl_token_self has a real Secret
    # ID to return (and redact). Every case authenticates with the same
    # management token (NOMAD_TOKEN below), so the read/inspect cases are
    # unaffected. The token is a canary the harness scans for unredacted.
    environment:
      NOMAD_TOKEN: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    # The image entrypoint is `nomad`, so override it to run a shell wrapper that
    # enables ACLs, starts the agent, then bootstraps the fixed management token.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'acl { enabled = true }' > /tmp/acl.hcl
        nomad agent -server -bootstrap-expect=1 -data-dir=/tmp/nomad -bind=0.0.0.0 -config=/tmp/acl.hcl &
        echo 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee' > /tmp/boot.token
        until (unset NOMAD_TOKEN; nomad acl bootstrap /tmp/boot.token) >/dev/null 2>&1; do sleep 1; done
        wait
    privileged: true
    healthcheck:
      test: ["CMD", "nomad", "server", "members"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 10

  # A separate real Nomad agent runs raw_exec tasks without changing the
  # server-only fixture's allocation expectations. No host socket or cgroup
  # mount: the unprivileged raw_exec task lives inside this disposable service.
  nomad-node:
    build:
      context: ${EMISAR_ROOT}/packs/nomad/test
      dockerfile: Node.Dockerfile
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-2.0.7}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-nomad-node:latest
    entrypoint: [/bin/sh, /fixture/node-client.sh]
    extra_hosts:
      - stall.packtest.invalid:127.0.0.1
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ${EMISAR_ROOT}/packs/nomad/test/fixtures:/fixture:ro
      - ${EMISAR_ROOT}/packs/nomad/test/fixtures/node-resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: [CMD, nomad, node, status, -self]
      interval: 2s
      start_period: 15s
      start_interval: 1s
      retries: 10

  # Independent transport faults, supplementary to the real Nomad action.
  # This helper image must not follow PACKTEST_VERSION (a Nomad version).
  nomad-response:
    image: python:3.14.7-alpine3.24@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
    entrypoint: [python3, /fixture/response-server.py]
    networks:
      default:
        aliases: [consul]
    volumes:
      - ${EMISAR_ROOT}/packs/nomad/test/fixtures/response-server.py:/fixture/response-server.py:ro
      - ${EMISAR_ROOT}/packs/nomad/test/fixtures/tls:/fixture/tls:ro
      - nomad-api-sockets:/fixture-sockets
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      start_period: 10s
      start_interval: 1s
      retries: 10

volumes:
  nomad-api-sockets:
