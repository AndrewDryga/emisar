services: [nomad]
versions:
  - version: "2.0.4"
    digest: "@sha256:14f0cf3dc43d949e759b50d793529976a1a1a7f391eaf1e048acd55cd5392462"
    default: true
  - version: "1.10.5"
    digest: "@sha256:d52fdb89745d8309de690d53c29d6baec8867e920051eb50b2c7f7f85c127e43"
risk_accountability:
  mode: complete
  exceptions:
    nomad.agent_force_leave: requires_cluster
    nomad.alloc_restart: requires_cluster
    nomad.alloc_signal: requires_cluster
    nomad.alloc_stop: requires_cluster
    nomad.deployment_fail: requires_cluster
    nomad.job_action_run: requires_cluster
    nomad.job_dispatch: requires_dynamic_fixture
    nomad.job_promote: requires_cluster
    nomad.job_restart: requires_cluster
    nomad.job_revert: requires_cluster
    nomad.job_scale: requires_cluster
    nomad.node_drain: requires_cluster
    nomad.node_eligibility_disable: requires_cluster
    nomad.node_purge: requires_cluster
    nomad.operator_raft_remove_peer: requires_cluster
    nomad.task_resources_set: requires_cluster
secret_env: [NOMAD_PACKTEST_CANARY]
env:
  NOMAD_ADDR: "http://nomad:4646"
  # Mirrors the PACKTEST_DB_PASSWORD literal in test/fixtures/inspect.nomad.hcl —
  # declaring it here makes the harness fail any surface that leaks it unredacted.
  NOMAD_PACKTEST_CANARY: packtest-canary-nomad-e57d31
cases:
  - action: nomad.agent_info
    expect:
      stdout_contains: [nomad, server, raft]
  - action: nomad.agent_members
    expect:
      stdout_contains: [alive, role=nomad]
  - action: nomad.agent_self
    expect:
      stdout_contains: [config, member]
  - action: nomad.leader
    expect:
      stdout_contains: ["4647"]
  - action: nomad.namespace_list
    expect:
      stdout_contains: [default]
  - action: nomad.node_pool_list
    expect:
      stdout_contains: [default, all]
  - action: nomad.operator_autopilot_get_config
    expect:
      stdout_contains: [CleanupDeadServers]
  - action: nomad.operator_autopilot_state
    expect:
      stdout_contains: [Healthy, Leader]
  - action: nomad.operator_raft_list_peers
    expect:
      stdout_contains: [Node, leader]
  - action: nomad.operator_scheduler_get_config
    expect:
      stdout_contains: [Scheduler Algorithm]
  - action: nomad.job_health_snapshot
    args:
      job: packtest-health
      allocation_limit: 5
      events_per_task: 3
    arrange:
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/health.nomad.hcl]
    expect:
      stdout_contains:
        - '"id":"packtest-health"'
        - '"desired":2'
        - '"desired_allocations":2'
        - '"image":"busybox:1.36"'
        - '"deployments":[{"id":"'
        - '"desired_total":2'
        - '"allocations":[]'
  # The same snapshot under the jq built --with-oniguruma=no: the two event
  # filters used to be test(...; "i") calls, and a jq without the regex family
  # raises rather than degrading the moment one is reached. The shared client
  # image builds that jq at /opt/jq-without-regex; putting it first on PATH is
  # how a case opts in, and every other case here keeps running against the
  # packaged Oniguruma-enabled jq an operator's host usually has.
  - name: nomad.job_health_snapshot-without-jq-regex-support
    action: nomad.job_health_snapshot
    args:
      job: packtest-health
      allocation_limit: 5
      events_per_task: 3
    env:
      PATH: /opt/jq-without-regex:/opt/emisar/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    arrange:
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/health.nomad.hcl]
    expect:
      stdout_contains:
        - '"id":"packtest-health"'
        - '"desired":2'
        - '"desired_allocations":2'
        - '"image":"busybox:1.36"'
        - '"deployments":[{"id":"'
        - '"desired_total":2'
        - '"allocations":[]'
  - action: nomad.server_members
    expect:
      stdout_contains: ['"Status":"alive"', '"ServerName"']
  - action: nomad.job_inspect
    args: {job: packtest-inspect}
    arrange:
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/inspect.nomad.hcl]
    expect:
      stdout_contains:
        - '"packtest-inspect"'
        # The fixture's secret-named env var comes back masked by the runner's
        # default redaction — the leak this action's high risk is about.
        - '"PACKTEST_DB_PASSWORD": "[REDACTED]"'
      stdout_not_contains:
        - packtest-canary-nomad-e57d31
  - name: nomad.job_status_one-non-default-namespace
    action: nomad.job_status_one
    args:
      job: packtest-stop
      namespace: packtest-ns
    arrange:
      - argv: [nomad, namespace, apply, packtest-ns]
      - argv: [nomad, job, run, -detach, -namespace=packtest-ns, /packs/nomad/test/fixtures/stop.nomad.hcl]
    expect:
      stdout_contains: [packtest-stop, packtest-ns]
  - action: nomad.job_stop
    args: {job: packtest-stop}
    arrange:
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/stop.nomad.hcl]
    probes:
      - argv: [nomad, job, status, packtest-stop]
        expect:
          stdout_contains: ["Status", dead]
  - name: nomad.job_stop-non-default-namespace
    action: nomad.job_stop
    args:
      job: packtest-stop
      namespace: packtest-ns
    arrange:
      - argv: [nomad, namespace, apply, packtest-ns]
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/stop.nomad.hcl]
      - argv: [nomad, job, run, -detach, -namespace=packtest-ns, /packs/nomad/test/fixtures/stop.nomad.hcl]
    probes:
      - argv: [nomad, job, status, -namespace=packtest-ns, packtest-stop]
        expect:
          stdout_contains: ["Status", dead]
      - argv: [nomad, job, status, packtest-stop]
        expect:
          stdout_contains: ["Status", pending]
