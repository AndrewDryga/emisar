services: [nomad]
versions:
  - version: "2.0.4"
    digest: "@sha256:14f0cf3dc43d949e759b50d793529976a1a1a7f391eaf1e048acd55cd5392462"
    default: true
  - version: "1.10.5"
    digest: "@sha256:d52fdb89745d8309de690d53c29d6baec8867e920051eb50b2c7f7f85c127e43"
risk_accountability:
  mode: complete
  exceptions:
    nomad.agent_force_leave: requires_cluster
    nomad.alloc_restart: requires_cluster
    nomad.alloc_signal: requires_cluster
    nomad.alloc_stop: requires_cluster
    nomad.deployment_fail: requires_cluster
    nomad.job_action_run: requires_cluster
    nomad.job_dispatch: requires_dynamic_fixture
    nomad.job_promote: requires_cluster
    nomad.job_restart: requires_cluster
    nomad.job_revert: requires_cluster
    nomad.job_scale: requires_cluster
    nomad.node_drain: requires_cluster
    nomad.node_eligibility_disable: requires_cluster
    nomad.node_purge: requires_cluster
    nomad.operator_raft_remove_peer: requires_cluster
    nomad.task_resources_set: requires_cluster
env:
  NOMAD_ADDR: "http://nomad:4646"
cases:
  - action: nomad.agent_info
    expect:
      stdout_contains: [nomad, server, raft]
  - action: nomad.agent_members
    expect:
      stdout_contains: [alive, role=nomad]
  - action: nomad.agent_self
    expect:
      stdout_contains: [config, member]
  - action: nomad.leader
    expect:
      stdout_contains: ["4647"]
  - action: nomad.namespace_list
    expect:
      stdout_contains: [default]
  - action: nomad.node_pool_list
    expect:
      stdout_contains: [default, all]
  - action: nomad.operator_autopilot_get_config
    expect:
      stdout_contains: [CleanupDeadServers]
  - action: nomad.operator_autopilot_state
    expect:
      stdout_contains: [Healthy, Leader]
  - action: nomad.operator_raft_list_peers
    expect:
      stdout_contains: [Node, leader]
  - action: nomad.operator_scheduler_get_config
    expect:
      stdout_contains: [Scheduler Algorithm]
  - action: nomad.server_members
    expect:
      stdout_contains: ['"Status":"alive"', '"ServerName"']
  - action: nomad.job_stop
    args: {job: packtest-stop}
    arrange:
      - argv: [nomad, job, run, -detach, /packs/nomad/test/fixtures/stop.nomad.hcl]
    probes:
      - argv: [nomad, job, status, packtest-stop]
        expect:
          stdout_contains: ["Status", dead]
