schema_version: 1
id: nomad.node_eligibility_show
title: Nodes with eligibility != eligible
kind: exec
risk: low
description: >
  List the client nodes that are ineligible for new allocations — drained or
  manually disabled — as a table with node ID, name, drain state, and status.
  A healthy cluster prints "No nodes registered". Read-only.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      # `-filter` does the selection server-side, so this finally matches the
      # title: the old grep over `-json` emitted three lines for EVERY node,
      # ineligible or not, and pulled tens of MB back on a large cluster to do
      # it. No pipeline left, so nomad's own exit status is the action's.
      # Draining a node sets its eligibility to ineligible too, so this single
      # term covers both drained and manually-disabled nodes.
      - "nomad node status -filter 'SchedulingEligibility != \"eligible\"'"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Ineligible nodes
    args: {}
