schema_version: 1
id: nomad.job_periodic_force
title: nomad job periodic force <id>
kind: script
risk: medium
description: Force-run one periodic job NOW, ignoring schedule.
side_effects:
  - A new periodic child job is created and dispatched.
  - Counts toward normal job history.
search_terms:
  - run cron now
  - trigger scheduled job
args:
  - name: job
    type: string
    required: true
    description: Periodic job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job periodic force", "{{ args.job }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Force-run
    args:
      job: "nightly-backup"
