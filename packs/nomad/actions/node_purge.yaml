schema_version: 1
id: nomad.node_purge
title: Purge a dead node (PUT /v1/node/<id>/purge)
kind: script
risk: critical
description: >
  Remove a node from the catalog; allocations on it are GC'd. There is no
  `nomad node purge` CLI subcommand — this is the HTTP API
  (PUT /v1/node/<id>/purge). Intended for nodes that are down, but Nomad does
  not check the node's status: it purges a ready node too. Confirm the node is
  down with nomad.node_status_one first.
side_effects:
  - Node entry removed permanently (one API PUT).
  - Allocations on it are GC'd.
  - Nomad does not refuse a live node; a running client re-registers after the purge.
args:
  - name: node_id
    type: string
    required: true
    description: Node ID.
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
execution:
  script: {path: scripts/api.sh, interpreter: /bin/sh}
  argv: [PUT, "/v1/node/{{ args.node_id }}/purge", object, "", ""]
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Purge a dead node
    args:
      node_id: "deadbeef"
