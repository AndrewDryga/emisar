schema_version: 1
id: nomad.job_revert
title: nomad job revert <id> <version>
kind: script
risk: high
description: Revert a job to a prior version. Equivalent to re-submitting that version.
side_effects:
  - Job spec replaced with the prior version.
  - Triggers a rolling update (per the new/old spec's update stanza).
search_terms:
  - rollback
  - roll back deployment
  - undo deploy
  - previous version
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: version
    type: integer
    required: true
    description: Version number to revert to.
    validation:
      min: 0
      max: 1000000
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job revert", "{{ args.job }}", "{{ args.version }}"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Roll back one version
    args:
      job: "api"
      version: 7
