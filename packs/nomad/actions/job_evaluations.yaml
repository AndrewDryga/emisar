schema_version: 1
id: nomad.job_evaluations
title: nomad job eval <id> (force re-evaluation)
kind: script
risk: medium
description: >
  Force a fresh evaluation of one job — the scheduler re-checks placement
  and constraints and may reschedule allocations. NOT read-only: the CLI
  `nomad job eval` creates a new evaluation, it does not just list them.
side_effects:
  - Creates a new evaluation for the job.
  - The scheduler reconciles the job; allocations may be moved or restarted.
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job eval -verbose", "{{ args.job }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Force a re-evaluation
    args:
      job: "api"
