schema_version: 1
id: nomad.job_dispatch
title: nomad job dispatch <id>
kind: exec
risk: high
description: Dispatch a parameterized job with optional meta variables; a new instance of the job's workload starts running on the cluster with the values you pass.
side_effects:
  - A new dispatched job instance is created and scheduled.
  - Counts toward job history.
args:
  - name: job
    type: string
    required: true
    description: Parameterized job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: meta_kv
    type: string
    required: false
    default: ""
    description: "Optional meta as 'k=v,k2=v2' (no spaces around =)."
    validation:
      max_length: 1024
      pattern: "^([a-zA-Z0-9_]{1,64}=[a-zA-Z0-9_./\\-]{0,256}(,[a-zA-Z0-9_]{1,64}=[a-zA-Z0-9_./\\-]{0,256})*)?$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "ns=$1; meta=$2; job=$3; set -- job dispatch; [ -z \"$ns\" ] || set -- \"$@\" \"-namespace=$ns\"; if [ -n \"$meta\" ]; then oldifs=$IFS; IFS=,; for kv in $meta; do set -- \"$@\" -meta \"$kv\"; done; IFS=$oldifs; fi; exec nomad \"$@\" \"$job\""
      - "emisar"
      - "{{ args.namespace }}"
      - "{{ args.meta_kv }}"
      - "{{ args.job }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Dispatch with meta
    args:
      job: "batch-processor"
      meta_kv: "input=/tmp/data,priority=high"
