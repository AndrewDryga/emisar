schema_version: 1
id: nomad.alloc_fs_tail
title: Tail a file inside an allocation (nomad alloc fs -tail)
kind: script
risk: medium
description: >
  Tail the last lines of one file inside an allocation's filesystem — the read
  for "what did my task actually render into local/config.json" when the task
  logs do not say. Unlike nomad.alloc_logs, which returns a task's stdout or
  stderr stream, this reads a FILE the task wrote. It is medium rather than low
  because a rendered template can hold whatever the job author put in it, so the
  content is not knowable from the action alone. Two bounds keep that honest —
  path rejects the secrets/ tree outright, and lines is capped — but neither can
  vouch for a file this action has never seen; treat the tier as the promise and
  the redaction as a backstop. Requires a Nomad token with read-fs on the
  namespace.
side_effects:
  - One API call through the Nomad CLI.
  - Read-only; nothing in the allocation is modified.
  - Returns file CONTENT, unlike alloc_fs_ls and alloc_fs_stat which return
    metadata only. A file a job author rendered may contain anything they put
    in it.
  - The packaged script refuses the secrets/ tree before calling nomad, so
    Nomad's own rendered-credential mount cannot be read through this action.
args:
  - name: alloc_id
    type: string
    required: true
    description: Allocation ID or prefix (from nomad.job_allocations / nomad.alloc_status).
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
  - name: path
    type: string
    required: true
    description: >
      File to tail, relative to the alloc root (e.g. local/config.json,
      alloc/logs/app.stdout.0). The secrets/ tree is rejected — that is where
      Nomad mounts rendered credentials. No "..", absolute host paths, or shell
      metacharacters.
    validation:
      # Shape only. The secrets/ rejection lives in the packaged script, because
      # RE2 has no lookahead and denied_paths resolves against the RUNNER's
      # filesystem rather than the allocation's.
      pattern: "^\\.?[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*(/\\.?[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*)*$"
      max_length: 256
  - name: lines
    type: integer
    required: false
    default: 100
    description: How many trailing lines to return.
    validation:
      min: 1
      max: 500
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace. Empty keeps the runner's ambient default.
    validation:
      pattern: "^[a-zA-Z0-9_-]{0,128}$"
  - name: region
    type: string
    required: false
    default: ""
    description: Nomad region. Empty keeps the runner's ambient default.
    validation:
      pattern: "^[a-zA-Z0-9_-]{0,128}$"
execution:
  script:
    path: scripts/tail_alloc_file.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.namespace }}"
    - "{{ args.region }}"
    - "{{ args.lines }}"
    - "{{ args.alloc_id }}"
    - "{{ args.path }}"
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Tail a rendered config file
    args:
      alloc_id: "abc12345"
      path: "local/config.json"
  - title: Last 20 lines of a task's log file
    args:
      alloc_id: "abc12345"
      path: "alloc/logs/app.stdout.0"
      lines: 20
