schema_version: 1
id: nomad.alloc_exec_node_https
title: Check HTTPS inside an allocation task
kind: script
risk: medium
description: >
  Check one HTTPS GET from a fresh Node process inside the selected task and
  return only the status, TLS verification, error code and connection timings.
  Uses Node HTTPS with certificate and hostname verification, including the
  task's NODE_EXTRA_CA_CERTS, but never a TLS bypass. Does not follow redirects,
  consume response bodies, or expose response headers or the URL. Accepts no
  userinfo, query, fragment, authentication or custom headers. Medium risk
  because it executes in any selected task and sends a request to any HTTPS
  endpoint that task can reach; a GET can trigger work on the destination.
  Requires Node.js and env with -u support in the task, plus the Nomad alloc-exec
  namespace capability (alloc-node-exec for raw_exec). Node preload, debug,
  coverage, compile-cache hooks and environment proxies are disabled. This does not inspect the
  existing application process, its custom fetch dispatcher, proxy or in-process
  TLS configuration. Network/TLS errors and deadlines return a nonzero exit
  with diagnostic JSON. Every HTTP response, including 4xx/5xx and redirects,
  completes the probe successfully and returns its original status.
side_effects:
  - Sends one unauthenticated HTTPS GET from a new process inside the selected task; the destination may log the request or perform work.
  - Does not modify task files, restart the application or disable TLS verification.
args:
  - name: alloc_id
    type: string
    required: true
    description: Allocation ID or prefix from nomad.job_allocations or nomad.alloc_status.
    validation:
      max_length: 36
      pattern: '^[a-fA-F0-9][a-fA-F0-9-]{3,35}$'
  - name: task
    type: string
    required: true
    description: Exact task name; the task must contain Node.js and env with -u support.
    validation:
      max_length: 128
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$'
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace. Empty keeps the ambient NOMAD_NAMESPACE or default namespace.
    validation:
      max_length: 128
      pattern: '^([a-zA-Z0-9][a-zA-Z0-9_-]{0,127})?$'
  - name: seconds
    type: integer
    required: false
    default: 10
    description: Total probe deadline in seconds, including DNS and connection setup.
    validation:
      min: 1
      max: 30
  - name: url
    type: string
    required: true
    description: HTTPS URL without userinfo, query or fragment. Paths may be percent encoded; no credentials are supplied.
    validation:
      max_length: 1024
      pattern: '^https://[a-zA-Z0-9.\[\]:-]+(/[a-zA-Z0-9/._~%+-]*)?$'
execution:
  script:
    path: scripts/alloc_node_https.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "{{ args.task }}", "{{ args.alloc_id }}", "{{ args.url }}", "{{ args.seconds }}"]
  timeout: 40s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 4096
examples:
  - title: Check the web task from inside its allocation
    args:
      alloc_id: abc12345
      task: web
      url: https://api.internal/health
