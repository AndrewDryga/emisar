schema_version: 1
id: nomad.deployment_status
title: nomad deployment status <id>
kind: script
risk: low
description: 'Show one deployment''s state — per-task-group desired/placed/healthy/unhealthy.'
side_effects: ["One API call.", "Read-only."]
search_terms:
  - deploy stuck
  - rollout stalled
  - deploy failing
args:
  - name: deployment_id
    type: string
    required: true
    description: Deployment ID.
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "deployment status -verbose", "{{ args.deployment_id }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Deployment status
    args:
      deployment_id: "abc12345"
