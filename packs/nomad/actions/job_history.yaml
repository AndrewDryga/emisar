schema_version: 1
id: nomad.job_history
title: nomad job history <id>
kind: script
risk: low
description: >
  List all versions of one job with submitter + timestamp. Version lines only:
  no diff and no spec, so nothing from the job's `env` or `template` blocks is
  printed. For the content of a version, `nomad.job_inspect` (high) is the read.
side_effects: ["One API call.", "Read-only."]
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job history", "{{ args.job }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: History
    args:
      job: "api"
