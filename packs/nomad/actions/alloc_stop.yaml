schema_version: 1
id: nomad.alloc_stop
title: nomad alloc stop <id>
kind: script
risk: high
description: Stop one allocation. The scheduler reschedules it (per the job's reschedule stanza).
side_effects:
  - Allocation is stopped + replaced.
  - Brief unavailability for the running container.
args:
  - name: alloc_id
    type: string
    required: true
    description: Allocation ID.
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "alloc stop", "{{ args.alloc_id }}"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 4096
  max_stderr_bytes: 8192
examples:
  - title: Force-reschedule
    args:
      alloc_id: "abc12345"
