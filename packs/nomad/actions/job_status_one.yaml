schema_version: 1
id: nomad.job_status_one
title: nomad job status <id>
kind: script
risk: low
description: >
  Show one job's full status — task groups, allocations, deployment. Job IDs
  are namespace-scoped: when either value is unknown, use nomad.namespace_list
  and nomad.job_status_all first, then carry the exact job and namespace here.
side_effects: ["One API call.", "Read-only."]
search_terms:
  - pods restarting
  - crash loop
  - tasks flapping
args:
  - name: job
    type: string
    required: true
    description: Exact Job ID discovered in the target namespace.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Exact namespace for the job. Empty keeps the runner's ambient NOMAD_NAMESPACE or the default namespace; discover it before guessing.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
  - name: region
    type: string
    required: false
    default: ""
    description: Nomad region to target. Empty (default) keeps the runner's ambient NOMAD_REGION or the agent's region.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,63})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "{{ args.region }}", "job status -verbose", "{{ args.job }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: One job
    args:
      job: "api"
  - title: One job in the "prod" namespace
    args:
      job: "api"
      namespace: "prod"
