schema_version: 1
id: nomad.job_stop
title: nomad job stop <id>
kind: script
risk: high
description: 'Stop one job. All its allocations are stopped + GC''d. Use -purge to also remove from history.'
side_effects:
  - All allocations of the job receive a shutdown signal.
  - Job marked dead in catalog.
  - History retained unless --purge is used (this action does NOT purge).
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job stop", "{{ args.job }}"]
  timeout: 5m
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Stop one job
    args:
      job: "api"
