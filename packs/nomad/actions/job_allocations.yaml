schema_version: 1
id: nomad.job_allocations
title: nomad job allocs <id>
kind: script
risk: low
description: >
  List current allocations for one exact job and namespace. Job IDs are
  namespace-scoped: use nomad.namespace_list and nomad.job_status_all first when
  either value is unknown. Refresh this list before an allocation status or log
  read because deployments replace allocation IDs.
side_effects: ["One API call.", "Read-only."]
args:
  - name: job
    type: string
    required: true
    description: Exact Job ID discovered in the target namespace.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
  - name: region
    type: string
    required: false
    default: ""
    description: Nomad region to target. Empty (default) keeps the runner's ambient NOMAD_REGION or the agent's region.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,63})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "{{ args.region }}", "job allocs -verbose", "{{ args.job }}"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Allocations
    args:
      job: "api"
  - title: Allocations in the "prod" namespace
    args:
      job: "api"
      namespace: "prod"
