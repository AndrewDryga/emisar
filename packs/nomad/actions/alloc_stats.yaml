schema_version: 1
id: nomad.alloc_stats
title: GET /v1/client/allocation/<id>/stats
kind: script
risk: low
description: Show CPU + memory + network stats for one allocation.
side_effects: ["One API call.", "Read-only."]
args:
  - name: alloc_id
    type: string
    required: true
    description: Allocation ID.
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "operator api", "/v1/client/allocation/{{ args.alloc_id }}/stats"]
  timeout: 15s
output:
  parser: json
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Stats
    args:
      alloc_id: "abc12345"
