schema_version: 1
id: nomad.job_health_snapshot
title: Nomad job health snapshot
kind: script
risk: low
description: >
  Return one bounded JSON snapshot of a job's desired and current allocation
  counts, configured task images, recent deployments, recent allocations,
  restart and failed-task events, and Nomad-native checks. Job environment,
  templates, variables, payloads, and other driver configuration are omitted.
side_effects:
  - Four fixed read-only Nomad API calls plus one checks read per returned allocation.
  - Allocation and event counts are bounded by validated arguments.
  - Read-only - never changes a job, deployment, allocation, or check.
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty keeps the runner's ambient namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
  - name: region
    type: string
    required: false
    default: ""
    description: Nomad region to target. Empty keeps the runner's ambient region.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,63})?$"
  - name: allocation_limit
    type: integer
    required: false
    default: 10
    description: Maximum recent allocations and associated check reads.
    validation:
      min: 1
      max: 25
  - name: events_per_task
    type: integer
    required: false
    default: 5
    description: Maximum recent restart and failed events retained per task.
    validation:
      min: 1
      max: 20
execution:
  script:
    path: scripts/job_health_snapshot.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.job }}"
    - "{{ args.namespace }}"
    - "{{ args.region }}"
    - "{{ args.allocation_limit }}"
    - "{{ args.events_per_task }}"
  timeout: 90s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 16384
examples:
  - title: Recent health for an API job
    args:
      job: api
  - title: Smaller production snapshot
    args:
      job: api
      namespace: prod
      allocation_limit: 5
      events_per_task: 3
