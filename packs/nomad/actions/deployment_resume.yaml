schema_version: 1
id: nomad.deployment_resume
title: nomad deployment resume <id>
kind: script
risk: medium
description: >
  Resume a paused deployment — placements continue from where
  nomad.deployment_pause stopped them.
side_effects:
  - The rollout continues; new allocations are placed per the update stanza.
args:
  - name: deployment_id
    type: string
    required: true
    description: Deployment ID or prefix (from nomad.deployment_list).
    validation:
      pattern: "^[a-fA-F0-9][a-fA-F0-9\\-]{3,35}$"
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "deployment resume -detach", "{{ args.deployment_id }}"]
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Resume a paused rollout
    args:
      deployment_id: "abc12345"
