schema_version: 1
id: nomad.eval_list
title: nomad eval list
kind: script
risk: low
description: List all recent evaluations across the cluster.
side_effects: ["One API call.", "Read-only."]
args:
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "eval list -verbose"]
  timeout: 30s
output:
  parser: text
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Recent evals
    args: {}
  - title: Recent evals in the "prod" namespace
    args:
      namespace: "prod"
