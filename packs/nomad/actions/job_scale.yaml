schema_version: 1
id: nomad.job_scale
title: nomad job scale <id> <group> <count>
kind: script
risk: high
description: Adjust the count for one task group; 0 stops every allocation and takes the group's service down.
side_effects:
  - Scheduler creates or stops allocations to reach the target count.
  - Stopped allocations follow the kill_timeout / shutdown_delay stanzas.
search_terms:
  - scale up
  - scale down
  - more replicas
args:
  - name: job
    type: string
    required: true
    description: Job ID.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: group
    type: string
    required: true
    description: Task group.
    validation:
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127}$"
  - name: count
    type: integer
    required: true
    description: Target count.
    validation:
      min: 0
      max: 10000
  - name: namespace
    type: string
    required: false
    default: ""
    description: Nomad namespace to target. Empty (default) keeps the runner's ambient NOMAD_NAMESPACE or the default namespace.
    validation:
      pattern: "^([a-zA-Z0-9][a-zA-Z0-9_\\-]{0,127})?$"
execution:
  script:
    path: scripts/nomad_nsr.sh
    interpreter: /bin/sh
  argv: ["{{ args.namespace }}", "", "job scale", "{{ args.job }}", "{{ args.group }}", "{{ args.count }}"]
  timeout: 5m
output:
  parser: text
  max_stdout_bytes: 8192
  max_stderr_bytes: 8192
examples:
  - title: Scale api group to 10
    args:
      job: "api"
      group: "web"
      count: 10
