schema_version: 1
id: databricks.cluster_events
title: POST /clusters/events
kind: script
risk: low
description: >
  List one cluster's recent lifecycle events, newest first — starts,
  resizes, driver health, termination causes — the timeline for diagnosing
  why a cluster misbehaved. A read that the API happens to serve over POST.
side_effects:
  - One read-only HTTP POST to the Databricks workspace API; changes nothing.
  - Read-only.
search_terms:
  - cluster event log
  - cluster timeline
  - driver not responding
args:
  - name: cluster_id
    type: string
    required: true
    description: Cluster ID, from databricks.clusters_list.
    validation:
      pattern: "^[A-Za-z0-9-]{8,64}$"
      max_length: 64
  - name: page_size
    type: integer
    required: false
    default: 12
    description: Events per page.
    validation:
      min: 1
      max: 12
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque continuation token from the previous page.
    validation:
      max_length: 2048
execution:
  script:
    path: scripts/databricks.sh
    interpreter: /bin/bash
  argv: [cluster_events, "{{ args.cluster_id }}", "{{ args.page_size }}", "{{ args.page_cursor }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [events, next_page_cursor]
    properties:
      events:
        type: array
        maxItems: 12
        items:
          type: object
          additionalProperties: false
          required: [timestamp, type, user, reason_code, current_workers, target_workers]
          properties:
            timestamp: {type: [integer, "null"]}
            type: {type: string, maxLength: 48}
            user: {type: [string, "null"], maxLength: 40}
            reason_code: {type: [string, "null"], maxLength: 60}
            current_workers: {type: [integer, "null"]}
            target_workers: {type: [integer, "null"]}
      next_page_cursor: {type: [string, "null"], maxLength: 2048}
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Timeline of a flapping cluster
    args:
      cluster_id: 0811-104501-ab3cde45
