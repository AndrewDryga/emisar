schema_version: 1
id: databricks.job_run_get
title: GET /jobs/runs/get
kind: script
risk: low
description: >
  Show one job run's state and its per-task breakdown — which task failed,
  each task's own run_id, and how long each took. A failed task's run_id is
  what databricks.job_run_output takes for the error detail.
side_effects:
  - One read-only HTTP GET to the Databricks workspace API.
  - Read-only.
search_terms:
  - which task failed
  - job run status
  - task run ids
args:
  - name: run_id
    type: integer
    required: true
    description: Job run ID, from databricks.job_runs_list.
    validation:
      min: 1
      max: 9007199254740991
execution:
  script:
    path: scripts/databricks.sh
    interpreter: /bin/bash
  argv: [job_run_get, "{{ args.run_id }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [run]
    properties:
      run:
        type: object
        additionalProperties: false
        required:
          - run_id
          - job_id
          - run_name
          - state
          - result
          - message
          - start_time
          - end_time
          - duration_ms
          - tasks
          - tasks_omitted
        properties:
          run_id: {type: integer}
          job_id: {type: integer}
          run_name: {type: string, maxLength: 60}
          state: {type: string, maxLength: 24}
          result: {type: [string, "null"], maxLength: 40}
          message: {type: string, maxLength: 100}
          start_time: {type: [integer, "null"]}
          end_time: {type: [integer, "null"]}
          duration_ms: {type: [integer, "null"]}
          tasks:
            type: array
            maxItems: 10
            items:
              type: object
              additionalProperties: false
              required: [task_key, run_id, state, result, duration_ms]
              properties:
                task_key: {type: string, maxLength: 40}
                run_id: {type: [integer, "null"]}
                state: {type: string, maxLength: 24}
                result: {type: [string, "null"], maxLength: 40}
                duration_ms: {type: [integer, "null"]}
          tasks_omitted: {type: integer}
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Break a failed run down by task
    args:
      run_id: 738495610284753
