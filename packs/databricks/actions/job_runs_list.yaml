schema_version: 1
id: databricks.job_runs_list
title: GET /jobs/runs/list
kind: script
risk: low
description: >
  List recent job runs, newest first — the workspace-wide "what ran and what
  failed" view. Filter to one job with job_id, or to only active or only
  completed runs. Each run's result code says why it ended; dig into one run
  with databricks.job_run_get.
side_effects:
  - One read-only HTTP GET to the Databricks workspace API.
  - Read-only.
search_terms:
  - recent job runs
  - failed job runs
  - is the job still running
args:
  - name: job_id
    type: integer
    required: false
    default: 0
    description: Only this job's runs; 0 means runs from all jobs.
    validation:
      min: 0
      max: 9007199254740991
  - name: active_only
    type: boolean
    required: false
    default: false
    description: Only queued, pending, or running runs.
  - name: completed_only
    type: boolean
    required: false
    default: false
    description: Only finished runs.
  - name: page_size
    type: integer
    required: false
    default: 10
    description: Runs per page.
    validation:
      min: 1
      max: 10
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque continuation token from the previous page.
    validation:
      max_length: 2048
execution:
  script:
    path: scripts/databricks.sh
    interpreter: /bin/bash
  argv:
    - job_runs_list
    - "{{ args.job_id }}"
    - "{{ args.active_only }}"
    - "{{ args.completed_only }}"
    - "{{ args.page_size }}"
    - "{{ args.page_cursor }}"
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [runs, next_page_cursor]
    properties:
      runs:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [run_id, job_id, state, result, message, start_time, duration_ms]
          properties:
            run_id: {type: integer}
            job_id: {type: integer}
            state: {type: string, maxLength: 24}
            result: {type: [string, "null"], maxLength: 40}
            message: {type: string, maxLength: 60}
            start_time: {type: [integer, "null"]}
            duration_ms: {type: [integer, "null"]}
      next_page_cursor: {type: [string, "null"], maxLength: 2048}
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: What failed recently, workspace-wide
    args:
      completed_only: true
  - title: Runs of one job
    args:
      job_id: 947381205673284
