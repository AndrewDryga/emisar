schema_version: 1
id: databricks.tables_list
title: GET /unity-catalog/tables
kind: script
risk: low
description: >
  List the tables and views inside one Unity Catalog schema, with each one's
  type and storage format. Columns are deliberately omitted here — fetch one
  table's full shape with databricks.table_get.
side_effects:
  - One read-only HTTP GET to the Databricks workspace API.
  - Read-only.
search_terms:
  - list tables in schema
  - find delta table
args:
  - name: catalog
    type: string
    required: true
    description: Catalog name.
    validation:
      pattern: "^[A-Za-z0-9_]{1,255}$"
      max_length: 255
  - name: schema
    type: string
    required: true
    description: Schema name inside the catalog.
    validation:
      pattern: "^[A-Za-z0-9_]{1,255}$"
      max_length: 255
  - name: page_size
    type: integer
    required: false
    default: 10
    description: Tables per page.
    validation:
      min: 1
      max: 10
  - name: page_cursor
    type: string
    required: false
    default: ""
    description: Opaque continuation token from the previous page.
    validation:
      max_length: 2048
execution:
  script:
    path: scripts/databricks.sh
    interpreter: /bin/bash
  argv: [tables_list, "{{ args.catalog }}", "{{ args.schema }}", "{{ args.page_size }}", "{{ args.page_cursor }}"]
  timeout: 30s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [tables, next_page_cursor]
    properties:
      tables:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [name, table_type, data_source_format, comment, updated_at]
          properties:
            name: {type: string, maxLength: 60}
            table_type: {type: string, maxLength: 40}
            data_source_format: {type: [string, "null"], maxLength: 40}
            comment: {type: string, maxLength: 40}
            updated_at: {type: [integer, "null"]}
      next_page_cursor: {type: [string, "null"], maxLength: 2048}
  max_stdout_bytes: 262144
  max_stderr_bytes: 8192
examples:
  - title: Tables in analytics.gaming
    args:
      catalog: analytics
      schema: gaming
