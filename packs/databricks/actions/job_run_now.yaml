schema_version: 1
id: databricks.job_run_now
title: POST /jobs/run-now
kind: script
risk: high
description: >
  Trigger a run of an existing job now, optionally overriding its job-level
  parameters. This executes whatever the job's tasks are defined to do —
  including writes to production tables — so review the definition with
  databricks.job_get first. Returns the new run's ID and state; follow it
  with databricks.job_run_get.
side_effects:
  - Executes the job's workload — may read and write production data.
  - Starts or consumes job compute, which is billed.
  - The run continues after this action returns.
search_terms:
  - trigger job run
  - run workflow now
  - rerun the etl
args:
  - name: job_id
    type: integer
    required: true
    description: Job ID, from databricks.jobs_list.
    validation:
      min: 1
      max: 9007199254740991
  - name: job_params
    type: string_array
    required: false
    default: []
    description: >
      Job-level parameter overrides as name=value pairs, for parameters the
      job declares (see databricks.job_get).
    validation:
      max_items: 32
      max_length: 512
  - name: idempotency_key
    type: string
    required: false
    default: ""
    description: >
      Token guaranteeing exactly one launched run — a retry with the same
      token returns the existing run instead of launching another.
    validation:
      max_length: 64
execution:
  script:
    path: scripts/databricks.sh
    interpreter: /bin/bash
  argv:
    - job_run_now
    - "{{ args.job_id }}"
    - "{{ args.idempotency_key }}"
    - "{{ args.job_params }}"
  timeout: 60s
output:
  parser: json
  parser_required: true
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required: [run_id, job_id, state]
    properties:
      run_id: {type: integer}
      job_id: {type: integer}
      state: {type: string, maxLength: 24}
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Re-run the nightly ETL for one date
    args:
      job_id: 947381205673284
      job_params: ["run_date=2026-08-10"]
      idempotency_key: emisar-backfill-2026-08-10
