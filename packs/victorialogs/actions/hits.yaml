schema_version: 1
id: vl.hits
title: GET /select/logsql/hits
kind: script
risk: low
description: >
  Count log entries matching a LogsQL query, bucketed over time by step —
  the histogram behind "how many errors per hour?". The trailing window is
  limited to 24 hours and the window-to-step ratio to 10,081 buckets.
side_effects:
  - One read-only HTTP GET to the VictoriaLogs query API.
  - Read-only.
search_terms:
  - error rate
  - log volume
args:
  - name: window
    type: string
    required: false
    default: "1h"
    description: 'Trailing search window ending now, up to 24h.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdw]$'
  - name: query
    type: string
    required: true
    description: 'LogsQL query to count, e.g. error or level:error.'
    validation:
      pattern: '^[\s\S]{1,1000}$'
  - name: step
    type: string
    required: false
    default: "1h"
    description: 'Bucket granularity. Window / step may produce at most 10,081 buckets.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdw]$'
execution:
  script:
    path: scripts/vlget.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.window }}"
    - "{{ args.step }}"
    - "/select/logsql/hits"
    - "--data-urlencode"
    - "query={{ args.query }}"
    - "--data-urlencode"
    - "step={{ args.step }}"
  timeout: 60s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Errors per hour over the last day
    args:
      query: "error"
      window: "24h"
      step: "1h"
