schema_version: 1
id: vl.stats_query_range
title: GET /select/logsql/stats_query_range
kind: script
risk: low
description: >
  Show stats over logs across a time range — a LogsQL query containing a
  "| stats" pipe, evaluated at each step and returned in Prometheus
  range-query (matrix) format. The trailing window is limited to 24 hours and
  the window-to-step ratio to 10,081 evaluation timestamps.
side_effects:
  - One read-only HTTP GET to the VictoriaLogs query API.
  - Read-only.
args:
  - name: window
    type: string
    required: false
    default: "1h"
    description: 'Trailing search window ending now, up to 24h.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdw]$'
  - name: query
    type: string
    required: true
    description: 'LogsQL with a | stats pipe, e.g. * | stats count() logs.'
    validation:
      pattern: '^[\s\S]{1,1000}$'
  - name: step
    type: string
    required: false
    default: "1h"
    description: 'Interval between points. Window / step may produce at most 10,081 timestamps.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdw]$'
execution:
  script:
    path: scripts/vlget.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.window }}"
    - "{{ args.step }}"
    - "/select/logsql/stats_query_range"
    - "--data-urlencode"
    - "query={{ args.query }}"
    - "--data-urlencode"
    - "step={{ args.step }}"
  timeout: 120s
output:
  parser: json
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Hourly error count over 6h
    args:
      query: "error | stats count() errors"
      window: "6h"
      step: "1h"
