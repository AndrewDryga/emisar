schema_version: 1
id: vl.query
title: GET /select/logsql/query
kind: script
risk: low
description: >
  Run a LogsQL query and return matching log entries as newline-delimited
  JSON. Every request has a trailing window ending now, limited to 24 hours;
  the limit arg caps how many entries come back.
side_effects:
  - One read-only HTTP GET to the VictoriaLogs query API.
  - Read-only — never ingests or deletes logs.
search_terms:
  - log search
  - search logs
  - grep logs
args:
  - name: window
    type: string
    required: false
    default: "1h"
    description: 'Trailing search window ending now, up to 24h.'
    validation:
      pattern: '^[1-9][0-9]{0,4}[smhdw]$'
  - name: query
    type: string
    required: true
    description: 'LogsQL query, e.g. error, or {app="api"} | stats by (level) count().'
    validation:
      pattern: '^[\s\S]{1,1000}$'
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum number of log entries to return.
    validation:
      min: 1
      max: 10000
execution:
  script:
    path: scripts/vlget.sh
    interpreter: /bin/sh
  argv:
    - "{{ args.window }}"
    - "-"
    - "/select/logsql/query"
    - "--data-urlencode"
    - "query={{ args.query }}"
    - "--data-urlencode"
    - "limit={{ args.limit }}"
  timeout: 60s
output:
  parser: text
  max_stdout_bytes: 4194304
  max_stderr_bytes: 8192
examples:
  - title: Recent errors
    args:
      query: "error"
      window: "15m"
  - title: Errors for one app, newest first
    args:
      query: 'level:error app:api | sort by (_time) desc'
      window: "1h"
      limit: 50
