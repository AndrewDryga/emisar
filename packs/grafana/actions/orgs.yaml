schema_version: 1
id: grafana.orgs
title: GET /api/orgs
kind: script
risk: low
description: >
  List all orgs (multi-tenant view). Requires a Grafana server-admin token;
  an org-admin token gets 403 here (use grafana.users for the current org).
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - orgs
  timeout: 15s
output:
  parser: json
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Orgs
    args: {}
