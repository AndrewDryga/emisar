schema_version: 1
id: grafana.orgs
title: GET /api/orgs
kind: exec
risk: low
description: >
  List all orgs (multi-tenant view). Requires a Grafana server-admin token;
  an org-admin token gets 403 here (use grafana.users for the current org).
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ -n \"$GRAFANA_USER\" ]; then curl -fsS -u \"$GRAFANA_USER:$GRAFANA_PASSWORD\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/orgs\"; else curl -fsS -H \"Authorization: Bearer $GRAFANA_TOKEN\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/orgs\"; fi"
  timeout: 15s
output:
  parser: json
  max_stdout_bytes: 65536
  max_stderr_bytes: 8192
examples:
  - title: Orgs
    args: {}
