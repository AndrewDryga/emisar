schema_version: 1
id: grafana.version
title: Show Grafana build and license information
kind: script
risk: low
description: >
  Show build version, commit, edition and environment, plus license expiry,
  edition and state. Omit frontend settings, plugins, datasources and analytics
  fields. Fail on invalid JSON or a projection exceeding 8 KiB.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - version
  timeout: 15s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 131072
  max_stderr_bytes: 8192
examples:
  - title: Build info
    args: {}
