schema_version: 1
id: grafana.alerting_state
title: GET /api/alertmanager/grafana/api/v2/alerts
kind: script
risk: low
description: List currently-firing alerts known to Grafana's alertmanager.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - alerting-state
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Active alerts
    args: {}
