schema_version: 1
id: grafana.alerting_rules
title: List Grafana-managed rules
kind: script
risk: low
description: >
  List all accessible Grafana-managed alerting and recording rules with group,
  identity, labels, pause state, evaluation health and totals. Omit queries,
  annotations, alert instances and notification settings. Return the complete
  projection within a 256 KiB budget or fail without partial data.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - alerting-rules
  timeout: 30s
output:
  parser: json
  parser_required: true
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Rules
    args: {}
