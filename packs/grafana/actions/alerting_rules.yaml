schema_version: 1
id: grafana.alerting_rules
title: GET /api/prometheus/grafana/api/v1/rules
kind: exec
risk: low
description: List all Grafana-managed alert rules with last evaluation state.
side_effects: ["One API call.", "Read-only."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ -n \"$GRAFANA_USER\" ]; then curl -fsS -u \"$GRAFANA_USER:$GRAFANA_PASSWORD\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/prometheus/grafana/api/v1/rules\"; else curl -fsS -H \"Authorization: Bearer $GRAFANA_TOKEN\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/prometheus/grafana/api/v1/rules\"; fi"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: Rules
    args: {}
