schema_version: 1
id: grafana.datasource_health
title: GET /api/datasources/uid/<uid>/health
kind: script
risk: low
description: Check health of one datasource (tests connectivity).
side_effects: ["One API call that probes the downstream datasource.", "Read-only."]
search_terms:
  - datasource down
  - metrics missing
  - dashboards empty
  - no data
args:
  - name: uid
    type: string
    required: true
    description: Datasource UID.
    validation:
      pattern: "^[a-zA-Z0-9_\\-]{1,64}$"
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - datasource-health
    - "{{ args.uid }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Health
    args:
      uid: "PBFA97CFB590B2093"
