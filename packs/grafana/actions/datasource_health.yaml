schema_version: 1
id: grafana.datasource_health
title: GET /api/datasources/uid/<uid>/health
kind: exec
risk: low
description: Check health of one datasource (tests connectivity).
side_effects: ["One API call that probes the downstream datasource.", "Read-only."]
search_terms:
  - datasource down
  - metrics missing
  - dashboards empty
  - no data
args:
  - name: uid
    type: string
    required: true
    description: Datasource UID.
    validation:
      pattern: "^[a-zA-Z0-9_\\-]{1,64}$"
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ -n \"$GRAFANA_USER\" ]; then curl -fsS -u \"$GRAFANA_USER:$GRAFANA_PASSWORD\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/datasources/uid/${1}/health\"; else curl -fsS -H \"Authorization: Bearer $GRAFANA_TOKEN\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/datasources/uid/${1}/health\"; fi"
      - "emisar"
      - "{{ args.uid }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 16384
  max_stderr_bytes: 8192
examples:
  - title: Health
    args:
      uid: "PBFA97CFB590B2093"
