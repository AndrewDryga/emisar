schema_version: 1
id: grafana.settings
title: GET /api/admin/settings
kind: script
risk: low
description: >
  Show server settings (auth, smtp, database paths). Requires a Grafana
  server-admin token; an org-admin token gets 403 here.
side_effects: ["One API call.", "Read-only — credentials in output may be partially masked but rely on audit redaction."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - settings
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Settings
    args: {}
