schema_version: 1
id: grafana.settings
title: GET /api/admin/settings
kind: exec
risk: low
description: >
  Show server settings (auth, smtp, database paths). Requires a Grafana
  server-admin token; an org-admin token gets 403 here.
side_effects: ["One API call.", "Read-only — credentials in output may be partially masked but rely on audit redaction."]
args: []
execution:
  command:
    binary: /bin/sh
    argv:
      - "-c"
      - "if [ -n \"$GRAFANA_USER\" ]; then curl -fsS -u \"$GRAFANA_USER:$GRAFANA_PASSWORD\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/admin/settings\"; else curl -fsS -H \"Authorization: Bearer $GRAFANA_TOKEN\" \"${GRAFANA_URL:-http://127.0.0.1:3000}/api/admin/settings\"; fi"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Settings
    args: {}
