schema_version: 1
id: grafana.settings
title: GET /api/admin/settings
kind: script
risk: high
description: >
  Show server settings (auth, smtp, database paths). Requires a Grafana
  server-admin token; an org-admin token gets 403 here. Grafana masks the
  credentials it recognizes and returns the rest as configured, so treat the
  response as secret-bearing.
side_effects: ["One API call.", "Read-only, but the response carries whatever credentials Grafana did not mask."]
args: []
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - settings
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 524288
  max_stderr_bytes: 8192
examples:
  - title: Settings
    args: {}
