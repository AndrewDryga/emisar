schema_version: 1
id: grafana.dashboards_search
title: GET /api/search
kind: script
risk: low
description: Search dashboards (default returns all dashboards).
side_effects: ["One API call.", "Read-only."]
args:
  - name: query
    type: string
    required: false
    default: ""
    description: Search string.
    validation:
      pattern: "^[a-zA-Z0-9 _.\\-]{0,128}$"
execution:
  script:
    path: scripts/grafana_api.sh
    interpreter: /bin/sh
  argv:
    - dashboards-search
    - "{{ args.query }}"
  timeout: 30s
output:
  parser: json
  max_stdout_bytes: 1048576
  max_stderr_bytes: 8192
examples:
  - title: All dashboards
    args: {}
