services: [grafana, grafana-response]
versions:
  - version: "13.2.3"
    digest: "@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572"
    default: true
secret_env: [GRAFANA_PASSWORD]
env:
  GRAFANA_PASSWORD: packtest-canary-grafana-61df
  GRAFANA_URL: "http://grafana:3000"
  GRAFANA_USER: admin
defaults:
  expect:
    stdout_not_empty: true
    stderr_not_contains:
      - packtest-canary-grafana-unrequested-783c
      - packtest-canary-grafana-annotation-f80a
cases:
  - action: grafana.alerting_rules
    expect:
      json:
        /status: success
        /data/groups/0/name: packtest-rule-group
        /data/groups/0/file: packtest-alerts
        /data/groups/0/rules/0/uid: packtest-paused-rule
        /data/groups/0/rules/0/name: Packtest paused rule
        /data/groups/0/rules/0/type: alerting
        /data/groups/0/rules/0/isPaused: true
        /data/groups/0/rules/0/labels/team: platform
        /data/groups/0/rules/0/labels/environment: packtest
      stdout_not_contains:
        - '"query"'
        - '"annotations"'
        - '"alerts"'
        - packtest-canary-grafana-annotation-f80a
  - action: grafana.alerting_state
    expect:
      stdout_contains: ["[]"]
  - action: grafana.dashboards_search
    expect:
      stdout_contains: ["[]"]
  # Read against the provisioned datasource, not an empty list: the two fields
  # an operator can put a credential in — the URL's userinfo and a plugin's
  # jsonData value — only exist once a datasource does.
  - action: grafana.datasources
    expect:
      stdout_contains:
        - packtest-prometheus
        - prometheus.packtest.invalid:9090
        - packtestNote
      stdout_not_contains:
        - packtest-canary-grafana-dsurl-7c31
        - packtest-canary-grafana-jsondata-2e58
  - action: grafana.health
    expect:
      json:
        /database: ok
  - action: grafana.orgs
    expect:
      stdout_contains: [Main Org.]
  - action: grafana.settings
    expect:
      stdout_contains: [DEFAULT, app_mode]
  - action: grafana.users
    expect:
      stdout_contains: [admin]
  # datasources is the one capture site in this pack — it buffers the response
  # so jq cannot project a 401 into an empty array — so it has to print the
  # error body itself. The assertion is on Grafana's {"message": ...} envelope,
  # which every version emits; the wording inside it is not stable across them.
  #
  # The exclusion pins the other half: the body goes to stderr and not also to
  # stdout, which on a success carries safe_datasources' projection. stdout is
  # otherwise unchecked here, since stdout_not_empty is merged for successful
  # actions only. Same envelope key as the stderr needle, for the same reason.
  - name: grafana.datasources-prints-the-provider-error-body
    action: grafana.datasources
    env:
      GRAFANA_PASSWORD: packtest-canary-grafana-invalid-2e4a
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["curl: (22)", '"message"']
      stdout_not_contains: ['"message"']
  - name: grafana.users-invalid-credentials
    action: grafana.users
    env:
      GRAFANA_PASSWORD: packtest-canary-grafana-invalid-2e4a
    expect:
      status: failure
      exit: [22]
      reason_contains: [process exited with code 22]
      stderr_contains: ["401"]
  - action: grafana.version
    expect:
      json:
        /buildInfo/version: "13.2.3"
        /buildInfo/env: production
        /licenseInfo/edition: Open Source
        /licenseInfo/expiry: 0
      stdout_not_contains:
        - '"panels"'
        - '"apps"'
        - '"datasources"'
        - '"postHogToken"'
        - '"publicDashboardAccessToken"'
  - name: grafana.alerting_rules-ok
    action: grafana.alerting_rules
    env:
      GRAFANA_URL: http://grafana-response:8080
    arrange:
      - argv: [curl, -fsS, "http://grafana-response:8080/configure?mode=ok"]
    expect:
      stdout_not_contains: ["packtest-canary-grafana-unrequested-783c","\"query\"","\"annotations\"","\"alerts\"","\"notificationSettings\"","\"lastError\""]
      json:
        "/data/groups/0/name": "fixture-group"
        "/data/groups/0/rules/0/uid": "fixture-alert"
        "/data/groups/0/rules/0/health": "error"
        "/data/groups/0/rules/0/state": "firing"
        "/data/groups/0/rules/0/labels/summary": "Full label λ"
        "/data/groups/0/rules/0/labels/password": "[REDACTED]"
        "/data/groups/0/rules/0/totals/alerting": 2
        "/data/groups/0/rules/0/totals/error": 1
        "/data/groups/1/name": "second-group"
        "/data/groups/1/rules/0/uid": "fixture-recording"
        "/data/groups/1/rules/0/type": "recording"
        "/data/groups/1/rules/0/labels": {}
        "/data/groups/1/rules/0/totals": {}
        "/data/totals/firing": 1
        "/data/totals/error": 1
    probes:
      - argv: [curl, -fsS, http://grafana-response:8080/probe/state]
        expect:
          json:
            /requests/0/auth_ok: true
            /requests/0/path: /api/prometheus/grafana/api/v1/rules
            /requests/0/query/limit_alerts/0: "0"
