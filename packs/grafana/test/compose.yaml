services:
  grafana:
    image: grafana/grafana:${PACKTEST_VERSION:-13.1.1}${PACKTEST_DIGEST-}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: packtest-canary-grafana-61df
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 2s
      retries: 30
