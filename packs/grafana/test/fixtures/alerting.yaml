apiVersion: 1
groups:
  - orgId: 1
    name: packtest-rule-group
    folder: packtest-alerts
    interval: 60s
    rules:
      - uid: packtest-paused-rule
        title: Packtest paused rule
        condition: A
        data:
          - refId: A
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [3], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: 1==0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 60s
        annotations:
          summary: packtest-canary-grafana-annotation-f80a
        labels:
          team: platform
          environment: packtest
        isPaused: true
  # Fires on its first evaluation, so alerting_state has a live alert whose
  # annotations must stay on the host and whose label text must arrive whole.
  - orgId: 1
    name: packtest-state-group
    folder: packtest-alerts
    interval: 10s
    rules:
      - uid: packtest-firing-rule
        title: Packtest firing rule
        condition: A
        data:
          - refId: A
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: 1==1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: math
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: packtest-canary-grafana-firing-annotation-5b19
          description: packtest-canary-grafana-firing-annotation-5b19
        labels:
          team: platform
          note: 'Full label λ "quoted" {braces}'
