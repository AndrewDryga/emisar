apiVersion: 1
groups:
  - orgId: 1
    name: packtest-rule-group
    folder: packtest-alerts
    interval: 60s
    rules:
      - uid: packtest-paused-rule
        title: Packtest paused rule
        condition: A
        data:
          - refId: A
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [3], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: 1==0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 60s
        annotations:
          summary: packtest-canary-grafana-annotation-f80a
        labels:
          team: platform
          environment: packtest
        isPaused: true
