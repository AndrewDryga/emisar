schema_version: 1

id: grafana
name: Grafana
version: 0.1.14
# 0.1.13 and below shipped settings as low risk, so the admin-settings dump —
# which carries whatever credentials Grafana did not mask — auto-ran with no
# approval. A mislabelled tier that skipped the gate is a security fix.
retired_below: 0.1.14
description: >
  Grafana admin-API ops — datasource health, dashboard listings, alert
  state, user list, version, settings. Read-only. Auth via a bearer token
  or Basic credentials on the runner host.
vendor: emisar
homepage: https://github.com/andrewdryga/emisar

requires:
  os:
    - linux
  binaries:
    - curl

# Suggestion signal for `emisar pack suggest`: Grafana runs locally on its
# own process and port; the curl above is only how the read actions reach
# its HTTP API, so it can't be the detection signal.
detect:
  processes:
    - grafana-server
    - grafana

setup:
  summary: >
    Every action calls the Grafana HTTP API at $GRAFANA_URL via curl. Set
    $GRAFANA_TOKEN for bearer authentication, or $GRAFANA_USER and
    $GRAFANA_PASSWORD for Basic authentication. Basic credentials are required
    for server-admin endpoints such as orgs and settings.
  env:
    - name: GRAFANA_URL
      default: http://127.0.0.1:3000
      description: Grafana base URL (scheme + host + port, no trailing path). Defaults to a local Grafana.
      example: https://grafana.internal:3000
    - name: GRAFANA_TOKEN
      description: Service-account token or API key sent as the Bearer credential.
    - name: GRAFANA_USER
      description: Grafana user for Basic authentication. Takes precedence over GRAFANA_TOKEN.
      example: admin
    - name: GRAFANA_PASSWORD
      description: Password paired with GRAFANA_USER.
  notes:
    - "Any Grafana env var you set must also be allowlisted in the runner's execution.inherit_env — the action env is scrubbed to PATH/LANG/LC_ALL/TERM by default, so an env present on the host but not allowlisted is silently dropped (the action falls back to its local default or fails auth)."
    - "Create the token as a service account (Administration -> Service accounts) or a legacy API key; this pack is read-only, so a Viewer/Admin-read role is enough."
    - "Server-admin endpoints do not accept service-account tokens; use a Grafana server-admin user's Basic credentials for orgs and settings."
  verify: grafana.health

actions:
  - actions/health.yaml
  - actions/version.yaml
  - actions/datasources.yaml
  - actions/datasource_health.yaml
  - actions/dashboards_search.yaml
  - actions/alerting_state.yaml
  - actions/alerting_rules.yaml
  - actions/users.yaml
  - actions/orgs.yaml
  - actions/settings.yaml
