services:
  snmpd:
    build:
      context: ${EMISAR_ROOT}/packs/snmp/test/snmpd
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-13-slim}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-snmpd:${PACKTEST_VERSION:-13-slim}
    command: ["/usr/sbin/snmpd", "-f", "-Lo", "-C", "-c", "/etc/snmp/snmpd.conf"]
    environment:
      MIBS: ""
    volumes:
      - ${EMISAR_ROOT}/packs/snmp/test/fixtures/snmpd.conf:/etc/snmp/snmpd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "snmpget -v2c -c packtest-canary-snmp-community-b410 -On 127.0.0.1 1.3.6.1.2.1.1.5.0 >/dev/null 2>&1"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      timeout: 3s
      retries: 30

  snmpd-frr:
    build:
      context: ${EMISAR_ROOT}/packs/snmp/test/snmpd-frr
      args:
        PACKTEST_VERSION: ${PACKTEST_VERSION:-13-slim}
        PACKTEST_DIGEST: ${PACKTEST_DIGEST-}
    image: emisar-packtest-snmpd-frr:${PACKTEST_VERSION:-13-slim}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # The OSPF peer lives in its own network namespace, and creating one means
    # bind-mounting it under /var/run/netns. Docker's default AppArmor profile
    # denies that mount regardless of SYS_ADMIN, so this fixture works on a
    # Docker Desktop VM (no AppArmor) and fails on an Ubuntu host. Scoped to
    # this disposable SUT; the runner image it exercises is unaffected.
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "MIBS='' snmpbulkwalk -v2c -c packtest-canary-snmp-community-b410 -On 127.0.0.1 1.3.6.1.2.1.14.10 2>/dev/null | grep -q 192.168.99.2"]
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 30
