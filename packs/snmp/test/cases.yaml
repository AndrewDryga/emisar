services: [snmpd, snmpd-frr]
versions:
  - version: 13-slim
    digest: "@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
    default: true
risk_accountability:
  mode: complete
secret_env: [SNMP_COMMUNITY]
env:
  SNMP_ALLOWED_HOSTS: SNMPD,SNMPD-FRR
  SNMP_COMMUNITY: packtest-canary-snmp-community-b410
  SNMP_VERSION: "2c"
cases:
  - action: snmp.bgp_peers
    args:
      host: snmpd-frr
    expect:
      stdout_contains: [3.6.1.2.1.15.3, 10.0.0.2]
  - action: snmp.get
    args:
      host: snmpd
      oid: "1.3.6.1.2.1.1.5.0"
    expect:
      stdout_contains: [snmpd-sut]
  - action: snmp.interfaces
    args:
      host: snmpd
    expect:
      stdout_contains: [iso.3.6.1.2.1.2.2.1, lo]
  - action: snmp.ospf_general
    args:
      host: snmpd-frr
    expect:
      stdout_contains: [3.6.1.2.1.14.1, 10.0.0.1]
  - action: snmp.ospf_neighbors
    args:
      host: snmpd-frr
    expect:
      stdout_contains: [3.6.1.2.1.14.10, 192.168.99.2]
  - action: snmp.system
    args:
      host: snmpd
    expect:
      stdout_contains: [snmpd-sut, packtest]
  - action: snmp.walk
    args:
      host: snmpd
      oid: "1.3.6.1.2.1.1"
    expect:
      stdout_contains: [iso.3.6.1.2.1.1, snmpd-sut]

  - name: snmp.system-rejects-unlisted-host-before-client
    action: snmp.system
    args:
      host: blocked-target
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: [blocked-target, SNMP_ALLOWED_HOSTS]
      stderr_not_contains: [PACKTEST_CLIENT_INVOKED]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-snmp-client-invoked && echo snmp-client-not-invoked"]
        expect:
          stdout_contains: [snmp-client-not-invoked]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-snmp-client-invoked]

  - name: snmp.system-does-not-collapse-default-port
    action: snmp.system
    args:
      host: snmpd:161
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["snmpd:161", SNMP_ALLOWED_HOSTS]
      stderr_not_contains: [PACKTEST_CLIENT_INVOKED]
    probes:
      - argv: [/bin/sh, -c, "test ! -e /tmp/packtest-snmp-client-invoked && echo snmp-client-not-invoked"]
        expect:
          stdout_contains: [snmp-client-not-invoked]
    cleanup:
      - argv: [rm, -f, /tmp/packtest-snmp-client-invoked]
