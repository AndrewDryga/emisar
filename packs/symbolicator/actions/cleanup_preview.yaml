schema_version: 1
id: symbolicator.cleanup_preview
title: symbolicator cleanup --dry-run
kind: exec
risk: medium
description: >
  Preview Symbolicator's cache cleanup with its own dry-run mode. Expired
  cache entries remain in place, but the CLI can create missing cache
  directories and remove invalid or unreadable metadata sidecars. Progress is on stderr;
  older releases also report retained and removed bytes per cache. Use
  symbolicator.cache_usage for current cache sizes.
side_effects:
  - Walks the caches to evaluate their retention, which is disk-read heavy on a large cache.
  - Leaves expired cache entries in place.
  - Can create missing cache directories and remove invalid or unreadable metadata sidecars during the vendor's cache inspection.
args: []
execution:
  command:
    binary: /bin/sh
    # The configuration decides the cache root and every retention window, so
    # the flag is passed only when that file is actually there; without it the
    # binary's own defaults apply, which is what an unconfigured host runs.
    argv:
      - "-c"
      - >-
        config="${SYMBOLICATOR_CONFIG:-/etc/symbolicator/config.yml}";
        if [ -f "$config" ]; then exec symbolicator cleanup --dry-run -c "$config";
        else exec symbolicator cleanup --dry-run; fi
  timeout: 30m
output:
  parser: text
  max_stdout_bytes: 262144
  max_stderr_bytes: 262144
examples:
  - title: Preview the vendor's cache cleanup
    args: {}
