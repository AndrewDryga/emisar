services: [symbolicator]
# Both supported families use the official GHCR runtime. The client extracts
# that exact binary into the shared shell-capable image; the SUT stays non-root
# and distroless, with a static helper for the real HTTP readiness check.
versions:
  - version: "26.9.0"
    digest: "@sha256:f38cf17e84e1d6ae0571f326684fdc5f4e7d27fa6bc6c847f687fc51ea8beebc"
    default: true
  - version: "25.12.1"
    digest: "@sha256:6885a72b10e360c2eb6889be72c83c815f9f9c19a913bb2a578ccdf5d7e95139"
env:
  SYMBOLICATOR_URL: http://127.0.0.1:3021
  SYMBOLICATOR_CONFIG: /etc/symbolicator/config.yml
cases:
  # Resolve a crash against the symbols the service has. This SUT has no
  # sources configured, so the frame comes back "missing" — which still proves
  # the whole round trip: body built, request accepted, result returned.
  - action: symbolicator.symbolicate
    args:
      payload: '{"modules":[{"type":"pe","debug_id":"3249d99d-0c40-4931-8610-f4e4fb0b6936-1","code_file":"C:\\Windows\\System32\\kernel32.dll","image_addr":"0x749d0000","image_size":851968}],"stacktraces":[{"registers":{},"frames":[{"instruction_addr":"0x749e8630"}]}]}'
    expect:
      stdout_contains: ['"status":"completed"', '"instruction_addr":"0x749e8630"']
  # A caller that names its own symbol source is naming a URL this host would
  # then fetch. The action rebuilds the body from three keys, so the injected
  # source must not survive into the request — and the candidates the service
  # reports are the operator's, never the caller's.
  - name: symbolicator.symbolicate-drops-caller-sources
    action: symbolicator.symbolicate
    args:
      payload: '{"sources":[{"id":"packtest-injected-source","type":"http","url":"http://packtest-attacker.invalid/symbols/"}],"options":{"dif_candidates":true},"modules":[{"type":"pe","debug_id":"3249d99d-0c40-4931-8610-f4e4fb0b6936-1","code_file":"C:\\Windows\\System32\\kernel32.dll","image_addr":"0x749d0000","image_size":851968}],"stacktraces":[{"registers":{},"frames":[{"instruction_addr":"0x749e8630"}]}]}'
    expect:
      stdout_contains: ['"status":"completed"']
      stdout_not_contains: ["packtest-injected-source", "packtest-attacker.invalid"]
  - action: symbolicator.symbolicate_minidump
    args: {path: /var/tmp/packtest.dmp}
    expect:
      stdout_contains: ['"status":"completed"', '"os_name":"Windows"', '"cpu_arch":"x86_64"']
  - action: symbolicator.symbolicate_apple_crash
    args: {path: /var/tmp/packtest.crash}
    expect:
      stdout_contains: ['"status":"completed"', "EXC_BAD_ACCESS", '"device_model":"iPhone12,1"']
  - action: symbolicator.health
    expect:
      stdout_contains: ["ok"]
  - action: symbolicator.version
    expect:
      stdout_contains: ["symbolicator version", "git commit"]
  # An id the service never issued is the shape an operator hits when they
  # paste a stale one: Symbolicator answers 404, and --fail turns that into a
  # failed run rather than empty output that reads as "no result yet".
  - action: symbolicator.request_status
    args: {request_id: packtest-unknown-request, timeout_seconds: 0}
    expect:
      status: failure
      exit: [22]
      stderr_contains: ["404"]
  - action: symbolicator.cache_usage
    expect:
      stdout_contains: ["cache root: /data", "objects", "filesystem:"]
  - name: symbolicator.cache-usage-reports-a-genuinely-empty-cache
    action: symbolicator.cache_usage
    env:
      SYMBOLICATOR_CACHE_DIR: /tmp/packtest-empty-cache
    arrange:
      - argv: [/bin/sh, -c, "rm -rf /tmp/packtest-empty-cache && mkdir -m 0755 /tmp/packtest-empty-cache"]
    expect:
      stdout_contains: ["cache root: /tmp/packtest-empty-cache", "no caches present yet", "filesystem:"]
  - name: symbolicator.cache-usage-fails-on-an-unreadable-cache
    action: symbolicator.cache_usage
    env:
      SYMBOLICATOR_CACHE_DIR: /tmp/packtest-unreadable-cache
    arrange:
      - argv: [/bin/sh, -c, "rm -rf /tmp/packtest-unreadable-cache && mkdir -m 000 /tmp/packtest-unreadable-cache"]
    expect:
      status: failure
      exit: [1]
      reason_contains: [process exited with code 1]
      stderr_contains: ["cache directory /tmp/packtest-unreadable-cache is not readable"]
  # Arrange the retention ages per case, not at image-build time. The older
  # family reports byte totals; 26.9 reports progress instead. Both must retain
  # a fresh object, and only the real cleanup may remove an expired object.
  - action: symbolicator.cleanup_preview
    versions: ["25.12.1"]
    arrange:
      - argv: [/bin/sh, -c, "touch /data/objects/packtest/debug-file && printf expired > /data/objects/packtest/expired-file && touch -t 200001010000 /data/objects/packtest/expired-file"]
    expect:
      stderr_contains: ["dry_run=true", "cache=objects", "retained.bytes=4096"]
    probes:
      - name: the preview preserves fresh and expired cache entries
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && test -f /data/objects/packtest/expired-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  - action: symbolicator.cleanup
    versions: ["25.12.1"]
    arrange:
      - argv: [/bin/sh, -c, "touch /data/objects/packtest/debug-file && printf expired > /data/objects/packtest/expired-file && touch -t 200001010000 /data/objects/packtest/expired-file"]
    expect:
      stderr_contains: ["cache=objects", "retained.bytes=4096"]
      stderr_not_contains: ["dry_run=true"]
    probes:
      - name: cleanup removes only the expired cache entry
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && test ! -e /data/objects/packtest/expired-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  - name: symbolicator.cleanup-preview-with-progress
    action: symbolicator.cleanup_preview
    versions: ["26.9.0"]
    arrange:
      - argv: [/bin/sh, -c, "touch /data/objects/packtest/debug-file && printf expired > /data/objects/packtest/expired-file && touch -t 200001010000 /data/objects/packtest/expired-file"]
    expect:
      stderr_contains: ["dry_run=true", "cache=objects"]
    probes:
      - name: the preview preserves fresh and expired cache entries
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && test -f /data/objects/packtest/expired-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  - name: symbolicator.cleanup-with-progress
    action: symbolicator.cleanup
    versions: ["26.9.0"]
    arrange:
      - argv: [/bin/sh, -c, "touch /data/objects/packtest/debug-file && printf expired > /data/objects/packtest/expired-file && touch -t 200001010000 /data/objects/packtest/expired-file"]
    expect:
      stderr_contains: ["cache=objects"]
      stderr_not_contains: ["dry_run=true"]
    probes:
      - name: cleanup removes only the expired cache entry
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && test ! -e /data/objects/packtest/expired-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  # Vendor dry-run does not delete expired objects, but does repair metadata
  # and initialize cache directories. This is why its tier is medium.
  - name: symbolicator.cleanup-preview-repairs-cache-metadata
    action: symbolicator.cleanup_preview
    arrange:
      - argv: [/bin/sh, -c, "test ! -d /data/object_meta && touch /data/objects/packtest/debug-file && printf invalid-json > /data/objects/packtest/debug-file.metadata"]
    expect:
      stderr_contains: ["Failed to parse cache metadata file", "dry_run=true"]
    probes:
      - name: preview retains the object but removes invalid metadata and creates missing cache directories
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && test ! -e /data/objects/packtest/debug-file.metadata && test -d /data/object_meta && echo metadata-repaired"]
        expect:
          stdout_contains: ["metadata-repaired"]
  # The configuration is the one secret-bearing read in this pack. Its S3
  # credentials are declared canaries: the shape must come back, the values
  # must not.
  - action: symbolicator.config_show
    expect:
      stdout_contains: ["cache_dir: /data", "packtest-symbols", "[REDACTED]"]
      stdout_not_contains:
        - "packtest-canary-symbolicator-access-7c31"
        - "packtest-canary-symbolicator-secret-4de9"
