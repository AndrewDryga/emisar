services: [symbolicator]
versions:
  - version: "25.9.0"
    digest: "@sha256:ff16ec0110c73c0ce644f2a56f8e5ff6ed31adc9a3cf731788d425e1dc5f8ecb"
    default: true
risk_accountability:
  mode: complete
env:
  SYMBOLICATOR_URL: http://127.0.0.1:3021
  SYMBOLICATOR_CONFIG: /etc/symbolicator/config.yml
cases:
  # Resolve a crash against the symbols the service has. This SUT has no
  # sources configured, so the frame comes back "missing" — which still proves
  # the whole round trip: body built, request accepted, result returned.
  - action: symbolicator.symbolicate
    args:
      payload: '{"modules":[{"type":"pe","debug_id":"3249d99d-0c40-4931-8610-f4e4fb0b6936-1","code_file":"C:\\Windows\\System32\\kernel32.dll","image_addr":"0x749d0000","image_size":851968}],"stacktraces":[{"registers":{},"frames":[{"instruction_addr":"0x749e8630"}]}]}'
    expect:
      stdout_contains: ['"status":"completed"', '"instruction_addr":"0x749e8630"']
  # A caller that names its own symbol source is naming a URL this host would
  # then fetch. The action rebuilds the body from three keys, so the injected
  # source must not survive into the request — and the candidates the service
  # reports are the operator's, never the caller's.
  - name: symbolicator.symbolicate-drops-caller-sources
    action: symbolicator.symbolicate
    args:
      payload: '{"sources":[{"id":"packtest-injected-source","type":"http","url":"http://packtest-attacker.invalid/symbols/"}],"options":{"dif_candidates":true},"modules":[{"type":"pe","debug_id":"3249d99d-0c40-4931-8610-f4e4fb0b6936-1","code_file":"C:\\Windows\\System32\\kernel32.dll","image_addr":"0x749d0000","image_size":851968}],"stacktraces":[{"registers":{},"frames":[{"instruction_addr":"0x749e8630"}]}]}'
    expect:
      stdout_contains: ['"status":"completed"']
      stdout_not_contains: ["packtest-injected-source", "packtest-attacker.invalid"]
  - action: symbolicator.symbolicate_minidump
    args: {path: /var/tmp/packtest.dmp}
    expect:
      stdout_contains: ['"status":"completed"', '"os_name":"Windows"', '"cpu_arch":"x86_64"']
  - action: symbolicator.symbolicate_apple_crash
    args: {path: /var/tmp/packtest.crash}
    expect:
      stdout_contains: ['"status":"completed"', "EXC_BAD_ACCESS", '"device_model":"iPhone12,1"']
  - action: symbolicator.health
    expect:
      stdout_contains: ["ok"]
  - action: symbolicator.version
    expect:
      stdout_contains: ["symbolicator version", "git commit"]
  # An id the service never issued is the shape an operator hits when they
  # paste a stale one: Symbolicator answers 404, and --fail turns that into a
  # failed run rather than empty output that reads as "no result yet".
  - action: symbolicator.request_status
    args: {request_id: packtest-unknown-request, timeout_seconds: 0}
    expect:
      status: failure
      exit: [22]
      stderr_contains: ["404"]
  - action: symbolicator.cache_usage
    expect:
      stdout_contains: ["cache root: /data", "objects", "filesystem:"]
  # The seeded object is inside its retention window, so the preview reports it
  # retained and removes nothing — proving it reads the real caches and that a
  # preview never deletes.
  - action: symbolicator.cleanup_preview
    expect:
      stdout_contains: ["dry_run=true", "cache=objects", "retained.bytes=4096"]
    probes:
      - name: the preview left the cached object in place
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  - action: symbolicator.cleanup
    expect:
      stdout_contains: ["cache=objects", "retained.bytes=4096"]
      stdout_not_contains: ["dry_run=true"]
    probes:
      - name: an object inside its retention window survives the cleanup
        argv: [/bin/sh, -c, "test -f /data/objects/packtest/debug-file && echo retained"]
        expect:
          stdout_contains: ["retained"]
  # The configuration is the one secret-bearing read in this pack. Its S3
  # credentials are declared canaries: the shape must come back, the values
  # must not.
  - action: symbolicator.config_show
    expect:
      stdout_contains: ["cache_dir: /data", "packtest-symbols", "[REDACTED]"]
      stdout_not_contains:
        - "packtest-canary-symbolicator-access-7c31"
        - "packtest-canary-symbolicator-secret-4de9"
