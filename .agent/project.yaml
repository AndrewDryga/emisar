# Committed coop project configuration; see .gitignore for what else in .agent/ is committed.

# Monorepo members: coop aggregates each one's .agent/tasks queue automatically,
# so you never hand-maintain COOP_TASKS.
subprojects:
  - infra
  - mcp
  - packs
  - portal
  - runner

# Responder draft-PR publication revalidates the rebased candidate with this trusted parent gate.
# The gate selects every project affected since Coop's pinned review base.
gate: ./run gate review

# Publication review is CI-like: it needs PostgreSQL, not the developer Keycloak stack or ignored
# local TLS material. Coop starts this tracked stack for the disposable candidate only.
review:
  compose: dev/review-compose.yml
  env:
    CI: "1"
    DATABASE_URL: postgres://postgres:postgres@db/emisar_test

# One project box definition and one dependency stack serve both interactive
# agents and host-native development. Phoenix itself stays outside Compose so
# code reloads directly from the active workspace.
box:
  dockerfile: .agent/Dockerfile
  compose: dev/compose.yml
  env:
    PGHOST: db
    PGPORT: "5432"
    # Host and box share one Postgres, so they must not share one test database:
    # a loop audit gating in a box would otherwise run its suite and its
    # migrations against the one the host is using. test.exs appends this.
    MIX_TEST_PARTITION: box

# Ports a dev server in the box listens on — coop publishes each to a stable host
# port so you can open it in your browser (the portal already binds 0.0.0.0 in dev):
serve:
  ports: [4000, 9091]

# Compile only the project-specific instructions and descriptive KB cards relevant to the
# files in play. Root AGENTS.md remains canonical and is always included by
# coop context.
context:
  routes:
    - paths: [".agent/**", "run", "dev/**", "tools/internal/browser/**", "tools/internal/devtool/**", "docker-compose.yml"]
      include: [.agent/kb/coop-box-builds-are-isolated.md, .agent/kb/development-keycloak-certificates.md]
    - paths: [".github/**", "tools/internal/ci/**"]
      include: [.agent/kb/portal-image-delivery-follows-main.md]
    - paths: ["portal/**", "**/*.ex", "**/*.exs", "**/*.heex"]
      include: [portal/AGENTS.md]
    - paths: ["portal/**/oauth/**", "portal/**/*oauth*", "portal/**/sso/**", "portal/**/*sso*"]
      include: [.agent/kb/oauth-consent-form-action.md, .agent/kb/oauth-sign-in-return-to.md]
    - paths: ["runner/**"]
      include: [runner/AGENTS.md]
    - paths: ["mcp/**"]
      include: [mcp/AGENTS.md]
    - paths: ["packs/**"]
      include: [packs/AGENTS.md]
    - paths: ["infra/**"]
      include: [infra/AGENTS.md]
